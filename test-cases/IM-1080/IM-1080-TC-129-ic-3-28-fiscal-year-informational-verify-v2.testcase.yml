scenarios:
  - title: "AC1 · Operator supplies the fiscal year details as required inputs — the MANUAL Setup step parks for a required \"fiscal year start month\" select (12 calendar months) and a required \"fiscal year type\" select (Standard/Custom), the guide instructs Setup > Company Information > Fiscal Year, and nothing is hardcoded to a specific museum's fiscal year"
    tags:
      - ac-1
      - manual
      - manual-handoff
      - required-inputs
      - operator-input-token
      - im-1080
      - im-735
    given:
      - "el spec `ic-3-28-fiscal-year.json` v2 en merge `adcef7d2`"
    when:
      - "se parsea el step 1 y sus requiredInputs + guide"
    then:
      - "step 1 es MANUAL; parkea 2 requiredInputs select required: fiscalYearStartMonth (12 meses) y fiscalYearType (Standard/Custom)"
      - "la guide instruye setear el FY en Setup → Company Settings → Fiscal Year (elegir tipo, setear start month, save; warns que Custom es irreversible)"
      - "nada hardcodeado a un museo específico: usa los tokens {{fiscalYearStartMonth}} y {{fiscalYearType}}"

  - title: "AC2 · The read-back reports a MATCHING org without failing — when the org fiscal-year start month equals the operator-intended start month, the AUTOMATED T6 read-back reads Organization.FiscalYearStartMonth + UsesStartDateAsFiscalYearName, reports \"ATTEST OK\", and completes successfully"
    tags:
      - ac-2
      - t6-read-back
      - informational
      - attest-ok
      - happy-path
      - im-1080
    given:
      - "el step 2 (T6 anon apex) del spec v2 y un org cuyo start month == el intended"
    when:
      - "se lee el apex del step 2 y su rama match"
    then:
      - "lee Organization.FiscalYearStartMonth y UsesStartDateAsFiscalYearName (read-only)"
      - "matches = (intended != null && actual == intended); en match reporta 'ATTEST OK — the org fiscal year starts in <mes>, matching the intended start month'"
      - "el step COMPLETED exitosamente (dev-proven live CamiloDevOrg: org FY=1/January, intended January → ATTEST OK)"

  - title: "AC3 · The read-back NEVER false-fails on a MISMATCHED or not-yet-configured org — when the org start month does NOT equal the intended, it reports \"ATTEST NEEDED\" surfacing the org value vs the intended value, makes clear this is NOT a failure (Setup-UI-only, unwritable via API), and completes successfully rather than FAILED"
    tags:
      - ac-3
      - t6-read-back
      - never-false-fail
      - attest-needed
      - refusal-evidence
      - im-1080
    given:
      - "el step 2 y un org cuyo start month != el intended (o no configurado)"
    when:
      - "se lee el apex del step 2 y su rama mismatch"
    then:
      - "reporta 'ATTEST NEEDED — org fiscal year start = <actual> but operator intended <intended>' (WARN), surfaceando ambos valores"
      - "deja explícito que NO es un failure: FiscalYearStartMonth es Setup-UI-only y no se puede escribir vía API; si el org no está configurado, completar el Setup step y re-run para re-leer"
      - "el apex NO tiene throw en ninguna rama → el step SIEMPRE COMPLETED, nunca FAILED (dev-proven live: intended June sobre org=January → COMPLETED sin excepción)"

  - title: "AC4 · The read-back is resilient to a blank or unparseable intended month — when the operator-intended start month is blank or unparseable, it reports the intended value as \"(not provided / unparseable)\" and completes successfully without raising an exception"
    tags:
      - ac-4
      - t6-read-back
      - resilient-parse
      - edge-case
      - no-throw
      - im-1080
    given:
      - "el step 2 y un intended month blank o no parseable"
    when:
      - "se lee la lógica de parse del intended en el apex"
    then:
      - "el parse es best-effort: numeric 1-12, o full name / 3-letter abbrev (case-insensitive); blank/unparseable → intendedStart null (NUNCA throw)"
      - "reporta el intended como '(not provided / unparseable: <raw>)' y sigue leyendo el actual del org"
      - "el step COMPLETED sin excepción (dev-proven live: blank path ejecutado sin excepción)"

  - title: "Version lockstep + no write path + gates — case.version and template.version are both 2 (bumped in lockstep, asserted by a test); no step attempts to write Organization.FiscalYearStartMonth via any API (pure read + debug, no DML); jest (lockstep + no-throw regression + ic-seeds validity) / tsc --noEmit / eslint on touched files pass; #252 is spec-only (T6 reused, NOT genuinely-new)"
    tags:
