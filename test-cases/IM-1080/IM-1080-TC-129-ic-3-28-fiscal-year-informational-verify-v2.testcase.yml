key: "TC-129"
title: "IM-1080 IC 3.28 Fiscal Year Set Up (v1→v2, medium-confidence) — validate the guided HYBRID: 1 MANUAL Setup handoff (2 required select inputs, nothing hardcoded) + 1 AUTOMATED T6 INFORMATIONAL read-back that reports ATTEST OK/NEEDED and NEVER false-fails (FiscalYearStartMonth is Setup-UI-only, unwritable via API) · CODE PR spec-only (reused T6 anon apex)"
description: |
  Cobertura QA para IM-1080 (Historia, priority Medium/medium-confidence, epic IM-735 Implementation
  Cases Automation).
  QA Sub-task asociada: IM-1134 (creada 2026-07-27).

  Contexto:
  - Post-June IM-735 continuation, Batch D (decision & verify). Tier Medium — caveat: verify manual-dependent.
    `Organization.FiscalYearStartMonth` es Setup-UI-only (read-only vía API: describe updateable=false /
    createable=false, sin Metadata type). El auto-check pasa solo donde el FY del org ya coincide → por eso el
    read-back es INFORMACIONAL + attest, y NUNCA false-fail.
  - PR bajo prueba: `Veevarts/MigrationAppBackend#252` (**MERGED**).
    Branch: `task/ic-3-28-fiscal-year-IM-1080`. Merge commit `adcef7d2` (base `8d66dba6` = IM-1079 #251).
    2 files, +165/-10.
  - **CODE PR spec-only** — NO toca adapters/ops: reutiliza T6 (anon apex) para el read-back. El diff son 2 files:
    `ic-3-28-fiscal-year.json` (v1→v2) + el lockstep/no-throw regression `ic-3-28-fiscal-year.spec.ts` (108 líneas).

  IC 3.28 v2 (feasibility hybrid, 2 steps):
  - Step 1 (MANUAL): "Set the fiscal year in Setup". Parkea 2 requiredInputs select (nada hardcodeado):
    * `fiscalYearStartMonth` (select, 12 meses) — required.
    * `fiscalYearType` (select, Standard/Custom) — required.
    Guide: Setup → Company Settings → Fiscal Year; elegir tipo ({{fiscalYearType}}: Standard normal, o Custom SOLO
    si el cliente requiere periodos 4-4-5 — WARNING: habilitar Custom es irreversible); setear start month
    ({{fiscalYearStartMonth}}) + year-naming; Save. estimatedMinutes 6.
  - Step 2 (AUTOMATED T6 anon apex): "Report the fiscal year start month". READ-ONLY informational read-back —
    NUNCA escribe, NUNCA throw. Parsea el intended start ({{fiscalYearStartMonth}}: full name / 3-letter abbrev /
    1-12 number; blank/unparseable → null); lee Organization.FiscalYearStartMonth + UsesStartDateAsFiscalYearName;
    matches = (intended != null && actual == intended). matches → "ATTEST OK"; else → "ATTEST NEEDED" (WARN,
    surface org value vs intended, explícito "NOT a failure: Setup-UI-only, no API write path"). Sin throw → el step
    SIEMPRE COMPLETED, nunca FAILED.

  Estrategia de verificación:
  - **jest + tsc + eslint como evidencia PRIMARIA** (CODE PR spec-only): clone en merge `adcef7d2`, correr el
    `.spec.ts` de 3.28 (lockstep + no-throw regression) + gates; re-derivar el conteo del dev (jest 84).
  - **spec fidelity + apex read independiente**: parsear los 2 steps + LEER el apex del step 2 por cuenta propia
    (parse del intended, read-back de los fields read-only, ramas match/mismatch/blank, ausencia de throw/DML).
  - **op-reuse audit** (NO genuinely-new): confirmar que #252 NO toca adapters (2 files = spec + spec.ts); T6 ya existe.
  - **no-write proof**: confirmar por lectura del apex que NO hay DML (insert/update/upsert) sobre Organization; la
    única aparición de "FiscalYearStartMonth=" es la string de debug (concatenación de log), no un write.
  - **NO hay live IE run en este QA**: la verificación live fue CamiloDevOrg-only (org FY=1/January; el read-back Apex
    corrió vía executeAnonymous para match/mismatch/blank — todos COMPLETED sin excepción) y el v2 NO está seeded a
    MigrationApp-dev (seed PENDING, AWS SSO expirado). Live = dev-proven/PENDING-CREDS, no PASS/FAIL prematuro.

  Riesgos abiertos (del ticket):
  - **FiscalYearStartMonth Setup-UI-only**: el field es unwritable vía API → el step 1 queda MANUAL y el read-back es
    solo informacional. Por diseño, no un gap.
  - **Seed PENDING-CREDS**: v2 no seeded (append-only) → seed en cred refresh; bloquea re-correr via la app.
  - Verificado por el dev en CamiloDevOrg. QA re-verifica por código.

