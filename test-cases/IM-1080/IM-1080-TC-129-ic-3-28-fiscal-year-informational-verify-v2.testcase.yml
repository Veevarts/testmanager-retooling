    when:
      - "se corren tsc --noEmit, el `.spec.ts` de 3.28 y eslint; y se audita el diff de #252 + el apex"
    then:
      - "case.version=2 y template.version=2 (lockstep, asertado por el test); feasibility hybrid; 2 steps (1 manual + 1 auto)"
      - "no hay write path: el apex solo hace SELECT Organization + System.debug (sin insert/update/upsert/DML); la única 'FiscalYearStartMonth=' es la string de debug, no un write"
      - "el `.spec.ts` de 3.28 pasa (lockstep + no-throw regression + ic-seeds validity, dev: 84 tests); tsc --noEmit sin type errors; eslint limpio; op-reuse: #252 NO toca adapters (2 files = spec + spec.ts), T6 ya existe → NO genuinely-new"

