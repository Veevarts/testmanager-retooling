key: "TC-148"
title: "Long Island Children's Museum · Oct 2011 · TD Charitable Foundation duplicated FDA (rev-10059002) + Greater Long Island Running Club missing donation $25K (rev-10059094)"

description: |
  Cobertura QA para IM-1193 (Fund Assignments Duplicados rev-10059002 y Donation de $25K
  Faltante rev-10059094 — Oct 2011), del epic IM-70 Altru Queries. QA Sub-task: IM-1197.
  Cliente objetivo: Long Island Children's Museum (LICM). Fund:
  Total Contributions \ General Operating \ Corporation. Período: Octubre 2011.

  Dos problemas concretos, del mismo fund, del mismo mes:

  **Problema 1 (rev-10059002)** — La Opportunity "TD Charitable Foundation $5000 Donation
  10/21/2011" (SF Id 006Vw00000XN3YhIAL) tiene 2 Fund Donation Assignments SUCCEEDED con el
  mismo monto ($5,000) pero diferentes Implementation External IDs (FD-55184 y FD-55185).
  Ambos comparten el mismo Revenue ID de origen (rev-10059002) — evidencia de duplicado
  generado por la migración. El fix debe dejar EXACTAMENTE 1 FDA de $5,000 por rev-10059002.

  **Problema 2 (rev-10059094)** — Una donation de $25,000 del 10/18/2011 al mismo fund NO
  fue migrada:
    Constituent: Greater Long Island Running Club, Inc.
    Revenue reference: "Long Island Workplace Challenge"
    Payment method: Check #214
    Post status: Posted (activity pending) — Post date: 10/31/2011
    Recognition credits: CBIZ ($25,000.00)
  El fix debe hacer que esta revenue aparezca en Salesforce con Opportunity + payment +
  fund assignment + soft credit correspondientes.

  Riesgos abiertos (ver open-risks):
  · La descripción NO tiene ACs formales — inferidos del impacto documentado; cualquier
    ambigüedad se cierra con Camilo al momento de ejecutar.
  · No hay PR ligado en la descripción — hay que resolverlo en el executor (qa-test-executor).
  · Validación cuantitativa depende del safesql profile de LICM (no existe hoy en local:
    solo aspen / illinois_2 / tucson). Sin ese profile la ejecución queda parcialmente
    manual (aggregate contra staging o exportación de CSV).
  · Priority High + status "In QA Review" indican que dev claim que ya está listo.

