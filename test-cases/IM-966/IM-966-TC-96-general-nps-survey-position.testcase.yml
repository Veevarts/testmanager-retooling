  - "PASO 0b (crear la General de prueba) — creá una General nueva: **`General NPS survey`** marcado, bloque **`To whom are you sending this survey?`** → **`To an organization / museum`** con `computing-power-944-dev-ed` seleccionada, bloque **`General survey trigger`** → **`Show through existing feature triggers`**, delay por antigüedad de usuario en 0, y **`Active (shown to respondents)`** marcado. 📸 `00-trigger-feature-mode.png`"
  - "PASO 0c (respondent limpio) — si ese usuario ya respondió o descartó la survey antes, no va a volver a aparecer. Reseteá su estado con `DELETE /api/admin/features/<featureId>/respondent-state/<respondentId>` usando la cookie de admin del browser ya logueado."
  - "PASO 0d — abrí DevTools en la pestaña **Network** ANTES de disparar nada, si no perdés las peticiones."
  when:
  - "1. Entrá al scratch org de Auctifera (`computing-power-944-dev-ed`). Abrí un Rental Event y navegá a `/lightning/cmp/Auctifera__AddManageResourcesToRentalEvent?Auctifera__recordID=<id del rental event>`. 📸 `01-pre-quicksave.png` con el botón **Quick Save** visible."
  - "2. Hacé click en **Quick Save**. Esperá a que aparezca el modal de la encuesta."
  - "3. 📸 `02-modal-general-survey.png` con el modal abierto."
  - "4. En DevTools → Network buscá la llamada a `/api/features/.../surveys`. 📸 `03-devtools-eligibility.png` mostrando la respuesta."
  - "5. Ubicá la URL del iframe del modal (en el mismo Network, o inspeccionando el elemento `<iframe>`). 📸 `04-iframe-url.png`"
  - "6. Respondé la encuesta y enviala. 📸 `05-post-submit.png`"
  - "7. Volvé al admin del survey-tool, entrá a **Dashboard**, y buscá la respuesta recién enviada. 📸 `06-response-attributed.png`"
  then:
  - "PASO 3 — el modal muestra el título de la **General Survey**, NO dice `Rentals`. Ese es el corazón del AC4: había una survey de Rentals elegible y aun así ganó la general."
  - "PASO 4 — la respuesta del eligibility trae la General (`isGeneralSurvey: true`) y el `clientOrgId` de la org. Si en cambio devuelve la de Rentals, revisá primero que el PASO 0 haya quedado guardado en *feature triggers*."
  - "PASO 5 — la URL del iframe lleva **ambos** parámetros: `surveyId=<id de la general>` y `userCreatedDate=<fecha>`. Si falta cualquiera de los dos el modal diría `No active survey for this subject`."
  - "PASO 6 — la encuesta se envía sin error. Un 400 acá sería el bug que #33 arregló (el `userCreatedDate` no viajaba en el submit); si pasa, capturá la respuesta del POST — es defecto."
  - "PASO 7 — la respuesta figura asociada a la **General Survey**, no a la de Rentals. Eso cierra el AC6."
  - "PASO 8 (limpieza, obligatorio) — borrá la General de prueba (`DELETE /api/admin/surveys/<id>`, arrastra en cascada la respuesta enviada) y dejá constancia del estado final: total de surveys, generales que quedan y 0 respuestas de QA. La id 17 se restaura a su estado previo salvo que el dueño del entorno diga otra cosa."
  - "Dejá los screenshots y el detalle en `attachments/tr-146-tc-96/scenario-10/`. Si el scratch org ya expiró (vence **2026-07-31**), el escenario queda `not-run` con esa razón — nunca se marca PASS sin evidencia."
