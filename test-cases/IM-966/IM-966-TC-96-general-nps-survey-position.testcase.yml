  given:
  - "la scratch org `vnfp_pkg` (alias local `vnfp-pkg`, expira 2026-08-14) — la condición (b) que TR-097 declaró como desbloqueo"
  - "verificado por query que el widget del namespace está desplegado: `vnfp__NpsWidgetController`, `vnfp__npsWidget`, `vnfp__SurveyWidgetTrigger`"
  - la General Survey configurada en `surveytool.dev.veevart.ai` con un scope que incluya la organización de esa org
  when:
  - se ejecutan desde esa org los escenarios de scoping, prioridad, fallback y atribución de la respuesta
  then:
  - "usando la identidad REAL de esa org (`User.Id` como `respondentId` y `User.CreatedDate` como `userCreatedDate`, leídos de la propia org, nunca inventados), la General acotada a esa organización se entrega desde sus subjects — igual que en Auctifera"
  - "**control negativo de aislamiento**: el MISMO `respondentId` con el `clientOrgId` de Auctifera NO recibe la General acotada a `vnfp`, sino la feature survey. Es la contracara del AC2 ejecutada entre dos orgs reales"
  - la respuesta enviada con el contexto de `vnfp` queda atribuida a la General Survey, con `clientOrgId` y `respondentId` de esa org preservados
  - "**límite declarado**: si el paquete `vnfp` no expone en esa org un componente de *feature trigger* equivalente a `Auctifera__AddManageResourcesToRentalEvent`, el render del modal dentro de `vnfp` NO se puede disparar y así se documenta — el escenario cubre el contrato de backend, no el render. El launcher after-login de `vnfp` NO sirve como sustituto: es IM-1099, fuera de alcance"
  - "si al verificar resulta que el widget `vnfp` NO está desplegado en esa org, el escenario vuelve a `blocked` — pero con esa razón concreta y verificada, no con la de TR-097"
