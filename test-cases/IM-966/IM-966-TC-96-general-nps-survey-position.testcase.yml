  then:
  - actualizar este scenario con el trigger específico (login vs App home vs otro)
  - re-ejecutar AC2 contra el trigger definido y capturar screenshot de la Lightning page donde dispara
  - documentar el trigger point en el runbook del widget para futuros dev-ops
