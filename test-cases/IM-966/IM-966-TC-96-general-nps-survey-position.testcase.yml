title: IM-966 v2 — General NPS survey scoping, priority and conflict prevention (survey-tool org audience + response attribution + AuctiferaDX widget contract)
description: |
  **v2 — RE-REVIEW.** Cobertura QA de IM-966 (Add general NPS survey position), bajo el epic
  IM-970 NPS Survey Tool delivery. QA Sub-task asociada: IM-1006.

  ## Por qué existe una v2

  La historia YA pasó por QA una vez: **TC-96 v1 → TR-097 (2026-07-03, 12/13 PASS, 1 blocked)**
  → `Request Approved`. El **2026-07-16** David la reabrió (Request Approved → Not started →
  In Progress → Under Code Review) y el **2026-07-29** **reescribió la descripción**: los ACs
  pasaron de 4 genéricos a **7 específicos**, con territorio funcional nuevo que la v1 no cubría.

  Lo que la v1 YA validó y sigue vigente: prioridad general-antes-que-feature, fallback,
  supresión por respuesta previa y por max dismissals, contrato del iframe URL, delay por
  `User.CreatedDate`, endpoint de reset admin.
  Lo que es **NUEVO** en los ACs y NO estaba en la v1:
  - **AC2/AC3 — scoping por organización** (`audience=organization` multi-org y `audience=everyone`),
    con validación de que la organización esté **activa**.
  - **AC6 — atribución de la respuesta**: la respuesta se guarda contra la General Survey
    preservando el contexto del trigger original.
  - **AC7 — prevención de conflicto**: la API impide guardar dos General Surveys activas cuyos
    scopes se solapen.

  ## PRs bajo prueba (los tres MERGEADOS, no los de la v1)

  La v1 validó survey-tool #25 + #27 + #28. El alcance nuevo vive en:

  | AC | PR |
  | --- | --- |
  | AC1, AC2, AC3, AC4, AC5, AC7 | **survey-tool #29** `fix/survey-general-frequency-ux` (merged 2026-07-15) — 7 files, `apiBoundary.test.ts` +589 |
  | AC6 | **survey-tool #33** `fix/general-survey-submit-user-created-date-IM-1099` (merged 2026-07-17) |
  | AC4, AC5, AC6 (lado widget) | **AuctiferaDX #2525** `fix/nps-widget-render-selected-survey-IM-966` (merged 2026-07-16) |

  AuctiferaDX **#2473** (`fix: pass selected survey to NPS widget IM-966`) quedó **CLOSED**,
  superseded por #2525.

  **Fuera de alcance (es IM-1099, no IM-966):** el trigger *after-login* — survey-tool #32 y
  AuctiferaDX #2527 / #2536. El AC6 de IM-966 dice explícitamente *"when it was opened from a
  feature trigger"*, no desde login.

  ## Mecánica confirmada en el código de #29

  - `validation.ts`: se **eliminó** el refine que exigía `generalClientOrgId` en toda general
    survey → habilita la configuración independiente del AC1.
  - `features.ts`: `surveyAllowsClientOrg()` resuelve el scope — legacy `generalClientOrgId`
    (match exacto, compat hacia atrás) → `audience=everyone` (true) → `audience=organization`
    (la lista de tokens contiene el clientOrgId) → si no, false.
  - `features.ts`: `isActiveClientOrg()` consulta `organizations` por `subdomain` + `active=true`;
    `surveyRuntime.ts` devuelve `reason: "general_client_org_inactive"` cuando no lo está.
  - `features.ts`: para una general **global** (sin `generalClientOrgId`), el estado del respondent
    —responses, impressions, dismissals— se cuenta **por `clientOrgId`**: el mismo respondent en
    otra organización arranca con estado limpio.
  - `responses.ts`: el submit exige `clientOrgId` (400), valida que la org esté activa cuando la
    survey es global (400 *"clientOrgId does not match an active organization"*) y **re-evalúa la
    eligibility al momento de guardar** vía `getSurveyEligibilityVerdict`.
  - `surveys.ts`: `generalSurveyScope()` + `scopesOverlap()` + `findActiveGeneralSurveyConflict()`
    → **409** si dos general activas se solapan (global↔global, global↔org, org↔org con org común);
    **400** si el scope es inválido (`audience=organization` sin ninguna org, o audience distinto de
    everyone/organization).

  ## Entorno

  - `https://surveytool.dev.veevart.ai` — admin y endpoint público del survey-tool.
  - **Scratch org Auctifera `nps_2`** (alias local `auctifera-nps2`) — para el widget de AuctiferaDX
    y el trigger Rentals Quick Save (`Auctifera__AddManageResourcesToRentalEvent`).
    **Expira 2026-07-31.** Verificado: su instancia es
    `computing-power-944-dev-ed.scratch.my.salesforce.com`, es decir **la MISMA org que usó TR-097**
    — no había expirado. Su build de Auctifera es source local (no package instalado) con
    `Auctifera__npsWidget` modificado el **2026-07-21** y `Auctifera__NpsWidgetController` el
    **2026-07-22**, ambos posteriores al merge de #2525 (2026-07-16) ⇒ **incluye el PR bajo prueba**.
  - **Scratch org NFPFundraising `vnfp_pkg`** (alias local `vnfp-pkg`) — para el cross-test del
    namespace `vnfp`. **Expira 2026-08-14.** Verificado: tiene `vnfp__NpsWidgetController`,
    `vnfp__npsWidget`, `vnfp__SurveyWidgetTrigger` y `vnfp__npsAfterLoginLauncher` (creados
    2026-07-16 / 2026-07-21), más **Auctifera 8.309.0.2** como package instalado.
  - Credenciales de ambas orgs: fuera de este artefacto y fuera de Jira, por política. Se manejan
    solo en la sesión de ejecución.

  ## Riesgos abiertos

  - **⏳ La org de Auctifera expira el 2026-07-31.** Los escenarios AC4, AC5, AC6 (lado widget) y la
    evidencia funcional UI dependen de ella y hay que ejecutarlos ANTES de esa fecha. Si expira
    primero, quedan `not-run` con hand-off explícito, nunca fingidos como PASS.
  - **La versión de Auctifera de la org `vnfp_pkg` (8.309.0.2) es un package instalado de fecha
    2026-07-16**, el mismo día en que #2525 mergeó a las 21:27 UTC — no está confirmado que lo
    incluya. Por eso los escenarios del widget Auctifera se ejecutan en `auctifera-nps2`, cuyo build
    sí es posterior, y la org `vnfp_pkg` se usa solo para el cross-test del namespace `vnfp`.
  - **Los tres PRs están mergeados**: no hay pre-fix vs post-fix por checkout de branch abierta —
    el baseline es el commit anterior a cada merge, y el revert-proof se hace revirtiendo los
    archivos a ese punto.
  - **⚠️ TOPOLOGÍA DE RAMAS — riesgo de release.** #29 / #33 / #34 **NO mergearon a `main`**:
    mergearon a `epic/nps-survey-delivery-and-metrics`. `main` sigue en **`737a62b6`** (#28), que
    es exactamente el estado que ya validó TR-097 y que además **es el commit base de #29** — o sea
    `main` no se movió desde la v1. El deploy de `surveytool.dev.veevart.ai` corre la rama épica
    (comprobado: `GET /api/surveys/general/eligible` responde 200 y esa ruta no existe en `main`).
    Consecuencia: **lo que QA valida acá está en la épica, no en `main`**; el merge de la épica a
    `main` es un paso de release todavía pendiente y fuera del control de este test case.
  - **AC2/AC3 necesitan al menos 2 organizations en el survey-tool** (una activa y otra inactiva, o
    dos activas distintas) para probar scoping y el caso `general_client_org_inactive`. El entorno de
    TR-097 solo tenía `computing-power-944-dev-ed` → hay que crear las orgs de prueba o dejar esos
    asserts en el nivel de suite (`apiBoundary.test.ts`).
  - **Estado per-org del respondent**: es un cambio de semántica silencioso frente a la v1 — el mismo
    respondentId puede volver a ver la general en otra org. Si el producto NO lo quiere así, es un
    defecto de diseño a levantar, no un PASS.
  - **NFPFundraising: el cross-test queda DESBLOQUEADO y verificado en esta v2.** En TR-097 quedó
    `blocked` porque el widget NPS vivía en la branch `origin/story/nps-surveys-implementation-for-REN-394`
    y no había scratch org. Ya existe la scratch `vnfp_pkg` y **se confirmó por query que el widget
    del namespace `vnfp` está desplegado** (`vnfp__NpsWidgetController`, `vnfp__npsWidget`,
    `vnfp__SurveyWidgetTrigger`). El escenario pasa de bloqueado a ejecutable.
