schemaVersion: '1.0'
id: 568bef96-cec4-47a1-bc50-21c0a9f5cdbc
key: TC-96
title: IM-966 — Add general (non-feature) NPS survey position (survey-tool + widget, Rentals Quick Save trigger)
description: |
  Cobertura QA de IM-966 (Add general NPS survey position), bajo el epic IM-970
  NPS Survey Tool delivery. Extiende el modelo de surveys product-feature-scoped
  a un survey NPS **general** no atado a ninguna feature, que se sirve
  piggybacking desde los triggers de Salesforce existentes cuando la eligibility
  del general placement lo permite.

  Contexto pinneado (per QA-NPS-Survey-Tool.md):
  - Env dev: `https://surveytool.dev.veevart.ai`
  - Client org id: `computing-power-944-dev-ed` (scratch org validada)
  - Trigger validado: **Rentals Quick Save** (mismo path que TC-78 runtime)
  - Placement general se evalúa ANTES que el feature-specific
  - Delay del general usa Salesforce `User.CreatedDate`

  Config concreta esperada del general survey:
    Subject / Feature: General Veevart NPS
    Feature slug: general-veevart
    Type: NPS
    Active: true
    General survey: true
    Client org: computing-power-944-dev-ed
    Show after User.CreatedDate: 0 days
    Max dismissals: 1
    Audience: everyone
    Trigger: No trigger

  Eligibility response shape esperada cuando el general es eligible:
    {
      "isGeneralSurvey": true,
      "generalClientOrgId": "computing-power-944-dev-ed",
      "accountCreatedDelayDays": 0
    }

  Iframe URL contract cuando eligibility retorna el general desde un trigger
  de Rentals:
    /survey/rentals?surveyId=<generalSurveyId>&clientOrgId=<org>&respondentId=<user>&userCreatedDate=<date>

  Repos en scope:
  - `survey-tool` — admin flow + public endpoint del general placement
  - `AuctiferaDX` — widget integration del trigger Rentals (validado)
  - `NFPFundraising` — namespace `vnfp`, widget NPS pendiente en branch
    `origin/story/nps-surveys-implementation-for-REN-394` (no en `main`)

  Validar:
  1) admin puede crear + activar general NPS independiente de product-specific,
  2) con general active + delay elapsed + no prior response/dismissal, Rentals
     Quick Save muestra modal con título "General Survey" (no "Rentals"),
  3) fallback a Rentals con título "Rentals" cuando: general inactive / delay
     not elapsed / already answered / max dismissals reached / general exhausted,
  4) coexistencia no regresa product-specific behavior (39/39 boundary tests),
  5) missing userCreatedDate → general no evaluable,
  6) iframe URL preserva surveyId + userCreatedDate (si falta cualquiera, modal
     dice "No active survey for this subject"),
  7) admin reset route disponible para QA state management,
  8) implementación construida sobre dynamic placement model (no slug hardcoded),
  9) NFPFundraising cross-test blocked hasta unblock via beta/scratch/source deploy.

  QA Sub-task asociada: IM-1006
  Riesgos abiertos:
  - Dynamic placement dependency: si el dev metió slug hardcoded como fallback,
    es deuda técnica — validar approach en PR review.
  - NFPFundraising widget NPS está en branch pending, no en `main` — cross-test
    blocked hasta beta package, scratch preparado, o source deploy autorizado.
  - Priority rule 8 (missing userCreatedDate) es data-quality issue: si el
    Salesforce trigger no envía User.CreatedDate, el general no funcionará
    aunque esté activo — validar el trigger context antes de exigir el AC.
type: integration
priority: medium
status: active
preconditions:
- Build de `survey-tool` con IM-966 desplegado en `surveytool.dev.veevart.ai`
- Widget AuctiferaDX enganchado al Rentals Quick Save trigger (validado en TR-087)
- Admin user del survey-tool con Google `@veevart.com` (Cognito Hosted UI)
- Organization creada en survey-tool con `clientOrgId = computing-power-944-dev-ed`
- Product-specific Rentals survey activo (fixture reutilizado de TC-78) — slug `rentals`, NPS, active
- General Veevart NPS survey configurable (slug `general-veevart`, general=true, activable/desactivable durante los scenarios)
- Browser con DevTools (Network + Console) — inspección de eligibility payload y iframe URL
- Cliente HTTP (curl) para hits directos al public endpoint sin cookies
- Acceso al admin reset endpoint `DELETE /api/admin/features/:featureId/respondent-state/:respondentId` para reset entre scenarios
format: gherkin
