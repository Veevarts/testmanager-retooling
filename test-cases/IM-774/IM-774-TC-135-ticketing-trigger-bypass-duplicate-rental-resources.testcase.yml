schemaVersion: "1.0"

id: "cbb3b5af-30fd-49ae-a7d6-2d1759945279"
key: "TC-135"
title: "Las cuatro queries de ticketing emiten Auctifera__Technical_Bypass_Triggers__c = 'true' en cada fila para que ReservationTriggerHandler no auto-cree un Rental Resource sin Implementation External ID, y Confirmed_Date_Time__c se toma de RESERVATION.STARTDATETIME normalizado a UTC en vez del reloj de la corrida (Tucson 8-11410182)"
description: |
  Cobertura QA para IM-774 (**Error**, priority **High**, severity **1 - Business Stopping**, environment
  **Production**, epic IM-70 Altru Queries). QA Sub-task asociada: IM-1141 (creada 2026-07-29).

  Contexto (defecto reportado):
  - Durante la migración de Rentals/Groups se crean **Rental Resources duplicados**: el mismo ticket resource
    aparece dos veces para un solo Rental Event/Group, partiendo/duplicando el monto total. El ticket documenta
    el caso de **un solo resource con monto correcto $120** que termina como dos registros.
  - **Ejemplo concreto (regression evidence)**: account **Tucson**, ID **8-11410182**. En Salesforce quedaron dos
    Rental Resources para el mismo Ticketing/Rental Event: **R-1230** (`a2iVz000002RaTZIA0`, **sin**
    Implementation External ID, creado 2026-04-08 12:38:56 UTC) y **R-1597** (`a2iVz000002zUG9IAM`, **con**
    external ID, creado 2026-05-28 15:35:42 UTC). El ticket **R-0044** (`a1vVz00000T35KvIAJ`) se creó
    2026-04-08 12:38:54 UTC, **dos segundos antes** que R-1230.
  - 7 screenshots adjuntos al ticket como evidencia (Sara Montenegro / veevart_josed).
  - **PR bajo prueba: `Veevarts/MigrationToolETL#160`** (**OPEN**, branch `bug/ticketing-trigger-bypass-IM-774`
    → main, head `4a441524`). 13 files +1202/-7: 4 `.sql` de ticketing + mapper + entity + descriptor builder
    + 3 specs nuevos + docs/openspec.

  Root cause (confirmado en el análisis del ticket y en el PR):
  - Cargar una fila de Ticketing con Rental Event dispara `GroupReservation_Trg` →
    `ReservationTriggerHandler.afterInsert()` → `RentalEventManageResources.createRentalItemsForTicket()`, que
    **auto-crea** un `Auctifera__Rental_Resources__c` **sin** `Implementation_External_ID__c`.
  - El Rental Resource migrado (external id = el id de Ticketing/SalesOrder, del CTE `AggregatedTicketRentalResources`
    de IM-462) **no tiene sobre qué hacer upsert** → coexisten los dos registros. El duplicado NO lo genera el SQL:
    el análisis previo verificó que `rental_resource.sql` emite **una sola** línea para 8-11410182 y 0 grupos de
    external-id duplicados en high-desert / muhammed2 / tucson / everson / kidstream.

  El fix (del PR):
  - Las 4 queries de ticketing (`ticketing_only_event.sql`, `ticketing_only_program.sql`,
    `ticketing_direct_registrant.sql` y el combinado legacy `ticketing.sql` en **ambas ramas del UNION ALL**)
    emiten dos columnas nuevas: **`Auctifera__Technical_Bypass_Triggers__c`** (literal string `'true'`, en **todas**
    las filas, nunca detrás de un CASE) y **`Auctifera__Confirmed_Date_Time__c`**.
  - `Confirmed_Date_Time__c` lo estampaba `ReservationTriggerHandler.beforeInsert` con `Datetime.now()` (la fecha de
    la corrida de migración, no la histórica). Al bypassear el trigger se pierde, así que ahora se calcula en la
    query desde **`RESERVATION.STARTDATETIME`** con
    `CONVERT(NVARCHAR(40), (r.STARTDATETIME AT TIME ZONE @timeZone) AT TIME ZONE 'UTC', 127)` — el mismo idiom que
    ya usan `rental_resource.sql:22` y `rental_events_groups.sql:66`.
  - Wiring TS: `ticketing.mapper.ts` (`parseNullableBoolean` + `parseNullableDate`, que **no** cae a `now()`),
    `ticketing-record.entity.ts` (getters + `confirmedDateTimeIso`) y `ticketing-csv-descriptor.builder.ts`
    (**header Y row key**, porque `fast-csv-writer.adapter.ts` filtra estrictamente por `headers`).

  Estrategia de verificación (para /qa-test-executor):
  - **Regression specs (evidencia PRIMARIA)**: `ticketing-trigger-bypass-query.spec.ts` (nuevo, guards de contrato
    sobre el texto SQL: literal `'true'`, nunca `1`, nunca `END AS ...` condicional, paridad de columnas del par del
    `TicketingEventExtractor`, simetría de las 2 ramas del UNION ALL, `NVARCHAR(40)`, nunca `GETDATE()/SYSDATETIME()`,
    nunca desde `ARRIVALDATE`, y el pin de que el CASE de status **no** tiene rama `THEN 'Confirmed'`),
    `ticketing.mapper.spec.ts` y `ticketing-csv-descriptor.builder.spec.ts`. Dev: query-regression **393** pass,
    suites de ticketing **86** pass. QA re-corre + **revert-proof** (revertir los `.sql`/TS a base ⇒ los specs deben FALLAR).
  - **safesql `tucson` (source-side, aggregate-only)**: cobertura de `RESERVATION.STARTDATETIME` en las reservas
    Confirmed con ticket (el PR reporta 27/27, y date/time component == `ARRIVALDATE`/`ARRIVALTIME` 27/27), cuántas
    filas de ticketing llevan Rental Event (las candidatas al duplicado) y que ninguna fila Confirmed quede sin fecha.
  - **Target-side**: el A/B de 64 filas reales de Tucson en `CamiloDevOrg` es evidencia **del dev**; QA re-verifica lo
    que sí es alcanzable — presencia del campo `Auctifera__Technical_Bypass_Triggers__c` en
    `Auctifera__Group_Reservation__c` (preflight de versión) en los orgs con alias autenticado.

  Riesgos abiertos:
  - **Prerrequisito de versión por org**: el campo `Auctifera__Technical_Bypass_Triggers__c` sale de **PP-1438**
    (AuctiferaDX#2465, merged) y existe desde **Auctifera ≥ 8.317.0.2**; los orgs cliente estaban en **8.254–8.291**.
    Una columna desconocida **falla el Bulk job completo**, no fila por fila → sin el preflight esto rompe la carga.
  - **Prerrequisito por usuario**: `Auctifera__Bypass_POS_Transaction_Lock__c = true` en el usuario que carga. El
    bypass cubre **solo Apex**; una automatización no-Apex sigue actualizando el POS Purchase padre y
    `POSPurchaseTriggerHandler.cls:225` la rechaza — en la prueba del dev **13 de 64 filas** fallaron y se llevaron el batch.
  - **`CamiloDevOrg` NO está autenticado localmente** (`sf org list`: hammer/illinois/maloof/veevartd/…), así que el
    A/B de 64 filas no se puede re-ejecutar tal cual; se re-verifica por specs + safesql + describe del campo.
  - **`@timeZone` hardcodeado a `'Eastern Standard Time'`** en las 3 queries (limitación **heredada**, no introducida):
    para un museo fuera de US Eastern la **fecha** queda bien pero la **hora** queda corrida. Documentado en `proposal.md`.
  - **Acoplamiento documentado**: la rama Confirmed evalúa el `so.STATUS` **crudo**, mientras `Auctifera__Status__c` es
    el valor mapeado. Coinciden solo porque ninguna rama del CASE produce `'Confirmed'` (sobrevive por el `ELSE`).
    Agregar un `THEN 'Confirmed'` exportaría las filas Confirmed con fecha en blanco en 3 archivos a la vez.
  - **Fuera de alcance (declarado)**: remediar los duplicados **ya existentes** en orgs migrados (queda **manual**,
    per ticket); `Auctifera__Source__c` seleccionado por las 4 queries y descartado por el descriptor;
    `1 AS Auctifera__Disable_Trigger__c` en `rental_resource.sql:114/:177` y las 4 queries de ticket-item (mismo
    hazard del bare `1`, ticket de follow-up); el `ELSE so.STATUS` que emite `'Finalized'`, valor **inválido** del
    picklist `Auctifera__Status__c` (159 órdenes en Tucson).
  - **`donation-transaction-recurring.spec.ts` falla con y sin el cambio** (error de conexión a SQL Server):
    preexistente y ambiental, no atribuible al PR — QA debe confirmarlo en ambos lados.
  - **PR OPEN (no merged)** → el POST-fix es el head del branch, no `main`.
  - Datos de cliente read-only: safesql (bastion, keychain) — credenciales y datos row-level nunca en el chat/artefactos.

