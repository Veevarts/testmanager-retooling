key: TC-139
title: IM-1148 — Opportunity Payments date contract — every UNION ALL branch projects a SQL date instead of a datetime, npe01__Payment_Date__c is never blank, and the write-off branch keeps its own settlement date instead of being overwritten by the installment date
description: |
  Cobertura QA de IM-1148 (**Opportunity Payments — Schedule Date con Formato de Hora Incorrecto y
  Payment Date con Registros en Blanco**), bajo el epic **IM-70 Altru Queries**. QA Sub-task
  asociada: **IM-1163**. Cuenta nombrada en el ticket: **Long Island Children's Museum**.
  Prioridad de la historia: **Crítica**.

  ## Qué pide la historia

  Dos problemas en el query de **Opportunity Payments**:

  1. **Schedule Date con formato de hora incorrecto** — el campo `Schedule Date` (mandatorio) trae
     todos sus registros con valores de hora, por ejemplo `0:00`, en lugar de una fecha. Hay que
     revisar si ese formato está generando un error en la migración, ya que al ser mandatorio
     podría bloquear la carga completa del objeto.
  2. **Payment Date con registros en blanco** — hay registros sin valor. Hay que revisar cuáles
     están afectados y por qué, porque impacta la validación financiera y los reportes de pagos.

  ## ⚠️ La historia NO trae Acceptance Criteria formales

  La descripción son dos problemas en prosa y dos *action needed*. **No hay ACs numerados, ni ids
  de registro concretos, ni conteos esperados.** No se rechaza porque el comportamiento SÍ es
  inferible y está descrito, pero **los criterios que se validan acá los derivó QA** leyendo la
  descripción y el diff del PR. Dev/PM deberían confirmarlos o corregirlos.

  Criterios derivados (a confirmar):
  1. `npe01__Scheduled_Date__c` sale como fecha pura, sin componente de hora, en TODAS las branches.
  2. `npe01__Payment_Date__c` no queda en blanco en ningún registro emitido.
  3. Cerrar el blanco NO puede destruir fechas de settlement que sí existen.
  4. El universo de filas migradas no cambia por el arreglo.

  ## PR bajo prueba

  **MigrationToolETL [#162](https://github.com/Veevarts/MigrationToolETL/pull/162)** —
  `fix(opportunity-payment): emit pure dates and never blank the payment date IM-1148`,
  rama `fix/opportunity-payment-dates-IM-1148` → base `main`. **Estado: OPEN** (+308/−6, 5 archivos).

  | Archivo | Rol en el cambio |
  | --- | --- |
  | `queries/opportunity-payment/opportunity_payments.sql` | los `CAST(... AS DATE)` y la regla de fallback en las 3 branches |
  | `query-regression/pledge-payment-query.spec.ts` | **3 asserts nuevos** que lockean el contrato de fechas |
  | `query-regression/pledge-unpaid-charge-query.integration.spec.ts` | **nuevo**, protege la asimetría deliberada del lado Charge |
  | `query-regression/query-chain-verifier.ts` | 2 líneas de soporte |
  | `docs/altru-model-context.md` | documenta la regla de tipos y la nueva semántica |

  ## Lo que realmente hace el cambio (leído del diff, no del body del PR)

  **Problema 1 — la causa es precedencia de tipos, no formato.** `INSTALLMENT.DATE` está declarado
  `datetime` en Altru; `FINANCIALTRANSACTION.CALCULATEDDATE` ya es `date`. Al proyectar
  `INSTALLMENT.DATE` sin cast dentro de un `UNION ALL`, SQL Server resuelve **toda la columna de
  salida** a `datetime` por precedencia — por eso el `0:00` apareció solo en Schedule Date. El fix
  agrega `CAST(... AS DATE)` en las tres branches.

  **Problema 2 — el dato original NO estaba roto.** Los 102 blancos eran todos installments
  *unpaid*: Altru simplemente no guarda fecha de pago para una cuota abierta. **Producto decidió**
  que el campo lleve la fecha programada en vez de quedar vacío. La regla queda uniforme:

  > `npe01__Payment_Date__c` = la fecha de settlement real, o la fecha programada cuando no existe
  > una fecha real.

  | Branch | Filas (Long Island) | Expresión emitida |
  | --- | --- | --- |
  | Paid | 1.201 | `COALESCE(pa.PaymentDate, CAST(pa.InstallmentDate AS DATE))` |
  | Write-off | 51 | `COALESCE(wo.WriteOffDate, CAST(wo.InstallmentDate AS DATE))` |
  | Unpaid | 102 | `CAST(ins.InstallmentDate AS DATE)` |

  Tres decisiones de diseño que hay que verificar, no dar por buenas:

  1. **El disparador del fallback es la fecha faltante, NO `npe01__Paid__c = 0`.** Los write-offs
     llevan `npe01__Paid__c = 0` pero SÍ tienen fecha real de posteo. Si el fallback se hubiera
     anclado en el flag, habría sobrescrito 51 fechas genuinas — en Long Island esas fechas están
     1–2 años después de la cuota que liquidan (programada `2009-09-04` → write-off `2011-07-05`).
  2. **El cast va DENTRO del `COALESCE`, no afuera.** `CALCULATEDDATE` es `date` e `InstallmentDate`
     es `datetime`; un cast externo dejaría que `datetime` gane precedencia primero y reventaría
     con fechas anteriores a 1753.
  3. **La branch unpaid lee la MISMA expresión** (`ins.InstallmentDate`) para su scheduled date y
     su payment date, para que las dos columnas no puedan divergir.

  ## Cambio de semántica que hay que comunicar

  Un `npe01__Payment_Date__c` poblado **ya no implica que el dinero se cobró**. `npe01__Paid__c` es
  el único marcador. El lado Charge mantiene la convención OPUESTA a propósito:
  `pledge_payments_unpaid_charges.sql` sigue emitiendo `Auctifera__Tech_Payment_Date__c` en NULL
  para las mismas cuotas, para que su fórmula `Auctifera__Payment_Date__c` quede vacía.

  ## Riesgos abiertos

  - **La historia no trae ACs formales** — el mapeo criterio ↔ escenario lo derivó QA del PR.
  - **El propio dev NO pudo re-verificar la reconciliación post-cambio.** El túnel safesql a Long
    Island dejó de levantar (`Failed to connect to 127.0.0.1:41434 in 20000ms`, cuatro intentos).
    Confirmar que los 102 blancos bajan a 0 quedó pendiente y es exactamente el escenario 4 — puede
    quedar bloqueado por acceso.
  - **Cambio de semántica decidido por producto**: hay que confirmar que Implementations y quien
    construya reportes financieros saben que payment date poblado ≠ cobrado.
  - **Hallazgo fuera de alcance reportado por el dev, NO arreglado acá**: tres headers CSV que este
    pipeline emite no existen en los objetos target en ninguna org revisada
    (`Implementation_External_ID__c` → `vnfp__Implementation_External_ID__c`,
    `Revenue_ID_legacy__c` → `vnfp__Revenue_ID_Legacy__c`,
    `npsp__Do_Not_Automatically_Create_Payments__c` → `npe01__Do_Not_Automatically_Create_Payment__c`).
    El tercero es el preocupante: si el nombre nunca matchea, el flag nunca aterriza y NPSP
    auto-crea un payment por cada pledge Opportunity. **Necesita ticket propio.**
  - **PR OPEN contra `main`, no mergeado.** Nada de esto está entregado todavía.
  - Las cifras del PR (386 tests, 1.354 filas, 1.201/51/102, 1.192/1.192 a medianoche) son del dev:
    **se re-derivan, no se toman por buenas.**
