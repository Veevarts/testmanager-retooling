- 'Node instalado; la suite de contrato es `npm test -- --runInBand query-regression` y NO requiere Docker: los 20 tests nuevos son asserts sobre el texto de los dos archivos SQL'
- 'Docker/colima disponible para `npm run test:queries:docker` (15 tests de integración nuevos). Si el runtime no levanta, se declara ambiental y esos tests quedan sin correr — no se marcan como pasados'
