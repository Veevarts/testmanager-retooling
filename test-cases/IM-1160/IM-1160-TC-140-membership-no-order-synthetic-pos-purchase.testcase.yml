key: TC-140
title: IM-1160 — Membership POS Purchase for orderless memberships — a synthetic purchase is minted per membership Opportunity that resolves no SALESORDER, both SQL files derive the identical key, the two queries partition the space instead of overlapping, and every COALESCE/UNION ALL branch stays CAST to NVARCHAR
description: |
  Cobertura QA de IM-1160 (**Mint POS Purchases for membership Opportunities with no sales
  order**), bajo el epic **IM-70 Altru Queries**. QA Sub-task asociada: **IM-1164**. Cuenta
  nombrada en el ticket: **Long Island Children's Museum** — con el alcance explícito de que
  *afecta a todos los tenants Altru*. Prioridad de la historia: **Medium**.

  ## Qué pide la historia

  Las Opportunities de membresía exportaban `vnfp__POS_Purchase__c` **vacío** cada vez que Altru
  no tenía un `SALESORDER` para la membresía. Altru solo registra sales order para membresías
  vendidas por el módulo Daily Sales / POS, así que el hueco cubre:

  - membresías cargadas en back office — cheques por correo, batch gift entry, comps
  - **toda** membresía anterior a que el tenant adoptara POS

  El ticket documenta que esto es un **hueco de política, no un bug de linkage**: no hay sales
  order alcanzable por *ninguna* transacción financiera candidata para esas filas, verificado en
  Long Island, Tucson y High Desert. El primer `SALESORDER` de Long Island aparece en **2011**;
  **49.865 de sus 49.900** membresías orderless con monto distinto de cero son anteriores a 2012.
  Las 35 restantes son back office: 22 sin orden del mismo día, 8 con orden del mismo día por una
  compra no relacionada, y 5 con orden del mismo día sobre la misma membresía **ya poseída por una
  transacción hermana** (enlazarla mis-parentearía la Opportunity).

  El monto **no** es el discriminador — un cheque de $65 por correo no tiene sales order por la
  misma razón que un comp de $0. El canal de venta sí lo es.

  La solución replica el patrón que ya usan los pledges en `sales_order_only_pledge.sql`: mintear
  un POS Purchase sintético anclado en la transacción financiera cuando no hay linkage de orden.

  ## Acceptance Criteria del ticket (6, formales)

  1. `sales_order_only_membership2.sql` emite un POS Purchase por Opportunity de membresía que no
     resuelve sales order, con llave `membership-no-order-pos-<opportunity external id>`.
  2. `membership_transactions.sql` construye la llave idéntica como rama final del `COALESCE` de
     `vnfp__POS_Purchase__c`.
  3. Sin solape con `sales_order_only_membership.sql`, y sin llaves duplicadas.
  4. El nuevo objeto de migración queda cableado punta a punta (enum, specification, pipeline,
     extractor, registry, module) para que los POS Purchases referenciados se exporten de verdad.
  5. Cada rama del `COALESCE` y la rama order-backed del `UNION ALL` van `CAST` a `NVARCHAR` — el
     trap IM-770 de AGENTS.md.
  6. La cobertura de regresión prueba que la guarda de cast es load-bearing y que el contrato de
     grano se sostiene.

  ## PR bajo prueba

  **MigrationToolETL [#163](https://github.com/Veevarts/MigrationToolETL/pull/163)** —
  `feat(queries): mint POS Purchases for memberships without a sales order IM-1160`,
  rama `feat/pos-purchase-membership-no-order-IM-1160` → base `main`.
  **Estado: OPEN** (+1457/−5, 14 archivos).

  | Archivo | Rol en el cambio |
  | --- | --- |
  | `queries/pos-purchase/sales_order_only_membership2.sql` | **nuevo** — mintea el POS Purchase sintético |
  | `queries/opportunity-membership/membership_transactions.sql` | 4a rama del `COALESCE` + los `CAST` en ambas ramas del `UNION ALL` |
  | `pos-purchase-membership-no-order.{pipeline,specification,extractor}.ts` | **nuevos** — el objeto de migración |
  | `migration-object.enum.ts`, `extractor.registry.ts`, `data-migration.module.ts` | cableado |
  | `package.json` | registra el spec nuevo en `test:queries:docker` |
  | `query-regression/pos-purchase-membership-no-order-query.spec.ts` | **nuevo**, 20 tests de contrato |
  | `query-regression/pos-purchase-membership-no-order-query.integration.spec.ts` | **nuevo**, 15 tests dockerizados |
  | `query-regression/membership-program-linkage-query-fixture.ts` | fixture **compartido** modificado |
  | `README.md`, `docs/altru-model-context.md` | documentan el contrato de dos archivos |

  ## Lo que realmente hace el cambio (leído del diff, no del body del PR)

  **La llave sintética** se deriva igual en los dos archivos:

  ```sql
  CONCAT('membership-no-order-pos-',
         CAST(COALESCE(rgi.RecurringInstallmentID, mt.ID) AS NVARCHAR(36)))
  ```

  Es el **grano de external id de la propia Opportunity**, prefijado. El prefijo garantiza que la
  llave nunca colisione con un `SALESORDER.ID` real (un `uniqueidentifier`) y deja las filas
  sintéticas filtrables en la org target.

  **La partición** la impone un solo predicado en la query nueva:

  ```sql
  AND COALESCE(so.ID, revenue_so.ID, payment_so.ID) IS NULL
  ```

  Es decir, la query nueva es el **complemento exacto** de `sales_order_only_membership.sql`:
  todos los demás `sales_order_only_*.sql` exigen un `SALESORDER` resuelto; esta exige su ausencia.
  El grano lo cierra `WHERE om.PurchaseRank = 1` sobre un `ROW_NUMBER()` particionado por la
  expresión de external id de la Opportunity.

  **La guarda de tipos** es lo más frágil del cambio. `uniqueidentifier` gana precedencia sobre
  `nvarchar` en SQL Server, así que basta **una** rama sin castear —en el `COALESCE` o en el
  `UNION ALL`— para que la llave string sintética se coaccione de vuelta y la query **reviente a
  mitad de stream** en la primera fila orderless. Por eso el PR también castea la rama order-backed
  (`CAST(obm.SalesOrderID AS NVARCHAR(100))`), que por sí sola no necesitaría fallback.

  **`Auctifera__Status__c` es derivado**, no un `'Sold'` plano (esto entró en el segundo commit,
  tras la review): fully refunded → `Refunded`; installment `STATUSCODE` 0 → `Pending`, 2 → `Sold`,
  1/3/4 → `Canceled`; sin installment → `Sold`. La intención es que un purchase sintético nunca
  declare una venta completada que la Opportunity contradice.

  ## Riesgos abiertos

  - **Volumen — es el riesgo dominante.** Esto mintea placeholders para ventas que nunca ocurrieron
    en una caja registradora: ~51.500 (Long Island), ~79.300 (Tucson), ~131.000 (High Desert) según
    el ticket. Es deliberado y está documentado, pero **es la primera vez que se inyectan cientos
    de miles de registros sintéticos a la org target por este pipeline**.
  - **⚠️ Las cifras del ticket y las del PR NO coinciden.** El ticket dice Tucson **79.288** y High
    Desert **~131.000**; el PR body dice Tucson **79.327** y High Desert **139.382**. Son ~39 y
    ~8.400 filas de diferencia. Puede ser drift de fecha entre mediciones (ticket 2026-07-30, PR
    2026-07-31), pero **no se asume**: se re-deriva o se declara sin verificar. Ninguna cifra del
    PR se toma por buena.
  - **`fund_assignment_memberships.sql` queda desalineado a propósito** — el propio ticket lo deja
    como *follow-up to decide*: seguirá resolviendo solo sales orders reales, así que su
    `vnfp__Opportunity_POS_Purchase__c` quedará NULL mientras la Opportunity carga un POS Purchase
    sintético. No es referencia colgante, pero los dos se contradicen. **Decisión de producto
    pendiente**, no defecto — pero hay que medir a cuántas filas afecta.
  - **El spec de integración nuevo (15 tests) probablemente NO corre localmente.** Está detrás de
    `RUN_DOCKER_SQL_QUERY_TESTS=1` y en la sesión previa de este repo la suite dockerizada falló
    entera por incompatibilidad testcontainers/colima (`Log stream ended and message /.*Started.*/
    was not received`) — ambiental, no del PR. Si vuelve a pasar, se declara explícitamente y no se
    marca como pasado.
  - **Fixture compartido modificado** — `membership-program-linkage-query-fixture.ts` lo consume
    también `membership-program-linkage-query.integration.spec.ts`. Radio de impacto a medir.
  - **Timeout sin margen, reportado por el propio dev**: en Long Island la query corre en ~75s
    contra un `requestTimeout` de 120s (`sql-server.adapter.ts:99`). High Desert corre en ~40s con
    2,7x las filas, así que es un problema de plan de Long Island (el CTE compartido
    `ResolvedMembershipFinancialTransactions` une por un `OR` que mata el index seek), no un
    acantilado de volumen. No lo introduce este PR, pero el margen es delgado.
  - **PR OPEN contra `main`, no mergeado.** Nada de esto está entregado todavía.
  - Las cifras del PR (20 + 15 tests, 393 query-regression, 78 docker, 1:1 en tres tenants,
    checksums de High Desert) son del dev: **se re-derivan, no se toman por buenas.**
