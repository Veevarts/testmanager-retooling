schemaVersion: "1.0"

id: "68888956-4d8e-4556-a759-6c0f4e8733cc"
key: "TC-168"
title: "Delivery diagnostics ships behind a disabled feature flag: the route and navigation entry are unreachable and no new API surface is left exposed — IM-1253"
description: |
  Test case para IM-1253 (Historia, priority **Medium**) — epic IM-970 NPS Survey Tool
  delivery — QA Sub-task IM-1269. Repositorio: `survey-tool`. PR bajo prueba: "PR 71"
  (MERGED a `develop` el 2026-09-11). Cubre solo la porcion de IM-1253.

  === ALCANCE REAL DE ESTE TEST CASE ===

  El propio PR declara: "Delivery Diagnostics code remains present, but its tab and route are
  disabled through APP_FEATURE_FLAGS.diagnostics". La funcionalidad viaja APAGADA a proposito.

  El flag es una constante compilada en client/src/config/featureFlags.ts, no una variable de
  entorno, asi que NO se puede encender en el entorno desplegado sin un rebuild. En
  consecuencia, la funcionalidad de diagnostico en si NO es verificable en esta entrega y seria
  deshonesto declararla probada.

  Lo que QA si puede y debe validar hoy es que el apagado sea EFECTIVO: que la ruta no sea
  alcanzable, que no haya entrada en la navegacion, y —lo mas importante desde el punto de
  vista de seguridad— que el gating del cliente no deje ningun endpoint del servidor expuesto
  sin proteccion.
type: functional
priority: medium
status: active

preconditions:
  - "Entorno de Survey Tool con `develop` desplegado y credenciales de administrador."
  - "Clone del repo en el merge commit del PR 71, para inspeccionar el valor del flag y las rutas montadas en el servidor."
  - "Capacidad de navegar directamente a la ruta de diagnosticos, no solo a traves de la navegacion."
format: gherkin
scenarios:
  - title: "AC · The diagnostics route is unreachable and absent from navigation while the flag is off"
    tags: [gating, feature-flag, happy-path]
    given:
      - "el entorno desplegado con el flag de diagnosticos en falso"
    when:
      - "un administrador autenticado navega directamente a la ruta de diagnosticos"
      - "y revisa la navegacion del area de administracion"
    then:
      - "la ruta no renderiza la pagina de diagnosticos y el usuario termina en otra pantalla"
      - "no existe ningun enlace ni pestana de diagnosticos en la navegacion"
      - "el valor del flag en el codigo desplegado es falso y esta cubierto por un test propio"

  - title: "Security · The client-side flag does not leave server API surface exposed"
    tags: [security, gating, api-surface]
    given:
      - "el gating implementado en el enrutador del cliente"
    when:
      - "se revisa que endpoints del servidor consumiria la pagina de diagnosticos"
    then:
      - "no queda montado ningun router de diagnosticos sin proteger en el servidor"
      - "los endpoints que la pagina consumiria ya viven detras de la autenticacion de administrador"
      - "se deja constancia de que, si en el futuro se agrega un endpoint propio de diagnosticos, el flag del cliente no bastara para protegerlo"

  - title: "Diagnostics functionality itself, reachable only with the flag enabled"
    tags: [not-executable, feature-flag, missing-doc]
    given:
      - "la funcionalidad de diagnostico de entrega implementada pero apagada"
    when:
      - "se intenta ejercitar el reporte de elegibilidad desde la interfaz"
    then:
      - "no es alcanzable mientras el flag siga apagado, por lo que el escenario queda sin ejecutar"
      - "se documenta que cerrar este escenario exige encender el flag y reconstruir el cliente"
      - "se revisa el codigo apagado en busca de inconsistencias que se activarian junto con el flag"
