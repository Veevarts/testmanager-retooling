preconditions:
  - "GitHub CLI (`gh`) autenticado — para fetch de `scripts/master-template-composition.ts`, `scripts/master-template-composition.spec.ts`, y los 77 spec JSON files en el merge commit `5c3e1aa` y en el merge-base."
  - "Clone local de `Veevarts/MigrationAppBackend` en `/tmp/qa/MigrationAppBackend-IM-1096/` en `main` post-merge; `npm ci` sin errores; jest runner disponible."
  - "Habilidad de checkout entre merge-commit (`5c3e1aa`) y merge-base (parent de `5c3e1aa`) para pre/post comparison."
  - "AWS SSO NO requerido para este QA — el master re-seed queda como handoff PENDING-CREDS; QA valida composition-only, no live seed."

format: gherkin
scenarios:
  - title: "AC1+AC2+AC3+AC9 · Predicate-based bijection + coverage snapshot 76 = 24 auto + 33 hybrid + 19 manual"
    tags:
      - ac-1
      - ac-2
      - ac-3
      - ac-9
      - happy-path
      - predicate
      - bijection
      - implementations-automation
      - im-1096
      - im-735
    given:
      - "checkout de `MigrationAppBackend` en el merge-commit `5c3e1aa` con `npm ci` completado sin warnings"
      - "el catálogo `src/implementations/infrastructure/seeds/specs/` contiene 77 archivos `.json` active"
      - "`EXCLUDE_FROM_MASTER = { ic-veevart-auth }` según `scripts/master-template-composition.ts`"
    when:
      - "se corre `npm test -- scripts/master-template-composition.spec.ts` en el merge-commit `5c3e1aa`"
      - "los 14 tests del suite passen"
      - "se ejecuta un dry-run harness que llama `assembleMasterCaseRefs(latestByCase, true)` sobre el catálogo real y devuelve `caseRefs`"
    then:
      - "los caseRefs.length === 76 (bijección exacta: 77 catalog − 1 EXCLUDE)"
      - "el breakdown por feasibility en caseRefs es exactly `{ auto: 24, hybrid: 33, manual: 19 }` (dev-reported number verified)"
      - "`ic-veevart-auth` NO aparece en caseRefs (ausente en ambas ramas: auto/hybrid + manual)"
      - "todo case active en el catálogo con `feasibility != 'manual'` está en caseRefs (excepto el EXCLUDE)"
      - "todo case active con `feasibility == 'manual'` está en caseRefs cuando `includeManual = true` (excepto el EXCLUDE)"
      - "el bijection assert `[...includedIds].sort() === [...expected].sort()` del test `includes EXACTLY every active case minus the exclude set` pasa"

  - title: "AC4+AC5 · Predicate regression contra el silent-drop-on-flip bug de IM-1090"
    tags:
      - ac-4
      - ac-5
      - regression
      - im-1090
      - predicate-proof
      - im-1096
    given:
      - "los tests `auto-includes a BRAND-NEW auto/hybrid case with no pin` y `keeps a case flipped manual→auto included` existen en `master-template-composition.spec.ts`"
      - "ambos tests corren contra un in-memory `fixture()` que NO toca los spec files reales — prueba pura del predicate"
      - "el suite completo del merge-base (pre-fix) contiene la variante allowlist-based con `WORKING_CASE_IDS`"
    when:
      - "en el merge-commit `5c3e1aa`: se corre el spec — el brand-new case `ic-brand-new-hybrid` con `feasibility: 'hybrid'` es agregado al fixture SIN pin en `WORKING_CASE_IDS` (que ya no existe) y sin código adicional"
      - "un case con `feasibility` flipped de `'manual'` a `'auto'` (mismo caseId, caseVersion++) queda tras la asamblea"
      - "para el merge-base: se ejecuta el mismo escenario y — con la allowlist antigua — el brand-new case NO estaba en `WORKING_CASE_IDS`, por lo que quedaba fuera del master"
    then:
      - "en el merge-commit: `assembleMasterCaseRefs(m, true)` incluye `ic-brand-new-hybrid` sin necesidad de tocar ninguna allowlist"
      - "en el merge-commit: el case flipped `ic-existing-manual` (con new feasibility `auto`) sigue en el resultado — NO silent drop"
      - "en el merge-base: la simulación del mismo escenario habría requerido editar `WORKING_CASE_IDS` manualmente (evidencia via diff de `scripts/master-template-composition.ts`)"
      - "el bug latente de IM-1090 está structurally eliminated: no queda un allowlist que mantener; el predicate admite todo case no excluido"

  - title: "AC6+AC7 · DEPENDS_ON stamping documentado + ordering determinism"
    tags:
      - ac-6
      - ac-7
      - dependencies
      - ordering
      - determinism
      - im-1096
    given:
      - "`DEPENDS_ON` en `master-template-composition.ts` declara: `ic-4-05-transaction-journal-layouts → [ic-4-01-specific-funds-debit-credit]` y `ic-8-02-resources-setup → [ic-3-03-rename-tabs-and-labels]`"
      - "ambos targets (`ic-4-01`, `ic-3-03`) están en el catálogo activo — verificado con `gh api contents?ref=5c3e1aa`"
      - "el spec incluye los tests `stamps the documented dependsOn edges and none dangle` y `orders caseRefs ascending by defaultOrder`"
    when:
      - "se ejecuta `assembleMasterCaseRefs(latestByCase, true)` sobre el catálogo real"
      - "se inspecciona el resultado: cada caseRef con `dependsOn` tiene el edge esperado, y cada target de un edge está en el conjunto"
      - "se extrae `orders = caseRefs.map(r => r.order)` y se compara contra su versión sorted ascending"
    then:
      - "`caseRefs.find(r => r.caseId === 'ic-4-05-transaction-journal-layouts').dependsOn` incluye `'ic-4-01-specific-funds-debit-credit'`"
      - "`caseRefs.find(r => r.caseId === 'ic-8-02-resources-setup').dependsOn` incluye `'ic-3-03-rename-tabs-and-labels'`"
      - "para todo caseRef `r` con `r.dependsOn`, cada `d ∈ r.dependsOn` cumple `presentIds.has(d) === true` (no dangling)"
      - "`orders === [...orders].sort((a,b) => a-b)` (ordenación estable ascending por defaultOrder)"
      - "los caseRefs con el mismo `order` quedan tie-broken por `caseId` (localeCompare)"

  - title: "AC8 · Fail-loud guards — missing EXCLUDE id + dangling dependsOn edge"
    tags:
      - ac-8
      - guards
      - fail-loud
      - error-path
      - negative
      - im-1096
    given:
      - "los tests `fails loud when an EXCLUDE_FROM_MASTER id is not in the catalog` y `fails loud on a dangling dependsOn edge` existen en el spec"
      - "el primer test remueve `ic-veevart-auth` del fixture — el ÚNICO id en `EXCLUDE_FROM_MASTER` — para simular un typo"
      - "el segundo test construye un fixture con `ic-4-05` presente pero SIN su target `ic-4-01` — para simular un dependsOn dangling"
    when:
      - "se corren ambos tests en el merge-commit `5c3e1aa`"
      - "se inspeccionan las regex del `expect().toThrow(...)` para confirmar el mensaje de error"
    then:
      - "el primer caso lanza `Error(/EXCLUDE_FROM_MASTER references case \"ic-veevart-auth\"/)` — protege contra typos silenciosos que dejarían al outlier leaked in"
      - "el segundo caso lanza `Error(/dependsOn missing case\\(s\\).*ic-4-01-specific-funds-debit-credit/)` — mirror del §20 dangling-dependency invariant enforced at rehydration"
      - "no se generan caseRefs partial ni assembly silently truncated — ambos guards short-circuit antes de retornar"

  - title: "Handoff · Master template dev/prod re-seed (PENDING-CREDS, orchestrator-owned)"
    tags:
      - handoff
      - manual
      - pending-creds
      - seed
      - operations
      - im-1096
    given:
      - "el PR body de #266 declara explícitamente: **Dev/prod master re-seed is orchestrator-owned + creds-gated (PENDING-CREDS)**"
      - "el master template expandido de 76 caseRefs solo tiene efecto en ambiente vivo tras el re-seed"
      - "AWS SSO token está expired para el owner del pipeline (per PR body y contexto IM-1090/IM-1078 previo)"
    when:
      - "las AWS creds refresquen"
      - "un operator autorizado corra `npm run seed:master-template` contra dev (verificar que el resultado tenga 76 caseRefs)"
      - "una vez verified en dev, promote a prod con el mismo comando"
    then:
      - "QA NO ejecuta este step — queda como manual handoff post-QA sign-off del contract/composition-logic"
      - "el criterio de completeness live es: `PlanTemplate.master` en DynamoDB dev/prod tenga exactamente 76 caseRefs con el breakdown `{ auto: 24, hybrid: 33, manual: 19 }` y `ic-veevart-auth` ausente"
      - "Pendiente de tu parte / del orchestrator: correr el seed una vez las creds AWS SSO se refresquen. Este scenario queda `not-run` hasta ese momento"

