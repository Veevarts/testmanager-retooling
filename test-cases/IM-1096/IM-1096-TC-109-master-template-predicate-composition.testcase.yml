id: "906947ed-312f-4881-a4d6-56c77ea05c7c"
key: "TC-109"
title: "Master-template composition — pin-list → predicate refactor (all non-manual ∪ manual tier) minus EXCLUDE_FROM_MASTER, con fail-loud guards"
description: |
  Cobertura QA para IM-1096 (Historia, priority Medium, epic IM-735
  Implementation Cases Automation).
  QA Sub-task asociada: IM-1110 (creada 2026-07-23).

  Contexto:
  - Follow-up de IM-1090 (composition refactor) — surface la decisión sobre
    si los ~43 non-manual cases del catálogo deben pertenecer al curated
    WORKING set del master template.
  - Decisión de PM: **INCLUDE ALL non-manual + manual tier, MINUS
    EXCLUDE_FROM_MASTER = { ic-veevart-auth }**. Elimina estructuralmente
    el bug latente "silent-drop-on-flip" que apareció en IM-1090 (un case
    flipped manual→auto/hybrid dejaba de matchear el manual-predicate y caía
    del master a menos que alguien recordara pinnarlo).
  - Repositorio: `Veevarts/MigrationAppBackend`.
  - PR bajo prueba: `Veevarts/MigrationAppBackend#266` (**MERGED** 2026-07-16 16:00Z).
    Branch: `task/master-template-all-automated-cases-IM-1096`. Merge commit
    `5c3e1aa9e0cccac61ebce0bcf67383b29793a855`.
  - Files touched (5, composición-only, NO spec JSON):
    * `scripts/master-template-composition.ts` (+56/-88, core logic)
    * `scripts/master-template-composition.spec.ts` (+169/-25, 14 tests)
    * `scripts/seed-master-template.ts` (+25/-23, doc comments + TEMPLATE_DESCRIPTION)
    * `src/implementations/infrastructure/seeds/specs/ic-3-25-setup-profiles-and-users.spec.ts` (+4/-2)
    * `src/implementations/infrastructure/seeds/specs/ic-4-05-transaction-journal-layouts.spec.ts` (+5/-3)

  Cambio principal:
  - Se elimina la allowlist `WORKING_CASE_IDS` / `FLIPPED_WORKING_CASE_IDS`
    y se reemplaza por un **predicate**:

    ```
    selectedIds = { case | feasibility !== 'manual' }
                ∪ ( includeManual ? { case | feasibility === 'manual' } : {} )
                \ EXCLUDE_FROM_MASTER
    ```

  - `EXCLUDE_FROM_MANUAL_TIER` se renombra a `EXCLUDE_FROM_MASTER` y se
    aplica a AMBAS ramas (auto/hybrid + manual). Contenido: `{ ic-veevart-auth }`.
  - `assembleMasterCaseRefs` ahora hace **fail-loud** en dos invariantes:
    (a) un id en `EXCLUDE_FROM_MASTER` que no existe en el catálogo (typo →
    dejaría al outlier leaked) → throw; (b) un `DEPENDS_ON` edge cuyo target
    no está en el caseRefs assembly → throw (mirror del §20 rehydration).
  - `DEPENDS_ON` stamping (ic-4-05→ic-4-01, ic-8-02→ic-3-03) queda sin cambio,
    con la garantía adicional de que la predicate-based selection admite
    ambos targets automáticamente (nunca dangle).
  - `defaultOrder` sort ascendente con `caseId` tie-break queda igual.

  Evidencia dev (per PR body + verified in Test #266):
  - jest full suite: **201 suites / 2076 tests passed**, incluyendo la
    composition spec de 14 tests.
  - `tsc --noEmit`: clean. `eslint` en los 3 archivos touched: clean.
  - Dry-run harness (reads specs from disk, no DynamoDB write): assembles
    **76 caseRefs** = `{ auto: 24, hybrid: 33, manual: 19 }`, con
    `ic-veevart-auth` ausente.
  - Catálogo: 77 active spec JSON files a nivel merge-commit (verificado
    por QA via `gh api contents?ref=5c3e1aa`) — 77 − 1 exclusion = 76.

  Riesgos abiertos:
  - **Dev/prod master re-seed es orchestrator-owned + creds-gated
    (PENDING-CREDS)**. El master expandido de 76 cases NO tiene efecto en
    ambientes vivos hasta que las AWS creds refresquen y el seed corra en
    dev y luego prod. Este QA valida el **contract + composition logic**;
    el efecto en ambiente vivo queda como manual handoff pending-creds.
  - PR ya MERGED al momento de QA — baseline vs post-fix se hace entre
    merge-base (pin-list version) y merge commit `5c3e1aa` (predicate).
  - El outlier `ic-veevart-auth` es hybrid, no manual — la razón de exclusión
    es que se tracka en el template separado `w4-foundations`, no que sea
    manual. La reference debe verificarse in-code (comment de
    EXCLUDE_FROM_MASTER lo declara explícitamente).
  - Los cambios en `ic-3-25` y `ic-4-05` spec.ts son test-only edits para
    ajustar assertions post-refactor; NO tocan el JSON spec ni el runtime
    behavior de esos IC cases. Verificar que no alteren su feasibility ni
    su defaultOrder.

