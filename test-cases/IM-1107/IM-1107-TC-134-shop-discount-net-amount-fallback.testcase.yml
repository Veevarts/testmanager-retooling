scenarios:
  - title: "AC1 · A merchandise line WITHOUT unit rows nets the discount instead of adding it — on the fallback path the exported amount is derived as soi.TOTAL menos (item discount + order discount), so the $90 line with a −$66 discount exports Amount = $24 (the real Altru order total) instead of the inflated $156"
    tags:
      - ac-1
      - shop-sales
      - sale-item
      - net-amount
      - discount-netting
      - fallback-path
      - altru
      - im-70
      - im-1107
      - illinois
      - happy-path
    given:
      - "una línea de merchandise sin filas `SALESORDERITEMMERCHANDISEUNIT` (el ~99 % del volumen) con descuento aplicado"
    when:
      - "se corre `sale_item.sql` PRE-fix vs POST-fix sobre la misma línea"
    then:
      - "PRE-fix el descuento se SUMA al monto (base gross usada como neta) → Amount inflado (90 + 66 = 156)"
      - "POST-fix el neto es `COALESCE(AMOUNTPAID, soi.TOTAL - (item discount + order discount))` → Amount = 24"
      - "ninguna línea queda con monto negativo tras el neteo"

  - title: "AC2 · The authoritative unit-row path stays untouched (do-no-harm) — lines that DO carry SALESORDERITEMMERCHANDISEUNIT rows keep using AMOUNTPAID, so already-correct lines export exactly the same amount as before and the identity soi.TOTAL = SUM(AMOUNTPAID) + discounts holds with zero delta"
    tags:
      - ac-2
      - do-no-harm
      - unit-row-path
      - amountpaid
      - identity-check
      - regression
      - im-1107
    given:
      - "líneas de merchandise CON filas de unit (`AMOUNTPAID` presente) — Illinois 658 de 79,713"
    when:
      - "se comparan los montos exportados PRE-fix vs POST-fix para esas líneas y se verifica la identidad de la fuente"
    then:
      - "el `COALESCE` toma `AMOUNTPAID` primero → el monto exportado NO cambia (do-no-harm sobre las líneas ya correctas)"
      - "en la fuente se cumple `soi.TOTAL = SUM(AMOUNTPAID) + descuentos` con delta 0 (validado por el dev en 7 profiles)"
      - "el grain se mantiene: una Sale Item por línea de merchandise, sin filas nuevas ni perdidas"

  - title: "AC3 · Derived money fields are recomputed from the net while Item_Price__c stays gross — Subtotal_before_discount__c, Price_Without_Tax__c, Tax_Amount__c and Amount__c all derive from the netted base, but Item_Price__c keeps the gross base so the managed package's POS_Discount__c propagation established in IM-809 / TC-37 still lands correctly"
    tags:
      - ac-3
      - derived-fields
      - item-price-gross
      - pos-discount
      - im-809-regression
      - tc-37-contract
      - im-1107
    given:
      - "el `sale_item.sql` del PR #155 y el contrato de IM-809 / TC-37 (\"sale_item gross\" para propagar POS_Discount__c)"
    when:
      - "se inspeccionan las expresiones de los campos derivados y se corre la carga con triggers activos"
    then:
      - "`Subtotal_before_discount__c`, `Price_Without_Tax__c`, `Tax_Amount__c` y `Amount__c` se recomputan desde el neto"
      - "`Item_Price__c` NO cambia: sigue en base **gross** → la propagación de `POS_Discount__c` del managed package no se rompe (no hay regresión de IM-809)"
      - "los campos quedan coherentes entre sí (el `Discount Amount` sigue siendo el descuento y `gross = net + discount`)"

  - title: "AC4 · Parent rollups reconcile the order total to 100% — client_purchase.sql and sales_order_only_shop.sql apply the same fallback correction on subtotal_after_discount, so merchandise-only orders match SALESORDER.AMOUNT exactly (Illinois 2,533 → 3,189/3,189, High Desert 55,250 → 65,097/65,097, Long Island 3,939 → 5,040/5,040) and the POS Purchase / Client Purchase totals stop over-reporting"
    tags:
