id: "19f5e997-12b7-42b1-b0b6-4837edca6853"
key: "TC-134"
title: "Shop merchandise lines without unit rows derive the exported Amount as soi.TOTAL menos los descuentos (item + order) en vez de sumarlos, el path autoritativo AMOUNTPAID queda intacto, Item_Price__c sigue en base gross (IM-809 POS_Discount) y los rollups padre reconcilian el order total al 100% (Illinois Holocaust Museum)"
description: |
  Cobertura QA para IM-1107 (Historia, priority **Crítica**, epic IM-70 Altru Queries).
  QA Sub-task asociada: IM-1140 (creada 2026-07-28).

  Contexto (discrepancia financiera en validación de Shop Sales):
  - Account: **Illinois Holocaust Museum and Education Center**. Durante la validación de Shop Sales se detectó
    que los descuentos de Altru **no se restan** en el campo `Amount` al migrar — se **suman**, inflando el monto.
    `Subtotal` y `Total` sí quedaban correctos; `Amount` inflaba los totales de la validación financiera.
  - **Ejemplo 1 (regression evidence)**: Order Altru **#12747796** (1/25/2025, Total real **$24.00**) → Sale Item SF
    **S-19225**, Implementation External ID **63FAAF69-7E48-4AC3-9AE9-2AC6B6952C0D**. Merchandise "Family Membership"
    $90.00 + Discount −$66.00 ⇒ Altru $24.00, pero SF mostró `Amount` = **$156.00** ❌ (= 90 + 66), `Discount Amount`
    = −$66.00, `Subtotal` = $90.00 ✅, `Total` = $90.00 ✅.
  - **Ejemplo 2**: Order Altru **#12747862** → Sale Item SF `a2wan000006zl68AAA`.
  - 3 screenshots adjuntos al ticket como evidencia.
  - **PR bajo prueba: `Veevarts/MigrationToolETL#155`** (**OPEN**, branch `fix/im-1107-shop-discount-amount-netting`
    → main). 10 files +1255/-15: 4 `.sql` de shop + 3 de query-regression (spec rápido + integration docker + fixture)
    + docs/README/package.json.

  Root cause (del PR):
  - `soi.TOTAL` de una línea de merchandise en Altru es el total **GROSS** de la línea (antes de descuento y antes de
    impuesto). Las queries de shop usaban `COALESCE(us.amount_paid_after_discount, soi.TOTAL, 0)` como base **neta**,
    pero el `AMOUNTPAID` por unidad **solo existe en líneas que tienen filas `SALESORDERITEMMERCHANDISEUNIT`** —
    ausente en la enorme mayoría (**Illinois 79,055/79,713**, Long Island 238,776/241,547 ≈ 99 %). En esas líneas el
    descuento terminaba **sumado** al monto en vez de restado ⇒ el ítem de $90 con descuento de $66 exportaba
    `Amount = $156` en lugar de $24.

  El fix (del PR):
  - El monto neto se deriva vía `CROSS APPLY` como `COALESCE(AMOUNTPAID, soi.TOTAL - (item discount + order discount))`
    **solo en el fallback**; el path autoritativo de unit-row (`AMOUNTPAID`) queda **intacto** (las líneas ya correctas
    no cambian).
  - `sale_item.sql`: `Subtotal_before_discount__c`, `Price_Without_Tax__c`, `Tax_Amount__c` y `Amount__c` se recomputan
    desde ese neto. **`Item_Price__c` NO cambia: se queda en base gross** para que la propagación de `POS_Discount__c`
    del managed package siga aterrizando bien (contrato establecido en **IM-809 / TC-37**).
  - `client_purchase.sql` y `sales_order_only_shop.sql`: misma corrección del fallback sobre `subtotal_after_discount`
    (rollups padre de POS Purchase / Client Purchase). `pos_discount_only_shop.sql`: solo contrato/comentario.

  Estrategia de verificación (para /qa-test-executor):
  - **Regression tests (evidencia PRIMARIA)**: `shop-discount-query.spec.ts` (guards rápidos que bloquean la
    reintroducción del fallback gross) + `shop-discount-query.integration.spec.ts` + fixture (SQL Server dockerizado,
    4 órdenes: descuento a nivel orden, descuento a nivel ítem + impuesto, control con unit-row, control sin descuento;
    asserts de montos neteados, integridad referencial cross-query, rollups padre y la identidad `gross = net + discount`).
    Dev: 300 pass en `query-regression`, 15 tests docker, **pre-fix falla 11 de los nuevos casos**. QA re-corre + **revert-proof**.
  - **safesql PRE/POST** en un profile alcanzable: contar líneas sin unit-rows, verificar la identidad
    `soi.TOTAL = SUM(AMOUNTPAID) + descuentos` (delta 0) en las líneas con unit-row, que ninguna línea quede **negativa**
    tras el fix, y la reconciliación de órdenes merchandise-only contra `SALESORDER.AMOUNT`.
  - **Regresión de IM-809 / TC-37**: confirmar que `Item_Price__c` sigue gross y que la propagación de `POS_Discount__c`
    no se rompe (es el contrato que TC-37 fijó: "sale_item gross").

  Riesgos abiertos:
  - **El profile safesql `illinois_2` (Illinois Holocaust Museum, el cliente del ticket) NO conecta** (túnel caído;
    tampoco aspen). El único alcanzable hoy es **`tucson`**, que además **NO figura** entre los profiles que el PR dice
    haber auditado (illinois_2, aspen, everson, high_desert, kidstream, longisland, moad) → puede no tener datos de shop
    comparables. Si la verificación live sobre el cliente es requisito, hay que levantar el túnel de `illinois_2`.
  - **Ambigüedad en el ticket sobre la semántica de `Amount`**: el ticket dice *"El campo Amount debería reflejar el
    precio antes del descuento ($156.00 puede ser el precio original del item)"*, pero también reporta que el impacto es
    que los reportes muestran **más dinero del real**. El PR resuelve que `Amount` es el **neto** ($24) y deja el gross en
    `Item_Price__c`. QA debe validar que esa semántica es la correcta y que ambos campos quedan coherentes.
  - **Blast radius grande**: el fallback afecta ~99 % de las líneas de merchandise (Illinois 79,055 de 79,713) — no es un
    caso de borde, cambia el monto exportado de casi todas las líneas con descuento.
  - **PR OPEN (no merged)** → el POST-fix es el head del branch, no `main`.
  - Datos de cliente read-only: safesql (bastion, keychain) — credenciales y datos row-level nunca en el chat/artefactos.

