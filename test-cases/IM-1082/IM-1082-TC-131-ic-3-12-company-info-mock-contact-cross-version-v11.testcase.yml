  - "NO se requiere org ni IE run: live fue CamiloDevOrg-only (dev-proven: 18/18 rollups, dynamic company put) y el v11 no seeded (seed PENDING)."

format: gherkin
scenarios:
  - title: "AC1 · Flagship re-runs green on CamiloDevOrg under current package versions — the Company Information T6 step compiles and upserts the primary Company Information record, the Mock Contact T6 step compiles and ensures the flagged anonymous Contact exists (idempotent), the NPSP rollups T6 step compiles and reports the fiscal-year end-state, and no step fails due to a missing managed field, object, or rollup"
    tags:
      - ac-1
      - flagship
      - t6-seed
      - cross-version
      - idempotent
      - happy-path
      - im-1082
      - im-735
    given:
      - "el spec `demo-company-info-mock-contact.json` v11 en merge `1552e7a7` seeded contra CamiloDevOrg"
    when:
      - "se leen los apex de los 3 steps T6 (1 Company Info, 5 mock Contact, 7 NPSP rollups) y su compilación/ejecución"
    then:
      - "step 1 upserta el primary Company Information (Auctifera__Primary_Company__c=true) con el required Name; idempotente"
      - "step 5 asegura el mock Contact (Auctifera__Mock_Contact__c=true) idempotente (insert solo si no existe) + VERIFY COUNT"
      - "step 7 reporta el end-state de los rollups; ningún step falla por field/object/rollup faltante (dev-proven live CamiloDevOrg: 18/18 present+enabled)"

  - title: "AC2 · Optional Company Information fields are written org-agnostically — a supplied subset of optional fields (website, telephone, address, city, state, postal code, country) is written only when present+updateable in the current package version via a describe-guarded dynamic put; an absent/renamed field is logged and skipped; the anonymous Apex still compiles (no static reference to an absent field); and the required company name + Primary Company anchor are always set"
    tags:
      - ac-2
      - t6-company-info
      - describe-guarded
      - dynamic-put
      - org-agnostic
      - im-1082
    given:
      - "el step 1 (T6 Company Info) v11 y un subset de optional fields provisto por el operador"
    when:
      - "se lee el apex del step 1 y su bloque de optional fields"
    then:
      - "usa `Auctifera__Company_Information__c.SObjectType.getDescribe().fields.getMap()`; por field: si blank skip; si tok!=null && tok.getDescribe().isUpdateable() → `co.put(tok, value)`; else WARN+skip"
      - "el anon-block COMPILA sin static reference a un field ausente (a diferencia de v10 que hacía `co.Auctifera__Website__c = ...`)"
      - "los identity anchors (Name, Auctifera__Primary_Company__c) siguen static; el required company Name siempre se setea; VERIFY COUNT del primary"

  - title: "AC3 · NPSP fiscal-year rollups tolerate per-version absence — the 18 named NPSP gift/soft-credit rollups are resolved dynamically by DeveloperName; when every present rollup already has Use Fiscal Year enabled the step succeeds reporting the verified end-state (e.g. 18 of 18 present); when some present rollups are not enabled it enqueues an asynchronous CMDT deployment and succeeds; and when a rollup DeveloperName is absent in this NPSP version it is logged and skipped rather than failing a hard precondition"
    tags:
      - ac-3
      - t6-npsp-rollups
      - tolerate-absence
      - cmdt-deploy
      - org-agnostic
      - im-1082
    given:
      - "el step 7 (T6 NPSP rollups) v11 y los 18 DeveloperNames resueltos dinámicamente"
    when:
      - "se lee el apex del step 7 y sus ramas present/disabled/absent"
    then:
      - "query `npsp__Rollup__mdt WHERE DeveloperName IN :DEV_NAMES`; todos present+enabled → success reportando 'X of 18 present'"
      - "algunos present+disabled → `Metadata.Operations.enqueueDeployment` (async CMDT deploy) + success (self-verifying en re-run)"
      - "un DeveloperName ausente en esta versión de NPSP → WARN+skip (tolerado), NO `throw 'precondition failed'` (asertado por el spec.ts: deploy contiene 'absent' y NO 'precondition failed')"

  - title: "AC4 · Manual handoffs remain well-structured guides — the parts with no Salesforce API (Manage Files component + org-default record page, logo upload, Veevart File layout fields, fiscal-year Setup) each render a structured guide with context, numbered actions, and an estimate; and the fiscal-year Setup step stays manual because FiscalYearStartMonth is read-only via the API"
    tags:
      - ac-4
      - manual
      - manual-handoff
      - structured-guide
      - no-api-path
      - im-1082
    given:
      - "los steps MANUAL 2 (Lightning page), 3 (logo), 4 (Veevart File layout fields) y 6 (fiscal-year Setup) del spec v11"
    when:
      - "se parsean los steps MANUAL y sus guides"
    then:
      - "cada step MANUAL tiene guide con context, actions numeradas (≥3) y estimatedMinutes>0 (step2=6, step3=3, step4=5, step6=5)"
      - "step 2 explica que no hay API para agregar un componente managed a una Lightning page managed ni setear el org-default record page; step 4 que el Veevart File layout es managed (sin Metadata API)"
      - "el step 6 (fiscal-year) sigue MANUAL porque FiscalYearStartMonth es read-only vía la API"

  - title: "Version lockstep v11 + gates + scope-fit — case.version and template.version are both 11 (lockstep, asserted by a test); the 7 steps stay strictly ordered 1..7; every T6 step is pure Apex (no HTTP callout / Data API / session theft); jest (lockstep + describe-guarded put + tolerate-absence) / tsc --noEmit / eslint on touched files pass; #254 is spec-only (T6 reused, NOT genuinely-new)"
    tags:
      - ac-5
      - gates
      - jest
      - tsc
      - eslint
      - version-lockstep
      - no-callout
      - reused-ops
      - scope-fit
      - im-1082
    given:
      - "clone local de MigrationAppBackend en merge `1552e7a7` con npm ci limpio; base `545e2cb0`"
    when:
      - "se corren tsc --noEmit, el `.spec.ts` de 3.12 y eslint; y se audita el diff de #254 + los apex"
    then:
      - "case.version=11 y template.version=11 (lockstep, asertado por el test); feasibility hybrid; 7 steps order 1..7 (3 T6 + 4 MANUAL)"
      - "cada step T6 es pure Apex (asertado: sin HttpRequest / /services/data / session theft); el `.spec.ts` pasa (8/8: schema+lockstep+order+describe-guarded put+separate seed steps+tolerate-absence+pure-apex)"
      - "tsc --noEmit exit 0; eslint limpio; full jest 0 fail; op-reuse: #254 NO toca adapters (base..merge = 2 files, ambos seeds/specs/), T6 reused → NO genuinely-new"

