key: "TC-131"
title: "IM-1082 IC 3.12 Company Info & Mock Contact Creation (v10→v11, medium-confidence) — validate the flagship cross-version hardening: the 3 AUTOMATED T6 steps compile+run org-agnostically across package versions via (1) a describe-guarded dynamic put for the optional Company Information fields and (2) NPSP rollups that TOLERATE per-version absence (log+skip, not a hard precondition), plus 4 well-structured MANUAL handoffs and version lockstep v11 · CODE PR spec-only (reused T6 anon apex)"
description: |
  Cobertura QA para IM-1082 (Historia, priority Medium/medium-confidence, epic IM-735 Implementation
  Cases Automation).
  QA Sub-task asociada: IM-1136 (creada 2026-07-28).

  Contexto:
  - Post-June IM-735 continuation, Batch D (decision & verify). Flagship case (operator-input + T6 +
    handoffs), verificado en Tucson; cross-version re-run en CamiloDevOrg. El re-run NO surfaceó drift;
    la version se bumpeó 10→11 (lockstep) y se endurecieron 2 superficies hardcodeadas para volver el
    caso org-agnostic entre versiones de package.
  - PR bajo prueba: `Veevarts/MigrationAppBackend#254` (**MERGED**).
    Branch: `task/ic-3-12-company-info-mock-contact-IM-1082`. Merge commit `1552e7a7` (base `545e2cb0` = IM-1081 #253).
    2 files, +34/-7.
  - **CODE PR spec-only** — NO toca adapters/ops: el diff son 2 files: `demo-company-info-mock-contact.json`
    (v10→v11) + su `.spec.ts` (+29/-2). El caseId es `company-info-and-mock-contact`. T6 anon apex ya existe → reused.

  IC 3.12 v11 (feasibility hybrid, 7 steps: 3 AUTOMATED T6 + 4 MANUAL):
  - Step 1 (T6): seed del primary Auctifera Company Information record (idempotente upsert; required companyName).
    **Hardening v11 #1:** los optional managed fields (website, telephone, address, city, state, postalCode, country)
    se escriben vía un DESCRIBE-GUARDED dynamic put — `SObjectType.getDescribe().fields.getMap()` + `isUpdateable()`
    + `co.put(tok, value)`; un field ausente/renombrado en la versión del package se logea y se SALTA (ya no rompe el
    COMPILE del anon-block, como sí lo hacía el static ref — la clase de bug "Field does not exist"). Los anchors de
    identidad (Name, Auctifera__Primary_Company__c) siguen static (moot si driftan). El required company Name siempre se setea.
  - Steps 2-4, 6 (MANUAL): Lightning page (Manage Files component + org-default record page, sin API), logo upload,
    Veevart File layout fields (managed package, sin Metadata API), fiscal-year Setup (FiscalYearStartMonth read-only
    vía API). Cada uno con guide estructurada (context/actions/estimatedMinutes).
  - Step 5 (T6): seed del Auctifera mock Contact (idempotente; flag Auctifera__Mock_Contact__c vía DML; Description
    vía describe-guarded dynamic put + isCreateable — el patrón que el step 1 ahora replica).
  - Step 7 (T6): habilitar 'Use Fiscal Year' en los 18 NPSP rollups (resueltos dinámicamente por DeveloperName).
    `npsp__Rollup__mdt` es CMDT (read-only a Apex DML) → el flag se setea vía `Metadata.Operations.enqueueDeployment`
    (ASÍNCRONO). **Hardening v11 #2:** per-version absence TOLERADA — un DeveloperName ausente en esta versión de NPSP
    se logea y se SALTA (antes: `throw 'precondition failed'` hard). Ramas: todos presentes+enabled → success (18/18);
    algunos disabled → enqueue CMDT deploy + success; ausentes → log+skip.

  Estrategia de verificación:
  - **jest + tsc + eslint como evidencia PRIMARIA** (CODE PR spec-only): clone en merge `1552e7a7`, correr el
    `.spec.ts` de 3.12 (lockstep + describe-guarded put + tolerate-absence + pure-Apex) + gates.
  - **spec fidelity + apex read independiente**: parsear los 7 steps + LEER el apex de los steps 1 (Company Info v11),
    5 (mock Contact) y 7 (NPSP rollups v11) por cuenta propia — dynamic put guarded, tolerate-absence, no static ref,
    no callout — + las 4 guides MANUAL.
  - **op-reuse audit** (NO genuinely-new): confirmar que #254 NO toca adapters (base..merge = 2 files, ambos seeds/specs/);
    T6 ya existe → reused.
  - **NO hay live IE run en este QA**: la verificación live fue CamiloDevOrg-only (org 00Dfj00000QJMx7EAH, vía sf-CLI
    anonymous Apex porque AWS SSO expiró → run-plan-local CLI no bootea Secrets Manager): 18/18 rollups present+enabled,
    dynamic company put escribió website/telephone, mutaciones de test limpiadas. v11 NO seeded a MigrationApp-dev (seed
    PENDING). Live = dev-proven/PENDING-CREDS, no PASS/FAIL prematuro.

  Riesgos abiertos (del ticket):
  - **Cross-version drift (medium-confidence)**: el re-run no surfaceó drift; el v11 endurece las 2 superficies static
    restantes para robustez a futuro. El pre-v9 record-page select del caveat ya fue removido en IM-753 y correctamente
    sigue removido (sin API de Salesforce para él).
  - **Seed PENDING-CREDS**: v11 no seeded (append-only) → seed en cred refresh; bloquea re-correr via la app.
  - Verificado por el dev en CamiloDevOrg (+ Tucson previo). QA re-verifica por código.

