key: TC-89
title: IC 8.02 — Resources Setup (delivery auto, 3 T6 steps, org-agnostic GL codes)
description: |
  Cobertura QA de IM-936 (8.02 Resources Setup — deliver to Implementations,
  high-confidence). Junio delivery del Implementation Case
  `ic-8-02-resources-setup` v6 (auto). Confianza alta por reporte IM-735
  (2026-06-12): built+verified CamiloDev, cross-tested COMPLETED Tucson. v6
  dev-seeded en MigrationApp-dev.

  El case automatiza el playbook manual de Resources Setup: (1) normaliza el
  default Auctifera Display/Storage Location renombrándolo a "Technical Record
  Do Not Modify" y limpiando Capacity/GL/Tax GL; (2) crea la Display/Storage
  Location "Location Test" con Capacity=100, Available for Rent, y GL/Tax GL
  copiados desde Auctifera Accounting; (3) crea el Resource/Service "Resource
  test" con Quantity=1 y GL/Tax GL desde Auctifera Accounting Resources.

  Validar:
  1) el default location es hallado dinámicamente por Store Default Location=true
     (no por museum name) y renombrado con Capacity/GL/Tax GL clareados,
  2) "Location Test" existe con Capacity=100, Available for Rent, GL codes
     copiados desde Accounting,
  3) "Resource test" existe con Quantity=1 y GL/Tax GL desde Accounting Resources,
  4) org-agnostic — no hay GL-code strings hardcoded en la case definition,
  5) idempotent y self-heal — GL Code drifted se re-syncea al valor de Accounting,
  6) verify failures loud — steps fallan con "[8.02-x] verify failed: ..."
     en vez de raw platform error,
  7) depends-on-3.03 — si el default location no existe, step 1 falla con error
     controlado nombrando 3.03 como prerequisito,
  8) delivery — v6 seedeado en prod catalog e IE handoff.

  QA Sub-task asociada: IM-998
  Riesgos abiertos:
  - AC7 (depends-on-3.03) requiere una org donde 3.03 no ha corrido todavía —
    típicamente una scratch org fresca.
  - AC5 self-heal (GL drift) requiere reproducir drift manualmente antes de
    re-correr el case.
type: integration
priority: high
status: active
preconditions:
- Implementation Case `ic-8-02-resources-setup` v6 deployado en prod (feasibility auto, 3 T6 steps)
- Org target con Auctifera package instalado
- Auctifera Accounting setting configurado con Location GL/Tax GL y Resources/Services GL/Tax GL (típicamente via case 4.02)
- Default Auctifera Display/Storage Location existe (Store Default Location=true) — típicamente creado por case 3.03
- Acceso al catálogo prod para seedear v6
format: gherkin
scenarios:
- title: 8.02 Resources Setup — Default Display/Storage Location normalized (renamed + cleared)
  tags:
  - happy-path
  - im-936
  - im-998
  - ac-1
  - automated
  - display-storage-location
  given:
  - una org con el default Auctifera Display/Storage Location (Store Default Location=true) nombrado por el museo
  when:
