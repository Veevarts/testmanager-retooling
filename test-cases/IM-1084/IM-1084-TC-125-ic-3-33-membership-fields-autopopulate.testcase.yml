key: "TC-125"
title: "IM-1084 IC 3.33 Auto-Populating Membership Program Fields — harden the untested deactivate/verify path (Low): rework a v1 vacuous zero-rollup no-op into a v2 HYBRID whose T3 customMetadata mutation is automated via a NEW recordPattern mode (DeveloperName-contains subset, update-only, tolerate-absent, per-record SOQL read-back, LIKE-wildcards escaped to literals) + T6 auto-population enable + MANUAL fill-batch schedule · CODE PR with a GENUINELY-NEW op capability"
description: |
  Cobertura QA para IM-1084 (Historia, priority Medium/low-confidence, epic IM-735 Implementation
  Cases Automation).
  QA Sub-task asociada: IM-1130 (creada 2026-07-27).

  Contexto:
  - Post-June IM-735 continuation, Phase 2 (Low tier). Gap del ticket: el path deactivate/verify de 3.33
    estaba UNTESTED — el test org tenía cero NPSP Last-Membership rollups, así que la corrida v1 era un
    no-op TRIVIAL y el verify pasaba VACUAMENTE. IM-1084 rehace 3.33 a un v2 HYBRID cuyo mutation es
    automatizado y cuyo verify es significativo.
  - PR bajo prueba: `Veevarts/MigrationAppBackend#256` (**MERGED** 2026-07-16 07:57Z).
    Branch: `task/ic-3-33-membership-fields-autopopulate-IM-1084`. Merge commit `c671b71f` (base `2271ff0f`,
    el merge de IM-1083 #255). 5 files, +429/-64.
  - **CODE PR con op capability GENUINELY-NEW** (a diferencia de los otros hijos IM-735 de esta tanda, que
    fueron spec-only): #256 TOCA el adapter T3 y el domain model — agrega el modo `recordPattern` al op
    T3 `customMetadata`. Files: `t3-metadata.adapter.ts` (+80/-20, la nueva lógica), `metadata-mutation-spec.ts`
    (domain model, +52/-10), `t3-metadata.adapter.spec.ts` (+163, unit tests del modo nuevo),
    `ic-3-33-…autopopulate.json` (spec v1→v2), `ic-3-33-…autopopulate.spec.ts` (+102, lockstep). Este PR es
    el ORIGEN del capability `recordPattern` que IM-1085/#257 y siguientes luego reutilizaron.

  Capability nuevo (T3 customMetadata → recordPattern mode):
  - Aplica `values` al SUBSET de records cuyo bare DeveloperName CONTIENE el pattern (SOQL `LIKE '%pattern%'`).
  - Update-only (nunca crea), per-record SOQL read-back verify de cada write, misma maquinaria que `allRecords`.
  - **TOLERATE-ABSENT**: cero matches = success no-op limpio (outcome `skipped`), NO un failure — a diferencia
    de `allRecords` que sí flaggea un type vacío. Es el modo para desactivar una FAMILIA de CMDT managed
    definida por nombre que un org puede o no tener (las NPSP `LastMembership` rollups del caso 3.33), resuelta
    por su DeveloperName pattern estable en vez de una lista de Ids hardcodeada, con skip limpio en un
    org/package version que no las tenga.
  - Exclusión mutua + precedencia: `allRecords` > `recordPattern` > `record`.
  - **LIKE-wildcard escaping** (fix del reviewer LOW, mismo PR): el pattern es un contains-substring PLANO, no un
    identifier; después del escaping de quote/backslash (`escapeSoqlLiteral`) los wildcards SOQL `%` y `_` se
    escapan a literales (`%`→`\%`, `_`→`\_`; el escape char default de LIKE es `\`), corriendo DESPUÉS de
    `escapeSoqlLiteral` para que el backslash agregado no se re-doble. Solo los dos `%` wrapper del op quedan
    wild. Así `Foo_Bar` matchea el underscore literal en `NPSP_Foo_Bar`, nunca `FooXBar`.
  - **Writability finding**: `npsp__Rollup__mdt.npsp__Active__c` es subscriber-writable vía el synchronous CRUD
    Metadata API a pesar de su field manageability `DeveloperControlled` — las NPSP default rollups son
    subscriber-owned (NamespacePrefix null, bare `Type.Dev` fullName), así que `metadata.update('CustomMetadata', …)`
    commitea (flip false↔true probado live en CamiloDevOrg). Un record genuinamente package-protected que el
    write NO commitea lo caza el read-back verify como `applied=false`, nunca un false pass.

  Spec 3.33 v2 (feasibility hybrid, 3 steps):
  - Step 1 (T3 customMetadata, recordPattern "LastMembership"): npsp__Active__c=false sobre las NPSP
    Last-Membership rollups (Account + Contact set) — dynamic resolution, tolerate-absent, self-verifying.
  - Step 2 (T6 anon apex): enable vnfp__Contact_Account_Fields_Auto_Population__c en el org-default
    vnfp__Fundraising_Settings1__c (upsert org-default, idempotente, query-back verify, throws si el flag no
    queda true).
  - Step 3 (MANUAL): schedule los vnfp Contact/Account membership-field fill batches (vnfp.FillContactDataBatch
    + vnfp.FillAccountDataBatch) vía la UI soportada; confirmar 2 CronTrigger entries. La visibilidad
    Schedulable/global de la clase managed no se puede confirmar estáticamente desde anon apex → queda manual.

  Estrategia de verificación:
  - **jest + tsc + eslint como evidencia PRIMARIA** (CODE PR, genuinely-new op): clone en merge `c671b71f`,
    correr el adapter `.spec.ts` (incl. los 3 tests recordPattern) + el lockstep de 3.33 + gates; re-derivar
    el conteo del dev (jest 1926).
  - **adapter code review independiente**: leer el diff de `t3-metadata.adapter.ts` y `metadata-mutation-spec.ts`
    por cuenta propia — resolución del subset, tolerate-absent, wildcard escaping, per-record read-back,
    exclusión mutua — no confiar solo en el lockstep ni en el PR body.
  - **genuinely-new audit**: probar con `git grep -c recordPattern` que el marker = 0 en base `2271ff0f` (#255)
    y > 0 en merge `c671b71f` (adapter + domain model) → capability GENUINELY-NEW, no reused.
  - **spec fidelity independiente**: parsear los 3 steps + el apex del step 2 (objetos, upsert org-default,
    verify/throw) por cuenta propia.
  - **NO hay live IE run en este QA**: la verificación live fue CamiloDevOrg-only (dev-proven: 8 Last-Membership
    rollups activos → 8 inactivos, cada uno read-back verificado) y el v2 NO está seeded a MigrationApp-dev
    (seed PENDING-CREDS, AWS SSO expirado). Live = dev-proven/PENDING-CREDS, no PASS/FAIL prematuro.

  Riesgos abiertos (del ticket):
  - **Low-confidence gap cerrado por diseño**: el v1 verify vacío se reemplaza por un mutation automatizado +
    per-record read-back significativo; la parte MANUAL (step 3) queda solo por la visibilidad managed
    Schedulable no confirmable estáticamente.
  - **Seed PENDING-CREDS**: v2 no seeded (append-only) → seed en cred refresh; bloquea re-correr via la app.
  - Verificado por el dev en CamiloDevOrg. QA re-verifica por código (con la ventaja de que el capability nuevo
    tiene unit tests directos en el adapter spec).

