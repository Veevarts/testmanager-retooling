    then:
      - "los rollups ya inactivos se saltan (no redundant write) — el op compara el estado actual antes de escribir"
      - "el step igual corre el read-back verify y tiene éxito (idempotente)"
      - "cubierto por el adapter unit test 'recordPattern: deactivates only the DeveloperName-matching subset, skipping already-satisfied and non-matching records'"

  - title: "AC6 · Enable Veevart Contact/Account auto-population — step 2 (T6) sets vnfp__Contact_Account_Fields_Auto_Population__c true on the org-default vnfp__Fundraising_Settings1__c (upserting the org-default when none exists), confirms it by a query-back verify, and throws (step FAILED) if the read-back does not show it true"
