    tags:
      - ac-1
      - ac-2
      - happy-path
      - custom-metadata
      - record-pattern
      - read-back-verify
      - dynamic-resolution
      - im-1084
      - im-735
    given:
      - "el spec `ic-3-33-membership-fields-autopopulate.json` v2 en merge `c671b71f` y el adapter `t3-metadata.adapter.ts`"
    when:
      - "se parsea el step 1 + su op y se lee la lógica del modo recordPattern en el adapter"
    then:
      - "step 1 es AUTOMATED, toolName=T3, op=customMetadata, type=npsp__Rollup__mdt, recordPattern='LastMembership', values={npsp__Active__c:false}"
      - "el subset se resuelve dinámicamente por DeveloperName-contains (SOQL LIKE), sin Ids ni DeveloperNames hardcodeados (update-only, nunca crea)"
      - "cada write se verifica por un SOQL read-back del record commiteado; el step tiene éxito solo si cada rollup matcheado lee de vuelta inactivo (npsp__Active__c=false)"
      - "ningún otro npsp__Rollup__mdt fuera del subset se modifica; el mutation es significativo (dev-proven live CamiloDevOrg: 8 Last-Membership rollups activos → 8 inactivos, cada uno read-back verificado, ya NO un no-op)"

  - title: "AC3 · Tolerate an org with zero matching rollups — when no npsp__Rollup__mdt DeveloperName contains the pattern, step 1 is a clean informational SUCCESS no-op (skipped outcome), creates no rollup, and does NOT fail the run (unlike allRecords, which flags an empty type)"
    tags:
      - ac-3
      - negative
      - tolerate-absent
      - custom-metadata
      - record-pattern
      - im-1084
    given:
      - "el modo recordPattern del op customMetadata en `t3-metadata.adapter.ts`"
    when:
      - "se lee la rama byPattern con discovered.length===0"
    then:
      - "cero matches devuelve un outcome con applied=false, skipped=true y detail 'no … records match DeveloperName pattern … (tolerate-absent)'"
      - "NO crea ningún record (update-only) y NO falla la corrida — es un success no-op informacional"
      - "contrasta con `allRecords`, que en un type vacío devuelve failedWrite (success=false) — la divergencia tolerate-absent es intencional y correcta (cubierto por el adapter unit test 'zero matches is a tolerate-absent SUCCESS no-op')"

  - title: "AC4 · SOQL LIKE metacharacters in the pattern match LITERALLY — a recordPattern containing an underscore (e.g. \"Foo_Bar\") is escaped so the underscore matches a literal underscore only, not any single char, so \"NPSP_Foo_Bar\" matches but \"FooXBar\" does NOT (reviewer-found LOW, fixed in the same PR)"
    tags:
      - ac-4
      - edge-case
      - like-escaping
      - record-pattern
      - injection-surface
      - im-1084
    given:
      - "la construcción del LIKE literal en `queryCmdtRecord` (t3-metadata.adapter.ts)"
    when:
      - "se lee el escaping del pattern y se corre el adapter unit test de metacaracteres LIKE"
    then:
      - "el pattern se escapa con escapeSoqlLiteral (quote/backslash) y LUEGO %→\\% y _→\\_ (escape char default de LIKE = \\), corriendo después del escapeSoqlLiteral para que el backslash agregado no se re-doble; solo los dos % wrapper del op quedan wild"
      - "un pattern 'Foo_Bar' matchea el underscore literal en 'NPSP_Foo_Bar' y NUNCA 'NPSP_FooXBar' (adapter unit test 'SOQL LIKE metacharacters match LITERALLY')"
      - "el pattern es un value (no un identifier) escapado al LIKE literal; los field/object names sí se validan como identifiers bare antes del SELECT/FROM → sin superficie de SOQL injection"

  - title: "AC5 · Idempotent re-run — when the Last-Membership rollups are already inactive, step 1 skips the already-satisfied records (no redundant write) yet still verifies and succeeds"
    tags:
      - ac-5
      - edge-case
      - idempotency
      - record-pattern
      - im-1084
    given:
