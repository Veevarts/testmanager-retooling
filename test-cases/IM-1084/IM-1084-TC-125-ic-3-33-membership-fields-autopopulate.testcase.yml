      - "re-lee el org-default y verifica que vnfp__Contact_Account_Fields_Auto_Population__c=true; throws VerifyException (step FAILED) si no"
      - "objeto/field API-names RECON-confirmados contra CamiloDevOrg (vnfp__Fundraising_Settings1__c con el sufijo '1' real; el flag boolean updateable) — dev-proven"

