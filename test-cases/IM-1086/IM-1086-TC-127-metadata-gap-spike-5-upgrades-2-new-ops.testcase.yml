  - title: "IC 5.2 · Configure the internal donation/membership notification — step 1 (T3 workflowAlert, reused op) sets the OWEA From sender and ADDS the operator recipient on the managed alert (preserving existing recipients); step 2 stays MANUAL to remove 'Account owner' (the Metadata API can add but not remove recipients)"
