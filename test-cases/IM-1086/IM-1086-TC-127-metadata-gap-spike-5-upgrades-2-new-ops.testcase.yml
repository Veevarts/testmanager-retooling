      - "read-back verify: masterLabel==esperado, count de items ok, y cada item encontrado por masterLabel + normalizeUrl(linkUrl); un write que no pega es success=false (no throw)"

  - title: "IC 6.04 · Set the Default Location custom-label override — step (NEW T3 translations op) upserts the en_US override of Auctifera__Default_Location = {{museumAddress}} via metadata.update('Translations') keyed by label name, without a destructive read-merge, and read-back verifies the value"
