key: "TC-127"
title: "IM-1086 Metadata-gap spike (12 ICs) — validate the 5 UPGRADES (IC 1 CDN · 5.2 internal notification · 3.29 help menu · 6.04 default location · 6.05 POS email) driven by 2 GENUINELY-NEW T3 ops (customHelpMenuSection + translations) plus reused settings/workflowAlert, and confirm the 7 stay-manual decisions are sound · CODE PR with genuinely-new ops"
description: |
  Cobertura QA para IM-1086 (Historia, priority Medium/manual-confidence, epic IM-735 Implementation
  Cases Automation).
  QA Sub-task asociada: IM-1132 (creada 2026-07-27).

  Contexto:
  - Post-June IM-735 continuation, Phase 3 — probe-first manual sweep sobre 12 ICs metadata-gap (la categoría
    con más chance de upgrade). Resultado del spike: **5 UPGRADED (auto/hybrid), 7 quedan manual** con evidencia live.
  - PR bajo prueba: `Veevarts/MigrationAppBackend#258` (**MERGED** 2026-07-16).
    Branch: `task/spike-metadata-gap-IM-1086`. Merge commit `a2ee3cbf` (base `5e6675e3` = IC 5.07/IM-1085 #257).
    16 files, +1369/-84.
  - **CODE PR con 2 ops GENUINELY-NEW** (a diferencia de los spikes spec-only): #258 TOCA adapter + domain model +
    lambda handler para agregar 2 ops T3 reusables nuevos:
    * `customHelpMenuSection` — upsert de una Lightning Help Menu section (masterLabel + items[{label,url,sortOrder}]),
      idempotente por fullName, read-back verify.
    * `translations` — upsert de custom-label overrides en_US (merge/upsert por name; SET-ONLY, no se pueden limpiar),
      NO read-merge (metadata.update('Translations') deja los demás labels intactos), read-back verify filtrado a los names.
    Files op: `t3-metadata.adapter.ts` (+272), `metadata-mutation-spec.ts` (+101), `t3-metadata.handler.ts` (+53), y sus
    3 spec.ts. Más los 5 spec .json + .spec.ts de los upgrades.

  Los 5 UPGRADES (cada uno v2, case+template lockstep):
  - IC 1 Session Settings (CDN) — AUTO, step T3 `settings` sobre LightningExperienceSettings.enableAuraCDNPref=true
    (op REUSADO). read→update→verify, idempotente.
  - IC 5.2 Internal Notification — HYBRID, step1 T3 `workflowAlert` (op REUSADO): setea OWEA sender + AGREGA operator
    recipient en Opportunity.vnfp__Internal_Donation_Membership_Notification (preserva recipients existentes); step2
    MANUAL: quitar 'Account owner' (la Metadata API puede ADD pero no REMOVE recipients).
  - IC 3.29 Help Menu — AUTO, step T3 `customHelpMenuSection` (op NUEVO): 'Veevart Resources' con 3 links fijos
    (Support, Documentation, Videos & Tutorials), idempotente por fullName.
  - IC 6.04 Default Location — AUTO, step T3 `translations` (op NUEVO): override en_US de Auctifera__Default_Location =
    {{museumAddress}}. upsert por label name, read-back.
  - IC 6.05 POS Email — HYBRID, step1 T3 `translations` (op NUEVO reusado): 5 labels Auctifera POS/ticketing con
    {{museumName}} + Exchange subject fijo; step2 MANUAL: setear Default Workflow User (no hay setting escribible).

  Los 7 que quedan MANUAL (decisiones del spike a re-verificar):
  - 5.05 Default Ack Status: managed picklist record-type default silently dropped — tras un RecordType deploy exitoso
    que setea el default de npsp__Acknowledgment_Status__c, una Donation Opp nueva inserta null (ground-truth vía anon
    Apex insert→requery→delete). El default de un Type standard SÍ persiste; el managed no. Refusal evidence fuerte.
  - 3.31 Queueable Delay: ApexSettings metadata type NO tiene field de enqueue-delay (retrieve completo) — sin API surface.
  - 3.18 Home Page Dashboards: per-app FlexiPage home pages + App-Default assignment + Dashboard components (dep de
    Reports-Package). Precedente FlexiPage (6.02/3.12).
  - 3.27 Museum Days Off: agrega MuseumDaysOff component al Company Info FlexiPage + days-off data. Precedente FlexiPage.
  - 5.19 Ack Letters: customización de CONTENT por cliente + signature image upload/URL. Inherentemente manual.
  - 5.04 Opportunity Stages (deferred): necesita un op NUEVO businessProcess/salesProcess + record-type assignment —
    fuera de scope de este spike (follow-up).
  - 6.01 Override Field Labels (deferred): Translation Workbench en_US feasible pero necesita un op CustomObjectTranslation
    distinto + resolución de field-API-names managed en 5 objetos (follow-up).

  Estrategia de verificación:
  - **jest + tsc + eslint como evidencia PRIMARIA** (CODE PR genuinely-new ops): clone en merge `a2ee3cbf`, correr los
    adapter/handler/domain `.spec.ts` (incl. los tests de los 2 ops nuevos) + los 5 lockstep + gates; re-derivar el
    conteo del dev (jest 1970 / 188 suites).
  - **genuinely-new audit**: probar con `git grep -c` que customHelpMenuSection y translations = 0 en base `5e6675e3`
    y >0 en merge `a2ee3cbf` (adapter + domain model) → 2 ops GENUINELY-NEW; y que settings/workflowAlert ya existen (reused).
  - **adapter code review independiente**: leer el diff de `t3-metadata.adapter.ts` (los 2 nuevos handlers) por cuenta
    propia — upsert/create-vs-update, merge-no-read-merge de translations (set-only), read-back verify, success=false no throw.
  - **spec fidelity independiente**: parsear los 5 specs v2 (steps + ops) por cuenta propia, no solo los lockstep.
  - **7 stay-manual findings**: re-verificar que cada rationale es defendible (esp. 5.05 con su ground-truth de managed
    picklist default drop, 3.31 sin API surface, 5.04/6.01 deferred con op nuevo requerido).
  - **NO hay live IE run en este QA**: la verificación live fue CamiloDevOrg-only (dev-proven, test data revertida) y los v2
    NO están seeded a MigrationApp-dev (seed PENDING-CREDS, AWS SSO expirado). Live = dev-proven/PENDING-CREDS, no PASS/FAIL prematuro.

  Riesgos abiertos (del ticket):
  - **Open question del ticket**: si los 6 cases flippeados deben agregarse a WORKING_CASE_IDS del master seed (3.16/3.05
    previos NO lo están). NOTA QA: IM-1090/#262 luego hizo la selección del master PREDICATE-BASED (todos los auto/hybrid
    siempre; EXCLUDE_FROM_MASTER = solo ic-veevart-auth) → en main actual los upgrades entran por el predicado sin pin
    (mismo hallazgo que en IM-1087/TR-136). Resuelto por IM-1090; no requiere pin.
  - **Deferred 5.04/6.01**: worth follow-up tickets (businessProcess op + customObjectTranslation op).
  - **Seed PENDING-CREDS**: los 5 v2 no seeded (append-only) → seed en cred refresh; bloquea re-correr via la app.
  - Verificado por el dev en CamiloDevOrg. QA re-verifica por código (los 2 ops nuevos tienen unit tests directos en el adapter spec).

