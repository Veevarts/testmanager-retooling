      - "step 2 es MANUAL: quitar 'Account owner' de los recipients (la Metadata API puede ADD pero no REMOVE recipients)"
      - "dev-proven live: reversible round-trip en CamiloDevOrg"

  - title: "IC 3.29 · Customize the Lightning Help Menu — step (NEW T3 customHelpMenuSection op) upserts a 'Veevart Resources' section with 3 fixed Veevart links (Support, Documentation, Videos & Tutorials), maps each item to {masterLabel,linkUrl,sortOrder}, is idempotent by fullName, and read-back verifies masterLabel + each item landed"
