schemaVersion: "1.0"

id: "6ed0d7ba-d369-4a1e-a990-f0df0c2596f6"
key: "TC-102"
title: "IC 5.23 Update Campaigns Page Layout — entrega HYBRID org-agnostic (1 AUTOMATED T2 + 2 MANUAL)"
description: |
  Cobertura QA para IM-1078 (Historia, priority Medium, epic IM-735 Implementation
  Cases Automation). QA Sub-task asociada: IM-1100 (creada 2026-07-16).

  Contexto del entregable:
  - Objetivo: entregar el IC 5.23 Update Campaigns Page Layout con confianza HYBRID
    a Implementations, con el fix org-agnostic que elimina el hardcode del
    recordType `Campaign.Default` (Medium driver del ticket).
  - Backend PR: `Veevarts/MigrationAppBackend#250` (squash-merged 2026-07-16T04:46Z)
    — case `ic-5-23-campaigns-page-layout` v3 + template v3. Un solo archivo
    tocado: `src/implementations/infrastructure/seeds/specs/ic-5-23-campaigns-page-layout.json`.
  - Composición: 1 step AUTOMATIZADO T2 + 2 steps MANUAL handoff.
    - Step 1 `assign-veevart-campaign-layout` (AUTOMATED T2, mode=assign, requiredInputs select 'campaignLayout')
    - Step 2 `reorder-end-date-below-start-date-manual` (MANUAL handoff)
    - Step 3 `assign-campaign-record-page-org-default-manual` (MANUAL handoff)

  Cambios clave del PR v2 → v3 (validables estáticamente):
  - `layout` hardcodeado `Campaign-vnfp__Veevart Campaign Layout V3 - Mar 2024`
    → reemplazado por `{{campaignLayout}}` (template) + `requiredInputs[0]`
    con `type: select` y `discovery.kind: layouts` sobre object Campaign.
  - `recordType: "Campaign.Default"` → **REMOVIDO del inputPayload**. La assign op
    ahora re-apunta TODAS las layout-assignments del Campaign object (default
    + per-record-type) al layout seleccionado — record-type-agnostic por diseño.
  - `feasibility: "auto"` → `"hybrid"`.
  - 2 nuevos steps MANUAL para End-Date reorder + Lightning Record Page org-default.

  Verificación previa del dev (per PR body 2026-07-16):
  - Sandbox: `CamiloDevOrg` (0 Campaign RecordTypes custom).
  - 6 Campaign layouts discovered, latest `Campaign-vnfp__Veevart Campaign Layout V3 - Mar 2024`.
  - 46 profiles discovered; T2 assign run con `recordType=null` →
    `verified=true, assigned=42, skippedNoAccess=4, success=true`.
  - Admin Profile read-back: layout landed en Campaign default assignment,
    zero `Campaign.Default` dependency.
  - Gates: ic-seeds bulk parseSpec 79/79 · tsc --noEmit clean · eslint clean.
  - `MigrationApp-dev` seed: **PENDING-CREDS** (expired AWS SSO) — case v3 no
    seedado todavía.

  Precondición diferencial en illinois-trainings (QA sandbox default):
  - **5 Campaign RecordTypes custom activos**: Event, Fundraising, General,
    Marketing, Volunteer_Campaign. Esto es la CONFIGURACIÓN OPUESTA a
    CamiloDevOrg (que no tiene RTs) — un test más fuerte del claim
    "record-type-agnostic": el step debe re-apuntar las 5 asignaciones
    per-RT + la default sin depender de `Campaign.Default`.
  - 6 Campaign layouts discoverable (mismos que CamiloDevOrg).

  Riesgos abiertos:
  - Ticket status = `Waiting For Test Env` → seed v3 no ha llegado a
    MigrationApp-dev (Camilo debe refrescar AWS SSO y reseedar). Hasta que
    eso pase, AC1-AC3 no pueden ejecutarse por MigrationApp UI. QA cierra
    AC6 estático + AC1 preview en illinois-trainings.
  - AC "no falla en org sin Campaign.Default" — illinois-trainings sí tiene
    Campaign RTs, no reproduce ese escenario en illinois; el escenario
    negativo (org sin RTs) ya está cubierto por la verificación del dev en
    CamiloDevOrg y por el análisis estático del spec.
  - PR body menciona "im696-tucson" con LIMITATION: "profile write-back fails
    with tabVisibilities errors" — no aplica a illinois-trainings pero
    documentado como riesgo cross-org.

type: integration
priority: medium

status: active

preconditions:
  - "Acceso a la sandbox illinois-trainings (adminveevart@ilhmec.org.trainings) con MigrationApp desplegado y el case `ic-5-23-campaigns-page-layout` v3 seedado en el catálogo dev."
  - "IE (Implementation Engineer) disponible para correr el plan desde la UI de MigrationApp; QA queda en modo observación + verificación de estado post-run."
  - "Setup → Object Manager → Campaign → Page Layouts accesible en la sandbox para inspeccionar layout assignments manualmente."
  - "Setup → Object Manager → Campaign → Lightning Record Pages accesible para AC5."
  - "Al menos un profile con acceso a Campaign object (illinois-trainings: Admin + otros)."
  - "PR MigrationAppBackend#250 mergeado a main; case v3 disponible en el catálogo dev cuando el seed refresque (bloqueado hoy por AWS SSO expired)."

format: gherkin
scenarios:
  - title: "AC1 · Operator selects Campaign layout from live-discovered options (no hardcoded name)"
    tags:
      - ac-1
      - happy-path
      - automated-t2
      - discovery
    given:
      - "una sandbox illinois-trainings con el managed package vnfp instalado y 6 Campaign layouts disponibles"
      - "el case `ic-5-23-campaigns-page-layout` v3 seedado en el catálogo del ambiente"
    when:
      - "el IE dispara el step 1 (`assign-veevart-campaign-layout`) desde MigrationApp"
      - "el run llega al input-park del select `campaignLayout`"
    then:
      - "MigrationApp presenta un `select` con opciones DESCUBIERTAS live del org (discovery kind `layouts`, object `Campaign`)"
      - "cada opción es la assignable fullName con el namespace del managed package reconstruido (ej. `Campaign-vnfp__Veevart Campaign Layout V3 - Mar 2024`)"
      - "NO aparece ninguna fullName version-suffixed hardcodeada en el spec (solo son opciones del select)"
      - "el operator selecciona la layout Veevart más reciente (`Campaign-vnfp__Veevart Campaign Layout V3 - Mar 2024` en illinois-trainings)"

  - title: "AC2 · Layout is assigned across all profiles with no Campaign.Default dependency"
    tags:
      - ac-2
      - happy-path
      - automated-t2
      - record-type-agnostic
    given:
      - "el operator seleccionó `Campaign-vnfp__Veevart Campaign Layout V3 - Mar 2024`"
    when:
      - "el step AUTOMATIZADO T2 (mode=assign) corre"
    then:
      - "descubre todos los profiles del org (illinois-trainings: N profiles; contabilizar)"
      - "re-apunta TODAS las layout-assignments del Campaign object al layout seleccionado sin pasar recordType (illinois-trainings: 5 RT-specific assignments + 1 default = 6 asignaciones por profile)"
      - "el step NUNCA referencia `Campaign.Default` (ni en el input, ni en el output verify)"
      - "un Profile read-back muestra el layout seleccionado en la Campaign default assignment + en cada per-RT assignment"
      - "el step verifica successfully (`verified=true, success=true, assigned>0`)"

  - title: "AC3 · Case does not fail on an org where Campaign has no custom record types"
    tags:
      - ac-3
      - edge-case
      - regression-evidence
      - camilodev
    given:
      - "un org cuyo Campaign object no tiene custom record types (solo Master) — reproducido en CamiloDevOrg per verificación del dev; illinois-trainings NO reproduce este caso (tiene 5 RTs)"
    when:
      - "el step AUTOMATIZADO T2 (mode=assign) corre en ese org"
    then:
      - "el step completa successfully"
      - "el run NO falla con error de tipo 'record type Campaign.Default not found' ni equivalente"
      - "evidencia dev en CamiloDevOrg 2026-07-15: 46 profiles, assign con recordType=null, verified=true, assigned=42, skippedNoAccess=4, success=true; Admin read-back muestra layout landed en default assignment, cero Campaign.Default"

  - title: "AC4 · End Date reorder is a structured manual handoff"
    tags:
      - ac-4
      - manual-handoff
      - awaiting-handoff
    given:
      - "el layout Veevart Campaign fue asignado como activo por el step 1"
    when:
      - "el run llega al step 2 (`reorder-end-date-below-start-date-manual`)"
    then:
      - "el step parkea AWAITING_HANDOFF sin fallar el plan"
      - "MigrationApp muestra guía estructurada al IE (`inputPayload.guide.actions[]` con 4 acciones): abrir Setup → Object Manager → Campaign → Page Layouts → editar el layout activo → arrastrar End Date debajo de Start Date en Campaign Information section → Save"
      - "documenta explícitamente que no hay Metadata-safe op para field-reposition (justificación de por qué es MANUAL)"
      - "estimatedMinutes=3 declarado"

  - title: "AC5 · Lightning Record Page org-default is a structured manual handoff"
    tags:
      - ac-5
      - manual-handoff
      - awaiting-handoff
    given:
      - "el layout Veevart Campaign fue asignado como activo por el step 1"
    when:
      - "el run llega al step 3 (`assign-campaign-record-page-org-default-manual`)"
    then:
      - "el step parkea AWAITING_HANDOFF sin fallar el plan"
      - "MigrationApp muestra guía estructurada al IE (`inputPayload.guide.actions[]` con 5 acciones): Setup → Object Manager → Campaign → Lightning Record Pages → seleccionar `Veevart Campaign Record Page` → View → Activation → Assign as Org Default → Desktop and phone → Save"
      - "guía instruye SKIP si `Veevart Campaign Record Page` no existe en el org (edge case explícito)"
      - "documenta que FlexiPage 'Assign as Org Default' no es subscriber-writable via CRUD Metadata API (justificación de MANUAL)"
      - "estimatedMinutes=4 declarado"

  - title: "AC6 · El case es org-agnostic: sin layout fullName hardcodeado, sin recordType Campaign.Default"
    tags:
      - ac-6
      - org-agnostic
      - static-analysis
    given:
      - "el JSON spec `ic-5-23-campaigns-page-layout.json` v3 (post-#250 mergeado)"
    when:
      - "QA hace grep estático del spec por (a) strings de layout fullName version-suffixed, (b) referencias a `Campaign.Default`, (c) hardcoded namespace prefixes"
    then:
      - "0 hits de layout fullName tipo `Campaign-vnfp__Veevart Campaign Layout V<n>` fuera del contexto del `select` (solo son ejemplos en descripción)"
      - "0 hits de `Campaign.Default` en `inputPayload` de cualquier step (permitido en `description` solo como texto explicativo del cambio)"
      - "el step 1 `inputPayload.layout` usa el template placeholder `{{campaignLayout}}`, no un valor literal"
      - "el step 1 `inputPayload` NO contiene la key `recordType`"

