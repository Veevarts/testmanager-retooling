key: "TC-146"
title: "NPS Survey Tool admin — Organizations sort/env-actions + Survey/Subject guided forms + Dashboard/Responses filters/CSV + Sync page removed"
description: |
  Cobertura QA para IM-1176 (Improve NPS admin management interface), del epic IM-970
  NPS Survey Tool delivery. QA Sub-task: IM-1194.

  El objetivo del ticket es reducir fricción en el workspace admin del Survey Tool:
  organizations sortable con acciones condicionales por entorno; sample data en dev
  utilizable como audiencia de encuestas; formularios guiados de survey y subject
  (con validación de path); Dashboard Summary + Responses con summary responsive,
  filtros, sorting, pagination, detalle y export CSV; página obsoleta de Sync
  eliminada.

  Repo en scope: `survey-tool`. Branch primaria: `feature/admin-ui-improvements`.
  Este TC valida SOLO las mejoras de admin UI — la sincronización con Salesforce
  ya está cubierta por IM-1165 / TC-145.

  PRs (5 en el bundle):
  · #56 MERGED (2026-08-12) `feature/admin-ui-improvements → develop` — mejoras admin iniciales
  · #57 MERGED (2026-08-13) `develop → staging` — primer promote
  · #59 MERGED (2026-08-13) `story/refine-admin-forms-and-organizations-IM-1176 → develop` — refinements
  · #60 MERGED (2026-08-13) `develop → staging` — refinements a staging
  · #58 OPEN                `staging → main` — promote a producción (pendiente)

  IM-1176 está deployed a staging pero NO a producción todavía. Ejecutar QA contra
  stg + dev; prd queda para post-merge del #58.

  Riesgos abiertos:
  · #58 (production promote) sigue OPEN — validar en prd solo tras merge.
  · Sample data en dev debe ser reversible / no contaminante — verificar que "Load
    sample data" no afecta stg ni prd.
  · Dashboard responsive + CSV export son áreas grandes con muchos edge cases;
    priorizar coverage funcional sobre exhaustividad de estilos.

