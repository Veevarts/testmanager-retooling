  - "Corroboración live: los TR-127/TR-129 (consumidores del mismo op en illinois-trainings) ya en el repo."
  - "OPCIONAL (si se aprueba live en el gate): Migration App session Cognito + IC 3.08 seeded para correr en illinois."

