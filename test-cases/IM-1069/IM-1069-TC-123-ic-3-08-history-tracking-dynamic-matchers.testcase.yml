id: "14ebafd2-f315-49fe-9726-c375ca9a31b6"
key: "TC-123"
title: "IM-1069 IC 3.08 Set History Tracking on Accounts & Contacts — org-agnostic fix: NEW T3 historyTracking run-time matchers (anyOf/label/pattern/optional) + exclusive + read-back-as-verdict, NEW recordTypePicklistDefaults op (Charge), case hybrid→auto · CODE PR (family carrier)"
description: |
  Cobertura QA para IM-1069 (Historia, priority Medium, epic IM-735 Implementation
  Cases Automation).
  QA Sub-task asociada: IM-1128 (creada 2026-07-27).

  Contexto:
  - Post-June IM-735 continuation, Batch A (history-tracking family). Este es el caso FUNDACIONAL
    de la familia (3.08) y CARGA el cambio del op; los hermanos (3.09, 5.06, 6.03, 7.02, 8.05) son
    consumidores spec-only. Ya QA'é 3.09 (IM-1070/TR-126), 5.06 (IM-1071/TR-129), 6.03 (IM-1072/TR-127).
  - **Tier: Medium** (caveat: cross-version managed history-field API name hardcodeado rompió la corrida
    cross-version — el bug que este PR arregla de raíz).
  - PR bajo prueba: `Veevarts/MigrationAppBackend#241` (**MERGED** 2026-07-15 19:08Z).
    Branch: `task/ic-3-08-history-tracking-dynamic-IM-1069`. Merge commit `9cb4cf51` (base `08cde759`).
    7 files, +1950/-89.
  - **CODE PR** (dos ops genuinely-new + spec v2). Toca el adapter/handler/schema del T3 + el spec:
    * `metadata-mutation-spec.ts` (+125/-8) + `.spec.ts` (+13) — schema de MetadataFieldRef (matcher) + nuevo op
    * `t3-metadata.adapter.ts` (+845/-47) + `.spec.ts` (+782/-6) — implementación de matchers/exclusive/read-back + recordTypePicklistDefaults
    * `t3-metadata.handler.ts` (+48/-6) + `.spec.ts` (+43) — wiring del handler
    * `ic-3-08-history-tracking-accounts-contacts.json` (+94/-22) — spec v2

  Cambios del op (catalog-declarative, zero per-IC code):
  1. **historyTracking run-time matchers (MetadataFieldRef)**: `fields`/`disableFields` pueden ser
     matchers `{anyOf, label, pattern, optional}` resueltos contra el org LIVE tras el read del objeto.
     anyOf=candidatos ordenados (Contact `Auctifera__Current_Membership_Program1__c` vs Account `..._Program__c`);
     label=match por UI-label (FieldDefinition SOQL, Data API); pattern=regex único; optional=tolera ausencia
     per-version (vnfp sin NFP Fundraising) como nota; misses required/ambiguos fallan STRICT.
  2. **historyTracking exclusive:true**: destrackea todo otro field tracked (el "uncheck all defaults" del
     playbook, inherentemente org-specific). Requiere keep-list no vacío. Límite: el toggle standard 'Record
     Type' no tiene CustomField en el metadata read → queda UI-only.
  3. **read-back verify ES el veredicto** (no el write report): el replay del whole-CustomObject reporta
     failure (Account.Tier de Data.com rechaza round-trip) mientras el tracking SÍ commitea; el read-back decide.
  4. **NEW op recordTypePicklistDefaults** (Part B, antes MANUAL): resuelve el record type por label/devName
     en run time (Charge devName `Auctifera__Reservation`, label "Charge"); expectSole=true asserta que es el
     ÚNICO RT (extras fallan STRICT con el Setup path — no se borran por API); limpia los defaults per-RT
     ("—None—") vía RecordType metadata read→merge→write→read-back; picklist sin asignación pasa vacuously.
  5. **Handler boundary validation** acepta matcher objects + valida la shape del op nuevo.

  Spec v2 (feasibility **auto**, hybrid→auto; el step manual v1 "Verify Default List in Charge" desaparece):
  - Step 1 (T3 historyTracking, exclusive) Account: 7 fields como matchers (anyOf+label), vnfp optional.
  - Step 2 (T3 historyTracking, exclusive) Contact: 8 fields como matchers (Program1 first → unsuffixed → label).
  - Step 3 (T3 recordTypePicklistDefaults, NEW, AUTOMATED) Charge: expectSole + clear defaults en 5 picklists.

  Estrategia de verificación:
  - **jest code-contract (PRIMARIO)**: clone en merge `9cb4cf51`, npm ci, correr las suites del t3-metadata
    adapter (+782) + handler + schema; aislar los tests de matchers (anyOf/label/pattern/optional), exclusive,
    read-back-as-verdict, y el op nuevo recordTypePicklistDefaults (expectSole, clear defaults, vacuous pass).
  - **genuinely-new proof**: base `08cde759` vs merge `9cb4cf51` — recordTypePicklistDefaults + MetadataFieldRef/
    anyOf ausentes en base.
  - **static spec fidelity**: ic-3-08 v2 auto, 3 steps, matchers + exclusive + op nuevo.
  - **live corroboration**: este op YA se ejercitó live en illinois-trainings a través de los consumidores que
    QA'é (5.06 Part A matchers npe01/vnfp = TR-129; 6.03 exclusive = TR-127). Two-org dev proof (CamiloDevOrg +
    Tucson). Re-correr IC 3.08 live via la app es opcional (upgrade en el gate) si el caso 3.08 está seeded.

  Riesgos abiertos:
  - **exclusive destructivo**: destrackea todo fuera del keep-list en Account y Contact.
  - **Record Type UI-only límite**: el toggle standard 'Record Type' no se destrackea por metadata (documentado).
  - **Account.Tier write-error**: el write reporta failure por Data.com Tier; el read-back es el veredicto (nuance
    verificado por jest).
  - Verificado por el dev en CamiloDevOrg + Tucson (two-org). QA re-verifica por código + corroboración de consumidores.
  - PR ya MERGED — base `08cde759` vs merge `9cb4cf51`.

