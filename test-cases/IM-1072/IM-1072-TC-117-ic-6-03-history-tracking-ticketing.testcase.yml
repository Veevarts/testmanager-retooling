key: "TC-117"
title: "IC 6.03 History Tracking for Ticketing — v3 org-agnostic EXCLUSIVE keep-list (4 objects 7/17/15/7) + IM-1069 matchers · formula-twin resolution (Total_Amount_2/Total_Visitors_3) · abort-before-write safety · 1 MANUAL Name handoff (spec-only, hybrid)"
description: |
  Cobertura QA para IM-1072 (Historia, priority Medium, epic IM-735 Implementation
  Cases Automation).
  QA Sub-task asociada: IM-1122 (creada 2026-07-24).

  Contexto:
  - Post-June IM-735 continuation, Batch A (history-tracking family). Hermano de
    IM-1070 (IC 3.09 financial) e IM-1073 (IC 7.02 gift shop); consume los matchers
    runtime de IM-1069 (IC 3.08).
  - IC 6.03 = "Set History Tracking for Ticketing" (Order__c 6.03 en el catálogo
    Auctifera SF, Id a185w00000trMP4AAM).
  - **Tier: Medium** (caveat: cross-version managed field/object API names — mitigado
    por el matcher runtime de IM-1069, que este PR consume).
  - PR bajo prueba: `Veevarts/MigrationAppBackend#244` (**MERGED** 2026-07-15 21:04Z).
    Branch: `task/ic-6-03-history-tracking-ticketing-IM-1072`. Merge commit `140e00d4`.
  - **SPEC-ONLY PR** (1 file, +218/-55): solo `ic-6-03-history-tracking-ticketing.json`
    (v2 → v3). NO agrega código ni op nuevo — reutiliza el T3 `historyTracking` con los
    matchers de IM-1069 y su modo `exclusive`.

  Diferencia CLAVE vs IC 3.09 (IM-1070): este caso corre en **modo EXCLUSIVE** (destructivo).
  Cada objeto termina con EXACTAMENTE su keep-list tracked y NINGÚN otro field — los fields
  tracked que no estén en la keep-list se DESTRACKEAN. Es la propiedad de mayor riesgo del PR.

  Forma del spec v3 (5 steps, feasibility **hybrid**):
  - Steps 1-4 (T3 historyTracking, AUTOMATED, `exclusive: true`):
    * Exhibition/Event = `Auctifera__Inventory_Service__c` — 7 fields
    * Ticket Item = `Auctifera__Museum_Offer_Item__c` — 17 fields
    * Ticket Offer = `Auctifera__Museum_Offer__c` — 15 custom fields
    * Ticketing/Reservation = `Auctifera__Group_Reservation__c` — 7 fields
  - Step 5 (MANUAL): tickear 'Ticket offer name' (standard Name field de Museum_Offer,
    sin CustomField record → metadata replay no puede setearlo; exclusive enumera solo
    CustomFields, así que NUNCA destrackea el Name estándar).
  - Total: 46 custom fields via matcher, todos org-agnostic (0 API names hardcoded).

  Traps resueltos por los matchers (verificar live):
  - **Formula-twins (Group_Reservation)**: Total → `Auctifera__Total_Amount_2__c` (NO el
    formula `Total_Amount__c`); Total Visitors → `Auctifera__Total_Visitors_3__c` (NO el
    formula `Total_Visitors_2__c`). Trackear un formula field es imposible en SF, así que
    resolver al twin equivocado rompería el write exclusive completo.
  - Amount Received=`Paid_Value__c`; Start Date=`Open_Hour__c`; Close Date=`Close_Hour__c`;
    Exhibition/Event(label)=`Exposition__c`; Ticket=`Group_Reservation__c`; Ticket item
    subtotal=`Subtotal_amount__c`; Ticket item amount=`Subtotal_before_discount__c`.

  Ejecución: config-plan IC via Migration App (target-side, Path A API-driven). PRE → IE
  run → POST-verify por AC en illinois-trainings, más idempotency check. El step MANUAL
  parkea como handoff (attesting-without-executing en el test workspace).

  Riesgos abiertos:
  - **Exclusive destructivo**: si illinois tiene fields tracked fuera de la keep-list, el
    run los destrackea. QA captura PRE (set actual) vs POST (exactamente keep-list) y
    confirma que la reducción es correcta, no un borrado accidental.
  - **Formula-twins**: si el matcher resuelve al twin formula, el step exclusive falla o
    trackea el field equivocado. QA verifica por describe (calculated=true en el formula)
    + read-back (cuál twin quedó tracked).
  - **Abort-before-write (AC5)**: si un matcher required no resuelve, el op debe abortar
    ANTES de cualquier untrack (no destructive) y reportar success=false con el matcher
    fallido — contrato del op de IM-1069 (PR #241/#245), ya testeado; se cita, no se
    fuerza rompiendo el describe del org.
  - **Additive vs exclusive**: aquí exclusive SÍ está activo (a diferencia de IC 3.09).
  - Verificado por el dev en CamiloDevOrg + im696-tucson (two-org proof Medium→High);
    QA re-verifica independientemente en illinois-trainings (3er org).
  - PR ya MERGED — comparación v2 (base) vs v3 (merge-commit `140e00d4`).

