key: "TC-116"
title: "IC 3.09 History Tracking for Financial Objects & POS Purchase Setup — v3 playbook realignment (5 objects) + IM-1069 run-time matchers (fully-auto, spec-only) · picklist ADD idempotent · 46 fields read-back · two-org proof"
description: |
  Cobertura QA para IM-1070 (Historia, priority Medium, epic IM-735 Implementation
  Cases Automation).
  QA Sub-task asociada: IM-1121 (creada 2026-07-24).

  Contexto:
  - Post-June IM-735 continuation, Batch A (history-tracking family). Hermano de
    IM-1073 (IC 7.02 Gift Shop) e IM-1069 (IC 3.08, que agregó los matchers runtime).
  - IC 3.09 = "Set History Tracking for Financial Objects & POS Purchase Setup"
    (Order__c 3.09 en el catálogo Auctifera SF, Id a185w00000mt8quAAA).
  - **Tier: Medium** (caveat: cross-version managed field/object API names — mitigado
    por el matcher runtime de IM-1069, que este PR consume).
  - PR bajo prueba: `Veevarts/MigrationAppBackend#242` (**MERGED** 2026-07-15 19:46Z).
    Branch: `task/ic-3-09-history-tracking-financial-IM-1070`. Merge commit `81ada09`.
  - **SPEC-ONLY PR** (1 file, +226/-82): solo
    `ic-3-09-history-tracking-financial-objects.json` (v2 → v3). NO agrega código ni
    op nuevo — reutiliza el T3 `historyTracking` con matchers de IM-1069 (PR #241) y
    el modo ADD del op `picklistValues`. Por eso NO hay jest-code-contract aquí; la
    verificación estática es fidelidad del spec + alineación al playbook CSV.

  Cambio principal (v2 → v3, tres ejes):

  **EJE 1 — Realineación del object set al playbook (AC1)**:
  - v2 rastreaba POS Purchase, Charge, **Transaction (`Transaction_2__c`)** y
    **Transaction Payment (`Transaction_Payments__c`)** — una adivinanza pre-playbook.
  - v3 los reemplaza por los 5 objetos del playbook: POS Purchase, Charge,
    **Charge Item (`Charge_Item__c`)**, **Refund (`Refund__c`)** y
    **Refunded/Canceled Item (`Refunded_Item__c`)**. Los 2 steps Transaction /
    Transaction Payment quedan ELIMINADOS; se agregan 3 steps nuevos.
  - `feasibility: "auto"` — 6 steps, todos AUTOMATED/T3, sin manual/handoff.

  **EJE 2 — Cero field names managed hardcoded (AC4)**:
  - Todos los fields pasan de string literal a matcher `{anyOf:[apiName], label,
    pattern?, optional?}` (patrón IM-1069). Managed Auctifera field API names driftean
    entre versiones del package, así que cada field se resuelve AT RUN TIME por
    candidatos + fallback de UI-label en vez de un nombre fijo.
  - Label-to-API traps documentados: Client (Contact)=`Client__c`,
    Client (Household/Organization)=`Client2__c` (con `pattern: "Client2__c$"` porque
    su LABEL mismo driftea a "Client (Organization/Household)"), Payment Date=`Sold_Date__c`,
    Payment Id=`External_Id__c`, y el object-name trap Refunded/Canceled Item cuyo API
    real es `Auctifera__Refunded_Item__c`.
  - vnfp-namespace fields marcados `optional: true` (Charge: Membership=`vnfp__Opportunity__c`,
    Donation=`vnfp__Donation__c`; Charge Item: Opportunity Payment=`vnfp__Opportunity_Payment__c`,
    Opportunity=`vnfp__Opportunity__c`) → un org sin el package NFP Fundraising igual pasa.

  **EJE 3 — POS Purchase Source picklist a ADD real (AC2)**:
  - v2 corría el step Source en `ensureOnly` (read-only assertion). v3 lo mueve a
    order 1 (playbook part A primero) y usa el modo ADD del op: los valores faltantes
    se agregan al LOCAL value set; un field que ya tiene todos los valores skipea la
    escritura (idempotente). Ambos orgs de verificación del dev ya están satisfechos.

  Conteos del playbook (AC3) — verificados contra el CSV Order 3.09:
  - POS Purchase: 14 fields · Charge: 14 (2 vnfp opcionales) · Charge Item: 7 (2 vnfp
    opcionales) · Refund: 7 · Refunded/Canceled Item: 4. Total 46 fields + object-level
    history en los 5 objetos + 7 valores de picklist.

  Ejecución: config-plan IC via Migration App (target-side, Path A API-driven). PRE →
  IE run → POST-verify por AC en un dev/training workspace (illinois-trainings), más
  idempotency check. Fully-auto → el run completa `total=6 done=6 failed=0` sin
  attestation (no hay steps MANUAL que atestar).

  Evidencia dev (per ticket + PR #242):
  - Two-org proof: CamiloDevOrg + im696-tucson, spec v3 completa en ambos, matchers
    resolviendo por org (Medium→High).
  - Object-set realineado, matchers, y ADD picklist confirmados en el diff.

  Riesgos abiertos:
  - **Tier Medium**: la portabilidad depende de que los matchers reconstruyan el
    prefijo namespaced en el org objetivo. QA re-verifica independientemente en
    illinois-trainings (tercer org, distinto de los 2 del dev).
  - **vnfp opcional**: si illinois-trainings no tiene NFP Fundraising, Charge y Charge
    Item deben completar igual (los 4 vnfp fields se saltan sin fallar). QA lo confirma.
  - **Additive (no exclusive)**: el flag `exclusive` está ausente → tracking
    pre-existente se preserva. Si alguien lo flipea a true, borraría tracking existente.
  - **AC4 negative path** (matcher required que resuelve a nada/ambiguo → falla con
    error preciso, no silent skip) es contrato del op de IM-1069 (PR #241), ya cubierto
    por sus tests; aquí se cita, no se re-ejecuta forzando un break del org.
  - PR ya MERGED — la comparación es v2 (base) vs v3 (merge-commit `81ada09`).

