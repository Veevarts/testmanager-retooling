  - title: "AC3 · Error Log recipient — add the admin user — step 3 adds the admin user (resolveUserByName or literal Username) to the Error Log Email Alert's recipients and reads it back; a blank optional input simply skips the recipient (does not fail the step); the add is idempotent and never removes existing recipients"
    tags:
