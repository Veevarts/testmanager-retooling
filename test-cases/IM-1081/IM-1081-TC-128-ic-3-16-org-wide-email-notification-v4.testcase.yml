id: "c0dd92d1-d9a1-45e9-b18a-ef1580299943"
key: "TC-128"
title: "IM-1081 IC 3.16 Org-Wide Email Address & Email Notification (v3→v4, medium-confidence) — validate the upgrade from 1 auto + handoffs to 1 MANUAL + 3 AUTOMATED steps, driven by a GENUINELY-NEW T3 workflowAlert op (senders on ~21 Email Alerts + Error Log recipient) plus reused customMetadata allRecords (Fundraising Settings sender) + T6 (POS) · CODE PR with a genuinely-new op"
description: |
  Cobertura QA para IM-1081 (Historia, priority Medium/medium-confidence, epic IM-735 Implementation
  Cases Automation).
  QA Sub-task asociada: IM-1133 (creada 2026-07-27).

  Contexto:
  - Post-June IM-735 continuation, Batch D (decision & verify). IC 3.16 pasa de _1 automated step + handoffs_
    a _1 MANUAL handoff + 3 AUTOMATED steps_. Tier Medium (caveat: cross-test en Tucson quedó NORESULT/transport;
    scope entregado = CamiloDevOrg only, Tucson out of scope).
  - PR bajo prueba: `Veevarts/MigrationAppBackend#253` (**MERGED**).
    Branch: `task/ic-3-16-org-wide-email-IM-1081`. Merge commit `545e2cb0` (base `adcef7d2` = IM-1080 #252).
    13 files, +1706/-27.
  - **CODE PR con 1 op GENUINELY-NEW** (a diferencia de los spikes spec-only): #253 introduce el op T3
    `workflowAlert` (adapter +493/-3, domain model +142) + infra de soporte (operator-input-templating +50,
    resolve-ready-steps handler +60 para el orden secuencial manual→automated, metadata-mutation-result +10) +
    el spec IC 3.16 v3→v4. Este PR es el ORIGEN del op workflowAlert que IM-1086/#258 (IC 5.2) luego reutilizó.

  Op nuevo (T3 workflowAlert): configura Email Alerts (WorkflowAlert) vía sync CRUD Metadata API — read →
  set OWEA From sender (senderType=OrgWideEmailAddress + senderAddress) y/o append recipients → write → re-read + assert.
  - OWEA resuelto DINÁMICAMENTE del sObject OrgWideEmailAddress por address/displayName (nunca Id/address hardcodeado);
    requireVerified default true → un OWEA no verificado/ausente = applied=false con mensaje (nunca throw).
  - `ensure[{fullName, anyOf?, skipSender?, addRecipients?}]`: anyOf drift-tolerant (primer fullName existente gana);
    tolerate-absent (un org sin un package simplemente no tiene sus alerts); idempotente; NO toca alerts client-custom.
  - Recipients: resolveUserByName (por display Name, exactamente 1 user activo) o Username literal; valor opcional en
    blanco se SKIPea (no falla el step); add idempotente (no remueve existentes).

  IC 3.16 v4 (feasibility hybrid, 4 steps):
  - Step 1 (MANUAL): crear & verificar el OWEA (round-trip de email externo — solo un humano hace click al link).
  - Step 2 (AUTOMATED T3 customMetadata, allRecords, op REUSADO): setea vnfp__Emails_Sender_Address__c en TODOS los
    Fundraising Settings records vía sync CRUD Metadata API; commitea + read-back en managed (vnfp__Default) y unmanaged
    (Default). Corrige el hallazgo v3 (el no-op era el path async Apex, NO el sync CRUD).
  - Step 3 (AUTOMATED T3 workflowAlert, op NUEVO): setea el OWEA sender en los ~21 Email Alerts nombrados
    (Veevart/NPSP) + agrega el admin al Error Log recipient.
  - Step 4 (AUTOMATED T6, op REUSADO): setea Auctifera__Emails_Sender_Address__c en el org-default
    Auctifera__POS_Settings__c (upsert + SOQL read-back), org-agnóstico ({{orgWideEmail}} token).

  Estrategia de verificación:
  - **jest + tsc + eslint como evidencia PRIMARIA** (CODE PR genuinely-new op): clone en merge `545e2cb0`, correr
    el adapter/handler/domain `.spec.ts` (incl. los tests de workflowAlert) + el lockstep de 3.16 + gates;
    re-derivar el conteo del dev (jest full suite).
  - **genuinely-new audit**: probar con `git grep -c` que workflowAlert = 0 en base `adcef7d2` y >0 en merge
    `545e2cb0` (adapter + domain model) → op GENUINELY-NEW; y que customMetadata allRecords / T6 ya existen (reused).
  - **adapter code review independiente**: leer el diff del handler workflowAlert por cuenta propia — dynamic OWEA
    resolution, requireVerified→applied=false (no throw), anyOf/tolerate-absent, add-recipient idempotente, read-back.
  - **spec fidelity independiente**: parsear el spec v4 (4 steps + el ensure de 21 alerts) por cuenta propia.
  - **NO hay live IE run en este QA**: la verificación live fue CamiloDevOrg-only (dev-proven; el sender commit
    full-green no se puede demostrar sin verificar un OWEA real vía mailbox externo — dependencia manual inherente) y
    el v4 NO está seeded a MigrationApp-dev (seed PENDING-CREDS, AWS SSO expirado). Live = dev-proven/PENDING-CREDS,
    no PASS/FAIL prematuro.

  Riesgos abiertos (del ticket):
  - **Tucson NORESULT (transport)**: el cross-test en Tucson quedó inconcluso; scope entregado = CamiloDevOrg only.
    Documentado; no bloquea el delivery (el op es org-agnóstico).
  - **OWEA verified es dependencia manual inherente**: el sender commit full-green requiere un OWEA verificado (click en
    mailbox externo) — por eso step 1 queda MANUAL y el probe muestra applied=false controlado hasta verificar.
  - **Seed PENDING-CREDS**: v4 no seeded (append-only) → seed en cred refresh; bloquea re-correr via la app.
  - Verificado por el dev en CamiloDevOrg. QA re-verifica por código (el op nuevo tiene unit tests directos en el adapter spec).

type: integration
priority: medium
status: active

preconditions:
  - "GitHub CLI (`gh`) autenticado — diff + árbol en merge `545e2cb0` y base `adcef7d2` de MigrationAppBackend."
  - "Clone local de `MigrationAppBackend` con `npm ci` limpio + jest/tsc/eslint (CODE PR genuinely-new op: evidencia primaria por código, incl. adapter unit tests)."
  - "Node + jq/python3 para parsear el spec v4 y leer el diff del adapter/domain model/handler independientemente."
  - "NO se requiere org ni IE run: live fue CamiloDevOrg-only (dev-proven; sender full-green depende de un OWEA verificado, manual) y el v4 no seeded (seed PENDING-CREDS)."

