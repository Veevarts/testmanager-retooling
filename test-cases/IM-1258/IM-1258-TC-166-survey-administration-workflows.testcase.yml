schemaVersion: "1.0"

id: "dc8c485c-cd2c-4e53-a07f-a042223965f3"
key: "TC-166"
title: "Survey administration defaults: Newest ordering, General filter, local-date Start Date, template reset and blocking validation surfaced in a modal — IM-1258"
description: |
  Test case para IM-1258 (Historia, priority **Medium**) — epic IM-970 NPS Survey Tool
  delivery — QA Sub-task IM-1267. Repositorio: `survey-tool`. PR bajo prueba: "PR 71"
  (MERGED a `develop` el 2026-09-11). Cubre solo la porcion de IM-1258.

  La historia agrupa cinco refinamientos de la administracion: el filtro General y el orden
  Newest por defecto en la lista, el Start Date inicializado con la fecha LOCAL de hoy, la
  restauracion de preguntas al volver Template a None, la validacion bloqueante presentada en
  un modal visible desde cualquier posicion de scroll, y la separacion visual entre un picklist
  y la accion Next o Submit contigua.

  Riesgo a vigilar: el AC del Start Date dice "current local date". Como el resto del dashboard
  evalua fechas en UTC (observacion O1 de TR-177), hay que comprobar que aqui si se use la zona
  local y no heredar la suposicion.
type: functional
priority: medium
status: active

preconditions:
  - "Entorno de Survey Tool con `develop` desplegado y credenciales de administrador."
  - "Encuestas existentes suficientes para ejercitar el filtro y el orden de la lista."
  - "Una plantilla disponible para ejercitar la transicion de Template a None."
  - "Un formulario con contenido suficiente para requerir scroll, de modo que el modal de validacion se pueda evaluar desde el final de la pagina."
format: gherkin
scenarios:
  - title: "AC1 · The Surveys list defaults to Newest ordering and offers General as a filter"
    tags: [ac-1, happy-path, admin-ui]
    given:
      - "un administrador que abre la pagina de Surveys sin haber elegido ningun orden"
    when:
      - "la lista termina de cargar"
    then:
      - "el selector de orden muestra Newest como valor seleccionado"
      - "el selector de filtro ofrece General entre sus opciones"
      - "las encuestas se listan de la mas reciente a la mas antigua"

  - title: "AC2 · A new survey form initializes Start Date with the current local date and lets the admin change it"
    tags: [ac-2, happy-path, timezone]
    given:
      - "un administrador que abre el formulario de creacion de una encuesta"
    when:
      - "el formulario se inicializa"
    then:
      - "el campo Start Date trae la fecha local de hoy, no la fecha UTC"
      - "la fecha sigue siendo la local incluso en las horas finales del dia en que UTC ya avanzo al dia siguiente"
      - "el administrador puede cambiarla antes de guardar"

  - title: "AC3 · Returning Template to None clears the template questions and restores the default ones"
    tags: [ac-3, edge-case, form-state]
    given:
      - "un borrador de encuesta con una plantilla seleccionada y sus preguntas cargadas"
    when:
      - "el administrador cambia Template a None"
    then:
      - "las preguntas provenientes de la plantilla desaparecen del formulario"
      - "se restauran las preguntas por defecto de la encuesta"
      - "no queda ningun residuo de la plantilla anterior al guardar"

  - title: "AC4 · Blocking validation, including audience overlap, is presented in a modal visible from any scroll position"
    tags: [ac-4, negative, validation]
    given:
      - "un formulario de encuesta incompleto o con una audiencia que se solapa con otra activa"
      - "y la pagina desplazada hasta el final, lejos de los campos en conflicto"
    when:
      - "el administrador intenta guardar"
    then:
      - "aparece un modal con los errores accionables"
      - "el mensaje es visible sin importar la posicion de scroll en la que estaba el usuario"
      - "el conflicto de audiencias se explica de forma que el administrador sepa que encuesta lo causa"
      - "la guia a nivel de campo se conserva junto a los campos afectados"

  - title: "AC5 · A picklist that precedes a Next or Submit action keeps visible spacing from it"
    tags: [ac-5, ui-spacing]
    given:
      - "un formulario donde un control de tipo picklist queda inmediatamente antes de la accion Next o Submit"
    when:
      - "el formulario se renderiza"
    then:
      - "existe separacion visible entre el control y la accion"
      - "el desplegable abierto no tapa la accion ni induce a pulsarla por error"
