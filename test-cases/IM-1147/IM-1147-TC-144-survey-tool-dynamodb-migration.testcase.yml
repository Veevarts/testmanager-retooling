key: "TC-144"
title: "Survey Tool persistence migration to DynamoDB — infra, runtime contracts, cutover, and prod-ops posture"
description: |
  Cobertura QA para IM-1147 (Migrate Survey Tool persistence to DynamoDB), del epic
  IM-970 NPS Survey Tool delivery. QA Sub-task: IM-1186.

  El PR runtime principal es survey-tool #45 (2026-08-04, MERGED a `main`) y su tren de
  promoción #48 → #49 → #51 → #52. La infraestructura CDK vive en #35 (MERGED a
  `epic/nps-survey-delivery-and-metrics` → main vía #36).

  Este TC valida el trabajo POST-MERGE: las tres orgs (dev/stg/prd) ya sirven contra
  DynamoDB y los contratos públicos + admin ya cambiaron de SQLite/Drizzle a
  `DynamoSurveyStore`. QA verifica:
  · aislamiento por entorno (AC1),
  · CDK-managed infra sin AWS CLI (AC2),
  · access patterns sin broad scan (AC3),
  · contratos públicos preservados (AC4),
  · contratos admin y export CSV preservados (AC5),
  · migración validada por contadores + relaciones + muestra + export (AC6),
  · rollback recuperable sin corromper prod (AC7),
  · postura ops en prod: encryption, IAM least-privilege, backups/PITR, observabilidad,
    cost caps (AC8).

  Contexto ya conocido (TR-158): el bundle `index-9Qd0lrHV.js` es idéntico entre dev y
  staging (y distinto en prd); las rutas admin devuelven 401 sin sesión; el CSV export
  responde en text/csv con 28 columnas; el eligible endpoint funciona con corte
  (respondent, org). Esa evidencia se reusa donde aplica, no se re-ejecuta.

