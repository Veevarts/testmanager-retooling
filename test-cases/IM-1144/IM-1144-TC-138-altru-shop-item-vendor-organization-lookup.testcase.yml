preconditions:
- 'Clone de `MigrationToolETL` con la rama `fix/shop-item-vendor-lookup-IM-1144` y su commit base en `main`, para correr suites y revert-proof'
- 'Node + Docker levantados: el PR toca el fixture de testcontainers y el propio PR reporta `npm run test:queries:docker` como el paso de CI que hay que reproducir'
- '⚠️ Perfil safesql de **Long Island Children''s Museum** — HOY NO EXISTE. Sin él no se pueden re-derivar las cifras del PR contra la fuente del ticket. Si no se consigue, se usa otra fuente Altru con `PRODUCTVENDOR` (`tucson` / `illinois_2` / `aspen`) para validar COMPORTAMIENTO y se declara que las cifras quedan sin verificar'
- 'Acceso de lectura a `AuctiferaDX` (o a una org con el paquete) para confirmar que `CatalogItem__c.Primary_Vendor__c` existe, es `Lookup(Account)` y que `Account.Implementation_External_ID__c` es `externalId=true, unique=true`'
