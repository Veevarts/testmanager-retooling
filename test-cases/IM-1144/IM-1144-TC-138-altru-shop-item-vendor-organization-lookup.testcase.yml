key: TC-138
title: IM-1144 — Shop Items Vendor lookup — the catalog_item extraction resolves the latest ORGANIZATION vendor per product, emits it through the Account external-ID relationship header without inflating row count, and leaves non-organization vendors blank instead of a dangling id
description: |
  Cobertura QA de IM-1144 (**Campo Vendor Faltante en Query de Shop Items — Lookup a Organizations
  No Migrado**), bajo el epic **IM-70 Altru Queries**. QA Sub-task asociada: **IM-1157**.
  Cuenta nombrada en el ticket: **Long Island Children's Museum**.

  ## Qué pide la historia

  El query de **Shop Items** no incluye el campo **Vendor** (en Salesforce, un lookup a
  Organizations), así que los Shop Items migran sin su vendor asociado. La acción pedida es agregar
  el campo al query y mapearlo correctamente como lookup a la entidad Organization.

  ## ⚠️ La historia NO trae Acceptance Criteria formales

  La descripción son cuatro líneas: cuenta, síntoma y *action needed*. **No hay ACs numerados, ni
  ejemplos concretos de producto/vendor, ni conteos esperados.** No se rechaza porque el
  comportamiento SÍ es inferible y está descrito, pero **los criterios que se validan acá los
  derivó QA** leyendo la descripción y el diff del PR. Dev/PM deberían confirmarlos o corregirlos.

  Criterios derivados (a confirmar):
  1. El query de Shop Items emite el campo Vendor.
  2. El Vendor resuelve como **lookup a una Organization** en Salesforce, no como texto ni como id crudo.
  3. Agregar el campo **no altera el universo de Shop Items** que se migra (sin fan-out, sin pérdida).
  4. Un vendor que **no** migra como Organization no debe producir un id colgado.

  ## PR bajo prueba

  **MigrationToolETL [#161](https://github.com/Veevarts/MigrationToolETL/pull/161)** —
  `fix(shop): populate Vendor lookup on Shop Items IM-1144`,
  rama `fix/shop-item-vendor-lookup-IM-1144` → base `main`. **Estado: OPEN** (+184/−2, 7 archivos).

  | Archivo | Rol en el cambio |
  | --- | --- |
  | `queries/shop/catalog_item.sql` | agrega el `OUTER APPLY` del vendor y la columna de salida |
  | `domain/model/catalog-item-record.entity.ts` | agrega `primaryVendorId` |
  | `destination/sql-server/mappers/catalog-item.mapper.ts` | lee la columna y la parsea como nullable |
  | `application/pipelines/catalog-item.pipeline.ts` | declara el header en el CSV |
  | `query-regression/catalog-item-vendor-query.spec.ts` | **nuevo**, lockea el contrato |
  | `query-regression/shop-discount-query-fixture.ts` | agrega tabla `PRODUCTVENDOR` + filas sembradas |
  | `query-regression/shop-discount-query.integration.spec.ts` | assertion del fallback en testcontainer |

  ## Lo que realmente hace el cambio (leído del diff, no del body del PR)

  ```sql
  OUTER APPLY (
      SELECT TOP 1 pv.VENDORID
      FROM PRODUCTVENDOR pv
      JOIN CONSTITUENT vc ON vc.ID = pv.VENDORID AND vc.ISORGANIZATION = 1
      WHERE pv.PRODUCTID = mp.ID
      ORDER BY pv.DATECHANGED DESC, pv.DATEADDED DESC, pv.ID
  ) vendor_latest
  ```

  y emite `vendor_latest.VENDORID` bajo el alias
  `Auctifera__Primary_Vendor__r:Account-Auctifera__Implementation_External_ID__c`.

  Tres decisiones de diseño que hay que verificar, no dar por buenas:
  - **`OUTER APPLY` + `TOP 1`** en vez de un `JOIN`: preserva el conteo de filas aunque
    `PRODUCTVENDOR` no tenga constraint único por `PRODUCTID`. Es lo que evita el fan-out.
  - **Guard `ISORGANIZATION = 1`**: cambia la semántica de *"último vendor"* a
    *"último vendor que sea ORGANIZACIÓN"*. Un producto cuyo vendor más reciente es una persona
    **cae al vendor-organización anterior**, no a NULL.
  - **Header de relación** en vez de columna de lookup plana: el campo destino
    `Auctifera__Primary_Vendor__c` es `Lookup(Account)` con `externalId=false`, así que no puede
    resolver un id crudo de Altru; se carga por el external-ID de la relación.

  ## Riesgos abiertos

  - **⚠️ NO existe perfil safesql de Long Island Children's Museum.** Los perfiles disponibles son
    `aspen`, `illinois_2`, `tucson` y `tucson_backup3`. **Los números que afirma el PR (7.007 filas
    in → 7.007 out, 100% de cobertura) NO se pueden re-derivar contra la fuente que nombra el
    ticket.** Es el riesgo principal de esta review: sin ese perfil, la verificación en datos reales
    se hace sobre otra fuente Altru (comportamiento, no las cifras del ticket) y las cifras quedan
    como *reportadas por dev, no verificadas por QA*.
  - **El PR está OPEN, no merged.** Se valida comportamiento sobre la rama; el merge es un paso
    aparte.
  - **Discrepancia entre el body del PR y el SQL.** El body narra la cadena
    `PRODUCTVENDOR → VENDOR → CONSTITUENT` y reporta *"0 orphaned PRODUCTVENDOR rows against
    VENDOR"*, pero **el query NO une `VENDOR` en ningún momento**: va directo de `PRODUCTVENDOR` a
    `CONSTITUENT` por `pv.VENDORID = vc.ID`. Funcionalmente puede ser equivalente si
    `VENDOR.ID = CONSTITUENT.ID`, pero la evidencia reportada es sobre una tabla que el query final
    no toca. Hay que verificar la premisa, no asumirla.
  - **Cambio de semántica no pedido por el ticket.** El ticket dice "agregar el campo Vendor"; el PR
    entrega "último vendor que sea organización". Está documentado en el comentario del SQL y es una
    decisión defendible, pero **es una interpretación de producto** que conviene que PM confirme:
    ¿es correcto que un producto cuyo último vendor es una persona muestre un vendor anterior en vez
    de quedar vacío?
  - **El campo destino vive en otro repo** (`AuctiferaDX`: `CatalogItem__c.Primary_Vendor__c`). Hay
    que confirmar que existe, que es `Lookup(Account)` y que
    `Account.Implementation_External_ID__c` tiene `externalId=true` — el PR lo afirma; QA lo verifica.
  - **El propio test plan del PR deja dos ítems sin marcar**, ambos aguas abajo del query: el mapeo
    del bulk-load y un spot-check en sandbox tras una carga. No son ejecutables desde el repo.
