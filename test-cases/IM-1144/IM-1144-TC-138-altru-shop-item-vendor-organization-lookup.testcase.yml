  given:
  - el query `catalog_item.sql` en el commit base, que NO emite ninguna columna de vendor
  - la misma fuente Altru consultada con el query de la rama del PR
  when:
  - se corre el query PRE y POST con la MISMA fuente y se comparan conteo de filas y cobertura de la columna nueva
  then:
  - "PRE: no existe ninguna columna de vendor en la salida — el campo está **ausente** del query, no simplemente vacío"
  - "POST: aparece la columna `Auctifera__Primary_Vendor__r:Account-Auctifera__Implementation_External_ID__c` con valores resueltos"
  - "**el conteo de filas NO cambia entre PRE y POST**: el `OUTER APPLY ... TOP 1` no puede multiplicar filas aunque un producto tenga varias filas en `PRODUCTVENDOR`. Es la aserción que protege contra fan-out y hay que medirla, no razonarla"
  - "se mide la **cobertura real** de la columna (cuántos productos quedan con vendor y cuántos en NULL) y se contrasta contra el universo de `PRODUCTVENDOR` de esa fuente"
  - "⚠️ **CIFRAS DEL PR A RE-DERIVAR:** el PR afirma 7.007 filas in → 7.007 out y 100% de cobertura sobre Long Island. **No se toman por buenas.** Si no hay perfil de Long Island, se corre contra otra fuente Altru y se reporta explícitamente que las cifras del ticket quedaron sin verificar, con el número real de la fuente usada"
  - "verificar también que los productos SIN fila en `PRODUCTVENDOR` salen con la columna en NULL y siguen apareciendo en el resultado (el `OUTER` del APPLY hace su trabajo)"
- title: 'IM-1144 AC2 — The vendor value travels as an Account external-ID relationship header through all three layers, never as a plain lookup column or a raw Altru id'
  tags:
  - happy-path
  - im-1144
  - im-1157
  - im-70
  - ac-2
  - contract
  - external-id
  - csv-header
  - salesforce
  - auctifera-dx
  - pr-161
  given:
  - "el campo destino `Auctifera__Primary_Vendor__c` (`CatalogItem__c.Primary_Vendor__c` en AuctiferaDX), que es `Lookup(Account)` con `externalId=false`"
  when:
  - se inspecciona el alias del SQL, la clave del mapper y el header declarado en el pipeline, y se corre la suite que lockea ese contrato
  then:
  - "las **tres capas** usan exactamente la misma cadena `Auctifera__Primary_Vendor__r:Account-Auctifera__Implementation_External_ID__c`: alias en el SQL, clave leída por el mapper y header declarado en el descriptor del pipeline. Si una sola difiere, el valor se pierde en silencio"
  - "**NO** se emite una columna `Auctifera__Primary_Vendor__c` a secas — el spec lo lockea por negación (`not.toMatch(/AS 'Auctifera__Primary_Vendor__c'/)`), y hay que confirmar que esa aserción existe y pasa"
  - "el valor emitido es el `VENDORID` de Altru viajando por el external-ID de la relación, **no** un Salesforce Id ni un nombre de cuenta"
  - "**verificar la premisa en la org, no asumirla:** que `Account.Implementation_External_ID__c` existe con `externalId=true` y `unique=true`. Todo el mecanismo de carga depende de eso y el PR lo afirma sin evidencia adjunta"
  - "confirmar que el precedente que cita el PR es real: `sale_item.sql` ya emite `Auctifera__Catalog_Item__r:Auctifera__Implementation_External_ID__c` para el mismo objeto — o sea que el patrón no se inventa acá"
  - "`every emitted row key is a declared header`: ninguna clave de fila queda fuera del set de headers declarados"
- title: 'IM-1144 AC4 — The vendor apply picks deterministically and skips vendors that do not migrate as Organizations, falling back to an older qualifying vendor instead of emitting a dangling id'
  tags:
  - edge-case
  - negative
  - im-1144
  - im-1157
  - im-70
  - ac-4
  - determinism
  - isorganization
  - data-integrity
  - pr-161
  given:
  - "un producto con VARIAS filas en `PRODUCTVENDOR` (la tabla no tiene constraint único por `PRODUCTID`)"
  - "entre ellas, una fila más reciente cuyo vendor es una **persona** y una más antigua cuyo vendor es una **organización**"
  when:
  - se resuelve el vendor de ese producto, y por separado se corre el fixture de testcontainers que siembra exactamente ese caso
  then:
  - "el desempate es **determinista**: `ORDER BY pv.DATECHANGED DESC, pv.DATEADDED DESC, pv.ID`. Con tres niveles la elección no depende del orden físico de las filas — verificar que el tercer nivel (`pv.ID`) está presente, porque es el que hace la elección reproducible cuando las dos fechas empatan"
  - "el guard `ISORGANIZATION = 1` descarta al vendor persona y el producto **cae al vendor-organización más antiguo**, NO queda en NULL y NO emite el id de la persona"
  - "ese fallback es exactamente lo que afirma la assertion agregada en `shop-discount-query.integration.spec.ts` — hay que verla pasar contra el fixture, que es la única forma de probar este caso sin datos reales que lo contengan"
  - "un producto cuyas filas de `PRODUCTVENDOR` son TODAS de personas queda con la columna en **NULL** (blanco), no con un id colgado. El spec del pipeline lo lockea: `keeps a non-organization vendor blank rather than a dangling id`"
  - "⚠️ **A CONFIRMAR CON PM (cambio de semántica):** el ticket pide *el campo Vendor*; el PR entrega *el último vendor que sea organización*. Que un producto muestre un vendor anterior en lugar de vacío es una decisión de producto, no un detalle técnico. Está documentada en el comentario del SQL, pero nadie del lado de negocio la aprobó explícitamente"
  - "verificar la premisa del body del PR de que `VENDOR.ID = CONSTITUENT.ID`: **el query NO une `VENDOR`**, va directo a `CONSTITUENT`. Si esa igualdad no se sostiene en alguna fuente, el guard estaría filtrando contra la entidad equivocada"
