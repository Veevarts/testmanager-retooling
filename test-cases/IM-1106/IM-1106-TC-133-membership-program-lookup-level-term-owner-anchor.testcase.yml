    when:
      - "se cruza cada par cross-level contra el `MEMBERSHIPPROGRAMID` de origen y de destino, y se comparan las claves de los pares consistentes PRE vs POST"
    then:
      - "todo par cross-level permanece dentro del MISMO `MEMBERSHIPPROGRAMID` → ninguna Opportunity se re-parenta silenciosamente a otro programa"
      - "para un par consistente (`term.LEVELID` = level de la transacción) la clave POST-fix es idéntica a la PRE-fix → no-op, solo se mueven las filas rotas"
      - "`Name`, `Program_Name__c` y `vnfp__Membership_Price__c` no cambian (solo se mueve la foreign key del lookup); tampoco cambian los gates de inclusión de filas (mismo grain → dependientes fund-assignment / contact-role reciben los mismos inputs)"

