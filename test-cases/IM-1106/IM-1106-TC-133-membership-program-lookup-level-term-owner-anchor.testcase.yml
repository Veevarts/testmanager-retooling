      - "POST-fix la clave se arma con `mlt.LEVELID` (term owner) → **0 filas** con clave no resoluble; ambas ramas del UNION ALL aplican el mismo anclaje"
      - "el campo mandatorio `vnfp__Membership_Program__c` deja de importar como N/A y la carga de Membership Opportunities se desbloquea"

  - title: "AC2 · POS purchases keep resolving their Membership Program — the SALESORDERITEMMEMBERSHIP-backed rows use the same term-owner anchor, they had 0 unresolved pairs pre-fix and stay at 0 post-fix (no regression), and membership Opportunities only reach a POS purchase through export-eligible sales orders"
    tags:
      - ac-2
      - pos-purchases
      - sales-order-item-membership
      - no-regression
      - altru
      - im-1106
      - longisland
    given:
      - "las filas POS (SALESORDERITEMMEMBERSHIP) que referencian un `vnfp__Membership_Program__c`"
    when:
      - "se comparan los pares no resolubles de POS PRE-fix vs POST-fix"
    then:
      - "POS tenía **0 pares no resolubles PRE-fix** y sigue en **0 POST-fix** (el fix no introduce regresión en POS)"
      - "las membership Opportunities alcanzan su POS purchase solo vía sales orders export-eligible (0 alcanzables a través del gate de estados excluidos)"
      - "el ticket reporta el mismo síntoma en POS: se valida que ya no queda ningún POS con programa no resoluble"

  - title: "AC3 · Recurring membership installments use the same anchor — recurring_membership.sql and all_recurring.sql build the Membership Program key from the term owner level too, so recurring membership rows do not reintroduce a dangling mandatory lookup"
    tags:
      - ac-3
      - recurring-membership
      - all-recurring
      - consistency
      - altru
      - im-1106
    given:
      - "los queries `recurring_membership.sql` y `all_recurring.sql` del PR #154"
    when:
      - "se inspecciona la construcción de la clave del programa en ambos y se corre el PRE/POST"
    then:
      - "ambos usan `CAST(mlt.LEVELID ...) + '-' + CAST(mlt.ID ...)` (mismo anclaje que membership_transactions.sql)"
      - "no queda ninguna fila de recurring membership con clave de programa no resoluble POST-fix"
      - "el invariante es catalog-wide: el spec estático asegura que ningún consumidor vuelve a usar `ml.ID` para la clave"

  - title: "AC4 · Re-anchoring is safe: no silent re-parenting and no-op on consistent pairs — every cross-level pair stays inside the SAME MEMBERSHIPPROGRAMID (the Opportunity is never moved to a different program), a consistent level/term pair produces exactly the same key as before, and the descriptive fields (Opportunity Name, Program_Name__c, vnfp__Membership_Price__c) still reflect what Altru recorded on the transaction"
    tags:
