scenarios:
  - title: "AC1 · Membership Opportunities resolve the mandatory Membership Program lookup — after the fix, membership_transactions.sql (both the membership-transaction branch and the order-backed UNION ALL branch) emits vnfp__Membership_Program__c as \"<MEMBERSHIPLEVELTERM.LEVELID>-<term id>\", so every emitted key exists in the Membership Programs export and no Opportunity row loads as N/A"
    tags:
