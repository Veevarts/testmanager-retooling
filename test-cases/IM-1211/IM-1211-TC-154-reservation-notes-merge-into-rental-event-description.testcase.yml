schemaVersion: "1.0"

id: "2941a434-0bae-4b98-ab18-e41205d50548"
key: "TC-154"
title: "Reservations query merges the 4 real Altru note sources (SALESORDER.COMMENTS, ITINERARYITEM.NOTES, RESERVATION.ARRIVALNOTES, RESERVATIONNOTE.TEXTNOTE) into Auctifera__Rental_Event__c.Auctifera__Description__c with labels — 0 → 1,599 Illinois reservations arrive with their notes, merge is lossless on 315 IL / 104 LI reservations with 2+ sources, row grain preserved (IM-1211)"
description: |
  Test case para IM-1211 (Historia, priority High, severity 3-High, "Is Ready For QA") — epic IM-70
  Altru Queries — QA Sub-task IM-1214. Cliente reportante: Illinois Holocaust Museum and Education
  Center. PR bajo prueba: Veevarts/MigrationToolETL #176 (open, no merged).

  Contexto: el cliente Illinois reportó que las Notas de Reservations no se migraban a Salesforce.
  El query original sí mapeaba notas, pero desde la tabla EQUIVOCADA (RESERVATIONNOTE, la
  "Notes" tab child — esencialmente sin usar; en Illinois esa tabla tiene 0 rows, así que
  0 reservation notes migraban). El campo que el cliente pide (y el que Altru surface como
  "Important notes" en el objeto Reservation) es SALESORDER.COMMENTS. Camilo confirmó vía
  V_QUERY_RESERVATION (la vista detrás del objeto Reservation en el query designer de Altru):

      SALESORDER.COMMENTS as [IMPORTANTNOTES]

  Durante la investigación se encontraron 2 fuentes adicionales de notas que tampoco se mapeaban
  y no están referenciadas en ningún otro lado de la migración, o sea se perdían outright:
  ITINERARYITEM.NOTES y RESERVATION.ARRIVALNOTES.

  El fix (PR #176): las 4 fuentes se merge en `Auctifera__Description__c` en el
  Auctifera__Rental_Event__c, cada una labelled ("Important notes: …", "Arrival notes: …",
  "Itinerary notes: …", "Notes: …") para que se pueda ver de qué campo Altru viene cada parte.

  Impacto medido por el dev safesql (2026-08-28) — cross-tenant:

    | Source                                                | Illinois | Long Island | Mapped before? |
    | SALESORDER.COMMENTS (Altru "Important notes")         | 1,256    | 11,760      | No             |
    | ITINERARYITEM.NOTES                                    | 436      | 142         | No             |
    | RESERVATION.ARRIVALNOTES                               | 276      | 0           | No             |
    | RESERVATIONNOTE.TEXTNOTE (Notes tab, la única PRE)     | 0        | 14          | Yes — the only one |
    | Reservations con ANY note content                      | 1,599    | 11,812      | (target)       |
    | Reservations con 2+ sources at once                    | 315      | 104         |                |
    | Total reservations                                     | 9,652    | 16,731      |                |

  Result Illinois: **0 → 1,599 reservations arrive with their notes** (16.6% de las 9,652).
  Result Long Island: **14 → 11,812 reservations con notes** (~843× lift).

  Merge lossless: 315 IL reservations tienen 2+ sources populated simultáneamente, así que el merge
  NUNCA prefiere una fuente sobre otra — cada fuente populated se conserva labelled, empty se
  skipea, y una reservation sin notas sigue viniendo empty rather than blank. Row grain unchanged
  (sigue exactamente 1 Rental Event per Reservation).

  Riesgos abiertos flagueados por el dev + heredados del scope:
    - **Auctifera__Rental_Event__c NO tiene Notes field dedicado**: los 4 conceptos distintos de
      Altru se merge en un solo rich-text `Description`, que es workaround. Consecuencia: en
      Salesforce no se pueden filtrar/reportar las 4 fuentes por separado. Dev flag para product
      — cambio en Auctifera package si el cliente los usa operacionalmente. QA valida el merge;
      el diseño long-term queda como ticket product.
    - **PR #176 en OPEN**, base branch por confirmar (probablemente main); no merged, no deploy.
    - **safesql profile de longisland NO disponible localmente** (aspen/illinois_2/tucson/tucson_backup3
      son los alcanzables); illinois_2 sí es alcanzable y es el tenant reportante — la validación
      cuantitativa PRE/POST en Illinois SÍ se puede hacer localmente (candidato prime).
    - **Bastion outages recientes** (documentado en TR-170 / IM-1205): `98.95.60.135:22` intermitente.
      Si el bastion está down al momento de la ejecución, la validación cuantitativa cae a
      DEFERRED (mismo patrón que TR-170).
    - **Encoding / rich text**: los notes pueden contener caracteres especiales (comas, quotes,
      newlines, HTML). El merge debe preservar cada fuente sin corromper — QA debe verificar
      que un note original con HTML entities no se pierde en el CSV round-trip.
    - **Empty vs blank vs null**: el fix explícitamente devuelve empty (no blank string) cuando
      una reservation no tiene notas — QA debe verificar el manejo del NULL/empty en el target
      SF (el rich-text field acepta ambos; verificar que no arma "Important notes: null").
    - **Order de labels dentro del merge**: no está explícitamente documentado si es siempre
      Important → Arrival → Itinerary → Notes o si depende de qué fuente esté populated. QA
      debe capturar el orden observado y flag si es inconsistente entre rows.

type: integration
priority: high
status: active

preconditions:
  - "Repo MigrationToolETL clonado en HEAD del PR #176 + acceso al commit base (main) para contraste PRE-fix."
  - "Al menos un profile safesql alcanzable en /Users/veevart/tools/safesql/profiles. **illinois_2 es el candidato prime** — es el tenant reportante y tiene los 1,599 con-notes counts documentados. Tucson (17 line-item changes en TR-170) también válido para cross-tenant. longisland NO está disponible; su validación depende del re-run del dev."
  - "Docker/colima levantado para `npm run test:queries:docker` (si el PR agrega tests dockerizados; ver `git diff origin/main <PR-head>`)."
  - "npm ci limpio para correr lint:check, query-regression y build."
  - "Esquema del objeto Auctifera__Rental_Event__c en el trainings sandbox para confirmar el field target (Auctifera__Description__c es rich-text; verificar capacity + escaping)."
  - "Repo testmanager-retooling clonado para escribir el TR + evidencias bajo attachments/tr-<NN>-tc-154/."

format: gherkin
scenarios:
  - title: "AC1 · el query de Reservations mapea Auctifera__Description__c desde las 4 fuentes reales de Altru (SALESORDER.COMMENTS, ITINERARYITEM.NOTES, RESERVATION.ARRIVALNOTES, RESERVATIONNOTE.TEXTNOTE) — no solo desde RESERVATIONNOTE.TEXTNOTE (la tabla equivocada del Notes tab)"
    tags:
      - ac-1
      - mapping-change
      - reservation-notes
      - illinois
      - source-of-truth
    given:
      - "el query de Reservations del PR #176 y el commit base (PRE-fix, main) disponibles"
      - "la vista V_QUERY_RESERVATION de Altru documenta `SALESORDER.COMMENTS as [IMPORTANTNOTES]` — evidencia de que Altru surface ese campo en el objeto Reservation, no en un child"
      - "las 4 tablas source disponibles en el profile safesql: SALESORDER, ITINERARYITEM, RESERVATION, RESERVATIONNOTE"
    when:
      - "se inspecciona el SQL del PR #176 y se identifica cada JOIN o subquery que trae notas de las 4 tablas"
      - "se ejecuta el query PRE-fix y POST-fix contra illinois_2 y se cuenta cuántas Reservations tienen contenido en la columna target por fuente"
    then:
      - "el query POST-fix lee de las 4 tablas (SALESORDER.COMMENTS, ITINERARYITEM.NOTES, RESERVATION.ARRIVALNOTES, RESERVATIONNOTE.TEXTNOTE)"
      - "el query PRE-fix solo leía de RESERVATIONNOTE.TEXTNOTE (la Notes tab)"
      - "cada fuente contribuye con su label prefix ('Important notes:', 'Arrival notes:', 'Itinerary notes:', 'Notes:') dentro del merge — el label le dice al usuario de qué campo Altru viene cada parte"
      - "en illinois_2, cada fuente contribuye con lo documentado: 1,256 SALESORDER.COMMENTS + 436 ITINERARYITEM.NOTES + 276 RESERVATION.ARRIVALNOTES + 0 RESERVATIONNOTE.TEXTNOTE"

  - title: "AC2 · impacto en el tenant reportante — Illinois pasa de 0 a 1,599 reservations con notes migradas (16.6% de las 9,652 totales); 315 de esas 1,599 tienen 2 o más sources simultáneos"
    tags:
      - ac-2
      - illinois
      - regression-evidence
      - lift-measured
    given:
      - "profile safesql illinois_2 alcanzable"
      - "conteos dev-reportados en Illinois: 1,256 SALESORDER.COMMENTS + 436 ITINERARYITEM.NOTES + 276 RESERVATION.ARRIVALNOTES + 0 RESERVATIONNOTE.TEXTNOTE = 1,599 reservations únicas con notas; 315 con 2+ sources; 9,652 reservations totales"
      - "el commit base para el conteo PRE-fix"
    when:
      - "se ejecuta el query PRE-fix vs POST-fix en illinois_2 whole-tenant"
      - "se cuenta cuántas Reservations tienen Auctifera__Description__c non-empty PRE y POST"
      - "se desglosa POST-fix por fuente contribuyente (usando el label prefix)"
    then:
      - "Illinois PRE-fix: 0 Reservations con notes en Auctifera__Description__c (la tabla RESERVATIONNOTE está vacía en IL)"
      - "Illinois POST-fix: 1,599 Reservations con notes (16.6% de las 9,652 totales)"
      - "desglose POST-fix por fuente: 1,256 con Important notes label · 436 con Itinerary notes label · 276 con Arrival notes label · 0 con Notes label"
      - "315 de las 1,599 tienen ≥2 labels simultáneos (evidencia del merge multi-source)"
      - "el conteo total de Reservations exportadas queda invariante PRE=POST (row grain — ver AC4)"

  - title: "AC3 · cross-tenant + fuentes adicionales — el fix también beneficia a Long Island (14 → 11,812 con notes, ~843× lift) y captura ITINERARYITEM.NOTES + RESERVATION.ARRIVALNOTES que se perdían outright en todos los tenants"
    tags:
      - ac-3
      - cross-tenant
      - longisland
      - additional-sources
      - regression-evidence
    given:
      - "conteos dev-reportados en Long Island: 11,760 SALESORDER.COMMENTS + 142 ITINERARYITEM.NOTES + 0 RESERVATION.ARRIVALNOTES + 14 RESERVATIONNOTE.TEXTNOTE = 11,812 reservations con notas; 104 con 2+ sources; 16,731 reservations totales"
      - "profile longisland NO disponible localmente (aspen/illinois_2/tucson son los alcanzables); LI queda inherited del dev PR body"
    when:
      - "se cita el conteo del dev para Long Island"
      - "se corre el conteo local en tucson (si aplica, aunque el dev no midió Tucson en este ticket)"
      - "se verifica que las 2 fuentes adicionales (ITINERARYITEM.NOTES, RESERVATION.ARRIVALNOTES) están cubiertas por el fix aunque ningún ticket específico las mencione"
    then:
      - "Long Island PRE-fix (dev): 14 Reservations con notes (solo RESERVATIONNOTE.TEXTNOTE) = 0.08% de las 16,731"
      - "Long Island POST-fix (dev): 11,812 Reservations con notes (70.6% de las 16,731) — ~843× lift"
      - "ITINERARYITEM.NOTES + RESERVATION.ARRIVALNOTES quedan cubiertos por el fix en todos los tenants (aunque el ticket específico solo pide SALESORDER.COMMENTS) — dev flag: se perdían outright, no están referenciados en ningún otro lado de la migración"
      - "el re-run de producción se planea con conteos por tenant (LI 11,812 · IL 1,599 · otros TBD), NO con solo el número del ticket"

  - title: "AC4 · merge lossless — 315 IL / 104 LI Reservations con 2+ sources simultáneos conservan TODAS las fuentes populated (nunca se prefiere una sobre otra), empty sources se skipean, row grain se mantiene exactamente 1 Rental Event por Reservation"
    tags:
      - ac-4
      - lossless-merge
      - row-grain-preserved
      - multi-source
      - critical
    given:
      - "las 315 Reservations en Illinois con ≥2 fuentes populated simultáneamente"
      - "las 104 Reservations en Long Island con ≥2 fuentes populated simultáneamente"
      - "el fix devuelve empty (no blank string, no null literal como texto) cuando una reservation no tiene notas"
    when:
      - "para cada Reservation multi-source, se compara el contenido de cada fuente populated en Altru contra el Auctifera__Description__c POST-fix"
      - "se verifica que cada fuente populated aparece con su label prefix en el output"
      - "se verifica que fuentes empty NO aparecen (ej. no debe salir 'Arrival notes: ' vacío)"
      - "se cuenta filas totales emitidas del query PRE vs POST (row grain check)"
      - "se cuenta 1 Auctifera__Rental_Event__c por Reservation (no fan-out del merge)"
    then:
      - "para cada Reservation con 2+ sources, TODAS las fuentes populated aparecen en Auctifera__Description__c POST-fix — 0 pérdidas de fuente"
      - "una fuente empty NO produce un label vacío (ej. 'Arrival notes: ' NO aparece si RESERVATION.ARRIVALNOTES IS NULL o '')"
      - "una Reservation sin ninguna fuente populated deja Auctifera__Description__c empty (no arma 'Important notes: null' ni 'Notes: ')"
      - "el conteo total de filas emitidas PRE = POST del query (row grain 1:1 Reservation → Rental Event preservado)"
      - "en illinois_2: 9,652 Reservations input → 9,652 Rental Events emitidas PRE = POST"
      - "0 Reservations duplicadas POST-fix (no fan-out por el merge de 4 fuentes)"

  - title: "AC5 · invariantes de seguridad y regresión — encoding preservado (HTML entities / newlines / commas / quotes intactos), lint + query-regression + build verdes, revert-proof positivo (revertir el merge → tests fallan), sin regresión en otros campos de Reservation"
    tags:
      - ac-5
      - encoding-preserved
      - revert-proof
      - query-regression
      - safety-invariants
    given:
      - "el HEAD del PR #176 checked out"
      - "un profile safesql alcanzable (illinois_2 prime)"
      - "el commit base (main) para el revert-proof"
      - "una muestra de Reservations con notes que contienen caracteres especiales (commas, quotes, newlines, HTML entities) — muestra tomada del source Altru"
    when:
      - "se corre `npm run lint:check` + `npm test -- --runInBand query-regression` + `npm run build` en la PR branch"
      - "se ejecuta el query POST-fix contra illinois_2 y se compara el contenido de una muestra de 10 Reservations con caracteres especiales — PRE (en source Altru) vs POST (en output)"
      - "se cuenta la salida total del query PRE vs POST y se verifica que solo Auctifera__Description__c cambia (otros campos del Rental Event permanecen invariantes)"
      - "se revierte solo el merge del PR y se corre el suite de query-regression para el revert-proof"
    then:
      - "lint:check limpio, query-regression todos los tests PASS, build OK"
      - "en la muestra de 10 Reservations con caracteres especiales: contenido de cada fuente POST-fix es byte-idéntico al contenido en Altru (encoding preservado; ninguna nota se corrompe en el CSV round-trip)"
      - "el resto de campos del Reservation → Rental Event mapping permanece invariante PRE=POST (compuerta de inclusión + otros campos derivados no tocados)"
      - "revirtiendo el merge: al menos un test del query-regression FALLA, confirmando que los tests capturan el nuevo comportamiento (revert-proof positivo)"
      - "0 rows added, 0 rows dropped POST-fix (mismo total que AC4 pero verificado bajo el lente de gates de inclusión)"

