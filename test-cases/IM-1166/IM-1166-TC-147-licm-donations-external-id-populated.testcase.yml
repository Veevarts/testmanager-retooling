preconditions:
  - "Repo `altru-queries` clonado en HEAD del PR bajo revisión + acceso al commit base para contraste PRE (merge-base contra develop/main)."
  - "safesql profile de LICM disponible (o dump anonimizado equivalente) que reproduzca los 10,379 donations sin Implementation External ID en el POS. Sin ese dataset la validación cuantitativa no se puede ejecutar."
  - "Query de extracción de Donations identificada (nombre y ruta del archivo) — es el archivo que el PR modifica. Idem para las queries de Pledges y Payments que dependen del External ID de la donation."
  - "Documentación del formato esperado del Implementation External ID (prefijo, longitud, formato) — inferible del código o del catálogo de queries del epic IM-70."
  - "Método documentado para observar el estado POST de los 10,379 registros — sea un aggregate SQL (COUNT WHERE external_id IS NULL), un CSV export, o consulta directa a la tabla staging."

scenarios:
  - title: "IM-1166 AC1 — El fix puebla el Implementation External ID de los 10,379 donations LICM que hoy salen NULL en el POS"
    tags:
      - ac-1
      - happy-path
      - licm
      - regression-evidence
      - data-shape
    given: |
      Given el profile safesql de LICM (o dump equivalente) cargado en el runner
      And la query de Donations en el commit base del PR (PRE-fix)
    when: |
      When se ejecuta la query PRE-fix y se cuentan las filas donde `Implementation External ID` es NULL o vacío
      And luego se ejecuta la MISMA query en el HEAD del PR (POST-fix) sobre el mismo dataset
    then: |
      Then el conteo PRE = 10,379 filas sin Implementation External ID (o el número exacto reportado en la historia si difiere ligeramente)
      And el conteo POST = 0 filas sin Implementation External ID para los mismos 10,379 registros
      And el total de rows extraídos es idéntico PRE vs POST (el fix no descarta ni agrega registros)
      And el formato del External ID poblado cumple la convención documentada (prefijo esperado, longitud consistente, sin duplicados)

  - title: "IM-1166 AC2 — El Implementation External ID poblado permite hacer match único con Salesforce y no genera colisiones ni huérfanos"
    tags:
      - ac-2
      - happy-path
      - integrity
      - salesforce-match
    given: |
      Given la query POST-fix ya ejecutada sobre el dataset LICM
      And el catálogo de External IDs existentes en el target Salesforce (o el key namespace documentado)
    when: |
      When se cuenta la cardinalidad del Implementation External ID poblado (COUNT DISTINCT vs COUNT total) sobre los 10,379 registros
      And se cruza contra los External IDs de otras entidades del cliente para detectar colisiones cross-object
    then: |
      Then COUNT DISTINCT == COUNT total sobre el subconjunto de los 10,379 (no hay duplicados dentro del batch)
      And no hay colisión con External IDs preexistentes de otros donations de LICM
      And no hay colisión con External IDs de otros objetos (Payments, Pledges, Sales Orders) del mismo cliente
      And el External ID es determinístico entre corridas (ejecutar dos veces produce el mismo valor por registro)

  - title: "IM-1166 AC3 — Pledges y Payments quedan correctamente referenciados a través del External ID poblado (cascada sana)"
    tags:
      - ac-3
      - happy-path
      - cascade
      - pledges
      - payments
    given: |
      Given la query POST-fix de Donations ya ejecutada
      And las queries actuales de Pledges y Payments que buscan al donation padre por Implementation External ID
    when: |
      When se ejecutan las queries de Pledges y Payments sobre el dataset LICM POST-fix
      And se cuentan las filas de Pledges y Payments cuya referencia al donation padre resuelve
    then: |
      Then el porcentaje de Pledges huérfanos (sin donation padre por External ID) se reduce respecto al baseline PRE-fix
      And el porcentaje de Payments huérfanos se reduce respecto al baseline PRE-fix
      And para el subconjunto de Pledges/Payments cuyos donations padre estaban en los 10,379 sin External ID, ahora TODOS resuelven
      And no se rompe la cascada para Pledges/Payments cuyos donations padre ya tenían External ID antes del fix

  - title: "IM-1166 AC4 — Regresión: el fix NO altera el Implementation External ID de donations que ya lo tenían poblado antes"
    tags:
      - ac-4
      - regression
      - idempotency
    given: |
      Given el conjunto de donations LICM que en el commit base tenían Implementation External ID != NULL
    when: |
      When se ejecuta la query POST-fix sobre ese subconjunto
      And se compara valor a valor el External ID PRE vs POST para cada registro
    then: |
      Then el External ID de cada registro es idéntico PRE vs POST
      And ningún donation con External ID pre-existente pierde su valor
      And ningún External ID pre-existente cambia de forma (mismo prefijo, misma longitud, misma cadena)
      And ejecutar la query dos veces seguidas produce el mismo output (idempotencia)
