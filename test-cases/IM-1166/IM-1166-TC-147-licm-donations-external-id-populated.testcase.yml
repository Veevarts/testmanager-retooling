id: 5ff07277-b5d2-4b5a-aa53-726939ec3bcd
key: "TC-147"
title: "Long Island Children's Museum · Donations sin Implementation External ID en POS — el fix puebla los 10,379 registros y no rompe Pledges/Payments"

description: |
  Cobertura QA para IM-1166 (10,379 Donations sin Implementation External ID en POS —
  bloquea carga de Donations, Pledges y Payments), del epic IM-70 Altru Queries.
  QA Sub-task: IM-1196. Cuenta objetivo: Long Island Children's Museum (LICM).

  El defecto: 10,379 donations del POS de LICM no tenían el campo Implementation
  External ID poblado, lo que impedía hacer match con Salesforce durante la migración
  y bloqueaba en cascada la carga de Pledges y Payments (que referencian donations por
  ese External ID).

  El fix esperado es una modificación de la query de extracción de Donations (u otra
  query relacionada del pipeline Altru → Veevart) que puebla el Implementation External
  ID de los 10,379 registros que hoy salen NULL en el POS. La validación de QA es
  data-shape: contraste PRE/POST en counts, integridad referencial, cascada a Pledges y
  Payments, y regresión sobre donations que ya tenían External ID poblado (no debe
  alterarlos).

  Repo en scope: `altru-queries` (o el repo dueño de la query de Donations POS). Cliente
  objetivo: LICM. Datos: safesql profile de LICM o dump anonimizado que reproduzca los
  10,379 registros afectados.

  Riesgos abiertos (ver open-risks):
  · La descripción NO tiene ACs formales — están inferidos del impacto documentado; se
    cierran con IM-1166 owner si hay ambigüedad de behavior.
  · IM-1184 (relacionado, Sin iniciar) reporta un patrón similar de external-id sin
    prefijo en Charges (10,333 rows LICM); puede ser el MISMO fix o un fix separado.
    Este TC solo cubre IM-1166; IM-1184 tendrá su propio TC cuando el dev lo trabaje.
  · No hay PR específico ligado a la historia en la descripción — hay que resolverlo al
    momento de ejecutar (qa-test-executor lo pide como input).

