title: "IC 5.06 Opportunity History Tracking & Mandatory fields — Part A exclusive history (6 fields, npe01/vnfp matchers) + NEW T2 setFieldBehavior op (dates→Required on discovered layout) + Record Type MANUAL · CODE PR (jest-contract) + live on illinois"
description: |
  Cobertura QA para IM-1071 (Historia, priority Medium, epic IM-735 Implementation
  Cases Automation).
  QA Sub-task asociada: IM-1124 (creada 2026-07-27).

  Contexto:
  - Post-June IM-735 continuation, Batch A (history-tracking family). Combina lo de IC 6.03
    (history exclusive + MANUAL) con un op T2 NUEVO estilo IC 5.04.
  - IC 5.06 = "Opportunity: History tracking (A) & Mandatory fields (B)" (Order__c 5.06,
    catálogo Auctifera SF Id a18f200000mscbbAAA).
  - **Tier: Medium** (caveat: cross-version managed membership-field API names — mitigado por
    el matcher runtime de IM-1069).
  - PR bajo prueba: `Veevarts/MigrationAppBackend#243` (**MERGED** 2026-07-15 20:31Z).
    Branch: `task/ic-5-06-opportunity-history-mandatory-IM-1071`. Merge commit `5aa676aa`
    (base `81ada09`).
  - **CODE PR** (5 files, +378/-59): agrega el op T2 NUEVO `setFieldBehavior` al page-layout
    adapter + reescribe el spec:
    * `layout-mutation-spec.ts` (+23) — schema del op setFieldBehavior
    * `metadata-deploy-result.ts` (+5)
    * `t2-page-layout.adapter.ts` (+83) — implementación del op
    * `t2-page-layout.adapter.spec.ts` (+194/-42) — tests del op
    * `ic-5-06-opportunity-history-mandatory.json` (+73/-12) — spec v3

  Spec v3 (feasibility hybrid, 3 steps, defaultOrder 506):
  - **Step 1 (T3 historyTracking, exclusive)** sobre Opportunity — 6 fields:
    StageName, Amount, CloseDate (standard, literales); Membership Program →
    `vnfp__Membership_Program__c` (matcher, **optional**); Membership Start Date →
    `npe01__Membership_Start_Date__c`; Membership End Date → `npe01__Membership_End_Date__c`
    (matchers). Exclusive: destrackea todo lo demás excepto RecordTypeId (que el op no puede tocar).
  - **Step 2 (MANUAL)**: tickear 'Record Type' en Set History Tracking — RecordTypeId no es
    listable como tracked field vía metadata replay (SF lo rechaza) → handoff MANUAL.
  - **Step 3 (T2 setFieldBehavior, op NUEVO)**: layout `{{membershipLayout}}` (operator select
    input, discovery kind 'layouts' sobre Opportunity) → set `npe01__Membership_Start_Date__c` y
    `npe01__Membership_End_Date__c` a **Required** en el layout elegido. El op NUNCA agrega un
    field faltante: si el layout no muestra el field, reporta not-applied con razón.

  Estrategia de verificación:
  - **jest code-contract** (evidencia PRIMARIA del op nuevo): clone en merge `5aa676aa`, npm ci,
    correr la suite del t2-page-layout adapter; verificar los tests de setFieldBehavior (set
    Required, never-adds-missing/not-applied, read-back verify) + gates. Más genuinely-new proof
    (base=0 setFieldBehavior refs → merge=9).
  - **static spec fidelity**: ic-5-06 v3, hybrid, 3 steps, matchers + input + MANUAL.
  - **live end-to-end** via Migration App (Path A) en illinois-trainings: Part A exclusive (6
    fields, matcher resolution npe01/vnfp, RecordTypeId untouched) + Record Type MANUAL atestado
    + Part B (select Membership layout → dates Required → layout read-back).

  Estado del org (illinois-trainings, sondeado):
  - vnfp__Membership_Program__c presente; Membership Start/End Date son **npe01__** (NPSP), NO vnfp.
  - 13 Opportunity layouts incl. 'Opportunity-Veevart Membership Layout - V3 - May 2023' y
    'Opportunity-Membership Layout' → el select de Part B tiene opciones.
  - PRE tracked Part A: 7 fields = los 6 del keep-list + RecordTypeId → Part A exclusive ≈ no-op
    (ya en target; prueba matcher resolution + read-back). RecordTypeId ya tracked (será el MANUAL).

  Riesgos abiertos:
  - **Exclusive destructivo**: Part A destrackea fields fuera del keep-list; en illinois no hay
    extras → no-op, pero verifica matcher resolution + que RecordTypeId no lo toca el op.
  - **Part B footprint**: setFieldBehavior escribe el layout Membership (2 fields → Required).
  - **never-adds-missing (AC5)**: la rama not-applied (field ausente del layout) se cubre por jest;
    live se elige un layout que SÍ muestra los dates para probar el positive path.
  - Verificado por el dev en CamiloDevOrg + im696-tucson (two-org proof); QA re-verifica en illinois.
  - PR ya MERGED — base `81ada09` vs merge-commit `5aa676aa`.

