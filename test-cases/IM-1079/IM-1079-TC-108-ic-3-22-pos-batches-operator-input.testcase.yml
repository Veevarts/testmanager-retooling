title: "IC 3.22 POS Purchase Payment Propagation & Canceled Report Batches — v6 fully-auto (2 AUTOMATED T6 'Run & Schedule' steps · idempotent no-op guard · scope 2000/default mirroring package · supersedes v4 operator-input + MANUAL Drawer)"
description: |
  Cobertura QA para IM-1079 (Historia, priority Medium, epic IM-735
  Implementation Cases Automation).
  QA Sub-task asociada: IM-1109.

  **v2 (2026-07-24): actualización tras cambio del dev.** El dev supersedió el
  diseño v4 (que QA validó en TR-117) con un rework completo. Este TC ahora cubre
  **v6**. La cobertura v4 (operator input `batchScope` + MANUAL Cashier Drawer
  Control) queda como registro histórico en TR-117; TR-122 valida v6.

  Contexto v6 (PR bajo prueba: `Veevarts/MigrationAppBackend#289`, MERGED
  2026-07-23 21:40Z, merge commit `e097d63c`, merge-base `8d66dba6`):
  - IC 3.22 pasa de **hybrid → auto**. 2 steps AUTOMATED T6, 0 MANUAL, 0 operator input.
  - Files touched (2): `ic-3-22-pos-batches.json` (+... nuevo par de steps) +
    `ic-3-22-pos-batches.spec.ts` (contract 5 → 7 tests).
  - Ambos steps reproducen el botón **"Run & Schedule"** de Veevart Settings > POS >
    Batches: enqueue once (corre ahora) + el batch se auto-reschedula en `finish()`
    vía `System.scheduleBatch` bajo un JOB_NAME fijo (un nombre duplicado lo rechaza
    la plataforma), así que existe a lo más UNA schedule recurrente.

  Cambio principal — RESUELVE los 3 open-risks de v4:

  **1. BATCH_SCOPE=200 unconfirmed by PM → RESUELTO POR REMOCIÓN.** v4 hacía
  `batchScope` un required operator input (default 200 TBD, confidence 70). v6
  **elimina el input** y hardcodea el scope replicando el propio package Auctifera:
  - Payment Propagation: `new Auctifera.POSPurchasePaymentPropagationBatch(15), 2000`
    — el (15)=runAgainMinutes y scope 2000 son EXACTAMENTE lo que hace la Callable
    `run_schedule` action de Auctifera. No hay número mágico que PM confirme.
  - Canceled Report: `new Auctifera.POSPurchaseCanceledReportBatch()` — sin scope =
    SF default (matching el package, que no pasa scope).
  - El spec.ts asserta `apex.not.toContain('{{batchScope}}')` + `not.toContain('PropagationBatch(), 200)')`
    + `requiredInputs.length === 0`. El default 200 queda definitivamente cerrado.

  **2. Cashier Drawer Control MANUAL → RESUELTO.** v4 step 2 era MANUAL porque su
  no-arg constructor es `public` (no `global`) en Auctifera y vnfp — no anon-callable.
  v6 lo reemplaza por `POSPurchaseCanceledReportBatch` (global no-arg ctor,
  anon-callable) = el batch que el playbook original SÍ nombra ("Payment Propagation
  Batch, POS Purchase Canceled Report Batch"). spec.ts asserta que
  `CashierDrawerControlBatch` y `Drawer` YA NO aparecen en el case → feasibility auto.

  **3. Playbook/spec mismatch (open-question de v4) → RESUELTO.** El segundo batch
  ahora es el que el playbook nombra.

  **NUEVO en v6 — idempotencia + self-scheduling.** Cada step es un no-op cuando el
  "Run & Schedule" ya está en su lugar: la CronTrigger recurrente (por JOB_NAME fijo)
  existe, O un BatchApex job de la clase está live (LIVE_STATUSES). Solo enqueue en el
  else branch → re-correr nunca dispara un run redundante. Verify via AsyncApexJob
  query-back (accepted state); `VerifyException` (step FAILED) si el job no existe o
  está en estado inesperado. Una clase non-global/non-visible falla el COMPILE →
  result.success=false (step FAILED). Nunca false pass.

  Evidencia dev (per PR #289):
  - spec.ts 7 tests CI-lockean el contrato v6.
  - (comentario del spec.ts dice "Pins the v5 surface" pero los asserts checan
    version 6 y el JSON case/template = 6 — off-by-one cosmético en el comment, no defecto.)

  PRE-baseline QA (illinois-trainings, read-only, 2026-07-24 ~16:44Z):
  - `POSPurchasePaymentPropagationBatch`: CronTrigger `Veevart - POSPurchasePaymentPropagationBatch`
    en state **WAITING** (schedule recurrente YA existe; 91 jobs Completed en 2 días,
    cada ~15 min) → step 1 debe tomar el **idempotent no-op branch**.
  - `POSPurchaseCanceledReportBatch`: **0 AsyncApexJob rows all-time** + 0 CronTrigger
    → step 2 debe **enqueue fresh** + establecer su schedule recurrente.
  - Setup perfecto: una sola corrida v6 ejercita AMBAS ramas (no-op + fresh enqueue).

  Riesgos abiertos:
  - Ninguno material. Los 3 open-risks de v4 quedan resueltos por el rework.
  - Nota menor: comentario spec.ts dice "v5" pero el contrato es v6 (cosmético).
  - PR ya MERGED (y promovido a stable por #291) — baseline vs post-fix entre
    merge-base `8d66dba6` (v4) y merge-commit `e097d63c` (v6).

