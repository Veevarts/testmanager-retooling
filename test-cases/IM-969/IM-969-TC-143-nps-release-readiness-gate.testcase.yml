  - "3. Respondé y enviá. Verificá la atribución en **Dashboard → Responses**. 📸 `03-vnfp-response.png`"
  - "4. Repetí los pasos 1–3 en la org de **Auctifera**, en la app **Giftshop**. 📸 `04-giftshop-app.png`, `05-giftshop-modal.png`, `06-giftshop-response.png`"
  then:
  - "en **ambos** paquetes el modal aparece **después del login**, sin haber tocado ningún botón de feature, y solo una vez transcurrido el delay"
  - "en ambos la respuesta queda **atribuida a la General Survey** con el `client org` y el `user` reales de esa org"
