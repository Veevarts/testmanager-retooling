preconditions:
- '⚠️ **PASO 0 — determinar QUÉ build sirve `https://surveytool.dev.veevart.ai` antes de tocar nada.** Los tres PRs bajo prueba apuntan a `main` y la rama épica quedó 18 commits detrás. Si dev sirve la épica, un PASS no dice nada del release y hay que declararlo así en cada escenario. Sin esta verificación el resto de la corrida no es interpretable'
- 'Entorno de ejecución elegido por el usuario: **`https://surveytool.dev.veevart.ai`** — verificado vivo hoy (`/api/health` → `{"status":"ok"}`, `/api/admin/surveys` anónimo → **401**). `stg` y `prd` también responden igual y quedan FUERA del alcance de escritura'
- 'Admin del survey-tool accesible con Google `@veevart.com` vía Cognito Hosted UI — necesario para AC1, AC5, AC6, AC12'
- 'Org **Auctifera** (nueva, reemplaza a la `nps_2` que expiró el 2026-07-31): instancia `nosoftware-fun-3261-dev-ed`, Org Id `00DEm00000V5eRWMAZ`, perfil System Administrator, **expira 2026-09-11**'
- 'Org **NFPFundraising**: alias `NFPFundraising__vnfp_pkg`, instancia `flow-site-19432-dev-ed`, Org Id `00DRt00000TAlrNMAT`, User Id `005Rt00000XjqlyIAB`, **expira 2026-08-14 — MAÑANA**. Es el reloj que manda: todo lo que necesite esa org se corre primero'
- 'Credenciales de ambas orgs entregadas por el usuario **fuera de los artefactos**. No se escriben en el repo, ni en el test run, ni en Jira'
- '✅ **SETUP YA EJECUTADO POR QA (2026-08-13, `/admin/organizations` en dev, `Environment: development`):** las DOS organizations quedan registradas, `manual` y **Active** — `Auctifera` → `00DEm00000V5eRWMAZ` (**Salesforce Org ID**) y `VNFP` → `flow-site-19432-dev-ed` (**Subdomain**). Antes de este setup existía una sola (VNFP), así que AC4, AC5 y AC6 eran inejecutables por falta de segunda org'
- '⚠️ **HALLAZGO DE CONFIGURACIÓN A RESOLVER ANTES DE JUZGAR CUALQUIER FALLO DE AUDIENCIA.** El formulario `New organization` ofrece `Identifier type` con dos valores: **`Salesforce Org ID 18` (opción por defecto)** y **`Subdomain fallback`**. O sea que tras IM-1165 la llave canónica es el Org Id de 18 y el subdominio quedó degradado a *fallback* — pero **`VNFP` está registrada con el fallback**, que es la llave con la que se produjo TODA la evidencia previa (TR-146, TR-147, TR-148)'
- '**El registro quedó deliberadamente en A/B, una org por cada tipo de llave** (`Auctifera` por Org Id, `VNFP` por subdominio). No es un descuido: es el banco de pruebas que permite establecer **cuál de las dos resuelve el runtime**. Si una entrega y la otra no, la causa es el tipo de identifier y NO el código de audiencia — distinguir eso ANTES de levantar un defecto de scoping. Si el ejecutor prefiere homogeneizar, que lo haga a conciencia y lo deje escrito'
- 'La columna `Source` marca `manual` en las dos, lo que implica que existe además un origen **sincronizado** (es lo que construye IM-1165, *Sync NPS organizations from Salesforce active client accounts*, hoy En curso). Una org registrada a mano que después el sync pise es un modo de falla a vigilar durante la corrida'
- 'Falta todavía **una organización de control negativo** que NO reciba la survey — lo pide Test Data Requirements de la historia. Con las dos activas alcanza para el contraste seleccionada/no-seleccionada del AC5, pero el control de *organización inactiva* del AC4 exige desactivar una o registrar una tercera'
- 'Clones de los tres repos en los heads de los PRs bajo prueba: `survey-tool` "#58" (`staging`), `AuctiferaDX` "#2583" y `NFPFundraising` "#2234" (`story/nps-survey-delivery-IM-970`), más sus commits base, para suites y revert-proof'
- 'Método documentado para **resetear el estado de un respondent** o avanzar el período entre escenarios de borde (AC7, AC8, AC9, AC10). Sin esto, los ACs de límites solo se pueden cubrir a nivel de suite y hay que declararlo'
- 'Respondents en los cuatro estados que pide la historia: limpio, con dismissals, con impresiones y con respuesta enviada'
- 'Escribir cualquier survey de prueba exige **ventana autorizada en el entorno dev COMPARTIDO**. Por el AC7 de IM-966, mientras exista una General ACTIVA con audiencia global no se puede crear otra activa: la API responde **409**'
- '🔴 **LAS SURVEYS DE PRUEBA NO SE BORRAN — SON EVIDENCIA.** Decisión del dueño de la historia y **revierte el patrón de limpieza de TR-146, TR-147 y TR-148**, donde las Generales de QA se eliminaban al cerrar. En esta corrida quedan en el entorno para poder inspeccionarlas después. Tampoco se borran las respuestas que generen: en el survey-tool, borrar una survey **arrastra en cascada sus respuestas**, así que eliminarla destruiría también la evidencia del AC12'
- '**Convención de nombre obligatoria, porque ahora persisten:** toda survey creada por esta corrida se identifica con el prefijo `QA TC-143` en su subject o título, para que cualquiera distinga de un vistazo lo que es dato de QA de lo que es dato del entorno. Sin esto, dejar surveys atrás ensucia el entorno en vez de documentarlo'
- 'Si el gate del **409** obliga a liberar el scope, la salida es **desactivar**, nunca borrar: ni la General preexistente ni las de QA. Al cerrar se deja un **inventario del estado final** —qué surveys quedan, cuáles activas, cuáles inactivas y cuáles creó QA— en lugar de una restauración al baseline'
