title: IM-969 — NPS release readiness gate — admin persistence round-trip, disabled-survey behaviour, after-login delivery in BOTH Salesforce packages, audience modes (everyone vs specific orgs), advanced display-rule boundaries and their precedence, dashboard and CSV evidence, public/admin auth boundaries, and the documented release dossier
description: |
  Cobertura QA de IM-969 (**Execute Museum Demo NPS release QA**), bajo el epic
  IM-970 NPS Survey Tool delivery. QA Sub-task asociada: **IM-1181**.

  ## Qué es esta historia

  No es una historia de feature: es **la compuerta de release del epic completo**. Pide ejecutar
  la QA de release-readiness sobre los tres repos (`survey-tool`, `AuctiferaDX`, `NFPFundraising`)
  y producir un dossier con evidencia, riesgos, chequeos omitidos y pasos de rollback. Tiene
  **14 ACs**.

  ## PRs bajo prueba — y por qué esta corrida pesa distinto

  Los tres PRs los confirmó el usuario y **los tres apuntan a `main`, y los tres están ABIERTOS**:

  | PR | Head → base | Tamaño | Estado |
  | --- | --- | --- | --- |
  | survey-tool **"#58"** `feat(admin): promote nps management workflows to production IM-1176` | `staging` → `main` | 29 archivos +3706/-2374 | OPEN |
  | AuctiferaDX **"#2583"** `feat(nps): deliver general surveys after login IM-970` | `story/nps-survey-delivery-IM-970` → `main` | 20 archivos +777/-23 | OPEN |
  | NFPFundraising **"#2234"** `feat(nps): deliver surveys across fundraising flows IM-970` | `story/nps-survey-delivery-IM-970` → `main` | 31 archivos +1519/-10 | OPEN |

  Esto **resuelve el riesgo de release que TR-146, TR-147 y TR-148 dejaron escalado tres veces**
  ("nada de esto está en main"). Ahora sí hay PRs a `main` — y esta historia es la que decide si
  entran. Un FAIL acá no es un hallazgo de rama épica: es un bloqueo de release.

  ## Qué ya está validado y NO hay que repetir

  Buena parte del comportamiento ya se ejecutó al validar las historias hermanas del epic. El
  ejecutor debe **reutilizar esa evidencia y re-confirmarla, no rehacer la batería**:

  | Corrida | Historia | Resultado | Qué aporta a IM-969 |
  | --- | --- | --- | --- |
  | **TR-085 / TC-76** | IM-961 | 5/5 | login Cognito del admin |
  | **TR-086 / TC-77** | IM-962 | 7/7 | separación de rutas públicas y admin (AC13) |
  | **TR-087 / TC-78** | IM-963 | 6/7 · 1 blocked | acceso público del widget (AC13) |
  | **TR-088 / TC-79** | IM-964 | 5/5 | documentación de despliegue Cognito |
  | **TR-146 / TC-96** | IM-966 | 11/11 | audiencia `To everyone` + org activa/inactiva (AC4) · `userCreatedDate` en el submit |
  | **TR-147 / TC-136** | IM-968 | 6/9 · 2 FAIL | after-login en NFPFundraising en vivo (mitad de AC3) · "ya respondió" en secuencia real (AC11) |
  | **TR-148 / TC-137** | IM-1099 | 11/11 | display rules AC1–AC6 de esa historia · after-login Giftshop · export CSV · rutas públicas |

  ## ⚠️ Por qué esa evidencia está PARCIALMENTE VENCIDA

  Entre el 2026-07-30 (última corrida NPS) y hoy el terreno se movió, y de forma que toca
  justamente lo que aquellas corridas fijaron:

  1. **El contrato del widget cambió.** IM-1165 mergeó el 2026-08-12 en los dos paquetes
     (AuctiferaDX "#2580", NFPFundraising "#2232"): ahora se envía **`salesforceOrgId`**
     (`UserInfo.getOrganizationId()`) **además de** `clientOrgId`. Toda la evidencia previa fijó
     `clientOrgId` = subdominio de la scratch. Hay que verificar **cuál de los dos usa el backend
     como llave de audiencia**, porque de eso dependen AC4, AC5 y AC6 enteros.
  2. **El admin cambió hoy.** IM-1176 mergeó a `staging` el 2026-08-13 (PRs "#56", "#57", "#59",
     "#60") y es exactamente lo que el "#58" quiere promover. AC1 y AC6 son sobre ese formulario:
     no se pueden dar por buenos con capturas de julio.
  3. **Aparecieron entornos.** Ya no hay solo dev: `surveytool.stg.veevart.ai` y
     `surveytool.prd.veevart.ai` están vivos, y los paquetes agregan CSP trusted sites para los dos
     (`VeevartSurveysStaging`, `VeevartSurveysProduction`). La rama épica que validó todo lo
     anterior quedó **7 ahead / 18 behind `main`**.
  4. **Las orgs son otras.** La scratch de Auctifera de julio (`computing-power-944-dev-ed`)
     expiró el 2026-07-31. La de esta corrida es nueva y no arrastra estado de respondents.

  ## Riesgo medido ANTES de ejecutar

  **El release PR de NFPFundraising sigue cargando el hallazgo que rechazó IM-968.** Conteo sobre
  el diff de "#2234": **20 `console.log` añadidos**, con la distribución **idéntica** a la que
  midió TR-147 el 2026-07-30 — `npsWidget.js` (7), `ExhibitionWizardHelper.js` (4),
  `PaymentHelper.js` (4), `PaymentController.js` (2), `PaymentAssignmentHelper.js` (1),
  `JournalEntryUpdateController.js` (1), `BoxMembershipDonationHelper.js` (1). Más 14
  `console.warn` y 5 `console.error`, defendibles como diagnóstico.

  Uno de esos volcaba la URL completa de eligibility —con `clientOrgId`, `respondentId` y
  `userCreatedDate`— a la consola del usuario final. **IM-968 está en `Rechazado` por esto**, y el
  código viaja igual en el PR que va a `main`. Contraste útil: AuctiferaDX "#2583" agrega solo
  **3** `console.log`, o sea el problema es asimétrico y está acotado a un paquete.

  Se deja como riesgo medido y se **re-cuenta sobre el head vigente** antes de emitir veredicto.

  ## Estado del epic al abrir esta QA

  De los 15 hijos de IM-970: **4 Finalizada** (IM-961..964), **2 Request Approved** (IM-966,
  IM-1099), **1 Rechazado** (IM-968), **5 en vuelo** (IM-965 y IM-1009 Under Code Review, IM-1147
  y IM-1176 In Peer Review, IM-1165 En curso) y **4 sin iniciar** (IM-967, IM-1178, IM-1179,
  IM-1180). Esto no bloquea ejecutar IM-969, pero **sí acota qué puede afirmar el AC14**: se puede
  declarar readiness del alcance que estos tres PRs entregan, no del epic entero.
