  - la misma survey con un límite de **vistas / impresiones** configurado para su ventana
  when:
  - un respondent alcanza primero el límite de dismissals y, por separado, el límite de impresiones
  then:
  - "alcanzado el límite de **dismissals**, la survey **no vuelve a entregarse durante el mismo período**, y vuelve a ser elegible cuando el período se resetea"
  - "alcanzado el límite de **impresiones**, verificaciones adicionales **no la muestran** hasta que la ventana aplicable se resetea"
  - "los dos contadores son **independientes**: agotar dismissals no debe consumir impresiones ni al revés. Ejercitarlos por separado antes de combinarlos en el AC10"
  - "para una General, dejar `Max dismissals per period` vacío significa que **un solo dismissal la oculta** — así lo declara el texto de ayuda, y es un default con consecuencias"
  - "**LÍMITE PRÁCTICO A DECLARAR:** el reset depende del paso del tiempo real (30/90/180/365 días según `Repeat window`). Si no es observable dentro de la ventana de ejecución, se cubre a nivel de suite y **se declara explícitamente como no ejercitado en vivo**, nunca se finge. Si existe un método de admin para avanzar el período, usarlo y dejarlo documentado"
- title: 'IM-969 AC10 — With tries, dismissal limits and view limits configured together, the most restrictive unmet rule is the one that blocks delivery, and which one it was can be verified'
  tags:
  - edge-case
  - im-969
  - im-1181
  - im-970
  - ac-10
  - rule-precedence
  - diagnostics
  - display-rules
  - not-covered-before
  given:
  - "una misma survey con los **tres** controles configurados a la vez: `Tries between shows`, `Max dismissals per period` y el límite de vistas/impresiones"
  when:
  - se evalúa la elegibilidad en estados donde **más de una** regla está incumplida, y en estados donde solo una lo está
  then:
  - "la entrega queda bloqueada por la **regla más restrictiva que no se cumple**, y el resultado es consistente: no depende del orden en que se configuraron ni de cuál se evaluó primero"
  - "**se puede verificar CUÁL regla bloqueó**, ya sea desde el estado registrado del respondent o desde la diagnóstica que exponga el runtime. El AC pide explícitamente que la razón sea verificable — si el sistema no permite distinguirla, eso es el hallazgo, y hay que reportarlo como tal en vez de darlo por bueno"
  - "al satisfacer la regla que bloqueaba, si otra sigue incumplida la survey **sigue sin entregarse**: el desbloqueo es acumulativo, no de una sola condición"
  - "cuando **todas** se cumplen, la survey se entrega — el control positivo sin el cual esto solo probaría que algo bloquea siempre"
  - "**ESTE AC ES EL DELTA MÁS VALIOSO DE LA HISTORIA.** Las corridas previas ejercitaron cada regla **por separado**; la interacción entre las tres no se probó nunca. Es donde más barato aparece un bug de precedencia"
- title: 'IM-969 AC11 — Once the respondent answered the General Survey, no later after-login check shows it again for the same respondent and organization scope'
  tags:
  - negative
  - im-969
  - im-1181
  - im-970
  - ac-11
  - already-answered
  - after-login
  - reuses-tr147
  given:
  - un respondent que **ya envió** su respuesta a la General Survey
  when:
  - corre otra verificación after-login para ese mismo respondent dentro del mismo scope de organización
  then:
  - "la survey **no se vuelve a mostrar** — ni en ese login ni en los siguientes"
  - "el corte se aplica por **respondent + organización**, no globalmente: un respondent distinto de la misma organización, o el mismo respondent en otra organización dentro del scope, siguen evaluándose por sus propias reglas"
  - "la verificación devuelve lista vacía con **200**, no un error"
  - "**REUTILIZAR TR-147** (escenario 3): ahí se ejecutó **en secuencia real** —inmediatamente después de enviar la respuesta, la misma consulta que devolvía la survey devolvió `[]`—. Re-confirmar con las orgs nuevas, que es lo único que cambió"
- title: 'IM-969 AC12 — A submitted response is visible and accurate across Dashboard Summary, the Responses list, the response detail and the CSV export'
  tags:
  - happy-path
  - im-969
  - im-1181
  - im-970
  - ac-12
  - dashboard
  - csv-export
  - functional-ui
  - reuses-tr148
  given:
  - una respuesta recién enviada desde una de las dos orgs de Salesforce
  - un admin en el Dashboard del survey-tool
  when:
  - se recorren **Summary**, la lista de **Responses**, el **detalle** de esa respuesta y el **export CSV**
  then:
  - "la respuesta aparece en las cuatro vistas y los datos **coinciden entre sí**: la misma respuesta no puede figurar con un puntaje en la lista y otro en el detalle"
  - "en cada vista son visibles y correctos: la **respuesta**, la **organización**, el **contexto del respondent**, el **puntaje**, y las **preguntas con sus respuestas**"
  - "el **CSV respeta los filtros activos** del dashboard —no exporta el total sin filtrar— y trae una **columna legible por pregunta y respuesta**, no un blob JSON. Contrastar el conteo de filas del CSV contra el que muestra la pantalla"
  - "el **Summary** refleja la respuesta nueva en sus agregados: si el detalle la muestra y el resumen no la contó, es un defecto de consistencia"
  - "**REUTILIZAR TR-148** (escenario 9) para el export CSV, que ya se ejerció con filtros. Lo que se agrega acá es la **coherencia entre las cuatro vistas**, que ninguna corrida previa contrastó"
- title: 'IM-969 AC13 — Public widget operations keep working with no admin session, and no admin route is reachable anonymously'
  tags:
  - regression
  - im-969
  - im-1181
  - im-970
  - ac-13
  - public-api
  - anonymous
  - auth-boundary
  - security
  - reuses-tr146
  given:
  - el entorno de QA sirviendo el release candidate
  when:
  - "se ejercitan **sin ninguna sesión de admin** las cuatro operaciones públicas: entrega de la survey, registro de impresión, registro de dismissal y envío de respuesta"
  then:
  - "las cuatro **funcionan de forma anónima** — es el diseño del widget, no una fuga"
  - "las rutas **admin siguen protegidas**: probes anónimos a `/api/admin/*` devuelven **401**. Verificado hoy en dev, stg y prd; re-confirmar que el release no abrió ninguna"
  - "ninguna respuesta pública filtra datos de otras organizaciones ni de otros respondents"
  - "contracara del AC, y hay un antecedente concreto: **TR-146 levantó un hallazgo Bajo** — el endpoint público devuelve `audienceDetails` y `generalClientOrgId`, o sea la lista de organizaciones objetivo. Re-verificar si sigue vigente y si producto decidió algo; que sea anónimo por diseño no significa que pueda exponer de más"
  - "**REUTILIZAR TR-086, TR-087 y TR-146** (5 probes de 401) como línea base y comparar contra el estado de hoy"
- title: 'IM-969 AC14 — The release dossier is complete: evidence for both packages, positive and negative audience tests, boundary tests for the advanced rules, risks, skipped checks and rollback steps'
  tags:
  - im-969
  - im-1181
  - im-970
  - ac-14
  - release-readiness
  - documentation
  - process
  - risk-flagged
  given:
  - la corrida de QA de release ya ejecutada sobre los tres PRs bajo prueba
  when:
  - se arma el dossier de readiness y se contrasta contra lo que el AC exige punto por punto
  then:
  - "hay **evidencia de los dos paquetes** de Salesforce, cada una con su org, su usuario real y su captura — no una sola extrapolada a la otra"
  - "hay pruebas de audiencia **positivas y negativas**: al menos una organización que recibe y una que no, en los dos modos (`To everyone` y organizaciones específicas)"
  - "hay pruebas de **borde de las reglas avanzadas** (AC7, AC8, AC9) y de su **precedencia** (AC10), con lo ejercitado en vivo separado de lo cubierto solo por suite"
  - "los **riesgos** quedan escritos, incluido el estado del epic: al abrir esta QA, de los 15 hijos de IM-970 hay 4 Finalizada, 2 Request Approved, **1 Rechazado (IM-968)**, 5 en vuelo y 4 sin iniciar. El veredicto de readiness cubre lo que estos tres PRs entregan, **no el epic completo**"
  - "los **chequeos omitidos** están declarados con su razón concreta y verificable, no con un *pendiente* genérico"
  - "el dossier incluye el **inventario del estado final del entorno**: las surveys de QA **no se borran** en esta corrida, así que hay que decir cuáles quedaron, con qué configuración, activas o inactivas, y qué respuestas produjeron. Lo que en corridas anteriores era *entorno restaurado al baseline* acá es *entorno documentado*"
  - "hay **pasos de rollback** escritos para los tres PRs: qué se revierte, en qué orden, y qué queda inconsistente si se revierte solo uno de los tres (los paquetes de Salesforce y el backend se liberan por separado, así que el rollback parcial es el caso real, no el teórico)"
  - "⚠️ **queda escrito el hallazgo que arrastra IM-968:** el PR \"#2234\" hacia `main` mantiene los **20 `console.log`** con distribución idéntica a la medida en TR-147, uno de ellos volcando la URL de eligibility con `clientOrgId`, `respondentId` y `userCreatedDate` a la consola del usuario final. La historia está en `Rechazado` por esto y el código va igual a `main`. Contraste: \"#2583\" agrega solo 3"
- title: 'IM-969 — Repo suites, package CI and revert-proof across the three release PRs'
  tags:
  - regression
  - im-969
  - im-1181
  - im-970
  - gates
  - revert-proof
  - ci
  - survey-tool
  - auctifera-dx
  - nfpfundraising
  - pr-58
  - pr-2583
  - pr-2234
  given:
  - "clones de los tres repos en los heads de los PRs bajo prueba y en sus commits base"
  - "la dependencia que declara la propia historia: *Salesforce package CI y los arreglos de permission set completos antes de la aprobación final del release*"
  when:
  - se corren las suites de cada repo sobre el head del PR y luego se revierte el código dejando los tests, para verificar que los guards no son vacuos
  then:
  - "las suites de `survey-tool` (server y client) pasan completas sobre el head del \"#58\" — la línea base de TR-148 fue **93 tests, 0 fallos**; cualquier caída nueva es regresión del release"
  - "las suites `sfdx-lwc-jest` de los dos paquetes pasan sobre sus heads — la línea base de TR-147 para NFPFundraising fue **38 suites / 290 tests / 0 fallos**"
  - "al revertir, los tests que cubren el comportamiento **FALLAN**; los que sigan verdes se reportan como guards vacuos con nombre y archivo"
  - "los **permission sets** que toca el \"#2583\" (`Veevart.permissionset`, `auctifera.permissionset`) se validan: el arreglo que la historia declara como dependencia de release, o su ausencia documentada"
  - "**GAP DE COBERTURA CONOCIDO A RE-DECLARAR:** `NpsAfterLoginLauncherBackground` es un bundle **Aura** y jest de LWC no ejecuta Aura, así que el componente central del AC3 **no tiene cobertura automatizada** en ninguno de los dos paquetes. Se compensa con la validación en org y se declara, como en TR-147"
  - "los gates de cada repo (lint, build) quedan limpios o su omisión se documenta. Antecedente a re-verificar: en NFPFundraising el lint **no atrapa** los `console.log` porque `eslint --print-config` devuelve 0 reglas activas sobre `npsWidget.js` y el script no cubre `payments` ni `ticketing`"
