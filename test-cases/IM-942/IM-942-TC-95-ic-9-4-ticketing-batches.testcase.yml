key: TC-95
title: IC 9.4 — Run Ticketing Batches (delivery hybrid v3, 2 automated + 1 manual)
description: |
  Cobertura QA de IM-942 (9.4 Run Ticketing Batches — deliver to Implementations,
  high-confidence). Junio delivery del Implementation Case
  `ic-9-4-ticketing-batches` v3 (hybrid, 2 automated + 1 manual). Confianza
  alta por reporte IM-735 (2026-06-12): hybrid — built+verified Tucson,
  cross-tested COMPLETED CamiloDev. BE PR #210 squash-merged a main
  (`e00dce53`); MigrationApp-dev seeded.

  Steps:
  - Step 1 (AUTOMATED T6): run Contact/Account Ticketing Data batches via
    global `Auctifera.PeopleManagerBatch` Callable (CONTACT_SET_LAST_VISIT_
    DATE / ACCOUNT_SET_LAST_VISIT_DATE) + enable Ticketing automatic
    schedule (`Auctifera__Schedule_Ticketing__c` + global
    `Auctifera.AutomaticBatchSchedule.execute`) que schedulea los non-global
    Visitor-Mgmt-Rollup + Ticketing-Reporting batches.
  - Step 2 (AUTOMATED T6): set `Auctifera__Confirm_Tickets_Automatically__c`
    en Ticketing_Settings__c desde un boolean operator input.
  - Step 3 (MANUAL): guide para el Early Bird Control batch (inert stub sin
    global entry point / no settings card en current packages).

  Validar:
  1) Contact & Account Ticketing Data batches launched + broken managed
     contract FAILS the step (no silent swallow),
  2) Ticketing automatic schedule enabled: checkmark + Visitor Management
     Rollup + Ticketing Reporting Fields batches scheduled + daily driver cron,
  3) Confirm Tickets Automatically follows client decision (true/false
     read-back verified + idempotent re-run),
  4) No hardcoded org-specific values,
  5) Early Bird Control MANUAL handoff.

  QA Sub-task asociada: IM-1004
  Riesgos abiertos:
  - Step 3 (Early Bird Control manual) es un "run if org still exposes the
    card, else no-op" — el operator debe documentar el outcome.
  - AC1 broken-contract branch requiere reproducir con method name inválido
    (probablemente via test-only spec, not real prod behavior).
type: integration
priority: high
status: active
preconditions:
- Implementation Case `ic-9-4-ticketing-batches` v3 deployado en prod (BE PR #210)
- Org target con Auctifera package instalado
- IE con permisos para ejecutar anonymous Apex + navegar Auctifera Ticketing Settings
- Acceso al catálogo prod para seedear v3
