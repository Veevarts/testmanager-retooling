    then:
      - "3.19 Branding & Theme, 3.15 Custom Apps: los tipos (BrandingSet/LightningExperienceTheme, CustomApplication.brand) son deployables pero los valores (logo/banner/avatar/favicon = ContentAsset uploads, hex/color per-cliente) NO son org-agnósticos → manual correcto"
      - "3.11 Create All Documents (managed Run-Scripts wizard sin entry point + User-object FLS/layout no API), 5.24 Tax Letter (paragraph fields namespace/org-variable, ausentes en el verify org), 5.25 Digital Cards (add-on con sign-off, slice delgado): sin automatización viable → manual correcto"
      - "3.32 End of Day Dashboard (managed-pkg install 04tQH000001Apbl válido, PackageInstallRequest future path) y 8.06 Sandbox Creation (Tooling SandboxInfo unsupported en la DE org, heavyweight/async): documentados como future automation paths, out-of-scope de correr → manual correcto (ninguno dejó automatización org-agnóstica sobre la mesa)"

  - title: "Spec v2 lockstep + gates + op-reuse + master inclusion — case+template bumped to v2 in lockstep, jest/tsc/eslint pass, no adapter/op changed (T3 settings reused, NOT genuinely-new), and the hybrid case reaches the master via the predicate-based selection (the PR-body WORKING_CASE_IDS pin is a superseded mechanism)"
