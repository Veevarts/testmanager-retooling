      - "step 4 es MANUAL: asignar los 5 permission sets de Veevart a cada user"
      - "quedan MANUAL por depender de client data y users específicos (no hay slice org-agnóstico) — decisión correcta para el HYBRID"

  - title: "The 7 UI/cosmetic cases correctly stay MANUAL — the spike's per-case decision is sound: each remaining case is file-upload / wizard / client-content bound or blocked by unsupported tooling, with no org-agnostic automatable slice worth an op"
    tags:
