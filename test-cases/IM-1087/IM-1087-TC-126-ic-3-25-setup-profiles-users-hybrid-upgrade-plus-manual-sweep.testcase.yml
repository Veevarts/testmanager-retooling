preconditions:
  - "GitHub CLI (`gh`) autenticado — diff + árbol en merge `5f1fdd1d` y base `a2ee3cbf` de MigrationAppBackend."
  - "Clone local de `MigrationAppBackend` con `npm ci` limpio + jest/tsc/eslint (CODE PR spec-only: evidencia primaria por código)."
  - "Node + jq/python3 para parsear el spec 3.25 v2 y auditar el diff/op-reuse + el mecanismo predicate-based del master seed."
  - "NO se requiere org ni IE run: live fue CamiloDevOrg-only (dev-proven) y el v2 no seeded (seed PENDING-CREDS)."

