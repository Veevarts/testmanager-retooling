id: "3f897c40-7e9d-4153-8807-3b6b540ee92b"
key: "TC-126"
title: "IM-1087 Manual-sweep spike (8 UI/cosmetic ICs) — validate the ONE upgrade (IC 3.25 Setup Profiles & Users v1→v2 manual→hybrid: 2 AUTOMATED T3 settings toggles + 2 MANUAL handoffs, reused op) and confirm the 7 stay-manual decisions are sound · CODE PR spec-only (reused T3 settings op, NOT genuinely-new)"
description: |
  Cobertura QA para IM-1087 (Historia, priority Medium/manual-confidence, epic IM-735 Implementation
  Cases Automation).
  QA Sub-task asociada: IM-1131 (creada 2026-07-27).

  Contexto:
  - Post-June IM-735 continuation, Phase 3 — probe-first manual sweep sobre 8 ICs UI/cosmetic buscando un
    slice de automatización parcial. Resultado del spike: **1 UPGRADE (3.25 → hybrid), 7 quedan manual**
    con evidencia live. Como se esperaba para el tier UI/cosmetic, la mayoría son file-upload / wizard /
    client-content bound sin un slice de metadata org-agnóstico. **NO hay op nuevo** — el upgrade reutiliza
    el op T3 `settings` existente.
  - PR bajo prueba: `Veevarts/MigrationAppBackend#259` (**MERGED** 2026-07-16 10:28Z).
    Branch: `task/spike-ui-cosmetic-IM-1087`. Merge commit `5f1fdd1d` (base `a2ee3cbf`). 2 files, +158/-15.
  - **CODE PR spec-only** — NO toca adapters/ops: reutiliza el op T3 `settings`. El diff son 2 files:
    `ic-3-25-setup-profiles-and-users.json` (v1→v2, feasibility manual→hybrid) + el nuevo lockstep
    `ic-3-25-setup-profiles-and-users.spec.ts`.
  - **Version chain (no defecto):** existe un follow-up IM-1087a (`#270`, merge `6c0614dd`) que bumpea 3.25
    v2→v3 endureciendo el guide manual del permset-assignment (2 files, mismo par spec+spec.ts). Este QA evalúa
    el v2 en `#259`; el v3 es un follow-up documentado, no un defecto (mismo patrón que IC 5.07 v2/v3 en TR-134).

  IC 3.25 v2 (feasibility hybrid, 4 steps) — el UPGRADE:
  - Step 1 (AUTOMATED T3 settings): UserManagementSettings.enableNewProfileUI=false (Enhanced Profile UI OFF),
    verify read-back, idempotente.
  - Step 2 (AUTOMATED T3 settings): SecuritySettings.enableAdminLoginAsAnyUser=true (Login Access Policies →
    Administrators Can Log in as Any User), verify read-back, sin tocar ninguna otra security/session setting.
  - Step 3 (MANUAL): crear los users del cliente con licencia + First/Last name obligatorios.
  - Step 4 (MANUAL): asignar los 5 permission sets de Veevart a cada user.
  (Writability probada live en CamiloDevOrg: un deploy de SecuritySettings round-trippea
  enableAdminLoginAsAnyUser — la org quedó en `false`, no se debilitó seguridad; enableNewProfileUI ya en false.)

  Los 7 que quedan MANUAL (decisiones del spike a re-verificar):
  - 3.19 Branding & Theme: BrandingSet/LightningExperienceTheme deployables, pero cada ThemeItem es
    client-specific (logo/banner/avatar = ContentAsset uploads + hex del cliente) → sin slice org-agnóstico.
  - 3.11 Create All Documents: managed "Run Scripts" Apex wizard (sin entry point callable); User-object FLS/layout
    no API-automatable; contenido Canadian tax legal.
  - 3.15 Custom Apps Setting & Branding: CustomApplication.brand.headerColor deployable pero el color es per-app
    del cliente; logos+favicon = ContentAsset uploads; app-clone-from-demo es wizard.
  - 3.32 End of Day Dashboard: install de managed package (04tQH000001Apbl válido); Tooling PackageInstallRequest
    documentado como future path; heavyweight/org-mutating, sin op.
  - 5.24 Tax Letter Set-up: los paragraph field API-names son namespace/org-variable (playbook vnfp__…; el verify
    org tiene Document Builder Auctifera__ y esos fields ausentes); list-view button sin op; signature/CRA labels content.
  - 5.25 Digital Membership Cards (ADD ON): add-on que requiere sign-off del cliente (no debe auto-correr); slice
    delgado; card actions/logo/email UI/file-bound.
  - 8.06 Sandbox Creation: heavyweight/async, out-of-scope de correr; Tooling SandboxInfo documentado pero
    unsupported en la DE verify org; post-create steps in-sandbox/wizard-bound.

  Estrategia de verificación:
  - **jest + tsc + eslint como evidencia PRIMARIA** (CODE PR spec-only): clone en merge `5f1fdd1d`, correr el
    seeds suite (dev: 19/19, 189 tests, incl. el nuevo lockstep de 3.25) + gates; re-derivar el conteo del dev.
  - **spec fidelity independiente**: parsear los 4 steps de 3.25 v2 (2 T3 settings con sus values + 2 manual) por
    cuenta propia, no solo el lockstep.
  - **op-reuse audit** (NO genuinely-new): confirmar que #259 NO toca adapters (2 files = spec + spec.ts); el op
    T3 `settings` y las keys (enableNewProfileUI/enableAdminLoginAsAnyUser/UserManagementSettings/SecuritySettings)
    ya existen en base `a2ee3cbf`.
  - **master-inclusion**: el PR body dice "pin ic-3-25 en WORKING_CASE_IDS" — ese mecanismo fue SUPERADO por la
    política predicate-based de IM-1090/IM-1096 (todos los auto/hybrid siempre incluidos; EXCLUDE_FROM_MASTER =
    solo ic-veevart-auth). El 3.25 hybrid entra al master por el predicado, no por un pin → el claim del body es
    stale pero el outcome es correcto (no defecto).
  - **7 stay-manual findings**: re-verificar que cada rationale es defendible (ContentAsset/wizard/namespace-variable/
    unsupported-tooling). Los probes live (Tooling/CamiloDevOrg) fueron dev-only; QA valida plausibilidad + catálogo.
  - **NO hay live IE run en este QA**: la verificación live fue CamiloDevOrg-only (dev-proven) y el v2 NO está seeded
    a MigrationApp-dev (seed PENDING-CREDS, AWS SSO expirado). Live = dev-proven/PENDING-CREDS, no PASS/FAIL prematuro.

  Riesgos abiertos (del ticket):
  - **Seed PENDING-CREDS**: v2 no seeded (append-only) → seed en cred refresh; bloquea re-correr via la app.
  - **manual-confidence tier**: 7/8 cases quedan manual por diseño (UI/file/content bound). El valor QA aquí es
    validar el 1 upgrade correctamente Y que los 7 manual-stay no dejaron automatización viable sobre la mesa.
  - Verificado por el dev en CamiloDevOrg. QA re-verifica por código.

