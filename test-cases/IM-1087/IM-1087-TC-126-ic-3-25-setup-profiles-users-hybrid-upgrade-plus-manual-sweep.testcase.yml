    then:
      - "step 2 es AUTOMATED, toolName=T3, op=settings sobre SecuritySettings con values {enableAdminLoginAsAnyUser:true}"
      - "el op verifica leyendo el setting de vuelta como true; ninguna otra security/session setting se modifica (values contiene solo esa key)"
      - "writability probada live en CamiloDevOrg: un deploy de SecuritySettings round-trippea enableAdminLoginAsAnyUser — el probe dejó la org en false (no debilitó seguridad)"

  - title: "AC3 · Client-specific work remains a guided handoff — steps 3 and 4 stay MANUAL: create the client's users (license + mandatory First/Last name) and assign the five Veevart permission sets, because they depend on client data and specific users"
    tags:
