    when:
      - "se parsea el step 1 y su op"
    then:
      - "step 1 es AUTOMATED, toolName=T3, op=settings sobre UserManagementSettings con values {enableNewProfileUI:false}"
      - "el op verifica leyendo el setting de vuelta como false; es idempotente (no-op cuando ya está disabled)"
      - "dev-proven live en CamiloDevOrg: enableNewProfileUI ya estaba en false (lee false, coherente con IC 3.05)"

  - title: "AC2 · Enable 'Administrators Can Log in as Any User' automatically — step 2 (T3 settings) sets SecuritySettings.enableAdminLoginAsAnyUser=true, verifies by reading it back as true, and modifies no other security or session setting"
    tags:
