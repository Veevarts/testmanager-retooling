title: "IC 7.02 Set History Tracking for Gift Shop — NEW validationRule T3 op + 2 objects · 23 fields con IM-1069 matchers · double label-trap Total/Paid_Value · 1 handoff MANUAL"
description: |
  Cobertura QA para IM-1073 (Historia, priority Medium, epic IM-735 Implementation
  Cases Automation).
  QA Sub-task asociada: IM-1112 (creada 2026-07-23).

  Contexto:
  - Post-June IM-735 continuation, Batch A (history-tracking family). Hermano de
    IM-1074 (IC 8.05 Rentals) pero con un elemento NUEVO: el `validationRule` T3 op.
  - IC 7.02 = "Set History Tracking for Gift Shop" (Order__c 7.02 en el catálogo
    Auctifera SF).
  - **Tier: Medium** (caveat: cross-version managed field/object API names — mitigado
    por matcher runtime de IM-1069).
  - PR bajo prueba: `Veevarts/MigrationAppBackend#245` (**MERGED** 2026-07-15 21:47Z).
    Branch: `task/ic-7-02-history-tracking-gift-shop-IM-1073`. Merge commit `bb9a7e38`.
  - Files touched (7, +631/-32 — NO es spec-only, es un CODE PR):
    * `metadata-mutation-spec.ts` (+61) — schema del nuevo validationRule op
    * `metadata-mutation-spec.spec.ts` (+1)
    * `t3-metadata.adapter.ts` (+150) — implementación del validationRule op
    * `t3-metadata.adapter.spec.ts` (+230) — 8 tests del adapter
    * `t3-metadata.handler.ts` (+22) — lambda handler wiring
    * `t3-metadata.handler.spec.ts` (+24)
    * `ic-7-02-history-tracking-gift-shop.json` (+143/-32) — spec v2

  Cambio principal (2 partes):

  **PARTE A — NUEVO T3 op `validationRule` (reusable, zero per-IC code)**:
  - Activate/deactivate validation rules por `fullName` via synchronous CRUD Metadata
    API: read → flip `active` → full-component write (normaliza jsforce xsi:nil /
    typed-scalar) → read-back verify. Mismo shape que workflowRule/recordTypes op.
  - `anyOf` candidate fullNames drift-tolerant (managed rules namespace el rule
    developer name → prueba bare Y namespaced).
  - **deactivate + absent = idempotent success no-op** (absence ya satisface
    "be inactive"). **activate + absent = applied=false** (nunca crea rule).
  - Subscribers PUEDEN toggle MANAGED validation rules — proven live por dev en CamiloDevOrg.

  **PARTE B — ic-7-02 spec v2 (feasibility auto → hybrid)**:
  - 4 steps: (1) validationRule deactivate Restrict_Misc_Gift_Card, (2) historyTracking
    Client Purchases 9 fields, (3) historyTracking Shop Item 14 fields, (4) MANUAL
    tick 2 Name fields.
  - Todos los 23 fields con matcher `{anyOf:[apiName], label}` (IM-1069 pattern).
  - **NON-exclusive (additive)**: flag `exclusive` ausente → preserva tracking pre-existente.
  - Cierra la open-question IM-935: `Shopify_Product_Id__c` resuelto como required matcher.

  Object/field resolution (verified live en 2 orgs por dev):
  - **Client Purchases** = `Auctifera__ClientPurchase__c` — 9 fields:
    Amount Received=`Paid_Value__c` (NO `Paid_Value1__c` label "Paid Value"),
    Total=`Total2__c` (el live non-deprecated; hay 2 fields con label "(Deprecated) Total").
  - **Shop Item** = `Auctifera__CatalogItem__c` — 14 fields incl `Shopify_Product_Id__c`.

  Evidencia dev (per PR body #245):
  - Gates: jest (touched + seed suites), tsc --noEmit, eslint — all green.
  - CamiloDevOrg + im696-tucson: all automated steps COMPLETED, parks at MANUAL Name-field step.
  - Independent read-back en 2 orgs: enableHistory=true; 9/9 Client Purchase + 14/14
    Shop Item trackHistory=true; Restrict_Misc_Gift_Card absent (no-op).
  - validationRule op write-branch proven live en CamiloDevOrg: managed VR deactivated
    (Active=false) then reactivated (Active=true), org left unchanged.
  - ic-7-02 v2 seeded a MigrationApp-dev. Backend redeploy required.

  QA cross-check con el catálogo SF (per `[[reference-implementation-cases-catalog]]`):
  - CSV Order 7.02 lista el pre-step EXACTO: "Before do this... Set up → object manager
    → 'Shop item' → Validation rules → deactivate: Restrict_Misc_Gift_Card". El spec
    step 1 (validationRule) es fiel al playbook.
  - CSV Client Purchases: 10 fields (incl Name) → 9 non-Name = MATCHES spec (9).
  - CSV Shop Item: 15 fields (incl Name) → 14 non-Name = MATCHES spec (14).
  - CSV declara ambos Name fields como manual tick → spec MANUAL step los cubre.

  Riesgos abiertos:
  - **Restrict_Misc_Gift_Card no existe** en el package actual ni en test orgs. El
    pre-step no-op safely self-heals en cualquier client org que tenga tal rule.
    Open-question del ticket: PM confirma el rule/name intended si un client org
    específico motivó el pre-step.
  - **Target-org portability**: dev verified CamiloDevOrg + im696-tucson; QA agrega
    illinois-trainings (Gift Shop confirmed installed).
  - **Double label-trap**: hay DOS fields con label "(Deprecated) Total" (`Total__c`
    + `Total_Amount__c`) más el storage `Total2__c`. Si el matcher se rompe, podría
    resolver al deprecated. QA verifica live.
  - **Additive**: si alguien flipea `exclusive: true`, borra tracking existente.
  - PR ya MERGED — baseline vs post-fix entre merge-base `140e00d4` y merge commit `bb9a7e38`.

