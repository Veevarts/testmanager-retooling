  then:
  - "los prompts repetidos quedan **espaciados según el intervalo configurado**: con el valor en 3, aparece en la primera interacción elegible y luego cada 3"
  - "con el valor en **0** aparece en **cada** interacción elegible — así lo describe el texto de ayuda del control"
  - "el espaciado se cuenta por respondent, y para una General **global** el estado se cuenta por `clientOrgId` (semántica confirmada en TR-146 y ya elevada a producto)"
  - "revert-proof: los tests *uses triesBetweenShows to space repeated prompts after the first eligible interaction* y *spaces repeated prompts from the configured interaction threshold* **CAEN** al revertir — se observaron cayendo en TR-146"
