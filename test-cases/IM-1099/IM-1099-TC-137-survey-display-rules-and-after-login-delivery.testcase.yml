  given:
  - una survey configurada con un **`Start Date` futuro**
  when:
  - se evalúa la eligibility antes de esa fecha, y luego se repite con una survey cuyo `Start Date` ya pasó y cuya condición de interacciones se cumple
  then:
  - "con `Start Date` futuro la survey **NO se devuelve como elegible**, sin importar que el resto de las reglas pasen — la fecha es un gate duro y anterior"
  - "con `Start Date` ya cumplido y la condición de interacciones satisfecha, la survey **sí se devuelve**, siempre que las reglas de frecuencia y audiencia también pasen"
  - "el gate es **fail-closed**: ante una fecha ausente o inválida no se entrega la survey"
  - "revert-proof: revirtiendo el código de display rules al commit base, el test *blocks immediate surveys before Start Date* **FALLA** — ya se observó cayendo en el revert-proof de TR-146, acá hay que confirmarlo con el comportamiento en vivo"
- title: 'IM-1099 AC5 — Max dismissals per period stops the survey once the limit is reached, and the next period resets the dismissal window'
  tags:
  - edge-case
  - im-1099
  - im-1156
  - im-970
  - ac-5
  - dismissals
  - display-rules
  - pr-31
  given:
  - una survey con **`Max dismissals per period`** configurado y una ventana de repetición conocida
  when:
  - un respondent descarta la survey hasta alcanzar el límite dentro del período vigente
  then:
  - "alcanzado el límite, la survey **deja de aparecer** para ese respondent"
  - "al iniciar el siguiente período, la ventana de dismissals **se resetea** y la survey vuelve a ser elegible"
  - "para una General Survey, dejar el campo vacío significa que **un solo dismissal la oculta** — así lo declara el texto de ayuda del formulario, y es un default con consecuencias, no un detalle"
  - "**LÍMITE PRÁCTICO A DECLARAR:** el reset de período depende del paso del tiempo real (30/90/180/365 días según `Repeat window`). Si no es observable dentro de la ventana de ejecución, se cubre a nivel de suite —el test *blocks once the per-survey Max shows per day is reached* y sus vecinos— y **se declara explícitamente como no ejercitado en vivo**, nunca se finge"
- title: 'IM-1099 AC6 — Tries between shows spaces repeated prompts according to the configured interaction interval'
  tags:
  - edge-case
  - im-1099
  - im-1156
  - im-970
  - ac-6
  - spacing
  - display-rules
  - pr-31
  given:
