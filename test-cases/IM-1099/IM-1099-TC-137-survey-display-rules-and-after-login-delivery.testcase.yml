title: IM-1099 — Survey display rules UX and after-login General Survey delivery — Start Date gating, one-time and frequency controls, dismissal and spacing limits, after-login launchers in both Salesforce packages, userCreatedDate propagation with valid ISO formatting, and filtered CSV response export
description: |
  Cobertura QA de IM-1099 (**Refine survey display rules UX**), bajo el epic
  IM-970 NPS Survey Tool delivery. QA Sub-task asociada: **IM-1156**.

  ## Qué es esta historia

  Es la historia **paraguas** del trabajo de display rules y entrega after-login del epic. Tiene
  **15 ACs** y abarca tres frentes: (a) la UX y el runtime de las reglas de aparición en el
  survey-tool, (b) la entrega *after-login* de la General Survey hacia los dos paquetes de
  Salesforce, y (c) el export CSV de respuestas.

  ## PRs bajo prueba — mapeo AC ↔ PR derivado por QA

  Todos merged sobre ramas **épicas**, ninguno en `main`.

  | PR | Merge | Tag del título | ACs |
  | --- | --- | --- | --- |
  | survey-tool **#30** `feat: refine survey display timing UX` | `60e1058c` | IM-965 | AC1, AC2, AC3 |
  | survey-tool **#31** `fix: refine survey display rule controls` | `8c1e78b1` | **IM-1099** | AC4, AC5, AC6 |
  | survey-tool **#29** `fix: improve general survey audience and frequency UX` | `7f55b912` | — | AC7 |
  | survey-tool **#32** `feat: add general survey login trigger` | `338f6b1c` | **IM-1099** | AC8, AC10 |
  | survey-tool **#33** `fix: include user created date in general survey responses` | `36e6a0e5` | **IM-1099** | AC11 |
  | survey-tool **#34** `feat: export survey responses csv` | `14bde9d2` | **IM-1099** | AC13, AC14 |
  | AuctiferaDX **#2527** `feat: add after-login NPS survey trigger` | — | **IM-1099** | AC9 (Giftshop) |
  | AuctiferaDX **#2536** `feat(nps): add after-login survey launcher` | — | **IM-1099** | AC9 (Giftshop) |
  | NFPFundraising **#2135** `feat(nps): integrate nps survey widget…` | `215bab6a` | REN-394 | AC9 (Fundraising), AC12 |

  El PR #30 lleva el tag **IM-965** y no IM-1099, pero implementa los AC1–AC3 de esta historia; el
  #2135 lleva **REN-394**. El mapeo lo derivó QA leyendo los diffs y queda acá para que dev lo
  confirme o lo corrija.

  ## Qué ya está validado y NO hay que repetir

  Buena parte de esta historia ya se ejecutó al validar dos historias hermanas del mismo epic. El
  ejecutor debe **reutilizar esa evidencia** en vez de rehacerla:

  - **TR-146** (IM-966 / TC-96, 11/11 PASS) — cubre el **AC7** (General `To everyone` evaluada para
    cualquier organización ACTIVA, con el gate `isActiveClientOrg` y el caso
    `general_client_org_inactive`) y el **AC11** por el lado del servicio (el submit re-evalúa la
    eligibility y exige `userCreatedDate`; 400 `user_created_date_missing`). También dejó medido el
    blast radius: **6 subjects** sirven la General.
  - **TR-147** (IM-968 / TC-136, 6/9 PASS) — cubre la **mitad NFPFundraising del AC9**: login real
    en la app Fundraising, modal renderizado tras el delay, respuesta atribuida. Y dejó verificado el
    contrato del launcher (`clientOrgId`, `respondentId`, `userCreatedDate` reales).

  **El delta real de esta historia**, o sea lo que NADIE validó todavía:
  - Las **display rules** completas (AC1–AC6): Start Date, opciones por interacciones, desaparición
    de la opción vieja, one-time deshabilitando controles incompatibles, max dismissals por período
    con reset, y tries between shows. En TR-146 solo se observó que sus tests CAEN al revertir —
    nunca se ejercitaron funcionalmente.
  - La **mitad Auctifera Giftshop del AC9** (#2527 / #2536).
  - El **formato de fecha** del AC12 (que no se produzcan valores inválidos tipo `2026-7-1`).
  - El **export CSV** completo (AC13, AC14) — sin tocar en ninguna corrida previa.
  - El **AC15**: que las rutas públicas sigan funcionando sin autenticación de admin.

  ## Riesgos abiertos

  - **⚠️ Nada de esto está en `main`.** Los seis PRs de survey-tool viven en
    `epic/nps-survey-delivery-and-metrics`; los de AuctiferaDX en su rama épica; el de
    NFPFundraising en `epic/nps-survey-delivery`, con `main` **diverged** (1 ahead / 9 behind).
    Ya se reportó en IM-966 y en IM-968. QA valida comportamiento; el merge es un paso de release
    aparte y fuera del control de este test case.
  - **La historia hermana IM-968 está en `Rechazado`** (TR-147): el PR de NFPFundraising agrega 20
    `console.log` y no justifica la duplicación. Ese rechazo NO bloquea esta historia —los ACs son
    distintos— pero el AC9 comparte código con ese PR, así que si el dev lo corrige hay que
    re-verificar la mitad Fundraising.
  - **AC1 y AC4 son de UI pura**: se validan mirando el formulario, no por API. Requieren acceso al
    admin del survey-tool.
  - **AC5 y AC6 dependen del paso del tiempo o de muchas interacciones** (períodos de dismissal,
    espaciado entre shows). Puede que no sean observables en vivo dentro de una ventana razonable;
    en ese caso se cubren a nivel de suite y se declara explícitamente, nunca se fingen.
  - **AC9 nombra "Auctifera Giftshop"**: hay que confirmar en qué app/utility bar concreta está
    montado el launcher de Auctifera antes de ejecutar. La org de Auctifera (`nps_2`) **expira el
    2026-07-31**, así que esa mitad hay que correrla ya o queda `not-run`.
  - **Configurar cualquiera de estos escenarios exige escribir en el entorno dev COMPARTIDO** del
    survey-tool. Por el AC7 de IM-966, mientras exista una General activa con audiencia global no se
    puede crear otra activa (409). Requiere ventana autorizada y restauración verificada.
  - **El AC12 se origina en un fix de `RosterDateSelector`** que viaja en el PR de NFPFundraising y
    que, estrictamente, no es de dominio NPS. Se verifica como parte de esta historia porque el AC lo
    pide, pero conviene que producto confirme que ese es el alcance esperado.
