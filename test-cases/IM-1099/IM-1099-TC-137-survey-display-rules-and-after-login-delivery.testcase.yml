  given:
  - un admin autenticado en `https://surveytool.dev.veevart.ai/admin/surveys`
  - el formulario de creación o edición de una survey abierto
  when:
  - se inspecciona el bloque **`When to show it`** y luego se cambia **`Repeat window`** a **`One time`**
  then:
  - "el bloque presenta **`Start Date`** y las opciones por interacciones — los dos radios observados en corridas previas son `Immediately on the first eligible interaction` y `After N interactions`"
  - "**la opción vieja de *contador igual a un número específico de usos* YA NO APARECE** — ésta es la mitad del AC1 que hay que verificar por ausencia, no por presencia, así que hay que mirarla explícitamente"
  - "al elegir **`One time`** en `Repeat window`, los controles de frecuencia incompatibles quedan **deshabilitados u ocultos**: no se puede configurar a la vez *una sola vez* y *una ventana de repetición*"
  - "el texto de ayuda del propio control lo explica: *One time means answered respondents never see it again. Other windows reset dismissal limits at the next period.*"
  - "OJO al probar: **`Start Date` es obligatorio en la UI** aunque la API lo acepte vacío. Si el botón `Create` no responde, es por eso — ya se observó dos veces en TR-146 y TR-147"
- title: IM-1099 AC2 + AC3 — A survey with a future Start Date is never eligible, and once the Start Date has passed it becomes eligible as soon as the interaction condition is met and the remaining rules allow it
  tags:
  - happy-path
  - negative
  - im-1099
  - im-1156
  - im-970
