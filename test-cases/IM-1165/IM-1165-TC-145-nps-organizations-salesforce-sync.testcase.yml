key: "TC-145"
title: "NPS Survey Tool — organizations sync from Salesforce active client Accounts + Org_ID_18__c as primary identifier"
description: |
  Cobertura QA para IM-1165 (Sync NPS organizations from Salesforce active client accounts),
  del epic IM-970 NPS Survey Tool delivery. QA Sub-task: IM-1188.

  El objetivo del ticket es que las organizaciones del Survey Tool en producción se poblen
  automáticamente desde el catálogo central de Salesforce (Accounts con
  `Actual_Client__c = true` y `Org_ID_18__c != null`), y que el identificador primario deje
  de ser el subdomain de Salesforce para pasar a ser `Org_ID_18__c` (18 caracteres, prefijo
  `00D`). Esto habilita la evaluación de elegibilidad NPS invocada desde los paquetes
  gestionados Auctifera y VNFP usando `UserInfo.getOrganizationId()`.

  Repos esperados en el diff:
  · `survey-tool` — endpoints admin de organizaciones, adapter que resuelve org por SF org id,
    validación del formato del identificador, y comportamiento condicional por env
    (`prd` vs `stg`/`dev`).
  · `AuctiferaDX` — paquete Salesforce que envía el contexto de organización en las llamadas
    NPS.
  · `NFPFundraising` — paquete Salesforce que envía el contexto de organización en las
    llamadas NPS.

  QA verifica los 8 ACs del ticket + 1 escenario negativo para validación del formato
  `Org_ID_18__c` (rechaza valores que no sean 18 chars o que no empiecen con `00D`).

  Riesgos abiertos:
  · No hay PR referenciado en la descripción; el executor debe resolverlo por rama
    `task/...-IM-1165` o issuelinks al arrancar la ejecución.
  · La fuente exacta del catálogo central de Salesforce ("central Salesforce account
    catalog") no está identificada en el ticket — el executor debe confirmar el org/alias
    con el usuario antes de correr AC1/AC2 en vivo.
  · No hay ejemplos concretos (ni cuentas, ni Org IDs) en la descripción — el executor debe
    solicitar 1 Account real de cada categoría (client con Org_ID_18__c, client sin
    Org_ID_18__c, y no client) para evitar falsos positivos.
  · El comportamiento en staging/dev es XOR (Org ID 18 O subdomain, nunca ambos a la vez);
    UI enforcement debe ser validado a mano en la form.

