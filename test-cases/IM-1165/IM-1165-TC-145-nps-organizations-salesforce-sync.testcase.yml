preconditions:
  - "Acceso al catálogo central de Salesforce (`Account.Id`, `Account.Name`, `Account.Actual_Client__c`, `Account.Org_ID_18__c`, `Account.Domain__c`); el executor confirma el alias/org exacto con el usuario antes de AC1/AC2 en vivo."
  - "Acceso admin al Survey Tool en los tres entornos: `https://surveytool.veevart.ai/admin/organizations` (prd), `https://surveytool.stg.veevart.ai/admin/organizations` (stg), `https://surveytool.dev.veevart.ai/admin/organizations` (dev)."
  - "Al menos una scratch org con paquete Auctifera instalado y una scratch org con paquete NFPFundraising instalado, ambas ejercitables end-to-end (login como System Administrator + trigger de un flujo que dispare la evaluación NPS)."
  - "Repositorios `Veevarts/survey-tool`, `Veevarts/AuctiferaDX`, `Veevarts/NFPFundraising` clonados; branch del PR o el HEAD de la rama del ticket disponible en local."
  - "Node/npm para correr los tests del paquete server del `survey-tool`; `sf` CLI para inspecciones SOQL sobre el catálogo Salesforce y las scratches."

scenarios:
  - title: "IM-1165 AC1 — Prod Organizations page populates from Salesforce Accounts with Actual_Client__c=true AND Org_ID_18__c not null"
    tags:
      - ac-1
      - happy-path
      - prd
      - salesforce-sync
    given: |
      Given el catálogo central de Salesforce contiene Accounts con la combinación
      `Actual_Client__c = true` AND `Org_ID_18__c IS NOT NULL`
      And el Survey Tool en `prd` está desplegado con acceso admin via SSO
    when: |
      When se abre `https://surveytool.veevart.ai/admin/organizations` como admin autenticado
      And se ejecuta la SOQL de referencia sobre el catálogo:
      `SELECT Id, Name, Actual_Client__c, Org_ID_18__c FROM Account WHERE Actual_Client__c = true AND Org_ID_18__c != null`
    then: |
      Then la lista de organizaciones en la UI de prd contiene EXACTAMENTE las mismas
      Accounts que devuelve la SOQL (mismo count, mismos `Org_ID_18__c`, mismos names)
      And ninguna organización mostrada tiene `Actual_Client__c = false` en Salesforce
      And ninguna organización mostrada tiene `Org_ID_18__c` vacío
      And si el count difiere, el delta queda documentado con el ID de Account
      correspondiente para diagnóstico

  - title: "IM-1165 AC2 — Salesforce Account marked Actual_Client__c=true but with blank Org_ID_18__c is NOT auto-populated (manual-only path)"
    tags:
      - ac-2
      - happy-path
      - salesforce-sync
      - fallback
    given: |
      Given el catálogo de Salesforce contiene al menos 1 Account con
      `Actual_Client__c = true` AND `Org_ID_18__c IS NULL`
    when: |
      When se refresca la sincronización de organizaciones en Survey Tool prd
      And se busca esa Account por nombre en la lista de organizaciones
    then: |
      Then la Account NO aparece en la lista de organizaciones auto-sincronizadas
      And el admin puede añadirla manualmente desde la form de creación (una vez que un
      operador provea el `Org_ID_18__c` correspondiente)
      And no se emite ningún error en el log del server por la Account "incompleta"
      And la SOQL de control muestra que la Account sigue siendo cliente pero le falta el
      `Org_ID_18__c`

  - title: "IM-1165 AC3 — Org_ID_18__c is the primary identifier used to store/evaluate a synced organization instead of Salesforce subdomain"
    tags:
      - ac-3
      - happy-path
      - contract
    given: |
      Given una organización sincronizada desde Salesforce (via AC1)
    when: |
      When se inspecciona el registro almacenado en la tabla DynamoDB
      `veev-<region>-prd-survey-tool-organizations` para esa organización
      And se cruza contra el catálogo Salesforce por `Account.Id`
      And se busca cualquier código de resolución interna que use "subdomain" en las rutas
      admin (`grep -R "subdomain" server/src/`)
    then: |
      Then el registro persistido usa `Org_ID_18__c` como identificador primario (PK o
      atributo canónico) — NO se usa el subdomain de Salesforce como PK
      And los endpoints admin devuelven el `Org_ID_18__c` como identificador principal en
      el payload de respuesta
      And si aparece un uso de subdomain, solo ocurre en rutas legacy o de fallback (AC8),
      nunca en el request-path de resolución primaria en prd
      And `Domain__c` NO se trata como Salesforce subdomain (queda solo como campo de
      display/reference)

  - title: "IM-1165 AC4 — NPS request from Auctifera or VNFP is resolved using UserInfo.getOrganizationId() (18-char SF org id)"
    tags:
      - ac-4
      - happy-path
      - auctiferadx
      - nfpfundraising
      - integration
    given: |
      Given una scratch org con paquete Auctifera instalado y otra con paquete VNFP
      instalado, ambas ya sincronizadas como organizaciones en Survey Tool
      (`Org_ID_18__c` de la scratch presente en la lista)
      And ambos paquetes son capaces de invocar la evaluación NPS del Survey Tool
    when: |
      When en la scratch Auctifera se ejecuta el flujo que dispara la evaluación NPS
      (login como System Administrator + acción que llama al endpoint público del Survey
      Tool con contexto de org)
      And en la scratch VNFP se repite el mismo tipo de flujo
      And en ambos casos se captura el payload enviado por el paquete Salesforce
    then: |
      Then el payload enviado por cada paquete incluye el resultado de
      `UserInfo.getOrganizationId()` como identificador de organización (18 chars,
      empieza con `00D`)
      And el Survey Tool resuelve la organización usando ese identificador contra su tabla
      `organizations` (no contra un subdomain)
      And la respuesta del endpoint público (eligible / feature-lookup) refleja la
      configuración de features asignada a esa organización
      And si la org no está sincronizada, la respuesta es un shape válido (200 con
      lista vacía o 404 según contrato), no un 500 por fallback roto

  - title: "IM-1165 AC5 — Production manual organization form HIDES the subdomain field and REQUIRES Salesforce Org ID 18"
    tags:
      - ac-5
      - happy-path
      - prd
      - manual-form
      - ui
    given: |
      Given un admin autenticado en `https://surveytool.veevart.ai/admin/organizations`
      (env `prd`) con permiso para crear organizaciones manuales
    when: |
      When se abre el modal / la pantalla de creación manual de organización en prd
      And se inspecciona el DOM y los campos del form (via el snapshot de Playwright)
      And se intenta enviar el form sin `Org_ID_18__c`
    then: |
      Then el campo `subdomain` NO aparece en el DOM del form en prd
      And el campo `Salesforce Org ID 18` está presente, marcado como `required`, y con
      la validación de formato aplicada
      And el submit sin `Org_ID_18__c` es rechazado con un mensaje claro
      And el admin no tiene forma de crear una organización manual en prd sin proveer
      un `Org_ID_18__c` válido

  - title: "IM-1165 AC6 — Staging/dev manual organization form allows EITHER Salesforce Org ID 18 OR subdomain, but not both at the same time (XOR)"
    tags:
      - ac-6
      - happy-path
      - stg
      - dev
      - manual-form
      - ui
    given: |
      Given un admin autenticado en `https://surveytool.stg.veevart.ai/admin/organizations`
      Y otro admin autenticado en `https://surveytool.dev.veevart.ai/admin/organizations`
    when: |
      When en ambos entornos se abre el modal de creación manual de organización
      And se prueban 3 casos: (a) solo `Org_ID_18__c`, (b) solo `subdomain`, (c) ambos a
      la vez
    then: |
      Then el caso (a) es aceptado y la organización queda creada con `Org_ID_18__c` como
      identificador
      And el caso (b) es aceptado y la organización queda creada con `subdomain` como
      identificador (modo fallback documentado en AC8)
      And el caso (c) es rechazado por la UI con un mensaje que indica que solo un
      identificador puede estar presente a la vez
      And el server-side también rechaza el payload con ambos campos (defensa en
      profundidad, no solo UI)

  - title: "IM-1165 AC7 — Salesforce Org ID 18 validation: value must be exactly 18 characters AND start with '00D'"
    tags:
      - ac-7
      - happy-path
      - validation
      - manual-form
    given: |
      Given la form de creación manual de organización en cualquier entorno donde
      `Org_ID_18__c` esté disponible (prd, stg, dev)
    when: |
      When se envía un valor válido: 18 chars exactos, primeros 3 = `00D`
      And se inspeccionan tanto la validación client-side como la server-side
    then: |
      Then el submit con el valor válido es aceptado y la organización queda persistida
      con ese `Org_ID_18__c`
      And la validación queda aplicada consistente en client y server (no basta con
      client-side)
      And el campo persiste el valor sin transformaciones no documentadas (no
      lowercasing, no truncation, no re-padding)

  - title: "IM-1165 AC7-negative — Salesforce Org ID 18 that is not 18 chars OR does not start with '00D' is rejected"
    tags:
      - ac-7
      - negative
      - validation
      - manual-form
    given: |
      Given la form de creación manual de organización con `Org_ID_18__c` requerido
    when: |
      When se prueban valores inválidos: 17 chars, 19 chars, 18 chars pero prefijo
      distinto de `00D` (ej. `AAA...`), string vacío, y string con caracteres no
      alfanuméricos
    then: |
      Then cada valor inválido es rechazado por la validación con un mensaje que menciona
      la regla de formato (18 chars, prefijo `00D`)
      And el rechazo ocurre tanto en client-side como en server-side (probar el server
      directamente con la request para confirmarlo)
      And ningún registro basura queda persistido en la tabla `organizations` como
      efecto secundario de los intentos fallidos

  - title: "IM-1165 AC8 — Legacy/dev NPS requests providing only subdomain continue to resolve via subdomain-based fallback outside production"
    tags:
      - ac-8
      - happy-path
      - dev
      - stg
      - legacy
      - fallback
    given: |
      Given existen tests o flujos legacy que invocan el eligible endpoint del Survey Tool
      pasando SOLO `subdomain` (sin `Org_ID_18__c`)
      And al menos una organización manual en dev/stg fue creada con `subdomain` (AC6
      caso b)
    when: |
      When se ejecuta el request legacy contra los endpoints públicos del Survey Tool en
      `dev` y `stg`
      And se ejecuta la suite de tests del paquete server (`npm test`) que cubre esos
      endpoints
    then: |
      Then el request legacy resuelve la organización via subdomain sin romperse
      And ninguno de los tests existentes que ejercitan el fallback subdomain empieza a
      fallar por el cambio a `Org_ID_18__c` como primario
      And en `prd` el fallback por subdomain NO está activo (para prd solo se acepta
      resolución por `Org_ID_18__c`; requests legacy que solo mandan subdomain contra
      prd son rechazados o devuelven not-found controlado)
