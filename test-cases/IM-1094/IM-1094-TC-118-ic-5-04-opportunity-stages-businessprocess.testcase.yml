title: "IC 5.04 Opportunity Stages — NEW T3 businessProcess-authoring op (StandardValueSet stage-ensure + BusinessProcess UPSERT + dynamic RT assign) · manual→auto v2 · CODE PR (jest-contract) + live authoring on illinois"
description: |
  Cobertura QA para IM-1094 (Historia, priority Medium, epic IM-735 Implementation
  Cases Automation).
  QA Sub-task asociada: IM-1123 (creada 2026-07-24).

  Contexto:
  - Follow-up del spike de metadata-gap IM-1086. IC 5.04 era MANUAL (no automatable con
    los ops existentes); este ticket construye un op T3 NUEVO (`businessProcess`) que
    autora Sales Processes + asegura OpportunityStage picklist values, y reescribe el
    spec ic-5-04 manual→auto (feasibility auto, v2).
  - IC 5.04 = "Set up Opportunity Stages" (Order__c 5.04 en el catálogo Auctifera SF).
  - **Tier: label manual-confidence** (era manual; ahora auto por el op nuevo).
  - PR bajo prueba: `Veevarts/MigrationAppBackend#263` (**MERGED** 2026-07-16 14:16Z).
    Branch: `task/ic-5-04-opportunity-stages-businessprocess-IM-1094`. Merge commit `ed3da574`
    (base `82c35b14`, head `a55f3707`).
  - **CODE PR** (8 files, +1736/-20 — NO spec-only):
    * `metadata-mutation-spec.ts` (+177) — schema del op businessProcess (StageValueEnsure,
      BusinessProcessStage, BusinessProcessAssignment, BusinessProcessEnsure, BusinessProcessSpec)
    * `t3-metadata.adapter.ts` (+647) — implementación del op
    * `t3-metadata.adapter.spec.ts` (+589) — ~10 tests del op businessProcess
    * `t3-metadata.handler.ts` (+52) / `.handler.spec.ts` (+82) — lambda wiring
    * `ic-5-04-opportunity-stages.json` (+84/-18) — spec v2 (manual→auto)
    * `ic-5-04-opportunity-stages.spec.ts` (+104) — 5 seed spec tests

  El op `businessProcess` (catalog-declarative, zero per-IC code) hace 3 fases:
  1. **stageValues** (opcional): asegura cada stage referenciado en el OpportunityStage
     StandardValueSet — agrega los faltantes con los flags forecast/probability/closed/won,
     re-activa listados inactivos; **add/activate-only** (nunca desactiva ni reescribe stock).
  2. **processes**: UPSERT de cada BusinessProcess (update-in-place si ya existe por nombre,
     nunca duplica; idempotente) con sus stages ordenados, marcado active.
  3. **assignments**: para cada `assignTo` (RT resuelto dinámicamente por developerName/label)
     y el proceso con `assignToRemaining`, re-apunta `RecordType.businessProcess`; `optional`
     tolera RT ausente/ambiguo (skip no-op); `assignToRemaining` salta record types managed
     (namespaced) sin fallar por el CANNOT_MODIFY_MANAGED_OBJECT.

  Spec v2 (Opportunity): 6 stageValues (Prospecting, Letter of Interest Submitted,
  Application Submitted, Pledged, Closed Won, Closed Lost) + 2 processes:
  - **NPSP_Default** (active, assignToRemaining=true): Prospecting → Pledged → Closed Won → Closed Lost.
  - **Grants** (active, assignTo Grant RT optional): Prospecting → Letter of Interest Submitted →
    Application Submitted → Closed Won → Closed Lost.

  Estrategia de verificación:
  - **jest code-contract** (evidencia PRIMARIA — es un op nuevo): clone de MigrationAppBackend
    en merge-commit `ed3da574`, npm ci, correr las 3 suites tocadas + la seed.spec; verificar
    los ~10 tests del op businessProcess + 5 seed tests. Más genuinely-new proof (grep base vs merge).
  - **static spec fidelity**: ic-5-04 v2, feasibility auto, stageValues + processes correctos.
  - **live authoring** via Migration App (Path A) en illinois-trainings: partial por el setup
    del org (ver riesgos) — stage-value ensure + BusinessProcess authoring observables; RT-assign
    parcial (illinois tiene 0 Opportunity record types → prueba el path optional tolerate-absent).

  Riesgos abiertos / limitaciones de org:
  - **illinois-trainings tiene NPSP instalado (44 campos npsp__) pero 0 Opportunity record types
    y 0 sales processes** — NO es un fundraising org configurado como CamiloDevOrg. Por eso:
    * stage-value ensure (agrega Letter of Interest Submitted + Application Submitted) → observable.
    * BusinessProcess authoring (crea NPSP_Default + Grants) → observable.
    * assignTo Grant RT (optional) → RT ausente → skip no-op → **prueba live del tolerate-absent**.
    * assignToRemaining a RTs reales + managed-RT-skip → NO ejercitable en illinois (0 RTs) →
      cubierto por los jest unit tests + la verificación del dev en CamiloDevOrg.
  - **Footprint invasivo**: correr escribe al OpportunityStage StandardValueSet (picklist estándar
    org-wide) y crea 2 BusinessProcess en illinois. Se surge en el Start-run gate.
  - Verificado por el dev en CamiloDevOrg (NPSP + NFP Fundraising); QA no tiene ese alias sf.
  - PR ya MERGED — comparación base `82c35b14` vs merge-commit `ed3da574`.

