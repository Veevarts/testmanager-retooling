id: "d2ccdb39-0abe-4e6f-8560-18809357b63b"
key: "TC-156"
title: "membership_transactions.sql + fund_assignment_memberships.sql + sales_order_only_membership2.sql anchor CloseDate y Revenue_ID_legacy__c en la financial transaction que OWNS la línea de membership revenue (no en la que el resolver rankea primero) — corrige rev-10970978 (2021→2022) + rev-10059401 (2011→2012), 33 CloseDates cambian, 42,610 Revenue IDs corrigen, blank IDs 68→31 (Opp) y 37→0 (FA); NULLIF wrap para blank-como-empty-string (IM-1206)"
description: |
  Test case para IM-1206 (Historia, priority High, severity 3-High, "In QA Review") — epic IM-70
  Altru Queries — QA Sub-task IM-1216. Cliente reportante: Long Island Children's Museum.
  PR bajo prueba: Veevarts/MigrationToolETL #175 (draft, open, base main).

  === CONTEXTO ===

  El ticket reporta que una membresía 2021 (rev-10970978, $85) NO aparece en el Revenue Report
  de Altru 2022 pese a que ambos Altru y SF muestran fecha 2021. Hipótesis del ticket: Altru
  usa "Recent Membership Transaction" en vez de fecha real.

  === HIPÓTESIS DEL TICKET DISPROBED ===

  Dev investigation (comment 1, safesql + read-only prod access):
    - Altru's Revenue Report ES CORRECTO. rev-10970978 es genuinamente un 2021 record (Payment
      $85 dated 2021-11-29). Su ausencia del 2022 Report es correcta.
    - La membresía SÍ está en el 2022 Revenue Report — como rev-11019841 (Order, 2022-03-14),
      NO como rev-10970978.
    - Es un deferred/layaway order: sales order abierto y pagado el 2021-11-29, pero convertido
      en revenue transaction el 2022-03-14 (105 días después). La membership revenue split
      cuelga del Order rev-11019841 (APPLICATION = 'Membership'), NO del Payment rev-10970978
      (APPLICATION = 'Order').
    - MEMBERSHIPTRANSACTION F82FBBA1-... ACTION 'Join', TRANSACTIONDATE 2022-03-14;
      MEMBERSHIP.JOINDATE también 2022-03-14.

  === ROOT CAUSE REAL (MISMO QUE IM-1205) ===

  El ranking CASE en membership_transactions.sql:100-127 y fund_assignment_memberships.sql:27-42:

    CASE
        WHEN candidate_line.CandidateSourceLineItemId = candidate_line.MembershipRevenueSplitId THEN 0
        WHEN candidate_line.CandidateLineId          = candidate_line.MembershipRevenueSplitId THEN 1
        ELSE 2
    END

  Rank 0 (child con SOURCELINEITEMID) gana sobre rank 1 (membership line's OWN transaction).
  Comment describe el child como "refund/adjustment child", pero en Altru una **Payment
  aplicada a un sales order** produce EXACTAMENTE la misma shape (APPLICATION = 'Order' line
  en la Payment transaction apuntando back a la membership line).

  Consecuencia: en toda membresía order-backed, el **Payment gana el ranking** y la
  Opportunity/Fund Assignment hereda el ID + date del Payment en vez del Order.

  El Refund tiebreaker secundario (membership_transactions.sql:114-117) sorts BELOW el 0/1/2
  rank, así que solo break ties entre rank-0 children — un Refund child sigue ganando sobre la
  membership line's own transaction. Mismo mecanismo.

  Invisible cuando order y payment son same-day. Solo surface cuando no.

  === QUÉ CUBRE ESTE PR #175 (SCOPE QA) ===

  El PR ancla CloseDate + Revenue_ID_legacy__c en la financial transaction que OWNS la
  membership revenue line. NO join added (nota: Round 1 review agregó uno al order-backed
  branch — corregido), NO WHERE touched → row grain cannot move.

  Complementa a IM-1205 (PR #172): aquel fijó Auctifera__Posted_Date__c; este fija CloseDate +
  Revenue_ID_legacy__c en los mismos rows. Se decide que Revenue_ID_legacy sigue al Order (lo
  que Altru's Revenue Report muestra) — **reverses IM-1205's stated preference**; la spec
  assertion de IM-1205 se reescribe (no se borra).

  Files touched (por diff):
    - membership_transactions.sql (CloseDate + Revenue_ID_legacy)
    - fund_assignment_memberships.sql (Revenue_ID_legacy alineado con date que IM-1205 movió)
    - sales_order_only_membership2.sql (bijection AGENTS.md con Opportunity export)
    - order-backed branch (join agregado — corregido en Round 1)
    - NULLIF wrap en todas las owning-transaction projections (Altru stores blank rev id como
      '' string vacío, NO NULL — sin NULLIF bare COALESCE devuelve '' y no reach tail)
    - docs/altru-model-context.md (mark IM-1205 scope note superseded)
    - spec files (577 query-regression tests passing, 11 mutations caught)

  Impacto dev-medido (safesql, Long Island whole population, before vs after twice each):
    - Opportunity export: 97,047 rows / 97,047 distinct external ids PRE=POST (grain unchanged).
      Blank revenue ids **68 → 31**.
    - Fund assignment export: 97,014 / 97,004 PRE=POST. Blank revenue ids **37 → 0**.
    - Orderless POS: 51,482 / 51,482 PRE=POST.
    - **33** de 96,895 anchors cambian CloseDate, todos landing exacto en
      MEMBERSHIPTRANSACTION.TRANSACTIONDATE, ninguno already-correct se mueve.
    - **42,610** rows cambian Revenue_ID_legacy__c — 42,573 payment→order, 37 blank→populated.
      Solo 33 de los 42,573 también cambian date (para el resto payment y order son same-day).

  Ejemplos verificados end-to-end:
    - rev-10970978 (ticket's example): CloseDate 2021-11-29 → 2022-03-14;
      Revenue_ID_legacy__c rev-10970978 (Payment) → rev-11019841 (Order).
    - rev-10059401 (2do example encontrado por dev): 2011 membership dated 2012 vía Refund
      child; POST-fix 2011-11-09 / rev-10059401.

  === QUÉ NO CUBRE ESTE PR (OUT OF SCOPE / FOLLOW-UP) ===

    - **Revenue_Reference__c re-anchoring** (donor-facing text): de los 42,610 anchors cuyo
      id se movió, 42,573 tienen different reference text en cada transaction; re-anchoring
      NO perdería nada y llenaría 42 blanks — pero rewrites donor-facing text en 42,573 rows,
      decisión de approver diferente. Documented en docs/altru-model-context.md con la
      measurement + join disponible.
    - **refund.sql blank Refund_ID_Legacy (8,435 de 8,435)**: file separado, unaffected, needs
      its own ticket. Root cause: Altru mints CALCULATEDUSERDEFINEDID solo para revenue-bearing
      transaction types (Refund carry empty — 9,702/9,703 account-wide).
    - **Pre-existing nondeterminism en el fund assignment export**: distinct external-id count
      varió run-to-run (97,003/97,004/97,005) mientras total rows stayed 97,014, points at a
      non-total ordering. Dev bracketed antes/después con repeat runs (both 97,004) para no
      confound el change. Deserves own ticket.
    - **Emitted date vs selecting window disagree** en las moved rows: inherited desde PR #172
      (IM-1205) y deliberate. Este record gates on 2021-11-29 y closes 2022-03-14. Windowing
      on emitted date orphaning fund assignment. Separate decision if month-by-month extraction
      matters.

  === RIESGOS ABIERTOS ===

    - **PR #175 en OPEN draft**, base main, mergeable, no deploy.
    - **PR #175 se stackea sobre PR #172 (IM-1205)** — este ticket depende de que IM-1205 esté
      merged antes.
    - **safesql profile de longisland NO disponible localmente** (aspen/illinois_2/tucson son
      los alcanzables); LI queda inherited from dev. Aspen SÍ podría medirse localmente si el
      profile es alcanzable.
    - **Bastion outages recientes** (documentado en TR-170/171/172): safesql tool intermitente
      silent tunnel fail. Si down cuando ejecute, DEFERRED (mismo pattern).
    - **Docker integration** — nueva spec (si hay integration spec en el PR): mismo constraint
      colima startup >60s. DEFERRED si aplica.
    - **Reverses IM-1205's preference**: el TR-170 aprobó IM-1205 con Revenue_ID_legacy siguiendo
      Payment; ahora IM-1206 lo cambia a seguir Order. Debe verificarse que el spec assertion
      rewrite en IM-1205 quedó consistente (dev dice "sí, rewrite no delete").

