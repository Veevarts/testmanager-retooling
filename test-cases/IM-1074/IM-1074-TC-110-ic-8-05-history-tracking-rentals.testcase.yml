key: "TC-110"
title: "IC 8.05 Set History Tracking for Rentals — 5 objects · 42 fields con IM-1069 matchers · rich-text Description trackable · 1 handoff MANUAL (Name fields)"
description: |
  Cobertura QA para IM-1074 (Historia, priority Medium, epic IM-735 Implementation
  Cases Automation).
  QA Sub-task asociada: IM-1111 (creada 2026-07-23).

  Contexto:
  - Post-June IM-735 continuation. IC 8.05 (Order__c 8.05 en el catálogo Auctifera SF)
    = "Set History Tracking for Rentals".
  - **Tier: Medium** (caveat: managed field/object API names cross-version pueden
    variar — mitigado por el matcher runtime de IM-1069).
  - PR bajo prueba: `Veevarts/MigrationAppBackend#246` (**MERGED** 2026-07-15 22:39Z).
    Branch: `task/ic-8-05-history-tracking-rentals-IM-1074`. Merge commit `b703372`.
  - Files touched (1, spec-only, NO code):
    * `src/implementations/infrastructure/seeds/specs/ic-8-05-history-tracking-rentals.json` (+226/-35)
  - NO `.spec.ts` CI-lock existe para este case — la única guardrail estructural
    es el spec JSON contra el schema `publish-plan-template` (validado en jest
    por el suite generic del backend, no case-específico).

  Cambio principal (case v2 → v3):
  - Case + template bumped a v3; feasibility flipped `auto → hybrid` (ahora
    tiene 1 step MANUAL).
  - **+2 objects que faltaban en v2**: Display/Storage Location y Resource/Service.
    v2 solo cubría 3 de los 5 objects del playbook.
  - **Hardcoded field names → IM-1069 matchers** con shape `{anyOf:[apiName], label:"..."}`.
    Cada label fallback verified vs AuctiferaDX package field-meta.
  - **NON-exclusive (additive)**: el spec omite intencionalmente el flag `exclusive`
    para preservar fields que ya estén tracked pre-run (per playbook: "verify the
    fields are tracked, if not select them").
  - **Description restored**: la v2 había dropped Description (rich-text `Html`)
    asumiendo que no era trackable; live before/after read-back en CamiloDevOrg
    probó lo contrario — `IsFieldHistoryTracked` false→true→false. v3 lo incluye.
  - **Standard Name fields → 1 MANUAL step**: metadata replay NO puede setear
    trackHistory sobre standard Name; se parkea 1 handoff que cubre las 4 Name
    checkboxes (Rental Event, Payment, Display/Location, Resource/Service —
    Rental Resource NO tiene Name en el playbook).
  - **Label-traps confirmados** (mitigados por matcher runtime): 5 labels tienen
    apiName no-canónico porque las variantes bare son formula/DEPRECATED:
    * Paid Amount → `Paid_Amount_2__c` (bare `Paid_Amount__c` = formula "(DEPRECATED)")
    * Subtotal Amount → `Subtotal_Amount3__c`
    * Tax Amount → `Tax_Amount3__c`
    * Amount Received → `Paid_Value__c`
    * Quantity → `Number_of_Parts__c`

  Evidencia dev (per PR body #246):
  - `tsc --noEmit`: clean. jest (t3-metadata + metadata-mutation + publish-plan-template): 292 passed.
  - eslint: N/A (solo JSON spec cambió).
  - **Live end-to-end en CamiloDevOrg**: 5 AUTOMATED COMPLETED, MANUAL attested → run COMPLETED.
    Independent Tooling API read-back: 42/42 fields `IsFieldHistoryTracked=true`, Description
    flipped false→true, pre-existing Status/Paid_Amount preserved.
  - **Live end-to-end en im696-tucson (Tucson Botanical)**: 5 AUTOMATED COMPLETED, parked
    at MANUAL. Read-back: 8/8, 9/9, 11/11, 6/6, 8/8 tracked.
  - **Seeded v3 a MigrationApp-dev** (append-only).

  QA cross-check con el catálogo SF (per `[[reference-implementation-cases-catalog]]`):
  - CSV Order 8.05 lista 5 objects con estos field counts non-Name: 8 + 9 + 11 + 6 + 8 = 42.
  - Spec v3 declara EXACTAMENTE 42 fields en los 5 sobjects correspondientes.
  - CSV declara que Rental Resource NO tiene Name; spec MANUAL cubre solo las 4
    Name checkboxes restantes. Matches exactly.

  Riesgos abiertos:
  - **Target-org portability**: dev verified en CamiloDevOrg + im696-tucson; QA
    verificará live en illinois-trainings (Rentals confirmed instalado via `sf
    sobject describe`). Si hay drift entre orgs por versión managed package
    diferente, el matcher runtime debería absorberlo — pero eso ES lo que QA
    valida.
  - **Adversarial regression**: si dev alguna vez remueve el matcher `{anyOf}`
    para usar apiNames bare, los label-traps romperían silenciosamente (el bare
    `Paid_Amount__c` es formula → replay lo ignora sin error visible).
  - **Additive behavior**: si alguien flipea `exclusive: true` en spec, borraría
    tracking existente en customer orgs — verificar que no está seteado.
  - **Rental Resource sin manual step**: si el playbook Auctifera alguna vez
    agrega un Name field a Rental Resource, el spec debe agregar handoff.
  - PR ya MERGED al momento de QA — baseline vs post-fix se hace entre merge-base
    y merge commit `b703372`.

