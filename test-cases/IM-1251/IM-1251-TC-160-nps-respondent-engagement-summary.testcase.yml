key: "TC-160"
title: "Survey Tool respondent engagement summary aggregates responses, impressions and dismissals into one row per respondent, scoped by organization and survey, behind the authenticated analytics endpoint — IM-1251"
description: |
  Test case para IM-1251 (Historia, priority **Medium**, "In QA Review") — epic IM-970
  NPS Survey Tool delivery — QA Sub-task IM-1252. Repositorio: `survey-tool`.
  PR bajo prueba: Veevarts/survey-tool "PR 72" (**MERGED a `develop`** el 2026-09-08,
  +929/-8, 12 archivos, branch task/add-nps-respondent-engagement-summary-IM-1251).

  === QUE PIDE LA HISTORIA ===

  Vista autenticada de "respondent engagement" en Survey Tool: una fila por respondent
  con Respondent ID, Responded, número de impressions, número de dismissals y última
  actividad NPS observada. La población sale de la UNION de tres fuentes que Survey Tool
  ya almacena (responses, impression events, dismissal events), agregada por organización
  y survey. Explícitamente NO sincroniza usuarios de Salesforce ni infiere quién debió
  recibir la encuesta.

  7 ACs formales en la historia (ver plan QA en IM-1252). Fuera de alcance declarado:
  sincronizar usuarios/contactos de Salesforce, consultar o almacenar LastLoginDate,
  identificar usuarios sin eventos NPS, afirmar que la ausencia de actividad significa
  que la encuesta falló, cambios en AuctiferaDX / NFPFundraising / sf-bulk-org-operations,
  y modificar reglas de entrega o elegibilidad de encuestas.

  === QUE HACE EL PR (leído del diff) ===

  Backend:
    - `GET /api/admin/analytics/respondent-engagement` con query validada por zod:
      `surveyId` (int positivo, requerido), `clientOrgId` (opcional), `from` / `to`
      (opcionales). Devuelve 400 con params inválidos o si `from > to`, 404 si el survey
      no existe, y 400 si `survey.type` no es "nps".
    - Defaults de ventana: `eventFrom` = `survey.createdAt`, `eventTo` = ahora. Las fechas
      date-only se expanden a límites UTC inclusivos (00:00:00.000Z / 23:59:59.999Z).
    - Agregador puro `server/src/lib/respondentEngagement.ts`: agrupa por una clave
      compuesta de clientOrgId más respondentId (unidos por un separador NUL), ambos
      normalizados con `trim().toLowerCase()`. `responded` pasa a true ante cualquier
      response; impressions y dismissals se cuentan por `event.type`; `lastActivityAt` es el
      máximo timestamp entre responses y events. Las responses SIN respondentId no generan
      fila: incrementan `unattributedResponseCount`.
  Cliente:
    - Tab Engagement en el Dashboard (EngagementDashboard.tsx), soporte de una organización
      o `All organizations`, helpers reutilizables de búsqueda y orden (dashboard.ts).
  Tests del dev: server 87 tests, client 46 tests, build OK (declarado en el PR).

  === RIESGOS ABIERTOS ===

    - **El PR está MERGEADO a `develop`, no a `main`.** Antes de dar por validado hay que
      confirmar contra qué rama corre el entorno bajo prueba; "merged" no implica desplegado.
    - **Normalización case-insensitive**: `respondentId` y `clientOrgId` se pasan a
      minúsculas antes de agrupar. Los IDs de Salesforce de 15 caracteres SON
      case-sensitive, así que dos IDs distintos que solo difieran en mayúsculas se
      fusionarían en una sola fila (el inverso del doble conteo que pide el AC4). Hay que
      verificar qué formato de ID llega realmente (15 vs 18 chars) antes de calificarlo.
    - **Comportamientos del PR que NO están en los ACs** y necesitan confirmación de
      scope-fit: el filtro de rango de fechas (`from` / `to`), el `unattributedResponseCount`
      para responses sin respondentId, y las validaciones 400/404 más la restricción a
      surveys de tipo NPS.
    - **Follow-up de escalabilidad SIN ticket**: el PR declara que el patrón de acceso actual
      escanea eventos para las consultas agregadas y se volverá caro con volumen histórico;
      el índice agregado queda como seguimiento explícito, pero no hay ticket creado.
    - **Epic IM-970 está Cerrada** mientras esta historia sigue In QA Review.
    - **Sin clone local de survey-tool** y sin entorno/credenciales admin identificados: los
      escenarios de UI se validan sobre la pantalla real, no sobre los labels del código.

