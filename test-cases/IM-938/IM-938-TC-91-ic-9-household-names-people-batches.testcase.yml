key: TC-91
title: IC 9 — Household Names Settings & People Batches (delivery auto v3, PeopleManagerBatch Callable)
description: |
  Cobertura QA de IM-938 (9 Household Names Settings & People Batches — deliver
  to Implementations, high-confidence). Junio delivery del Implementation Case
  `ic-9-household-names-people-batches` v3 (auto, upgrade desde hybrid).
  Confianza alta por reporte IM-735 (2026-06-12): hybrid → auto upgrade
  documented; BE PR #206 squash-merged a main (commit `d5e2865c`); seeded a
  MigrationApp-dev.

  El case fue upgrade de hybrid a fully automated. El step 2 ("Run People
  batches + enable the People automatic schedule") era MANUAL sobre el mistake
  de que las People batches no pueden correr from anonymous Apex; el probe
  originalmente testeó las wrong classes (NPSP/npo02). Las real Veevart Settings
  "People" batches son el managed `Auctifera.PeopleManagerBatch` (global
  Callable) y el checkmark es `Auctifera__Schedule_People__c`, ambos invocables
  desde anonymous Apex.

  Validar:
  1) NPSP Household Name Format = "FirstName LastName Household" token
     (`{!{!FirstName}} {!LastName} Household`) via query-back,
  2) `Auctifera__Batch_Settings__c.Auctifera__Schedule_People__c = true` +
     daily "Veevart - Automatic Batch Schedule" CronTrigger WAITING,
  3) las 6 People methods (CONTACT_SET_LAST_VISIT_DATE,
     UPDATE_CONTACTS_PURCHASE_AMOUNT, SET_CONTACT_FAVORITE_ARTISTS,
     DELETE_RELATIVE_CONNECTIONS, UPDATE_ACCOUNTS_PURCHASE_AMOUNT,
     ACCOUNT_SET_LAST_VISIT_DATE) enqueuedas + rescheduled,
  4) verify fails loud cuando el daily cron no está registered (asserts BOTH
     checkmark AND cron),
  5) idempotent y org-agnostic.

  QA Sub-task asociada: IM-1000
  Riesgos abiertos:
  - AC4 (cron missing → FAILED) requiere una org al scheduled-apex limit
    para reproducir naturalmente; alternativa: force-abort el cron manualmente.
type: integration
priority: high
status: active
preconditions:
- Implementation Case `ic-9-household-names-people-batches` v3 deployado en prod (BE PR #206)
- Org target con Auctifera package + NPSP package instalados
- IE con permisos para ejecutar anonymous Apex
- Acceso al catálogo prod para seedear v3
format: gherkin
