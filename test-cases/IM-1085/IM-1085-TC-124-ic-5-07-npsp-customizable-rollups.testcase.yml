  - title: "AC5 · Probe proves CRLP CMDT records are creatable but not op-verifiable — a Filter Group/Rule/Rollup created via the Metadata API commits and is SOQL-readable, but the read-back returns reference/entity fields as Ids/DurableIds (not the written API-name strings), so the declarative customMetadata op cannot self-verify a filter-rule or rollup construction"
