key: "TC-124"
title: "IM-1085 IC 5.07 NPSP Customizable Rollups — probe CMDT automation (Low): automate the verifiable parts (T3 standardValueSet + T6 enable/error-recipient + T3 customMetadata recordPattern) + guided MANUAL CRLP-UI build with T6 SOQL read-back; probe proves CRLP CMDT creatable-but-not-op-verifiable · CODE PR (spec-only, reused ops)"
description: |
  Cobertura QA para IM-1085 (Historia, priority Medium/low-confidence, epic IM-735 Implementation
  Cases Automation).
  QA Sub-task asociada: IM-1129 (creada 2026-07-27).

  Contexto:
  - Post-June IM-735 continuation, Phase 2 (Low tier). Gap: la config de CRLP filter-group/rollup (npsp
    custom-metadata) la construye el IE en la UI; el read-back automatizado no puede verificarla bajo auto-handoff.
  - PR bajo prueba: `Veevarts/MigrationAppBackend#257` (**MERGED** 2026-07-16 08:46Z).
    Branch: `task/ic-5-07-npsp-customizable-rollups-IM-1085`. Merge commit `5e6675e3` (base `c671b71f`).
    2 files, +230/-19.
  - **CODE PR spec-only** — NO toca adapters/ops: reutiliza T3 standardValueSet, T6 (anon apex), y T3
    customMetadata con `recordPattern` (namespace discovery de IM-933). El spec bumpea case+template v1→v2
    y suma un `.spec.ts` (162 líneas). (Nota: IC 5.07 fue tocado luego por IM-1090/#262 v2→v3 con el nit
    npsp__Is_Deleted__c=false; este PR es el ORIGEN v2, evaluado en su merge `5e6675e3`.)

  Hallazgo clave del probe (low-confidence): un probe live en CamiloDevOrg CREÓ un Filter Group + Filter
  Rule + Rollup vía Metadata API (el codepath del op T3 customMetadata) — los writes COMMITEAN (los CRLP
  records son subscriber-owned, NamespacePrefix null). PERO el SOQL read-back devuelve los fields de
  relación de metadata como Ids/DurableIds (Filter_Group__c → record Id, RecordTypeId → Object.RecordType,
  custom objects/fields → EntityDefinition/FieldDefinition DurableIds) — un write declarativo de string
  estático NO puede self-verify esas referencias. Por eso la CONSTRUCCIÓN de filter-groups/rollups queda
  como guided handoff MANUAL con un read-back SOQL automatizado; todo lo que un write declarativo puede
  construir Y verificar queda automatizado.

  Spec v2 (feasibility hybrid, 5 steps):
  - Step 1 (T3 standardValueSet): agrega "Member" a OpportunityContactRole.Role (ContactRole
    StandardValueSet) sin desactivar valores existentes; idempotente (no-op si ya activo).
  - Step 2 (T6 anon apex): enable npsp__Customizable_Rollups_Enabled__c + npsp__Error_Notifications_On__c +
    npsp__Error_Notifications_To__c = admin resuelto dinámicamente por Name ("Admin Veevart …" con fallback
    al primer System Administrator activo), sin User Id hardcodeado; override de operator
    ({{errorNotificationRecipient}}) gana; verify que throws si el end-state no se cumple.
  - Step 3 (T3 customMetadata, recordPattern "MembershipEndDate"): desactiva (npsp__Active__c=false) los 2
    rollups Membership End Date (Contact + Household/Organization); tolerate-absent si el org no los tiene.
  - Step 4 (MANUAL, CRLP UI): construye el fix RecordType=Membership en "Memberships: Won" + los 2 membership
    Filter Groups (4 rules c/u) + los 2 Membership Join Date rollups.
  - Step 5 (T6 read-only SOQL): read-back que verifica el end-state completo del handoff, throwing UN mensaje
    con todos los gaps si algo falta (filtrando tombstones NPSP soft-deleted).

  Estrategia de verificación:
  - **jest + tsc + eslint como evidencia PRIMARIA** (CODE PR spec-only): clone en merge `5e6675e3`, correr
    el `.spec.ts` + gates; re-derivar el conteo del dev (jest 8/8).
  - **spec fidelity independiente**: parsear los 5 steps + el apex del step 2 y del step 5 (objetos, dynamic
    admin resolution, override, verify/throw; step 5 read-back conditions) — por cuenta propia, no solo el lockstep.
  - **op-reuse audit** (NO genuinely-new): confirmar que #257 NO toca adapters (2 files = spec + spec.ts);
    standardValueSet/customMetadata(recordPattern)/T6 ya existen en base `c671b71f`.
  - **NO hay live IE run en este QA**: la verificación live fue CamiloDevOrg-only (dev-proven: steps 1/2/3 +
    probe) y el v2 NO está seeded a MigrationApp-dev (seed PENDING-CREDS, AWS SSO expirado). Live =
    dev-proven/PENDING-CREDS, no PASS/FAIL prematuro.

  Riesgos abiertos (del ticket):
  - **Low-confidence gap**: la construcción CRLP queda MANUAL porque un write declarativo no puede self-verify
    las referencias de metadata (Ids/DurableIds). Documentado como evidencia del probe.
  - **Seed PENDING-CREDS**: v2 no seeded (append-only) → seed en cred refresh; bloquea re-correr via la app.
  - **Overlap con IM-1090**: IM-1090 luego agregó npsp__Is_Deleted__c=false al step-5 read-back (v2→v3). Este
    QA evalúa el v2 en `5e6675e3` (sin ese filtro en los group-lookups); el v3 ya lo QA'é en TR-130.
  - Verificado por el dev en CamiloDevOrg. QA re-verifica por código.

