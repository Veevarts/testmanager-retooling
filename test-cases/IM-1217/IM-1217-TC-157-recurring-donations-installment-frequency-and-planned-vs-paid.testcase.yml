key: "TC-157"
title: "recurring_donation.sql (+ all_recurring.sql + recurring_membership.sql) emiten npe03__Installment_Period__c (Installment Frequency) populated y garantizan npe03__Total_Paid_Installments__c ≤ Number of Planned Installments para que la Recurring Donation Enhanced pase la validation rule y se pueda actualizar sin errores (IM-1217)"
description: |
  Test case para IM-1217 (Error, priority High, severity **1 - Business Stopping**, "In QA Review")
  — epic IM-70 Altru Queries — QA Sub-task IM-1221. Cliente reportante: Illinois Holocaust Museum.
  PR bajo prueba: **PENDIENTE** (dev aún no ha investigado ni abierto PR; único comment es
  FYI de Alejandro creando el caso).

  === CONTEXTO DEL REPORTE ===

  El ticket describe 2 síntomas relacionados en los Recurring Donations cargados desde el query:

    Síntoma 1 — Installment Frequency faltante
      El campo `Installment Frequency` (probablemente `npe03__Installment_Period__c` en NPSP)
      NO se está populando. Ese campo es REQUERIDO para poder cargar un registro de Recurring
      Donation. Sin él, el load falla al insertar.

    Síntoma 2 — Number of Planned Installments < Number of Paid Installments
      El query emite `Number of Planned Installments` menor que `Number of Paid Installments`.
      La Recurring Donation Enhanced tiene una validation rule que impide esto (Paid no puede
      exceder Planned). Cualquier update posterior sobre el registro dispara el error de
      validation, dejando la data incompleta.

  Request del cliente (Illinois): alinear ambos campos (Planned = Paid), o al mínimo asegurar
  Planned ≥ Paid para que la validation rule no se dispare y Installment Frequency se pueda
  populate.

  === QUERY FILES BAJO PRUEBA (baseline actual pre-PR) ===

  3 archivos relevantes en MigrationToolETL:
    - `recurring_donation.sql` — recurring donations standalone
    - `recurring_membership.sql` — recurring memberships
    - `all_recurring.sql` — merge de los dos anteriores

  Cualquier fix probable toca uno o más de estos + los pipelines/mapper correspondientes
  (recurring-donation-only.pipeline.ts, recurring-donation-membership-all.pipeline.ts,
  recurring-membership.pipeline.ts, recurring-donation-membership.mapper.ts).

  === QUÉ CUBRE ESTE TC ===

  Este bundle es forward-looking. Cuando el PR aparezca, el executor validará que:
    1. Los 3 queries emiten `npe03__Installment_Period__c` (Installment Frequency) populated
       para toda recurring donation output — 0 rows con este campo NULL/blank POST-fix.
    2. Los mismos queries emiten Planned Installments ≥ Paid Installments en TODA fila
       (invariante que la validation rule requiere).
    3. Idealmente Planned = Paid cuando la recurring donation está fully paid (cliente
       request), pero al mínimo Planned ≥ Paid (validation rule gate).
    4. Cross-tenant sanity — el fix aplica uniformly a Illinois + otros tenants reachable.
    5. Ninguno de los otros campos del contrato cambia (row grain preservado, columnas
       existentes intactas).

  === RIESGOS ABIERTOS ===

    - **NO HAY PR TODAVÍA** — el dev (Camilo) aún no ha investigado ni abierto PR. Este TC
      quedará como planning ready-to-execute; el executor debe correr después de que el PR
      aparezca. Alternativamente, el executor puede correr AHORA en modo baseline (safesql
      sobre illinois_2) para confirmar el PRE-fix state (Installment Frequency blank + Planned
      < Paid).
    - **Sev 1 - Business Stopping**: el fix debe ser bulletproof — bloquea cargas de recurring
      donations en Illinois. Cualquier row que quede sin Installment Frequency POST-fix o con
      Planned < Paid es un defect blocker.
    - **safesql profile illinois_2 alcanzable localmente** (dev-reportado en TR-171/172/173) —
      validación cuantitativa PRE/POST posible en el tenant reportante. Bastion outages
      recientes pueden afectar (safesql tool silent tunnel fail intermitente).
    - **Docker integration** para specs nuevos que el PR agregue: mismo constraint colima
      startup >60s puede caer a DEFERRED con dev PR body como fallback.
    - **rev-examples FALTAN** en el ticket — no hay 1 recurring donation nombrada como
      ejemplo. QA debe seleccionar 2-3 rows de illinois_2 (recurring donations con paid
      installments > 0) como canonical examples para el TR.
    - **Fix approach TBD** — hay 2 estrategias posibles:
        (a) Populate Installment Frequency + set Planned = actual count of installments
            desde INSTALLMENT table (query-side)
        (b) Populate Installment Frequency + set Planned = MAX(Planned, Paid) para no
            disparar validation rule (query-side conservador)
        Cliente prefiere (a) explícitamente; dev decidirá. QA debe verificar cuál se aplicó.
    - **NPSP field names** — el ticket usa nombres de UI ("Installment Frequency", "Number of
      Planned Installments"). Los API names en NPSP Recurring Donation Enhanced (RD2) son:
        Installment Frequency → `npe03__Installment_Period__c` (valores: Weekly, Monthly, Quarterly, Yearly, etc.)
        Number of Planned Installments → `npe03__Installments__c`
        Number of Paid Installments → `npe03__Total_Paid_Installments__c`
      Verificar contra el schema del sandbox Illinois si difiere.

