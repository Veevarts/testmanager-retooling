key: TC-142
title: IM-1161 — membership_transactions.sql staged into temp tables so it fits the memory grant — the extraction
  completes for the first time, the plan hints stay load-bearing, and the request timeout becomes configurable
  without a zero-means-unlimited hole
description: |-
  Cobertura QA de IM-1161 (**Optimize membership_transactions.sql — extraction exceeds the
  120s request timeout**), tipo **Error**, prioridad **High**, bajo el epic **IM-70 Altru
  Queries**. QA Sub-task asociada: **IM-1175**. PR bajo prueba:
  **MigrationToolETL#164** (`fix/membership-transactions-query-timeout-IM-1161` → `main`,
  +1327/−283, 12 archivos, OPEN).

  ## ⚠️ La descripción del ticket quedó ATRÁS del PR — el diagnóstico cambió

  El ticket describe el problema como un **timeout de 120s** resuelto con reescrituras de
  forma de join (`OUTER APPLY`, `UNION ALL`), y deja la materialización como *"Remaining
  work item B — necesita una decisión"*, con el item A diciendo que la query **sigue
  excediendo el timeout**.

  El PR dice otra cosa, y es más grave:

  | | Ticket | PR #164 |
  | --- | --- | --- |
  | Causa raíz | timeout de request (120s) | **memory grant, error 8645**, pool `internal` |
  | Alcance del fallo | "no completa en Long Island" | **no completó en NINGÚN tenant** |
  | Salida previa | lenta | **cero filas, para todos los clientes** |
  | Item B (materializar) | pendiente, sin decidir | **implementado**: 15 `SELECT … INTO #Cte` |
  | Item D (fingerprint e2e) | no capturable | **resuelto 2026-08-06** sobre un restore local |

  La query pedía ~1.8 GB de grant donde la instancia concede como mucho ~154 MB. **No era
  lentitud: era una query que nunca devolvió una fila.** Esto sube el impacto real del
  ticket y cambia qué hay que probar: el criterio de éxito no es "baja de 120s", es
  "completa y emite filas".

  **Consecuencia para QA:** validar contra la redacción del ticket valida el problema
  equivocado. Este TC se escribe contra lo que el PR entrega.

  ## Qué entrega el PR

  - **15 CTEs → 15 `SELECT … INTO #Cte`**, cada uno seguido de un
    `CREATE NONCLUSTERED INDEX` sobre la clave por la que después se sondea. Cada
    statement obtiene su propio grant, y así cada grant cabe.
  - **`OPTION (LOOP JOIN, MAX_GRANT_PERCENT = 5)`** en el ensamblado final.
  - **`DROP TABLE IF EXISTS` en los dos extremos** (15 al inicio + 15 al final). El bloque
    inicial es *load-bearing*, no redundante: las conexiones del pool sobreviven a la query,
    así que una corrida fallida puede dejar temp tables vivas en la sesión.
  - **`SET NOCOUNT ON`, sin `GO`**: `SELECT … INTO` no emite recordset, de modo que el
    extractor sigue viendo **exactamente un result set de 35 columnas** y
    `executeQueryAsStream` no se toca.
  - **`requestTimeout` configurable**: `MSSQL_REQUEST_TIMEOUT_MS`, default **1.800.000 ms**
    (30 min), con `parseTimeoutMs` que rechaza vacío / no-numérico / ≤ 0 y cae al default —
    porque `mssql` interpreta `0` como *sin límite*.
  - Las mismas reescrituras seekables aplicadas a `sales_order_only_membership2.sql`.
  - Specs re-ancladas de `Name AS (` a los statements `INTO #Name` vía un helper `readStage`;
    en la spec de no-order, `readCte` lee **ambas formas** para que la guarda de pares siga
    cubriendo los 8 CTEs compartidos aunque solo se haya movido un archivo.

  Cifras que reporta el dev y que **se re-derivan, no se toman por buenas**: 164.465 filas /
  488 s en high_desert y 97.047 filas / 1485 s en longisland.

  ## ⛔ Lo que QA NO puede ejecutar aquí, y por qué

  Esto no es una limitación de esta corrida sino del andamiaje de verificación, y define el
  alcance real del test case:

  1. **La query staged no puede pasar por `safesql`.** El guard de solo-lectura
     (`WRITE_KEYWORDS = /\b(DROP|…|CREATE|…)\b/i`) se aplica al texto crudo, y el script
     trae **30 `DROP TABLE IF EXISTS` y 15 `CREATE NONCLUSTERED INDEX`**. Correrla exigiría
     `--allow-writes`, que está prohibido. No hay forma legítima de ejecutar el script
     completo desde QA.
  2. **No hay perfil `longisland` ni `high_desert`** en `~/tools/safesql/profiles/`. Los
     perfiles locales son `aspen`, `illinois_2`, `tucson`, `tucson_backup3`. Las cifras
     principales del PR **no son reproducibles** por QA en su fuente original.
  3. **Aun con perfil, el techo de 120s de safesql** es inferior a los 488–1485 s medidos.

  Por eso el escenario 6 queda como **handoff explícito al dev**, con el detalle de qué
  evidencia hace falta, en vez de fingir cobertura. Lo que sí es ejecutable —estructura del
  SQL, hints, lógica del adapter, suite de regresión y la premisa de unicidad por agregados—
  se ejecuta.

  ## Riesgos abiertos

  - **`LOOP JOIN` forzado para todos los tenants, medido en 2 de 9.** El propio PR lo marca
    como riesgo y su mitigación es *"correr en dos tenants más antes de desplegar"*. Un plan
    de nested-loops forzado sobre otra forma de datos puede ser mucho peor. **Hoy esa
    mitigación no está cumplida**, y QA no puede cumplirla por el punto ⛔1.
  - **`MAX_GRANT_PERCENT = 5` está calibrado a un techo de ~154 MB.** Si redimensionan las
    instancias, estrangula una query que ya podría servirse entera.
  - **La premisa de unicidad de `SALESORDER.REVENUEID`** sostiene todos los `TOP 1`. Sigue
    sin verificar en 5 perfiles (aspen, everson, everson2, kidstream, moad); el PR registra
    que el 2026-08-05 se reintentó y **los cinco siguen inalcanzables**, porque cuatro
    apuntan al endpoint `veev-ue1-prod-private-nlb-*` que longisland ya tiene actualizado.
    Si alguno tuviera duplicados, el `TOP 1` pasa a ser una elección arbitraria.
  - **`OrderBackedMembershipFinancialTransactions` es no determinista** y el ticket lo deja
    sin arreglar a propósito, recomendando ticket aparte. **Pero el PR sí lo tocó**: lo
    materializó en `#OrderBackedMembershipFinancialCandidates` +
    `#OrderBackedMembershipFinancialTransactions` con índice. Materializar puede cambiar el
    plan y por lo tanto **cuál fila arbitraria gana**. Hay que comprobar si el no
    determinismo sigue, desapareció o cambió de forma — no asumir que quedó igual.
  - **El timeout por defecto sube de 2 a 30 minutos sobre un pool compartido.** El propio
    código lo dice: una query genuinamente colgada retiene su conexión 30 min en vez de 2.
  - El ticket declara *"this ticket is NOT done"* con items A–D; A y B y D ya no aplican tal
    como están redactados, y C sigue abierto. **El ticket necesita actualizarse**, no solo
    aprobarse.
preconditions:
- 'Repo `MigrationToolETL` clonado con la rama `fix/membership-transactions-query-timeout-IM-1161` (PR #164) y
  su merge-base contra `main`, para comparar el archivo antes y después'
- Node instalado y dependencias del repo instaladas — la suite de regresión de queries (`query-regression`) corre
  sin HTTP en vivo, así que los escenarios de contrato son auto-ejecutables
- '`safesql` operativo con los perfiles locales disponibles (`aspen`, `illinois_2`, `tucson`, `tucson_backup3`)
  para los sondeos agregados de solo lectura'
- ⛔ NUNCA usar `--allow-writes` en safesql. El script staged trae DROP/CREATE y por diseño no puede correr por
  ahí; eso NO se resuelve bajando la guarda
- Las bases de clientes son de SOLO LECTURA. Todo sondeo es agregado (COUNT/SUM/CHECKSUM), sin filas ni PII
