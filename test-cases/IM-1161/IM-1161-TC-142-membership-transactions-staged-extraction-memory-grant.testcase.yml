- title: IM-1161 AC1 — The 15-CTE chain becomes 15 staged temp tables, each indexed on its probe key, bracketed by
    idempotent drops, and still emits exactly one result set of 35 columns
  tags:
  - happy-path
  - im-1161
  - im-1175
  - im-70
  - ac-1
  - altru
  - migration
  - sql-optimization
  - temp-table-staging
  - pr-164
  given:
  - '`membership_transactions.sql` en la rama del PR #164, donde la cadena `WITH` de 15 CTEs pasó a ser 15 statements
    `SELECT … INTO #Cte`'
  - el extractor `executeQueryAsStream`, que NO se modificó y sigue esperando un único recordset
  when:
  - se compara el archivo contra su versión en el merge-base y se analiza la estructura del script resultante
  then:
  - 'existen **15** statements `SELECT … INTO #<Nombre>`, y cada uno va seguido de su `CREATE NONCLUSTERED INDEX
    IX_<Nombre>` sobre la clave por la que ese temp se sondea después — verificar el emparejamiento uno a uno, no
    solo los conteos'
  - 'hay **30** `DROP TABLE IF EXISTS #…`: 15 al inicio y 15 al final. Confirmar que el bloque INICIAL existe y
    que es load-bearing — las conexiones del pool sobreviven a la query, así que una corrida fallida deja temp tables
    vivas y la siguiente reventaría sin ese drop'
  - '**todas las temp tables son de sesión (`#`), ninguna global (`##`)**: una `##` sería visible entre sesiones
    y rompería el aislamiento entre corridas concurrentes. Verificar sobre el `.sql`, no sobre el diff completo,
    porque los `##` de los docs markdown son falsos positivos'
  - '`SET NOCOUNT ON` presente y **sin `GO`**, de modo que el archivo sigue siendo un artefacto único ejecutable
    de corrido'
  - 'el script emite **exactamente un result set de 35 columnas**: `SELECT … INTO` no emite recordset, así que solo
    el `SELECT` final devuelve filas. Contar las columnas del SELECT final y confirmar que ningún DDL apunta a un
    objeto que no sea temp'
  - ninguna columna de salida, filtro, grano de join ni compuerta de inclusión cambió respecto del merge-base —
    el PR se declara equivalente en resultado, y eso es lo que hay que auditar en el diff
- title: IM-1161 AC2 — The two plan hints sit only on the final assembly, carry their measurements inline, and the
    regression suite fails if either is removed
  tags:
