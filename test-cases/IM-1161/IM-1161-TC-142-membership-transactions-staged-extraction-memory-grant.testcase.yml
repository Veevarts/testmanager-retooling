  - la tabla de mediciones del PR, donde `LOOP JOIN` solo o `MAX_GRANT_PERCENT = 15` solo siguen dando error 8645,
    y la combinación adoptada devuelve 164.465 filas en 445 s
  when:
  - se ubica el hint en el archivo y se ejecuta la suite de regresión con y sin él
  then:
  - el hint está **solo en el `SELECT` final**, no repetido en los statements de staging — cada uno de esos ya obtiene
    su propio grant y no lo necesita
  - los comentarios inline que justifican ambos valores están presentes, con las mediciones que los sostienen —
    es lo único que impide que alguien los "simplifique" después
  - '**probar que la guarda es load-bearing por mutación**: quitar el hint (o cambiar `MAX_GRANT_PERCENT`) debe
    hacer fallar un test de la suite. Si la suite sigue verde sin el hint, la protección es decorativa'
  - 'dejar registrado el riesgo que el propio PR declara: el `LOOP JOIN` se fuerza para los 9 tenants pero se midió
    en 2, y la mitigación que el PR se autoimpone —correr en dos tenants más antes de desplegar— **no está cumplida
    hoy**'
- title: IM-1161 AC3 — The request timeout becomes configurable with a 30-minute default, and a blank or non-positive
    value falls back to that default instead of silently meaning "no limit"
  tags:
  - happy-path
  - negative
  - im-1161
  - im-1175
  - im-70
  - ac-3
  - migration
  - sql-server-adapter
  - configuration
  - pr-164
  given:
  - '`sql-server.adapter.ts`, donde `requestTimeout: 120000` pasó a `this.config.requestTimeoutMs ?? DEFAULT_REQUEST_TIMEOUT_MS`
    con `DEFAULT_REQUEST_TIMEOUT_MS = 1_800_000`'
  - '`parseTimeoutMs` en `sql-server.module.ts`, que convierte `MSSQL_REQUEST_TIMEOUT_MS` y devuelve `undefined`
    si el valor no es finito o no es positivo'
  when:
  - se ejecuta la suite del adapter y se prueban los valores de borde de la variable de entorno
  then:
  - sin variable de entorno, el timeout efectivo es **1.800.000 ms**, por encima de los 1485 s medidos en longisland
    — si el default quedara por debajo, el arreglo de la query no llegaría a la app
  - 'con un valor válido, gana el valor de entorno; verificar además que el `requestTimeout` se escribe **dentro
    de `options`**, porque `mssql` resuelve `cfg.options.requestTimeout ?? config.requestTimeout ?? 15000` y la
    otra ubicación no tendría efecto'
  - '**el caso negativo es el que importa**: `""`, un valor no numérico, `0` y un negativo deben caer al default.
    Un `0` que se propagara sería interpretado por `mssql` como *sin límite*, que es peor que el bug original —
    una query colgada nunca soltaría la conexión'
  - probar por mutación que existe cobertura real de esos bordes, no solo del camino feliz
  - 'dejar constancia del trade-off que el propio código documenta: el pool es compartido, así que una query colgada
    ahora retiene su conexión 30 minutos en vez de 2'
