      - "dangling = 0: ninguna fecha referenciada por un child falta en el parent"
      - "surplus = 0: el parent no emite fechas que ningún child referencia"
      - "las 165 ticketing rows sobre 136 ARRIVALDATE distintos del gap sistémico quedan todas con parent resolvible"

  - title: "AC3 · No regression on the surviving output: every pre-existing date a child references keeps a byte-identical Implementation_External_ID__c, the only removals are the 3 advertised unreferenced dates (56 added / 3 removed, 4,892 → 4,945), and the UNION emits one row per date"
    tags:
      - ac-3
      - no-regression
      - external-id
      - dedup
    given:
      - "la salida completa del query PRE-fix (baseline) y POST-fix sobre el mismo profile"
      - "el External ID del parent es el date string que los children referencian"
    when:
      - "se hace el diff PRE vs POST del set completo de rows por Implementation_External_ID__c"
      - "se cuenta el total de rows POST-fix vs el total de fechas distintas POST-fix"
    then:
      - "toda fecha PRE-fix que algún child referencia sigue presente POST-fix con External ID byte-idéntico"
      - "las únicas remociones son las 3 fechas advertidas en el PR que ningún child referencia (surplus inerte: los loads son upserts keyed por External ID — nada se borra en la org)"
      - "rows POST-fix = fechas distintas POST-fix — el UNION dedup entre brazos deja exactamente 1 row por fecha"
      - "delta neto = el advertido por el PR: 56 fechas agregadas, 3 removidas (4,892 → 4,945)"

  - title: "AC4 · The event-arm trap is pinned: the UNION arm for ticketing_only_event uses ticket_dates.EarliestTicketDate (the lookup expression), never the Ticket_Date_Do_Not_Map window expression — the 21-rows/14-dates first-commit hazard cannot regress silently"
    tags:
