key: "TC-158"
title: "visitor_management.sql unions every ticketing date source so the parent emits exactly the dates its three children reference (recovers the 5 Long Island dates created manually, 0 dangling / 0 surplus over 4,945 dates) — IM-1220"
description: |
  Test case para IM-1220 (Historia, priority **High**, "In QA Review") — epic IM-70 Altru
  Queries — QA Sub-task IM-1222. Cliente reportante: Long Island Children's Museum.
  PR bajo prueba: Veevarts/MigrationToolETL "PR #178" (open, base main, 3 files, +688/-48).

  === CONTEXTO ===

  El ticket reporta 5 fechas que el lookup de Visitor Management necesitaba y que el export
  del query original NO devolvió: 9/26/2024, 7/3/2026, 8/7/2026, 8/20/2026, 8/21/2026.
  Paula las creó manualmente en el target como workaround temporal.

  ROOT CAUSE (dev, verificado con safesql read-only sobre Long-Island-Children-s-Museum_db_7):
  visitor_management.sql es el PARENT cuyo Implementation_External_ID__c (el date string) es
  referenciado por los exports de Ticketing vía Auctifera__Visitor_Management__c. Sin tocar
  desde IM-103, derivaba sus fechas con UNA sola regla (sales-order con gate
  EXISTS SALESORDERITEMTICKET), mientras 3 queries hijas resuelven su lookup sobre
  poblaciones que el parent no veía:
    - ticketing_only_program.sql — COALESCE(RESERVATION.ARRIVALDATE, earliest ticket
      EVENT.STARTDATE, SALESORDER.TRANSACTIONDATE); el parent nunca joineaba RESERVATION.
    - ticketing_only_event.sql — misma expresión sobre orders sin ticket line; el gate
      EXISTS del parent las excluía.
    - ticketing_direct_registrant.sql — EVENT.STARTDATE de REGISTRANT directo elegible;
      sin SALESORDER en ninguna parte.

  Evidencia dev por fecha: las 5 fechas devolvían 0 rows en el query viejo. Las 4 fechas de
  2026 tienen exactamente 1 ticketing row + 1 reservation cada una y 0 sales orders
  transactadas ese día (group reservations reservadas antes de la transacción que las pagó
  → el child apunta a ARRIVALDATE, el parent emitía la fecha del booking). 9/26/2024 tiene
  291 direct-registrant ticketing rows elegibles, 0 de los brazos sales-order. Sistémico:
  165 ticketing rows sobre 136 ARRIVALDATE distintos sin parent date derivable de su orden.

  FIX: visitor_management.sql pasa a ser el UNION de las expresiones de lookup de los 3
  children, cada brazo reproduciendo el population gate, la expresión y la ventana de su
  child. POST-fix el parent emite 4,945 fechas = exactamente el set referenciado por los
  children (0 dangling, 0 surplus), con External ID byte-idéntico al output previo en cada
  row preexistente.

  TRAMPA DOCUMENTADA EN EL PR: ticketing_only_event.sql lleva DOS expresiones de fecha; el
  lookup usa ticket_dates.EarliestTicketDate, y la expresión event-registration pertenece a
  Ticket_Date_Do_Not_Map y a la row window de ese file. Espejar la window column como si
  fuera el lookup dejó 21 rows sobre 14 fechas dangling en el primer commit del PR.

  Files del PR: docs/altru-model-context.md,
  queries/visitor-management/visitor_management.sql (MAIN FIX),
  query-regression/visitor-management-query.spec.ts.

  === RIESGOS ABIERTOS ===

    - **Sin ACs formales en el ticket** — el comportamiento esperado se infiere de los 5
      ejemplos concretos + el PR body. Cobertura anclada a la evidencia del dev.
    - **Profile safesql del tenant: RESUELTO en TR-175** — se creó qa_longisland con el
      endpoint vigente de la Migration App (migration-db.rtl.veevartapp.com:14772). Los
      profiles preexistentes apuntaban a hosts DB stale (NLB/EC2 recyclados), la causa del
      bloqueo tipo TR-150.
    - **Workaround manual de Paula sin plan de reconciliación**: las 5 fechas ya existen en
      el target creadas a mano. Verificar colisión/duplicado al re-load requiere leer estado
      de la org productiva del cliente — fuera de scope QA (policy: no prod). Riesgo
      señalado al IE: si el External ID manual no coincide con el formato del query, el
      upsert crea duplicados en vez de adoptar los registros manuales.
    - **"PR #178" open, no merged** — validar contra HEAD del branch
      CamiloSalgueroMarin/IM-1220-visitor-mgmt-missing-dates y confirmar base main.

