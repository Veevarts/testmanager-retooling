  - title: "AC2 · Referential completeness: the parent's date set equals EXACTLY the union of the three children's referenced dates on Long Island — 4,945 dates, 0 dangling, 0 surplus (closes the systemic gap of 165 ticketing rows over 136 ARRIVALDATE values)"
    tags:
      - ac-2
      - completeness
      - systemic
      - touch-radius
    given:
      - "los 3 children wired a extractores: ticketing_only_program.sql, ticketing_only_event.sql, ticketing_direct_registrant.sql"
      - "cada child emite Auctifera__Visitor_Management__c apuntando al Implementation_External_ID__c del parent"
      - "profile safesql de Long Island alcanzable"
    when:
