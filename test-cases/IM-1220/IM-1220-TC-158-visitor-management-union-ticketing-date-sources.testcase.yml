      - "al menos 1 test de visitor-management-query.spec.ts FALLA con la expresión equivocada (la trampa queda pinneada)"
      - "con el diff final intacto el suite pasa completo"

  - title: "AC5 · Regression gates: lint + build green, visitor-management-query.spec.ts passes on PR HEAD, full query-regression suite unaffected, and docs/altru-model-context.md documents the new UNION rule"
    tags:
