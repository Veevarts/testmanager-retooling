key: TC-93
title: IC 9.2 — Run Accounting Batches (delivery hybrid, ACs inferred from sister ICs)
description: |
  Cobertura QA de IM-940 (9.2 Run Accounting Batches — deliver to Implementations,
  high-confidence). Junio delivery del Implementation Case
  `ic-9-2-accounting-batches` (hybrid). Confianza alta por reporte IM-735
  (2026-06-12): hybrid — verified on both orgs.

  ATENCIÓN — RIESGO ABIERTO CRÍTICO: la parent story IM-940 no documenta ACs
  específicos ni Scenarios en su descripción; solo la boilerplate de delivery
  (review, prod deploy, seed, handoff). La cobertura de este test case está
  INFERIDA a partir de las sister ICs 9.1 (IM-939), 9.3 (IM-941) y 9.4
  (IM-942) que siguen un patrón idéntico:
  - enable managed-package Automatic Schedule checkmark on `Auctifera__Batch_Settings__c` / equivalent
  - immediate run de los accounting batches del category via global driver
  - daily "Veevart - Automatic Batch Schedule" cron registered
  - verify checkmark + cron por query-back; FAILED loud si falta
  - idempotent + org-agnostic + prod catalog seed

  Referencia explícita: IM-941 (9.3 Fundraising Batches) declara que "el
  Veevart Settings Technical Cashier Drawer + POS Purchase/Notification
  Manager/Ticketing (playbook 1-4) son owned por IC 9.2 Run Accounting Batches",
  y menciona `vnfp__Schedule_NFP_Accounting__c` como accounting-category
  setting. Se asume que 9.2 owns el enable de ese checkmark + immediate run
  del Cashier Drawer, POS Purchase, Notification Manager y Ticketing accounting
  batches.

  Ante la falta de ACs escritos, se ejecuta este test case con `qa-test-executor`
  levantando el PR / seed dev del case para leer el spec real y ajustar
  scenarios. Cualquier gap material se raiseará como defect contra IM-940
  pidiendo ACs formales.

  Validar (INFERIDO):
  1) enable Accounting auto-schedule checkmark(s),
  2) immediate run de los accounting batches del scope 9.2,
  3) daily driver cron registered + WAITING,
  4) verify loud si checkmark o cron falta,
  5) idempotent y org-agnostic,
  6) delivery — prod catalog seed.

  QA Sub-task asociada: IM-1002
  Riesgos abiertos:
  - **CRÍTICO**: IM-940 NO tiene ACs documentadas. Scenarios son inferidos
    de sister ICs. Se levantará defect contra IM-940 si al leer el spec del
    case real (PR / dev seed) aparecen ACs no cubiertos.
  - El nombre exacto del checkmark field (`Auctifera__Schedule_Accounting__c`
    vs `vnfp__Schedule_NFP_Accounting__c` vs otro) es TBD hasta leer el spec.
  - El scope exacto de "Accounting Batches" (Cashier Drawer / POS Purchase /
    Notification Manager / Ticketing? All? Subset?) es TBD hasta leer el spec.
type: integration
priority: high
status: active
preconditions:
- Implementation Case `ic-9-2-accounting-batches` deployado en prod (delivery hybrid)
- Org target con Auctifera package y `Auctifera__Batch_Settings__c` (+ potencialmente vnfp package si el checkmark es vnfp namespace)
- IE con permisos para ejecutar el case y ver AsyncApexJob / CronTrigger
- Acceso al catálogo prod para seedear el case
- Acceso al spec real del case (`ic-9-2-accounting-batches` seedeado en dev) para reconciliar scenarios contra el playbook real
