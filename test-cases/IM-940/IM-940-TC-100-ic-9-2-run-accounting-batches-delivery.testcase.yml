schemaVersion: "1.0"

id: "aaad3aa5-2239-4a46-b063-f65cbf6218b0"
key: "TC-100"
title: "IC 9.2 Run Accounting Batches — entrega HYBRID (3 AUTOMATED T6 + 1 MANUAL) para Implementations"
description: |
  Cobertura QA para IM-940 (Historia, priority High, epic IM-735 Implementation
  Cases Automation). QA Sub-task asociada: IM-1002 (existente, en curso).

  Contexto del entregable:
  - Objetivo: entregar el IC 9.2 Run Accounting Batches con confianza HYBRID al
    equipo de Implementations. Backend PR: `Veevarts/MigrationAppBackend#211`
    (squash-merged a main) — case `ic-9-2-accounting-batches` v3 + template v3,
    spec `src/implementations/infrastructure/seeds/specs/ic-9-2-accounting-batches.json`.
  - Composición: 3 pasos AUTOMATIZADOS T6 + 1 paso MANUAL handoff.
    - Step 1 `auctifera-automatic-batch-schedule` (AUTOMATED T6)
    - Step 2 `vnfp-specific-fund-automatic-assignment` (AUTOMATED T6)
    - Step 3 `vnfp-automatic-batch-schedule` (AUTOMATED T6)
    - Step 4 `schedule-fix-contact-roles-batch-manual` (MANUAL handoff — parks AWAITING_HANDOFF)
  - Verificación previa del dev (per IM-735 confidence report 2026-06-12):
    end-to-end en `CamiloDevOrg` (Auctifera 8.291 / vnfp 2.286) + re-verificado
    en Tucson `im696-tucson` (dos-org confidence).
  - Alcance funcional del case (según AC):
    * Settings de Veevart — categorías People + Accounting + Notification
      Manager (steps 1-3, 5 del runbook). La categoría Accounting cubre
      Accounting Discrepancy Notification, 4 Cashier Drawer control batches
      (Charge / POS Purchase / Refund / Refunded Item) y Shop_Returns Fund
      Assignment.
    * Specific Fund Automatic Assignment = Donation (steps 6-7 del runbook).
    * Nonprofit Settings — categorías Membership, Donation, Specific Fund,
      Recurring Donation, Accounting (steps 8-9, 11-12 del runbook).
    * Fix Contact Roles Batch — handoff manual (step 10 del runbook).
  - Out-of-scope: Roundup/Fee Specific Fund selection (runbook step 4) es
    responsabilidad de IC 4.05 Update Transaction Journal; Fundraising batches
    son IC 9.3 (IM-941); Ticketing batches son IC 9.4 (IM-942).

  Riesgos abiertos:
  - AC4 (Fix Contact Roles) es MANUAL — `vnfp.FixContactRolesBatch` no es global
    y no tiene entry-point anonymous-Apex, por lo que solo se puede programar
    desde el UI de Veevart Nonprofit Settings + verificar el cron
    "Veevart NFP - Fix Contact Roles" en Setup → Scheduled Jobs.
  - El case verifica que los batches quedan SCHEDULED / ENQUEUED, NO que la
    ejecución async COMPLETE. Cualquier assertion sobre resultado de la async
    execution queda fuera del case por diseño.
  - Los 6 per-batch crons de la categoría Accounting son INFORMATIONAL only
    (el daily meta-scheduler se auto-repara), así que un package/config
    difference no puede false-FAIL. Hay que revisar que el step no marque
    FAIL por falta de estos crons.
  - El case es idempotente por diseño (AC5) — cualquier "already scheduled"
    error debe ser swallowed sin romper el step.

type: integration
priority: high
status: active

preconditions:
  - "Acceso a la sandbox illinois-trainings (adminveevart@ilhmec.org.trainings) con MigrationApp desplegado y el case `ic-9-2-accounting-batches` v3 seedado en el catálogo dev."
  - "IE (Implementation Engineer) disponible para correr el plan desde la UI de MigrationApp; QA queda en modo observación + verificación de estado post-run."
  - "Setup → Scheduled Jobs accesible en la sandbox para inspeccionar crons registrados."
  - "Setup → Custom Settings accesible para verificar `Auctifera__Batch_Settings__c` y `vnfp__Fundraising_Settings1__c`."
  - "Datos precondición: al menos un Opportunity Record Type llamado \"Donation\" activo (managed vnfp preferido si existe uno homónimo unmanaged)."
  - "Acceso al backend MigrationAppBackend PR #211 mergeado en main; case v3 disponible en la seed."

format: gherkin
scenarios:
  - title: "AC1 · Veevart Settings automatic batch schedule (People + Accounting + Notification Manager) queda scheduled y verificado"
    tags:
      - ac-1
      - happy-path
      - automated-t6
      - auctifera
    given:
      - "una sandbox illinois-trainings con el managed package Auctifera instalado"
      - "el case `ic-9-2-accounting-batches` v3 seedado en el catálogo del ambiente"
    when:
      - "el IE dispara el step 1 (`auctifera-automatic-batch-schedule`) desde MigrationApp"
    then:
      - "en el org-default `Auctifera__Batch_Settings__c` los tres flags quedan en true: `Auctifera__Schedule_People__c`, `Auctifera__Schedule_Accounting__c`, `Auctifera__Schedule_Notification_Manager__c`"
      - "el daily meta-scheduler `Veevart - Automatic Batch Schedule` queda registrado en Setup → Scheduled Jobs"
      - "el `Auctifera.AccountingDiscrepancyNotificationBatch` queda run-now enqueued (visible en AsyncApexJob reciente)"
      - "los 6 per-batch crons (AccountingDiscrepancyNotification, 4 Cashier Drawer control, Shop_Returns FundAssignment) se validan INFORMATIONAL only — su ausencia no debe fallar el step"
      - "si cualquiera de los tres checkmarks o el cron daily meta-scheduler falta, el step reporta FAIL"

  - title: "AC2 · Specific Fund Automatic Assignment = Donation queda appendida en Fundraising Settings"
    tags:
      - ac-2
      - happy-path
      - automated-t6
      - vnfp
      - fundraising-settings
    given:
      - "la sandbox tiene al menos un Opportunity Record Type activo llamado \"Donation\" (managed vnfp preferido si coexisten managed + unmanaged)"
      - "el org-default `vnfp__Fundraising_Settings1__c` puede o no tener valores previos en `vnfp__Automatic_Fund_Assignment_Record_Types__c`"
    when:
      - "el IE dispara el step 2 (`vnfp-specific-fund-automatic-assignment`)"
    then:
      - "el step descubre el Id del Donation Opportunity RT en runtime (managed vnfp preferido) — no se hardcodea ningún Id"
      - "el Id descubierto se agrega al CSV en `vnfp__Automatic_Fund_Assignment_Record_Types__c` sin duplicar y preservando los valores previos (append idempotente)"
      - "si no existe ningún Donation RT activo, el step FAILA con mensaje distinguible"
      - "si el CSV persistido no contiene el Id descubierto tras el update, el step FAILA con mensaje distinguible"

  - title: "AC3 · Nonprofit Settings automatic batch schedule (Membership + Donation + Specific Fund + Recurring Donation + Accounting) queda scheduled y verificado"
    tags:
      - ac-3
      - happy-path
      - automated-t6
      - vnfp
      - nonprofit-settings
    given:
      - "la sandbox tiene el managed package vnfp instalado y comparte el `Auctifera__Batch_Settings__c` org-default con AC1"
    when:
      - "el IE dispara el step 3 (`vnfp-automatic-batch-schedule`)"
    then:
      - "los cinco flags quedan en true en el `Auctifera__Batch_Settings__c`: `Auctifera__Schedule_Membership__c`, `vnfp__Schedule_Donation__c`, `vnfp__Schedule_Specific_Fund__c`, `vnfp__Schedule_Recurring_Donation__c` (UI fidelity — package trata Recurring Donation como always-on), `vnfp__Schedule_NFP_Accounting__c`"
      - "el daily meta-scheduler `Veevart NFP - Automatic Batch Schedule` queda registrado en Setup → Scheduled Jobs"
      - "el cron `Veevart NFP - ChargeItemInvoiceBatch` (Multi invoice Charge Item batch) queda registrado"
      - "los crons `Veevart NFP - Roundup Donation Fund Assignment`, `Veevart NFP - Recurring donation`, `Veevart NFP - Opportunity General Fund Assignment`, `Veevart NFP - Specific Fund Hierarchy` son INFORMATIONAL only (Roundup se auto-agenda desde el finish de un async batch)"
      - "si cualquiera de los 5 flags, el cron daily meta-scheduler, o el cron ChargeItemInvoiceBatch falta, el step FAILA"

  - title: "AC4 · Fix Contact Roles Batch se parkea AWAITING_HANDOFF con guía estructurada al IE"
    tags:
      - ac-4
      - manual-handoff
      - vnfp
      - awaiting-handoff
    given:
      - "`vnfp.FixContactRolesBatch` no es global y no tiene entry-point de anonymous Apex, por lo tanto no puede programarse desde el case"
    when:
      - "el run llega al step 4 (`schedule-fix-contact-roles-batch-manual`)"
    then:
      - "el step transiciona a estado AWAITING_HANDOFF sin fallar el plan"
      - "MigrationApp muestra una guía estructurada al IE con los pasos exactos: abrir Veevart Nonprofit Settings → programar el Fix Contact Roles Batch → confirmar el cron `Veevart NFP - Fix Contact Roles` bajo Setup → Scheduled Jobs"
      - "el step NO intenta llamar el batch programáticamente (queda documentado como limitación conocida — non-global Apex sin entry-point)"

  - title: "AC5 · Re-ejecutar los steps automáticos es idempotente (no duplica crons ni recrea settings)"
    tags:
      - ac-5
      - idempotent
      - regression
    given:
      - "una corrida previa del case ya dejó los flags en true, los crons registrados y el Donation RT Id en el CSV de fund assignment"
    when:
      - "el IE dispara nuevamente los steps 1, 2 y 3 del case"
    then:
      - "los settings upserts son no-ops (no cambian valores ya correctos)"
      - "los errores \"already scheduled\" del scheduler global son swallowed sin romper el step"
      - "las selecciones previas en `vnfp__Automatic_Fund_Assignment_Record_Types__c` se preservan (no se sobrescriben; el Donation Id ya presente no se duplica)"
      - "la verificación post-run pasa igual que en la primera corrida"
      - "no aparecen crons duplicados en Setup → Scheduled Jobs (misma cantidad antes y después)"

  - title: "AC6 · El case es org-agnostic: sin Ids hardcodeados, funciona en org limpia con Auctifera + vnfp"
    tags:
      - ac-6
      - org-agnostic
      - regression
    given:
      - "una org nueva con Auctifera + vnfp instalados y sin datos custom"
    when:
      - "el case completo se corre por primera vez"
    then:
      - "el case termina exitoso usando únicamente constantes namespace-qualified de los managed packages (Auctifera.*, vnfp.*)"
      - "los Ids de Opportunity Record Types, Custom Settings y ScheduledJobs se descubren en runtime — no hay Ids org-específicos en el spec"
      - "los settings rows se llavean con `UserInfo.getOrganizationId()` (no con Ids fijos)"
      - "el resultado del case en la org nueva es equivalente al observado en CamiloDevOrg + Tucson (baseline dev report)"

  - title: "Regression-evidence · Two-org confidence baseline (CamiloDevOrg + Tucson im696-tucson) se preserva en illinois-trainings"
    tags:
      - regression-evidence
      - two-org-confidence
      - camilodev
      - tucson
    given:
      - "el dev verificó end-to-end el case en CamiloDevOrg (Auctifera 8.291 / vnfp 2.286) + Tucson im696-tucson (per IM-735 report 2026-06-12)"
      - "illinois-trainings es la sandbox default de QA para IC delivery"
    when:
      - "el IE corre el plan completo (run-plan-local) en illinois-trainings"
    then:
      - "steps 1-3 terminan COMPLETED con la misma verify signature que en CamiloDevOrg (settings flags + crons + AsyncApexJob run-now)"
      - "step 4 se parkea AWAITING_HANDOFF igual que en CamiloDevOrg"
      - "cualquier delta observado entre illinois-trainings y la baseline dev se documenta como hallazgo (probable package-version drift o config específica)"

