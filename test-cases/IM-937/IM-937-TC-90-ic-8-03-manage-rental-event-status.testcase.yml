key: TC-90
title: IC 8.03 — Manage Rental Event Status (delivery auto, declarative customSetting op)
description: |
  Cobertura QA de IM-937 (8.03 Manage Rental Event Status — deliver to
  Implementations, high-confidence). Junio delivery del Implementation Case
  `ic-8-03-manage-rental-event-status` (auto). Confianza alta por reporte
  IM-735 (2026-06-12): built+verified CamiloDev, cross-tested COMPLETED Tucson.
  BE PR #208 merged a main; MigrationApp-dev seeded.

  El case reproduce el playbook manual (App Launcher → Veevart Settings →
  Rentals → Rental Settings → check "Manage the rental event status by the
  paid amount" → Save) como un solo step automated que corre el reusable
  declarative `customSetting` op — sin código per-case. Toca solo
  `Auctifera__Manage_Rental_Event_Status_By_Paid_Amount__c` (o field
  equivalente en Auctifera__Rental_Settings__c) sin tocar otros fields del
  Rental Settings.

  Validar:
  1) Enable cuando la settings row nunca ha sido configurada (create),
  2) Enable cuando existe pero está unchecked (update-in-place),
  3) Idempotent re-run cuando ya está checked (no change, still COMPLETED),
  4) Org-agnostic — solo se toca el field target, nothing else,
  5) Failed save reported como FAILED con mensaje explicativo,
  6) Delivery — seedeado en prod catalog bajo Rentals category, IE handoff.

  QA Sub-task asociada: IM-999
  Riesgos abiertos:
  - AC5 (insufficient permissions) requiere reproducir con un running user
    sin edit access sobre la managed custom setting.
type: functional
priority: high
status: active
preconditions:
- Implementation Case `ic-8-03-manage-rental-event-status` deployado en prod (BE PR #208)
- Org target con Auctifera package instalado
- IE con permisos para editar Auctifera__Rental_Settings__c (o suficiente para run el case sin permisos, para reproducir AC5)
- Acceso al catálogo prod para seedear el case
format: gherkin
