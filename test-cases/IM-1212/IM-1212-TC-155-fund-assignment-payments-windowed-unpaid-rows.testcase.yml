schemaVersion: "1.0"

id: "ededf43b-3ec1-49ab-aff3-1f2c5045c016"
key: "TC-155"
title: "fund_assignment_payments.sql anchors the windowed WHERE gate on a never-null date so unpaid-installment fund assignments are no longer dropped 100% by windowed runs (recovers 141 Illinois rows in the 2026 window), and the NPSP suppression flag is renamed to the field that actually exists in every org (npe01__Do_Not_Automatically_Create_Payment__c) — IM-1212"
description: |
  Test case para IM-1212 (Historia, priority **Crítica**, severity **1 - Business Stopping**,
  "In QA Review") — epic IM-70 Altru Queries — QA Sub-task IM-1215. Cliente reportante: Illinois
  Holocaust Museum and Education Center. Constituyente: Illinois Department of Commerce &
  Economic Opportunity. PR bajo prueba: Veevarts/MigrationToolETL #174 (draft, open, base main).

  === CONTEXTO CRÍTICO ===

  El ticket reporta 2 problemas en producción:
    Problema 1 — Fund Assignments faltantes en 3 payments del Pledge 2025-12-31 ($538,226.27).
    Problema 2 — Amount duplicado en Pledge 2026-05-20 ($669,724.21) con Ext ID que corresponde
                a un pago según el reporte.

  Dev investigation evolved en 2 rounds (comment 1 wrong hypothesis → comment 2+3 correct with
  read-only prod access):

  ROOT CAUSE REAL — stale unpaid-installment rows NOT retired by upsert loads:
    - Corrida de mayo 2026: cuota estaba unpaid → ETL crea PMT-131049 ($538,226.27 unpaid) +
      FD-246008.
    - Corrida 19 Ago 2026: cuota ya paid → ETL emite los 2 pagos reales (PMT-212816 + PMT-212817)
      y deja de emitir la unpaid row.
    - Los registros de mayo NUNCA se borran — upsert insert/update pero no delete records que
      desaparecen del file.
    - Suma: $538,226.27 + $312,728.42 + $225,497.85 = $1,076,452.54 = exactamente 2× el pledge.
      Ese es el "duplicado".
    - PMT-131049 aparece PAID porque package automation acumuló el pago real después
      (LastModifiedDate 2026-08-19T23:14, 3h después del ETL insert).

  Dev corrigió 2 aspectos del ticket:
    (a) El Pledge 2026-05-20 NO tiene el monto duplicado — los 2 pledges se intercambiaron al
        redactar el ticket. El duplicado está en el Pledge 2025-12-31.
    (b) El registro a eliminar es EL PAGO PMT-131049 (npe01__OppPayment__c a02an00000Mo4tiAAB),
        NO la Opportunity. El Ext ID del ticket (3FF3EDE5-A26A-4F6B-BD7B-F5BE9D429250) es solo
        el primer segmento (el GUID del Pledge); el Ext ID full del pago es
        3FF3EDE5-...-C7D4D416-... donde C7D4D416 = installment id.

  === QUÉ CUBRE ESTE PR #174 (SCOPE QA) ===

  El PR fija 2 defectos SEPARADOS descubiertos durante la investigación, ambos relevantes al
  ticket pero NINGUNO es la root cause del ticket:

    Defecto A (main fix): fund_assignment_payments.sql windowing bug — el WHERE gate windowed
      filtraba sobre Auctifera__Posted_Date__c que la rama unpaid-installment deja NULL a
      propósito. NULL >= @dateFrom evalúa a UNKNOWN en SQL → cualquier corrida con ventana de
      fechas dropea el 100% de fund assignments de cuotas pendientes, mientras Payment y Charge
      exports sí emiten sus unpaid rows para la misma ventana. Illinois 2026 window recupera
      141 rows de este bug. Impacto directo sobre el paso 2 de la remediación (windowed re-run).

    Defecto B (latent): NPSP suppression flag rename — la columna se exportaba como
      `npsp__Do_Not_Automatically_Create_Payments__c` (namespace npsp, plural Payments) pero
      el field real en NPSP es `npe01__Do_Not_Automatically_Create_Payment__c` (namespace
      npe01, singular Payment). Field inexistente en cualquier org — se dropeaba silently al
      load. Latent porque el mapping del load lo resuelve a mano (por eso el flag está
      correctamente `true` en prod). Se cierra defensively porque AGENTS.md + IM-910 spec
      mandaban el nombre malo.

  Files (18 total, +305/-30):
    - AGENTS.md, docs/altru-model-context.md, 4 openspec/im-910/* files — rename flag
    - pipelines/donation-pledges.pipeline.ts + donation-transaction.pipeline.ts — rename flag
    - mappers/donation.mapper.ts — rename flag
    - **queries/fund-assignment/fund_assignment_payments.sql** (+63/-12) — MAIN FIX
    - queries/opportunity-donation/donation_pledges.sql (+13/-1) — suppression flag emission
    - queries/opportunity-donation/donation_transaction.sql (+5/-1) — suppression flag emission
    - query-regression/donation-pledges-query.spec.ts (+18)
    - query-regression/matching-gift-query.spec.ts (+6/-1) + integration.spec.ts (+1/-1)
    - **query-regression/pledge-payment-query.spec.ts (+89 nuevo)**
    - **query-regression/pledge-query-chain.integration.spec.ts (+90 nuevo)**
    - query-regression/query-chain-verifier.ts (+5/-1)

  === QUÉ NO CUBRE ESTE PR (OUT OF SCOPE / SEGUIMIENTO SEPARADO) ===

    - **Root cause del ticket (stale unpaid rows)**: requiere design decision (qué objetos,
      delete vs supersede, si write-offs tienen mismo gap). Dev pide ticket aparte.
    - **Remediation IE (producción writes)**: DELETE PMT-131049 (`a02an00000Mo4tiAAB`) +
      FD-246008 (`a1san000001mBK4AAM`), luego re-run + load fund-assignment-pledges. Estos son
      acciones IE en producción — NO QA scope. QA valida el PR, no ejecuta remediation.
    - **Barrido cross-tenant** para otros Pledges con el mismo shape (Opps con payment total >
      Amount, o pagos con Ext ID `{Pledge}-{Installment}` conviviendo con `{Pledge}-{PaymentRev}`
      de misma cuota) — dev tiene acceso read-only prod pero no scoped este barrido.
    - **PR #174 no crea Fund Assignments faltantes por sí solo**; solo permite que un windowed
      re-run los recupere. Sin el fix, ese re-run seguirá dropeando 100% unpaid.

  === RIESGOS ABIERTOS DEL TICKET ===

    - **PR #174 está en DRAFT**, base main, no merged, no deploy. Debe merge antes del
      windowed re-run del paso 2 de la remediation IE.
    - **safesql profile de Illinois disponible localmente** (illinois_2) — validación
      cuantitativa live posible cuando safesql tool esté operativo (memoria TR-171: silent
      tunnel fail intermitente).
    - **Bastion outages recientes** (TR-170) — si el bastion está down cuando ejecute, cae a
      DEFERRED (mismo patrón que TR-170/171).
    - **Docker integration** (nuevo pledge-query-chain.integration.spec.ts + 89 tests) — mismo
      constraint colima startup >60s. Puede caer a DEFERRED con dev PR body como fallback.
    - **NPSP flag rename**: es latent, pero requiere confirmar que el mapper del load sigue
      resolviendo el nombre correcto (no re-quebrar la resolución manual con el rename).
    - **Sev 1 - Business Stopping**: fix debe ser bulletproof antes del merge. Cualquier
      windowed re-run con el fix mal aplicado sigue dropeando unpaid rows y prolonga el
      Business Stopping.

