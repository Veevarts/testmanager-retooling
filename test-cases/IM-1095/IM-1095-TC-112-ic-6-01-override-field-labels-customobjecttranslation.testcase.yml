  - "Migration App session Cognito activa (`localStorage['migrationapp.access_token']`, user en group `admin` o `csm-team`) para API-driven IE run (Path A)."
  - "Test IM cases Org Tucson workspace: `clientId=cdff34f1-9774-41b0-a6a3-124bc03d11cb`, `orgId=00DWI00000CIwZi2AL` (illinois-trainings)."
  - "Translation Workbench enabled con en_US como active translation language en el target org (verificado indirectamente: 9/10 labels ya overridden en illinois PRE-baseline)."

