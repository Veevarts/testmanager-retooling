      - "el código del adapter/handler/model fetch-eado del merge-commit `3f13f082` y merge-base `ed3da574`"
      - "el CSV export de `Implementation_Case__c` (Order 6.01, a185w00000trMOzAAM) como referencia autoritativa del playbook"
    when:
