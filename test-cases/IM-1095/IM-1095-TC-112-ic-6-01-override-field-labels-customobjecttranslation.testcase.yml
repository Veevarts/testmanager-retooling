      - "el código en merge-commit `3f13f082` (no-clone inspection del test inventory via `gh api`)"
    when:
      - "se enumeran los tests dedicados del op en las 4 suites tocadas por el PR"
      - "se inspecciona la mecánica del deploy: `buildObjectTranslationXml` + `buildTranslationPackageXml` + `zip.generateAsync` + `metadata.deploy({singlePackage,rollbackOnError})` + poll bounded `checkDeployStatus`"
      - "se inspecciona la verify: `queryFieldLabelByName` (FieldDefinition.Label) en vez de `metadata.read`"
    then:
