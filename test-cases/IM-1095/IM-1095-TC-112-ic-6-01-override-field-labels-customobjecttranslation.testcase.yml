      - "el adapter deploya (metadata DEPLOY) y NUNCA hace CRUD update — el jest test lo asegura (`expect(update).not.toHaveBeenCalled()`)"
      - "case.version = 2 y template.version = 2 (lockstep), case.feasibility = 'auto', case.defaultOrder = 601 (Order__c CSV × 100)"
      - "el step 1 es kind=AUTOMATED, toolName=T3, op=customObjectTranslation, language=en_US"
      - "los 4 objects son exactamente Group_Reservation, Museum_Offer_Item (6), Museum_Offer, POS_Purchase (2) = 10 field overrides"
      - "los 10 overrides matchean la AC delivery table Y el CSV Order 6.01 byte-for-byte (labels + object mapping)"
      - "solo `Museum_Offer_Item.Group_Reservation` es `optional:true`; el resto son required matchers"
      - "genuinely-new: merge-base tiene 0 refs de customObjectTranslation en el adapter, merge-commit tiene 37 → op genuinamente nuevo (no no-op); seed pasa de manual/v1 a auto/v2"

  - title: "AC-opS1 · NUEVO customObjectTranslation op — jest code contract (27 tests dedicados) + primer metadata-DEPLOY T3 op (deploy/poll/FieldDefinition-verify)"
    tags:
