title: "IC 6.01 Override Group/Reservation & Museum Offer field labels — NEW customObjectTranslation T3 op (first metadata-DEPLOY op) · 4 objects · 10 field-label overrides · deploy-not-CRUD + FieldDefinition verify · tolerate-absent + dynamic resolution"
description: |
  Cobertura QA para IM-1095 (Historia, priority Medium, epic IM-735 Implementation
  Cases Automation).
  QA Sub-task asociada: IM-1113 (creada 2026-07-24).

  Contexto:
  - Post-June IM-735 continuation, metadata-gap upgrade candidate (follow-up del spike
    IM-1086: "feasible-but-deferred"). Hermano de IM-1073/IM-1074 pero introduce un op
    ARQUITECTÓNICAMENTE NUEVO.
  - IC 6.01 = "Override Group & reservation fields and Museum Offer Fields" (Order__c 6.01
    en el catálogo Auctifera SF).
  - **Tier: Medium** (caveat: cross-version managed field API names — mitigado por matcher
    runtime dynamic-resolution, y por el precondition Translation Workbench/en_US active).
  - PR bajo prueba: `Veevarts/MigrationAppBackend#264` (**MERGED** 2026-07-16 15:30Z).
    Branch: `task/ic-6-01-override-field-labels-customobjtranslation-IM-1095`.
    Merge commit `3f13f082`, merge-base `ed3da574`.
  - Files touched (10, +1383/-31 — NO es spec-only, es un CODE PR):
    * `metadata-mutation-spec.ts` (+82) — schema del nuevo customObjectTranslation op
    * `metadata-mutation-spec.spec.ts` (+1) — op en la lista cerrada METADATA_MUTATION_OPS
    * `t3-metadata.adapter.ts` (+329) — implementación deploy-based del op
    * `t3-metadata.adapter.spec.ts` (+400) — 14 tests del adapter
    * `t3-metadata.handler.ts` (+58) — lambda handler validation branch
    * `t3-metadata.handler.spec.ts` (+50) — 1 happy + 7 malformed param cases
    * `ic-6-01-override-field-labels.json` (+125/-41) — spec v1 manual → v2 auto
    * `ic-6-01-override-field-labels.spec.ts` (NEW, +125) — 4 lockstep/surface tests
    * `package.json` + `package-lock.json` — jszip movido dev→prod dependency

  Cambio principal (2 partes):

  **PARTE A — NUEVO T3 op `customObjectTranslation` (reusable, zero per-IC code, PRIMER op deploy-based)**:
  - Override de managed FIELD LABELS via Translation Workbench (metadata type
    `CustomObjectTranslation`). Hermano del `translations` op (custom-LABEL overrides)
    pero el WRITE MECHANISM difiere radicalmente.
  - **HALLAZGO CLAVE (live-proven CamiloDevOrg):** el CRUD synchronous
    `metadata.update('CustomObjectTranslation', …)` es un **SILENT NO-OP** para managed
    field-label overrides — retorna success=true pero el label efectivo NUNCA cambia.
    Solo un **async metadata DEPLOY** (package zip con `objectTranslations/<obj>-<lang>.objectTranslation`,
    polled a completion dentro del mismo adapter call) aplica el override. Es el PRIMER
    T3 op que usa metadata deploy en vez del CRUD single-shot (todos los otros ops).
  - **VERIFY via `FieldDefinition` re-query** (el label efectivo que ve el user), NO via
    `metadata.read` (que nunca surface default-language field overrides — siempre lee vacío).
  - **Non-destructive at sub-element level** (proven live): deploya SOLO los
    `<fields><name/><label/></fields>` resueltos; los otros field overrides + `layouts[]`
    translations del objeto sobreviven (blast-radius contract).
  - **Dynamic field resolution** (`{anyOf:[apiName], label}` fallback pattern IM-1069):
    resuelve el API name real contra el live object (stable API name primero, current
    label como fallback). `optional:true` → tolerated skip (playbook "skip if not found"),
    NO failure.
  - **Strict fail:** matcher non-optional que no resuelve → success=false, deploy NO se
    llama. **Precondition:** Translation Workbench enabled + language active; si no, el
    deploy no aplica nada y el FieldDefinition verify reporta applied=false con hint
    (nunca un false pass). Deploy que falla / que no verifica = success=false, nunca throw
    para la lógica de negocio (throws solo transport/malformed).
  - Deploy/poll bounded: maxPolls=40 × 2000ms = 80s window, ~33% bajo el Lambda timeout
    de 120s. jszip movido a prod dependency.

  **PARTE B — ic-6-01 spec v2 (feasibility manual → auto)**:
  - 1 step AUTOMATED T3 customObjectTranslation (era 1 step MANUAL guide).
  - 4 objects, 10 field-label overrides:
    * `Auctifera__Group_Reservation__c` (Ticketing): Account → "Household/Organization"
    * `Auctifera__Museum_Offer_Item__c` (Ticket Item, 6): Group_Reservation(opt) → "Item",
      Museum_Offer → "Ticket Offer", Museum_Offering_Price → "Ticket Offer Price (after taxes)",
      Museum_Offering_Subtotal → "Ticket Offer Price (before taxes)", Related_Exposition →
      "Related Exhibition/Event", Related_Exposition_Id → "Related Exhibition/Event ID"
    * `Auctifera__Museum_Offer__c` (Ticket Offer): Exposition → "Exhibition/Event"
    * `Auctifera__POS_Purchase__c` (2): Client → "Client (Contact)", Client2 →
      "Client (Household/Organization)"
  - Solo el Group_Reservation lookup en Museum_Offer_Item es `optional:true` (skip si absent).

  Evidencia dev (per PR body #264):
  - Live-proven CamiloDevOrg: deploy aplica el override, FieldDefinition verify confirma;
    CRUD update demostrado silent no-op; non-destructive (unrelated field override + layout
    translations sobreviven).
  - ic-6-01 v2 seeded a MigrationApp-dev.

  QA cross-check con el catálogo SF (per `[[reference-implementation-cases-catalog]]`):
  - CSV Order 6.01 (`Implementation_Case__c` a185w00000trMOzAAM) lista el playbook manual
    EXACTO (Setup → Translation Workbench → Override, filter Package=Auctifera Language=English
    Component=Custom Field, por object). Los 10 field-label overrides del spec v2 matchean
    el CSV byte-for-byte (Ticketing/Account, Ticket Item ×6, Ticket Offer/Exhibition,
    POS Purchase ×2).

  PRE-baseline QA (illinois-trainings, read-only FieldDefinition.Label):
  - **9/10 fields YA están en el label target** (illinois es un trainings org con los museum
    labels ya aplicados). El único que difiere: `Museum_Offer_Item.Auctifera__Group_Reservation__c`
    label actual "Ticket" → target "Item". Un live run demuestra idempotency en 9 + 1 flip real.
  - Los 9 ya-en-target prueban que Translation Workbench + en_US están active en illinois
    (el precondition se cumple).

  Riesgos abiertos:
  - **Doc drift menor**: el op background dice "5 target objects" pero la entrega son 4
    objects (Group_Reservation, Museum_Offer_Item, Museum_Offer, POS_Purchase). No es defecto
    — la delivery table del AC feature-2 enumera exactamente estos 4. Solo phrasing.
  - **POS Client2 fallback-label word-order**: el matcher current-label fallback es
    "Client (Organization/Household)" mientras el override target es "Client (Household/Organization)"
    (orden distinto). Bajo riesgo: `anyOf:[Auctifera__Client2__c]` resuelve directo (Client2
    existe en illinois), el fallback nunca dispara.
  - **Mutación visible**: correr el op en illinois cambia 1 label (Ticket→Item) org-wide;
    es el valor spec-correct del museo, reversible re-deployando el default. Se surface al gate.
  - **CamiloDevOrg no disponible para QA**: el live-proof del dev fue en CamiloDevOrg; QA
    agrega illinois-trainings (Auctifera Ticketing/POS confirmado installed via FieldDefinition).
  - **Precondition destructivo no se prueba live**: no se desactiva Translation Workbench en
    illinois; el branch "language not active → success=false + hint" queda unit-verified (jest).
  - PR ya MERGED — baseline vs post-fix entre merge-base `ed3da574` y merge commit `3f13f082`.

