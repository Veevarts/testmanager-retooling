schemaVersion: "1.0"

id: "127f3f8d-2493-43fd-8c38-c9443c03a380"
key: "TC-132"
title: "Altru Partial + Account Soft Credit queries resolve npsp__Opportunity__r through a ranked candidate list gated against the Opportunity ids the migration actually emits (own-transaction first, do-no-harm), instead of the raw payment FINANCIALTRANSACTIONID — so soft credits load in Tucson without the foreign-key error"
description: |
  Cobertura QA para IM-1067 (Historia, priority High, epic IM-70 Altru Queries).
  QA Sub-task asociada: IM-1137 (creada 2026-07-28).

  Contexto (escalamiento):
  - Escalamiento del comentario no atendido en IM-707 (Finalizada, trío IM-707/IM-725/TC-16 de soft-credit
    queries). Account: **Tucson Botanical Gardens**.
  - Los queries **Npsp Partial Soft Credit** y **Npsp Account Soft Credit** fallan en Tucson con:
    `Foreign key external ID: eff95544-5e41-42b0-90be-002fd2ccaeb2 not found for field
    vnfp__Implementation_External_ID__c in entity Opportunity`.
  - **PR bajo prueba: `Veevarts/MigrationToolETL#153`** (**OPEN**, branch `fix/soft-credit-opportunity-external-id-IM-1067`
    → main). 6 files +1209/-71: los 2 `.sql` de soft credit + 3 archivos de query-regression (fixture + spec + integration
    spec) + `docs/altru-model-context.md`. Categoría desarrollo.

  Root cause (del PR, más profundo que el ticket):
  - Ambos queries emitían el `FINANCIALTRANSACTIONLINEITEM.FINANCIALTRANSACTIONID` de la propia recognition como el
    external ID de `npsp__Opportunity__r`. Pero esa transacción suele ser un **pago** (pledge payment, matching-gift
    payment, recurring installment) que el Opportunity load NUNCA crea: `donation_transaction.sql` solo trata una línea
    como donación cuando `REVENUESPLIT_EXT.APPLICATION ∈ {Donation, Recurring gift, Planned gift, Matching gift}`; un
    pledge payment lleva `APPLICATION='Pledge'` → sin líneas elegibles → no llega a `TransactionAgg` → no hay Opportunity.
    Un solo FK irresoluble rechazaba TODO el CSV (fallo total: 0 soft credits cargan).

  El fix (del PR):
  - `npsp__Opportunity__r` ahora se resuelve por una **lista de candidatos rankeada**, gateada contra los ids que el
    Opportunity load realmente emite (gate copiado VERBATIM de `donation_transaction.sql`: `SUM(NetAmount)<>0` + todo
    `FINANCIALTRANSACTION` con `TYPE='Pledge'` de `donation_pledges.sql`):
    * rank 1 = propia `FINANCIALTRANSACTIONID` (**primero a propósito, do-no-harm**: una fila que ya resolvía bien
      conserva su MISMA Opportunity; los parents son fallbacks, no overrides — solo las filas rotas se re-anclan).
    * rank 2 = recurring-gift installment id.
    * rank 3 = pledge / MG-claim vía `INSTALLMENTSPLITPAYMENT` → `INSTALLMENTSPLIT.PLEDGEID` (tiebreak multi-pledge por
      `SUM(INSTALLMENTSPLITPAYMENT.AMOUNT)` mayor, external id como fallback determinista).
    * rank 4 = pledge vía `SOURCELINEITEMID`.
    * `ROW_NUMBER()=1` → exactamente 1 fila por `REVENUERECOGNITION.ID`; sin candidato superviviente → **fila DROPEADA**
      (`npsp__Partial/Account_Soft_Credit__c.npsp__Opportunity__c` son `nillable=false`, no hay null-FK fallback).
  - `npsp_partial_soft_credit.sql` agrega `recognized_c.ISCONSTITUENT = 1` para igualar `contact.sql` (cierra la misma
    clase de break en el Contact FK; no-op en High Desert). Columnas/headers sin cambio → mapper/pipeline intactos.

  Estrategia de verificación (para /qa-test-executor):
  - **Regression tests (dev evidence PRIMARIA)**: `query-regression` — `soft-credit-recognition-query.spec.ts` (SQL
    contract: no raw txn id como FK, gate presente, rank ordering, paridad de gate con donation_transaction.sql, paridad
    ISCONSTITUENT con contact.sql) + `...integration.spec.ts` (docker/testcontainers: mapeo por lineage, ningún payment-id
    emitido, filas irresolubles dropeadas, 1 fila por recognition). Dev: revertir los 2 `.sql` hace fallar 5/8 integration
    cases; suite 308 unit + 9 docker, build green. QA re-corre `npm test -- --runInBand query-regression`.
  - **safesql `tucson`** PRE-fix vs POST-fix (read-only): re-derivar las cifras del dev en Tucson (ver riesgo #1) y cruzar
    los external IDs emitidos contra el set de Opportunity emitidas.
  - **Behavioral diff + scope-fit**: el cambio SOLO reasigna el lookup del soft credit vía la resolución rankeada; columnas
    de salida, headers y semántica de date-filter (`rr.EFFECTIVEDATE`) sin cambio.

  Riesgos abiertos:
  - **Cifras del summary del PR desactualizadas**: el body dice "~1,860 resolve / 14 dropped" (audit temprano
    Everson+High Desert). La confirmación FINAL de Tucson (credencial refrescada, `FINANCIALTRANSACTION`=668,118):
    **2,076 de 2,138 resuelven** (1,785 donation/recurring/MG-root + **213 pledge/MG-payment re-ancladas = el rescue set**
    + 78 pledge roots), **62 dropeadas** (57 reversed net=0, 5 recurring-root TYPECODE 2/20, 0 membership). El executor debe
    re-derivar sobre Tucson, NO usar la línea del summary.
  - **safesql `tucson` credencial**: fue rechazada durante el PR (luego refrescada); el executor puede toparse lo mismo →
    si falla, pedir refresh (no marcar PASS/FAIL prematuro).
  - **NO idempotente (dependencia IM-886)**: `Implementation_External_ID__c` no existe en ninguno de los 2 objetos
    soft-credit → un reload inserta duplicados; el fix AUMENTA la convergencia (hasta 76 soft credits por par
    (pledge Opp, constituent) en Tucson) así que más duplicados comparten Opportunity. NPSP lo acepta (sin unique
    constraint, verificado en CamiloDevOrg), pero el reload no es seguro hasta crear ese campo. No es blocker de IM-1067.
  - **Coverage gap membership-sourced**: recognitions cuya plata es de una membership Opportunity (keyed distinto) se
    dropean — genuine gap, no regresión (el pre-fix también fallaba); en Tucson son 0. Product call, fuera de IM-1067.
  - **PR OPEN (no merged)**: el POST-fix es el branch head, no main.
  - Datos de cliente read-only: safesql (bastion, keychain) — credenciales y datos row-level nunca en el chat/artefactos.

