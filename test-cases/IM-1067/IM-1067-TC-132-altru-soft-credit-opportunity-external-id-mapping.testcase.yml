preconditions:
  - "MigrationToolETL con `npm ci` limpio para correr `npm test -- --runInBand query-regression` (spec + integration docker via testcontainers) en el branch `fix/soft-credit-opportunity-external-id-IM-1067` del PR #153."
  - "safesql profile `tucson` accesible (bastion + keychain) para PRE-fix vs POST-fix de los 2 queries y re-derivar las cifras (2,076/2,138, 62 dropeadas); si la credencial es rechazada, pedir refresh."
  - "Acceso de lectura al org destino de Tucson (o export) para cruzar los external IDs emitidos contra Opportunity vs pago."
  - "Los 2 CSV de error de referencia (`Npsp Partial Soft Credit - error06...csv`, `Npsp Account Soft Credit - error06...csv`) + el id `eff95544-...` para reproducir la fila del escalamiento."

