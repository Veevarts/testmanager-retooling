scenarios:
  - title: "AC1 · Partial Soft Credit resolves the Opportunity by ranked candidate, not the raw payment id — after the fix, npsp_partial_soft_credit.sql emits vnfp__Implementation_External_ID__c values resolved through the ranked candidate list gated against the emitted Opportunity ids (own transaction rank 1, then recurring installment, pledge/MG-claim, pledge SOURCELINEITEMID), so every emitted FK is an existing Opportunity and the load no longer raises the foreign-key error"
    tags:
      - ac-1
      - partial-soft-credit
      - ranked-candidate
      - opportunity-gate
      - altru
      - im-70
      - im-1067
      - tucson
      - happy-path
    given:
      - "el query npsp_partial_soft_credit.sql del PR #153 (branch fix/...-IM-1067) y el profile safesql `tucson`"
    when:
      - "se corre PRE-fix vs POST-fix y se compara `vnfp__Implementation_External_ID__c`; y se corre el regression spec"
    then:
      - "PRE-fix: el lookup es el `FINANCIALTRANSACTIONID` crudo (a menudo un pago) → reproduce el foreign-key error en Opportunity"
      - "POST-fix: cada `vnfp__Implementation_External_ID__c` resuelve vía la lista rankeada a un id que el Opportunity load emite (gate `SUM(NetAmount)<>0` + `TYPE='Pledge'`); ningún payment-only id se emite"
      - "el load de Partial Soft Credit no lanza el error; el spec `soft-credit-recognition-query` (SQL contract + integration) pasa"

  - title: "AC2 · Account Soft Credit resolves the Opportunity by the same ranked candidate list — npsp_account_soft_credit.sql applies the identical resolution prelude (byte-identical through ResolvedRecognitionOpportunity, asserted by a test), so its emitted vnfp__Implementation_External_ID__c values are existing Opportunity ids and the Account Soft Credit load no longer raises the foreign-key error"
    tags:
      - ac-2
      - account-soft-credit
      - ranked-candidate
      - opportunity-gate
      - altru
      - im-70
      - im-1067
      - tucson
      - happy-path
    given:
      - "el query npsp_account_soft_credit.sql del PR #153 y el profile safesql `tucson`"
    when:
      - "se corre PRE-fix vs POST-fix y se compara `vnfp__Implementation_External_ID__c`; y se corre el integration spec (incl. el caso org-side pledge-payment → pledge)"
    then:
      - "el prelude de resolución (top de archivo hasta `ResolvedRecognitionOpportunity`) es byte-identical al de Partial (asertado por un test) → misma resolución en ambos"
      - "POST-fix: cada external ID emitido resuelve a una Opportunity existente; ningún payment-only id se emite"
      - "el load de Account Soft Credit no lanza el error; el integration spec del lineage pledge-payment → pledge pasa"

  - title: "Regression evidence — the escalation payment id eff95544-… is reproduced then cleared — the exact Tucson-reported id no longer appears as the Opportunity lookup value; against the resolved pledge Opportunity id both objects load, matching the dev's CamiloDevOrg proof (bulk job 750fj00000YhyNAAAZ fails pre-fix; a3Nfj000005j35JEAQ / a2tfj0000009SRhAAM succeed post-fix)"
    tags:
      - regression-evidence
      - escalation
      - eff95544
      - altru
      - im-1067
      - tucson
    given:
      - "la fila del escalamiento cuyo lookup era el pago `eff95544-5e41-42b0-90be-002fd2ccaeb2` (de los CSV de error)"
    when:
      - "se localiza esa recognition en el output POST-fix de ambos queries y se contrasta con la repro del dev en CamiloDevOrg"
    then:
      - "PRE-fix: cargar `eff95544-...` reproduce `INVALID_FIELD: Foreign key external ID ... not found ... in entity Opportunity` (verbatim)"
      - "POST-fix: `eff95544-...` ya NO se emite como `vnfp__Implementation_External_ID__c`; la recognition ancla en la pledge Opportunity resuelta y ambos objetos cargan"
      - "si el pago genuinamente no tiene Opportunity (net=0 / TYPECODE 2/20 / membership-sourced) la fila se dropea limpio, sin re-lanzar el error"

  - title: "Do-no-harm ordering — recognitions that already resolved keep their exact Opportunity — because the own-transaction candidate ranks FIRST (parents are fallbacks, not overrides), a recognition already anchored on a real donation Opportunity is unchanged; only rows that emitted a non-existent payment id move (the mixedPledgePayment case: 255 of 256 High Desert pledge-payment txns emit no Opportunity, but the 1 that also carries a donation line keeps its own)"
    tags:
      - do-no-harm
      - rank-ordering
      - regression
      - load-bearing
      - altru
      - im-1067
    given:
      - "el output PRE-fix y POST-fix de ambos queries sobre las recognitions que YA resolvían correctamente"
    when:
      - "se comparan las Opportunity resueltas PRE vs POST para las filas que no estaban rotas"
    then:
      - "una recognition cuya propia transacción SÍ es una Opportunity emitida conserva exactamente la misma Opportunity (rank 1 gana)"
      - "solo las filas que emitían un payment-id inexistente se re-anclan a un parent (pledge/installment/MG-claim)"
      - "el caso `mixedPledgePaymentRecognition` (fixture) + el SQL-text test del rank ordering lo pinnean (no un cambio masivo de filas ya-correctas)"

  - title: "Drop taxonomy + Opportunity-existence gate + row grain — unresolvable recognitions are DROPPED (not null-FK'd) and every emitted id is a real emitted Opportunity — recognitions with no surviving candidate (net-zero reversed, TYPECODE 2/20 roots, membership-sourced) are dropped because npsp__Opportunity__c is nillable=false; the inclusion gate is byte-equal to donation_transaction.sql (parity test); and ROW_NUMBER()=1 keeps exactly one row per recognition even for multi-pledge splits"
    tags:
      - drop-taxonomy
      - opportunity-gate
      - gate-parity
      - row-grain
      - bijection
      - integrity
      - edge-case
      - altru
      - im-1067
      - tucson
    given:
      - "los outputs POST-fix de los 2 queries y el set de Opportunity external IDs emitidas en Tucson"
    when:
      - "se cruza cada external ID emitido contra las Opportunity emitidas, se cuentan las dropeadas por bucket y se corre el parity test"
    then:
      - "bijection: todo `vnfp__Implementation_External_ID__c` emitido existe como Opportunity emitida (gate `SUM(NetAmount)<>0` + `TYPE='Pledge'`); ningún payment-only id"
      - "drop taxonomy Tucson: de 2,138 in-scope resuelven 2,076 (incl. 213 rescatadas), se dropean 62 (57 reversed, 5 recurring-root, 0 membership) — re-derivar vs el summary desactualizado (~1,860/14)"
      - "row grain: `ROW_NUMBER()=1` → 1 fila por `REVENUERECOGNITION.ID` (multi-pledge tiebreak por `SUM(AMOUNT)`); el gate es byte-equal a donation_transaction.sql (parity test falla ante drift en cualquier dirección)"

