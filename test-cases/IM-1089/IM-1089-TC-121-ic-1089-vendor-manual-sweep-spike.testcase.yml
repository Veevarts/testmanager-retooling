key: "TC-121"
title: "IM-1089 Vendor §11 manual-sweep spike (7 cases) — 4.07 UPGRADE (auto T3 customMetadata POS_Status_Control) + 4.06 HYBRID-with-verify (T6 fails loudly) + 5 stay-manual with documented API-refusal evidence · CODE PR (spec-only, reused ops)"
description: |
  Cobertura QA para IM-1089 (Historia, priority Medium, epic IM-735 Implementation
  Cases Automation).
  QA Sub-task asociada: IM-1126 (creada 2026-07-27).

  Contexto:
  - Post-June IM-735 continuation, Phase 3 (probe-first manual sweep). Spike sobre 7 casos
    §11 (vendor/third-party) para probar pre/post steps automatizables y convertir manual→hybrid
    donde se pueda.
  - PR bajo prueba: `Veevarts/MigrationAppBackend#261` (**MERGED** 2026-07-16 11:32Z).
    Branch: `task/spike-vendor-integrations-IM-1089`. Merge commit `1314806f` (base `f1703651`).
    14 files, +430/-83. (Nota: `1314806f` es exactamente la BASE de IM-1090/#262 — #261 mergeó primero.)
  - **CODE PR spec-only** — NO toca adapters/ops: reutiliza el op T3 `customMetadata` (4.07) y el
    op T6 verify read-only (4.06); los 7 specs bumpean case+template v1→v2 y suman un `.spec.ts`
    lockstep por caso. `scripts/seed-master-template.ts` intacto (IM-1090 posee la flip policy).

  Los 7 casos y su desenlace del spike:
  - **4.07 Rounding Approximation (Canada POS)** → **UPGRADE (manual→auto)**: caso entero = flip de
    un flag managed CMDT `Auctifera__POS_Setting.Default.POS_Status_Control__c=true` (SubscriberControlled,
    escribible). Op T3 customMetadata SOQL-descubre el fullName namespaced y escribe solo el field
    (sin CANNOT_MODIFY_MANAGED_OBJECT, sin duplicado unmanaged), read-back verify, idempotente.
    Live-proven en CamiloDevOrg (flip→SOQL verify→revert).
  - **4.06 QuickBooks Integration (ADD ON)** → **HYBRID-WITH-VERIFY**: el portal QuickBooks + Intuit
    OAuth quedan manual (OAuth per-tenant, sin op); step 2 AUTOMATED T6 read-only verify lee el
    org-default `Auctifera__Accounting__c` y asegura `Automatic_Journal_Integration_Enabled__c=true`,
    lanzando VerifyException (falla el caso) con mensaje al operador si está en false. Read live-proven.
  - **1 DKIM, 3 Zuppio, 3.23 Adyen, 3.26 Email Integration, 8.04 Verify Electronic Payment** →
    **STAY MANUAL** con evidencia de rechazo de API documentada + guías clarificadas:
    * 1 DKIM: `DkimKey` no es sObject ni Tooling object (INVALID_TYPE ×2 en CamiloDevOrg), sin Metadata
      type; creación Setup-UI-only; CNAME/SPF en DNS externo del cliente. Sin write/verify surface.
    * 3 Zuppio: login credencializado al portal externo Zuppio; paquete no instalado en el probe org
      (`EntityDefinition LIKE '%uppio%'` = 0 rows). Sin SF write/verify.
    * 3.23 Adyen: connected apps existen pero el trabajo = OAuth Permitted-Users policy + profile
      grants (Setup-UI, sin op reusable) + portal Adyen externo. Existence-only verify demasiado débil.
    * 3.26 Email Integration: add-in per-device + OAuth per-user (client-side, inalcanzable); el toggle
      org solo es inerte. Sin pre-step/verify que valga.
    * 8.04 Verify Electronic Payment: el caso ES una prueba de aceptación live (charge+refund real,
      prohibido en spike); pre-flight gateway-check improbable — org con 0 merchant devices.

  Estrategia de verificación:
  - **jest + tsc + eslint como evidencia PRIMARIA** (CODE PR): clone en merge `1314806f`, correr los
    7 `.spec.ts` lockstep + gates; re-derivar el conteo del dev (jest 102/102 claim).
  - **spec fidelity independiente**: parsear los 7 specs y verificar por cuenta propia — 4.07 v2/auto
    single T3 customMetadata (values Auctifera__POS_Status_Control__c=true, record Default); 4.06 v2/hybrid
    2 steps MANUAL→T6 verify (apex read-only que THROWS VerifyException, sin DML); los 5 v2/manual single
    MANUAL con guide.actions>0 + refusal evidence en description.
  - **op-reuse audit** (NO genuinely-new): confirmar que los ops T3 customMetadata y T6 verify ya existían
    en base `f1703651` (adapters no tocados por el PR) → la novedad es el wiring del spec, no un op nuevo.
  - **scope boundaries**: seed-master-template.ts sin cambios (IM-1090 owns); no adapter diffs.
  - **NO hay live IE run en este QA**: la verificación live fue CamiloDevOrg-only (dev-proven) y re-correr
    los v2 via la app está bloqueado — los specs v2 NO están seeded a MigrationApp-dev (seed PENDING-CREDS,
    ExpiredToken). Los ítems live quedan documentados como dev-proven/PENDING-CREDS, no PASS/FAIL prematuro.

  Riesgos abiertos (del ticket):
  - **Seed PENDING-CREDS**: `aws sts get-caller-identity` = ExpiredToken; los v2 specs no seeded (append-only)
    → seed en cred refresh. Bloquea re-correr los upgrades via la app.
  - **4.07 PM-confirm**: la KA (ka05w0000019slUAAQ) no es fetchable (Knowledge disabled en CamiloDevOrg); el
    help-text del field es conclusivo pero un confirm de PM de que POS_Status_Control__c ES el caso entero lo cerraría.
  - **Auctifera managed protected**: los write/read targets (Auctifera__POS_Setting__mdt CMDT, Auctifera__Accounting__c
    custom setting) son del managed package Auctifera; el spike los probó en CamiloDevOrg. QA re-verifica por
    código; una verificación metadata-lens live requiere un org con el package Auctifera (no default en trainings).
  - Reporter/assignee del ticket = el dev (Camilo). QA es re-verificación independiente del PR ya MERGED.

