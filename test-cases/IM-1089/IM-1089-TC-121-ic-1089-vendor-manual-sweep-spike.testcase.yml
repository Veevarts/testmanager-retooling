  - "Node + jq/python3 para parsear los 7 specs y verificar la fidelidad del contrato independientemente."
  - "NO se requiere org ni IE run: live fue CamiloDevOrg-only (dev-proven) y los v2 no están seeded (seed PENDING-CREDS)."

