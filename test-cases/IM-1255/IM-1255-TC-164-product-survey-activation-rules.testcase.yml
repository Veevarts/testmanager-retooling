key: "TC-164"
title: "Product scope allows at most one active non-General survey, General NPS surveys coexist only with disjoint organization audiences, and product subject name and slug are derived from the selected product — IM-1255"
description: |
  Test case para IM-1255 (Historia, priority **Medium**, "In QA Review") — epic IM-970
  NPS Survey Tool delivery — QA Sub-task IM-1265. Repositorio: `survey-tool`.
  PR bajo prueba: Veevarts/survey-tool "PR 71" (**MERGED a `develop`** el 2026-09-11,
  +3309/-596, 40 archivos). Ese PR implementa nueve tickets a la vez; este test case cubre
  solo la porcion de IM-1255.

  === QUE PIDE LA HISTORIA ===

  Varias encuestas pueden referenciar el mismo subject de producto, pero como maximo UNA
  puede estar activa por alcance de producto. Varias General NPS pueden estar activas solo si
  sus audiencias de organizacion NO se solapan; si se solapan, o si una apunta a All
  organizations, la activacion se rechaza identificando la encuesta en conflicto. El Name y el
  slug del subject de producto se derivan del producto seleccionado y no se pueden contradecir
  manualmente. Al elegir el subject General NPS, el comportamiento General se aplica solo.

  === QUE HACE EL PR (leido del diff) ===

  `server/src/routes/surveys.ts`:
    - Devuelve **409** con el identificador de la encuesta en conflicto, tanto en create como
      en update: "An active general survey already applies to this audience (survey N)".
    - `validateGeneralNpsSubject()` impone la correspondencia en ambos sentidos: una encuesta
      con el subject General NPS debe ser General, y una encuesta General debe usar ese subject
      y ser de tipo nps.
    - Las General que apuntan a organizaciones exigen al menos una: "General surveys targeting
      organizations require at least one organization."
    - La propiedad de activacion se persiste con **transacciones de DynamoDB** y registros de
      ownership, mas reintentos optimistas para las General no solapadas, de modo que dos
      creaciones concurrentes no puedan activar encuestas que compitan.

  === RIESGOS ABIERTOS ===

    - **Regresion sobre configuraciones ya existentes**: la validacion es nueva y el ticket
      declara que hay datos de subjects heredados. Una encuesta que hoy esta activa y que
      violaria la regla podria quedar imposible de guardar al editarla. Hay que probar el
      camino de edicion de una encuesta preexistente, no solo la creacion.
    - **Concurrencia**: la garantia de unicidad depende de transacciones y lecturas
      consistentes. Dos activaciones simultaneas para el mismo producto deben dejar exactamente
      una activa; probarlo en secuencia no demuestra la invariante.
    - **Solapamiento de audiencias entre organizaciones**: requiere DOS organizaciones de
      Salesforce disponibles al mismo tiempo para ejercitar disjunto contra solapado.
    - El mensaje de conflicto expone el identificador de otra encuesta; verificar que sea
      informacion aceptable para el administrador que la recibe.
    - **El PR esta MERGEADO a `develop`, no a `main`.**

type: functional
