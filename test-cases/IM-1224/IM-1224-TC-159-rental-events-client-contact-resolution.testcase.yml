      - "las reservas aún sin contact POST-fix son exactamente los gaps genuinos del source: 768 org orders sin CONTACTRELATIONSHIPID + 1 household sin primary member"
      - "cross-tenant Illinois si el profile responde: 201 → 9,646 de 9,652 (99.9%)"

  - title: "AC2 · Household branch is deterministic: household/group clients resolve the primary GROUPMEMBER with TOP 1 ORDER BY gm.ID — a group with two ISPRIMARY=1 members cannot duplicate the reservation (IM-773 one-row-per-reservation intact: rows == distinct external IDs)"
    tags:
      - ac-2
      - household-branch
      - determinism
      - row-grain
    given:
      - "la rama household del CTE ReservationClientContacts (GROUPMEMBER con ISPRIMARY = 1)"
      - "el fixture del PR trae deliberadamente un household con DOS miembros ISPRIMARY = 1"
      - "GROUPMEMBER no es único por grupo — un join directo emitiría la reserva dos veces"
    when:
      - "se verifica en el SQL que la rama usa TOP 1 ... ORDER BY gm.ID (orden total por PK)"
      - "se corre rental-event-query.integration.spec.ts (docker) que incluye el check dinámico one-row-per-reservation de IM-773"
      - "en la corrida live POST-fix se compara rows totales vs external IDs distintos"
    then:
      - "rows == distinct external IDs en la salida live (16,731 = 16,731 en Long Island) — el grain 1:1 de IM-773 queda intacto"
      - "el spec dinámico de one-row-per-reservation PASS con el fixture de doble primario"
      - "el ORDER BY queda pinned por text assertion (limitación declarada: runtime no puede probarlo — mismo plan con o sin él sobre data estática)"

  - title: "AC3 · Example 2 is absent source data, not a defect: Client (Company/Household) is byte-unchanged by the PR (12,558 Long Island / 9,525 Illinois) — the empty ones are individuals with NO household row in Altru, and emitting anything would dangle the lookup"
    tags:
      - ac-3
      - regression-evidence
      - example-2
      - source-absence
      - no-regression
    given:
      - "el ticket reporta el Example 2 (Contact poblado, CH vacío) esperando que se llene"
      - "el PR NO toca la lógica de Client (Company/Household), con justificación medida: 4,173 de 16,731 individuos de Long Island no tienen household row en Altru (0 vía GROUPMEMBER)"
      - "account_households.sql solo exporta constituents ISGROUP = 1 — no hay Account external ID derivable para esos casos"
    when:
      - "se compara Client (Company/Household) PRE vs POST sobre la misma corrida (conteos y sample por external ID)"
      - "se verifica en el source una muestra de reservas Example 2: el client individual no tiene CONSTITUENTHOUSEHOLD ni llega a household vía GROUPMEMBER"
      - "se revisa que el PR documenta el paso post-load (poblar CH desde el AccountId del Contact que NPSP crea al cargar)"
    then:
      - "Client (Company/Household): 12,558 poblados PRE = POST en Long Island (byte-unchanged, 9,525 en Illinois) — el PR no regresiona este campo"
      - "los CH vacíos corresponden a individuos sin household en el source — no hay dato que emitir sin danglear"
      - "la respuesta al reportante queda explícita: Example 2 requiere el post-load step (sin ticket aún — riesgo abierto), no un cambio de query"

  - title: "AC4 · Safety invariants: no inclusion gate changes (fills a lookup only), no dangling lookups (both arms filter to the exact contact.sql shape), CAST NVARCHAR(36) type precedence (IM-770), relationship read as stored (36 ISCONTACT=0 + 20 past ENDDATE preserved), '[ANONYMOUS_CONTACT]' count unchanged"
    tags:
      - ac-4
      - safety-invariants
      - no-dangling
      - type-precedence
      - as-stored
    given:
      - "las invariantes declaradas por el PR body"
      - "la salida PRE y POST live sobre el mismo profile"
      - "el shape que exporta contact/contact.sql: ISCONSTITUENT = 1, ISGROUP = 0, ISORGANIZATION = 0"
    when:
