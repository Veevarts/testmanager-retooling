      - "todo Client (Contact) poblado POST-fix tiene un Contact row exportable detrás (0 dangling)"
      - "la rama nueva lleva el CAST — sin él, el streamed export moriría en la primera row placeholder (IM-770)"
      - "las 36 rows ISCONTACT=0 y las 20 con ENDDATE pasado conservan su contact, igual que Altru las muestra"
      - "'[ANONYMOUS_CONTACT]': 0 PRE = 0 POST en Long Island"

