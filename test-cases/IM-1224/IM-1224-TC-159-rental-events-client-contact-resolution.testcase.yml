schemaVersion: "1.0"

id: "3fdf419b-80e5-4d05-ae2c-c30ab83a7d19"
key: "TC-159"
title: "rental_events_groups.sql resolves Client (Contact) for every Altru client type (individual / organisation via CONTACTRELATIONSHIPID / household via primary GROUPMEMBER) — Long Island 40.6% → 95.4% contact-filled with Company/Household untouched — IM-1224"
description: |
  Test case para IM-1224 (Historia, priority **High**, "In QA Review") — epic IM-70 Altru
  Queries — QA Sub-task IM-1225. Cliente reportante: Long Island Children's Museum.
  PR bajo prueba: Veevarts/MigrationToolETL "PR #179" (open, base main, 5 files, +492/-7).

  === CONTEXTO ===

  El ticket reporta que en el Rental Events query el Client (Contact) solo viene mapeado
  para algunos rental events, cuando en Altru ambos campos (Contact y Company/Household)
  están poblados. Dos shapes de ejemplo:
    Example 1 — Company/Household con External ID, Contact vacío (pero Altru SÍ tiene contact).
    Example 2 — Contact con External ID, Company/Household vacío (pero Altru SÍ lo muestra;
                nota del ticket: sin Organization ID, el Household es el HH del Contact).

  ROOT CAUSE (dev, leída del propio SP de Altru USP_RESERVATION_GETCONTACTINFO en el backup
  de Long Island): el Client (Contact) de una reserva NO siempre es el constituent de la
  sales order — la regla ramifica por tipo del client:
    - individual  → el client mismo (única rama que rental_events_groups.sql implementaba)
    - organisation → obligatorio; guardado en SALESORDER.CONTACTRELATIONSHIPID y resuelto a
      RELATIONSHIP.RECIPROCALCONSTITUENTID. Esa columna no se referenciaba en NINGÚN lado
      del repo. Es el Example 1 y es la MAYORÍA del dato: Long Island 9,169 de 16,731
      reservas; Illinois 9,445 de 9,652.
    - household/group → el GROUPMEMBER primario (ISPRIMARY = 1).

  EXAMPLE 2 = AUSENCIA DE DATO FUENTE, NO DEFECTO (según el PR): Client (Company/Household)
  no cambia en este PR. Viene vacío para 4,173 de 16,731 individuos de Long Island porque
  esos constituents NO tienen household row en Altru (0 llegan a un household vía
  GROUPMEMBER). account_households.sql solo exporta ISGROUP = 1, así que no existe Account
  con external ID derivable — emitir algo aquí danglearía el lookup. NPSP crea el household
  Account al cargar el Contact → poblar este campo es un paso POST-LOAD desde el AccountId
  del Contact (166,101 de 297,004 individuos de Long Island no tienen household).

  FIX: CTE ReservationClientContacts resuelve las 2 ramas faltantes; el CASE de
  Auctifera__Client_Contact__c la lee en la rama que antes devolvía NULL. Invariantes
  declaradas por el PR: row grain 1:1 intacto (arms mutuamente excluyentes por
  ISORGANIZATION, joins por PK), sin cambios de inclusión (solo llena un lookup), sin
  dangling (ambas arms filtran al shape que exporta contact/contact.sql), CAST NVARCHAR(36)
  por type precedence (IM-770 — una rama sin cast mata el streamed export en el primer
  '[ANONYMOUS_CONTACT]'), TOP 1 ORDER BY gm.ID para determinismo, y el relationship se lee
  AS STORED (sin filtrar ISCONTACT ni date range — 36 rows de Long Island con ISCONTACT=0 y
  20 con ENDDATE pasado se preservan, igual que Altru las muestra).

  Evidencia live del dev (safesql 2026-09-03):
    longisland: 16,731 rows = 16,731 external IDs; Contact 6,790 (40.6%) → 15,962 (95.4%);
                Company/Household 12,558 SIN CAMBIO; '[ANONYMOUS_CONTACT]' 0 sin cambio.
                Los 769 restantes son gaps genuinos del source (768 org orders sin
                CONTACTRELATIONSHIPID + 1 household sin primary member).
    illinois_2: 9,652 rows; Contact 201 (2.1%) → 9,646 (99.9%); CH 9,525 sin cambio.

  Files del PR: docs/altru-model-context.md, queries/rental-event/rental_events_groups.sql
  (MAIN FIX), query-regression/rental-event-query-fixture.ts,
  rental-event-query.integration.spec.ts (docker, 19 tests),
  rental-event-query.spec.ts (estático).

  Guards MUTATION-TESTED por el dev (revert ELSE NULL → 3 fail; drop ISORGANIZATION guards
  → fails nombrados; drop TOP 1 ORDER BY → 3 fail incl. el one-row-per-reservation de
  IM-773). Fixture deliberado: el org relationship lleva ISCONTACT=0 + ENDDATE pasado
  (re-agregar filtro de vigencia rompe el suite) y el household tiene DOS ISPRIMARY=1
  (un join directo duplicaría la reserva).

  === RIESGOS ABIERTOS ===

    - **Sin ACs formales** — comportamiento inferido de los 2 ejemplos + el PR body.
    - **Example 2 NO se corrige en este PR** (decisión justificada con datos: no hay
      household en el source). El ticket pide ambos campos: la respuesta "ausencia de dato
      fuente + post-load step" debe validarse con la reportante (Paula) / el IE antes del
      cierre. El post-load desde Contact.AccountId NO tiene ticket aún.
    - **2 guards pinned solo por text assertion** (declarado por el dev): ISGROUP +
      ISCONSTITUENT en ambas arms, y el ORDER BY gm.ID (runtime no lo puede probar).
    - **Follow-up fuera del PR sin ticket**: pos_purchase_only_rental_payments.sql lleva la
      MISMA lógica either/or en Auctifera__Client__c / Auctifera__Client2__c (payments y
      security-deposit arms) — mismo gap.
    - **Docker integration spec** (19 tests, SQL Server 2022 real): en la máquina QA exige
      colima gotchas (DOCKER_HOST + startup timeout patch local).
    - **"PR #179" open, no merged** — validar contra HEAD del branch
      CamiloSalgueroMarin/IM-1224-rental-events-client-mapping y confirmar base main.

