      - "se verifica el CAST(... AS NVARCHAR(36)) en la rama nueva del CASE (mezcla con el literal '[ANONYMOUS_CONTACT]')"
      - "se confirma que NO se filtra por ISCONTACT ni por date range del relationship (as stored)"
      - "se cuenta '[ANONYMOUS_CONTACT]' PRE vs POST"
    then:
