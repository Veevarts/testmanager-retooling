      - "profile safesql qa_longisland alcanzable (qa_illinois2 para cross-tenant si responde)"
      - "la regla de Altru: para client organisation el contact es obligatorio y vive en SALESORDER.CONTACTRELATIONSHIPID"
    when:
      - "se ejecuta el query PRE-fix y se cuenta el total de rows y cuántas llevan Auctifera__Client_Contact__c poblado"
      - "se ejecuta el query POST-fix con los mismos parámetros y se repiten los conteos"
      - "se verifica el shape del Example 1: reservas con Client (Company/Household) poblado y Contact vacío PRE-fix que POST-fix quedan con ambos"
      - "se cuentan las reservas que siguen sin contact POST-fix y se clasifican contra el source (CONTACTRELATIONSHIPID NULL / household sin primary)"
    then:
      - "PRE-fix reproduce el Example 1: la mayoría de reservas organisation llevan CH poblado y Contact vacío (Long Island ~6,790 de 16,731 con contact)"
