  - "Repo MigrationToolETL clonado en HEAD del PR #172 (branch fix del dev) + acceso al commit base (main) para contraste PRE-fix."
  - "Al menos un profile safesql alcanzable en /Users/veevart/tools/safesql/profiles. Tucson es el candidato preferido: 17 line-item changes es la señal más grande medible localmente. longisland NO está disponible; su validación depende del re-run del dev en el mismo PR body."
  - "Docker/colima levantado para `npm run test:queries:docker` (41/41 live-database tests). Si docker no arranca en <60s, se marca DEFERRED y se sustituye con revert-proof estático sobre query-regression."
  - "npm ci limpio para correr lint:check, query-regression (558 tests) y build."
  - "Los 3 rev del ticket accesibles vía safesql. Si el profile alcanzable no es longisland, se verifican rev equivalentes en Tucson o los reportados por el dev."
  - "Repo testmanager-retooling clonado para escribir el TR + evidencias bajo attachments/tr-<NN>-tc-153/."

format: gherkin
scenarios:
  - title: "AC1 · fund_assignment_memberships.sql resuelve Auctifera__Posted_Date__c desde la financial transaction que OWNS la línea de membership revenue — 33 fund assignments cambian de fecha en Long Island (10 a mes distinto, 2 a año distinto), 97,014 rows totales invariantes"
    tags:
      - ac-1
      - regression-evidence
      - longisland
      - fund-assignment
      - posted-date
      - membership-line-owner
    given:
      - "el query fund_assignment_memberships.sql del PR #172 y el commit base (PRE-fix, main) disponibles"
      - "un profile safesql alcanzable — idealmente longisland (dev-run) o tucson/high-desert como cross-tenant"
      - "el resolver ResolvedMembershipFinancialTransactions y su ranking (SOURCELINEITEMID children en rank 0, membership line en rank 1)"
    when:
      - "se ejecuta fund_assignment_memberships.sql PRE-fix y POST-fix contra el mismo profile"
      - "se cuenta el total de filas emitidas + filas con Auctifera__Posted_Date__c distinto entre PRE y POST"
      - "se desglosa cuántas mueven a un mes distinto y cuántas a un año distinto"
      - "se verifica que Fund Assignment.Revenue ID queda IDÉNTICO PRE=POST (solo la fecha cambia, no el anchor)"
    then:
      - "en Long Island: 97,014 rows totales PRE = 97,014 POST (nothing added, nothing dropped)"
      - "0 blank posted dates PRE = 0 blank POST"
      - "33 rows cambian Auctifera__Posted_Date__c POST-fix (34 a nivel line-item grain)"
      - "10 de esas 33 rows mueven a un mes distinto; 2 mueven a un año distinto"
      - "de las 34 rows a nivel line-item que cambian, 33 coinciden EXACTO con la fecha que Altru muestra en la membership; la 1 que no matchea es una row sin membership transaction subyacente (add-on / order-backed shape que la fecha de membership no describe)"
      - "Revenue ID del Fund Assignment queda IDÉNTICO PRE=POST — solo la fecha se mueve, no el anchor del registro (así los stakeholders siguen ubicándolos por el mismo Revenue ID)"

  - title: "AC2 · los 3 rev del ticket verificados — rev-11390769 (2024) mueve de 2024-08-31 a 2024-09-01 reproduciendo EXACTO el reporte, rev-10951808 (2021) mueve de 2021-08-25 a 2021-11-06, y rev-10863303 (2019) queda INVARIANTE porque las 3 fechas ya coincidían (false positive documentado)"
    tags:
      - ac-2
      - regression-evidence
      - longisland
      - rev-examples
      - false-positive-documented
    given:
      - "los 3 rev nombrados en el ticket: rev-11390769, rev-10951808, rev-10863303"
      - "para cada rev disponibles: la fila Payment, la fila Order (si existe), la fila MembershipTransaction, y la fecha 'Go to membership' de Altru"
    when:
      - "se ejecuta fund_assignment_memberships.sql PRE-fix y POST-fix para cada rev en Long Island"
      - "se compara Auctifera__Posted_Date__c contra el 'Go to membership' date de Altru"
    then:
      - "rev-11390769 PRE = 2024-08-31 (Payment); POST = 2024-09-01 (Order rev-11391043) — coincide con Altru 2024-09-01. Reproduce EXACTO el reporte (agosto→septiembre)."
      - "rev-10951808 PRE = 2021-08-25 (Payment); POST = 2021-11-06 (Order rev-10964658) — coincide con Altru 2021-11-06."
      - "rev-10863303 PRE = 2019-11-29 = POST = 2019-11-29 — INVARIANTE porque Payment date, Order date y MembershipTransaction date son todos 2019-11-29. Documented false positive del ticket."
      - "en los 3 casos, el Revenue ID en el Fund Assignment queda EXACTAMENTE igual — solo cambia la fecha en los 2 primeros; el 3ro no cambia nada."

  - title: "AC3 · defecto adicional del Refund tiebreaker — 10 fund assignments positivos de membership de Long Island que estaban dated on un Refund transaction quedan corregidos por el mismo fix"
    tags:
      - ac-3
      - refund-tiebreaker
      - longisland
      - additional-defect
      - regression-evidence
    given:
      - "el resolver ResolvedMembershipFinancialTransactions con su tiebreaker Refund que rankeaba bajo el bucket principal antes del fix"
      - "10 rows específicas de Long Island reportadas por el dev que datan de un Refund transaction"
    when:
      - "se ejecuta fund_assignment_memberships.sql PRE-fix y POST-fix"
      - "se identifican las rows positivas de membership Fund Assignment cuya Posted Date PRE viene de una transacción TYPECODE = Refund"
    then:
      - "10 rows de LI PRE tienen Posted Date que viene de una transacción Refund"
      - "POST-fix: 10 rows corregidas — Posted Date ahora viene de la financial transaction que OWNS la membership revenue line (Order/Membership), no del Refund child"
      - "esas 10 rows son subconjunto de las 33 totales que cambian; están reflejadas en el conteo total"
      - "el mismo fix (anchor sobre membership line owner) cubre tanto el Payment child como el Refund child sin lógica adicional"

  - title: "AC4 · impacto cross-tenant medido + IM-904 preservado — Long Island 34 line-item, Tucson 17, High Desert 20, Illinois 4; 0 recurring memberships afectados en ningún profile (recurring-installment date sigue ganando)"
    tags:
      - ac-4
      - cross-tenant
      - im-904-preserved
      - tucson
      - high-desert
      - illinois
      - recurring-membership
    given:
      - "profiles safesql alcanzables — mínimo tucson (17 line-item changes, señal más grande medible localmente)"
      - "los conteos dev-reportados line-item grain: Long Island 34 / Tucson 17 / High Desert 20 / Illinois 4"
      - "la regla IM-904: recurring-installment date debe seguir ganando para recurring memberships (comportamiento preservado)"
    when:
      - "se ejecuta fund_assignment_memberships.sql PRE-fix y POST-fix contra cada profile alcanzable"
      - "se cuenta line-item level: cuántas Posted Dates cambian POST-fix"
      - "se cuenta cuántas recurring memberships cambian de Posted Date (debe ser 0 en todos los profiles)"
    then:
      - "Tucson: 17 line-item Posted Date changes POST-fix; 0 recurring memberships cambian"
      - "High Desert: 20 line-item changes; 0 recurring memberships cambian"
      - "Illinois: 4 line-item changes; 0 recurring memberships cambian"
      - "Long Island (dev-run): 34 line-item changes; 0 recurring memberships cambian"
      - "IM-904 preservado en todos: para recurring memberships la installment date sigue ganando sobre el nuevo anchor de membership line — 0 regresión"
      - "el re-run de producción se planea con conteos por tenant, no solo con el de Long Island"

  - title: "AC5 · invariantes de seguridad + gates de regresión — 97,014 rows PRE=POST (compuerta de inclusión intacta, incluida la rama split-receipting con su window column separada), 0 blank dates, revert-proof positivo con 4 mutations, 558 unit tests + 41/41 live-database tests PASS, output column list IDÉNTICA a producción"
    tags:
      - ac-5
