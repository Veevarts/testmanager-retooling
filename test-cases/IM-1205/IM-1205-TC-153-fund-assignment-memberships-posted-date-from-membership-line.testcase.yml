      - inclusion-gate
      - split-receipting-window
      - revert-proof
      - integration-docker
      - query-regression
      - mutation-testing
    given:
      - "el HEAD del PR #172 checked out"
      - "docker/colima levantado (o degradación documentada a revert-proof estático)"
      - "el commit base (main) para el revert-proof"
    when:
      - "se corre el suite de live-database tests dockerizado (41 tests), lint:check, query-regression (558 tests), build"
      - "se cuenta la salida total de fund_assignment_memberships.sql PRE vs POST (row conservation)"
      - "se cuentan blank posted dates PRE y POST (0 en ambos)"
      - "se cuenta cuántas rows la rama split-receipting emite PRE vs POST (debe ser exactamente igual — Round-1 finding del dev)"
      - "se compara la lista de columnas exportadas PRE vs POST (Round-3: identical)"
      - "se revierten deliberadamente 4 mutaciones del query (el mismo protocolo del dev) y se verifica que los tests capturan cada mutación"
    then:
      - "row conservation: 97,014 PRE = 97,014 POST en Long Island; 0 blank posted dates en ambos"
      - "compuerta de inclusión split-receipting intacta: la window column separada previene que la corrección de la posted date cambie qué rows la rama emite"
      - "lista de columnas exportadas: IDÉNTICA a producción PRE vs POST"
      - "41/41 live-database tests PASS incluyendo el test dedicado al escenario del bug"
      - "558 unit tests (query-regression) PASS; lint:check limpio; build OK"
      - "mutation testing: las 4 rebreaks deliberadas del query son capturadas por al menos un test cada una"
      - "IM-904 test real añadido en esta iteración (Round-2 finding) — pin del comportamiento recurring-membership en este path"

