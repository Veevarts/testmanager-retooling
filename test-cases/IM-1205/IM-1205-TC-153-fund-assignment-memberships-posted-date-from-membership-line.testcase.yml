schemaVersion: "1.0"

id: "b6fcd053-5337-4cd4-9e46-189607961440"
key: "TC-153"
title: "fund_assignment_memberships.sql anchors Auctifera__Posted_Date__c on the financial transaction that OWNS the membership revenue line (order/membership) instead of the Payment child that outranked it — 33 Long Island rows corrected, 0 recurring memberships regressed, IM-904 preserved (IM-1205)"
description: |
  Test case para IM-1205 (Historia, priority High, severity 3-High, "In QA Review") — epic IM-70 Altru
  Queries — QA Sub-task IM-1210. Cliente reportante: Long Island Children's Museum. PR bajo prueba:
  Veevarts/MigrationToolETL #172 (draft).

  Contexto: `fund_assignment_memberships.sql` derivaba `Auctifera__Posted_Date__c` desde el resolver
  `ResolvedMembershipFinancialTransactions`, que rankea una fila con `SOURCELINEITEMID` (línea child)
  antes (rank 0) que la fila membership propia (rank 1). Ese ranking existe para refund/adjustment
  children — pero un POS Payment aplicado a un sales order tiene la MISMA shape: una línea con
  `APPLICATION = 'Order'` en la transacción Payment que apunta de vuelta a la línea de membership.
  Resultado: en memberships order-backed la transacción Payment gana y el Fund Assignment hereda
  la fecha de payment/processing en vez de la fecha de la Order. Es invisible cuando order y payment
  caen el mismo día (casi siempre), lo cual explica por qué solo unos pocos registros lo muestran.

  El fix (del PR #172) — la posted date ahora se ancla en la financial transaction que OWNS la línea
  de membership revenue, no en la que el resolver rankea primero. La instalment date de recurring
  memberships sigue ganando (IM-904 preservado), y el valor previo queda como último fallback.
  Espeja la convención que `fund_assignment_donations.sql` ya usa.

  Defecto adicional encontrado por el dev (en el mismo PR): el tiebreaker Refund del resolver rankea
  bajo el bucket principal, así que un Refund child TAMBIÉN outrankea la línea de membership. Esto
  dató 10 fund assignments positivos de membership de Long Island sobre un refund. El mismo fix
  corrige esas 10.

  Impacto medido por el dev (live Altru source, 2026-08-24, todo tenant):
    | Tenant       | Total rows | Blank posted PRE=POST | Rows con date change | Rows a mes distinto | Rows a año distinto | Recurring afectados |
    | Long Island  | 97,014     | 0                     | 33 (34 line-item)   | 10                  | 2                   | 0                   |
    | Tucson       | —          | —                     | 17 (line-item)      | —                   | —                   | 0                   |
    | High Desert  | —          | —                     | 20 (line-item)      | —                   | —                   | 0                   |
    | Illinois     | —          | —                     | 4 (line-item)       | —                   | —                   | 0                   |

  Row grain LI: 97,014 = 97,014 PRE=POST (nothing added, nothing dropped, no blank dates). Después
  del fix 33 de 34 rows coinciden con la fecha que Altru muestra en la membership; la que no
  coincide es una row sin membership transaction subyacente (add-on / order-backed shape que la
  fecha de membership no describe).

  Rev-examples verificados por el dev en Long Island:
    - rev-11390769 (2024): PRE=2024-08-31 (Payment) → POST=2024-09-01 (Order rev-11391043) —
      coincide con Altru "Go to membership" 2024-09-01. **Reproduce EXACTO el reporte** (agosto en SF,
      septiembre en Altru).
    - rev-10951808 (2021): PRE=2021-08-25 (Payment) → POST=2021-11-06 (Order rev-10964658) —
      coincide con Altru 2021-11-06.
    - rev-10863303 (2019): PRE=2019-11-29 = POST=2019-11-29 = Altru 2019-11-29 — **false positive
      del ticket** (payment date, order date, membership transaction date todos iguales, la row ya
      estaba correcta y nada cambia).

  Consecuencia downstream: la Revenue ID del Fund Assignment queda INTACTA — sigue mostrando el id
  del Payment (ej. rev-11390769), que es cómo se localizan estos registros en la org. Solo se
  mueve la fecha.

  Round-1 review finding (dev): la rama split-receipting filtra sobre la misma columna que se
  estaba corrigiendo; sin cuidado, un date-windowed run habría silently cambiado qué rows esa
  rama emite. Fix: la rama split-receipting recibió una window column separada — solo se mueve
  el exported date; la compuerta de inclusión queda exactamente donde estaba.

  Round-1 review finding (dev): los tests originales solo matchean query text. Reemplazados por
  tests reales que corren la query contra un SQL Server dockerizado y assertan el exported date.

  Round-2 review finding (dev): la regla recurring-membership (IM-904) no tenía test real
  guardándola en este path. Añadido test real.

  Round-3 review finding (dev): la lista de columnas exportada es IDÉNTICA a producción — solo la
  fecha corregida cambia. Verificado con 4 mutation tests (deliberately re-breaking the query
  four different ways, todos capturados).

  Validation dev: lint + 558 unit tests + 41/41 live-database tests PASS.

  Riesgos abiertos + dependencias:
    - **CloseDate del Opportunity queda con la vieja fecha**: `membership_transactions.sql` lee el
      mismo resolver viejo y en las mismas 10 rows de Long Island la CloseDate viene de una
      transacción Refund. Out of scope de IM-1205; el dev pide decisión del stakeholder si abrir
      ticket separado (dev/comment #24186 flags "Refund-dated CloseDate" para decisión).
    - **IM-1206 comparte esta root cause**: ese ticket puede requerir cambiar el ANCHOR del record
      (Revenue ID / CloseDate), no solo la fecha. IM-1205 solo corrige el Fund Assignment date;
      IM-1206 debe decidir el scope más amplio.
    - **Notion sync pre-existing**: la "Altru Model Context Artifacts" Notion page está detrás
      (IM-1192 y IM-1193 también faltan); no introducido por este PR pero se declara.
    - **PR #172 está en DRAFT**, base branch main, no merged, no deploy.
    - **safesql profile de longisland NO disponible localmente** (aspen/illinois_2/tucson son los
      alcanzables). La validación cuantitativa Long Island depende del re-run del dev; en Tucson
      (17 line-item changes) se puede validar localmente.
    - **rev-10863303 es un false positive documentado**: el TC lo incluye deliberadamente para
      pinnear el no-op invariant (fix no debe alterar rows donde las 3 fechas ya coinciden).

