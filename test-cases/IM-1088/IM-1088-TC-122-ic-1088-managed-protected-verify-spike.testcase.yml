key: "TC-122"
title: "IM-1088 Managed-protected manual-sweep spike (3 cases) — 3.1 Connected Apps / 3.13 Create Online Apps / veevart-auth all flip manual→hybrid via a T6 read-back verify (blind handoff → verified); protection is REAL on the write side · CODE PR (spec-only, reused T6 op)"
description: |
  Cobertura QA para IM-1088 (Historia, priority Medium, epic IM-735 Implementation
  Cases Automation).
  QA Sub-task asociada: IM-1127 (creada 2026-07-27).

  Contexto:
  - Post-June IM-735 continuation, Phase 3 (probe-first manual sweep). Spike sobre 3 casos
    managed-protected para confirmar que la protección es real (probe read/write vía Metadata/
    Tooling/Data API) y convertir cualquier READ probeable en un verify automatizado.
  - PR bajo prueba: `Veevarts/MigrationAppBackend#260` (**MERGED** 2026-07-16 10:56Z).
    Branch: `task/spike-managed-protected-IM-1088`. Merge commit `f1703651` (base `5f1fdd1d`).
    6 files, +288/-34. (Chain: #260 merge `f1703651` = BASE de IM-1089/#261; #260→#261→#262.)
  - **CODE PR spec-only** — NO toca adapters/ops: reutiliza el op T6 verify (anon Apex read-only,
    catalog-declarative). Los 3 specs bumpean case+template v1→v2, feasibility manual→hybrid, y suman
    un `.spec.ts` lockstep/surface por caso. `scripts/seed-master-template.ts` intacto (IM-1090 owns).

  Desenlace del spike — la protección managed es **REAL** en el write side de los 3 casos (ninguna
  Metadata/Tooling/Data API puede hacer la configuración), pero cada caso **produce estado legible por
  API**, así que cada uno flippea **manual → hybrid** agregando un step T6 read-back verify (handoff
  ciego → handoff verificado) + guía mejorada. Probado live en CamiloDevOrg (00Dfj00000QJMx7EAH):
  - **3.1 Connected Apps security** → HYBRID-WITH-VERIFY. Write: `ConnectedApplication.
    OptionsAllowAdminApprovedUsersOnly` describe `updateable=false` (objeto `updateable=false`);
    Tooling PATCH → HTTP 400. Verify T6: lee `ConnectedApplication` + `SetupEntityAccess`; asserta que
    ambas apps Veevart están admin-pre-authorized Y con profile/permset asignado. Detección probada live
    (el pass-path no es showable — el flag no es API-writable, que ES el finding).
  - **3.13 Create Online Apps** → HYBRID-WITH-VERIFY. Write: wizard managed (subdomain + Connect-with-SF
    OAuth + provisioning) es un flow Aura/LWC sin write surface Metadata/Tooling/Data. Verify T6: lee
    `Auctifera__Online_Apps_Settings__c` org-default; asserta subdomain poblado Y los 4 flags de seguridad
    mandatorios. Detección Y pass ambos probados live (org revertido).
  - **veevart-auth Authenticate Online Apps** → HYBRID-WITH-VERIFY. Write: OAuth grant interactivo contra el
    managed `Veevart Online Apps` connected app; ninguna API autoriza OAuth por el usuario. Verify T6: lee
    `OauthToken` para el connected app; asserta ≥1 token autorizado (el grant tomó). Pass probado live (2 tokens).

  Estrategia de verificación:
  - **jest + tsc + eslint como evidencia PRIMARIA** (CODE PR): clone en merge `f1703651`, correr los 3
    `.spec.ts` + gates; re-derivar el conteo del dev (jest 204/204).
  - **spec fidelity independiente**: parsear los 3 specs y verificar por cuenta propia — cada uno v2/hybrid,
    2 steps ordenados MANUAL→AUTOMATED T6; y leer el apex de cada verify para confirmar que lee los objetos
    correctos, asserta las condiciones de cada AC, y THROWS VerifyException con mensaje de remediación.
  - **op-reuse audit** (NO genuinely-new): confirmar que #260 NO toca adapters (6 files = 3 specs + 3 .spec.ts);
    el op T6 verify es anon Apex catalog-declarative → la novedad es el wiring del spec, no un op nuevo.
  - **scope boundaries**: seed-master-template.ts sin cambios (IM-1090 owns); managed-protection REAL en write
    (updateable=false / Tooling 400) documentada como refusal evidence.
  - **NO hay live IE run en este QA**: la verificación live fue CamiloDevOrg-only (dev-proven) y los v2 NO están
    seeded a MigrationApp-dev (seed PENDING-CREDS, AWS SSO expirado). Live = dev-proven/PENDING-CREDS, no PASS/FAIL prematuro.

  Riesgos abiertos (del ticket):
  - **Seed PENDING-CREDS**: AWS SSO token expirado; los v2 no seeded (append-only) → seed en cred refresh.
    Bloquea re-correr los hybrids via la app.
  - **3.1 pass-path no showable**: el flag OptionsAllowAdminApprovedUsersOnly no es API-writable (ESE es el
    finding); solo la detección (fail-path) es demostrable por API — el pass depende de un pre-auth manual real.
  - **veevart-auth anchor**: `Auctifera__Veevart_Apps_Credential__c` org-default está vacío en el probe org →
    no es anchor confiable; por eso el verify usa OauthToken en su lugar.
  - **Auctifera/managed protected**: los read targets son del managed package; el spike los probó en CamiloDevOrg.
    QA re-verifica por código (contrato del apex + op reuse), sin metadata-lens live (org fuera de alcance).
  - Reporter/assignee del ticket = el dev (Camilo). QA es re-verificación independiente del PR ya MERGED.

