id: "a1ec92f8-f266-440c-8f88-8a28e1deac0d"
key: "TC-167"
title: "Survey preview renders the currently selected survey, sizes its shell to the rendered content within bounded limits, and scrolls instead of overflowing — IM-1257"
description: |
  Test case para IM-1257 (Historia, priority **Medium**) — epic IM-970 NPS Survey Tool
  delivery — QA Sub-task IM-1268. Repositorio: `survey-tool`. PR bajo prueba: "PR 71"
  (MERGED a `develop` el 2026-09-11). Cubre solo la porcion de IM-1257.

  El preview debe mostrar la encuesta SELECCIONADA y no una cargada previamente, ajustar el
  alto del contenedor al contenido con topes practicos de ancho y alto, usar el mismo fondo
  blanco y radio de borde que el panel real, y conservar el scroll cuando el contenido supera
  el maximo.

  Contexto de regresion: este es el cuarto ticket que toca el preview. IM-1187 lo corrigio tres
  veces (rutas numericas, render despues del login y tamano del modal), asi que el area tiene
  historial y conviene mirar la causa de fondo, que era depender del estado ya cargado.
type: functional
priority: medium
status: active

preconditions:
  - "Entorno de Survey Tool con `develop` desplegado y credenciales de administrador."
  - "Al menos dos encuestas distintas y previsualizables, para poder abrirlas de forma consecutiva."
  - "Una encuesta con contenido lo bastante largo como para superar la altura maxima del preview, necesaria para el escenario de scroll."
  - "Un viewport de escritorio."
format: gherkin
scenarios:
  - title: "AC1 · Previewing two different surveys consecutively shows the second one, not cached content from the first"
    tags: [ac-1, happy-path, regression]
    given:
      - "un administrador que abre el preview de una encuesta y luego lo cierra"
    when:
      - "abre el preview de una encuesta distinta"
    then:
      - "el preview muestra la segunda encuesta y no el contenido de la primera"
      - "el contenedor del preview apunta a la encuesta seleccionada mediante su identificador explicito"
      - "alternar entre una encuesta General y una de producto no arrastra estado de la anterior"

  - title: "AC2 · A survey shorter than the maximum contracts to its content without excessive blank space"
    tags: [ac-2, happy-path, layout]
    given:
      - "una encuesta cuyo contenido es mas corto que las dimensiones maximas del preview"
    when:
      - "se renderiza su preview"
    then:
      - "el alto del contenedor se ajusta al contenido en vez de quedar fijo"
      - "dos encuestas de distinto largo producen previews de distinto alto"
      - "no queda espacio en blanco sobrante por debajo del contenido"
      - "el fondo blanco y el radio de borde coinciden con los del panel de encuesta real"

  - title: "AC3 · Content taller than the configured maximum stays within the viewport and scrolls without overlap"
    tags: [ac-3, edge-case, layout]
    given:
      - "una encuesta cuyo contenido supera la altura maxima configurada para el preview"
    when:
      - "se renderiza su preview en un viewport de escritorio"
    then:
      - "el preview permanece dentro del viewport y no desborda la pantalla"
      - "aparece scroll interno para recorrer el contenido"
      - "ningun elemento del preview se solapa con otro al hacer scroll"
tags:
