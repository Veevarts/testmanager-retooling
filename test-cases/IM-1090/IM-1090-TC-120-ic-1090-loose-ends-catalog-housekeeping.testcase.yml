title: "IM-1090 Loose ends & catalog housekeeping — re-test specs sound (7.03/6.12/3.02b) + stale slug de-dupe + zero dup caseId/defaultOrder + master-template flip policy + cosmetic nits + green gates + creds-gated dev-seed backlog · CODE PR (catalog housekeeping)"
description: |
  Cobertura QA para IM-1090 (Historia, priority Medium, epic IM-735 Implementation
  Cases Automation).
  QA Sub-task asociada: IM-1125 (creada 2026-07-27).

  Contexto:
  - Post-June IM-735 continuation, Phase 4 (loose ends) del plan Complete Cases Automation.
    NO es un IC de config-plan: es **housekeeping del catálogo de specs** + verificación
    estructural de 3 re-test specs + la decisión de política del master-template.
  - PR bajo prueba: `Veevarts/MigrationAppBackend#262` (**MERGED** 2026-07-16 12:06Z).
    Branch: `task/ic-1090-loose-ends-housekeeping-IM-1090`. Merge commit `82c35b14`
    (base `1314806f`). 17 files, +376/-207.
  - **CODE PR / catalog housekeeping** — sin cambios de negocio en un caso puntual; toca:
    * `scripts/master-template-composition.ts` (NUEVO, +174) — módulo puro extraído del seed
    * `scripts/master-template-composition.spec.ts` (NUEVO, +146) — consistency + assembly tests
    * `scripts/seed-master-template.ts` (+29/-111) — usa el módulo puro; quita ic-3-05 del EXCLUDE
    * `scripts/seed-w4-foundations-template.ts` (+2/-2) — repunta el slug borrado al caseId canónico
    * `src/.../tools/metadata-mutation-spec.ts` (+2/-2) — doc SettingsSpec `enableNewProfileUI`
    * `demo-opportunity-stages.json` + `.spec.ts` — BORRADOS (old-slug 5.04, feasibility auto/T6)
    * 6 specs con bump de versión case+template en lockstep + su cambio de contenido:
      ic-1-session-settings-cdn (v3, order 100→101), ic-3-3-activate-feature-settings (v2, order
      303→330), ic-veevart-auth (v3, order 313→301), ic-3-28-fiscal-year (v3, "Company Information"
      → "Company Settings"), ic-5-07-npsp-customizable-rollups (v3, +npsp__Is_Deleted__c=false),
      ic-6-02-ticketing-page-layouts (v4, step-1 desc concisa) + sus .spec.ts lockstep.

  Alcance de las 7 AC (Gherkin en el ticket):
  1. Los 3 re-test specs (7.03 Applied Discounts, 6.12 Course Wizard, 3.02b Folders & Enhanced
     Sharing) son estructuralmente sanos: parsean via parseSpec; el op T2 recordTypeVisibility
     (7.03) y el op T3 picklistValues (6.12) resuelven a handler merged con dispatch + read-back;
     3.02b es guía pura MANUAL sin op automatizado. Live green-run = **PENDING-CREDS**.
  2. Los specs old-slug duplicados se borran, se conserva el canónico ic-N: demo-opportunity-stages
     (5.04) + su test lockstep borrados; ic-5-04-opportunity-stages conservado; ninguna referencia
     de código/template al slug borrado (w4-foundations repunteado); 3.12 y 5.16 demo-slug intactos.
  3. El catálogo no tiene caseIds ni defaultOrders duplicados: colisiones 100/303/313/504 resueltas
     con un orden que ordena por Order__c; ic-veevart-auth con defaultOrder distinto + label sin
     colisión con 3.13.
  4. Los casos flippeados manual→hybrid/auto permanecen en el master template: 3.05, 3.16, 3.25,
     3.29, ic-1 Session Settings, ic-5-2, ic-6-04, ic-6-05 presentes en los caseRefs del master;
     sin dependsOn colgantes; un flip futuro que olvide pinnearlo FALLA en CI.
  5. Los nits cosméticos diferidos se barren: ic-6-02 step-1 concisa; ic-3-28 step-1 "Company
     Settings"; ic-5-07 step-5 filtra npsp__Is_Deleted__c=false; doc SettingsSpec cita enableNewProfileUI.
  6. Gates verdes y versiones en lockstep: tsc --noEmit limpio; suites jest de seeds+scripts pasan
     (incl. los tests nuevos de assembly + consistency); eslint limpio en archivos tocados; cada
     spec con contenido bumpeó case+template version juntos.
  7. El backlog de dev-seed reconciliation queda documentado (creds-gated): AWS SSO expirado →
     NO se hace el flush en este PR; se documenta el backlog PENDING-CREDS (specs v-bumpeados de
     este PR + IM-1077..1089); se nota el dev-drift pre-nit (3.09 Client2, 6.03 Exposition, 7.02).

  Estrategia de verificación:
  - **jest + tsc + eslint como evidencia PRIMARIA** (es un CODE PR): clone en merge `82c35b14`,
    npm ci, correr las suites de seeds + scripts (incluyendo los tests nuevos de consistency +
    assembly) + tsc --noEmit + eslint sobre archivos tocados. Re-derivar el conteo del dev (238/30).
  - **independent catalog re-derivation** (NO confiar en el test ni en el PR body): parsear todos
    los JSON del specs dir en el merge y computar duplicados de caseId/defaultOrder por cuenta propia;
    confirmar los valores exactos de las colisiones (100→101, 303→330, 313→301, 504 por borrado).
  - **genuinely-new** (módulo): el módulo master-template-composition + su spec no existen en base.
  - **static/grep** para el resto: slug borrado sin referencias vivas; ic-5-04 conservado; nits
    aplicados exactos; ops recordTypeVisibility/picklistValues presentes en los adapters.
  - **NO hay live IE run** en este QA: la AC misma marca los live green-runs como PENDING-CREDS
    (AWS SSO expirado, CamiloDevOrg-only). Los ítems live quedan documentados como PENDING-CREDS,
    NO PASS/FAIL prematuro.

  Riesgos abiertos (del ticket):
  - **5.04 automation gap**: el demo borrado era feasibility=auto (T6 apex de OpportunityStage); el
    canónico ic-5-04 conservado es un stub manual v1. Si 5.04 debe automatizarse, requiere un flip
    ticket separado (fuera de alcance del housekeeping). QA lo nota, no lo falla.
  - **~30 born-auto cases** de ciclos previos tampoco están en el master (misma clase que los
    flippeados). Fuera de alcance IM-1090; QA lo registra como observación para follow-up.
  - **Live PENDING-CREDS**: 7.03/6.12 green-run en CamiloDevOrg queda diferido a refresh de creds.
    NO se ejecuta IE run en este QA.
  - Reporter/assignee del ticket = el dev (Camilo). QA es re-verificación independiente del PR ya MERGED.

