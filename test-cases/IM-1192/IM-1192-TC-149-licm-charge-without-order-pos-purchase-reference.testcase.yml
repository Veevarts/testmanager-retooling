id: "4be3738b-1554-4bfe-a0fa-a5c5731467d4"
key: "TC-149"
title: "LICM · charge_without_order.sql resolves POS Purchase Implementation External ID per object family (IM-1192)"
description: |
  Test case para IM-1192 (Historia, Crítica, In QA Review) — epic IM-70 Altru Queries — QA Sub-task IM-1198.
  Cliente objetivo: Long Island Children's Museum (LICM). PR bajo prueba: Veevarts/MigrationToolETL #167
  (branch CamiloSalgueroMarin/IM-1192, stacked sobre story/10-379-donations-sin-IM-1166 = IM-1166).

  Contexto: charge_without_order.sql proyectaba `ft.ID` bare en la columna de relación
  Auctifera__POS_Purchase__r:...-Implementation_External_ID__c para toda su población. Un valor
  no-blanco no-matching en una columna `__r:` falla la FILA ENTERA de Charge en el load, no solo
  el lookup. Medición dev safesql en LICM (2026-08-14): 88,193 de 114,638 referencias distintas
  (77%) resolvían a nada, todas provenientes de la rama ParentLink self-parent.

  El fix reclasifica la referencia por familia de objeto (5 familias: rental payment,
  order-backed payment, pledge, membership, donation) espejando el gate de emisión + la key
  de cada POS Purchase query. Además, el orden del CASE es load-bearing: familias 1 y 2 tienen
  overlap de 25,787 rows; un CASE mal ordenado silenciosamente re-parentea 25,787 Charges a
  la POS Purchase equivocada sin ningún error.

  Métricas dev safesql PRE→POST (Long Island whole-tenant):
    - Charges emitted: 115,010 → 115,010 (unchanged)
    - Distinct external IDs: 115,010 → 115,010
    - Dangling POS references: **88,193 → 0**
    - Blank POS references (ELSE NULL): 0 → 605
  453 query-regression tests PASS (18 en charge-without-order-query.spec.ts).

  Alcance QA: contraste PRE/POST del dangling count sobre la query source; verificación por
  familia y del orden del CASE; regresión sobre charge_with_order.sql (out-of-scope pero
  medido en el PR body a 0 dangling); investigación del UUID reportado en IM-1192
  (`06e4b843-2506-4ec7-aba5-959e8210cb1e`) que Camilo documenta como SALESORDER.ID de
  charge_with_order.sql — es un load-side failure NO cubierto por este PR; idempotencia y
  precondición de run unwindowed.

  Riesgos abiertos (heredados del PR body y de la ausencia de ACs formales):
    - 4 celdas de la tabla de familias son PROVISIONAL: DB fleet timeouts desde 2026-08-18
      impidieron re-medir después del tightening de round 1. Camilo predice: familia 1 ≤ 25,789,
      familia 2 ≥ 25,822, familia 5 ≤ 10,309, NULL ≥ 605, total 115,010. Familia 2 subiendo
      arriba de 25,822 ES el efecto del fix, NO regresión.
    - Windowed runs son HAZARD documentado: 0 dangling references SOLO garantizado en unwindowed.
      Pledges rompen porque gift date y payment date se separan por diseño; un pledge de 2015
      pagado en 2024 con fromDate=2024-01-01 emite Charge dangling.
    - IM-1192 no tiene ACs formales; los 5 ACs de este TC son inferidos del PR body + del
      error reportado + del scope declarado por Camilo (2 defectos independientes: Routing y Keying).
    - El PR está OPEN, base branch es story/10-379-donations-sin-IM-1166 (IM-1166), NO main.
      El re-parent test de familias 1 y 2 aplica a esa base branch, y el merge a main debe
      esperar a IM-1166 (#165) mergeado antes.
    - safesql profile de LICM NO disponible localmente (solo aspen/illinois_2/tucson); la
      validación cuantitativa PRE/POST depende del PR body y del run del dev.

type: integration
priority: critical
status: active

preconditions:
  - "Repo MigrationToolETL clonado en HEAD del PR #167 (branch CamiloSalgueroMarin/IM-1192) + acceso al commit base para contraste PRE-fix."
  - "safesql profile de LICM disponible (o dump anonimizado equivalente). Sin ese profile la ejecución queda parcialmente manual — hoy solo hay aspen, illinois_2, tucson en /Users/veevart/tools/safesql/profiles."
  - "Repo testmanager-retooling clonado para escribir el TR y las evidencias bajo attachments/tr-<NN>-tc-149/."
  - "Query charge_without_order.sql identificada (5 archivos POS Purchase de referencia: pos_purchase_only_rental_payments, sales_order, sales_order_only_pledge, sales_order_only_membership2, sales_order_only_donation2)."
  - "Método documentado para observar el POST: aggregate SQL con LEFT JOIN al output de cada POS Purchase query para contar dangling references."
  - "Suite dockerizada corriendo en el PR: 453 fast query-regression tests + build clean + lint clean."
  - "Se corre UNWINDOWED: fromDate/toDate NO seteados en el extractor. Windowed run es HAZARD documentado (ver riesgos)."

format: gherkin
scenarios:
  - title: "AC1 · charge_without_order.sql — dangling POS Purchase references reducen de 88,193 (77%) a 0 en Long Island whole-tenant"
    tags:
      - ac-1
      - regression-evidence
      - licm
      - dangling-refs
    given:
      - "el profile safesql de LICM (o dump equivalente) cargado en el runner"
      - "las 5 queries POS Purchase que charge_without_order.sql referencia (pos_purchase_only_rental_payments, sales_order, sales_order_only_pledge, sales_order_only_membership2, sales_order_only_donation2) disponibles en el mismo checkout"
      - "el commit base del PR #167 (PRE-fix, HEAD~n) checked out"
    when:
      - "se ejecuta charge_without_order.sql PRE-fix contra LICM"
      - "se cuentan referencias distintas de Auctifera__POS_Purchase__r:Implementation_External_ID__c que NO resuelven a ningún External ID emitido por las 5 queries POS Purchase"
      - "se hace checkout al HEAD del PR (POST-fix) y se re-ejecuta el mismo conteo"
    then:
      - "el conteo PRE = 88,193 dangling references de 114,638 distintas (77%)"
      - "el conteo POST = 0 dangling references"
      - "las 605 nuevas referencias NULL (ELSE NULL branch) son BLANK, no dangling — un blank lookup carga el Charge; un dangling lo pierde"
      - "el total de external IDs distintos permanece en 115,010 (no hay row loss)"

  - title: "AC2 · orden del CASE es load-bearing — familias 1 y 2 (rental payment vs order-backed payment) evalúan en el orden correcto, sin re-parentear 25,787 Charges"
    tags:
      - ac-2
      - routing
      - case-order
      - critical
    given:
      - "el PR #167 checked out con el spec new charge-without-order-query.spec.ts (18 tests) incluido"
      - "el gate de rental payments testea SALESORDERPAYMENT.PAYMENTID (misma columna que SalesOrdersByPayment)"
      - "medición dev safesql: 25,787 de 25,789 rows rental-backed también matchean order-backed"
    when:
      - "se corren los 18 tests de charge-without-order-query.spec.ts en el PR branch"
      - "se ejecuta charge_without_order.sql sobre LICM y se agrupan Charges por la familia asignada"
    then:
      - "los tests que pinnan el orden CASE (rental antes que order-backed) PASS"
      - "el conteo de rental payments = 25,789 (familia 1)"
      - "el conteo de order-backed payments = 25,822 (familia 2)"
      - "ningún row de la familia 1 aparece con una key SALESORDER.ID (no cross-family re-parent)"
      - "sin ese orden, 25,787 Charges habrían sido re-parenteados silenciosamente a la POS Purchase equivocada — el failure shape más grave que este archivo puede tener"

  - title: "AC3 · sin pérdida de rows — Charges emitted y distinct external IDs permanecen en 115,010 PRE=POST"
    tags:
      - ac-3
      - no-row-loss
      - conservation
    given:
      - "el profile safesql de LICM cargado en el runner"
      - "el commit base (PRE-fix) y el HEAD del PR (POST-fix) disponibles"
    when:
      - "se ejecuta charge_without_order.sql PRE-fix y se cuentan filas totales + external IDs distintos"
      - "se re-ejecuta POST-fix y se cuentan los mismos"
    then:
      - "Charges emitted PRE = 115,010"
      - "Charges emitted POST = 115,010 (unchanged)"
      - "distinct external IDs PRE = 115,010"
      - "distinct external IDs POST = 115,010 (grain preservado: uno por Charge)"
      - "el guard MIN(id) sobre REVENUEPAYMENTMETHOD + el rank de MembershipRecurringInstallments previenen fan-out; medición pre-fix + post-fix: 0 duplicados en LICM"

  - title: "AC4 · regresión cross-file — charge_with_order.sql reconcilia a 0 dangling (sin cambios), y el UUID 06e4b843-2506-4ec7-aba5-959e8210cb1e reportado en IM-1192 se confirma como SALESORDER.ID de charge_with_order.sql (load-side failure fuera del scope del PR)"
    tags:
      - ac-4
      - out-of-scope
      - regression-check
      - im-1192-reported-uuid
    given:
      - "el profile safesql de LICM cargado"
      - "charge_with_order.sql en el mismo checkout (no modificado por este PR)"
      - "el UUID reportado en IM-1192 como fallando: 06e4b843-2506-4ec7-aba5-959e8210cb1e"
    when:
      - "se ejecuta charge_with_order.sql sobre LICM PRE y POST del checkout del PR"
      - "se cuentan dangling POS Purchase references en su output"
      - "se busca el UUID reportado en el output tanto de charge_with_order.sql como de sales_order.sql (POS Purchase minter)"
    then:
      - "charge_with_order.sql: 670,828 + 1,080 references, 0 dangling PRE = POST"
      - "el UUID 06e4b843-2506-4ec7-aba5-959e8210cb1e es un SALESORDER.ID (formato + populación consistente con charge_with_order.sql, no charge_without_order.sql)"
      - "670,819 de 670,828 references son same-day (order date = payment date skew negligible)"
      - "el failure reportado en IM-1192 para ese UUID es load-side y requiere org-side confirmation — este PR NO lo resuelve; queda como handoff separado"

  - title: "AC5 · idempotencia + precondición de run unwindowed — dos ejecuciones sobre el mismo dataset producen el mismo output, y windowed runs son HAZARD documentado que requiere pareo con POS runs unwindowed"
    tags:
      - ac-5
      - idempotency
      - windowed-hazard
    given:
      - "el HEAD del PR #167 checked out"
      - "profile safesql de LICM cargado"
      - "los defaults del extractor charge-without-order.extractor.ts: fromDate/toDate NO seteados (unwindowed)"
    when:
      - "se ejecuta charge_without_order.sql UNWINDOWED dos veces sobre el mismo dataset LICM"
      - "se comparan output row count, distinct external IDs, CHECKSUM_AGG"
      - "se ejecuta un WINDOWED run (fromDate=2024-01-01) para reproducir el hazard documentado en el PR body"
    then:
      - "las dos corridas unwindowed producen CHECKSUM_AGG idéntico, mismo row count 115,010, mismo distinct external IDs 115,010"
      - "los External IDs generados son determinísticos entre corridas (no dependen de timestamp/randomness)"
      - "la corrida WINDOWED reproduce el hazard: pledges cuya fecha (gift date) queda fuera de la ventana pero payment date entra emiten Charges con __r: dangling — whole-row rejection en el load"
      - "un windowed Charge run REQUIERE ser pareado con POS Purchase runs UNWINDOWED (precondición pinneada por spec y documentada en PR body)"

