  given:
  - una org donde el case `ic-3-01-install-veevart-packages` v2 ya corrió completo y dejó el set de paquetes Veevart
    instalado
  - 'la propia descripción del case lo declara como contrato: "Idempotent — a package already at version reports
    already-installed, so re-running is a no-op"'
  when:
  - se dispara el MISMO case una segunda vez contra la MISMA org, sin cambiar nada entre corridas
  then:
  - el `PlanRun` cierra `completed` con todos los steps en `done` y **0 failed** — un no-op tiene que seguir siendo
    verde, no "verde porque no hizo nada"
  - 'cada paquete ya instalado reporta `already-installed`/aplicado y **no genera un `PackageInstallRequest` nuevo**:
    la detección ocurre antes de someter el job, no después'
  - 'el estado de la org queda idéntico: mismo conteo de `InstalledSubscriberPackage`, mismos `SubscriberPackageVersion.Id`,
    cero duplicados y cero cambios de versión'
  - 'la duración cae de forma drástica frente a la corrida que sí instaló — es la firma observable del no-op y
    distingue "detectó que ya estaba" de "reinstaló encima"'
  - verificar que el step manual de NPSP vuelve a parquearse y que atestarlo no dispara reinstalación de la cadena
