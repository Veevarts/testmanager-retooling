scenarios:
- title: IM-741 AC1 — The registry is read fresh on every run and every row with a valid 04t installs in a dependency
    order the registry itself cannot express, one install-job per package, each polled to a terminal per-org status
  tags:
  - happy-path
  - im-741
  - im-1169
  - im-735
  - ac-1
  - migration-app
  - t1-installer
  - package-registry
  - install-order
  - pr-306
  - pr-336
  given:
  - el registry de DevOps expuesto por `GET /packages`, que se lee **fresco en cada corrida** y nunca se espeja
    en el repo
  - 'la regla de tiers en `domain/model/tools/package-install-order.ts`, que hoy en `main` declara `TIER_0_FOUNDATIONS
    = [''Auctifera'',''NPSP'']`, `TIER_1_CORE = [''VNFP'']` y un `TIER_2_PLATFORM` agregado por el PR #336'
  when:
  - se ordena el conjunto de paquetes devuelto por el registry y se ejecuta la secuencia de instalación
  then:
  - 'el orden resultante es **tiers primero, resto alfabético**: los roots conocidos en orden de tier, y luego lo
    no-root ordenado por `localeCompare`'
  - 'verificar que la regla se aplica sobre **raíces de dependencia**, no sobre una lista de paquetes: un paquete
    nuevo del registry debe ordenarse solo, sin tocar código'
  - '**la trampa de collation es el corazón del AC**: `localeCompare` case-insensitive pone todo `Veevart …` antes
    de `VNFP`, dejando VNFP después de los cinco que dependen de él. Confirmar que la regla lo corrige y que existe
    un test que falla si se quita el tier'
  - '**segunda trampa, misma causa**: `VeevartDataModel` no lleva espacio, así que la collation lo pone **después**
    de `Veevart Ticketing`, que depende de él. Verificar que `normalizeName` + `TIER_2_PLATFORM` lo resuelven'
  - se emite **un `POST /install-jobs` por paquete**, y cada uno se poletea hasta un estado terminal **antes** de
    lanzar el siguiente — no en paralelo
  - los estados per-org que se mapean son los reales del servicio (`SUCCESS`/`ERROR`/`PENDING`/`IN_PROGRESS`/`ALREADY_INSTALLED`),
    **no** los nombres de job que el ticket original asumía (`SUCCEEDED`/`FAILED`/`QUEUED`/`RUNNING`); debe existir
    cobertura de un estado desconocido
- title: IM-741 AC2 — A registry row whose 04t is unusable is skipped with a warning instead of failing the run,
    including the literal "null" string sentinel
  tags:
  - edge-case
  - im-741
  - im-1169
  - im-735
  - ac-2
  - migration-app
  - t1-installer
  - registry-partition
  - negative
  - pr-306
  given:
  - '`partitionRegistryPackages` en `domain/model/tools/registry-package.ts`, que separa las filas en `installable`
    y `skipped` según `isPackageVersionId(row.packageVersionId)`'
  - la fila de NPSP en el registry, que **no trae `04t` y serializa como el string literal `"null"`**, no como un
    `null` de JSON
  when:
  - se particiona el conjunto de filas del registry antes de instalar
  then:
  - la fila sin `04t` usable cae en `skipped` con una razón legible que nombra la versión publicada y el valor recibido
    — **no** revienta la corrida
  - 'el centinela string `"null"` se trata como no-instalable: verificar que el predicado no lo acepta por ser un
    string no vacío, que es exactamente el modo de falla que este AC previene'
  - probar también `null` real, cadena vacía y un `04t` con forma inválida — el AC nombra el centinela, pero la
    guarda debe sostener las cuatro formas
  - 'la corrida **sigue** con el resto de paquetes: un skip no es un fallo, y el reporte final debe distinguir `skipped`
    de `failed`'
  - confirmar en la evidencia de la corrida real que NPSP salió `skipped` y aun así el `PlanRun` cerró `COMPLETED`
- title: 'IM-741 AC3 SUPERSEDED — NPSP is no longer installed automatically by T3: the published plan has nine required
    steps of which three are not packages, so NPSP ships as a manual MetaDeploy step'
  tags:
  - missing-doc
  - im-741
  - im-1169
  - im-735
  - ac-3
  - ac-drift
  - migration-app
  - npsp
  - metadeploy
  - t3-metadata
  - pr-330
  given:
  - el AC3 del ticket, que exige que T3 resuelva la cadena desde MetaDeploy e instale **los seis paquetes** vía
    `InstalledPackage` en orden publicado, verificando cada uno por read-back
  - 'el PR #330, que cambió ese comportamiento tras un fallo real en corrida: `npsp: FieldSet(Account.BDE_Entry_FS)
    In field: RecordTypeId - no CustomField named Account.RecordTypeId found`'
  when:
  - se compara el AC3 escrito contra el comportamiento realmente entregado en `stable`
  then:
  - '**el AC3 está desactualizado y hay que reescribirlo.** NPSP no son seis paquetes: el plan publicado tiene **nueve**
    pasos, todos `is_required`, y **tres no son paquetes** (Account Record Types, Opportunity Record Types, NPSP
    Config for Mobile App)'
  - los pasos 6 y 7 corren **entre** las dependencias y `npsp`, porque los field sets de `npsp` referencian `Account.RecordTypeId`,
    que Salesforce solo expone una vez que Account tiene record types — y un managed package no puede crear record
    types sobre un objeto estándar
  - 'el comportamiento entregado es: **NPSP se instala manualmente vía MetaDeploy** como paso del case `ic-3-01`,
    y T1 lo reporta `skipped`. Validar ESE comportamiento, no el del AC'
  - verificar que el spec seed `ic-3-01-install-veevart-packages.json` refleja los tres pasos reales (NPSP manual
    → instalar paquetes Veevart → verificar namespaces) y que el paso manual está declarado como handoff, no como
    automático
  - '`NpspInstall-SM` (un paquete por invocación, PR #328) quedó **construido pero sin rutear** porque NPSP es manual:
    confirmar que está desplegado e inerte, y que no se dispara por accidente'
  - 'dejar registrado como **deuda de documentación del ticket**, no como defecto de código: el código hace lo correcto;
    el AC es el que quedó viejo'
- title: IM-741 AC4 — The idempotency key is attempt-independent, so a Step Functions retry of the same step replays
    the existing job instead of installing twice
  tags:
  - regression
  - im-741
  - im-1169
  - im-735
  - ac-4
  - migration-app
  - t1-installer
  - idempotency
  - step-functions
  - pr-306
  given:
  - 'la restricción explícita del ticket: hay `idempotencyKey` en cada submit y **no debe contener el intento**'
  - '`PackageInstall-SM`, que mueve la espera a un estado `Wait` de Step Functions: `ResolvePlan → [ SubmitInstall
    → Wait → CheckInstall → pending? ↻ ] por paquete → BuildResult → Evaluate`'
  when:
  - se reintenta el mismo step attempt y T1 vuelve a submitear el mismo paquete
  then:
  - el `idempotencyKey` del body es **idéntico entre intentos** — verificar que ni el número de intento ni un timestamp
    ni un uuid aleatorio entran en su derivación
  - 'el servicio **replaya el job existente** en vez de crear uno nuevo: no hay doble instalación'
  - 'probar el caso por reversión: si se inyecta el intento en la llave, debe fallar un test — si pasa igual, el
    invariante no está lockeado'
  - 'confirmar que la propiedad es la que hace que un retry de SFN **avance** en vez de reempezar: los paquetes
    ya completados responden `ALREADY_INSTALLED` rápido, así que la corrida progresa entre reintentos'
  - verificar que el `Wait` de Step Functions es lo que remueve el techo de 15 min de Lambda, y que cada estado
    es una invocación corta — una instalación de dos horas no puede costar dos horas de Lambda
- title: IM-741 AC5 — A job that ends ERROR with retryable true is requeued exactly once through the retry endpoint
    before the package is declared failed
  tags:
  - edge-case
  - im-741
  - im-1169
  - im-735
  - ac-5
  - migration-app
  - t1-installer
  - retry
  - negative
  - pr-306
  given:
  - un paquete cuyo job termina en `ERROR` con `retryable: true`
  when:
  - T1 poletea ese job y evalúa el resultado
  then:
  - T1 reencola **exactamente una vez** vía `POST /install-jobs/{jobId}/retry` antes de declarar el fallo
  - 'verificar que es **una** y no un bucle: un segundo `ERROR` retryable debe declarar el fallo, no reintentar
    de nuevo'
  - 'un `ERROR` con `retryable: false` (o sin el campo) **no** se reintenta — se declara fallo de una'
  - 'el reintento no debe romper la idempotencia del escenario 4: la llave sigue siendo la misma'
- title: IM-741 AC6 — When a package fails the sequence stops, every later package reports "not attempted", and
    the reported errorMessage is the real root cause rather than a wrapper
  tags:
  - negative
  - im-741
  - im-1169
  - im-735
  - ac-6
  - migration-app
  - t1-installer
  - stop-on-failure
  - error-reporting
  - pr-306
  given:
  - una secuencia de paquetes en orden de dependencias donde uno de los intermedios falla
  when:
  - T1 procesa la secuencia y construye el resultado
  then:
  - 'la secuencia **se detiene**: no se intenta instalar lo que venía después de un paquete fallido, porque justamente
    dependían de él'
  - los paquetes posteriores se reportan **`not attempted`**, un estado distinguible de `failed` y de `skipped`
    — tres estados con significados distintos que no deben colapsarse
  - 'el `errorMessage` que sale es **la causa raíz real** del servicio, no un mensaje envuelto o genérico: es lo
    único que permite diagnosticar sin entrar a los logs'
  - verificar contra los fallos reales que documenta el dev (el `FieldSet ... RecordTypeId` de NPSP, el `EmailTemplateFolder`
    de VNFP) que el mensaje que llega arriba es accionable
- title: IM-741 AC7 — A re-run against an already-installed org is a no-op that still succeeds, submitting zero
