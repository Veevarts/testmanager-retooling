key: TC-141
title: IM-741 — T1 Package Installer — the registry is read fresh on every run, packages install in a dependency
  order the registry itself cannot express, rows without a usable 04t are skipped instead of failing, retries replay
  instead of double-installing, and a failure stops the sequence with the real root cause
description: |-
  Cobertura QA de IM-741 (**W2-2 · Package Installer — install every Veevart package
  (registry + 04t) & the NPSP chain**), bajo el epic **IM-735 Implementation Cases
  Automation**. QA Sub-task asociada: **IM-1169**. Prioridad de la historia: **Highest**.

  Sigue el patrón de epic ya establecido en `test-cases/IM-735/` (TC-45..50, TC-65): un test
  case por bloque funcional real del epic. Este cubre el bloque **T1 Package Installer**.

  ## Qué pide la historia

  Que una org target reciba NPSP más **todos** los paquetes que publica el registry de DevOps,
  en orden de dependencias, con el contrato documentado en `docs/contracts/t1-installer.md` y
  verificado contra un sandbox.

  Dos mecanismos, porque los paquetes son de dos clases distintas:

  | Conjunto | Mecanismo | Herramienta |
  | --- | --- | --- |
  | Todo lo que publica el registry (2GP + 1GP con `04t`) | `GET /packages` → `POST /install-jobs` → poll | **T1** |
  | La cadena NPSP (sin un `04t` único) | `InstalledPackage` (namespace + versión) | **T3** `installPackages` |

  Dos invariantes de diseño que el ticket subraya:

  - **La lista de paquetes nunca se espeja en el repo.** `GET /packages` se lee fresco en cada
    corrida, así que un paquete nuevo se toma sin editar catálogo ni desplegar.
  - **El orden es nuestro.** El servicio no orquesta dependencias y las filas del registry no
    traen `dependsOn`. `GET /packages` ordena con `localeCompare`, cuya collation
    case-insensitive pone todo `Veevart …` **antes** de `VNFP` — dejando VNFP al final, después
    de los cinco paquetes que dependen de él. El orden devuelto **no es instalable tal cual**.

  ## ⚠️ El alcance real es MUCHO más grande que los 4 PRs que nombra el ticket

  El ticket y sus comentarios mencionan **#306, #310, #312 y #314**. El escaneo del repo
  encuentra **17 PRs mergeados** que referencian IM-741:

  | PR | Qué cambió |
  | --- | --- |
  | #306 | implementación base (+6789/−1015, 49 archivos) |
  | #307 | habilita T1 en dev y sienta el installer en el orden 301 |
  | #310 · #312 · #314 | flag de CI, T3 `installPackages` no object-scoped, habilitar prod |
  | **#321** | restaura la cadena de prerequisitos en el master template + reparación de drift de catálogo |
  | **#322** | envía `activateRSS` + `securityType` en `InstalledPackage` |
  | **#328** | instala la cadena NPSP **un paquete por invocación** |
  | **#330** | **NPSP pasa a ser un paso MANUAL** |
  | **#332** | folders + enhanced sharing deben preceder al installer |
  | **#334** | un handoff parqueado debe frenar el avance de su propio case |
  | **#336** | pinea los dos paquetes que el registry de DevOps no publica |
  | #329 · #331 · #333 · #335 · #338 | promociones main → stable |

  **Consecuencia para QA:** el comportamiento entregado hoy en `stable` **no es** el de #306.
  Cualquier lectura del ticket que se quede en los 4 PRs nombrados valida la cosa equivocada.

  ## ⚠️ AC3 quedó SUPERADO por el propio desarrollo

  El AC3 dice, textualmente, que T3 *"resuelve la cadena desde MetaDeploy e instala los seis
  paquetes vía `InstalledPackage` en el orden publicado, verificando cada uno por read-back"*.

  **Eso ya no es lo que se entrega.** El PR #330 lo cambió tras un fallo real en corrida:

  ```
  npsp: FieldSet(Account.BDE_Entry_FS) In field: RecordTypeId
        - no CustomField named Account.RecordTypeId found
  ```

  NPSP **no son seis paquetes**: el plan publicado por Salesforce.org tiene **nueve** pasos,
  todos `is_required`, y **tres no son paquetes** (Account Record Types, Opportunity Record
  Types, NPSP Config for Mobile App). Los pasos 6 y 7 corren **entre** las dependencias y
  `npsp`, porque los field sets de `npsp` referencian `Account.RecordTypeId`, que Salesforce
  solo expone una vez que Account tiene record types — y un managed package no puede crear
  record types sobre un objeto estándar.

  Resultado: **NPSP es hoy un paso manual vía MetaDeploy**, y T1 lo reporta `skipped`. El
  escenario 3 de este TC valida el comportamiento **entregado**, y deja registrado que el AC
  del ticket está desactualizado y debería reescribirse.

  ## Estado de la entrega

  El dev reporta (comentario del 2026-08-04) la **primera corrida end-to-end exitosa**: run
  `381d1432-686c-40d0-ab63-621967935843`, org `00DWI00000GLw9R2AT`, ~33 min,
  `PlanRun: COMPLETED`, 10 paquetes.

  **CORRECCIÓN 2026-08-05 — esa org NO es de producción.** `00DWI00000GLw9R2AT` es una
  Developer Edition **scratch** (`momentum-flow-9884-dev-ed.scratch.my.salesforce.com`) cuyo
  `Organization.Name` es literalmente **"IM-735 Package Install Test"**. La corrida del dev fue
  en una org de pruebas desechable, no en un entorno productivo. QA **sí puede repetirla**, y de
  hecho la repitió: ver TR-154.

  ## Riesgos abiertos

  - **El alcance del ticket está desactualizado en dos frentes**: los PRs nombrados (4 de 17) y
    el AC3. Ambos hay que corregirlos en el ticket, no solo en la review.
  - ~~**La única corrida verde es en PRODUCCIÓN.**~~ **RESUELTO 2026-08-05**: la org de la
    corrida verde es una scratch de pruebas, no producción. QA reprodujo el end-to-end completo
    (TR-154) y además ejecutó el AC7. El riesgo real que queda es otro: **el installer no tiene
    hoy una org de trainings donde correr** — los intentos contra `illinois-trainings` fallaron
    por autorización del AuthBroker, así que la única cobertura viva vive en scratch orgs
    efímeras (esta expira el 2026-08-29).
  - **El orden de dependencias se aprendió a punta de fallos.** Cada hecho de ordenamiento
    (VNFP al final, `VeevartDataModel` sin espacio cayendo después de `Veevart Ticketing`,
    Ticketing dependiendo de Data Model) salió de una corrida rota, no de un dato del registry.
    Mientras DevOps no publique `installOrder`/`dependsOn`, la regla de tiers es una lista
    curada a mano que se degrada en silencio con cada paquete nuevo.
  - **Dos paquetes van pineados** (Veevart Data Model 0.3.0.4 y Veevart Reporting 1.16) porque
    el registry no publica filas `prd`. Los pins son un parche que se desactiva solo cuando
    DevOps publique — hay que verificar que la precedencia registry-sobre-pin funciona.
  - **MetaDeploy paso 9** (*NPSP Config for Salesforce Mobile App*) está marcado required en el
    plan de Salesforce.org y no lo cubre ni la automatización ni, según el dev, ningún case del
    catálogo.
  - **Sin soporte de install-key** en el servicio: los paquetes protegidos por contraseña no
    pueden pasar por ahí.
  - **Frescura del registry** depende de que pipelines externos llamen `POST /deployments`;
    nada en `sf-package-pusher` produce esas escrituras.
  - Las cifras del dev (185 suites / 1993 tests) son suyas: **se re-derivan, no se toman por
    buenas.**

  ## AC7 — estuvo excluido por error, y quedó verificado en vivo el 2026-08-05

  Durante TR-152 y TR-153 este AC (*re-corrida contra una org ya instalada = no-op exitoso*) se
  dejó **fuera del test case** con el argumento de que verificarlo exigía escribir en una org de
  producción.

  **Ese argumento era falso.** La org `00DWI00000GLw9R2AT` nunca fue productiva: es la scratch
  Developer Edition "IM-735 Package Install Test", creada precisamente para probar este ticket.
  La exclusión se apoyó en una identificación equivocada de la org, no en una regla de política.

  El escenario 7 lo cubre y TR-154 lo ejecuta: dos corridas consecutivas del mismo case contra la
  misma org, la primera instalando y la segunda probando el no-op, con cotejo de
  `PackageInstallRequest` e `InstalledSubscriberPackage` en ambas.

  **Queda como entrega del dev/PM, no de QA.** Y como riesgo de proceso a escalar: el propio ticket
  pedía verificación *against a sandbox*, y la única validación end-to-end existente vive en
  producción — así que hoy no hay forma de re-verificar esta historia, ni este cambio ni el
  próximo que toque el installer, sin tocar una org productiva.
