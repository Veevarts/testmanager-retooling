preconditions:
- Clone de `MigrationAppBackend` en el commit de `main`/`stable` que incluye los 17 PRs de IM-741, para correr la
  suite y las pruebas de reversión sobre la regla de orden
- 'Node instalado; la suite del repo corre sin HTTP en vivo (el propio ticket lo exige: "No live HTTP in any test"),
  así que los escenarios de contrato son auto-ejecutables'
- '✅ CORREGIDO 2026-08-05: la org `00DWI00000GLw9R2AT` **no es de producción**. Es una Developer Edition scratch
  (`momentum-flow-9884-dev-ed.scratch`) llamada literalmente "IM-735 Package Install Test", creada para probar
  este ticket. La suposición de que era productiva fue lo que sacó al AC7 del alcance; con la org identificada
  correctamente, el AC7 **sí es ejecutable por QA** y se ejecuta contra ella'
- Acceso de escritura a esa scratch org vía la Migration App para disparar el case dos veces seguidas (instalación
  + re-corrida), y acceso de lectura por API de Salesforce para el cotejo PRE/POST de `InstalledSubscriberPackage`
  y `PackageInstallRequest`
- Nunca disparar una corrida de instalación contra una org de cliente ni de producción desde QA — la scratch de
  pruebas no es ninguna de las dos
