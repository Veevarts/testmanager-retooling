key: TR-168
title: >-
  TR-168 · IM-868 · TC-150 · Marketing Metrics POS Purchase CC Income Cap · Prod validation April 2026 —
  2/3 PASS · 1 FAIL (London silently skipped by orchestrator, Step Functions SUCCEEDED with partial publish)
status: completed
environment:
  name: >-
    Production: VeevartTooling (AWS account 287043460717, us-east-1) · CSM/VeevartHub prod (Salesforce org
    00D60000000KdOJEA0, alias csm-prod). Validation triggered via POST /analytics/manual-runs from user's
    terminal (x-api-key handled by user, never exposed to Claude session). Step Functions state machine
    MonthlyKpiExtractionStateMachine-oskh2CpJjqY4 (Standard). Deploy of PR #34 to prod confirmed by dev
    before manual-run.
  url: https://github.com/Veevarts/VeevartAnalytics/pull/34
  buildVersion: >-
    Classification: post-deploy prod validation of a fix that caps credit_card_transactions_income by
    parent POS Purchase Total. PR #34 merged to main + deployed. Fix code correctness verified on 2/3 orgs
    (Textile + DAC show exact expected deltas). Third org (London) NOT processed by orchestrator despite
    being in the payload → orchestrator/dispatcher defect surfaces as SUCCEEDED with partial publish.
  notes: |
    ## Solution understood

    PR #34 caps `credit_card_transactions_income` by `Auctifera__POS_Purchase__r.Auctifera__Total__c`
    when accumulated Charge amounts for a single POS Purchase exceed the purchase total.
    `credit_card_transactions_count` and `total_payment_value_adyen` remain uncapped (raw counts and
    raw processor volume).

    The fix ships with the extractor query change (add Auctifera__Total__c to Charge SELECT) and the
    metric-fact-computation service change (per-period cap tracking). Dev unit tests: 149 PASS.
    Dev pre-deploy prod validation (in docs/im-868-qa-validation.md) used
    `scripts/run-extraction-with-cli-token.ts` — reads real prod Charges + processes locally with the
    branch code + compares against prod baseline. That method produced the 3 expected deltas:
    Textile −97.30, DAC −126.00, London −1819.31.

    ## Inferred technical tests

    - **QA-side baseline capture (pre-run)** → auto-executed. Baseline snapshot from CSM/VeevartHub prod
      for the 3 orgs / April 2026 taken 2026-08-20. All 15 fields (5 per org × 3) matched byte-a-byte
      with the dev baseline in docs/im-868-qa-validation.md. Re-check 2026-08-21 pre-run also confirmed
      no drift.
    - **Manual-run POST** → user-executed with their x-api-key (never in Claude session). HTTP 202 +
      executionArn captured.
    - **Step Functions monitoring** → status verified as SUCCEEDED in AWS Console by user (screenshot).
      Duration 00:01:13.464.
    - **Post-run snapshot + delta computation** → auto-executed. Textile PASS, DAC PASS, London FAIL
      (LastModifiedDate stuck at 2026-08-12, value stuck at baseline).
    - **Dev pre-deploy reproduction (`scripts/run-extraction-with-cli-token.ts`)** → NOT executed
      locally by QA: requires `sf` auth to the 3 subscriber source orgs (Textile, DAC, London) which
      QA does not have (they are customer production Salesforce orgs). Confirmed via `sf org list`.

    ## Root cause hypothesis (for the dev to investigate)

    Textile refreshed at 51s into execution, DAC at 73s (just before end). London never refreshed
    despite being in the payload's subscriberOrgIds array. Possible causes:
    1. Dispatcher / Map iterator lost the 3rd item silently.
    2. London's extraction branch caught an error → SUCCEEDED with silent skip.
    3. Extractor returned 0 rows for London April 2026 (unlikely: dev doc has real overages).
    4. Publish gate found no diff and skipped upsert (but SF LastModified would still update if any
       upsert happens — no upsert means the publish step was skipped or never called for London).

    Recommend: fetch ExecutionHistory for arn:aws:states:us-east-1:287043460717:execution:MonthlyKpi\
    ExtractionStateMachine-oskh2CpJjqY4:manual-20260821T155847-05f2c198 and check Map iterations,
    extract lambdas per subscriberOrgId, and publish outputs.

