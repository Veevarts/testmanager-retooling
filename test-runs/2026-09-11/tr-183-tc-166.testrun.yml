  - testCaseId: "dc8c485c-cd2c-4e53-a07f-a042223965f3"
    testCaseKey: TC-166
    scenarioTitle: "AC5 · A picklist that precedes a Next or Submit action keeps visible spacing from it"
    scenarioIndex: 4
    status: passed
    executedAt: "2026-09-11T22:16:00Z"
    stepResults: []
    actual: |
      Montaje: subject "QA TC-166 Picklist Spacing" y survey 21 con una pregunta de tipo picklist
      de 6 opciones colocada inmediatamente antes de la accion.

        Layout       Separacion  Se solapan  padding-top de la fila  Accion visible
        pagination     108 px        NO             24 px                 SI
        single          24 px        NO             24 px                 SI

      En el layout paginado el bloque de pregunta ademas tiene min-height 200 px, lo que empuja
      la accion hacia abajo y explica los 108 px. La separacion no es incidental: hay un
      padding-top de 24 px declarado en la fila de acciones.

      SOBRE LA SUB-CONDICION "el desplegable abierto no tapa la accion": NO APLICA a este control
      tal como esta implementado. En la encuesta que ve el respondente el picklist no se renderiza
      como un select nativo sino como una lista de botones de opcion (se verificaron los botones
      Rentals / Ticketing / Shop / Accounting / Fundraising / Otra en el DOM, y no existe ningun
      select en esa pantalla). Al no haber desplegable que se abra sobre el contenido, no hay
      superposicion posible sobre la accion. Se deja constancia para no sobreafirmar: lo
      verificado es la separacion visible y la ausencia de solapamiento.

      pre-fix -> post-fix -> objetivo cumplido?: el picklist podia quedar pegado a la accion
      contigua -> hay 24 px declarados de separacion y 108 px efectivos en el layout paginado,
      sin solapamiento y con la accion siempre visible -> SI.
    notes: >-
      **PASS**, con la sub-condicion del desplegable marcada explicitamente como no aplicable
      porque el control no es un desplegable.
