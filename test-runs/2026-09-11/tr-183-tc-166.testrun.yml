notes: |
  ## Solution understood

  La historia agrupa cinco refinamientos de la administracion entregados con el PR 71: filtro
  General y orden Newest por defecto en la lista, Start Date inicializado con la fecha local,
  restauracion de preguntas al volver Template a None, validacion bloqueante en un modal visible
  desde cualquier scroll, y separacion visual entre un picklist y la accion contigua.

  ## Inferred technical tests

  Los dos primeros ACs son observables de forma objetiva en la UI desplegada. El del Start Date
  ademas exige mirar el codigo, porque observarlo un dia en que UTC y la hora local coinciden no
  distingue una implementacion de la otra. Los tres restantes exigen recorrido interactivo del
  formulario, que se ejecuto en una segunda pasada en vez de inferirlos del JSX.

  ## Observacion O3 — defecto PREEXISTENTE, no introducido por este PR

  SINTOMA. En modo CREACION, vaciar el campo "Main question" CIERRA el formulario completo y
  devuelve al listado, descartando todo lo que el usuario hubiera cargado.

  AISLADO PASO A PASO:
    abrir el formulario de creacion                      formulario vivo
    desplazarse al final y volver arriba                 formulario vivo
    ESCRIBIR texto en la pregunta principal              formulario vivo
    VACIAR la pregunta principal (Cmd+A + Delete real)   formulario DESMONTADO
  Sin errores de consola: no es un crash, es la condicion de render.

  CAUSA RAIZ en client/src/pages/SurveysPage.tsx:
    linea 765: const isCreating = !editing && form.questionText.length > 0;
    linea 872: {!editing && form.questionText && (
  La visibilidad del formulario en creacion se DERIVA de que la pregunta principal no este
  vacia. En modo EDICION no ocurre, y se verifico en vivo que alli el formulario sobrevive.

  ES PREEXISTENTE. La condicion es identica antes y despues del PR 71:
    4458647c   (post) linea 765 -> const isCreating = !editing && form.questionText.length > 0;
    4458647c~1 (pre)  linea 637 -> const isCreating = !editing && form.questionText.length > 0;
  Por eso NO se levanta como defecto de esta entrega ni se rechaza IM-1258.

  POR QUE IGUAL IMPORTA. El modal y sus mensajes SI son nuevos de este PR:
    "Complete required information" / "Resolve the following" : 0 pre -> 2 post
    "Enter the main survey question."                         : 0 pre -> 1 post
  O sea el dev agrego en este PR la validacion "Enter the main survey question." con su destino
  de navegacion, pero en modo CREACION esa validacion NUNCA puede dispararse: el formulario se
  desmonta antes de que el usuario alcance a pulsar guardar con el campo vacio. Es funcionalidad
  nueva parcialmente inalcanzable por una condicion vieja. Recomendacion: desacoplar la
  visibilidad del formulario del contenido de un campo mediante un estado explicito de creacion.
