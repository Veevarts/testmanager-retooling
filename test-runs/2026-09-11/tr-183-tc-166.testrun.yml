  - testCaseId: "dc8c485c-cd2c-4e53-a07f-a042223965f3"
    testCaseKey: TC-166
    scenarioTitle: >-
      AC2 · A new survey form initializes Start Date with the current local date and lets the
      admin change it
    scenarioIndex: 1
    status: passed
    executedAt: "2026-09-11T22:25:00Z"
    stepResults: []
    actual: |
      Al abrir el formulario de creacion, el campo survey-start-date se inicializa en 2026-09-11,
      que es la fecha de hoy. El campo es editable antes de guardar.

      Esa observacion por si sola NO alcanza para declarar que la fecha es LOCAL: al momento de
      medir eran las 16:27 hora local y las 21:27 UTC, o sea el mismo dia en ambas zonas. Para no
      dar un PASS de conveniencia se verifico el helper del codigo, que compensa el offset ANTES
      de serializar, y se ejecuto contra cuatro instantes incluidos los dos criticos:

        mediodia local                  local=2026-09-11  helper=2026-09-11  OK
        19:00 local (00:00Z del dia 12) local=2026-09-11  helper=2026-09-11  OK   (UTC ingenuo daria el 12)
        23:30 local (04:30Z del dia 12) local=2026-09-11  helper=2026-09-11  OK   (UTC ingenuo daria el 12)
        00:30 local del dia 12          local=2026-09-12  helper=2026-09-12  OK

      El AC pide "the current local date" y eso entrega, incluso en las cinco horas finales del
      dia local en que UTC ya avanzo. Contrasta favorablemente con el filtro de fechas del
      dashboard, que si evalua en UTC (observacion O1 de TR-177).

      pre-fix -> post-fix -> objetivo cumplido?: el Start Date no se inicializaba -> trae la
      fecha local de hoy y sigue siendo editable -> SI.
    notes: >-
      **PASS**. Verificado en el borde horario a proposito, porque una observacion puntual no
      distingue fecha local de fecha UTC.
