  - testCaseId: "dc8c485c-cd2c-4e53-a07f-a042223965f3"
    testCaseKey: TC-166
    scenarioTitle: >-
      AC4 · Blocking validation, including audience overlap, is presented in a modal visible from
      any scroll position
    scenarioIndex: 3
    status: passed
    executedAt: "2026-09-11T22:14:00Z"
    stepResults: []
    actual: |
      Ejercitado en modo EDICION. El motivo de esa eleccion es la observacion O3 de este run: en
      modo CREACION el formulario se desmonta al vaciar la pregunta principal, lo que impide
      llegar a pulsar guardar. Ese comportamiento es preexistente al PR.

      MONTAJE, tal como lo describe el AC. Se vacio la pregunta principal y se desplazo la pagina
      hasta dejar el campo en conflicto FUERA de vista:

        posicion del campo "Main question"   top = -468 px  (por encima del viewport)
        boton Save visible                   top =   75 px
        distancia entre ambos                501 px
        scroll de la pagina                  1000 px

      Al pulsar guardar, el usuario NO podia ver el campo que causa el problema.

      CASO CAMPOS FALTANTES. Aparece un modal con:
        titulo  : "Complete required information"
        bajada  : "Resolve the following before saving this survey."
        error 1 : "Enter the main survey question."          + accion "Go to field"
        error 2 : "Choose the Start Date for this survey."   + accion "Go to field"
        salida  : "Continue editing"
        position: fixed, top 0 / bottom 806, cubre el viewport completo
        visible sin que el usuario se desplace: SI, con el scroll en 1000 px

      Los errores son ACCIONABLES, no solo descriptivos. Se probo "Go to field" del primero:
        scroll antes 1000 -> despues 150; campo visible en top 382; campo CON EL FOCO
        (document.activeElement == el input); modal cerrado.

      CASO CONFLICTO DE AUDIENCIAS. Se abrio la encuesta 19 (subject Rentals, inactiva) y se
      marco Active; el producto Rentals ya lo ocupa la encuesta 3, activa. Con el scroll otra vez
      en 1000 px, al guardar aparece el mismo modal con:

        "Only one survey can be active for this product. Deactivate survey 3 or save this survey
         as inactive."                                       + accion "Go to field"

      El mensaje IDENTIFICA la encuesta que causa el conflicto por su numero, que es exactamente
      lo que pide el AC. Nada se escribio: survey 19 sigue inactiva y survey 3 sigue activa.

      pre-fix -> post-fix -> objetivo cumplido?: el modal de validacion no existia antes de este
      PR (0 ocurrencias de "Resolve the following" en el commit previo, 2 en el post) -> ahora los
      errores bloqueantes, incluido el conflicto de audiencias, se presentan en un modal fixed
      visible desde cualquier scroll y con navegacion al campo -> SI.
    notes: >-
      **PASS**. Cubre las dos mitades del AC: campos faltantes y conflicto de audiencias, ambos
      con el campo en conflicto fuera de vista al momento de guardar.
