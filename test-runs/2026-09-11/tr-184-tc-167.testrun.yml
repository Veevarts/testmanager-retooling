  - testCaseId: "a1ec92f8-f266-440c-8f88-8a28e1deac0d"
    testCaseKey: TC-167
    scenarioTitle: >-
      AC3 · Content taller than the configured maximum stays within the viewport and scrolls
      without overlap
    scenarioIndex: 2
    status: passed
    executedAt: "2026-09-11T22:15:00Z"
    stepResults: []
    actual: |
      En la primera corrida este AC quedo not-run: ninguna encuesta del entorno era lo bastante
      larga para alcanzar el tope. Los dos previews observados median 292 y 268 px contra un tope
      de 629, ni se acercaban, y declarar PASS mirando encuestas cortas habria sido afirmar justo
      lo que el AC no permitia observar. Para cerrarlo se FABRICO el caso.

      Montaje: subject "QA TC-167 Long Preview" y survey 20 con 13 bloques de contenido (score,
      seguimiento, recomendacion de empresa y 10 preguntas de texto con enunciados largos).

      EL TOPE. La funcion de clamp define
        maxHeight = max(240, min(640, floor(viewportHeight * 0.85) - 56))
      Con viewport de 806: floor(806*0.85)=685, 685-56=629, min(640,629)=629.

        alto del contenido      2620 px   <-- muy por encima del tope
        alto del contenedor      629 px   <-- exactamente el tope calculado
        tope esperado            629 px
        coincide                 SI

      PERMANECE EN EL VIEWPORT. top 109, bottom 738, viewport 806: no desborda.

      EL SCROLL INTERNO RECORRE TODO. area visible 614 px, contenido 2620 px, recorrido maximo
      2006 px. Se fijo en 400 -> 400 OK; se fijo al maximo -> 2006 OK. No es decorativo.

      SIN SOLAPAMIENTO. Con el contenido desplazado hasta el final se midieron las cajas de los
      7 controles y titulos visibles y se comparo cada uno con el anterior: 0 pares solapados
      (tolerancia de 2 px).

      COBERTURA DEL DEV sobre la misma logica: el PR trae tests de las funciones puras de clamp,
      incluido el techo con otro viewport, clampSurveyPreviewFrameHeight(1200, 800) -> 624. La
      observacion viva y el test unitario se refuerzan.

      pre-fix -> post-fix -> objetivo cumplido?: el preview podia desbordar o recortar contenido
      sin permitir recorrerlo -> con 2620 px de contenido se detiene en su tope de 629, sigue
      dentro del viewport, habilita scroll que recorre los 2006 px restantes y nada se solapa
      -> SI.
    notes: >-
      **PASS**. Cerrado fabricando la encuesta larga que el entorno no tenia. La survey 20 queda
      inactiva y conservada como evidencia.
