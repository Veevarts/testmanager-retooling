title: >-
  TR-184 · IM-1257 · TC-167 · Survey preview alignment — 2/3 PASS · 1 not-run. El preview muestra
  la encuesta seleccionada mediante identificador explicito y ajusta su alto al contenido; el
  comportamiento con contenido que excede el maximo no se pudo ejercitar.
status: completed
environment:
  name: >-
    Survey Tool dev (https://surveytool.dev.veevart.ai) corriendo `develop` con el merge commit
    del PR 71 (4458647c) desplegado. Viewport de escritorio 1512x806.
  buildVersion: >-
    Mixed. El PR 71 implementa nueve tickets a la vez; esta corrida valida unicamente la porcion
    de IM-1257.
testPlanId: null
startedAt: "2026-09-11T22:35:00Z"
completedAt: "2026-09-11T22:45:00Z"
executedBy: codex

notes: |
  ## Solution understood

  El preview debe mostrar la encuesta seleccionada y no una cargada antes, dimensionar el
  contenedor segun el contenido renderizado con topes de ancho y alto, usar el mismo fondo y
  radio de borde que el panel real, y conservar el scroll cuando el contenido excede el maximo.
  El PR ataca la causa de fondo anclando el preview a un identificador explicito de encuesta e
  intercambiando las dimensiones medidas con el host del iframe.

  ## Contexto de regresion

  Es el cuarto ticket que toca el preview: IM-1187 lo corrigio tres veces (rutas numericas,
  render despues del login y tamano del modal). Que ahora el preview viaje con surveyId explicito
  en la URL ataca precisamente lo que causaba aquellas regresiones, que era depender del estado
  previamente cargado.

results:
  - testCaseId: "a1ec92f8-f266-440c-8f88-8a28e1deac0d"
    testCaseKey: TC-167
    scenarioTitle: >-
      AC1 · Previewing two different surveys consecutively shows the second one, not cached
      content from the first
    scenarioIndex: 0
    status: passed
    executedAt: "2026-09-11T22:38:00Z"
    stepResults: []
    actual: |
      Se abrio el preview de una encuesta, se cerro, y se abrio el de OTRA distinta, que es
      exactamente la secuencia del AC:

        preview 1 -> /survey/rentals?preview=1&surveyId=19
        preview 2 -> /survey/qa-tc-162-targeting?preview=1&surveyId=18

      El segundo preview carga la segunda encuesta y no arrastra el contenido de la primera. Ambas
      URLs llevan el identificador de encuesta EXPLICITO como parametro, asi que el contenido no
      depende del orden de carga ni de un estado previo: es justo la mitigacion que el design spec
      pedia ("use explicit survey identifiers, reset stale preview state").

      pre-fix -> post-fix -> objetivo cumplido?: el preview podia mostrar contenido cacheado de la
      encuesta anterior -> cada preview se ancla a su propio surveyId -> SI.
    notes: >-
      **PASS**. Cierra el AC que motivo el ticket y ataca la causa de fondo de las regresiones
      previas del area.
    attachments:
