      content from the first
    scenarioIndex: 0
    status: passed
    executedAt: "2026-09-11T22:38:00Z"
    stepResults: []
    actual: |
      Se abrio el preview de una encuesta, se cerro, y se abrio el de OTRA distinta, que es
      exactamente la secuencia del AC:

        preview 1 -> /survey/rentals?preview=1&surveyId=19
        preview 2 -> /survey/qa-tc-162-targeting?preview=1&surveyId=18

      El segundo preview carga la segunda encuesta y no arrastra el contenido de la primera. Ambas
      URLs llevan el identificador de encuesta EXPLICITO como parametro, asi que el contenido no
      depende del orden de carga ni de un estado previo: es justo la mitigacion que el design spec
      pedia ("use explicit survey identifiers, reset stale preview state").

      pre-fix -> post-fix -> objetivo cumplido?: el preview podia mostrar contenido cacheado de la
      encuesta anterior -> cada preview se ancla a su propio surveyId -> SI.
    notes: >-
      **PASS**. Cierra el AC que motivo el ticket y ataca la causa de fondo de las regresiones
      previas del area.
