key: TR-184
title: >-
  TR-184 · IM-1257 · TC-167 · Survey preview alignment — 3/3 PASS. El preview muestra la encuesta
  seleccionada mediante identificador explicito, ajusta su alto al contenido, y con una encuesta
  de 2620 px se detiene en su tope de 629, sigue dentro del viewport y habilita scroll interno
  sin solapamientos.
status: completed
environment:
  name: >-
    Survey Tool dev (https://surveytool.dev.veevart.ai) corriendo `develop` con el merge commit
    del PR 71 (4458647c) desplegado. Viewport de escritorio 1512x806.
  buildVersion: >-
    Mixed. El PR 71 implementa nueve tickets a la vez; esta corrida valida unicamente la porcion
    de IM-1257.
testPlanId: null
startedAt: "2026-09-11T22:35:00Z"
completedAt: "2026-09-11T22:45:00Z"
executedBy: codex

notes: |
  ## Solution understood

  El preview debe mostrar la encuesta seleccionada y no una cargada antes, dimensionar el
  contenedor segun el contenido renderizado con topes de ancho y alto, usar el mismo fondo y
  radio de borde que el panel real, y conservar el scroll cuando el contenido excede el maximo.
  El PR ataca la causa de fondo anclando el preview a un identificador explicito de encuesta e
  intercambiando las dimensiones medidas con el host del iframe.

  ## Contexto de regresion

  Es el cuarto ticket que toca el preview: IM-1187 lo corrigio tres veces (rutas numericas,
  render despues del login y tamano del modal). Que ahora el preview viaje con surveyId explicito
  en la URL ataca precisamente lo que causaba aquellas regresiones, que era depender del estado
  previamente cargado.

