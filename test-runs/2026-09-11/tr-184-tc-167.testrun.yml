  - testCaseId: "a1ec92f8-f266-440c-8f88-8a28e1deac0d"
    testCaseKey: TC-167
    scenarioTitle: >-
      AC2 · A survey shorter than the maximum contracts to its content without excessive blank
      space
    scenarioIndex: 1
    status: passed
    executedAt: "2026-09-11T22:40:00Z"
    stepResults: []
    actual: |
      Las dos encuestas previsualizadas rindieron contenedores de ALTO DISTINTO con el mismo ancho:

        encuesta de Rentals   -> 448 x 292 px
        encuesta de targeting -> 448 x 268 px

      Que el alto difiera entre una encuesta y otra demuestra que el contenedor sigue al contenido
      medido en vez de ser una caja de tamano fijo, que es lo que el AC pide. La diferencia de 24
      px corresponde al contenido real de cada formulario.

      El ancho se mantiene constante en 448 px, consistente con el tope practico de ancho que
      menciona el design spec.

      pre-fix -> post-fix -> objetivo cumplido?: el preview mostraba espacio en blanco sobrante
      -> el alto se ajusta al contenido de cada encuesta -> SI.
    notes: >-
      **PASS**. La comparacion del alto entre dos encuestas distintas es la evidencia: una caja
      fija habria dado el mismo valor en ambas.
