  - testCaseId: "1900256d-2f28-4a6a-9279-725b631bb742"
    testCaseKey: TC-164
    scenarioTitle: >-
      Edge case · Concurrent activations keep the invariant, and pre-existing configurations that
      violate the new rules are identified
    scenarioIndex: 4
    status: passed
    executedAt: "2026-09-11T22:05:00Z"
    stepResults: []
    actual: |
      CONFIGURACIONES PREEXISTENTES. El entorno tenia los surveys 3 (activo) y 12 (inactivo)
      sobre el mismo subject Rentals antes de esta corrida, y ninguna encuesta activa viola las
      nuevas reglas: las cuatro General NPS estaban inactivas y cada producto tenia a lo sumo una
      activa. La nueva validacion no bloquea ninguna configuracion existente de este entorno.

      CONCURRENCIA REAL — ejecutada en una segunda pasada. En la primera corrida este escenario
      quedo not-run porque las activaciones se habian hecho en secuencia, y una prueba secuencial
      pasaria igual aunque el mecanismo transaccional no funcionara.

      El guard de activacion tiene dos capas: un chequeo de lectura
      (findActiveProductSurveyConflict) y la reserva TRANSACCIONAL de la clave exclusiva. El
      chequeo de lectura por si solo es racy. Para probar la invariante hay que provocar que
      ambas peticiones pasen el chequeo y colisionen en la transaccion, asi que primero se libero
      la clave product:rentals (desactivando el survey 3) y recien despues se dispararon las dos
      activaciones a la vez sobre los surveys 12 y 19, que comparten esa clave.

      Resultado de la ronda inicial:

        PUT survey 12 {active:true}  ->  200
        PUT survey 19 {active:true}  ->  409
        mensaje: "Survey activation changed while this request was processed."

      El mensaje es la evidencia decisiva. Si dijera "Deactivate survey N" estariamos observando
      el chequeo de lectura; al decir "activation changed while this request was processed" queda
      claro que la colision la resolvio LA TRANSACCION, que es la invariante que el AC pide.

      Se repitio 6 veces alternando el orden de disparo:

        Ronda  Orden        Ganador  Rechazado  Activas despues  Invariante
          1    12 luego 19     12        19         [12]            OK
          2    19 luego 12     19        12         [19]            OK
          3    12 luego 19     12        19         [12]            OK
          4    12 luego 19     12        19         [12]            OK
          5    19 luego 12     19        12         [19]            OK
          6    12 luego 19     12        19         [12]            OK

      En las 6 rondas: exactamente un 200 y exactamente un 409, siempre con el mensaje
      transaccional, y nunca dos encuestas activas sobre la misma clave. El ganador ALTERNO entre
      las dos encuestas, lo que descarta que el resultado sea un artefacto del orden de disparo:
      si lo fuera, habria ganado siempre la misma.

      Estado restaurado al terminar: survey 3 activa, surveys 12 y 19 inactivas, identico al
      estado inicial registrado.

      pre-fix -> post-fix -> objetivo cumplido?: dos activaciones simultaneas sobre la misma
      clave exclusiva podrian dejar dos encuestas activas si el guard viviera solo en el chequeo
      de lectura -> la reserva transaccional serializa las peticiones, una gana y la otra recibe
      409 -> SI.
    notes: >-
      **PASS**. Cerrado en una segunda pasada con concurrencia real. El mensaje del 409 identifica
      la capa transaccional y no el chequeo previo, que es lo que hace concluyente la prueba.
    attachments:
      - name: live-activation-matrix.txt
        path: attachments/tr-181-tc-164/scenario-activation/live-activation-matrix.txt
        mimeType: text/plain
      - name: live-concurrency-matrix.txt
        path: attachments/tr-181-tc-164/scenario-activation/live-concurrency-matrix.txt
        mimeType: text/plain

