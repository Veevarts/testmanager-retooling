notes: |
  ## Solution understood

  Varias encuestas pueden referenciar el mismo subject de producto, pero solo una puede estar
  activa por alcance de producto; el servidor rechaza la segunda activacion con 409 nombrando la
  encuesta en conflicto. Para las General NPS la regla es de audiencias: pueden coexistir activas
  mientras sus conjuntos de organizaciones sean disjuntos, y se rechaza la activacion cuando se
  solapan o cuando una apunta a todas las organizaciones. La propiedad de activacion se persiste
  con transacciones de DynamoDB y registros de ownership, mas reintentos optimistas, para que dos
  activaciones concurrentes no puedan dejar dos encuestas compitiendo.

  ## Inferred technical tests

  Las reglas viven en el servidor, asi que se ejercitan por la admin API autenticada: crear y
  activar encuestas en conflicto y verificar el codigo de estado, el mensaje y —lo mas
  importante— que la encuesta ya activa quede intacta. Las audiencias disjuntas contra solapadas
  exigen dos organizaciones registradas al mismo tiempo, que es la unica dependencia de acceso
  fuerte de todo el bloque.

