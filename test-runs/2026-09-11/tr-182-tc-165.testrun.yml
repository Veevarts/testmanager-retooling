  - testCaseId: "b57532c8-4876-4e96-9cbe-5db15117d5b2"
    testCaseKey: TC-165
    scenarioTitle: >-
      AC2 · The exported file is Excel-compatible UTF-8 so accented characters display correctly
    scenarioIndex: 2
    status: failed
    executedAt: "2026-09-11T21:58:00Z"
    stepResults: []
    actual: |
      Los primeros bytes del archivo descargado son:

          72 65 73 70 6f 6e      ->  "respon..."  (el inicio de la cabecera)

      NO son EF BB BF: el archivo NO lleva marca de orden de bytes UTF-8. Tampoco su primera
      linea es una declaracion de delimitador; arranca directamente en
      "response_id,survey_id,...".

      Los DATOS si son UTF-8 valido: el texto en espanol con acentos y signos de apertura se
      decodifica correctamente con TextDecoder de UTF-8, y la respuesta HTTP declara
      Content-Type: text/csv; charset=utf-8.

      El problema es que esa cabecera solo aplica al transporte. Cuando el archivo queda en
      disco y el usuario lo abre con doble clic, Excel no la lee: sin BOM, Excel en Windows
      interpreta el archivo con la codificacion local en vez de UTF-8 y los acentos se ven
      corruptos. Es justo el escenario que el AC2 quiere evitar.

      Ningun camino agrega el BOM: el dashboard descarga con window.open del endpoint sin
      postprocesar (ResponsesDashboard.tsx:358, DashboardPage.tsx:160) y el export del Summary
      construye su Blob uniendo las filas con saltos de linea, tampoco antepone BOM
      (SummaryDashboard.tsx:149).

      pre-fix -> post-fix -> objetivo cumplido?: el design spec pide emitir "an Excel-compatible
      UTF-8 file and delimiter declaration where required" -> el archivo se emite sin BOM y sin
      declaracion de delimitador -> NO.
    notes: >-
      **FAIL.** Incumple el design spec y la segunda mitad del AC2. Limite declarado con
      honestidad: se verifico objetivamente que el BOM no esta y que el spec lo exige, pero NO se
      abrio el archivo en Excel sobre Windows para fotografiar los acentos corruptos, porque no
      habia Excel disponible en el entorno de ejecucion. El veredicto se sostiene en el
      incumplimiento verificable del spec, no en una suposicion sobre el render. Arreglo
      sugerido: anteponer el BOM al cuerpo del CSV en el endpoint de export y evaluar si el
      locale de los usuarios exige ademas la linea de declaracion de separador.
    defects:
