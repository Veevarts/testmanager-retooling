  TR-182 · IM-1256 · TC-165 · Excel-compatible response export — 4/5 PASS · 1 FAIL. Metadatos,
  escape de delimitadores y neutralizacion de formulas correctos; el archivo NO se emite como
  UTF-8 compatible con Excel (sin BOM ni declaracion de delimitador), que es lo que pide el AC2.
