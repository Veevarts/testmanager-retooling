  - testCaseId: "b57532c8-4876-4e96-9cbe-5db15117d5b2"
    testCaseKey: TC-165
    scenarioTitle: "Security · Values that a spreadsheet could execute as a formula are neutralized"
    scenarioIndex: 3
    status: passed
    executedAt: "2026-09-11T22:00:00Z"
    stepResults: []
    actual: |
      Dos valores ejecutables enviados desde el endpoint publico de respuestas:

        nombre     "=cmd|calc!A1"     -> exportado con un apostrofe delante
        comentario "=HYPERLINK(...)"  -> exportado con un apostrofe delante

      El apostrofe hace que la hoja de calculo trate el valor como texto en vez de evaluarlo. El
      patron del guard tolera espacios y caracteres de control por delante del signo, asi que no
      se evade anteponiendo un espacio. El valor original sigue siendo legible.

      EFECTO COLATERAL MEDIDO, documentado y no levantado como defecto: el prefijo se aplica a
      cualquier string que empiece por esos caracteres, incluidos valores legitimos:

        "- Muy buena atencion, volveria" -> se exporta con apostrofe delante
        "@soporte respondio rapido"      -> se exporta con apostrofe delante
        "+1 a la propuesta"              -> se exporta con apostrofe delante

      Empezar un comentario con guion es comun en texto libre. En Excel el apostrofe inicial es
      el marcador de texto literal y no se muestra en la celda, asi que el analista ve el texto
      limpio; pero en un parser generico (pandas, un script de ingesta, un BI) el apostrofe SI
      queda dentro del dato. Es el trade-off estandar y recomendado de esta mitigacion.

      pre-fix -> post-fix -> objetivo cumplido?: un valor de usuario podia ejecutarse al abrir el
      CSV -> se neutraliza como texto -> SI.
    notes: "**PASS**. Mitigacion efectiva contra inyeccion de formulas en hojas de calculo."
    attachments:
