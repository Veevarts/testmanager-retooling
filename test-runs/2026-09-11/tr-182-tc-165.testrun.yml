key: TR-182
title: >-
  TR-182 · IM-1256 · TC-165 · Excel-compatible response export — 5/5 PASS. El unico FAIL de la
  primera corrida quedo cerrado sobre el PR 75: el endpoint ya emite el BOM UTF-8 y separa filas
  con CRLF, y el BOM no rompio el parseo conforme a RFC 4180, que era el riesgo real del arreglo.
status: completed
environment:
  name: >-
    Survey Tool dev (https://surveytool.dev.veevart.ai). La primera pasada corrio sobre `develop`
    con el PR 71 (4458647c); la segunda, que cerro el FAIL, sobre `develop` con el PR 75
    (1ad3b4ce). El CSV se analizo a nivel de bytes y con un parser conforme a RFC 4180 en ambas,
    para que el veredicto no dependa de un visor concreto ni cambie de criterio entre pasadas.
  buildVersion: >-
    Mixed. El PR 71 implementa nueve tickets a la vez y esta corrida valida unicamente la porcion
    de IM-1256; el PR 75 trae el arreglo del defecto que esta misma corrida habia reportado.
startedAt: "2026-09-11T21:50:00Z"
completedAt: "2026-09-11T22:05:00Z"
executedBy: codex

notes: |
  ## Solution understood

  El PR centraliza la serializacion del CSV en `escapeCsvCell()` (server/src/lib/csv.ts): envuelve
  en comillas y duplica las comillas internas cuando el valor contiene comilla, coma, CR o LF, y
  antepone un apostrofe a cualquier string que empiece por igual, mas, guion o arroba, para que
  una hoja de calculo no lo ejecute como formula. El export de respuestas suma las columnas de
  organizacion e identidad del respondente, hasta 30 en total, y responde con
  `Content-Type: text/csv; charset=utf-8`.

  ## Inferred technical tests

  El AC habla de un archivo, asi que el test correcto es descargar el CSV real y analizarlo por
  dos vias independientes: los BYTES del archivo para la codificacion, y un parser conforme a
  RFC 4180 para la estructura. Verificar con Excel seria deseable pero no es suficiente ni
  necesario para calificar: lo que el spec exige es que el archivo se EMITA de cierta forma, y
  eso se comprueba objetivamente.

  ## Defecto encontrado

  El archivo no lleva BOM UTF-8 ni declaracion de delimitador, pese a que el design spec pide
  "Emit an Excel-compatible UTF-8 file and delimiter declaration where required". Ver el
  escenario 2 y el detalle en live-csv-matrix.txt.

