  - testCaseId: "b57532c8-4876-4e96-9cbe-5db15117d5b2"
    testCaseKey: TC-165
    scenarioTitle: >-
      AC2 · The exported file is Excel-compatible UTF-8 so accented characters display correctly
    scenarioIndex: 2
    status: passed
    stepResults: []
    actual: |
      CERRADO. Re-verificado sobre el PR 75 (1ad3b4ce) desplegado en dev, con el mismo endpoint,
      el mismo metodo de observacion y el mismo criterio con que se levanto el FAIL, para que la
      comparacion sea simetrica.

      ANTES (2026-09-11)                        AHORA (2026-09-15)
      ----------------------------------------  ----------------------------------------------
      primeros bytes: 72 65 73 70 6f 6e         primeros 12 bytes: ef bb bf 72 65 73 70 6f 6e
                      -> "respon..."                               73 65 5f
      BOM UTF-8: AUSENTE                        BOM UTF-8: PRESENTE
      filas unidas con LF                       filas unidas con CRLF (RFC 4180)

      El arreglo centraliza la serializacion en dos helpers gemelos (server/src/lib/csv.ts y
      client/src/lib/csv.ts) y los TRES caminos de descarga que QA habia enumerado como omisos
      quedan cubiertos: responses.ts:454 alimenta los dos que usaban window.open, y
      SummaryDashboard.tsx:150 el que arma el Blob en el navegador.

      EL BOM NO ROMPIO EL PARSEO ESTANDAR, que era el riesgo real de este arreglo. El ticket pide
      abrirlo "in Excel AND a standards-compliant parser", asi que el archivo descargado se
      parseo con una maquina de estados RFC 4180:

          comillas sin cerrar                 NO
          columnas en la cabecera             30
          registros de datos                  11
          distribucion de anchos              {30: 11}  <- los 11 con 30 campos exactos
          decodifica UTF-8 sin reemplazos     SI
          U+FEFF suelto dentro del cuerpo     NO

      Y eso con contenido que habria roto columnas si el escapado fallara: 9 celdas con coma,
      5 con comilla doble, 2 con salto de linea, 9 con caracteres no ASCII y 9 con formula
      neutralizada.

      Detalle que a simple vista confunde: un conteo ingenuo da 13 CRLF y 2 LF sueltos, o sea 14
      "lineas", pero el parser devuelve 12 registros. No es contradiccion: 2 de esos CRLF viven
      DENTRO de celdas entrecomilladas (respuestas multilinea del usuario) y el parser
      correctamente no los toma como separadores. 14 - 2 = 12 = 1 cabecera + 11 respuestas.

      El dev agrego cobertura sobre el defecto exacto en los dos lados (csv.test.ts en server y
      client, ambos con "prepends the UTF-8 BOM and uses Excel-compatible row endings"). Suites
      sobre 1ad3b4ce: servidor 117/117, cliente 62/62.

      pre-fix -> post-fix -> objetivo cumplido?: el archivo se emitia sin BOM y Excel en Windows
      lo interpretaba con la codificacion local corrompiendo los acentos -> ahora emite EF BB BF,
      separa filas con CRLF, los tres caminos pasan por los helpers centralizados y un parser
      conforme obtiene 11 registros de 30 campos exactos -> SI.
    notes: >-
      **PASS.** Sobre la segunda ausencia que señalaba el reporte original, la declaracion de
      delimitador: NO se agrego, y eso es correcto. El design spec dice "delimiter declaration
      WHERE REQUIRED", y aqui no corresponde — una linea "sep=," no es parte de RFC 4180, asi que
      un parser conforme la leeria como un registro de un solo campo y se perderia la uniformidad
      de anchos verificada arriba; cumpliria una mitad del AC2 rompiendo la otra. Con el BOM
      presente Excel ya detecta UTF-8, que era el problema de los acentos. Queda la observacion
      O5, que no es defecto: el BOM resuelve la CODIFICACION, no la SEPARACION DE COLUMNAS, asi
      que en un Windows con separador de listas ";" (es-ES, de-DE, fr-FR, pt-BR) el doble clic
      dejaria todo en una columna. No se marca como defecto porque el publico son museos de habla
      inglesa y en_US usa coma; si aparecieran usuarios con locale europeo, la salida correcta no
      es "sep=" sino una descarga .xlsx. LIMITE DECLARADO, igual que en la corrida anterior: no
      se abrio el archivo en Excel sobre Windows; el veredicto se sostiene en los bytes y el
      parseo, que es el mismo criterio con que se levanto el FAIL.
    attachments:
      - name: live-csv-matrix.txt
        path: attachments/tr-182-tc-165/scenario-csv/live-csv-matrix.txt
        mimeType: text/plain

  - testCaseId: "b57532c8-4876-4e96-9cbe-5db15117d5b2"
    testCaseKey: TC-165
    scenarioTitle: "Security · Values that a spreadsheet could execute as a formula are neutralized"
    scenarioIndex: 3
    status: passed
    executedAt: "2026-09-11T22:00:00Z"
    stepResults: []
    actual: |
      Dos valores ejecutables enviados desde el endpoint publico de respuestas:

        nombre     "=cmd|calc!A1"     -> exportado con un apostrofe delante
        comentario "=HYPERLINK(...)"  -> exportado con un apostrofe delante

      El apostrofe hace que la hoja de calculo trate el valor como texto en vez de evaluarlo. El
      patron del guard tolera espacios y caracteres de control por delante del signo, asi que no
      se evade anteponiendo un espacio. El valor original sigue siendo legible.

      EFECTO COLATERAL MEDIDO, documentado y no levantado como defecto: el prefijo se aplica a
      cualquier string que empiece por esos caracteres, incluidos valores legitimos:

        "- Muy buena atencion, volveria" -> se exporta con apostrofe delante
        "@soporte respondio rapido"      -> se exporta con apostrofe delante
        "+1 a la propuesta"              -> se exporta con apostrofe delante

      Empezar un comentario con guion es comun en texto libre. En Excel el apostrofe inicial es
      el marcador de texto literal y no se muestra en la celda, asi que el analista ve el texto
      limpio; pero en un parser generico (pandas, un script de ingesta, un BI) el apostrofe SI
      queda dentro del dato. Es el trade-off estandar y recomendado de esta mitigacion.

      pre-fix -> post-fix -> objetivo cumplido?: un valor de usuario podia ejecutarse al abrir el
      CSV -> se neutraliza como texto -> SI.
    notes: "**PASS**. Mitigacion efectiva contra inyeccion de formulas en hojas de calculo."
    attachments:
      - name: live-csv-matrix.txt
        path: attachments/tr-182-tc-165/scenario-csv/live-csv-matrix.txt
        mimeType: text/plain

