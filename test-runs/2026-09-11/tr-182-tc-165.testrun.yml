      El endpoint sigue aceptando el parametro de gobernanza que decide que respuestas se
      incluyen, y el nombre del archivo descargado lo refleja.

      pre-fix -> post-fix -> objetivo cumplido?: el export funcionaba para las respuestas
      existentes -> sigue funcionando y suma columnas sin romper las historicas -> SI.
    notes: "**PASS**. Sin regresion sobre las respuestas previas al cambio."
    attachments:
      - name: live-csv-matrix.txt
        path: attachments/tr-182-tc-165/scenario-csv/live-csv-matrix.txt
        mimeType: text/plain

