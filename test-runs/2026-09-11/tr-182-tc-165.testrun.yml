    scenarioIndex: 4
    status: passed
    executedAt: "2026-09-11T22:02:00Z"
    stepResults: []
    actual: |
      Las respuestas anteriores al PR, que no tienen nombre de respondente ni los metadatos
      nuevos, se exportan sin error: sus celdas nuevas salen vacias y la fila conserva las 30
      celdas, igual que las respuestas nuevas. El numero de columnas es consistente entre unas y
