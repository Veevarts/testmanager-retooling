notes: |
  ## Solution understood

  La audiencia de una encuesta es un enum de tres valores; el nuevo es `specific_users`.
  Cuando esta activo, `matchesSpecificUserAudience(audienceDetails, ctx)` compara el
  `respondentId` y el `respondentEmail` del contexto contra una lista de tokens parseada de
  `audienceDetails` (separada por saltos de linea, comas o punto y coma). Todo se normaliza
  con `trim().toLowerCase()` en ambos lados. Si la lista esta vacia el matcher devuelve false,
  o sea la ausencia de configuracion CIERRA la audiencia. El gate de audiencia es el primero
  que se evalua y devuelve el motivo `audience`. Del lado admin,
  `validateSpecificUserAudience()` impide guardar la encuesta con la lista vacia.

  ## Inferred technical tests

  Es control de acceso, asi que el test correcto es ejercitar el endpoint publico real
  (POST /api/features/:id/surveys) con contextos de respondent controlados y comprobar las dos
  direcciones: que el incluido reciba la encuesta y que el excluido no la reciba nunca. El caso
  de la lista vacia debe probarse explicitamente porque es donde un matcher mal escrito abriria
  la audiencia en vez de cerrarla.

