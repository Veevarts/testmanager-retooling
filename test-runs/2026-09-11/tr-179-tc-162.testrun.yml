      pre-fix -> post-fix -> objetivo cumplido?: las audiencias existentes decidian de cierta
      forma -> siguen decidiendo igual -> SI.
    notes: "**PASS**. Ninguna encuesta sin targeting especifico cambio a quien se muestra."
