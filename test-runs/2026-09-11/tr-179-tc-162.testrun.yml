  - testCaseId: "f98f1575-1313-4556-baf8-de1823e2039f"
    testCaseKey: TC-162
    scenarioTitle: "AC3 · A matching respondent sees the survey when every other rule passes"
    scenarioIndex: 2
    status: passed
    executedAt: "2026-09-11T21:08:00Z"
    stepResults: []
    actual: |
      Contra el endpoint publico real, con el survey 18 y los demas gates abiertos:

        email exacto de la lista     (incluido@veevart.com)   -> MOSTRAR
        email en MAYUSCULAS          (INCLUIDO@VEEVART.COM)   -> MOSTRAR
        Salesforce ID exacto, 18 ch  (005Em00000joJdDIAU)     -> MOSTRAR

      El match funciona por las dos vias, email y respondent ID, contra la misma lista, tal como
      implementa matchesSpecificUserAudience. La insensibilidad a mayusculas en el email es
      correcta.

      Evidencia adicional no prevista en el escenario: el ingest de respuestas TAMBIEN valida la
      audiencia. Al enviar una respuesta al survey 18 con un respondent que no esta en la lista,
      el servidor responde 400 "Respondent ID or email does not match the survey audience". El
      targeting no solo filtra la entrega: tambien impide registrar respuestas de quien no
      pertenece a la audiencia. Es una segunda barrera coherente con el objetivo del ticket.

      pre-fix -> post-fix -> objetivo cumplido?: no existia el targeting -> el respondent
      incluido recibe la encuesta por email o por ID -> SI.
    notes: >-
      **PASS**. Cierra una de las dos brechas que el PR declaraba sin validar desplegado
