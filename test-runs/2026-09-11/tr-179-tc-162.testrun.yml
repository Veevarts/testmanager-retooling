      Lista vacia: crear una encuesta con audience specific_users y audienceDetails vacio
      devuelve HTTP 400 con el mensaje del servidor:
        "Specific user audience requires at least one respondent ID or email."

      Validacion de formato: la pregunta abierta del bundle era si la validacion de email
