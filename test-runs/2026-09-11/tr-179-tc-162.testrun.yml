      la aplica. Al enviar una respuesta con el email "qa'or'1'='1@veevart.com" el servidor
      responde 400 con fieldErrors.respondentEmail = ["Invalid email"].

      O sea la barrera de formato esta tambien del lado servidor, no solo en la UI. Queda
      cerrado el riesgo que el bundle habia marcado.

      pre-fix -> post-fix -> objetivo cumplido?: no habia validacion de esta audiencia -> lista
      vacia y emails mal formados rechazados por el servidor -> SI.
    notes: >-
