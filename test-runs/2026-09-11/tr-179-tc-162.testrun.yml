  - testCaseId: "f98f1575-1313-4556-baf8-de1823e2039f"
    testCaseKey: TC-162
    scenarioTitle: >-
      AC4 · A non-matching respondent never sees the survey, and an empty list closes the
      audience instead of opening it
    scenarioIndex: 3
    status: passed
    executedAt: "2026-09-11T21:10:00Z"
    stepResults: []
    actual: |
      Direccion negativa, contra el mismo endpoint publico:

        email que NO esta en la lista (ajeno@veevart.com)   -> no-mostrar
        ID que NO esta en la lista    (005Em00000ZZZZZZZZ)  -> no-mostrar
        sin respondentId ni email                           -> no-mostrar
        ambos vacios                                        -> no-mostrar

      FAIL-CLOSED CONFIRMADO: sin identificadores la encuesta no se entrega, y una lista vacia
      ni siquiera se puede guardar (HTTP 400). La ausencia de configuracion cierra la audiencia
      en vez de abrirla, que es la decision correcta para un control de acceso.

      RIESGO DE NORMALIZACION, medido y acotado. La comparacion de IDs es case-insensitive
      porque ambos lados pasan por toLowerCase(). Para Salesforce eso es semanticamente
      incorrecto, pero la explotabilidad depende del formato:
        - IDs de 15 caracteres: dos IDs distintos que difieran solo en mayusculas COLISIONAN
          (005Em00000joJdD y 005em00000JOjDD -> ambos "005em00000jojdd"). Ahi el falso positivo
          seria real.
        - IDs de 18 caracteres: los 3 finales son un checksum que codifica el case de los 15
          primeros, asi que dos IDs reales distintos NO colisionan
          (005Em00000joJdDIAU -> "...iau" contra 005em00000JOjDDAA1 -> "...aa1").
      Todos los respondentId observados en este entorno son de 18 caracteres. VEREDICTO: no es
      un defecto de control de acceso con los datos actuales; queda como recomendacion de
      robustez.

      pre-fix -> post-fix -> objetivo cumplido?: no existia el targeting -> el respondent
      excluido no recibe la encuesta y la ausencia de lista cierra la audiencia -> SI.
    notes: >-
      **PASS con observacion**. Recomendacion al dev: comparar los respondentId de forma
      case-sensitive y reservar el toLowerCase() para los emails. El widget recibe el
      respondentId de quien lo invoca y no impone el formato de 18 caracteres, asi que una
      implementacion que pase IDs de 15 materializaria el riesgo.
    attachments:
      - name: live-targeting-matrix.txt
        path: attachments/tr-179-tc-162/scenario-targeting/live-targeting-matrix.txt
        mimeType: text/plain

