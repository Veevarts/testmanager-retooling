notes: |
  ## Solution understood

  El PR entrega la pagina y la logica de diagnosticos de entrega, pero deshabilitadas: la ruta
  solo se registra si `APP_FEATURE_FLAGS.diagnostics` es verdadero, y ese flag es una constante
  compilada en `client/src/config/featureFlags.ts` con valor falso, cubierta por su propio test.

  ## Alcance honesto de esta corrida

  Como el flag no es una variable de entorno, no se puede encender en el entorno desplegado sin
  un rebuild. La funcionalidad de diagnostico NO es verificable en esta entrega y declararla
  probada seria falsear la evidencia. Lo que si corresponde validar es que el apagado sea
  efectivo y que no quede superficie de API sin proteger, que es el riesgo real de entregar
  codigo apagado.

