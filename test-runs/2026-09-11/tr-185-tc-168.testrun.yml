  - testCaseId: "68888956-4d8e-4556-a759-6c0f4e8733cc"
    testCaseKey: TC-168
    scenarioTitle: "Security · The client-side flag does not leave server API surface exposed"
    scenarioIndex: 1
    status: passed
    executedAt: "2026-09-11T22:51:00Z"
    stepResults: []
    actual: |
      El riesgo al entregar codigo apagado desde el cliente es que el servidor si exponga la
      superficie. Se verifico y NO ocurre:

        - No hay ningun router de diagnosticos montado en server/src/index.ts. Los routers
          montados son auth, features, surveys y responses publicos, mas los admin de features,
          surveys, responses, analytics, integraciones de Salesforce, organizations y settings.
        - La pagina de diagnosticos no consume ningun endpoint propio: reutiliza la lista de
          features, la de organizaciones y la consulta de encuestas por feature, todas bajo
          /api/admin y por tanto detras del middleware de autenticacion de administrador.

      O sea el gating del cliente basta en este caso porque el PR no agrego superficie de API
      nueva que proteger.

      pre-fix -> post-fix -> objetivo cumplido?: podria haber quedado un endpoint accesible pese a
      la UI apagada -> no existe endpoint nuevo y los reutilizados ya exigen autenticacion -> SI.
    notes: >-
      **PASS**. Se deja constancia para el futuro: si mas adelante se agrega un endpoint propio de
      diagnosticos, el flag del cliente NO bastara y habra que protegerlo tambien en el servidor.
    attachments:
      - name: live-gating-matrix.txt
        path: attachments/tr-185-tc-168/scenario-gating/live-gating-matrix.txt
        mimeType: text/plain

  - testCaseId: "68888956-4d8e-4556-a759-6c0f4e8733cc"
    testCaseKey: TC-168
    scenarioTitle: "Diagnostics functionality itself, reachable only with the flag enabled"
    scenarioIndex: 2
    status: passed
    executedAt: "2026-09-15T19:40:00Z"
    stepResults: []
    actual: |
      EJECUTADO en una segunda pasada, sobre el PR 75 (1ad3b4ce) ya desplegado en dev.

      CORRECCION A LA PRIMERA PASADA. El 2026-09-11 este run afirmo que "la pagina de
      diagnosticos no consume ningun endpoint propio". Era impreciso: SI existe un endpoint
      dedicado, GET /api/admin/features/:featureId/respondent-state/:respondentId, que es el que
      DiagnosticsPage invoca. Las conclusiones de seguridad NO cambian y se re-verificaron: el
      endpoint ya existia ANTES del PR 71 (grep -c respondent-state da 2 tanto en 4458647c~1
      como en 4458647c), vive bajo /api/admin detras de requireAdminAuth, y no hay router de
      diagnosticos montado aparte. La afirmacion importante —que el PR 71 no agrego superficie
      de API nueva— se sostiene.

      CONSECUENCIA: como el flag solo gatea la ruta del CLIENTE, la logica de diagnostico si es
      ejercitable con sesion de administrador, sin encender nada.

      CICLO EJECUTADO. Subject "QA TC-161 Gates" (featureId 11), survey 17 con maxShowsPerDay=1,
      respondente nuevo:

        Paso                      eligible  reason                     impressions  todayCount
        respondente sin actividad   true    null                            0           0
        se registra 1 impresion     false   max_shows_per_day_reached       1           1

      El reporte devuelve ademas el bloque global (maxSurveysPerDay 10, surveysShownToday 0->1)
      y por cada encuesta candidata: active, audience, appliesToRequestedFeature,
      allowsClientOrg, los limites configurados y los contadores completos. Es exactamente la
      feature que el README describe: ver la razon exacta por la que una encuesta esta elegible
      o bloqueada.

      EL ARREGLO DE FECHA, VERIFICADO DONDE IMPORTA. El parametro `today` alimenta los contadores
      por dia, asi que el bug reportado no era cosmetico. Mismo respondente, mismo instante
      (2026-09-16T02:30:00Z = 21:30 local en UTC-5), variando solo el criterio de fecha:

        today=2026-09-15 (LOCAL, el actual)  -> eligible false, reason max_shows_per_day_reached
        today=2026-09-16 (UTC, el bug viejo) -> eligible true,  reason null

      Con el bug, la pantalla habria respondido "es elegible, nada la bloquea" cuando el tope
      diario SI estaba bloqueando. La herramienta cuya unica funcion es explicar por que una
      encuesta no se entrega habria dado la respuesta CONTRARIA durante cinco horas de cada dia.

      LIMITE DECLARADO: se verifico la FUNCIONALIDAD a traves de su propia API. El RENDER de la
      pagina sigue sin ejercitarse porque el flag continua apagado y encenderlo exige rebuild.
      No se declara probado el render. Eso NO es una omision del ticket: entregar la pantalla
      apagada es precisamente lo que IM-1253 pide.

      pre-fix -> post-fix -> objetivo cumplido?: la funcionalidad de diagnostico no se habia
      podido ejercitar y su fecha por defecto se calculaba en UTC -> el reporte de elegibilidad
      explica correctamente el bloqueo y la fecha por defecto es local, con el helper unificado
      en lib/dates.ts y cubierto por test propio en el borde horario -> SI.
    notes: >-
      **PASS**. Cerrado sin encender el flag, porque el gating es del cliente y la logica vive
      detras de una API de admin ya existente. Se corrige de paso una imprecision de la primera
      pasada sobre esa API, sin que cambien las conclusiones de seguridad.
