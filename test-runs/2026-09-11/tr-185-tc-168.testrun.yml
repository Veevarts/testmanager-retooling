title: >-
  TR-185 · IM-1253 · TC-168 · Gated delivery diagnostics — 3/3 PASS. El apagado por feature flag
  es efectivo y no deja API expuesta, y la funcionalidad de diagnostico quedo ejercitada a traves
  de su API de admin sin necesidad de encender el flag. El bug latente de fecha en UTC fue
  corregido por el PR 75 y se verifico donde importa: con el criterio viejo el reporte daba la
  respuesta contraria sobre el bloqueo.
