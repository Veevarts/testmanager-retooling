  - testCaseId: "ece5c154-cc4e-4e4b-8cab-2d54f6cef352"
    testCaseKey: TC-163
    scenarioTitle: >-
      Edge case · Email values with SOQL metacharacters are escaped, and the undocumented error
      state is rendered intelligibly
    scenarioIndex: 4
    status: not-run
    stepResults: []
    actual: |
      PARTE VERIFICADA — la entrada maliciosa no alcanza la SOQL. Se intento enviar una respuesta
      con el email "qa'or'1'='1@veevart.com" y con el nombre "Robert'); DROP TABLE--". El
      servidor respondio HTTP 400 con fieldErrors.respondentEmail = ["Invalid email"]: el esquema
      zod rechaza el formato ANTES de persistir nada y mucho antes de cualquier consulta.

      Hay por tanto dos barreras encadenadas: la validacion de formato en el ingest y, si un
      valor con comillas llegara por otra via, `escapeSoqlLiteral()` que escapa backslash y
      comilla simple al armar la consulta. No se observo ninguna via por la que una entrada del
      respondent altere el filtro.

      PARTE NO VERIFICADA — el estado `error`. El tipo en server/src/data/types.ts admite cinco
      valores (matched, not_found, ambiguous, not_checked y error) mientras el AC enumera cuatro:
      `error` no esta documentado. `enrichResponseById()` lo persiste cuando el enrichment falla.
      No fue posible producirlo porque la integracion esta deshabilitada y el codigo retorna
      not_checked antes de intentar la consulta, asi que no se pudo observar como se renderiza en
      el detalle ni en Engagement.

      El escenario se deja not-run porque su segunda mitad, que es la que examina un
      comportamiento no documentado, no se ejecuto.
    notes: >-
      **Pendiente de entorno.** Queda por verificar que el estado `error` se distinga
      visualmente de `not_checked`: si ambos caen en el mismo fallback neutro, un administrador
      no puede diferenciar "todavia no se verifico" de "se intento y fallo", y esa diferencia
      decide si conviene reintentar. Se reporto al dev en el PR como desvio de alcance.
    attachments:
