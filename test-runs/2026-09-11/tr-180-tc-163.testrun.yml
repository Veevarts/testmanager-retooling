  - testCaseId: "ece5c154-cc4e-4e4b-8cab-2d54f6cef352"
    testCaseKey: TC-163
    scenarioTitle: >-
      AC3 · Profile data never reaches public logs and enrichment failures do not break
      submission
    scenarioIndex: 3
    status: passed
    executedAt: "2026-09-11T21:26:00Z"
    stepResults: []
    actual: |
      El envio de la respuesta con perfil completo devolvio HTTP 201 y la respuesta quedo
      persistida, con el enrichment corriendo aparte. En el codigo el enrichment se invoca como
      `void enrichResponseById(inserted.id).catch(...)`, es decir fire-and-forget: la promesa no
      se espera y su rechazo se captura, asi que un fallo no puede propagarse al envio. El
      comportamiento observado es consistente: la respuesta se persiste y se devuelve al
      respondent con independencia del resultado del enrichment.

      Sobre PII en logs: la linea de log del catch emite unicamente el identificador numerico de
      la respuesta ("[respondent-enrichment] response N failed:"), sin nombre, email, telefono ni
      titulo. Se reviso tambien el log hermano de sincronizacion, con el mismo patron.

      Queda una verificacion parcial que se declara con honestidad: el objeto de error que
      acompana esa linea proviene de la capa de Salesforce y podria arrastrar el texto de la
      consulta en su mensaje. No fue posible provocar un fallo real de enrichment porque la
      integracion esta deshabilitada y el codigo retorna antes de intentar la consulta.

      pre-fix -> post-fix -> objetivo cumplido?: no habia enrichment -> el envio nunca falla por
      el enrichment y los logs no emiten perfil -> SI, con la salvedad declarada.
    notes: >-
      **PASS con verificacion parcial declarada.** La inspeccion del contenido del objeto de
      error queda atada al mismo entorno con integracion configurada que pide el escenario 3.
    attachments:
      - name: live-profile-matrix.txt
        path: attachments/tr-180-tc-163/scenario-profile/live-profile-matrix.txt
        mimeType: text/plain

  - testCaseId: "ece5c154-cc4e-4e4b-8cab-2d54f6cef352"
    testCaseKey: TC-163
    scenarioTitle: >-
      Edge case · Email values with SOQL metacharacters are escaped, and the undocumented error
      state is rendered intelligibly
    scenarioIndex: 4
    status: not-run
    stepResults: []
    actual: |
      PARTE VERIFICADA — la entrada maliciosa no alcanza la SOQL. Se intento enviar una respuesta
      con el email "qa'or'1'='1@veevart.com" y con el nombre "Robert'); DROP TABLE--". El
      servidor respondio HTTP 400 con fieldErrors.respondentEmail = ["Invalid email"]: el esquema
      zod rechaza el formato ANTES de persistir nada y mucho antes de cualquier consulta.

      Hay por tanto dos barreras encadenadas: la validacion de formato en el ingest y, si un
      valor con comillas llegara por otra via, `escapeSoqlLiteral()` que escapa backslash y
      comilla simple al armar la consulta. No se observo ninguna via por la que una entrada del
      respondent altere el filtro.

      PARTE NO VERIFICADA — el estado `error`. El tipo en server/src/data/types.ts admite cinco
      valores (matched, not_found, ambiguous, not_checked y error) mientras el AC enumera cuatro:
      `error` no esta documentado. `enrichResponseById()` lo persiste cuando el enrichment falla.
      No fue posible producirlo porque la integracion esta deshabilitada y el codigo retorna
      not_checked antes de intentar la consulta, asi que no se pudo observar como se renderiza en
      el detalle ni en Engagement.

      El escenario se deja not-run porque su segunda mitad, que es la que examina un
      comportamiento no documentado, no se ejecuto.
    notes: >-
      **Pendiente de entorno.** Queda por verificar que el estado `error` se distinga
      visualmente de `not_checked`: si ambos caen en el mismo fallback neutro, un administrador
      no puede diferenciar "todavia no se verifico" de "se intento y fallo", y esa diferencia
      decide si conviene reintentar. Se reporto al dev en el PR como desvio de alcance.
    attachments:
      - name: live-profile-matrix.txt
        path: attachments/tr-180-tc-163/scenario-profile/live-profile-matrix.txt
        mimeType: text/plain

