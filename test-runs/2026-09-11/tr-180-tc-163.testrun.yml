  - testCaseId: "ece5c154-cc4e-4e4b-8cab-2d54f6cef352"
    testCaseKey: TC-163
    scenarioTitle: >-
      AC3 · Contact matching resolves to not_found, matched or ambiguous according to how many
      records the email returns
    scenarioIndex: 2
    status: not-run
    stepResults: []
    actual: |
      NO EJERCITABLE EN ESTE ENTORNO. GET /api/admin/integrations/salesforce/status devuelve
      enabled=false: la integracion con Veevart Sales no esta configurada en dev (faltan
      SFDC_CLIENT_ID, SFDC_USERNAME y SFDC_JWT_PRIVATE_KEY).

      Con esa configuracion ausente, `matchVeevartSalesContactByEmail()` retorna not_checked en
      su primera guarda y NUNCA llega a ejecutar la SOQL contra Contact. Los tres estados que
      pide el AC son por tanto inalcanzables aqui, sin importar cuantos Contacts se creen en la
      organizacion de Salesforce.

      LO QUE SI QUEDO VERIFICADO del AC3: ambas respuestas de prueba quedaron con
      veevartSalesMatchStatus = "not_checked", que es exactamente el estado correcto para una
      integracion no configurada. Ese cuarto camino del AC esta cubierto.

      No se marca PASS porque el corazon del AC son los otros tres estados, y no fueron
      observados.
    notes: >-
      **Pendiente de entorno, no de codigo.** Para cerrarlo hace falta un entorno con la
      integracion de Veevart Sales configurada y, en esa organizacion, tres datos: un Contact con
      email unico (matched), un email que no exista como Contact (not_found) y DOS Contacts que
      compartan el mismo email (ambiguous). Con eso los tres caminos se verifican en una sola
      corrida de seguimiento. No es un defecto del PR.
