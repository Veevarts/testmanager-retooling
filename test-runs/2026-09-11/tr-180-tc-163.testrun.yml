  - testCaseId: "ece5c154-cc4e-4e4b-8cab-2d54f6cef352"
    testCaseKey: TC-163
    scenarioTitle: >-
      Edge case · Email values with SOQL metacharacters are escaped, and the undocumented error
      state is rendered intelligibly
    scenarioIndex: 4
    status: passed
    stepResults: []
    actual: |
      CERRADO EN SUS DOS MITADES.

      MITAD 1 — EL ESCAPE, probado contra el parser real de Salesforce y no contra un mock. Se
      ejecuto cada entrada con y sin `escapeSoqlLiteral`:

      entrada                        sin escape                    con escape
      -----------------------------  ----------------------------  ---------------------------
      qa-tc-163-o'hara@example.com   MALFORMED_QUERY               ejecuta, 1 fila
      back\slash@example.com         MALFORMED_QUERY               ejecuta, 0 filas
      x' OR Email != 'zzz            EJECUTA, devuelve 2 filas      ejecuta, devuelve 0 filas
      x' OR Id != null OR Email = '  EJECUTA, devuelve 2 filas      ejecuta, devuelve 0 filas

      Los dos ultimos son los importantes. Sin escape las inyecciones NO fallan: ejecutan y
      devuelven 2 filas para un email que no existe. Como la logica clasifica por cantidad de
      filas, eso habria producido `ambiguous` en lugar de `not_found` — un valor controlado por
      el respondente alterando el estado de match de su propia respuesta. Con escape las mismas
      entradas devuelven 0 filas y el estado es el correcto. Las dos ramas del replace resultan
      necesarias: la de comilla simple y la de backslash.

      MITAD 2 — EL ESTADO `error`, que no esta documentado en el AC, se produjo de verdad
      emitiendo la consulta con el campo literal contra una org que no lo tiene, es decir el
      escenario real de una org de ventas mal configurada:

          veevartSalesMatchStatus = "error" · enrichedAt fechado · los otros dos en null

      El re-throw del catch NO queda sin manejar: responses.ts:302-304 lo captura y lo registra
      con formatBackgroundFailure. Se verifico expresamente porque un re-throw dentro de un
      fire-and-forget habria sido defecto serio. El log resultante es
      "[respondent-enrichment] response 101 failed (Error)": sin email, sin nombre de campo y
      sin el SOQL.

      Y SOBRE LA DUDA QUE ESTA MISMA CORRIDA HABIA DEJADO ABIERTA — si `error` se distingue de
      `not_checked` en pantalla — la respuesta es SI. Ejercitada contactMatchLabel
      (ResponsesDashboard.tsx:78-84): matched "Matched", not_found "Not found", ambiguous
      "Multiple contacts found", error "Lookup failed", not_checked "Not checked". Cinco
      etiquetas distintas. null y undefined colapsan en "Not checked", que es lo correcto para
      las respuestas historicas. Un administrador SI puede diferenciar "todavia no se verifico"
      de "se intento y fallo".
    notes: >-
      **PASS.** Se levanta la observacion O4, que no es defecto: el AC pide que el perfil nunca
      llegue a logs publicos y el PR 75 lo cumple bien, pero el efecto colateral es que el log
      tampoco dice QUE fallo — solo "failed (Error)" — y como el enriquecimiento es
      fire-and-forget, una org mal configurada falla de forma silenciosa en produccion.
      Sugerencia barata porque el dato ya se persiste: exponer un conteo de respuestas con
      veevartSalesMatchStatus = "error" en diagnosticos o en el dashboard, para que la falla deje
      de ser invisible sin agregar ni un dato personal al log.
