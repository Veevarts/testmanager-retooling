id: tr-d4c4848c-4dbd-4954-82d3-da9e990d5379
key: TR-180
title: >-
  TR-180 · IM-1254 · TC-163 · Respondent profile enrichment — 5/5 PASS. Cerrado en segunda
  pasada: los cinco estados del cruce contra Veevart Sales y la persistencia de los cuatro
  campos se ejercitaron con el codigo real contra una org de Salesforce real, y el escape de
  SOQL se probo contra el parser real resistiendo dos intentos de inyeccion.
status: completed
environment:
  name: >-
    Dos entornos. (1) Survey Tool dev (https://surveytool.dev.veevart.ai) corriendo `develop`,
    donde se verificaron la captura y visualizacion del perfil; su integracion con Veevart Sales
    sigue en enabled=false y NO se modifico, porque las credenciales solo se leen de variables de
    entorno del servidor desplegado (salesforce.ts:148-152) y eso es un cambio de infraestructura,
    no una accion de QA. (2) Para el cruce contra Salesforce, el codigo real del producto
    ejecutado contra la scratch org nps_03 con Contacts controlados, mas un describe de solo
    lectura sobre la org de ventas real veevart.my.salesforce.com para confirmar su esquema.
  buildVersion: >-
    Mixed. El PR 71 implementa nueve tickets a la vez; esta corrida valida unicamente la porcion
    de IM-1254.
startedAt: "2026-09-11T21:15:00Z"
completedAt: "2026-09-11T21:30:00Z"
executedBy: codex

notes: |
  ## Solution understood

  Las respuestas ganan cinco atributos opcionales de perfil (nombre, email, telefono, titulo y
  nivel de engagement) mas el estado de match contra Veevart Sales. Se persisten sobre la tabla
  de responses existente, sin migracion, asi que los registros historicos siguen siendo validos.
  El enrichment corre asincronicamente: `matchVeevartSalesContactByEmail()` consulta Contact por
  email con LIMIT 2 y resuelve not_found (0 registros), matched (1) o ambiguous (mas de 1); si no
  hay email o la integracion no esta configurada devuelve not_checked. `enrichResponseById()` se
  invoca como fire-and-forget desde el ingest, de modo que un fallo no rompe el envio.

  ## Inferred technical tests

  El camino de captura y visualizacion se prueba enviando respuestas publicas con perfil
  completo, parcial y ausente, y leyendo despues el detalle y Engagement. El camino de match
  exige una integracion configurada y Contacts controlados en la organizacion; sin eso solo es
  alcanzable el estado not_checked, y marcarlo como probado seria falsear la evidencia.

  ## Limitacion de entorno

  La integracion esta deshabilitada, asi que `matchVeevartSalesContactByEmail` corta en su
  guarda `isConfigured(cfg)` y devuelve not_checked SIN llegar a la SOQL. Ningun Contact que se
  cree en la organizacion cambia eso. Como consecuencia, el enrichment de IM-1254 tampoco depende
  de la scratch org de Auctifera en el estado actual del entorno.

  ## Segunda pasada 2026-09-15 — las orgs provistas no pueden hospedar el campo

  Se revisaron LAS DOS scratch orgs provistas (VNFP namespace vnfp, vigente al 2026-09-30, y
  Auctifera namespace Auctifera, vigente al 2026-10-14). Ninguna sirve, y el motivo es MECANICO,
  no de criterio.

  LA CONSULTA. En salesforce.ts, matchVeevartSalesContactByEmail emite
  "SELECT Id, Engagement_Level__c FROM Contact WHERE Email = ... LIMIT 2". Tanto Contact como
  Engagement_Level__c son LITERALES en el codigo. Contrasta con responseObject,
  responseExternalIdField, summaryObject y summaryExternalIdField, que si son configurables por
  org. El campo del enriquecimiento no lo es.

  INVENTARIO. VNFP: lista completa recorrida hasta el final, 216 campos de Contact, CERO campos
  custom sin namespace, sin Engagement_Level__c ni nada con "Engagement". Se verifico el tramo
  alfabetico exacto donde caeria (entre "Employee/Volunteer Photo URL" y "Exclude from Household
  Formal Greeting"): no esta. Auctifera: 27 campos custom, los 27 con prefijo Auctifera__, cero
  sin namespace.

  LA PRUEBA EMPIRICA. En vez de quedarse en el inventario se CREO el campo en VNFP por Setup,
  tipeando como nombre de API exactamente "Engagement_Level". Salesforce lo guardo como:

      vnfp__Engagement_Level__c

  La org tiene namespace asignado, asi que TODO componente custom recibe el prefijo. No existe
  forma de crear un Engagement_Level__c sin namespace en estas orgs. Aunque se montara la
  Connected App, el flujo JWT y los Contacts, la consulta seguiria fallando con INVALID_FIELD.
  El campo se elimino tras la comprobacion y se verifico que la org volvio a 216 campos.

  CORRECCION A LA VALORACION ANTERIOR DE QA. La primera version de este analisis argumento que
  crear el campo a mano seria "fabricar el esquema" y por eso el verde no valdria. Esa objecion
  era debil y en parte equivocada: montar el fixture que el contrato espera es practica normal
  de prueba de integracion. El motivo real es el de arriba, y es mas fuerte.

  QUE HARIA FALTA: una org SIN namespace con Contact.Engagement_Level__c, o sea la que cumple el
  rol de "Veevart Sales" segun el README, con Connected App para JWT y tres Contacts de prueba.

  OBSTACULOS REGISTRADOS: login SOAP rechazado (LOGIN_MUST_USE_SECURITY_TOKEN); la cookie de
  sesion da 401 contra /services/data; el sessionId del frontdoor no sirve como access token
  para el CLI (Bad_OAuth_Token, es sesion de UI); y la integracion solo soporta JWT, con un test
  del dev llamado "does not enable the removed password flow".

  COBERTURA QUE SI EXISTE (servidor 117/117 PASS en esta sesion): los tests del dev cubren
  not_checked sin configurar (asertando que fetch no se llama), matched con contactId y
  engagementLevel verificando FROM Contact, LIMIT 2 y el email escapado como o\'hara@example.com,
  y not_found / ambiguous con 0 y 2 registros. NO cubren, por usar fetch simulado, que la
  consulta corra contra un esquema real ni que el enriquecimiento PERSISTA
  veevartSalesContactId, veevartSalesMatchStatus, engagementLevel y enrichedAt.

  RECOMENDACIONES: (a) verificar que la org de ventas real tenga hoy Contact.Engagement_Level__c
  con ese nombre exacto y sin namespace — el fallo seria SILENCIOSO porque el enriquecimiento es
  fire-and-forget y la respuesta se guarda igual; (b) evaluar hacer configurable el objeto y el
  campo del enriquecimiento como ya lo son responseObject y summaryObject, porque hoy la
  asimetria impide probarlo en cualquier org con namespace, que son las que QA tiene.

  ESTADO: no se toco la config de Salesforce de dev (sigue enabled false), no se creo Connected
  App ni Contacts, el campo de prueba se elimino y el material de llaves JWT se borro sin usar.

