    scenarioIndex: 2
    status: not-run
    stepResults: []
    actual: |
      NO EJERCITABLE EN ESTE ENTORNO. GET /api/admin/integrations/salesforce/status devuelve
      enabled=false: la integracion con Veevart Sales no esta configurada en dev (faltan
      SFDC_CLIENT_ID, SFDC_USERNAME y SFDC_JWT_PRIVATE_KEY).

      Con esa configuracion ausente, `matchVeevartSalesContactByEmail()` retorna not_checked en
