  TR-180 · IM-1254 · TC-163 · Respondent profile enrichment — 3/5 PASS · 2 not-run. La captura
  y visualizacion del perfil quedan verificadas; los caminos matched / not_found / ambiguous NO
  son ejercitables porque la integracion con Veevart Sales esta deshabilitada en dev.
