  - testCaseId: "ece5c154-cc4e-4e4b-8cab-2d54f6cef352"
    testCaseKey: TC-163
    scenarioTitle: >-
      AC3 · Contact matching resolves to not_found, matched or ambiguous according to how many
      records the email returns
    scenarioIndex: 2
    status: passed
    stepResults: []
    actual: |
      CERRADO. Los cinco estados se observaron ejecutando la funcion REAL del producto,
      `matchVeevartSalesContactByEmail` importada tal cual, contra una org de Salesforce real
      (nps_03) con Contacts controlados creados para el caso.

      montaje                        email                          status        esperado
      -----------------------------  -----------------------------  ------------  ------------
      1 Contact con ese email        qa-tc-163-unique@example.com   matched       matched    OK
      0 Contacts con ese email       qa-tc-163-absent@example.com   not_found     not_found  OK
      2 Contacts comparten el email  qa-tc-163-dupe@example.com     ambiguous     ambiguous  OK
      email con apostrofo            qa-tc-163-o'hara@example.com   matched       matched    OK
      email vacio                    ""                             not_checked   not_checked OK

      En matched se extrajeron los dos valores: contactId 003Rt00001G4dAlIAJ y engagementLevel
      "1 - Advocator of the platform and our team". En not_found y ambiguous ambos quedan null,
      que es lo correcto: el AC no pide identificar a nadie cuando no hay un unico contacto.

      LA PERSISTENCIA TAMBIEN QUEDO VERIFICADA, ejecutando `enrichResponseById` real y observando
      exactamente que escribe: los cuatro campos veevartSalesContactId, veevartSalesMatchStatus,
      engagementLevel y enrichedAt se persisten con los valores correctos en cada estado, y NO se
      escribe ningun campo adicional. Con email vacio o nulo no se escribe nada, confirmando el
      corto circuito de la primera guarda.

      ADEMAS SE DESCARTO EL RIESGO QUE ESTA MISMA CORRIDA HABIA MARCADO como el modo de falla mas
      probable: por describe de solo lectura sobre la org de ventas real
      (veevart.my.salesforce.com) se confirmo que Contact.Engagement_Level__c EXISTE, sin prefijo
      de namespace, como picklist de 7 valores coherentes con el producto (de "1 - Advocator" a
      "5 - Detractor"). El SOQL hardcodeado es valido contra la org que el README designa.

      pre-fix -> post-fix -> objetivo cumplido?: antes del PR no existia ningun cruce contra
      Veevart Sales (matchVeevartSalesContactByEmail: 0 ocurrencias en el commit previo)
      -> ahora el cruce resuelve los cinco estados contra un esquema real y persiste los cuatro
         campos en el registro de respuesta -> SI.
    notes: >-
      **PASS con dos sustituciones declaradas, ambas fuera del alcance de los AC.** (1) La
      obtencion del token: las orgs disponibles no permiten crear Connected Apps, asi que el
      endpoint de token se resolvio localmente entregando el access token del CLI ya autorizado
      — el SOQL viaja al servidor real de Salesforce con Bearer real, y el intercambio JWT no lo
      cubre ningun AC. (2) El prefijo de namespace: un adaptador traduce unicamente
      Engagement_Level__c <-> Auctifera__Engagement_Level__c, que es exactamente la diferencia
      que la org impone y que la org de ventas real NO tiene, segun quedo verificado arriba.
      Ningun otro token de la consulta se altera. Todo lo demas — construccion de la consulta,
      escape, HTTP, ejecucion del SOQL, registros devueltos, logica de ramas y campos escritos —
      es el codigo real contra datos reales.
