notes: |
  ## Solution understood

  El runtime calculaba la cadencia de re-entrega como `interactionsSinceFirstShow %
  triesBetweenShows`. Con `triesBetweenShows = 1` eso es `x % 1`, que da 0 siempre, de modo
  que la encuesta se evaluaba como mostrable en CADA interaccion elegible posterior al primer
  display en vez de saltarse una. El fix introduce `const cadence = triesBetweenShows + 1` y
  aplica el modulo contra esa cadencia, con lo que un valor N pasa a saltar exactamente N
  interacciones. El diff esta aislado a esa unica linea de `server/src/lib/surveyRuntime.ts`:
  el resto del bloque (primer display elegible, contador ausente, contador por debajo del
  umbral) queda intacto.

  ## Inferred technical tests

  Superficie: backend runtime alcanzable por un endpoint publico. El test no-manual correcto
  es ejercitar `POST /api/features/:id/surveys` con el contexto de entrega controlado
  (respondentId, clientOrgId, usageCount) y barrer `usageCount` contra las tres cadencias.
  Eso mide el runtime desplegado de verdad, no una simulacion, y no requiere el widget ni la
  organizacion de Salesforce. El contraste PRE/POST se obtiene reproduciendo ambas formulas
  con entradas identicas.

