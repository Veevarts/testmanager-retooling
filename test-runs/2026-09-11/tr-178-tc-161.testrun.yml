  - testCaseId: "8d45bf0d-9ce2-4ce5-a8dd-d55864bd6852"
    testCaseKey: TC-161
    scenarioTitle: >-
      Edge case · Respondents carrying historical usage counters get the new cadence applied
      without breaking, including the missing and below-threshold counter paths
    scenarioIndex: 4
    status: passed
    executedAt: "2026-09-11T20:57:00Z"
    stepResults: []
    actual: |
      Este escenario cubre el riesgo que el propio ticket declara: los contadores de entrega
      ya traen valores historicos, asi que no basta con probar contadores que arrancan en cero.

      Contadores historicos altos (cadencia 1, primer display elegible = 1):
        usageCount 101 -> MOSTRAR      ((101-1) % 2 == 0)
        usageCount 100 -> no-mostrar   ((100-1) % 2 == 1)
      Contadores historicos altos (cadencia 2):
        usageCount 1000 -> MOSTRAR     ((1000-1) % 3 == 0)
        usageCount  999 -> no-mostrar  ((999-1)  % 3 == 2)

      El patron N+1 se sostiene con valores de tres digitos: un contador heredado no produce
      ni un display extra ni un bloqueo permanente.

      Caminos de borde del contador:
        sin usageCount, cadencia 1        -> no-mostrar (usage_count_missing)
        usageCount 0 (bajo el primer display) -> no-mostrar (trigger_counter_not_reached)
        sin usageCount, cadencia 0        -> MOSTRAR (el bloque se salta entero)

      pre-fix -> post-fix -> objetivo cumplido?: el estado historico no estaba verificado ->
      la cadencia se calcula sobre usageCount menos el primer display elegible y se comporta
      igual con contadores heredados -> SI.
    notes: >-
      **PASS**. Cierra el riesgo declarado en el ticket. Nota para dimensionar el impacto: el
      entorno dev no tenia ninguna encuesta con triesBetweenShows configurado antes de esta
      corrida, asi que el cambio de semantica no altera la cadencia de ninguna encuesta
      existente aqui. En un entorno con encuestas configuradas, toda encuesta con N mayor que
      0 cambia su cadencia observable de N a N+1.
    attachments:
      - name: live-cadence-matrix.txt
        path: attachments/tr-178-tc-161/scenario-cadence/live-cadence-matrix.txt
        mimeType: text/plain

