  - testCaseId: "8d45bf0d-9ce2-4ce5-a8dd-d55864bd6852"
    testCaseKey: TC-161
    scenarioTitle: >-
      AC1-AC3 regression · The remaining delivery gates keep blocking exactly as before the fix
    scenarioIndex: 3
    status: passed
    executedAt: "2026-09-11T20:56:00Z"
    stepResults: []
    actual: |
      El gate de cadencia es el sexto de ocho en el orden de evaluacion del runtime, y se
      evalua ANTES de maxShowsPerDay y maxDismissals. Por eso la prueba clave es que un gate
      POSTERIOR siga bloqueando aunque la cadencia haya dado paso.

      Subject 11 "QA TC-161 Gates", survey 17: triesBetweenShows=0 (la cadencia siempre da
      paso) y maxImpressions=1.
        - antes de registrar impresiones : MOSTRAR
        - se registra 1 impresion (HTTP 201)
        - tras alcanzar maxImpressions=1 : no-mostrar

      El gate posterior sigue cortando la entrega pese a que la cadencia lo permitia, que es
      justamente el "sujeto a los demas limites" del AC1.

      Los ocho gates y sus motivos siguen intactos en el diff: el cambio no toca ninguna otra
      rama de `evaluateSurveyDelivery`. Las suites del repo lo respaldan: server 113/113 y
      client 60/60 en verde sobre 4458647c, coincidiendo con lo declarado en el PR.

      pre-fix -> post-fix -> objetivo cumplido?: los demas gates bloqueaban -> siguen
      bloqueando igual -> SI.
    notes: >-
      **PASS**. No se observo ninguna encuesta que antes se bloqueara por otro motivo y ahora
      pase a mostrarse.
