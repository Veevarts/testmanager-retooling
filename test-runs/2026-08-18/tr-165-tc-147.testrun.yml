    actual: |
      Semántica COALESCE (PRE vs POST):
        PRE:  `COALESCE(revenue_so.ID, payment_so.ID)` — devolvía NULL cuando ambos NULL.
        POST: mismo COALESCE + 3er branch synthetic para el caso NULL/NULL. Los dos primeros branches
              ganan idéntico byte-a-byte para donations con POS lookup pre-existente.

      Efecto sobre donations pre-existentes:
        - Si `revenue_so.ID` existe → devuelve ese UUID (mismo valor PRE y POST).
        - Si `revenue_so.ID` NULL + `payment_so.ID` existe → devuelve ese UUID (mismo valor PRE y POST).
        - Cast NVARCHAR(100) es promoción de type; no cambia el string UUID.

      Idempotencia:
        - Query 100% derivada de source data (Altru PKs).
        - Sin state, sin randomness, sin timestamps.
        - Dos corridas → mismo output.

      Guards contra drift futuro (mutation-tested, commits a510028 + 707b288 + 770ebce):
        1. CTE-identity spec: 10 shared CTEs stay byte-identical after whitespace normalize.
        2. Emission-gate spec: FROM/JOIN + trailing WHERE alineados con exactamente un extra predicate.
        3. Cast-per-branch spec: cada COALESCE branch debe ser CAST/CONVERT a NVARCHAR.

      Live delta check (Tucson dev safesql, PR body):
        Total rows PRE=53,855 == POST=53,855 · money sum PRE == money sum POST · distinct POS keys POST=53,855.
    notes: >-
