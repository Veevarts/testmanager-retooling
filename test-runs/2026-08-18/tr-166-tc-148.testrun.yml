        npsp_partial_soft_credit       | 331     | 331     | 0                            | Sin colateral en soft credits
        npsp_account_soft_credit       | 40      | 40      | 0                            | Sin colateral

      Interpretación:
        - Net-zero en fund_assignment_donations es la evidencia MÁS FUERTE de "no collateral": el
          −1 duplicate suppression y el +1 rescued FDA EXACTAMENTE se cancelan. Si otras revenues
          hubieran sido tocadas, el delta absoluto sería diferente.
        - +1 en donation_transaction es solo el rescued gift; ninguna otra transaction se agregó
          ni se droppeó.
        - Los soft-credit queries usan la misma EligibilityGate pero no cambiaron count total →
          la sincronización cross-file funciona sin regresar rows en las otras revenues.

      Whole-tenant es evidencia MÁS FUERTE que "otras revenues del mismo fund/período" (el scope
      original del AC3), porque cualquier regresión en otro fund también sería detectada.

      Fixture guardrails contra drift futuro:
        - `donation-adjustment-readd-query.spec.ts` (+141): cross-file gate identity assertion.
        - 22 fixture scenarios en `donation-split-receipting-query-fixture.ts` cubren adjustment,
          non-adjustment, latent bugs pre-existentes, y edge cases (Discount, chained adjustment).
    notes: >-
