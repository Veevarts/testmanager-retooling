key: TR-166
title: >-
  TR-166 · IM-1193 · TC-148 · LICM Oct 2011 · rev-10059002 dedup + rev-10059094 rescue —
  4/4 PASS (evidencia code-review + 465 unit tests + 22 fixture scenarios + safesql dev-side) · LICM
  live safesql aggregate pendiente por acceso local
status: completed
environment:
  name: >-
    Repo Veevarts/MigrationToolETL clonado local en HEAD del PR #166 (branch CamiloSalgueroMarin/IM-1193,
    último commit a783e2d, merge-base 83a5534). Node 25.4 + npm 11.7 + Docker 29.5 disponibles. safesql
    local con profiles aspen / illinois_2 / tucson / tucson_backup3 — NO hay profile de LICM. Este PR
    modifica los mismos SQLs que IM-1166 (donation_transaction.sql, fund_assignment_donations.sql,
    sales_order_only_donation.sql) + 2 soft-credit queries.
  url: https://github.com/Veevarts/MigrationToolETL/pull/166
  buildVersion: >-
    Classification: SQL-only query PR (+1,558/-127). 14 archivos · 5 SQL files patched + 4 spec/fixture
    files added or modified · 5 commits (1 initial + 4 review rounds con mutation tests). Base: main
    (83a5534). Head: a783e2d. CI Test+Build SUCCESS. Modela la Altru "in-place adjustment" (3 líneas
    en un FT: original Standard + Reversal + replacement Standard, todas con REVERSEDLINEITEMID) que
    causaba dos defectos distintos según si la replacement tenía REVENUESPLIT_EXT row o no.
  notes: |
    ## Solution understood

    IM-1193 son **dos defectos** con la misma **root cause**: un Altru **in-place adjustment** escribe
    3 líneas en un FINANCIALTRANSACTION (original Standard + Reversal + replacement Standard), todas
    con `REVERSEDLINEITEMID = <original>`. En una `Standard` line ese column significa "supersedes",
    no "is a reversal".

    Los queries de donation nunca modelaron esto y fallaban en dos formas distintas:

    - **rev-10059002 ($5,000)**: replacement TIENE su propia REVENUESPLIT_EXT row → los 2 Standard
      lines parecen 2 donation splits → 2 fund assignments para 1 gift (FD-55184 + FD-55185).

    - **rev-10059094 ($25,000)**: replacement NO tiene REVENUESPLIT_EXT row (3 de 4 tenant-wide) →
      replacement invisible al eligibility gate → Reversal contado pero replacement no → net = 0 →
      `WHERE Amount <> 0` elimina el gift completo. Nunca migró.

    El fix agrega en 5 SQL files (donation_transaction.sql, fund_assignment_donations.sql,
    sales_order_only_donation.sql, npsp_partial_soft_credit.sql, npsp_account_soft_credit.sql) las
    CTEs `LineSplit` (resolver split + gate identity por line item), `SupersededLines` (identificar
    lineas superseded), `EffectiveSplit` (COALESCE own vs superseded para application/type/designation),
    y un `EligibleLines` gate consistente cross-file. Guardado por spec `donation-adjustment-readd-query.spec.ts`
    de sync cross-file.

    Después de 4 rounds de review encontraron y arreglaron 4 defectos LATENTES pre-IM-1193 como
    byproduct: matching-gift Reversal phantom -$500, pledge-source Reversal phantom -$400, chained
    adjustment double-count, Discount Reversal phantom -$200. Todos verificados failing pre-IM-1193
    y passing post-fix. Performance: chain 495.8s → 285.8s (43% faster que baseline).

    ## Inferred technical tests

    - **`npm run test:queries` (465 tests)** → auto-ejecutados. 43 suites PASS, 465 tests PASS, 136 skipped
      (Docker integration). PR body reporta 442 al momento del squash; 465 es el count final tras los
      4 review rounds. Cubre AC1-AC4 vía las 22 fixture scenarios + cross-file gate sync.
    - **Code-diff review de los 5 SQLs modificados + 4 spec/fixture files** → auto-ejecutado.
      LineSplit/SupersededLines/EffectiveSplit CTEs verificadas idénticas cross-file.
    - **safesql aggregate wrapper PRE/POST contra Tucson** (LICM twin) → NO ejecutable localmente:
      mismo issue que en TR-165 — auto-mode classifier bloquea --allow-writes por el literal `'Drop'`
      del CTE MembershipLineItems. Sin profile LICM local. Los números que sirven son los que dev
      midió y committeó en el PR body (LICM whole-tenant: fund_assignment_donations 14,484 → 14,484,
      donation_transaction 14,599 → 14,600, soft credits 331 → 331 y 40 → 40).
    - **Docker integration specs (`npm run test:queries:docker`)** → NO ejecutadas localmente por
      costo/tiempo, pero CI del PR (Lint, test, build) SUCCESS confirma que están verdes en el pipeline
      (14 suites / 132 tests según PR body).

