          rentals: payment date
          sales_order: COALESCE(so.TRANSACTIONDATE, so.DATEADDED)
          pledge: PLEDGE'S own COALESCE(ft.CALCULATEDDATE, ft.DATEADDED)   ← structural break
          membership2: COALESCE(installment, anchor, mt.TRANSACTIONDATE)
          donation2: max eligible-line date

        Ejemplo del hazard: pledge raised 2015, paid 2024, run with fromDate=2024-01-01.
        Charge emitted (payment in window), reference names pledge sales_order_only_pledge.sql
        filtered out → __r: dangling → whole-row rejection.

        Reachable from app (mergeFilters honours fromDate/toDate).
