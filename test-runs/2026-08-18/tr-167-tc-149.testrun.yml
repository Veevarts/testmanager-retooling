title: >-
  TR-167 · IM-1192 · TC-149 · LICM · charge_without_order.sql POS Purchase reference per object
  family — 5/5 PASS (evidencia code-review + 21 fixture tests + 456 query-regression suite +
  cross-tenant PR body). LICM live safesql pendiente (DB fleet unreachable + no LICM profile local)
status: completed
environment:
  name: >-
    Repo Veevarts/MigrationToolETL clonado local en HEAD del PR #167 (branch
    CamiloSalgueroMarin/IM-1192, último commit ef8677e, tracked como local `pr-167`). Base branch
    del PR: story/10-379-donations-sin-IM-1166 (IM-1166), NO main. Node 25.4 + npm 11.7 disponibles.
    safesql local con profiles aspen / illinois_2 / tucson / tucson_backup3 — NO hay profile de
    LICM. DB fleet Altru unreachable desde 2026-08-18 (bastion SSH ok, TCP a DB endpoints refused —
    afecta al dev también).
  url: https://github.com/Veevarts/MigrationToolETL/pull/167
  buildVersion: >-
    Classification: SQL-only query PR (+996/-60). 3 archivos: 1 SQL (charge_without_order.sql
    +533/-60) + 1 spec (charge-without-order-query.spec.ts +455 NEW · 21 tests) + 1 docs
    (altru-model-context.md +8). PR OPEN, stacked sobre IM-1166 branch. Depende de que IM-1166 (#165)
    mergee antes que este a main.
  notes: |
    ## Solution understood

    IM-1192 son **dos defectos independientes** en `charge_without_order.sql`, ambos manifestándose
    como **88,193 de 114,638 references (77%) danglando** en LICM. Root cause: la query proyectaba
    un bare `ft.ID` en la columna de relación `Auctifera__POS_Purchase__r:...-Implementation_External_ID__c`
    para toda la población, cuando esa key solo resuelve para 2 de las 5 familias de objeto que
    la query cubre. Un valor no-blanco no-matching en una columna `__r:` falla la FILA ENTERA de
    Charge en el load, no solo el lookup.

    **Defecto 1 (Routing)**: el gate order-less testeaba solo `SALESORDER.REVENUEID = ft.ID`, que
    nunca matchea un payment cuya order linkage vive en `SALESORDERPAYMENT`. Esto clasificaba
    25,822 payments order-backed como order-less y les asignaba la key wrong. La reference ahora
    resuelve via `SalesOrdersByPayment` linkage; el emission gate se queda `so.ID IS NULL`
    deliberadamente (widening lo dropearía).

    **Defecto 2 (Keying)**: la reference ahora resuelve **por familia de objeto** (5 familias),
    espejando el emission gate + la key de cada POS Purchase query minter:

      1. Rental payment → `pos_purchase_only_rental_payments.sql`, key = bare payment `ft.ID` (25,789)
      2. Order-backed payment → `sales_order.sql`, key = `SALESORDER.ID` via SALESORDERPAYMENT (25,822)
      3. Pledge → `sales_order_only_pledge.sql`, key = bare pledge `ft.ID` (1,035)
      4. Membership → `sales_order_only_membership2.sql`, key = `membership-no-order-pos-<inst/mt>` (51,450)
      5. Donation → `sales_order_only_donation2.sql`, key = `donation-no-order-pos-<inst/ft>` (10,309)
         None → NULL (605)  Total: 115,010

    **El orden del CASE es load-bearing**: familias 1 y 2 NO son disjuntas (overlap 25,787 rows).
    Sin este orden, sales_order.sql mint un purchase para todas las orders — el swap re-parentearia
    silenciosamente 25,787 Charges sin ningún error en load. Es el failure shape más grave que este
    archivo puede tener. Un spec dedicado pinnea el orden (F-1).

    Otros safeguards del fix: cada familia mirror del emission gate de su POS query minter (F-3,
    F-7); membership key resuelve via REVENUEID no PAYMENTID (F-2, matchea membership2); MembershipRecurringInstallments
    ordering total (F-9, no tied); REVENUEPAYMENTMETHOD reducido con MIN(id) guard (F-6, previene
    fan-out); 4 tables un-projected removidas; CAST(NVARCHAR(100)) en cada branch (IM-770 trap);
    ELSE NULL fallback (blank loads, dangling drops).

    Result: **88,193 → 0 dangling references · 115,010 Charges preserved · 605 blank refs (loadable)**
    Cross-tenant verified: tucson 118,008 · Illinois 125,687 · high_desert 191,040 · Long Island
    115,010 distinct external IDs UNCHANGED post-fix (rank removes only dupes, no logical loss).

    Two HAZARDS documented (not fixed by this PR, need own tickets):
    - F-12: "0 dangling refs" guarantee ONLY on UNWINDOWED runs. Charge windows on payment date,
      each POS query on different date at different grain. Pledge is the structural break.
      → **Windowed Charge run MUST be paired with UNWINDOWED POS Purchase runs**.
    - Load-side UUID `06e4b843…`: is a SALESORDER.ID from charge_with_order.sql (NOT this file),
      documented as load-side failure needing org-side confirmation. Out of scope for this PR.

    ## Inferred technical tests

    - **`npm test -- charge-without-order-query.spec.ts` (21 tests)** → auto-ejecutado. 21/21 PASS
      en ~0.43s. 6 describe blocks: tables header (F-13), POS reference (F-1 F-8 IM-770), family
      gates mirror (F-3 F-7), synthetic keys (F-2 F-9), order-less gate, grain (F-6). Cubre AC1/AC2/AC3
      completo; AC4 parcial (no spec para regresión cross-file, cubierto via PR body); AC5 parcial
      (idempotencia pinneada; windowed hazard documentado no testeado).
    - **`npm run test:queries` (456 tests / 44 suites)** → auto-ejecutado. 456/456 PASS, 128 skipped
      (docker/live). 44 de 60 suites PASS (16 skipped son docker/live que requieren infra externa).
    - **`npm run lint:check`** → auto-ejecutado. Clean, exit 0.
    - **Security regression scans** → auto-ejecutados. 0 secrets, 0 SQL injection, 0 new deps,
      0 PII exposure, 0 RBAC bypass. npm audit reports 4C/13H/36M/3L pre-existing at repo level
      (package.json NOT in diff); flagged informational, NOT a PR blocker.
    - **safesql aggregate PRE/POST contra LICM** → NO ejecutable local. Motivos: (1) no hay profile
      LICM en /Users/veevart/tools/safesql/profiles, (2) DB fleet unreachable desde 2026-08-18
      (Camilo documentó este outage en el PR body — bastion SSH ok pero TCP a los DB endpoints
      refused; afecta al dev también, no solo a QA), (3) auto-mode classifier bloquea --allow-writes
      en aggregate wrappers (mismo issue documentado en TR-165 y TR-166). Los números que sirven
      son los que Camilo midió el 2026-08-14 (whole-population LICM: 88,193 → 0 dangling, 115,010
      Charges preserved) y el 2026-08-18 (cross-tenant tucson/Illinois/high_desert).
    - **Live safesql cross-tenant re-medida post-tightening (F-3 + F-7)** → NO ejecutable por el mismo
      DB fleet outage. 4 celdas de la family-mix table quedan PROVISIONAL. Camilo predice el estado
      esperado: family 1 ≤ 25,789, family 2 ≥ 25,822 (rising), family 5 ≤ 10,309, NULL ≥ 605,
      total 115,010 invariante.

