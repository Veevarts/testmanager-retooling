key: TR-201
title: >-
  TR-201 · IM-1300 · TC-183 · 1/5 PASS, 4 bloqueados — el arreglo es correcto y completo
  donde se pudo medir, pero la fuente de Long Island no responde hoy y High Desert no cabe
  en 120 s.
status: completed
environment:
  name: >-
    Fuentes de Altru en SQL Server, alcanzadas con perfiles de solo lectura a traves del
    bastion. Todas las mediciones son agregados: ninguna fila de datos ni ningun nombre
    sale a la evidencia. Toda escritura de las consultas de QA va a tablas temporales.
    Alcanzables hoy: High Desert, Illinois y Vizcaya. Sin respuesta: Long Island (la fuente
    del ticket), Tucson, Kidstream, MOAD y Aspen. No se leyo ni escribio ninguna org de
    Salesforce; la de Long Island es productiva del cliente. Los detalles de red quedan
    fuera de este artefacto a proposito: este repositorio es publico.
  buildVersion: >-
    SQL-only con un spec de texto — Veevarts/MigrationToolETL "PR #188", rama
    CamiloSalgueroMarin/IM-1300-membership-end-dates, head e401c7c9, ABIERTO y sin
    revisiones. Base d8bafa10, que es main. Un unico predicado CASE en la rama 1 de
    membership_transactions.sql; el resto son comentarios, el spec y documentacion. El
    veredicto queda atado a e401c7c9.
startedAt: "2026-09-25T15:40:00Z"
completedAt: "2026-09-25T17:10:00Z"
executedBy: codex

notes: |
  ## Solution understood

  La consulta daba fecha fin "de por vida" (inicio + 100 anos) cuando la MEMBRESIA no
  tenia expiracion. Pero MEMBERSHIP.EXPIRATIONDATE es el estado ACTUAL, y Altru lo vacia
  cuando la membresia se da de baja, mientras cada termino anterior conserva su fecha
  real. Cada termino historico de una membresia cancelada salia con fecha fin cien anos
  despues y contaba como socio vigente.

  El PR cambia la condicion a: el TERMINO no tiene fecha propia, o la membresia esta
  Active y sin expiracion. El segundo brazo protege a los vitalicios de High Desert, cuyos
  terminos guardan una expiracion igual al dia de alta. La rama 2 ya leia la expiracion
  del propio item y no cambia.

  ## Inferred technical tests

  - Base vs PR sobre la misma fuente, sin filtro de fecha, con una version instrumentada
    que emite la fecha vieja y la nueva en la misma fila, y dos controles sin tocar que
    prueban que la instrumentacion no altera la salida. EJECUTADO en Illinois; Long
    Island caido; High Desert no cabe en 120 s.
  - El predicado medido sobre las tablas de Altru en cada fuente alcanzable. EJECUTADO en
    tres clientes.
  - Buscar otros productores de la fecha fin en todo el repositorio. EJECUTADO.
  - El spec del PR, y comprobar que puede fallar. EJECUTADO: 5 de 5 mutaciones en rojo.
  - La suite, separando fallos previos de introducidos. EJECUTADO.

  ## Hallazgos

  F1 · LA FUENTE DE LONG ISLAND NO RESPONDE, y es la del ticket. Los escenarios 1, 2 y 3
  quedan bloqueados. Hace falta encender su maquina de respaldo en la Migration App o el
  host y puerto vigentes.

  F2 · "A Cancelled membership never qualifies", del comentario de Jira, no es lo que hace
  el SQL. Un termino cancelado sin fecha propia sigue en +100. En la salida de Illinois
  son 6; en tablas base, High Desert hasta 7 y Vizcaya 2 Pending. No es un defecto del
  codigo, cuyos comentarios lo dicen bien. Es que los equipos de esos clientes deben saber
  que su Current Members seguira contando a esos socios.

  F3 · En Illinois el impacto real es 27 filas, no las 57 transacciones que cita la
  documentacion: 57 es la cifra de las tablas base, y 30 no llegan a la exportacion.

  F4 · Vizcaya tiene membresias Pending sin expiracion, un tercer estado que la
  documentacion no contempla. Sin efecto en este cambio.

  F5 · El arreglo esta completo: ninguna otra exportacion emite la fecha fin.

  F6 · Solo 3 de los 13 perfiles de fuente responden hoy.

  ## Veredicto QA: APROBADO CON ALCANCE

  Se certifica el CODIGO. El cambio es un unico predicado que se evalua fila a fila; lo
  que varia entre clientes es solo que filas caen en cada brazo, y eso esta medido con
  datos reales: Illinois tiene el mismo defecto y en su salida cambian 27 filas, las 27 en
  la direccion correcta y nada mas se mueve; ningun cliente alcanzable gana fechas de por
  vida nuevas; ninguna otra exportacion emite la fecha fin; y el spec puede fallar.

  No se certifican las cifras de Long Island (35,170 / 35,169 / 30,706 / 869 y los
  residuos). Son del autor y QA no las verifico, porque la fuente estaba apagada. Solo
  importan para la correccion de datos en Salesforce, que es del operador y queda fuera de
  QA.

  RIESGO RESIDUAL, el unico que se nombra: el camino nuevo de por vida (un termino sin fecha
  propia sobre una membresia que si tiene expiracion) no se midio en Long Island. Es la
  unica forma en que el arreglo podria perjudicarle, metiendo fechas lejanas donde antes
  no las habia. El autor lo reporta en 0; QA lo midio en 0 en High Desert, Illinois y
  Vizcaya.

  Los escenarios 1 a 4 NO se pasan a verde con evidencia de otro cliente: siguen
  bloqueados por su motivo. Si la maquina de Long Island vuelve a encenderse, se cierran
  1 a 3 como segunda version de este TR, idealmente antes de que el operador toque
  Salesforce.
  ## Fuera de alcance

  El Salesforce de Long Island — los 203 registros aun mal, los 202 corregibles, las 5
  fechas puestas a mano y los rollups — es la org productiva del cliente, y QA no la lee
  ni la escribe. La recomendacion del autor es la correcta: actualizar solo los 202 y
  recalcular los rollups. Una recarga completa sobrescribiria las fechas puestas a mano y
  volveria vigentes a socios dados de baja.

