  - testCaseId: "b550fbba-fd8b-442f-9f14-12d730a9a804"
    testCaseKey: TC-183
    scenarioTitle: >-
      Long Island population · every far-future end date of a dropped membership is corrected, and nothing else moves
    scenarioIndex: 1
    status: blocked
    executedAt: "2026-09-25T16:04:00Z"
    stepResults: []
    actual: |
      BLOQUEADO en Long Island, por la misma fuente caida. Las cifras del autor — 35,170
      lejanas, 35,169 corregidas, 30,706 de un ano, 869 de dos — siguen SIN verificar.

      LO QUE SI QUEDO MEDIDO es el mismo mecanismo, a nivel de SALIDA DE LA CONSULTA, en
      Illinois, que tiene el mismo defecto a menor escala. No sustituye al veredicto de Long
      Island: prueba que el arreglo hace lo que dice sobre datos reales.

      Tres ejecuciones sobre la misma fuente y sin filtro de fecha: la base sin tocar, el PR
      sin tocar, y el PR instrumentado con la fecha fin VIEJA calculada en la misma fila. La
      instrumentada reproduce a los dos controles, asi que la comparacion vale:

        filas                          45,112 = 45,112 = 45,112
        huella de la fecha fin vieja   -1253200989 (igual a la base)
        huella de la fecha fin nueva   -1253296746 (igual al PR)
        huella de las otras 33 cols    -975688194 en las tres

      Fechas lejanas: 241 en la base y 214 con el PR. Cambian 27 filas, LAS 27 en la
      direccion correcta: de lejana a real. Ninguna pasa de real a lejana y ninguna se
      vacia. Las 27 toman su propia expiracion, son Canceladas y Closed Won; 20 son de un
      ano, 2 de dos y 5 de otra duracion. La rama 2 (13 filas) no se mueve.

      Un matiz: el autor documenta "57 transactions affected" en Illinois. Es la cifra de
      las tablas base, y QA la reproduce. Pero a la salida llegan 27; las otras 30 no pasan
      los demas filtros de la exportacion. El impacto real en Salesforce es 27.
  - testCaseId: "b550fbba-fd8b-442f-9f14-12d730a9a804"
    testCaseKey: TC-183
    scenarioTitle: >-
      What still looks lifetime after the fix, and whose data it is
    scenarioIndex: 2
    status: blocked
    executedAt: "2026-09-25T16:05:00Z"
    stepResults: []
    actual: |
      BLOQUEADO en sus cifras de Long Island. Pero LA PARTE QUE NO DEPENDE DEL CLIENTE
      QUEDA PROBADA: la frase del ticket es inexacta.

      El comentario de Jira dice "A Cancelled membership never qualifies". El SQL no dice
      eso: el primer brazo (mt.EXPIRATIONDATE IS NULL) no mira el estado, asi que un termino
      CANCELADO sin fecha propia sigue recibiendo +100 y sigue contando como socio vigente.
      El comentario del SQL y la documentacion del PR lo describen bien; es la prosa del
      ticket la que no.

      En la SALIDA de Illinois, de las 214 filas que siguen lejanas con el PR, 208 son
      vitalicias Activas reales y 6 son CANCELADAS. En tablas base, High Desert tiene hasta
      7 y Vizcaya 2 Pending. Salen igual antes y despues, asi que no son regresion; son
      socios dados de baja que el informe de Current Members seguira contando. El autor
      documenta los 6 de Illinois en el PR, pero no en el ticket.

      Fechas lejanas que vienen del propio Altru: High Desert tiene 33 Canceladas con
      expiracion 2100-12-31 en Altru, exactamente las que declara el autor; pasan tal cual.

      Queda sin medir lo que es de Long Island: el termino cancelado sin fecha, las 6 fechas
      lejanas propias de Altru (maxima 2099-08-25) y rev-10015151 con fecha en 1904.
  - testCaseId: "b550fbba-fd8b-442f-9f14-12d730a9a804"
    testCaseKey: TC-183
    scenarioTitle: >-
      High Desert · genuine lifetime members stay current
    scenarioIndex: 3
    status: blocked
    executedAt: "2026-09-25T16:09:00Z"
    stepResults: []
    actual: |
      BLOQUEADO por el limite de 120 s de safesql, que no se toca. El propio SQL documenta
      que en High Desert la sentencia final tarda ~445 s en una maquina de 2 vCPU y 3 GB.

      QA intento reducirla sin perder ningun cambio, y valido la reduccion antes de usarla.
      Restringir la rama 1 a membresias sin expiracion es la poblacion COMPLETA donde la
      fecha fin puede cambiar, porque ningun termino sin fecha cae sobre una membresia con
      expiracion; la sentencia final no tiene funciones de ventana y su unico TOP esta en un
      OUTER APPLY correlacionado. En Illinois la restringida reproduce IDENTICOS los cinco
      agregados de cambio de la corrida completa, en 25 s en lugar de 54. En High Desert
      dio Timeout a los 123 s; y el preludio de tablas temporales, solo, tambien. Si el
      preludio ya no cabe, ninguna restriccion sirve. Se paro ahi.

      LO QUE SI QUEDA MEDIDO, sobre las tablas de Altru. Placeholders vitalicios en
      membresias Active sin expiracion: Life Member 182, Volunteer Life Member 43, Guardian
      1 — 226, exactamente lo que declara el autor. El Guardian es el que explica su "225 of
      the 226": no es un nivel Life, asi que el termino de 100 anos no lo cubre. Y el camino
      nuevo de por vida da 0, lo que implica que NINGUNA fila Active puede cambiar de fecha:
      para una Active, el predicado viejo y el nuevo solo difieren ahi. Las 226 siguen en +100.

      Eso responde la pregunta por construccion, no por observacion de la salida, y el
      escenario pide mirar la salida. Por eso no va en verde.
  - testCaseId: "b550fbba-fd8b-442f-9f14-12d730a9a804"
    testCaseKey: TC-183
    scenarioTitle: >-
      Regression · no tenant gains a new lifetime path, and the untouched branch stays clean
    scenarioIndex: 4
    status: passed
    executedAt: "2026-09-25T16:14:00Z"
    stepResults: []
    actual: |
      EL CAMINO NUEVO DE POR VIDA ES CERO en los tres clientes alcanzables hoy: High Desert
      (215,484 transacciones), Illinois (51,862) y Vizcaya (22,342). Vizcaya no lo habia
      medido el autor. En la salida de Illinois tambien es cero. Long Island, Tucson,
      Kidstream, MOAD y Aspen no responden hoy.

      Un tercer estado que la documentacion no contemplaba: el autor afirma que solo Active
      y Cancelled dejan la membresia sin expiracion. En Vizcaya hay 2 Pending. Sus terminos
      no tienen fecha propia, asi que salen con +100 antes y despues: no es regresion. Los
      codigos se leyeron de la columna STATUS del propio Altru — 0 Active, 1 Cancelled, 2
      Pending, 3 Grace, 4 Lapsed, 5 Expired — no se supusieron.

      LA RAMA 2 no cambia de texto, y en Illinois tampoco de datos: 13 filas, 0 cambios, 0
      fechas lejanas antes y despues.

      EL ARREGLO ESTA COMPLETO. En todo el directorio de consultas, la fecha fin de
      membresia solo sale de membership_transactions.sql. Las otras 9 consultas que la
      mencionan lo hacen en comentarios o no emiten fecha. No queda otra exportacion que
      siga escribiendo 2109 en Salesforce.

      EL SPEC DEL PR pasa 60/60. Es de texto — lee el SQL y aplica expresiones regulares — y
      QA comprobo que puede fallar: el predicado viejo, quitar cualquiera de los dos brazos,
      aceptar cualquier estado, y reintroducir el defecto en la rama 2. Las cinco
      mutaciones lo ponen rojo.

      LA SUITE: 819 pasan y 10 fallan. Las 10 son de donation-transaction-recurring.spec.ts
      por "Could not find a working container runtime strategy" y fallan igual, 10 de 10, en
      la base d8bafa10. El PR no toca nada de donaciones. Regresiones introducidas: 0.

