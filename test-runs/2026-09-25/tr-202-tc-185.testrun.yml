title: >-
  TR-202 · IM-1302 · TC-185 · 10/12 PASS, 1 FAIL — el mecanismo funciona, pero un encuestado que
  abre la encuesta en otro navegador pierde lo que escribe y no puede enviarla durante 90 dias.
status: completed
