    Ejecucion LOCAL completa del merge c29b3aed: servidor real, cliente real (Vite), navegador
    real (Chromium) y DynamoDB real (DynamoDB Local con las tablas del stack sintetizado).
    Encuestados sinteticos qa-tc185-*. En el entorno dev solo se hicieron sondas sin efectos (un
    cuerpo vacio y una lectura sin sesion). No se toco ninguna org de Salesforce.
  buildVersion: >-
    Mixto — API Express + cliente React + infraestructura CDK. Veevarts/survey-tool "PR #89",
