notes: |
  ## Solution understood

  Un almacen de senales append-only (0035) con dedupe_key UNIQUE; las senales se derivan por
  reconciliacion desde las tablas de origen, no por un outbox transaccional. Derivers reactivos y
  detectores programados con estado por sujeto que emiten en el flanco de subida y en el de bajada y
  se abstienen si su fuente no esta fresca. Un catalogo de 29 disparadores y 51+ campos con su
  disponibilidad. Una capa de guardas (supresion, re-enrolamiento, dedupe, frescura) entre el disparo
  y la instancia. Instancias en 'proposed' con instantanea congelada y fechas fijadas al enrolar;
  modo sombra; log de evaluacion con veredicto y traza. En el frontend: biblioteca, builder, ciclo
  de vida, log y las instancias en My Day y en la cuenta.

  ## Inferred technical tests

  - Suites del backend (raiz y Lambdas) y del frontend en main. EJECUTADO.
  - Los once bancos de simulacion sobre Postgres real. EJECUTADO, con dos mutaciones para probar
    que pueden fallar (una detectada, otra no).
  - Inventario generado del catalogo con --check y control positivo. EJECUTADO.
  - Autoria en el builder real de dev, sombra, activacion, disparo, My Day y cuenta. EJECUTADO.
  - Pares cumple / no cumple con el generador contra dev. EJECUTADO.
  - Salidas, guardas, activacion sin sombra, huerfanos y disponibilidad contra la API de dev.
    EJECUTADO.
  - Estado de despliegue por metadatos de GitHub y AWS. EJECUTADO.
  - 403 de un usuario fuera de los grupos. NO EJECUTADO: no hay usuario de prueba sin admin.

  ## Resultado

  14 PASS, 4 FAIL, 1 BLOQUEADO. F1 (alta, nueva): una jugada activada con backfill apagado enrola
  eventos anteriores a su creacion, contra el aviso de la interfaz y la respuesta de la API, y en
  produccion la ingesta ya escribe senales que nadie consume. F2, F3 y F4 (medias) son defectos
  que el autor declaro "no bloqueantes" y siguen vivos; dos de ellos contradicen ACs que la
  historia marca como cumplidos (AC8 y AC11). Detalle en hallazgos.txt y matriz-escenarios.txt.

  ## Correcciones al plan

  - La 0082 elimino las jugadas sembradas: escenario 3 y precondicion corregidos en TC-186 v2.
  - "Nada esta en produccion" solo vale para API y frontend: la captura esta en prod desde el 22-sep.
  - La pestana de la cuenta se llama Playbooks, no Tasks & Playbooks.

