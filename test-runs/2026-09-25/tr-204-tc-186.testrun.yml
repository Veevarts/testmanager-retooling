title: >-
  TR-204 · IM-1207 · TC-186 · 14/19 PASS, 4 FAIL, 1 bloqueado — el motor es solido en las
  simulaciones y en dev, pero una jugada activada "sin backfill" enrola eventos anteriores a ella,
  el log de evaluacion confunde, la disponibilidad no mide datos y los borradores huerfanos no se
  pueden borrar
status: completed
environment:
  name: >-
    Dev de Migration App (backend main 49f459f5, frontend main 0aa87980) con sesion admin en el
    navegador y el generador de eventos del autor (skill csm-playbook-qa) compilado contra main y
    ejecutado contra la base de dev; mas un Postgres 16 local desechable con las 85 migraciones para
    los once bancos de simulacion. Produccion solo se miro por metadatos de despliegue; no se leyo
    ni escribio ningun dato de produccion.
  buildVersion: >-
    Mixto — backend NestJS + Lambdas de ingesta/evaluacion + SQL (migraciones 0035-0085) + frontend
    React. MigrationAppBackend "PR #357" (merge 904c6e14) y MigrationAppFrontend "PR #181" (merge
    d3a0127e), mergeados a main el 2026-09-11, mas los PRs posteriores del ticket hasta el 24-sep.
    main despliega en dev; stable (prod) sigue en el 18-ago; la infraestructura CSM OS de prod se
    desplego a mano el 22-sep.
