  - scenarioIndex: 5
    scenarioTitle: "IM-1144 — Downstream verification the query cannot prove on its own: bulk-load field mapping and a post-load spot-check in the org"
    testCaseId: 61ffa05e-889f-4a79-8260-5f44c7a8ce23
    testCaseKey: TC-110
    status: skipped
    duration: 0
    actual: |
      **SKIPPED — fuera del alcance de QA, no pendiente de QA.** Son los dos ítems que el propio test
      plan del PR dejó sin marcar, y los dos exigen una **carga real en un entorno productivo**.
      **QA no valida en producción**: el alcance de esta review son entornos de prueba. Por eso se
      marcan `skipped` (deliberadamente fuera de alcance) y no `not-run` (pendiente de ejecutar).

      **Ítem 1 — mapeo del bulk-load.** El header es correcto en las tres capas y sus tres piezas
      existen en la org (escenario 2: `relationshipName`, objeto destino y campo external-ID
      verificados por describe). Lo que no se puede cerrar desde acá es que la herramienta de
      bulk-load las una en tiempo de carga: se configura fuera de MigrationToolETL y no corre sin una
      migración real. Es el último eslabón entre "el CSV trae el dato" y "el Shop Item tiene su
      vendor".

      **Ítem 2 — spot-check post-carga.** Exige una carga real posterior al merge; hoy el PR está
      OPEN y no hay Shop Items migrados con la columna nueva en ninguna org. La scratch org de
      Auctifera disponible tiene el esquema pero no los datos de Long Island, y expiraba el
      2026-07-31.

      **Mitigación de lo que sí estaba a nuestro alcance:** el riesgo de que el header no resuelva se
      redujo verificando en la org las tres piezas que lo componen (escenario 2), en vez de asumirlas
