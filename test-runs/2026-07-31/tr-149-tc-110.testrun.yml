title: "TR-149 · IM-1144 · TC-110 · Shop Items Vendor lookup — 4/5 PASS · 1 skipped (fuera de alcance: exige carga en producción) · 0 defectos · sin fan-out en 2 fuentes reales (4.706→4.706 y 13→13) · guard ISORGANIZATION probado contra SQL Server real · premisas de plataforma verificadas en la org · HALLAZGO: ningún test protege el conteo de catalogItems contra fan-out"

description: |
  QA de IM-1144 (**Campo Vendor Faltante en Query de Shop Items — Lookup a Organizations No
  Migrado**), bajo el epic **IM-70 Altru Queries**. QA Sub-task: **IM-1157**.
  Cuenta nombrada en el ticket: **Long Island Children's Museum**.

  **PR bajo prueba:** MigrationToolETL [#161](https://github.com/Veevarts/MigrationToolETL/pull/161)
  — `fix/shop-item-vendor-lookup-IM-1144` → `main`. **Estado: OPEN** (+184/−2, 7 archivos).
  Base `09b9adfa` → head `05dbacd`.

  Clasificación: **Mixed** con dominante **SQL-only** — un `OUTER APPLY` nuevo en
  `catalog_item.sql` más el campo correspondiente en entity / mapper / pipeline (13 líneas de TS) y
  tres archivos de test.

  ## ⚠️ La historia no trae Acceptance Criteria formales

  La descripción son cuatro líneas: cuenta, síntoma y *action needed*. **Los cuatro criterios que se
  validan acá los derivó QA** leyendo la descripción y el diff, y quedaron escritos en el TC y en la
  QA Sub-task para que dev/PM los confirmen o corrijan.

  ## ⚠️ La fuente del ticket no es accesible — se corrió contra las disponibles

  **No existe perfil safesql de Long Island Children's Museum.** Por indicación explícita del
  usuario (*"revisa en fuentes disponibles"*) se validó contra las dos fuentes Altru que sí están y
  tienen las tablas necesarias: **`illinois_2`** (4.706 productos) y **`tucson`** (13 productos).
  `aspen` no conecta (el túnel a `localhost:41434` expira a los 20 s).

  **Consecuencia que hay que leer con precisión:** las cifras que el PR reporta (7.007 filas in →
  7.007 out, 100% de cobertura) **NO se re-derivaron**, porque son de Long Island. Lo que sí se
  reprodujo de forma independiente es la **forma** del resultado —sin fan-out, cobertura completa
  donde hay datos— en **dos fuentes distintas**. Las cifras del ticket quedan como *reportadas por
  dev, no verificadas por QA*.

  ## Método

  1. **PRE vs POST del query REAL**: se extrajeron las dos versiones de `catalog_item.sql` desde git
     y se envolvió cada una en un wrapper **agregado** (`, final AS (<query>) SELECT COUNT(*)…`)
     para correr el query completo sin extraer una sola fila de cliente.
  2. **Sondeo de la forma de los datos** antes de concluir nada, para saber qué se puede y qué no se
     puede probar con las fuentes disponibles.
  3. **Fixture de testcontainers** contra SQL Server real para los casos que los datos reales no
     contienen.
  4. **Revert-proof** revirtiendo los 4 archivos de código y dejando los specs.
  5. **Premisas de plataforma verificadas en la org**, no dadas por buenas del body del PR.

  ## Resultado

  **4/5 escenarios PASS · 1 skipped · 0 defectos · 0 hallazgos de seguridad.**
  Los cuatro criterios derivados quedan cubiertos.

  El escenario 5 queda **`skipped`, no `not-run`**: son los dos ítems que el propio PR dejó sin
  marcar (mapeo del bulk-load y spot-check post-carga) y ambos exigen una **carga real en un entorno
  productivo**. **QA no valida en producción** — el alcance de esta review son entornos de prueba —
  así que no son trabajo pendiente de QA sino verificación de despliegue, propiedad del equipo que
  corre la migración. Se dejan documentados para que no se pierdan.

  Se registran **3 observaciones** no bloqueantes (detalle en las notas de cada escenario), de las
  cuales la más accionable es un **hueco de cobertura**: ningún test del repo protege el conteo de
  filas de `catalogItems` contra un fan-out futuro, justo cuando este PR agregó al fixture el
  producto con dos filas de `PRODUCTVENDOR` que sería el disparador.

