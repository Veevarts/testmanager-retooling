  - scenarioIndex: 3
    scenarioTitle: "IM-1144 AC4 — The vendor apply picks deterministically and skips vendors that do not migrate as Organizations, falling back to an older qualifying vendor instead of emitting a dangling id"
    testCaseId: 61ffa05e-889f-4a79-8260-5f44c7a8ce23
    testCaseKey: TC-110
    status: passed
    executedAt: "2026-07-31T01:45:00Z"
    duration: 35
    actual: |
      **Primero, por qué esto NO se puede probar con datos reales.** Se midió la forma de los datos
      en las dos fuentes: **0** productos con más de una fila en `PRODUCTVENDOR`, **0** filas cuyo
      vendor sea una persona, **0** productos sin fila de vendor. Con esa forma, el desempate nunca
      se ejercita, el guard nunca descarta nada, y el `OUTER` no se distingue de un `INNER`. Es
      coherente con lo que el propio PR admite (*"real data is currently 1:1"*).

      **El fixture siembra exactamente el caso difícil.** Dos filas de `PRODUCTVENDOR` para el MISMO
      producto: la de la organización (`ISORGANIZATION = 1`) fechada 2025-01-01, y la de la persona
      (`ISORGANIZATION = 0`) fechada 2025-02-01 — o sea **la persona es la más reciente**.

      Esa construcción es la que discrimina de verdad: si el guard estuviera aplicado como
      post-filtro, el `TOP 1` tomaría primero la fila de la persona por ser la más nueva y luego la
      descartaría → el resultado sería NULL, o peor, el id de la persona. Al estar el JOIN a
      `CONSTITUENT` **dentro** de la subconsulta correlacionada, la persona nunca entra al conjunto
      candidato y el `TOP 1` cae al vendor-organización más viejo.

      **Resultado — corriendo el `catalog_item.sql` REAL contra un SQL Server REAL en contenedor:**

      ```
      npm run test:queries:docker   (el paso EXACTO del CI)
          Test Suites: 8 passed, 8 total
          Tests:       83 passed, 83 total

      catalog_item.sql — Vendor lookup (IM-1144)
        ✓ resolves the latest ORGANIZATION vendor, skipping a newer person vendor
      ```

      Coincide exactamente con lo que reporta el PR (8/8, 83/83).

      ⚠️ **El primer intento fue un FALSO NEGATIVO y conviene dejarlo escrito:** dio 8 suites y 83
      tests en rojo con *"Could not find a working container runtime strategy"* — esta máquina no
      tenía runtime de contenedores. Se levantó `colima` y apuntó `DOCKER_HOST` al socket; entonces
      pasó todo. No era un defecto del PR.

      **Lo que sigue sin probarse, y se declara:** el fixture no siembra dos vendors-organización
      compitiendo por fecha ni un empate exacto que obligue a usar el tercer nivel del `ORDER BY`
      (`pv.ID`). Ese nivel está verificado sólo por contrato de texto. Riesgo bajo, pero es la
      diferencia entre determinista-por-contrato y determinista-probado.
    notes: "AC4. Guard y fallback probados con comportamiento real contra SQL Server. El desempate por pv.ID ante empate exacto de fechas queda cubierto sólo por contrato; se declara."
