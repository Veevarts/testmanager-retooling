environment:
  name: "MigrationToolETL @ fix/shop-item-vendor-lookup-IM-1144 (head 05dbacd, base 09b9adfa) · jest + ts-jest · testcontainers sobre colima con mcr.microsoft.com/mssql/server:2022-latest · safesql (bastion + keychain) contra los perfiles illinois_2 y tucson · scratch org Auctifera computing-power-944-dev-ed (namespace Auctifera) para verificar el esquema destino"
  url: "https://github.com/Veevarts/MigrationToolETL/pull/161"
  buildVersion: >-
    Mixed con dominante SQL-only: un OUTER APPLY correlacionado nuevo en catalog_item.sql (+16/−1)
    más 13 líneas de TypeScript que propagan el campo por entity → mapper → pipeline, y 3 archivos
    de test (+155). Evidencia primaria: PRE vs POST del query real agregado en 2 fuentes Altru,
    fixture de testcontainers contra SQL Server real, revert-proof, y describe de la org para las
    premisas de plataforma.
  notes: |
    ## Solution understood

    `catalog_item.sql` nunca unía `PRODUCTVENDOR`, así que los Shop Items migraban sin vendor — y no
    "vacío": el campo estaba **ausente del query, de la entity, del mapper y de los headers del
    CSV**. Verificado: 0 menciones de `Primary_Vendor` en la versión base, 18 columnas emitidas
    contra 19 en la rama.

    El PR agrega un `OUTER APPLY` correlacionado:

    ```sql
    OUTER APPLY (
        SELECT TOP 1 pv.VENDORID
        FROM PRODUCTVENDOR pv
        JOIN CONSTITUENT vc ON vc.ID = pv.VENDORID AND vc.ISORGANIZATION = 1
        WHERE pv.PRODUCTID = mp.ID
        ORDER BY pv.DATECHANGED DESC, pv.DATEADDED DESC, pv.ID
    ) vendor_latest
    ```

    Tres decisiones, cada una resolviendo un problema distinto:

    **`OUTER APPLY` + `TOP 1` en vez de un JOIN.** `PRODUCTVENDOR` no tiene constraint único sobre
    `PRODUCTID`, así que un JOIN podría multiplicar filas. El APPLY con TOP 1 devuelve como mucho
    una fila por producto, y el `OUTER` preserva los productos sin vendor. Es la decisión que evita
    el riesgo más caro del cambio.

    **El guard `ISORGANIZATION = 1` DENTRO de la subconsulta.** Sólo los constituyentes que son
    organización migran como Account (`account_organizations.sql` filtra igual), así que un vendor
    persona no tendría Account a la cual apuntar. Ponerlo dentro del correlacionado —y no como
    post-filtro— cambia el resultado: el candidato persona nunca entra al conjunto, y el `TOP 1` cae
    al vendor-organización **anterior** en vez de devolver NULL. Eso convierte la semántica de
    "último vendor" en "último vendor que sea organización", que es más de lo que el ticket pedía.

    **El header de relación en vez de una columna de lookup plana.** El campo destino
    `Auctifera__Primary_Vendor__c` es `Lookup(Account)`: no puede resolver un id crudo de Altru. El
    valor se emite como
    `Auctifera__Primary_Vendor__r:Account-Auctifera__Implementation_External_ID__c`, o sea
    relationshipName + objeto destino + campo external-ID, reutilizando el patrón que `sale_item.sql`
    ya usaba para el mismo objeto.

    ## Inferred technical tests

    | Test inferido | Qué prueba | ¿Ejecutable aquí? | Resultado |
    |---|---|---|---|
    | Query real PRE vs POST, agregado | AC1 + AC3: emite la columna y no infla filas | SÍ (2 fuentes) | delta 0 · 100% cobertura |
    | Sondeo de la forma de los datos | qué edge cases contienen las fuentes | SÍ | 0 multi-vendor · 0 personas · 0 sin vendor |
    | Anti-join VENDOR vs CONSTITUENT | la premisa que sostiene el diseño | SÍ | 0 huérfanos en ambas |
    | Diff del set de columnas emitidas | AC3: cambio estrictamente aditivo | SÍ | 18 → 19, +1, −0 |
    | Contrato de 3 capas (SQL/mapper/pipeline) | AC2 | SÍ | misma cadena en las tres |
    | `sf sobject describe` del destino | AC2: la premisa de plataforma | SÍ (org Auctifera) | verificada |
    | Fixture de testcontainers | AC4: guard + fallback | SÍ (tras levantar colima) | 8/8 suites, 83/83 |
    | Revert-proof | que los specs ejercitan el cambio | SÍ | 6/7 caen |
    | Mapeo del bulk-load | que el header resuelva en la carga | **NO** — fuera del repo | not-run |
    | Spot-check post-carga | el lookup poblado en la org | **NO** — necesita carga real | not-run |

    ## Observaciones registradas (ninguna bloqueante)

    1. **[Baja-Media · hueco de cobertura] Ningún test protege el conteo de `catalogItems`.**
       `grep "expect(catalogItems...toHaveLength"` en todo `src/**/*.spec.ts` no devuelve nada. Los
       dos usos de `catalogItems` en el integration spec son ciegos a duplicados: `.find()` toma la
       primera coincidencia y `new Set(.map())` deduplica en silencio. Y este PR **agregó al fixture
       justamente un producto con dos filas de `PRODUCTVENDOR`**, que es el disparador exacto del
       fan-out. Si mañana alguien cambiara el `OUTER APPLY` por un `JOIN`, ese producto daría dos
       filas y **toda la suite seguiría en verde**. No es un defecto —el código de hoy es correcto y
       QA lo midió con datos reales— pero la red de seguridad no existe. Recomendación de una línea:
       `expect(new Set(catalogItems.map(r => lower(r.Auctifera__Implementation_External_ID__c))).size).toBe(catalogItems.length)`.

    2. **[Baja · precisión del PR] El body describe una cadena que el SQL no recorre.** El PR narra
       `PRODUCTVENDOR → VENDOR → CONSTITUENT` y reporta *"0 orphaned PRODUCTVENDOR rows against
       VENDOR"*, pero el query **no une `VENDOR` en ningún momento**: va directo de `PRODUCTVENDOR` a
       `CONSTITUENT`. El resultado es equivalente porque la premisa `VENDOR.ID = CONSTITUENT.ID` se
       sostiene (verificado: 0 filas de `VENDOR` sin `CONSTITUENT` en ambas fuentes), pero la
       evidencia que el PR presenta es sobre una tabla que el query final no toca.

    3. **[Baja · alcance] El desempate puro no está probado por comportamiento.** El fixture siembra
       una organización y una persona, lo que ejercita el guard y el fallback. No siembra **dos
       vendors-organización compitiendo por fecha**, ni un empate exacto que obligue a usar el tercer
       nivel del `ORDER BY` (`pv.ID`). Ese tercer nivel está verificado sólo a nivel de texto. Riesgo
       real bajo, pero es la diferencia entre "determinista por contrato" y "determinista probado".

    ## Nota de método — dos cosas que casi se leen mal

    **El primer rojo del paso docker NO era del PR.** `npm run test:queries:docker` dio 8 suites y 83
    tests en rojo con *"Could not find a working container runtime strategy"*: esta máquina no tenía
    runtime de contenedores. Se levantó `colima`, se apuntó `DOCKER_HOST` al socket, y la suite pasó
    **8/8 y 83/83**, exactamente como reporta el PR. Un lector apurado del primer log habría abierto
    un defecto inexistente.

    **El guard de safesql rechazó el query por "write keywords".** La única coincidencia era la
    palabra **"create" dentro de un comentario** del propio SQL. Se quitaron los comentarios `--`
    antes de enviar; el SQL sigue siendo un `SELECT` puro. **No se usó `--allow-writes`**: el guard
    de sólo-lectura quedó intacto.

