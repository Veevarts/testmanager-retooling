notes: |
  ## Solution understood

  El defecto nacia de derivar la visibilidad del formulario de creacion del contenido de un campo:
  `const isCreating = !editing && form.questionText.length > 0;`. Al vaciar la pregunta principal,
  isCreating pasaba a false y el panel se desmontaba, devolviendo al listado y descartando todo lo
  que el administrador hubiera cargado.

  El arreglo introduce un estado explicito de creacion: `const [creating, setCreating] =
  useState(false)` y `const isCreating = creating && !editing`. Se enciende en openCreate() y se
  apaga en collapseSurveyForm() y en openEdit(). Es exactamente lo que QA habia sugerido al
  reportar la observacion O3 en TR-183.

  Efecto secundario importante y deseado: la validacion "Enter the main survey question." que el
  PR 71 habia agregado era INALCANZABLE en modo creacion, porque el formulario se desmontaba antes
  de que el usuario pudiera pulsar guardar con el campo vacio. Ahora se dispara.

  ## Inferred technical tests

  Es un cambio de interfaz sin API nueva, asi que la prueba no manual es la ejecucion en vivo de
  los cinco ACs sobre el entorno desplegado, con observacion del DOM (montaje del formulario,
  valores de cada campo, posicion y visibilidad del modal, elemento con el foco) y verificacion
  por API del estado persistido al final. Se suman las suites del repo sobre el commit desplegado.

  ## Origen del ticket

  El defecto lo encontro QA como observacion O3 mientras validaba IM-1258 sobre el PR 71 (TR-183).
  Se verifico entonces que la condicion era identica antes y despues de ese PR
  (`4458647c` linea 765 y `4458647c~1` linea 637), por lo que NO se uso para rechazar IM-1258 y el
  dev abrio este ticket aparte. Este run cierra ese ciclo.

