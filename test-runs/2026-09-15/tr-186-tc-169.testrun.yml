  TR-186 · IM-1270 · TC-169 · Survey creation form persistence — 5/5 PASS. Vaciar la pregunta
  principal ya no desmonta el formulario, y la validacion que el PR 71 habia agregado pero era
  inalcanzable en modo creacion por fin se dispara.
