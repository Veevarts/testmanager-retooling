  - testCaseId: 3fdf419b-80e5-4d05-ae2c-c30ab83a7d19
    testCaseKey: TC-159
    scenarioTitle: >-
      AC2 · Household branch is deterministic: household/group clients resolve the primary
      GROUPMEMBER with TOP 1 ORDER BY gm.ID — a group with two ISPRIMARY=1 members cannot
      duplicate the reservation (IM-773 one-row-per-reservation intact: rows == distinct
      external IDs)
    scenarioIndex: 2
    status: passed
    executedAt: "2026-09-03T23:52:00Z"
    duration: 15
    stepResults: []
    actual: |
      Grain verificado live: TotalRows 16,731 == DistinctExternalIds 16,731, en PRE y en POST.
      El LEFT JOIN nuevo no multiplica: las 2 arms son mutuamente excluyentes por ISORGANIZATION,
      arm 1 resuelve por PK y arm 2 usa CROSS APPLY TOP 1; SALESORDER es 1:1 con RESERVATION.

      Docker integration spec (SQL Server 2022 real, 19/19 PASS), tests relevantes:
        ✓ emits exactly one row per seeded RESERVATION (IM-773 completeness)
        ✓ resolves a household client contact through the primary group member (IM-1224)
        ✓ keeps the group contact stable across repeated runs (IM-1224)
      El fixture trae deliberadamente un household con DOS miembros ISPRIMARY = 1, así que un
      join directo a GROUPMEMBER habría duplicado la reserva y estos tests lo habrían atrapado.

      MATIZ HONESTO (no defecto): en Long Island NO existe ningún grupo con más de un
      ISPRIMARY = 1 (medido: 0), así que el TOP 1 ... ORDER BY gm.ID es DEFENSIVO en este
      tenant — la data real no puede probar que sea load-bearing; quien lo ejercita es el
      fixture sintético. Además el propio PR declara que el ORDER BY no es demostrable en
      runtime (mismo plan y misma fila con o sin él sobre data estática) y queda pinneado por
      text assertion, con el test nombrado por lo que realmente comprueba. QA confirma esa
      lectura en vez de darla por buena.

      pre-fix → post-fix → ¿objetivo?: grain 1:1 → grain 1:1 intacto con la rama household
      activa y resolución estable entre corridas → SÍ.
    notes: >-
      **PASS**. Determinismo cubierto por el fixture; en data real el guard es defensivo, lo cual
      queda explícito en la matriz.
    attachments:
      - name: comparison-matrix.txt
        path: attachments/tr-176-tc-159/scenario-2/comparison-matrix.txt
        mimeType: text/plain
        size: 2720

  - testCaseId: 3fdf419b-80e5-4d05-ae2c-c30ab83a7d19
    testCaseKey: TC-159
    scenarioTitle: >-
      AC3 · Example 2 is absent source data, not a defect: Client (Company/Household) is
      byte-unchanged by the PR (12,558 Long Island / 9,525 Illinois) — the empty ones are
      individuals with NO household row in Altru, and emitting anything would dangle the lookup
    scenarioIndex: 3
    status: passed
    executedAt: "2026-09-03T23:50:00Z"
    duration: 15
    stepResults: []
    actual: |
      BYTE-IDENTIDAD PROBADA, no solo mismo conteo:
        CompanyHouseholdFilled: 12,558 PRE = 12,558 POST
        CompanyHouseholdChecksum: **−784683126 PRE = −784683126 POST**
      El checksum es CHECKSUM_AGG(CHECKSUM(external_id, CH)) — depende del PAR (id, valor) de
      cada fila y es independiente del orden, así que un número idéntico prueba que NINGUNA fila
      cambió su Company/Household. Control de sensibilidad: el ContactChecksum SÍ cambia
      (−891088119 → −1252254579), que es justamente el fix.

      COMPOSICIÓN DE LOS 4,173 CH VACÍOS (16,731 − 12,558), verificada en el source:
        4,170 individuos SIN fila CONSTITUENTHOUSEHOLD
            3 individuos CON fila pero HOUSEHOLDID NULL (la proyección usa chh.HOUSEHOLDID)
        4,173 ✓ cuadra exactamente
      Los clients organisation (9,937) y household/group (4) siempre traen CH poblado.

      CONCLUSIÓN SOBRE EL EXAMPLE 2: es ausencia de dato en Altru, no defecto del query. No hay
      household del cual derivar un External ID; account_households.sql solo exporta ISGROUP = 1,
      así que emitir algo colgaría el lookup. Poblarlo es un paso POST-LOAD desde el AccountId
      que NPSP crea al cargar el Contact.

      MATIZ QA para el follow-up: de los 4,170 individuos sin fila de household, 3 SÍ son miembros
      de algún constituent ISGROUP = 1 vía GROUPMEMBER. El PR afirma "0 of them reach a household
      group through GROUPMEMBER" — la diferencia es de alcance (mi consulta mira cualquier grupo,
      el PR probablemente solo los de tipo household). No cambia el veredicto porque el campo está
      byte-idéntico y fuera del scope del PR, pero conviene mirarlo al abrir el ticket del
      post-load.

      pre-fix → post-fix → ¿objetivo?: CH poblado en 12,558 filas → exactamente las mismas 12,558
      con los mismos valores, y los vacíos explicados por ausencia en el source → SÍ.
    notes: >-
      **PASS** en el sentido de "no regresiona y el Example 2 queda explicado con datos". El
      ticket pedía ambos campos: la respuesta al reportante (post-load, no cambio de query) queda
      como riesgo abierto a validar con Paula / el IE.
    attachments:
