      integration 19/19 covering the four client combinations, revert-proof (ELSE NULL → 3 tests
      fail), and the two text-assertion-only guards flagged (ISGROUP+ISCONSTITUENT, ORDER BY)
    scenarioIndex: 5
    status: passed
    executedAt: "2026-09-03T23:40:00Z"
    duration: 25
    stepResults: []
    actual: |
      En PR HEAD 940af02:
        rental-event-query.spec.ts (estático): 44/44 PASS (7 nuevas IM-1224), 0.26s.
        rental-event-query.integration.spec.ts (docker, SQL Server 2022): 19/19 PASS, 60.5s.
        Suite completo query-regression: 621 passed / 175 skipped (docker-gated) / 0 failed.
        npm run lint:check: limpio. npm run build (nest): OK.

      Las 4 combinaciones de cliente que pide el ticket están cubiertas por el docker spec:
      contact+household, household only, contact only, y neither → '[ANONYMOUS_CONTACT]'.

      MATRIZ DE MUTACIONES EJECUTADA POR QA (cada una revertida; repo limpio al final):
        1. revert del fix (ELSE NULL):                estático 2 FAIL · docker 3 FAIL  ✓ pinneado
        2. quitar relc.ISGROUP + relc.ISCONSTITUENT:  docker 19 PASS → NO detectado (gap)
        3. quitar ISORGANIZATION en ambas arms:       docker 2 FAIL  ✓ data-backed

      HALLAZGO sobre el gap: el PR body declara que quitar ISGROUP+ISCONSTITUENT "passes —
      knowingly pinned by text assertion only", y QA lo confirmó ejecutándolo. PERO los dos
      commits posteriores al cuerpo del PR (ab66fca, 940af02) SÍ hicieron data-backed la cláusula
      ISORGANIZATION en ambas arms — la mutación 3 rompe 2 tests. O sea el gap real es MÁS CHICO
      que lo que dice el PR body. Impacto práctico bajo: el guard está correcto en el query, el
      spec estático asserta su presencia literal, y en Long Island 0 contactos dependen de esas
      dos cláusulas hoy.

      docs/altru-model-context.md (+37): agrega la regla de contact-resolution por tipo de client,
      el hallazgo de household-absence y los counts medidos. Scope-fit exacto, sin scope creep.

      Nota de entorno: el integration spec no declara .withStartupTimeout y el default de
      testcontainers (60s) no alcanza para SQL Server 2022 en colima (~81s). Se aplicó un patch
      LOCAL de 300s solo para poder correr y se revirtió; el repo quedó limpio. No es un hallazgo
      del PR.
    notes: >-
      **PASS**. Gates verdes y fix pinneado por mutación; los 2 gaps de cobertura quedan
