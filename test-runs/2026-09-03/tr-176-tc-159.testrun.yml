      esta sesión y el tenant del ticket es Long Island. Los números de Illinois del PR body
      quedan como evidencia del dev, no re-verificada por QA — no afecta el veredicto.

      pre-fix → post-fix → ¿objetivo?: 40.6% con contacto, Example 1 reproducido → 95.4% con el
      4.6% restante clasificado como ausencia real en Altru → SÍ.
    notes: >-
