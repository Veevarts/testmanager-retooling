key: TR-176
title: >-
  TR-176 · IM-1224 · TC-159 · rental_events_groups.sql resuelve Client (Contact) para todo tipo
  de client de Altru — 5/5 PASS con validación LIVE del tenant: 6,790 (40.6%) → 15,962 (95.4%)
  reconciliado contra el source, Company/Household byte-idéntico por checksum, grain 1:1 intacto.
  Estático 44/44 + docker 19/19 + suite 621 + 3 mutaciones.
status: completed
environment:
  name: >-
    Repo Veevarts/MigrationToolETL clonado local en HEAD del PR "#179" (branch
    CamiloSalgueroMarin/IM-1224-rental-events-client-mapping, commit 940af02, merge-base
    51c84e7 = origin/main). Node + npm locales; docker vía colima para el integration spec
    (SQL Server 2022, testcontainers). safesql live sobre el profile qa_longisland →
    migration-db.rtl.veevartapp.com:14772, DB Long-Island-Children-s-Museum_db_7 (el tenant
    del ticket), read-only puro (este query NO requiere --allow-writes).
  url: https://github.com/Veevarts/MigrationToolETL/pull/179
  buildVersion: >-
    Classification: SQL + specs + docs (+492/-7, 5 files). rental_events_groups.sql (+102) gana
    el CTE ReservationClientContacts (2 arms) y la rama ELSE del CASE de
    Auctifera__Client_Contact__c; rental-event-query-fixture.ts (+144),
    rental-event-query.integration.spec.ts (+118, docker), rental-event-query.spec.ts (+98,
    estático) y docs/altru-model-context.md (+37). PR OPEN, base main.
  notes: |
    ## Solution understood

    El Client (Contact) de una reserva NO siempre es el constituent de la sales order. La regla
    completa vive en el propio stored procedure de Altru `dbo.USP_RESERVATION_GETCONTACTINFO`
    (leído por el dev desde sys.sql_modules en el backup de Long Island) y ramifica por el tipo
    de constituent del CLIENT:
      - individual   → el contacto es el client mismo;
      - organisation → el contacto es obligatorio y se guarda en la orden como
        SALESORDER.CONTACTRELATIONSHIPID, resuelto a RELATIONSHIP.RECIPROCALCONSTITUENTID;
      - household/group → el contacto es el GROUPMEMBER primario (ISPRIMARY = 1).

    rental_events_groups.sql implementaba SOLO la primera rama y emitía NULL para las otras dos;
    SALESORDER.CONTACTRELATIONSHIPID no se referenciaba en NINGÚN lado del repo. Ese es el
    Example 1 del ticket (CH poblado, Contact vacío) y es la mayoría del dato.

    El fix agrega el CTE ReservationClientContacts con las 2 arms faltantes (mutuamente
    excluyentes por ISORGANIZATION, joins por PK, CROSS APPLY TOP 1 ORDER BY gm.ID en la rama
    household) y lo lee desde la rama ELSE del CASE con CAST a NVARCHAR(36) (IM-770: el CASE
    mezcla el literal '[ANONYMOUS_CONTACT]' con uniqueidentifier; sin CAST la expresión resuelve
    a uniqueidentifier y mata el export streamed en la primera fila placeholder). Ambas arms
    filtran el contacto resuelto al shape exacto que exporta contact.sql para no colgar el
    lookup, y el relationship se lee AS STORED (sin filtrar ISCONTACT ni rango de fechas, porque
    Altru solo los valida al EDITAR el contacto y la reserva sigue mostrando lo que registró).

    El Example 2 del ticket (Contact poblado, CH vacío) NO se corrige aquí, con justificación
    medida: Client (Company/Household) es el propio org/grupo para clients no-individuales y
    CONSTITUENTHOUSEHOLD.HOUSEHOLDID para los individuales, y viene vacío porque esos individuos
    NO tienen household en Altru. account_households.sql solo exporta constituents ISGROUP = 1,
    así que no hay Account con external ID derivable — emitir algo colgaría el lookup. Poblarlo
    requiere un paso POST-LOAD desde el AccountId que NPSP crea al cargar el Contact.

    ## Inferred technical tests

    - **jest estático (rental-event-query.spec.ts, 7 assertions nuevas)** → auto-ejecutado.
      44/44 PASS. Pinnea expresiones, guards, CAST y el LEFT JOIN por reservation id.
    - **jest docker integration (rental-event-query.integration.spec.ts, 6 tests nuevos, 19 en
      total)** → auto-ejecutado contra SQL Server 2022 real. 19/19 PASS. Cubre las 4
      combinaciones de cliente del ticket con valores, no solo forma.
    - **jest suite completo query-regression** → auto-ejecutado. 621 passed / 175 skipped
      (docker-gated) / 0 failed — matchea lo declarado por el dev.
    - **safesql PRE vs POST sobre el tenant real** → auto-ejecutado con un wrapper agregado: el
      query REAL corre completo y solo se envuelve el SELECT final en una derived table que
      proyecta contadores y CHECKSUM_AGG. Numérico, sin traer PII al repo.
    - **Reconciliación source-side independiente** → auto-ejecutada: reparto de las 16,731
      reservas por tipo de client, clasificación de las que siguen sin contacto, fan-out real,
      contactos descartados por el anti-dangle, relationships no vigentes y composición de los
      CH vacíos.
    - **Matriz de mutaciones QA (3 mutaciones)** → auto-ejecutada, cada una revertida.
    - **lint + build** → auto-ejecutados, verdes.
    - **Carga a org / UI** → N/A: cambio SQL-only; el load es upsert del IE, fuera de scope QA.

