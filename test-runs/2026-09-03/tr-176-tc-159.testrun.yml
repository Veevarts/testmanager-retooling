    stepResults: []
    actual: |
      Ejecutado LIVE por QA sobre el tenant del ticket (qa_longisland).

      PRE-fix (merge-base 51c84e7): 16,731 filas, ContactFilled 6,790 (40.6%).
      POST-fix (HEAD 940af02):      16,731 filas, ContactFilled 15,962 (95.4%).
      Coincide dígito a dígito con la tabla del PR body.

      RECONCILIACIÓN INDEPENDIENTE contra el source (verify-client-types.sql):
        Reparto de las 16,731 reservas: 9,937 organisation (9,169 con CONTACTRELATIONSHIPID),
        6,790 individual, 4 household/group, 0 sin constituent.

        El POST-fix queda completamente explicado:
             6,790 individuales (rama preexistente)
        +    9,169 organisation resueltos por la rama nueva
        +        3 households resueltos por primary GROUPMEMBER (4 − 1 sin primary exportable)
        =   15,962  ✓ exactamente el número medido

        Las 769 restantes, clasificadas una a una: 768 organisation sin CONTACTRELATIONSHIPID
        (Altru tampoco registra contacto) + 1 household sin primary member exportable.
        769 = 16,731 − 15,962 ✓

      El Example 1 del ticket es exactamente el caso organisation: 9,937 reservas llevaban CH
      poblado y Contact vacío PRE-fix; 9,169 quedan con ambos POST-fix.

