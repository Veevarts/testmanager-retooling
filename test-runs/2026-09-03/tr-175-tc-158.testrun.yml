key: TR-175
title: >-
  TR-175 · IM-1220 · TC-158 · visitor_management.sql = UNION de los 3 ticketing date
  sources — 5/5 PASS con validación LIVE sobre el tenant real (Long Island): 5 fechas del
  ticket recuperadas (0 rows PRE), completeness 0 dangling / 0 surplus sobre 4,945 fechas,
  diff 56 added / 3 removed / 4,889 intactas = contrato advertido exacto. Spec 24/24 +
  suite 620 + revert-proof.
status: completed
environment:
  name: >-
    Repo Veevarts/MigrationToolETL clonado local en HEAD del PR "#178" (branch
    CamiloSalgueroMarin/IM-1220-visitor-mgmt-missing-dates, commit 85e0145, merge-base
    fd87da7 = origin/main). Node + npm locales, jest estático (sin docker — el spec nuevo
    no es integration). safesql live sobre profile nuevo qa_longisland →
    migration-db.rtl.veevartapp.com:14772, DB Long-Island-Children-s-Museum_db_7 (el
    tenant del ticket), read-only + CREATE TABLE tempdb (--allow-writes por los "#Vm*"
    staging tables, trait advertido por el PR).
  url: https://github.com/Veevarts/MigrationToolETL/pull/178
  buildVersion: >-
    Classification: SQL + spec + docs (+688/-48, 3 files): visitor_management.sql
    reescrito como UNION de 3 brazos con staged temp extraction (MAIN FIX, +338),
    visitor-management-query.spec.ts nuevo (+394, 24 assertions), docs/altru-model-context.md
    (+4, contrato row-grain + lineage). PR OPEN, base main, "Do not merge - opened for
    review only".
  notes: |
    ## Solution understood

    Bug: visitor_management.sql (intacto desde IM-103) derivaba sus fechas con UNA regla
    (sales orders con gate EXISTS SALESORDERITEMTICKET), mientras los 3 children de
    Ticketing resuelven su lookup Auctifera__Visitor_Management__c sobre poblaciones que
    el parent no veía:
      - ticketing_only_program.sql: COALESCE(RESERVATION.ARRIVALDATE, earliest ticket
        EVENT.STARTDATE, SALESORDER.TRANSACTIONDATE) — el parent nunca joineaba RESERVATION.
      - ticketing_only_event.sql: misma expresión sobre orders sin ticket line — el gate
        EXISTS del parent las excluía.
      - ticketing_direct_registrant.sql: EVENT.STARTDATE de REGISTRANT directo — sin
        SALESORDER en ninguna parte.
    Toda fecha que un child deriva y el parent no emite = lookup dangling → el operador
    la crea a mano (las 5 del ticket: 9/26/2024, 7/3/2026, 8/7/2026, 8/20/2026, 8/21/2026).

    Fix: el parent pasa a ser el UNION de las expresiones de lookup de los 3 children,
    cada brazo reproduciendo population gate, expresión y window de su child. Staged
    "#Vm*" temp extraction (patrón membership_transactions.sql/IM-1161) porque la forma
    single-statement no terminaba en 900s; ~27s vs 71.6s pre-change (2.6x más rápido
    cubriendo 3 poblaciones). Brazo 1 deliberadamente unwindowed (el child neutered su
    window en IM-791 — superset es la dirección segura: surplus inerte, missing rompe).
    Contrato: 56 fechas added / 3 removed (4,892 → 4,945); las 3 removidas no las
    referencia ningún child; External ID byte-idéntico en sobrevivientes; loads upsert
    por Implementation_External_ID__c → los registros manuales de Paula simplemente
    matchean, nada se borra en org.

    ## Inferred technical tests

    - **jest spec nuevo (visitor-management-query.spec.ts, 24 assertions)** → auto-ejecutado.
      24/24 PASS en PR HEAD. Estático (parsea SQL con text anchors) — sin docker.
    - **jest full query-regression** → auto-ejecutado. 620 passed / 169 skipped
      (docker-gated) / 0 failed — matchea lo declarado por el dev.
    - **Revert-proof (trampa event-arm)** → auto-ejecutado. Mutar el brazo event a la
      window expression (el hazard del primer commit: 21 rows / 14 fechas dangling) rompe
      "reproduces the child date expression verbatim" (1 failed / 23 passed); restaurado
      24/24.
    - **safesql PRE vs POST en el tenant real** → auto-ejecutado (tras crear el profile
      qa_longisland con el endpoint vigente de la Migration App; los profiles
      preexistentes apuntaban a hosts DB stale — causa raíz de los DEFERRED tipo
      TR-150/170/171). PRE 4,892 / POST 4,945 / added 56 / removed 3 / kept 4,889.
    - **Completeness parent↔children** → auto-ejecutado, verificación INDEPENDIENTE de QA:
      los 3 children corridos verbatim (wrappers SELECT DISTINCT del lookup) → union
      referenciada 4,945 = parent POST; DANGLING 0 / SURPLUS 0.
    - **Mecanismo por brazo (verify-arms-a.sql)** → auto-ejecutado: las 4 fechas 2026
      tienen exactamente 1 RESERVATION con ese ARRIVALDATE y 0 SALESORDER transactadas ese
      día; 2024-09-26 la referencia SOLO el child direct-registrant. El conteo exacto de
      291 rows queda con fuente dev + reviewer (el wrapper QA deduplica fechas).
    - **lint + build** → auto-ejecutados, verdes.
    - **UI / org load** → N/A: cambio SQL-only; el load a org es upsert del IE, fuera de
      scope QA (no prod).

