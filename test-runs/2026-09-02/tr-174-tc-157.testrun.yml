key: TR-174
title: >-
  TR-174 · IM-1217 · TC-157 · 3 recurring donation queries emiten NPSP-loadable installment
  schedule (CASE FREQUENCYCODE + InstallmentFrequency never null + RecurringType gate on
  NUMBEROFINSTALLMENTS + planned=0 para Open) — 5/5 PASS + 1 DEFERRED (safesql). Sev 1 -
  Business Stopping. Static 18/18 + query-regression 614/614 (matches dev) + revert-proof 1/18.
status: completed
environment:
  name: >-
    Repo Veevarts/MigrationToolETL clonado local en HEAD del PR #177 (branch
    CamiloSalgueroMarin/IM-1217-recurring-donation-installments, commit ed2c5164, base main).
    Node 25.4 + npm 11.7. safesql tool silent tunnel fail esta sesión (mismo pattern que
    TR-171/172/173). No docker integration spec added por este PR (solo 1 nuevo static spec).
  url: https://github.com/Veevarts/MigrationToolETL/pull/177
  buildVersion: >-
    Classification: SQL-only query fix (+816/-32). 4 files: 3 SQL principales
    (recurring_donation.sql +188/-8, recurring_membership.sql +122/-8, all_recurring.sql
    +286/-16), 1 spec nuevo (recurring-donation-installment-schedule-query.spec.ts +211,
    18 tests), 1 docs (altru-model-context.md +9). PR OPEN mergeable, base main.
  notes: |
    ## Solution understood

    Bug: los 3 queries de recurring donations hardcodearon 2 de los 3 campos NPSP del schedule
    y copiaron el 3ro directo de Altru:

      rs.FREQUENCY AS npe03__Installment_Period__c,   -- raw Altru text (ej 'Annually')
      NULL          AS npe03__Installments__c,
      NULL          AS npsp__InstallmentFrequency__c,

    Failure chain concreta en Illinois (2026-09-01 dry run: 41 procesados / 37 fallaron):
      - RD2_ValidationService rechaza `Installment Period` fuera del picklist NPSP
        (Monthly/Yearly/Weekly/1st and 15th/Daily) → 'Annually' → 34 rechazos
      - Number of Planned Installments < Number of Paid Installments → 3 rechazos
      - Total: 37 de 37 con NPSP__Error__c rows registrados

    Fix (3 queries):
      1. CASE FREQUENCYCODE → mapeo a NPSP valid values:
         0 Annually → Yearly | 1 Semi-annually / 2 Quarterly / 3 Monthly / 6 Bimonthly → Monthly
         5 Single Installment → Yearly | 7 Semi-monthly → 1st and 15th | 8 Biweekly → Weekly
      2. npsp__InstallmentFrequency__c = multiple correspondiente (Quarterly ×3, etc.),
         never null, always 1-20.
      3. npsp__RecurringType__c = 'Fixed' ONLY when NUMBEROFINSTALLMENTS > 0 (narrowed gate).
         Antes el gate era ENDDATE IS NOT NULL — pero en Altru ENDDATE significa "agreement
         ended" (ya captured por npsp__Status__c = 'Closed'), NOT "fixed length".
      4. npe03__Installments__c = 0 para Open (never blank — blank en CSV upsert = "leave
         unchanged" y strandea 53 valores existentes en Illinois con validation error).

    Nueva CTE `LinkedInstallmentOpportunities` mirrors donation_transaction.sql's
    RecurringGiftPaymentSourceLineItems para bound la count correctamente (RECURRINGGIFTINSTALLMENT
    alone no basta — en high_desert 24 de 76 rows link más payments que installment rows).

    Impacto (dev safesql 2026-09-02):
      Illinois: 79 rows / 79 external ids PRE=POST (1:1 match con prod)
        Installment periods: 34 Annually PRE → 45 Monthly + 34 Yearly POST (100% NPSP-valid)
        Installment frequency: 79 × 1 POST (0 null, 0 out-of-range)
        RecurringType: 79 × Open POST (was 43 Fixed / 36 Open bajo ENDDATE gate)
        Planned installments: 79 × 0 POST (0 nulls, no stranding)
        RD2_NumberInstallmentsNotAllowedWhenOpen violations: 0
        Legacy Maximum_Donations = 50 violations: 2 PRE → 0 POST
        Phantom Opportunities minted en fresh legacy insert: 627 PRE → 0 POST

    Cross-profile (dev): longisland 20 rows, high_desert 76 rows — 0 Fixed rows POST, 0
    violations en cada uno.

    Fuera de scope del PR (documented en altru-model-context.md, needs separate tickets):
      - Day_of_Month__c cross-tenant issue (Illinois vs high_desert restricted picklists)
      - Picklist dependency (Weekly, 1st and 15th no ofrecidos en Illinois/high_desert;
        exposure 0 rows today)

    ## Inferred technical tests

    - **jest static spec (recurring-donation-installment-schedule-query.spec.ts, 18 tests)** →
      auto-ejecutado. 18/18 PASS on PR branch. Pinnean cada aspecto: CASE FREQUENCYCODE mapping,
      InstallmentFrequency never null, RecurringType gate on NUMBEROFINSTALLMENTS, planned=0
      para Open, LinkedInstallmentOpportunities mirror consistency con donation_transaction.sql.
    - **jest full query-regression (614 tests)** → auto-ejecutado. 614/614 PASS local — matches
      dev PR body byte-a-byte (47 suites, 614 tests, 18 new).
    - **Revert-proof** → auto-ejecutado. Revertir el CASE FREQUENCYCODE mapping en
      recurring_donation.sql a `rs.FREQUENCY AS npe03__Installment_Period__c`: 1/18 test FAIL
      exactamente donde pinnea `expect(sql).not.toMatch(/rs\.FREQUENCY AS npe03__Installment_Period__c/)`.
      17/18 PASS bajo revert. Confirma que el test atrapa el bug.
    - **safesql aggregate wrapper** → PREPARADO pero NO ejecutable esta sesión. Mismo pattern
      que TR-171/172/173 (safesql silent tunnel fail; bastion sí up via SSH directo). Wrapper
      en scenario-1/aggregate-wrapper.sql — corre cuando el tool restaure.
    - **Docker integration** → N/A. Este PR no agrega integration specs (solo 1 nuevo static
      spec). Dev PR body no menciona integration tests.

