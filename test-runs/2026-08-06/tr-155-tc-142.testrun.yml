key: TR-155
title: 'TR-155 · IM-1161 · TC-142 · 3/6 PASS · 2 FAIL · 1 handoff — el staging y el contrato de salida son
  correctos, pero los dos hints que SON el arreglo no están protegidos por ningún test'
description: |-
  Ejecución de TC-142 sobre **MigrationToolETL#164** (`fix/membership-transactions-query-timeout-IM-1161` →
  `main`, OPEN, +1327/−283). Clasificación: **Mixed** — SQL (dos archivos de query) + backend (config del
  `SqlServerAdapter`) + specs de regresión.

  **Veredicto: 3/6 PASS · 2 FAIL · 1 not-run (handoff) · 0 defectos de comportamiento · 3 huecos de regresión.**

  ## Resumen de la solución

  La causa raíz no es el timeout que dice el título del ticket: es un **memory grant (error 8645)**. La query
  pedía ~1.8 GB donde la instancia concede ~154 MB, así que **nunca completó en ningún tenant y devolvía cero
  filas para todos los clientes**. El PR parte la cadena `WITH` en 15 `SELECT … INTO #Cte` —cada statement
  obtiene su propio grant— indexa cada temp por su clave de sondeo, pone
  `OPTION (LOOP JOIN, MAX_GRANT_PERCENT = 5)` en el ensamblado final, y sube el `requestTimeout` del adapter de
  120 s a 30 min configurables para que la query completada alcance a llegar a la app.

  ## Lo que quedó bien probado

  - **Contrato de salida intacto**: 35 columnas, mismos nombres y mismo orden, en las dos ramas del `UNION ALL`,
    idéntico al merge-base. `SELECT … INTO` no emite recordset, así que el extractor sigue viendo un único result
    set y `executeQueryAsStream` no necesita cambios.
  - **Estructura**: 15 staged / 15 índices emparejados 1:1, 30 `DROP TABLE IF EXISTS` (15 al inicio + 15 al
    final, mismo conjunto y mismo orden), `SET NOCOUNT ON`, sin `GO`, **cero temp tables globales** y **cero DDL
    alcanzando un objeto persistente del cliente**.
  - **La guarda de pares de CTEs compartidos ES load-bearing**: mutando dentro de un CTE realmente compartido,
    salta en los **dos** sentidos —desde el archivo staged y desde el que no migró—. Es el riesgo real de este PR,
    porque los dos archivos quedaron en formas distintas, y está cubierto.
  - **Premisa de unicidad re-derivada, no heredada**: `tucson` 295.486/295.486 e `illinois_2` 191.630/191.630,
    `DuplicateExcess = 0` en ambos. Coinciden dígito a dígito con lo que reporta el dev.

  ## Los dos FAIL — ninguno es un defecto de comportamiento, los tres son huecos de regresión

  El código entregado es correcto en todo lo que pude medir. Lo que falla es que **lo más frágil del arreglo no
  está protegido**:

  1. **Los hints no están asegurados por ningún test.** Borrar `OPTION (LOOP JOIN, MAX_GRANT_PERCENT = 5)` deja
     la suite en 33/33 verde. Cambiar el `5` por `25`, también. Y esos hints **son** el arreglo: la propia tabla
     del PR muestra que `LOOP JOIN` solo → error 8645, `MAX_GRANT_PERCENT` solo → error 8645, y solo la
     combinación completa 164.465 filas. Si un refactor futuro borra esa línea, vuelve el bug original —cero
     filas para todos los clientes— y **la suite no se entera**. Lo mismo con el bloque `DROP` inicial, que el
     propio PR describe como *"load-bearing, not redundant"*.
  2. **`parseTimeoutMs` no tiene cobertura.** Quitar el guard `&& parsed > 0` deja los 4 tests verdes. Importa
     porque `0 ?? 1_800_000` es **0** —`??` no cae al default en cero— y `Number('')` también es 0, así que una
     variable de entorno declarada pero vacía bastaría. `mssql` lee `requestTimeout: 0` como **sin límite**: una
     query colgada retendría su conexión del pool compartido para siempre, que es estrictamente peor que el bug
     original de 120 s.

  Búsqueda exhaustiva en todo el repo: `MAX_GRANT_PERCENT`, `LOOP JOIN`, `DROP TABLE IF EXISTS` y `NOCOUNT`
  aparecen en **cero aserciones**. `CREATE NONCLUSTERED INDEX` aparece solo como delimitador de parseo del helper
  `readStage`, no como aserción. Los tres arreglos son de pocas líneas y están redactados en los adjuntos.

  ## Lo que QA no puede ejecutar (escenario 6, handoff)

  La query staged **no puede pasar por safesql**: el guard de solo-lectura casa con `DROP` y `CREATE`, y el script
  trae 30 + 15. Correrla exigiría `--allow-writes`, que está prohibido — la guarda está funcionando como debe, no
  es un obstáculo a sortear. Además no existen perfiles `longisland` ni `high_desert`, donde el PR midió, y el
  techo de 120 s de safesql es menor que los 488–1485 s medidos. Queda como pendiente del dev, con el detalle en
  el adjunto.

  Dos cosas concretas quedan pedidas ahí: **la mitigación que el propio PR se autoimpone** (correr en dos tenants
  más antes de desplegar el `LOOP JOIN` forzado, hoy medido en 2 de 9) y **revisar si el staging movió el CTE no
  determinista** — porque el PR sí tocó `OrderBackedMembershipFinancialTransactions`, lo materializó con índice, y
  materializar cambia el plan, que era justo lo que hacía arbitrario al ganador.

  ## Falso positivo descartado

  La suite completa deja 1 suite en rojo (10 tests, `donation-transaction-recurring.spec.ts`, *"Could not find a
  working container runtime strategy"*). **No es del PR**: ejecuté ese mismo spec sobre el merge-base y fallan los
  mismos 10, con el mismo error. Ambiental y preexistente. Comprobado, no asumido.
