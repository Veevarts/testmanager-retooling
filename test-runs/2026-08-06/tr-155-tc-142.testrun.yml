  notes: |-
    ## Solution understood

    La query de extracción de Opportunities de membresía fallaba por memory grant (error 8645, pool `internal`),
    no por runtime: pedía ~1.8 GB donde la instancia concede ~154 MB a una sola query. Como SQL Server inlinea
    cada referencia a un CTE, la cadena `WITH` completa se planificaba como un solo statement gigante.
    El PR la parte en 15 `SELECT … INTO #Cte`, de modo que cada statement pide su propio grant y cada grant cabe;
    indexa cada temp por la clave que después se sondea; y fuerza `LOOP JOIN` con `MAX_GRANT_PERCENT = 5` en el
    ensamblado final para que el request se conceda de inmediato en vez de quedar en el semáforo de recursos.
    En paralelo sube el `requestTimeout` del adapter de 120 s fijos a 1.800.000 ms configurables, porque una
    corrida real tarda 488–1485 s y el timeout viejo la abortaba antes de que llegara una sola fila.
    Efecto lateral esperado y declarado: el pool es compartido, así que una query genuinamente colgada retiene su
    conexión 30 min en lugar de 2.

    ## Inferred technical tests

    - Estructura del .sql staged vs merge-base (contrato de salida, drops, índices, aislamiento) — AUTO, escenario 1.
    - Ubicación y protección de los hints de plan, por mutación — AUTO, escenario 2.
    - Config de timeout del adapter y sus bordes negativos, por mutación — AUTO, escenario 3.
    - Suite de regresión de queries + guarda de pares de CTEs compartidos, por mutación — AUTO, escenario 4.
    - Premisa de unicidad de SALESORDER.REVENUEID por agregados — AUTO (safesql), escenario 5.
    - Corrida end-to-end, conteo de filas y tiempos — MANUAL: la query staged no puede pasar por safesql
      (WRITE_KEYWORDS casa con DROP/CREATE) y no existen los perfiles donde el PR midió. Escenario 6.
