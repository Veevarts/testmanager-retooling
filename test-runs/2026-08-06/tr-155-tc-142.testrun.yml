    Es el hueco que más importa. Demostración en runtime:

      MSSQL_REQUEST_TIMEOUT_MS=""   sin_guard-> 0    con_guard-> 1800000
      MSSQL_REQUEST_TIMEOUT_MS="0"  sin_guard-> 0    con_guard-> 1800000
      MSSQL_REQUEST_TIMEOUT_MS="-5" sin_guard-> -5   con_guard-> 1800000

      0 ?? 1800000 === 0   <- `??` NO cae al default en cero

    Y `mssql` interpreta `requestTimeout: 0` como SIN LÍMITE. Como `Number('')` también es 0, una variable
    declarada pero vacía —el caso típico de un despliegue mal configurado— bastaría. Si alguien "simplifica" ese
    guard, una query colgada retiene su conexión del pool compartido para siempre: peor que el bug original.
  notes: Evidencia en attachments/tr-155-tc-142/scenario-3/timeout-config-and-zero-hazard.txt
