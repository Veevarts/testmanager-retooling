  name: >-
    Interfaz y API desplegadas en https://migration.dev.rtl.veevartapp.com (API
    zu76ogw8dg.execute-api.us-east-1.amazonaws.com/dev/api), rol Admin con "View as:
    Valentina Aray" (ownerId 005Vs000005Dh2fIAC). El riesgo R6 se materializo: la primera
    carga servia un index.html cacheado (index-DTlapIiO.js) mientras el index vivo apuntaba
    a index-Cept_9p_.js. Se limpio y se recargo; todo lo que sigue se midio sobre el build
    vivo. Ninguna organizacion de Salesforce fue tocada; nada de produccion.
  buildVersion: >-
    Mixed — backend NestJS sobre Aurora (main e3de5d2, incluye "PR #379", "PR #385",
    "PR #388" y "PR #390") mas frontend React del modulo CSM (main 167bcae, incluye
    "PR #195" a "PR #203"). La rebanada de esta historia es funcional de interfaz y de API.
    El entorno esta POR DELANTE de la lista que el ticket declara final.
