notes: |
  ## Solution understood

  La historia pedia un sitio para el trabajo que no cabe ni en una sugerencia de la IA ni en
  un caso de Salesforce — el ejemplo del ticket es "llamar a este cliente manana". Lo
  entregado es una pestana de tareas propia, con formulario de creacion manual, tablero de
  tres columnas con arrastre, pestanas de abiertas/terminadas/eliminadas con borrado suave,
  y dos filtros del lado del servidor.

  El cambio con mas historia detras es el de la propiedad de la tarea. Una tarea sin cuenta
  no tiene de donde heredar dueno, asi que el servidor intentaba el `ownerId` del cuerpo y
  despues el correo del usuario autenticado, y devolvia 400 si ninguno resolvia. El cliente
  nunca enviaba `ownerId`. El "PR #197" hizo que lo enviara — y solo cuando no hay cuenta,
  porque `ownerId` junto a `accountId` es a su vez un 400. Eso cerro ademas una asignacion
  silenciosa: bajo view-as el fallback por correo resolvia al MANAGER, asi que una tarea
  creada mientras se miraba a otro CSM caia en la lista del manager.

  El segundo es el del tablero. El movimiento es optimista: la tarjeta aterriza al soltarla,
  antes de que el servidor conteste, y revierte mostrando el mensaje del servidor si la
  escritura falla. Y el "PR #390" abrio `Done -> In_progress` en la maquina de estados,
  porque el tablero ofrecia ese arrastre y la maquina lo rechazaba con un 409 que el CSM
  veia como la tarjeta volviendo sin explicacion.

  ## Inferred technical tests

  Cuatro frentes, los cuatro ejecutados aqui; ninguno quedo pendiente de una persona.

  1. **La interfaz desplegada**, para lo que el CSM ve y toca: las pestanas, el formulario
     con sus seis campos, los seis arrastres reales entre columnas, los filtros, el ciclo de
     completar/reabrir/borrar/restaurar y el explorador del pool.
  2. **La API desplegada**, para lo que la pantalla no dice: el cuerpo exacto de cada POST,
     el estado releido despues de recargar, y los rechazos. Este ticket ya se certifico una
     vez leyendo el cliente, asi que aqui ningun criterio que dependa de una escritura se
     califica sin mirar la respuesta.
  3. **Las suites del equipo**: vitest del frontend, jest del modulo de tareas del backend, y
     el harness que ejecuta los adaptadores contra un Postgres 16 real en vez de mockear el
     Data API.
  4. **Una mutacion**, para que el verde signifique algo: revertir el "PR #390" y comprobar
     que el harness se pone rojo con el 409 exacto del defecto.

  ## Reproducir el defecto antes de dar el arreglo por bueno

  El criterio de la tarea sin cuenta no se dio por cumplido porque la tarea se creara. Se
  repitio la llamada QUITANDO `ownerId`, que es literalmente lo que el cliente enviaba antes
  del arreglo, y el servidor sigue devolviendo 400 con el mismo mensaje del ticket. El
  servidor nunca cambio: el arreglo fue que el cliente empezara a mandar el dato. Con esa
  medicion, el 201 de hoy dice algo; sin ella, solo diria que hoy funciona.

  ## El entorno esta por delante del ticket

  El ticket declara "Delivered — FINAL (2026-09-17)" una lista que llega hasta BE "PR #388" y
  FE "PR #200". Faltan BE "PR #390", FE "PR #201" y FE "PR #202", mergeados el 2026-09-17 o
  despues. El "PR #390" arregla `Done -> In progress`, uno de los seis movimientos del
  tablero: cuando este ticket se declaro final, el AC3 estaba roto para ese movimiento y
  fallaba en silencio. Hoy los seis aplican. Lo que queda mal es el registro de entrega, no
  el producto. Ver findings.txt, F4.

