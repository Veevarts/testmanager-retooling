             /csm/workspace/accounts        -> suggestedTasksCount 5 · suggestedTasksRemaining 1

      EL TICKET LO CUENTA MAL. Declara que la lista de cuentas y el portafolio "still render
      raw totals rather than the capped count". Eso ya no es cierto: el API entrega el conteo
      YA CAPADO, asi que el tope si se respeta fuera del tablero.

      Lo que si queda es otra cosa, y mas fina: la lista descarta `suggestedTasksRemaining`,
      asi que imprime "5 suggested tasks" como si fueran exactamente cinco cuando hay al
      menos seis; la pestana de la propia cuenta, con el mismo dato, imprime "5+". Dos cifras
      para la misma cuenta en la misma sesion.

      Consecuencia visible: TODAS las cuentas de Valentina muestran "5 suggested tasks"
      — Huntington, Jackson Hole, Krasl, Las Vegas, MacRostie, March Field… el mismo 5 en
      cada fila. El chip ya no distingue una cuenta de otra, que es para lo que serviria.

      Del portafolio esta corrida NO concluye nada: sus recomendaciones salieron todas por la
      via de casos de soporte y la rama de sugerencias no se ejercio con estos datos.
