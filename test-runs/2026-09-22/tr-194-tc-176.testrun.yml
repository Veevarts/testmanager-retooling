title: >-
  TR-194 · IM-1239 · TC-176 · La seccion de tareas con su tablero — 12/12 PASS. Los seis
  criterios se cumplen, incluido el que se habia certificado mal; y uno de los seis
  movimientos del tablero estaba roto cuando el ticket se declaro final.
status: completed
