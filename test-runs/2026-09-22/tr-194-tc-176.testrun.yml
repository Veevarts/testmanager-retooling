  - testCaseId: "6d803687-48c7-41af-8ff9-56cf0a74c875"
    testCaseKey: TC-176
    scenarioTitle: "AC3 · The board has three columns and cards move between them by dragging"
    scenarioIndex: 2
    status: passed
    executedAt: "2026-09-22T17:11:00Z"
    stepResults: []
    actual: |
      El tablero tiene las tres columnas: To do / In progress / Done. Con tres columnas hay
      seis movimientos ordenados, y se hicieron LOS SEIS arrastrando la tarjeta en pantalla:

        #  movimiento            cuerpo enviado         respuesta
        1  To do -> In progress  {"to":"In_progress"}   201
        2  In progress -> Done   {"to":"Done"}          201
        3  Done -> In progress   {"to":"In_progress"}   201   <-- el que estaba roto
        4  In progress -> To do  {"to":"New"}           201
        5  To do -> Done         {"to":"Done"}          201
        6  Done -> To do         {"to":"New"}           201

      El movimiento 3 devolvia 409 antes del "PR #390" y la tarjeta volvia a su sitio sin
      decir nada. Hoy devuelve 201.

      PERSISTENCIA. Recargada la pagina entera, el servidor devuelve state New / column todo,
      que es la columna del ultimo movimiento: quedo guardado, no solo pintado.

      EL FALLO, PROVOCADO. Se interpuso fetch para devolver 503 a la primera llamada a
      /transition. Al arrastrar de To do a Done: la tarjeta aterrizo al soltarla, la escritura
      fallo, la tarjeta VOLVIO a To do y el banner mostro el mensaje del servidor literal
      ("QA TC-176: fallo de escritura forzado para probar la reversion"). Un retroceso
      silencioso es indistinguible de un arrastre que no agarro.

      En ningun momento la misma tarjeta aparecio en dos columnas.

      pre-fix -> post-fix -> objetivo cumplido?: uno de los seis movimientos daba 409 y
      fallaba en silencio -> los seis aplican, persisten, y el que falla lo dice -> SI.
    notes: >-
      **PASS.** Este es el escenario donde el harness importa: la mutacion M1 (revertir el
      "PR #390") lo pone rojo con el 409 exacto, asi que el verde no es vacio.
