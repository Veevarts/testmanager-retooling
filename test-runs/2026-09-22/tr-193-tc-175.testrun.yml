  - testCaseId: "7dee2b26-3a10-4083-8ced-633d4dcdf6cc"
    testCaseKey: TC-175
    scenarioTitle: "Converting cannot be undone"
    scenarioIndex: 6
    status: passed
    executedAt: "2026-09-22T16:05:00Z"
    stepResults: []
    actual: |
      Tres caminos de vuelta, los tres cerrados:

        transicion con destino Suggested   400  "to must be one of the following values:
                                                 New, In_progress, Done, Rejected"
        convertir otra vez                 409  "Invalid task transition: New → New."
        borrar y restaurar                 201  delete -> Rejected, state_before_delete New
                                           201  restore -> vuelve a **New**

      El destino "Suggested" ni siquiera es un valor admitido por la ruta de transiciones:
      lo rechaza la validacion antes de llegar al dominio. Y el camino mas cercano — borrar
      y restaurar — devuelve la fila a pendiente EN EL TABLERO, no al panel de sugerencias,
      porque restaurar apunta al estado que tenia antes de borrarse, que ya era New.

      No existe ninguna accion que devuelva una tarea a ser sugerencia.

      pre-fix -> post-fix -> objetivo cumplido?: el escenario pedia comprobar si se puede
      deshacer -> no se puede, por tres caminos distintos, y queda documentado -> SI en
      cuanto a dejarlo establecido.
    notes: >-
      **PASS, y NO es defecto**: los criterios no pidieron reversibilidad y es consecuencia
      directa de convertir mutando la fila. Se documenta porque un clic equivocado en Accept
      es definitivo y el producto no lo advierte en ningun lado antes del clic. Contrasta
      con declinar, que si tiene deshacer inmediato y restauracion desde Deleted.
    attachments:
      - name: cannot-be-undone.txt
        path: attachments/tr-193-tc-175/scenario-7/cannot-be-undone.txt
        mimeType: text/plain
    defects: []

