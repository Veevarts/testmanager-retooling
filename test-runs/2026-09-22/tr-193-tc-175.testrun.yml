notes: |
  ## Solution understood

  La historia pedia poder llevarse una sugerencia al tablero propio sin obligarla a pasar
  por un caso de Salesforce. Lo entregado no crea una tarea nueva: **muta la fila existente**
  de `Suggested` a `New`. La sugerencia no se copia a un sitio nuevo, cambia de estado.

  Eso decide como se leen los cuatro criterios. "Pre-llenada con titulo, descripcion, cuenta
  y fuente" se cumple porque no hay copia de la que se pueda caer nada. "La sugerencia queda
  ligada a la tarea" se cumple por identidad: es la misma fila, el mismo id. Y "navegar de
  vuelta a la sugerencia original" no tiene objeto al que volver, porque la sugerencia dejo
  de existir como tal — lo que sobrevive es la ruta a la FUENTE, que es cosa distinta.

  ## Inferred technical tests

  Tres frentes, los tres ejecutados aqui:

  1. La interfaz desplegada, para lo que el CSM ve: que la accion este en todas las
     sugerencias y en el detalle, que la tarea aparezca en el tablero, que el chip de fuente
     siga abriendo el origen.
  2. La API desplegada, para lo que no se ve: el diff campo por campo entre la sugerencia
     anotada ANTES y la tarea de DESPUES, la identidad por identificador, los rechazos, y
     los tres caminos de vuelta que no existen.
  3. El harness ejecutado del repo, que tiene un bloque dedicado a esta historia
     ("IM-1235 AC4: an accepted task keeps its source chips"), con su procedencia declarada
     en scenario-0-harness/tests-found.txt.

  Ningun escenario quedo pendiente de una persona.

  ## Elegir el dataset fue parte de la prueba

  El primer CSM que se miro tenia UNA sugerencia y SIN fuentes. Con eso, el escenario 1
  ("todas las tarjetas ofrecen la accion, no solo la primera") y el 4 (volver al origen) se
  habrian dado por buenos sin haberlos probado. Se revisaron los lotes de los 10 CSM del
  entorno y se ejecuto sobre el unico que tenia dos sugerencias, las dos con cuenta y las
  dos con fuente.

  ## Lo que el ticket dice y la medicion no confirma

  El ticket afirma que al convertir se le quita al titulo el prefijo `(AI) `. Medido: el
  titulo es **byte identico** antes y despues. Ese recorte se aplica en cualquier lectura de
  tarea, tambien mientras la fila es sugerencia, asi que ya venia quitado y la conversion no
  lo toca. La frase describe un efecto que en la conversion no ocurre.

