title: >-
  TR-193 · IM-1235 · TC-175 · Convertir una sugerencia en tarea del tablero — 8/8 PASS. Los
  cuatro criterios se cumplen; dos de ellos por identidad y no por enlace, y el ticket
  describe un recorte de titulo que la conversion no hace.
status: completed
environment:
  name: >-
    Interfaz y API desplegadas en https://migration.dev.rtl.veevartapp.com (API
    zu76ogw8dg.execute-api.us-east-1.amazonaws.com/dev/api), rol Admin con "View as:
    Valentina Aray" (ownerId 005Vs000005Dh2fIAC). Se cambio de CSM a proposito: el que usan
    las corridas anteriores tenia una sola sugerencia y sin fuentes, con lo que dos de los
    cuatro criterios no se podian probar. Ninguna organizacion de Salesforce fue tocada;
    nada de produccion.
  buildVersion: >-
    Mixed — backend NestJS sobre Aurora ("PR #379", 3dece481) mas frontend React del modulo
    CSM ("PR #195", ef07c5b). El entorno sirve assets/index-Cept_9p_.js, que incluye el
    "PR #203" de ayer; el backend es posterior al "PR #388". La rebanada de esta historia es
    funcional de interfaz y de API.
