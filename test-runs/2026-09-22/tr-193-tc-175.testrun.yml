  - testCaseId: "7dee2b26-3a10-4083-8ced-633d4dcdf6cc"
    testCaseKey: TC-175
    scenarioTitle: "AC4 · From the task, the CSM can get back to what originated it"
    scenarioIndex: 3
    status: passed
    executedAt: "2026-09-22T15:55:00Z"
    stepResults: []
    actual: |
      La tarea ya convertida conserva su chip de fuente ("Email · Jul 6") en la fila y en el
      detalle. Al pulsarlo abre el modal de fuente con el correo original: asunto, fecha,
      remitente, destinatarios y cuerpo.

      Es el MISMO origen, no otro: la referencia de fuente es identica antes y despues de
      convertir — mismo tipo `email`, misma `ref` — asi que el chip de la tarea abre
      exactamente el correo que abria el chip de la sugerencia.

      SIN PII EN LA EVIDENCIA: ese modal muestra direcciones reales del cliente y del CSM,
      asi que no se capturo la pantalla ni se transcribio el contenido. Se registra que
      abrio y a que referencia apunta.

      pre-fix -> post-fix -> objetivo cumplido?: el criterio pide poder volver desde la
      tarea a la fuente -> el chip sobrevive a la conversion, sigue navegable y apunta a la
      misma referencia -> SI para la fuente. Para la otra mitad del criterio, ver el
      escenario siguiente.
    notes: >-
      **PASS.** Observacion aparte, con numeros: de los 10 CSM del entorno solo uno tenia
      sugerencias con fuente en el lote de hoy, mientras que en el conjunto de candidatas
      39 de 50 si la traen. Sobre una sugerencia sin fuente este criterio no tiene nada que
      ofrecer. No es de esta historia — la fuente la llena el generador — y se reporta sin
      sacar conclusiones sobre su causa.
