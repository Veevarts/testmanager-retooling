title: >-
  TR-195 · IM-1223 · TC-177 · Ninguna reserva sale ya sin Type — 7/7 PASS en las tres
  fuentes, y el arreglo no movio ni una sola de las que ya estaban clasificadas.
status: completed
environment:
  name: >-
    Tres fuentes de Altru en SQL Server — Long-Island-Children-s-Museum_db_8, Illinois_db_3
    y high_desert_db_2 — alcanzadas por tunel SSH a traves del bastion, con perfiles de
    solo lectura creados y verificados para esta corrida. Todas las consultas de solo
    lectura, con salida puramente numerica: ningun nombre, factura ni dato personal salio
    de la base. No se escribio en ninguna fuente ni en ninguna organizacion de Salesforce;
    la de Long Island es productiva del cliente. Los detalles de red quedan fuera de este
    artefacto a proposito: este repositorio es publico.
  buildVersion: >-
    SQL-only — Veevarts/MigrationToolETL commit daa36c7 "fix(queries): classify every
    reservation so none exports a blank type IM-1223", rama
    CamiloSalgueroMarin/IM-1223-rental-type-missing ("PR #184", sigue en BORRADOR). El
    cambio toca un unico CTE, ReservationTypes, en rental_events_groups.sql. El veredicto
    de esta corrida queda atado a ese commit: si el PR cambia, caduca.
startedAt: "2026-09-22T22:50:00Z"
completedAt: "2026-09-22T23:15:00Z"
executedBy: codex

notes: |
  ## Solution understood

  En Altru el tipo de grupo de una reserva vive UNICAMENTE en su itinerario
  (`ITINERARY.GROUPSALESGROUPTYPECODEID`). No hay campo de tipo en la reserva.

  El CTE `ReservationTypes` estaba enraizado en ITINERARY y agrupaba por
  `it.RESERVATIONID`. Una reserva sin ningun itinerario no producia fila en ese CTE, asi
  que el LEFT JOIN posterior devolvia NULL y el Type salia vacio — en vez de caer al valor
  por defecto, que es lo que el `ELSE 'Rental_Event'` pretendia.

  El arreglo invierte la raiz: parte de RESERVATION, engancha ITINERARY por LEFT JOIN y
  agrupa por `r.ID`. Asi toda reserva produce fila, y la que no tiene evidencia de grupo
  cae al ELSE. El diff util son cuatro lineas:

      -        it.RESERVATIONID,          ->  +        r.ID AS RESERVATIONID,
      -FROM ITINERARY it                  ->  +FROM RESERVATION r
                                              +LEFT JOIN ITINERARY it ON it.RESERVATIONID = r.ID
      -GROUP BY it.RESERVATIONID          ->  +GROUP BY r.ID

  El campo destino (`Auctifera__Type__c`) es un picklist restringido de dos valores pero NO
  obligatorio: por eso el blanco se cargo callado en vez de fallar en la subida, y por eso
  el defecto aparecio como problema de datos al final y no como error durante la carga.

  ## Inferred technical tests

  Un cambio de clasificacion por defecto se rompe por el lado de lo que NO deberia haber
  tocado, no por el lado de lo que arregla. De ahi salieron cuatro frentes, los cuatro
  ejecutados:

  1. **Comparacion PRE/POST en una sola pasada, fila por fila.** Los dos CTE — el de la
     rama base y el del PR — se reconstruyeron literalmente desde el repo (verificados
     contra `daa36c7^` y `daa36c7` antes de correr, no de memoria) y se unieron por
     RESERVATIONID sobre la misma entrada. Eso permite medir identidad fila a fila, no solo
     que los totales cuadren, que es la unica forma de probar que nada se movio.
  2. **Las tres fuentes, no una.** Long Island, Illinois y High Desert. El conteo de High
     Desert estaba declarado no verificable en el test case (riesgo R4); se consiguio
     acceso y se verifico.
  3. **Los siete ejemplos del reporte por identificador**, no por nombre ni factura, que es
     lo unico que identifica una fila sin ambiguedad.
  4. **Los caminos alternativos de tipo de grupo**, para comprobar la afirmacion de causa
     raiz de que no se perdio ningun valor real: escala de tarifa
     (`RESERVATIONRATESCALE` -> `RATESCALE.GROUPSALESGROUPTYPECODEID`) y estado real desde
     `RESERVATIONSTATUSHISTORY`.

  La suite del equipo ya se habia inspeccionado y ejercitado en la fase previa de esta
  misma corrida: 24 tests verdes sobre docker, y una mutacion que devuelve el CTE a su raiz
  de ITINERARY mata exactamente 3 de ellos, lo que prueba que la suite PUEDE fallar y que
  cubre este cambio. Evidencia en `scenario-0-unit-tests/` y `scenario-0-mutation/`.

  ## Acceso: por que los perfiles viejos no servian

  Los perfiles de lectura existentes apuntan a un destino de red que ya no responde, y el
  de Long Island declara ademas una generacion de la base que ya no existe (`..._db_7`
  cuando la vigente es `..._db_8`). Se crearon perfiles nuevos y verificados para esta
  corrida. Detalle en F6.

  Eso importa mas de lo que parece: un perfil stale no falla ruidosamente, devuelve un
  vacio que se parece a "no hay datos". Quien lo hubiera usado sin verificar el destino
  habria reportado un falso defecto de producto.

  Durante ese trabajo de acceso aparecio ademas un hallazgo de infraestructura ajeno a este
  ticket, que se reporto por canal interno y cuyo detalle NO se documenta en este
  repositorio por ser publico. No afecta al veredicto de esta corrida. Ver F7.

