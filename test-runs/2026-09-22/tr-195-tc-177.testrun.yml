  - testCaseId: "cbc78488-d375-40d5-ad25-c0eacac97069"
    testCaseKey: TC-177
    scenarioTitle: >-
      After the fix, no reservation leaves the export without a Type
    scenarioIndex: 0
    status: passed
    executedAt: "2026-09-22T22:58:00Z"
    stepResults: []
    actual: |
      Medido en las tres fuentes, misma entrada contra las dos versiones del CTE:

        Fuente        total   pre_blank   post_blank   fuera de picklist
        Long Island   16906          34            0                   0
        Illinois       9652           3            0                   0
        High Desert    1380           5            0                   0

      42 reservas que antes salian con Type vacio salen hoy clasificadas. El total de
      reservas es identico en las dos corridas de cada fuente: el arreglo clasifica, no
      filtra. Y el conjunto de valores emitidos es exactamente {Group, Rental_Event}, sin
      nulos ni cadenas vacias.

      pre-fix -> post-fix -> objetivo cumplido?: habia filas con Type vacio en las tres
      fuentes -> no queda ninguna -> SI.

  - testCaseId: "cbc78488-d375-40d5-ad25-c0eacac97069"
    testCaseKey: TC-177
    scenarioTitle: >-
      The seven reported reservations come out as Rental Event
    scenarioIndex: 1
    status: passed
    executedAt: "2026-09-22T23:02:00Z"
    stepResults: []
    actual: |
      SEIS DE LAS SIETE, y conviene leer el numero antes que el veredicto.

      Buscadas por identificador en la fuente de Long Island:

        identificadores reportados .... 7
        encontrados en la fuente ...... 6
        itinerarios entre las siete ... 0
        version base:  las 7 sin tipo (pre_blank = 7)
        version del PR: 6 como Rental_Event, 0 como Group, 1 sin fila

      El ejemplo 7 — 68152E1B-2EC5-44D6-852A-FAC213BDE8CB, "250 Ball Drop Celebration",
      factura 8-15923442 — YA NO EXISTE en la fuente. Se borro de Altru entre el reporte
      del 03-09-2026 y hoy. No es que el arreglo lo clasifique mal: no hay fila que
      clasificar.

      Se califica passed porque el criterio que el ticket pide — que esas reservas salgan
      como Rental Event — se cumple en todas las que existen, y porque marcarlo failed
      señalaria un defecto de producto que no hay. Lo que falta es evidencia, no
      comportamiento, y queda escrito como F2.

      Los 0 itinerarios confirman ademas la premisa de la causa raiz para las siete.

      pre-fix -> post-fix -> objetivo cumplido?: las 7 salian vacias -> las 6 que existen
      salen Rental_Event, que es lo que el workaround ya cargo a mano -> SI, para lo
      verificable.

  - testCaseId: "cbc78488-d375-40d5-ad25-c0eacac97069"
    testCaseKey: TC-177
    scenarioTitle: >-
      Reservations that do have a group type are left exactly where they were
    scenarioIndex: 2
    status: passed
    executedAt: "2026-09-22T23:00:00Z"
    stepResults: []
    actual: |
      Este es el escenario que mas importa del cambio, y el que sale mas limpio.

      Cotejo fila a fila, uniendo los dos CTE por RESERVATIONID sobre la misma entrada:

        Fuente        pre_group  post_group   pre_rental  post_rental  filas cambiadas
        Long Island        4844        4844        12028        12062                0
        Illinois           1711        1711         7938         7941                0
        High Desert         667         667          708          713                0

      `changed_with_evidence = 0` en las tres fuentes: ninguna reserva que antes tenia un
      tipo salio con otro distinto. Ni Group -> Rental_Event ni al reves.

      `pre_group == post_group` exactamente en las tres. El aumento de Rental_Event es
      identico al numero de blancos que habia en cada fuente (+34, +3, +5): no entra ni
      sale nada mas.

      Se deja constancia de que lo verificado es identidad fila a fila mediante el JOIN de
      los dos CTE sobre el mismo identificador, no que los totales coincidan por
      casualidad.

      pre-fix -> post-fix -> objetivo cumplido?: el reparto entre los dos valores era X ->
      sigue siendo X salvo por las que entran desde el vacio -> SI.

  - testCaseId: "cbc78488-d375-40d5-ad25-c0eacac97069"
    testCaseKey: TC-177
    scenarioTitle: >-
      The declared counts of affected reservations hold up
    scenarioIndex: 3
    status: passed
    executedAt: "2026-09-22T23:00:30Z"
    stepResults: []
    actual: |
      Dos de tres coinciden al digito; la tercera no, y se sabe por que.

        Fuente        Declarado en el ticket   Medido hoy      Coincide
        Long Island   35 de 16.731             34 de 16.906    NO
        Illinois       3 de  9.652              3 de  9.652    SI, exacto
        High Desert    5 de  1.380              5 de  1.380    SI, exacto

      Que Illinois y High Desert cuadren exactamente, incluido el total de reservas,
      descarta que el autor contara de otra forma: si asi fuera, fallarian las tres.

      El -1 de blancos en Long Island lo explica el escenario anterior: una de las 35 — el
      ejemplo 7 del reporte — se borro de Altru. No es una hipotesis; se comprobo que la
      fila no esta. El +175 del total es actividad normal de cinco dias en un sistema vivo.

      El conteo de High Desert estaba declarado potencialmente no verificable en el test
      case (riesgo R4, "si no hay acceso se deja explicitamente sin verificar"). Se
      consiguio acceso a la fuente y se verifico: 5 de 1.380, exacto. R4 queda cerrado.

      pre-fix -> post-fix -> objetivo cumplido?: los conteos declarados se sostienen en dos
      fuentes al digito y en la tercera la diferencia queda explicada con mecanismo
      verificado -> SI.

  - testCaseId: "cbc78488-d375-40d5-ad25-c0eacac97069"
    testCaseKey: TC-177
    scenarioTitle: >-
      The stated root cause survives being checked
    scenarioIndex: 4
    status: passed
    executedAt: "2026-09-22T23:11:00Z"
    stepResults: []
    actual: |
      La causa raiz sobrevive en lo que sostiene el arreglo, y se cae en un detalle de
      color. Conviene separarlo.

      LO QUE SOSTIENE EL ARREGLO — verificado:

        · Ninguna de las siete tiene itinerario. itinerarios_total = 0. Es la premisa
          entera de la explicacion y se cumple.
        · Ninguna tiene tipo de grupo por el camino de la escala de tarifa: de las 7,
          cero filas en RESERVATIONRATESCALE. No hay un valor real que se haya perdido, que
          es lo que habria convertido el default en un defecto.

      LO QUE NO SE SOSTIENE — F1b:

        El comentario las describe como "empty or abandoned bookings [...] status of either
        Pending or Cancelled (4 Cancelled, 3 Pending)". Ultimo estado real de las 6 que
        existen, desde RESERVATIONSTATUSHISTORY:

          Cancelled (5) ............. 4     deposito cero: 4
          Pending (0) ............... 1     deposito cero: 1
          Order balance sent (12) ... 1     deposito cero: 1

        Los 4 Cancelled coinciden. Pero una esta en "Order balance sent": se le envio un
        balance al cliente, luego no estaba abandonada. Aunque la septima borrada hubiera
        sido Pending, "either Pending or Cancelled" seguiria siendo falso para esa.

        No cambia el veredicto: esa reserva tampoco tiene itinerario ni tipo de grupo por
        ningun camino, asi que Rental_Event sigue siendo el unico valor defendible. Lo que
        se debilita es el argumento de "son basura abandonada, da igual el valor".

      NOTA DE METODO: el importe total del pedido NO vive en RESERVATION — sus unicas
      columnas de dinero son DEPOSITAMOUNT y SECURITYDEPOSITAMOUNT, cero en las 6. El "$0
      amount" se verifico solo sobre los depositos; el total del pedido de Group Sales no
      se comprobo, y se dice en vez de darlo por bueno.

      pre-fix -> post-fix -> objetivo cumplido?: la explicacion afirmaba que no hay valor
      real perdido -> se comprobo por dos caminos que no lo hay -> SI, con la inexactitud
      de F1b documentada.

  - testCaseId: "cbc78488-d375-40d5-ad25-c0eacac97069"
    testCaseKey: TC-177
    scenarioTitle: >-
      A reservation with conflicting group types is not described anywhere
    scenarioIndex: 5
    status: passed
    executedAt: "2026-09-22T23:03:00Z"
    stepResults: []
    actual: |
      El caso existe. Riesgo R5 del test case, confirmado con datos reales de Long Island:

        reservas con al menos un itinerario ............... 16872
        con mas de un itinerario .......................... 1707
        con varios tipos de grupo con nombre distintos ....   10
        con conflicto "group" vs otro tipo con nombre .....    6
        con conflicto "group" vs itinerario sin tipo ......    4
        con conflicto otro-tipo vs itinerario sin tipo ....    1

      Seis reservas tienen itinerarios que se contradicen entre si.

      Comportamiento observado: la consulta resuelve por DISYUNCION. El `SUM(...) > 0` hace
      que cualquier itinerario "group-ish" gane, sin importar cuantos digan otra cosa. Es
      determinista, estable entre corridas, y IDENTICO antes y despues del arreglo — el PR
      no toca esa parte de la logica, y el escenario 2 ya probo que ninguna de esas seis se
      movio.

      No es regresion ni defecto. Es una regla que hoy solo existe escrita en el SQL. Queda
      como pregunta abierta para el autor (F4): ¿ganar por disyuncion es lo pretendido, o
      deberia prevalecer el itinerario principal o el mas reciente?

      pre-fix -> post-fix -> objetivo cumplido?: el ticket no dice que deberia pasar ->
      se midio cuantas hay y que emite la consulta para ellas -> SI, la pregunta queda
      respondida con numero y comportamiento.

  - testCaseId: "cbc78488-d375-40d5-ad25-c0eacac97069"
    testCaseKey: TC-177
    scenarioTitle: >-
      The export never emits a value the destination field cannot hold
    scenarioIndex: 6
    status: passed
    executedAt: "2026-09-22T23:00:45Z"
    stepResults: []
    actual: |
      Recorridos todos los valores distintos que emite la consulta despues del arreglo, en
      las tres fuentes:

        post_outside_picklist ... 0   (Long Island, Illinois, High Desert)
        post_blank .............. 0   (las tres)

      El conjunto emitido es exactamente los dos valores que el picklist restringido
      admite. No hay nulos, ni cadenas vacias, ni valores con espacios alrededor — la
      clasificacion sale de un CASE que solo puede devolver dos literales, y la medicion lo
      confirma sobre datos reales.

      El grano no cambia: total = distintas en las tres fuentes (16906, 9652, 1380), antes
      y despues. La consulta no duplica ni pierde reservas al clasificarlas, pese al
      fan-out de itinerarios (1707 reservas con mas de uno solo en Long Island).

      Se deja constancia de que el campo no sea obligatorio es lo que hizo que el defecto
      pasara callado en la carga: un picklist restringido rechaza un valor invalido, pero
      acepta el vacio si no es required.

      pre-fix -> post-fix -> objetivo cumplido?: el destino solo admite dos valores -> la
      consulta emite exactamente esos dos y nada mas -> SI.

