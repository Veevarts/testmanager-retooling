  - scenarioIndex: 7
    scenarioTitle: "IM-969 AC8 + AC9 — Max dismissals per period and the maximum views/impressions each stop delivery at their limit and become eligible again when the applicable window resets"
    testCaseId: 9fcc8577-5fca-4e24-8fa7-d883d4472164
    testCaseKey: TC-143
    status: failed
    executedAt: "2026-08-13T23:41:00Z"
    duration: 30
    actual: |
      **FAIL — y conviene decir con precisión de qué tipo: la lógica de las reglas está bien;
      lo que está roto es que en el modo que este release entrega, esas reglas nunca se
      alcanzan.**

      **La lógica funciona (verificada por el camino de feature trigger):**

      | configuración | antes | después |
      | --- | --- | --- |
      | `maxImpressions=2` | elegible | `[]` al alcanzar el límite |
      | `maxDismissals=2` | elegible | `[]` tras 2 dismissals (`dismissalCount=2`) |
      | `maxDismissals=null` (default de una General) | elegible | `[]` tras **un solo** dismissal |

      El último confirma el texto de ayuda: para una General, dejar el campo vacío significa
      que un solo dismissal la oculta. Es un default con consecuencias, no un detalle.

      **Pero en modo after-login los contadores nunca suben.** Mismo survey, mismos endpoints,
      mismo contexto; lo único que cambia es el trigger:

      | `generalTrigger` | `POST /impressions` | `POST /dismissals` | contadores |
      | --- | --- | --- | --- |
      | `afterLogin` | **400** | **400** | quedan en **0** |
      | `featureTrigger` | **201** | **201** | suben correctamente |

      El 400 es `surveyId is not eligible for this feature context`. Confirmado desde el
      estado registrado: tras 2 intentos de impresión y 2 de dismissal en after-login,
      `impressionCount: 0, dismissalCount: 0`.

      **Objetivo NO cumplido:** el AC pide que el límite corte la entrega. En after-login —la
      entrega central de este release— no puede cortar nunca. Un usuario podría descartar el
      modal indefinidamente y volver a verlo en cada login.

      **⚠️ ATRIBUCIÓN — el FAIL es del producto, NO de este release.** `routes/features.ts` es
      byte-idéntico entre `main` y `staging` (20 601 bytes), `validateSurveyEvent` no cambia una
      línea y el "#58" no toca ese archivo. El comportamiento **ya está vivo en producción**. El
      AC sigue sin cumplirse, así que el veredicto del escenario es FAIL; pero no es una
      regresión y **no debería frenar el merge de los tres PRs**.

      QA reportó esto inicialmente como bloqueante sin haber contrastado antes contra `main` —el
      paso pre/post que el propio flujo exige— y lo corrigió después en IM-1185.

      **RESET DE PERÍODO: no ejercitado.** Depende del paso del tiempo real (30/90/180/365 días
      según `Repeat window`) y no es observable en la ventana de ejecución. Se declara.
    notes: "Defecto IM-1185, severidad High. El aislamiento que se le había pedido al dev —confirmar que el rechazo es específico del modo after-login— quedó CERRADO POR QA con la tabla de arriba. ATRIBUCIÓN CORREGIDA: es deuda PREEXISTENTE, ya viva en main, no una regresión de este release; el vínculo Blocks contra IM-969 debería desvincularse y el defecto colgarse de la historia dueña del comportamiento. Corrección publicada en IM-1185 y en los comentarios de survey-tool #58 y NFPFundraising #2234."
