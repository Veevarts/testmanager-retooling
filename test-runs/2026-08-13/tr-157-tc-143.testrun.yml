  - scenarioIndex: 10
    scenarioTitle: "IM-969 AC12 — A submitted response is visible and accurate across Dashboard Summary, the Responses list, the response detail and the CSV export"
    testCaseId: 9fcc8577-5fca-4e24-8fa7-d883d4472164
    testCaseKey: TC-143
    status: not-run
    duration: 0
    actual: |
      **PARCIAL — dos de las cuatro vistas.**

      Respuesta creada: `POST /api/responses` → **201**, id 1, `surveyId 2`, score 9,
      `respondentId 005QA00000RESP1`, comentario `QA TC-143 · respuesta de prueba…`.
      Aparece correctamente en la lista de **Responses** del admin.

      **Faltan Summary, el detalle de la respuesta y el export CSV**, que son la mitad del AC
      y donde vive la aserción de coherencia entre vistas.

      **Hallazgo de fidelidad ya observable:** el registro persiste
      `clientOrgId: "00dem00000v5erwmaz"` — el Salesforce Org Id **en minúsculas** — y no
      devuelve `salesforceOrgId` como campo propio. Para un Org Id de Salesforce el case
      importa: `hasActiveOrganization` compara de forma exacta y `normalizedOrganizationKey`
      lowercasea. Conviene decidir si el registro debe conservar el valor original.
    notes: "PENDIENTE DE TU PARTE: recorrer Dashboard → Summary, abrir el detalle de la respuesta id 1 y ejercitar Export CSV con al menos dos filtros (Subject y Client org), contrastando el conteo del CSV contra el que muestra la pantalla y verificando que haya una columna legible por pregunta. La respuesta NO se borra: es la evidencia de este AC."
    stepResults: []
    attachments: []

  - scenarioIndex: 11
    scenarioTitle: "IM-969 AC13 — Public widget operations keep working with no admin session, and no admin route is reachable anonymously"
    testCaseId: 9fcc8577-5fca-4e24-8fa7-d883d4472164
    testCaseKey: TC-143
    status: passed
    executedAt: "2026-08-13T20:50:00Z"
    duration: 15
    actual: |
      **Rutas admin protegidas — 5 de 5 devuelven 401 anónimo:**
      `/api/admin/surveys`, `/api/admin/organizations`, `/api/admin/features`,
      `/api/admin/responses`, `/api/admin/analytics/summary`.

      Verificado además en los **tres entornos**: dev, stg y prd responden `401` en
      `/api/admin/surveys` sin sesión.

      **Rutas públicas siguen anónimas:** `GET /api/surveys/general/eligible` responde **200**
      sin ninguna sesión, y el envío de respuesta (`POST /api/responses`) funcionó de forma
      anónima. Comportamiento **fail-closed** ante contexto incompleto en los cuatro casos
      probados: lista vacía con 200, nunca 5xx.

      **Gap declarado:** las operaciones anónimas de **impresión** y **dismissal** no se
      pudieron ejercitar por el defecto IM-1185, que las rechaza con 400 antes de llegar a
      cualquier consideración de autenticación.
    notes: "Contracara del AC que sigue vigente desde TR-146, hallazgo de severidad Baja: el endpoint público devuelve el objeto survey completo, incluidos `audienceDetails` y `GSI1SK`. Para una survey acotada por organización eso expone el identificador de la organización objetivo a cualquier cliente anónimo que acierte el contexto. Se re-reporta, no se cierra."
    stepResults: []
