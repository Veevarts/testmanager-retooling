metadata:
  createdBy: "codex"
  createdAt: "2026-08-13T23:50:00Z"
  updatedBy: "codex"
  updatedAt: "2026-08-13T23:50:00Z"
  version: 1
  planKey: null
  testCaseKey: "TC-143"
  parentIssue: "IM-969"
  qaSubTask: "IM-1181"
  epic: "IM-970"
  prsUnderTest: "survey-tool #58 (staging->main, OPEN) · AuctiferaDX #2583 (->main, OPEN) · NFPFundraising #2234 (->main, OPEN)"
  changeType: "mixed — backend/API Node + admin UI React + Salesforce Aura/LWC/Apex en dos paquetes"
  verdict: "7/13 PASS · 1 FAIL · 5 not-run. Corrida INCOMPLETA y declarada como tal. El FAIL de AC8/AC9 es real —en after-login las impresiones y dismissals se rechazan con 400 y los limites no pueden dispararse— pero es PREEXISTENTE: routes/features.ts es byte-identico entre main y staging y el #58 no toca ese archivo. No es regresion del release y no deberia frenar el merge. Lo que SI introduce el release son 13 console.log en archivos que hoy viven limpios en main, que es el motivo que sostiene el rebote."
  paso0: "dev y stg sirven el MISMO bundle byte-identico index-9Qd0lrHV.js md5 b98573f7941dba1270ad378d0aad79ed 362440B. prd sirve index-BjPoAuUb.js md5 2905d53660127f3178c6e77eb859a889 359509B y no contiene 'Load sample data'. Validar en dev SI valida el release candidate."
  isolationClosed: "El aislamiento que se le pidio al dev en IM-1185 lo cerro QA: misma survey, mismos endpoints, mismo contexto; con generalTrigger=afterLogin los recorders dan 400 y los contadores quedan en 0, con featureTrigger dan 201 y suben. El rechazo es especifico del modo after-login."
  defectAttribution: "IM-1185 es PREEXISTENTE. server/src/routes/features.ts es byte-identico entre main y staging (20601 bytes en ambos), validateSurveyEvent no cambia una linea y el PR #58 no toca ese archivo. QA lo reporto primero como bloqueante de release sin haber hecho el contraste pre/post contra main; corregido despues en IM-1185 y en los dos comentarios de PR."
  suitesRun: "survey-tool staging 7324044: server 73/73 + client 32/32 = 105/105, 0 fail. Baseline TR-148 era 93."
  revertProof: "Revertir server/src a main con los tests de staging tumba dynamodbStore.test.ts y apiBoundary.test.ts. Revertir client/src tumba surveyDisplayRules.test.ts. Guards load-bearing."
  releaseRisk: "ESTO SI lo introduce el release, contrastado contra main. El #2234 agrega 20 console.log y el desglose importa: npsWidget.js es archivo NUEVO (7); pero PaymentHelper, ExhibitionWizardHelper, PaymentController, JournalEntryUpdateController y BoxMembershipDonationHelper YA EXISTEN en main con CERO console.log y el PR les agrega 12; PaymentAssignmentHelper tiene 2 en main y le agrega 1. O sea 13 de los 20 entran en archivos que hoy viven limpios en main: es regresion de higiene sobre codigo productivo existente, no una feature nueva que trae logs. Uno de los 7 del archivo nuevo vuelca la URL de eligibility con clientOrgId, respondentId y userCreatedDate a la consola del usuario final. IM-968 sigue en Rechazado por esto. AuctiferaDX #2583 agrega solo 3. El lint no lo atrapa: eslint --print-config sobre npsWidget.js devuelve 0 reglas activas y el script no cubre payments ni ticketing."
  scopeGap: "La scratch de VNFP tiene desplegado un paquete ANTERIOR al #2234: vnfp.NpsWidgetController.getOrganizationId() no compila y el iframe del after-login sale sin salesforceOrgId. El PASS parcial del AC3 vale para el contrato vigente en la org, NO para el del release. Esa org expira el 2026-08-14."
  secondaryFindings: "(1) El gate 409 es mas amplio de lo documentado: una General activa con audiencia global bloquea crear otra activa incluso si es organization-scoped. (2) respondent-state devuelve reason='general_client_org_missing' para generales org-scoped porque no recibe contexto de organizacion, incluso cuando la survey SI se entrega; la causa solo se distingue por contadores. (3) La respuesta persiste clientOrgId lowercased y no conserva salesforceOrgId como campo propio. (4) Vigente desde TR-146: el endpoint publico devuelve audienceDetails y GSI1SK, o sea la lista de organizaciones objetivo, a clientes anonimos."
  environmentState: "NADA BORRADO por decision del dueno de la historia: las surveys de prueba son evidencia. La General del entorno (id 1) quedo RESTAURADA A ACTIVA con su configuracion original. La QA TC-143 (id 2) queda presente e INACTIVA. La respuesta id 1 generada por QA se conserva. Organizations Auctifera (00DEm00000V5eRWMAZ, Salesforce Org ID) y VNFP (flow-site-19432-dev-ed, Subdomain), ambas activas."
  qaSelfCorrections: "CUATRO correcciones. La mas grave: se reporto IM-1185 como bloqueante de release sin contrastar contra main; al hacerlo despues resulto PREEXISTENTE, y ademas el primer intento de esa comparacion dio IDENTICO sobre dos archivos VACIOS porque la ruta estaba mal (se detecto por md5 d41d8cd9, hash de cadena vacia). Las otras tres son sondas que se descartaron antes de emitir veredicto: (1) mandar el Org Id dentro de clientOrgId, que devolvia [] para Auctifera; (2) esperar el patron de triesBetweenShows en 0-based cuando es 1-based; (3) una primera tanda de AC8/AC9/AC10 corrida sobre POSTs que devolvian 400 sin advertirlo, cuya conclusion sobre AC10 fue un artefacto. Las tres se rehicieron."
  notCovered: "AC1 persistencia por UI del admin. AC3 con captura paso a paso y la mitad Auctifera Giftshop. AC11 re-consulta en secuencia. AC12 Summary, detalle y export CSV. AC14 dossier y pasos de rollback. Scan OWASP Top 10. Suites sfdx-lwc-jest de los dos paquetes y validacion de los permission sets del #2583."

