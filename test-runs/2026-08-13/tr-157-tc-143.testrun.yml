  - scenarioIndex: 12
    scenarioTitle: "IM-969 AC14 — The release dossier is complete: evidence for both packages, positive and negative audience tests, boundary tests for the advanced rules, risks, skipped checks and rollback steps"
    testCaseId: 9fcc8577-5fca-4e24-8fa7-d883d4472164
    testCaseKey: TC-143
    status: not-run
    duration: 0
    actual: |
      **NO SE PUEDE CERRAR TODAVÍA, y decirlo es el veredicto honesto.**

      El AC exige el dossier completo. A esta altura hay:
      · pruebas de audiencia **positivas y negativas** en los dos modos — sí
      · pruebas de **borde** de las reglas avanzadas y de su precedencia — sí
      · **riesgos** escritos, incluido el estado del epic — sí
      · **chequeos omitidos** declarados con razón concreta — sí, en este mismo TR

      Falta lo que impide firmarlo:
      · **evidencia de los DOS paquetes**: solo hay NFPFundraising, y con contrato viejo
      · **pasos de rollback** para los tres PRs, incluido el caso de rollback parcial (los
        paquetes de Salesforce y el backend se liberan por separado, así que ése es el caso
        real, no el teórico)
      · el scan **OWASP Top 10** completo
    notes: "PENDIENTE: cerrar AC3 en los dos paquetes con captura paso a paso, correr el scan OWASP, y escribir los pasos de rollback de survey-tool #58, AuctiferaDX #2583 y NFPFundraising #2234 — con qué queda inconsistente si se revierte solo uno de los tres."
    stepResults: []
