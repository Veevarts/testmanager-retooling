      devolvió `[]`—. Sirve como referencia, pero no como PASS de esta corrida: las
      organizaciones son otras y el contrato cambió.
    notes: "PENDIENTE: con la respuesta ya existente (respondent 005QA00000RESP1, survey 2), re-consultar la eligibility para ese respondent y confirmar que devuelve vacío; y verificar que el corte es por respondent + organización, no global, probando otro respondent de la misma org."
    stepResults: []
