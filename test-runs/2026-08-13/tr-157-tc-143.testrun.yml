  - scenarioIndex: 13
    scenarioTitle: "IM-969 — Repo suites, package CI and revert-proof across the three release PRs"
    testCaseId: 9fcc8577-5fca-4e24-8fa7-d883d4472164
    testCaseKey: TC-143
    status: passed
    executedAt: "2026-08-13T20:35:00Z"
    duration: 35
    actual: |
      **Suites de `survey-tool` sobre el head de staging (`7324044`):**
      server **73/73** + client **32/32** = **105/105, 0 fallos**. La línea base de TR-148 eran
      93 tests, o sea la suite creció con el release.

      **Revert-proof — los guards no son vacuos.** Método: dejar los tests de staging y
      revertir SOLO el código fuente a `main`.

      | mutación | resultado |
      | --- | --- |
      | control, staging completo | 105/105 pass |
      | `server/src` revertido a `main` | **2 suites FALLAN** — `dynamodbStore.test.ts`, `apiBoundary.test.ts` |
      | `client/src` revertido a `main` | **1 suite FALLA** — `surveyDisplayRules.test.ts` |

      Que caiga `apiBoundary.test.ts` es lo más significativo: es el contrato que IM-963 lockeó
      y que separa las rutas públicas de las admin.

      Árbol restaurado a staging al terminar.
    notes: "GAP DE COBERTURA A RE-DECLARAR: `NpsAfterLoginLauncherBackground` es un bundle Aura y jest de LWC no ejecuta Aura, así que el componente central del AC3 no tiene cobertura automatizada en ninguno de los dos paquetes. No es descuido del dev: es una limitación del stack de testing. PENDIENTE: las suites sfdx-lwc-jest de AuctiferaDX #2583 y NFPFundraising #2234, y la validación de los permission sets que toca el #2583 (Veevart.permissionset, auctifera.permissionset), que la historia declara como dependencia de release."
