  notes: |
    ## Solution understood

    El epic entrega la General Survey en modo **after-login**: un launcher Aura montado en la
    utility bar de cada paquete pide eligibility al survey-tool con el contexto del usuario
    (`clientOrgId`, `respondentId`, `userCreatedDate` y, tras IM-1165, `salesforceOrgId`),
    espera el delay configurado y abre el widget. El survey-tool decide la entrega evaluando
    audiencia, fecha de inicio, tipo de trigger, límites de frecuencia y límites de display.
    El "#58" promueve a producción el trabajo de admin de IM-1176 más la migración de
    persistencia a DynamoDB de IM-1147.

    ## Inferred technical tests

    | Test inferido | Qué prueba | ¿Ejecutable? | Resultado |
    |---|---|---|---|
    | Fingerprint del bundle en dev/stg/prd | que dev sirva el release candidate | SÍ | PASS, dev == stg byte a byte |
    | Suites del repo sobre el head de staging | no romper lo existente | SÍ | 105/105, 0 fail |
    | Revert-proof por reversión de `src` | que los guards no sean vacuos | SÍ | 3 suites caen |
    | Probes de eligibility por org y por llave | AC4, AC5 | SÍ | PASS |
    | Read-back tras crear y editar | AC6 | SÍ | PASS |
    | Barrido de `usageCount` | AC7 | SÍ | PASS |
    | Recorders + `respondent-state` | AC8, AC9, AC10 | SÍ (solo featureTrigger) | FAIL en after-login → IM-1185 |
    | Probes anónimos a `/api/admin/*` | AC13 | SÍ | PASS 401 ×5 |
    | Login real en la org + modal | AC3 | SÍ (VNFP) | parcial, ver escenario 3 |
    | Persistencia por UI del admin | AC1 | NO ejecutado | `not-run` |
    | Dashboard Summary, detalle y CSV | AC12 | parcial | `not-run` |

    ## Objective fit

    Objetivo del ticket: confirmar que la entrega completa de la General Survey está lista para
    liberar. **No se cumple todavía.** El comportamiento de audiencia, scoping, persistencia de
    la lista de organizaciones y espaciado por interacciones está correcto y verificado. Pero
    dos de las reglas de display que el ticket exige validar **no pueden aplicarse en el modo
    que este release entrega**, y eso es un defecto de release, no un hueco de cobertura.

    ## Higiene del entorno

    Por decisión del dueño de la historia, **las surveys de prueba NO se borran: son evidencia**.
    Estado final: la General del entorno (id 1) quedó **restaurada a ACTIVA** con su
    configuración original; la `QA TC-143` (id 2) queda **presente e inactiva**; la respuesta
    id 1 generada por QA **se conserva**. Organizations `Auctifera` y `VNFP`, ambas activas.

