key: TR-157
title: "TR-157 · IM-969 · TC-143 · Compuerta de release NPS — 7/13 PASS · 1 FAIL · 5 not-run · corrida INCOMPLETA · el FAIL de AC8/AC9 es real pero PREEXISTENTE (IM-1185, ya vivo en main); lo que sí introduce este release son 13 console.log en archivos que hoy están limpios en main"

description: |
  QA de IM-969 (**Execute Museum Demo NPS release QA**), epic IM-970 NPS Survey Tool delivery.
  QA Sub-task: IM-1181.

  No es una historia de feature: es **la compuerta de release del epic**. Los tres PRs bajo
  prueba apuntan a `main` y los tres estaban ABIERTOS al ejecutar:
  survey-tool **"#58"** (`staging` → `main`), AuctiferaDX **"#2583"** y
  NFPFundraising **"#2234"** (`story/nps-survey-delivery-IM-970` → `main`).

  ## Veredicto

  **7/13 PASS · 1 FAIL · 5 not-run · 1 defecto High levantado (IM-1185).**

  La corrida **no está completa** y se registra así a propósito. Lo que se ejecutó, se ejecutó
  con evidencia; lo que no, queda `not-run` con la razón concreta y qué falta para cerrarlo.

  ## PASO 0 — la precondición que hacía interpretable todo lo demás

  El TC lo puso como bloqueante: los tres PRs van a `main` y la rama épica que validaron
  TR-146/147/148 quedó 7 ahead / 18 behind. Si dev sirviera la épica, cualquier PASS sería
  irrelevante para el release.

  Medición: **dev y staging sirven el MISMO bundle, byte a byte** — `index-9Qd0lrHV.js`,
  md5 `b98573f7941dba1270ad378d0aad79ed`, 362 440 B. `prd` sirve otro
  (`index-BjPoAuUb.js`, md5 `2905d53660127f3178c6e77eb859a889`) y no contiene
  `Load sample data`. **Validar en dev SÍ valida el release candidate.**

  ## El hallazgo de comportamiento — IM-1185, y por qué NO decide el release

  Para una General Survey en modo **after-login**, los eventos de **impresión** y **dismissal**
  se rechazan con **400** `surveyId is not eligible for this feature context`. Como nunca se
  persisten, `maxImpressions` y `maxDismissals` **no pueden dispararse jamás** en el modo de
  entrega que este release ships.

  **Aislamiento cerrado por QA** — misma survey, mismos endpoints, mismo contexto; lo único
  que cambia es el trigger:

  | `generalTrigger` | `POST /impressions` | `POST /dismissals` | contadores |
  | --- | --- | --- | --- |
  | `afterLogin` | **400** | **400** | quedan en 0 |
  | `featureTrigger` | **201** | **201** | suben correctamente |

  **⚠️ ATRIBUCIÓN CORREGIDA — esto es PREEXISTENTE.** `server/src/routes/features.ts` es
  **byte-idéntico entre `main` y `staging`** (20 601 bytes en ambos), `validateSurveyEvent` no
  tiene una sola línea de diferencia y el PR "#58" **ni siquiera toca ese archivo**. El 400 ya
  está vivo en producción. **No es una regresión de este release y no debería frenar el merge**
  de los tres PRs — el release no empeora la situación.

  QA reportó esto inicialmente como bloqueante de release sin haber contrastado antes contra
  `main`, que es justo el paso que el flujo exige. El hallazgo es válido; la urgencia era errónea
  y quedó corregida en IM-1185.

  Causa: `routes/features.ts` → `validateSurveyEvent()` valida con
  `selectEligibleSurveysForFeature`, el camino de **feature**, que excluye por diseño las
  generales after-login (la separación de modos de IM-966, que QA verificó como correcta).
  Los *recorders* viven en `featuresPublicRouter` y heredan esa validación.

  Agravante: el launcher postea a esos endpoints y traga el error con un `console.warn`
  fire-and-forget, así que en producción **falla en silencio**.

  ## Riesgo de release que sigue vigente

  **Esto SÍ lo introduce el release, y contrastado contra `main`.** El "#2234" agrega
  **20 `console.log`**, y el desglose importa:

  | archivo | ¿existe en `main`? | `console.log` en `main` | añade el PR |
  | --- | --- | --- | --- |
  | `npsWidget.js` | no, es nuevo | — | 7 |
  | `PaymentHelper.js` | sí | **0** | 4 |
  | `ExhibitionWizardHelper.js` | sí | **0** | 4 |
  | `PaymentController.js` | sí | **0** | 2 |
  | `JournalEntryUpdateController.js` | sí | **0** | 1 |
  | `BoxMembershipDonationHelper.js` | sí | **0** | 1 |
  | `PaymentAssignmentHelper.js` | sí | 2 | +1 |

  **13 de los 20 entran en archivos que hoy viven limpios en `main`.** Eso es una regresión de
  higiene sobre código productivo existente, no "una feature nueva que trae logs". Uno de los 7
  del archivo nuevo vuelca la URL de eligibility —con `clientOrgId`, `respondentId` y
  `userCreatedDate`— a la consola del usuario final. **IM-968 sigue en `Rechazado` por esto** y
  el mismo código va ahora a `main`. AuctiferaDX "#2583" agrega solo 3. El lint no lo atrapa: `eslint --print-config` sobre `npsWidget.js` devuelve
  0 reglas activas y el script no cubre `payments` ni `ticketing`.

  ## Alcance que el veredicto NO cubre

  De los 15 hijos de IM-970: 4 Finalizada, 2 Request Approved, **1 Rechazado (IM-968)**,
  5 en vuelo y 4 sin iniciar. Este veredicto cubre **lo que entregan los tres PRs**, no el epic.

