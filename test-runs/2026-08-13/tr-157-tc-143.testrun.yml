  - scenarioIndex: 8
    scenarioTitle: "IM-969 AC10 — With tries, dismissal limits and view limits configured together, the most restrictive unmet rule is the one that blocks delivery, and which one it was can be verified"
    testCaseId: 9fcc8577-5fca-4e24-8fa7-d883d4472164
    testCaseKey: TC-143
    status: passed
    executedAt: "2026-08-13T23:43:00Z"
    duration: 25
    actual: |
      Las tres reglas configuradas a la vez: `triesBetweenShows=3`, `maxDismissals=2`,
      `maxImpressions=2`.

      | caso | entregada | contadores |
      | --- | --- | --- |
      | A · control limpio, `usageCount=1` (todas cumplidas) | **[2] SÍ** | imp 0 · dis 0 |
      | B · solo TRIES incumplido (`usageCount=2`) | `[]` no | imp 0 · dis 0 |
      | C · solo DISMISSALS incumplido | `[]` no | imp 0 · **dis 2** |
      | D · solo IMPRESIONES incumplido | `[]` no | **imp 1** · dis 0 |
      | E · LAS TRES incumplidas (`usageCount=2`) | `[]` no | imp 1 · dis 2 |

      Cada regla bloquea por separado, la combinación bloquea, y **el control positivo
      entrega** — sin él esto solo probaría que algo bloquea siempre.

      **Verificabilidad de la razón — se cumple, con un matiz que hay que reportar.** El
      endpoint `GET /api/admin/features/:id/respondent-state/:respondentId` existe y devuelve
      por survey `limits`, `counters`, `eligible` y `reason`. Por **contadores** la causa se
      distingue perfectamente: C, D y E son inconfundibles entre sí.

      Pero el campo **`reason` devuelve `general_client_org_missing` en los cinco casos**,
      incluido el control que SÍ entrega. Es porque ese endpoint no recibe contexto de
      organización, así que para una General acotada por organización nunca llega a evaluar
      las reglas de frecuencia. Dicho de otro modo: la razón es verificable por contadores,
      **no por el campo que existe para eso**, que además es engañoso.
    notes: "Nota de diseño para producto: el AC habla de «la regla más restrictiva no cumplida», pero el orden real en `lib/surveyRuntime.ts` es SECUENCIAL FIJO (audience → start_date → triggerType → start/end → maxResponses → onePerRespondent → cooldown → triesBetweenShows → maxShowsPerDay → maxDismissals) y gana la PRIMERA incumplida. El resultado observable cumple lo que el AC pide, pero cuál regla bloquea lo decide el orden del código. Sugerencia concreta: que `respondent-state` acepte `clientOrgId` / `salesforceOrgId` como parámetros para que `reason` sirva en generales org-scoped."
    stepResults: []
    attachments:
      - name: ac8-ac9-ac10-limites-y-aislamiento.txt
        path: attachments/tr-157-tc-143/scenario-13/ac8-ac9-ac10-limites-y-aislamiento.txt
        mimeType: text/plain

  - scenarioIndex: 9
