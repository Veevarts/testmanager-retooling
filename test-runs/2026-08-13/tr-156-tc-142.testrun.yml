  notes: |-
    ## Solution understood

    Sin cambios respecto de TR-155 en la solución de fondo: la causa raíz es un memory grant (error 8645), no un
    timeout de runtime; la cadena `WITH` se parte en 15 `SELECT … INTO #Cte` para que cada statement pida su
    propio grant, cada temp se indexa por su clave de sondeo, el ensamblado final lleva
    `OPTION (LOOP JOIN, MAX_GRANT_PERCENT = 5)`, y el `requestTimeout` del adapter pasa de 120 s fijos a
    1.800.000 ms configurables.

    Lo que cambió entre `bebdc71` y `cbc76e1c` es exclusivamente PROTECCIÓN y DOCUMENTACIÓN: +69 líneas de tests
    en la spec de la query, +22 en la del adapter, un `sql-server.module.spec.ts` nuevo, la exportación de
    `parseTimeoutMs`, y la medición de un tercer tenant en el doc. Ninguna lógica de producción cambió de
    comportamiento.

    ## Inferred technical tests

    - Re-ejecutar las mutaciones de TR-155 sobre el head nuevo — AUTO, escenarios 2 y 3. Es la prueba directa de
      si los huecos se cerraron.
    - Mutaciones NUEVAS y más finas (quitar media parte del hint; relajar el guard a `>= 0`) — AUTO, para
      descartar que la cobertura sea superficial.
    - Verificación estructural y de contrato de salida contra el merge-base — AUTO, escenario 1.
    - Guarda de pares de CTEs compartidos por mutación bidireccional — AUTO, escenario 4.
    - Unicidad de REVENUEID por agregados de solo lectura — AUTO, escenario 5.
    - Corrida end-to-end y fingerprint del CTE no determinista — MANUAL: los tres bloqueos de TR-155 siguen
      vigentes. Escenario 6.
