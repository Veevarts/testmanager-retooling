key: TR-156
title: 'TR-156 · IM-1161 · TC-142 · 5/6 PASS · 0 FAIL · 1 handoff — los tres huecos de regresión de TR-155
  quedaron cerrados y probados por mutación, incluidas dos mutaciones nuevas más finas'
description: |-
  Re-ejecución de TC-142 contra **MigrationToolETL#164** en su head nuevo **`cbc76e1c`** (TR-155 corrió sobre
  `bebdc71`). Motivo: tras el rebote de QA, el dev subió dos commits que atacan directamente lo reportado —
  `52dd0c2d` *"guard the parts of the fix that were unprotected"* y `cbc76e1c` *"measure a third tenant and clear
  the sibling-file risk"*.

  **Veredicto: 5/6 PASS · 0 FAIL · 1 not-run (handoff). Los dos FAIL de TR-155 quedaron cerrados.**

  ## Lo que se arregló, verificado por mutación y no por lectura del diff

  | mutación | TR-155 (`bebdc71`) | TR-156 (`cbc76e1c`) |
  |---|---|---|
  | M1 borrar `OPTION (LOOP JOIN, MAX_GRANT_PERCENT = 5)` | 33/33 PASA ❌ | 1 FALLA ✅ |
  | M2 `MAX_GRANT_PERCENT = 5` → `25` | 33/33 PASA ❌ | 1 FALLA ✅ |
  | M3 borrar un `DROP` del bloque inicial | 33/33 PASA ❌ | 1 FALLA ✅ |
  | M4 borrar un `CREATE INDEX` no leído por el helper | 33/33 PASA ❌ | 1 FALLA ✅ |
  | M12 quitar el guard `&& parsed > 0` | 4/4 PASAN ❌ | 8 FALLAN ✅ |

  Además probé **dos mutaciones nuevas que el dev no podía anticipar**, para descartar que la cobertura fuera un
  `toContain` grueso:

  - **M2b** — quitar *solo* `LOOP JOIN` dejando el grant → **1 falla**. La guarda discrimina las dos piezas del
    hint, no el string completo.
  - **M12b** — relajar el guard de `> 0` a `>= 0`, que deja pasar exactamente el único valor peligroso →
    **6 fallan**. El caso borde que importaba está cubierto por dos vías.

  También quité `SET NOCOUNT ON` (**M4b**) y también se detecta.

  La suite creció donde tenía que crecer: `membership-transactions-query.spec.ts` de 33 a 39 tests (+6, uno por
  guarda) y adapter+module de 4 a 16. `sql-server.module.spec.ts` es un archivo nuevo que exporta y cubre
  `parseTimeoutMs` con '', '0', '-5', 'abc', '   ', `undefined`, un override positivo y un test explícito
  *"never returns zero"* — con el razonamiento del guard escrito en el docblock, incluido que `Number('')` es 0 y
  que `??` no atrapa el 0.

  ## Lo que se mantiene

  Estructura y contrato de salida sin cambios: 15 staged / 15 índices / 30 drops, `LEAD == TRAIL`, cero temp
  tables globales, cero DDL alcanzando un objeto persistente, y 35 columnas idénticas al merge-base en las dos
  ramas del `UNION ALL`. La guarda de pares de CTEs compartidos sigue load-bearing en los dos sentidos.

  ## Lo que avanzó pero no cerró, y un retroceso que no es del PR

  **El tercer tenant llegó, pero queda uno corto de la barra que el propio PR fijó.** La mitigación decía *"run on
  two more tenants before rolling out"* — desde 2 medidos, eso son 4. Ahora son **3**: se sumó tucson
  (98.950 filas / 249 s). El dato es tranquilizador en el eje que importaba —249 s contra los 1485 s de
  longisland, así que el plan forzado no se degradó en otra forma de datos— pero la barra era 4.

  **`illinois_2` dejó de ser alcanzable.** La semana pasada re-derivé ahí la unicidad de `REVENUEID`
  (191.630/191.630); hoy falla la conexión igual que aspen. El PR lo documenta (*"illinois_2 has since joined the
  unreachable set — it is also on the old NLB"*) y lo confirmé de forma independiente desde la máquina de QA. El
  conjunto sin verificar **creció de 5 a 6 perfiles**. Es infraestructura, no el PR, pero deja el *item C* peor
  que antes.

  **El CTE no determinista sigue sin respuesta.** `OrderBackedMembershipFinancialTransactions` sigue siendo el
  pendiente de TR-155: el PR lo materializó con índice, materializar cambia el plan, y el plan era justo lo que
  hacía arbitrario al ganador. No hay ninguna medición del fingerprint post-staging en el PR.

  ## Limitación de esta corrida

  El MCP de Atlassian está desconectado, así que esta ejecución **no pudo leer el ticket ni publicar el veredicto
  en Jira**. Todo el trabajo técnico se hizo contra el PR y el repo. IM-1161 sigue en **Rechazado** por TR-155 y
  necesita transición manual —o una sesión con Atlassian reconectado— para reflejar este resultado.
