  - testCaseId: "8958ec93-8e4c-401c-9fe1-7309b7bff12c"
    testCaseKey: TC-180
    scenarioTitle: >-
      AC7 · The rewritten query returns on real data, and returns the same rows
    scenarioIndex: 7
    status: blocked
    executedAt: "2026-09-23T20:03:00Z"
    stepResults: []
    actual: |
      Cronometro sobre la fuente viva:

        Commit     Que es                                   Tiempo           Filas
        8b522c37   base, antes del PR                       2,7 s              192
        33bb15d    primer commit del PR, previo a review    >120 s  TIMEOUT      -
        382172b    tras la review, gate evaluado dos veces  >120 s  TIMEOUT      -
        c1a9d82    head, gate evaluado una sola vez         8,8 s              191

      El limite de 120 s es el requestTimeout fijo del runner de solo lectura. NO se
      modifico: es un control de seguridad y subirlo para que salga un numero no es una
      medicion, es un atajo.

      LO QUE SI QUEDA ESTABLECIDO. La reescritura de rendimiento no es cosmetica: es la
      diferencia entre una consulta que no termina dentro del limite y una que devuelve en
      8,8 s. Sin ella este archivo no es ejecutable en condiciones normales sobre esta
      fuente. Los ~46 s que cita el autor corresponden a 33bb15d; hoy esa forma supera los
      120 s. No declaro falsa su cifra — se midio en otro momento y sobre una instancia en
      otro estado — pero hoy no se sostiene.

      LO QUE NO SE PUDO COMPROBAR. La identidad de filas entre 382172b y c1a9d82 sobre datos
      reales, porque la version previa no devuelve dentro del limite. Queda comprobada solo
      en la suite en contenedor, que pasa.

      POR QUE NO ES UN FALLO DEL PR. La identidad contra la forma previa era un medio para
      creer que la reescritura no cambio el resultado. Ese fin se alcanzo por una via mas
      fuerte: la salida del head quedo reconciliada contra la verdad de campo claim a claim
      (escenario 4) y cada uno de sus 191 identificadores verificado contra la salida real de
      los tres exports (escenario 1). No hace falta creer que c1a9d82 == 382172b: se demostro
      que c1a9d82 es correcto.

      Se marca BLOQUEADO y no PASS porque uno de sus pasos no se pudo ejecutar. Fingir un
      PASS aqui seria justo el tipo de evidencia que no sirve.

      pre-fix -> post-fix -> objetivo cumplido?: parcialmente. Devuelve sobre datos reales,
      si, y en 8,8 s. Devuelve las mismas filas que la forma previa: no comprobado en vivo.
