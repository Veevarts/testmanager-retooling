key: TR-198
title: >-
  TR-198 · IM-1281 · TC-180 · Ninguna donacion estaba excluida: la consulta publicaba la
  transaccion en vez de la Oportunidad — 8/9 PASS, los 125 identificadores inexistentes
  pasan a cero, y la reescritura de rendimiento resulta ser la diferencia entre no terminar
  y 8,8 segundos.
status: completed
environment:
  name: >-
    Fuente de Altru de Long Island en SQL Server, alcanzada con un perfil de solo lectura a
    traves del bastion. Todas las consultas de solo lectura y con salida numerica o de
    identificadores internos de Altru: ningun nombre de socio o donante, ningun importe
    individual de persona y ningun dato personal salio de la base. No se escribio en ninguna
    fuente ni en ninguna organizacion de Salesforce; la de Long Island es productiva del
    cliente. Suite del equipo ejecutada en local contra SQL Server 2022 en contenedor. Los
    detalles de red quedan fuera de este artefacto a proposito: este repositorio es publico.
  buildVersion: >-
    SQL-only con cobertura de tests del dev — Veevarts/MigrationToolETL commit c1a9d82 de la
    rama CamiloSalgueroMarin/IM-1281-excluded-donations-matching-gift ("PR #186", ABIERTO y
    no borrador, sin mergear ni desplegar; merge-base con main 8b522c37). El cambio toca una
    consulta SQL; el resto del diff son specs, fixtures, el comentario de un pipeline y
    documentacion. Se probaron ademas dos commits intermedios (33bb15d previo a la revision
    y 382172b previo a la reescritura de rendimiento) para separar lo que aporta cada uno.
    El veredicto queda atado a c1a9d82: si el PR cambia, caduca.
startedAt: "2026-09-23T19:40:00Z"
completedAt: "2026-09-23T20:05:00Z"
executedBy: codex

notes: |
  ## Solution understood

  EL TITULO DEL TICKET DESCRIBE UN SINTOMA, NO EL DEFECTO. Se reporto como "128 donaciones
  excluidas de la migracion". Ninguna lo estaba: las 128 se migraron. Lo que fallaba era el
  identificador que la consulta de actualizacion de matching gift publicaba para cada una.

  `REVENUEMATCHINGGIFT.MGSOURCEREVENUEID` nombra la TRANSACCION DE INGRESO contra la que
  Altru emparejo el regalo, no la Oportunidad que la migracion construye a partir de ella.
  Para la mayoria de donantes son dos registros distintos, asi que el VLOOKUP contra el
  reporte de exito de donaciones no podia encontrarlos nunca. La consecuencia real no es
  cosmetica: un upsert sobre un identificador externo que no existe CREA el registro, de modo
  que la carga habria generado Oportunidades "stub" sin monto, contacto ni etapa.

  El arreglo resuelve cada donante contra la Oportunidad que otro export emite de verdad, por
  orden de fidelidad: su propia transaccion (rank 1), su cuota de recurring gift (2), su
  pledge (3), la transaccion de ingreso de su orden POS (4) y su transaccion de membresia
  (5). El rank 0 no es un candidato sino el propio claim, que viaja por el mismo gate para
  responder en una sola pasada si la Oportunidad del claim existe. Todo candidato que la
  migracion no emite se DESCARTA en vez de exportarse.

  ## Inferred technical tests

  - Cruce de conjuntos entre lo que la consulta emite y lo que emiten de verdad los tres
    exports de Oportunidad. Es la prueba decisiva y la unica que responde a la pregunta del
    ticket. EJECUTADA.
  - Censo de los 195 claims activos clasificados por forma de donante con los predicados de
    cada rank, para reconciliar 195 contra 191. EJECUTADA.
  - Comparacion cohorte a cohorte del par claim-donante entre base y PR. EJECUTADA.
  - Comparacion normalizada del preludio del gate entre los tres archivos que lo comparten,
    mas una mutacion deliberada para comprobar que el spec detecta divergencias. EJECUTADA.
  - Cronometro de las cuatro versiones sobre la fuente viva. EJECUTADA.
  - Conteo de la poblacion de padres huerfanos que el autor deja abierta. EJECUTADA.
  - Identidad de filas entre 382172b y c1a9d82 sobre datos reales. NO EJECUTABLE: la version
    previa no devuelve dentro del limite de 120 s del runner de solo lectura, y ese limite no
    se toca porque es un control de seguridad.

  ## Metodo de instrumentacion

  No se reimplemento ninguna logica. De cada export se tomo la consulta TAL CUAL y se
  sustituyo UNICAMENTE la lista de columnas de la proyeccion final por el identificador
  externo que esa consulta emite. Cadena de CTEs, temp tables, joins, WHERE y hints quedan
  byte a byte. El script esta comiteado en `attachments/tr-198-tc-180/sql/instrument.py` para
  que cualquiera pueda repetir la medicion y discutirla.

  ## Sobre el repositorio del dev

  Se hizo checkout local de los commits del PR para leer y ejecutar sus tests, y una mutacion
  temporal de una linea para probar que el spec puede fallar. El archivo se restauro y se
  verifico byte a byte contra c1a9d82. Cero commits, cero pushes, cero modificaciones
  persistentes en Veevarts/MigrationToolETL.

