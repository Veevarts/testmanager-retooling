    scenarioIndex: 3
    status: passed
    executedAt: "2026-09-23T19:56:00Z"
    stepResults: []
    actual: |
      Desglose por forma de donante, clasificando cada claim con los mismos predicados que la
      consulta usa en cada rank:

        membership payment ....... 115   declarado 115
        POS order payment .........  10   declarado  10
        pledge payment ............   2   declarado   2
        pledge root ...............   1   (el autor lo cuenta dentro de los 67)
        standalone donation .......  67   declarado  67
        total .................... 195   declarado 195

      Las cinco formas coinciden.

      R2 — LA DISCREPANCIA 2 CONTRA 3 PLEDGES NO ERA UNA CONTRADICCION. Las dos cifras del
      autor son correctas y hablan de cosas distintas: 2 pledge payment (el donante paga un
      pledge, rank 3) + 1 pledge root (el donante ES el pledge, rank 1) = 3 donantes que
      aparecen en el reporte de pledges. La salida del PR lo confirma: exactamente 3 de sus
      191 filas nombran un identificador que emite donation_pledges.sql.

      R3 — LOS 4 CLAIMS AUSENTES, UNO POR UNO:

        1D0CA101   su propia Oportunidad no existe (claim de $0, rank 0)   lo quita el PR
        F99FC7CD   colision: el donante 5162C6AF ya lo reclama E4957533    ya faltaba en base
        EDE14C3C   colision: el donante 2BC42D40 ya lo reclama 9284865D    ya faltaba en base
        B3768D1B   colision: el donante 2A27FAD9 ya lo reclama 40B441DC    ya faltaba en base

      Las tres colisiones son deduplicacion PREEXISTENTE: npsp__Matching_Gift__c es un lookup
      de un solo valor, asi que cuando dos claims resuelven al mismo donante gana el de fecha
      mas antigua. El ganador es el MISMO en base y en PR en los tres casos.

        195 - 3 (dedup preexistente) - 1 (claim de $0) = 191.   Sin residuo.

      191 filas, 191 identificadores distintos. Ningun duplicado.

      pre-fix -> post-fix -> objetivo cumplido?: el autor dejaba 4 bajas sin explicar, y una
      baja no explicada es como esta consulta pierde un enlace en silencio -> las cuatro
      quedan nombradas con su causa y la aritmetica cierra -> SI.
