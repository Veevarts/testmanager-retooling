      se mueven. Los dos huecos que el ticket dejaba abiertos quedan cerrados con datos: la
      discrepancia 2-contra-3 pledges no era contradiccion (2 pagos de pledge mas 1 raiz de
      pledge) y los 4 claims que no llegan al archivo tienen causa nombrada (uno el claim de
      $0, tres deduplicacion preexistente que tampoco estaba en la base). El riesgo de padres
      huerfanos que el propio autor pedia contar es 0 aqui. Tres observaciones sin defecto: la
      reescritura de rendimiento resulta ser obligatoria y no opcional, porque las dos formas
      previas no devuelven en 120 s mientras el head tarda 8,8 s (O1); la correccion que
      encontro la review toca 5 membresias reales pero no cambia ni una fila en esta fuente,
      asi que su valor esta en las fixtures, no aqui (O2); y el archivo depende ahora del
      orden de carga de membresias, dependencia que la consulta no puede defender sola (O3).
      Sin defectos de seguridad: OWASP 3 aplicables, 3 PASS, 7 N/A.

