    actual: |
      Ejemplo 4 del ticket: donante 6F6D1336... (Salesforce 006Vw00000XNcCtIAL), claim
      1D0CA101...

        El claim esta activo?                                     si
        Su importe neto (Standard menos Reversal) es cero?        si
