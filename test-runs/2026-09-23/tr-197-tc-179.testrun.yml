key: TR-197
title: >-
  TR-197 · IM-1275 · TC-179 · Las tres formas con que Altru escondia un reembolso de
  membresia en 2011-2012 dejan de descartarse — 7/7 PASS, las once cifras declaradas se
  reproducen, y la fila rescatada se mueve de julio a junio entre dos commits del propio PR.
status: completed
environment:
  name: >-
    Fuente de Altru de Long Island en SQL Server, alcanzada con un perfil de solo lectura a
    traves del bastion. Todas las consultas de solo lectura y con salida puramente
    numerica o de referencias de orden: ningun nombre, importe individual de persona ni
    dato personal salio de la base. No se escribio en ninguna fuente ni en ninguna
    organizacion de Salesforce; la de Long Island es productiva del cliente. Suite del
    equipo ejecutada en local contra SQL Server 2022 en contenedor. Los detalles de red
    quedan fuera de este artefacto a proposito: este repositorio es publico.
  buildVersion: >-
    SQL-only con cobertura de tests del dev — Veevarts/MigrationToolETL commit 7436170 de
    la rama CamiloSalgueroMarin/IM-1275-payments-fund-assignments ("PR #185", ABIERTO y no
    borrador, sin mergear ni desplegar; merge-base con main 8b522c37). El cambio toca cinco
    consultas SQL; el resto del diff son specs, fixtures y documentacion. Se probaron
    ademas dos commits intermedios (412b0e8) para aislar el arreglo que vino de la revision
    de codigo. El veredicto queda atado a 7436170: si el PR cambia, caduca.
startedAt: "2026-09-23T18:10:00Z"
completedAt: "2026-09-23T18:40:00Z"
executedBy: codex

notes: |
  ## Solution understood

  El ticket se reporto como "pagos y fund assignments inconsistentes", pero el lado del
  pago nunca estuvo mal: los cargos y reembolsos siempre fueron correctos. Lo que fallaba
  eran las asignaciones de fondo y, en doce casos, el monto de la propia oportunidad.

  La causa es una sola: en 2011 y 2012 Altru registraba los reembolsos sin dejar
  constancia de que venta estaban revirtiendo, y la extraccion exigia ese enlace. Cuando
  no lo encontraba, descartaba en silencio. Se manifiesta en tres formas, y cada una se
  arregla con un mecanismo distinto:

  - Forma A, 10 reembolsos / $2.205. El unico rastro es el comprobante del credito, que
    lista un solo item y ese item es la membresia. Entra un `OUTER APPLY` que resuelve
    `CREDITITEM` -> `SALESORDERITEMMEMBERSHIP`, con dos guardas `NOT EXISTS` que rechazan
    cualquier caso ambiguo. El identificador que produce manda sobre los dos fallbacks de
    grano de orden que ya existian.
  - Forma B, 12 reembolsos / $948, y las MISMAS 12 membresias salian vendidas en $0. Si la
    membresia llevaba descuento, Altru escribia el importe reembolsado en una linea
    `Discount` dentro del reembolso. La extraccion la restaba de la venta: la venta salia
    en $0 y el reembolso no salia. Dos errores que se tapaban entre si.
  - Forma C, 1 venta / $170. Cuando lo unico que cuelga de una linea de membresia
    respaldada por orden es su reembolso, no queda orden que resolver y la fila de cuotas
    se caia mientras el reembolso si se emitia.

  Hay un cuarto cambio que no viene del ticket sino de la revision de codigo: la fila que
  rescata la Forma C se seleccionaba por la fecha del REEMBOLSO mientras su oportunidad se
  selecciona por la de la ORDEN. Son 33 dias que cruzan de mes. En una corrida completa no
  se ve; solo con ventana de fechas, que es como se hace una recarga dirigida.

  ## Inferred technical tests

  Superficie observada: cinco archivos `.sql` mas ocho de pruebas. Estrategia: correr cada
  consulta en sus dos versiones sobre la misma entrada, y ejecutar la suite del equipo.

  Ejecutados automaticamente, todos:

  - Suite del autor en la rama del PR: contrato (653) e integracion con docker (185).
  - `fund_assignments_membership_refunds.sql` base y PR, con un clasificador que deja ver
    por que rama entro cada fila. Las tres ramas son mutuamente excluyentes por
    construccion, asi que la clasificacion es exacta.
  - `fund_assignment_memberships.sql` base y PR, emitiendo el importe nuevo y el viejo en
    la MISMA fila. El viejo se recalcula sin el filtro del PR mediante una subconsulta
    escalar sobre la misma clave del join.
  - Las mismas dos, acotadas a junio y a julio de 2012, mas una tercera version (412b0e8)
    para aislar el arreglo de la ventana.
  - Sondas de poblacion para las guardas, para el radio de impacto completo del filtro de
    descuentos y para el coste de que la compuerta `own_so` sea estrecha.
  - Pruebas estructurales (sin base de datos) para `contact_roles.sql` y para la identidad
    del CTE entre `membership_transactions.sql` y `sales_order_only_membership2.sql`.

  Nada quedo manual. Ningun escenario quedo `not-run`.

  ## Metodo, y por que no se reimplemento nada

  En ningun caso se reescribio la logica del PR en una consulta propia. Se tomo cada
  archivo tal cual y se sustituyo SOLO la lista de columnas de la sentencia final: los
  CTEs, el `OUTER APPLY` nuevo, los joins y los `WHERE` quedan byte a byte. La unica
  excepcion es la sonda del coste de la compuerta, donde se neutralizo una sola linea —
  la condicion de ancla — para poder contar las filas que esa condicion descarta, y queda
  declarado en el propio archivo.

  La instrumentacion se valido con datos, no por inspeccion: la suma del importe VIEJO
  que emite la version del PR reproduce la corrida base completa en LAS 40 COHORTES de
  anio, al centimo. Si estuviera mal construida, no cuadraria.

  Los comentarios se quitaron antes de ejecutar porque el guard de palabras de escritura
  de safesql busca subcadenas y las palabras "create" y "drop" aparecen dentro de
  comentarios y de un literal de datos (`mt.ACTION <> 'Drop'`). Antes de levantar el guard
  se verifico que las consultas no tienen NINGUN destino de escritura: solo `DECLARE`,
  `WITH` y `SELECT`.

