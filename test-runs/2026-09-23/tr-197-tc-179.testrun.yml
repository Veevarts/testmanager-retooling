    testCaseKey: TC-179
    scenarioTitle: >-
      AC1 · The refund that only its credit's single item can identify now migrates
    scenarioIndex: 0
    status: passed
    executedAt: "2026-09-23T18:16:00Z"
    stepResults: []
    actual: |
      Misma entrada contra las dos versiones, clasificando cada fila por la rama que la
      admite:

        A  por el item unico del credito ....  10 filas   -$2.205   2011 y 2012
        B  por la linea tipada Discount ......  12 filas     -$948   2011 y 2012
        C  preexistente ..................... 592 filas  -$98.888   1753 a 2026
        TOTAL POST .......................... 614 filas

        filas de reembolso     592 -> 614   (+22 altas, 0 bajas, 0 modificadas)

      Las 10 de la rama A salen con las tres propiedades que el PR declara: las 10 son de
      2011 o 2012, las 10 estan respaldadas por orden, y las 10 salen clasificadas como
      Membership_Fund. Cada una apunta a la oportunidad que nombra el item del credito, no
      a la que habrian elegido los fallbacks de grano de orden.

      La prueba de que nada preexistente se toco: la rama C se comparo contra la corrida
      completa de la version base cohorte por cohorte, y coinciden filas, importe, cuenta
      de oportunidades distintas y cuenta de Membership_Fund en LAS DIECISEIS. Ninguna
      difiere. El PR solo anade.

      Contraste con lo declarado: el autor dice 591 -> 613; se midio 592 -> 614. Las
      ALTAS son 22 en los dos casos, exactas. La diferencia es una fila de la poblacion
      preexistente, entrada entre el 17-09 y el 23-09 sobre una fuente viva. Ver F5.

      pre-fix -> post-fix -> objetivo cumplido?: los 10 reembolsos no se emitian -> se
      emiten con su oportunidad, su fondo y su importe correctos -> SI.

  - testCaseId: "12f2c2e8-b748-4559-8541-820dfc679cd4"
    testCaseKey: TC-179
    scenarioTitle: >-
      AC1 · The ambiguity guards keep the credit-item path from guessing
    scenarioIndex: 1
    status: passed
    executedAt: "2026-09-23T18:18:00Z"
    stepResults: []
    actual: |
      Embudo de poblacion, de lo general a la guarda:

        reembolsos con alguna linea Standard sin origen ............. 1.236
        de esos, con credito de UN SOLO item ..........................  186
        de esos, cuyo item ES membresia respaldada por orden ..........   10  -> admitidos
        POBLACION DE LA GUARDA 2 (dos o mas lineas en ese grupo) ......    0  -> guarda vacia
        lo mismo sin exigir que el item sea membresia .................    0
        POBLACION DE LA GUARDA 1 (credito multi-item con membresia) ...    1  -> excluido

      La guarda 2 se comporta exactamente como el autor declara: acota una forma que hoy
      no existe y no descarta ninguna fila conocida. Sigue siendo 0 incluso ampliando el
      alcance mas alla de lo que el afirma.

      La guarda 1 SI excluye un reembolso real: un credito con varios items que contiene
      un item de membresia respaldada por orden. Como la unica linea podria pertenecer a
      cualquiera de ellos, la consulta prefiere no emitir antes que adivinar. Es la regla
      que IM-562 impone y es la decision correcta, pero queda con cifra en F2.

      Otras exclusiones, todas correctas: 176 creditos de un solo item cuyo item no es una
      membresia respaldada por orden, y 65 lineas Discount que conviven con una linea
      Standard en el mismo reembolso.

      Una correccion de mi propia medicion queda escrita en la evidencia: la primera
      pasada conto 3.379 y parecia contradecir al autor, pero estaba mal acotada — no
      exigia credito de un solo item ni item de membresia, que es el alcance de su frase.
      Re-medido correctamente da 0. La cifra mala se conserva en guards.json como lo que
      es: un encuadre mio equivocado, no un hallazgo.

      pre-fix -> post-fix -> objetivo cumplido?: ninguna fila ambigua entra por las ramas
      nuevas, y las que se excluyen estan contadas -> SI.

  - testCaseId: "12f2c2e8-b748-4559-8541-820dfc679cd4"
    testCaseKey: TC-179
    scenarioTitle: >-
      AC2 · The discount-typed reversal stops hiding the sale and the refund at once
    scenarioIndex: 2
    status: passed
    executedAt: "2026-09-23T18:24:00Z"
    stepResults: []
    actual: |
      Los dos lados del mismo defecto, medidos por separado y cuadrados entre si:

        lado de la VENTA (cuotas)      2011: 3 filas  +$217    2012: 9 filas  +$731
        lado del REEMBOLSO (rama B)    2011: 3 filas  -$217    2012: 9 filas  -$731
        TOTAL                          12 filas / $948 en cada lado

      Las 12 oportunidades que salian en $0 pasan a llevar su importe real, y las 12
      emiten ahora su fila de reembolso. Las cifras coinciden anio por anio y dolar por
      dolar entre los dos archivos, que es la prueba de que el invariante se mantiene: el
      monto de la oportunidad sigue igual a la suma de sus asignaciones de fondo.

      Las 12 son de 2011 y 2012, y todas pasan de $0 a su importe real.

      Radio de impacto COMPLETO del filtro, no solo el declarado. El CTE del descuento
      alimenta DOS consumidores, y el autor solo da cifras de uno:

        lineas de descuento que se apoyan en un reembolso ..... 86   ($988,85)
          de esas, lineas de MEMBRESIA ........................ 12   ($948)     <- declaradas
          de esas, lineas de ADD-ON ............................ 0   (ninguna)  <- el otro consumidor
          de esas, ni una cosa ni otra ........................ 74   ($40,85)

      El segundo consumidor no tiene ni una linea afectada, asi que la omision del autor
      no oculta nada. Las 74 restantes no llegan a ningun join de los archivos tocados.

      pre-fix -> post-fix -> objetivo cumplido?: 12 ventas salian en $0 y sus reembolsos
      no salian -> las ventas llevan su importe y los reembolsos se emiten -> SI.

  - testCaseId: "12f2c2e8-b748-4559-8541-820dfc679cd4"
    testCaseKey: TC-179
    scenarioTitle: >-
      AC3 · The sale whose only child line is its own refund comes back, and the gate
      stays narrow
    scenarioIndex: 3
    status: passed
    executedAt: "2026-09-23T18:27:00Z"
    stepResults: []
    actual: |
      Rama de cuotas completa, misma entrada contra las dos versiones:

        filas totales            97.742 -> 97.743   (+1, 0 bajas)
        rescatadas por own_so         -  ->      1   ($170, 2012)
        cohortes donde el importe viejo reproduce la base ....... 40 de 40
        cambios en 2014 en adelante ..............................       0

      La fila rescatada es la de la orden 8-10041986, y lleva su propia orden como compra POS.
      La asignacion de $170 reembolsados que ya existia queda emparejada con su venta: es
      el sintoma exacto del Ejemplo 1 del ticket, cerrado por los dos lados.

      El coste de que la compuerta sea estrecha, MEDIDO. El autor prueba en su suite que
      la compuerta deja oportunidades sin asignacion de fondo, y lo llama "the gate's real
      cost". Se midio esa poblacion neutralizando la condicion de ancla:

        las filas que el ancla descarta son 5, y las 5 tienen orden de venta resoluble:
        NO son la forma que own_so atiende, se descartan igual en las dos versiones y son
        anteriores a este PR. No existe ninguna fila con orden no resoluble, sin own_so y
        sin ancla.

      El coste real de la compuerta en Long Island, hoy, es CERO filas. La forma que el
      autor prueba con fixture existe, pero su poblacion aqui esta vacia. La compuerta
      protege contra re-alojar las ordenes con varias membresias de 2022-2025 sin perder
      nada medible a cambio, y esas ordenes no se mueven: 2014 en adelante sale identico.

      pre-fix -> post-fix -> objetivo cumplido?: la venta de $170 se caia dejando solo su
      reembolso -> se emite con su compra POS, sin arrastrar nada mas -> SI.

  - testCaseId: "12f2c2e8-b748-4559-8541-820dfc679cd4"
    testCaseKey: TC-179
    scenarioTitle: >-
      AC3 · The rescued dues row travels in the same date window as its opportunity
    scenarioIndex: 4
    status: passed
    executedAt: "2026-09-23T18:30:00Z"
    stepResults: []
    actual: |
      Fechas medidas: la orden 8-10041986 es del 2012-06-06 y su reembolso del
      2012-07-09. Son 33 dias y cruzan de mes. La primera renovacion, 8-10041566, es del
      2012-06-03: encaja con "renovo dos veces en tres dias".

      Tres versiones contra dos ventanas:

        version                                  junio 2012        julio 2012
        ---------------------------------------  ----------------  ----------------
        base 8b522c37  (sin el arreglo)          no emite la fila  no emite la fila
        412b0e8        (own_so, ventana vieja)   no emite la fila  LA EMITE  <- huerfana
        7436170        (own_so + ventana nueva)  LA EMITE          no emite la fila

        totales:  base 227 / 367 · 412b0e8 227 / 368 · final 228 / 367

      La base pierde la fila en las dos ventanas: es el defecto original. El primer
      intento la rescata pero la deja en julio, donde su oportunidad no esta — una
      asignacion de fondo huerfana. El commit final la mueve a junio, con su oportunidad.

      La fila se mueve de julio a junio entre dos commits del mismo PR, aislada y medida.
      Es la demostracion mas limpia de esta corrida, y prueba con datos un cambio de
      comportamiento que el autor solo habia descrito en prosa.

      Las filas que no deben moverse no se mueven: las respaldadas por transaccion de
      membresia en las que un reembolso tambien gana el ranking toman su oportunidad de la
      otra cadena y ya viajaban emparejadas. Los totales de julio lo confirman, 367 = 367.

      pre-fix -> post-fix -> objetivo cumplido?: la fila caia fuera de la ventana de su
      oportunidad, o no se emitia -> viaja con ella en el mes de la orden -> SI.

  - testCaseId: "12f2c2e8-b748-4559-8541-820dfc679cd4"
    testCaseKey: TC-179
    scenarioTitle: >-
      AC4 · Nothing outside the 2011-2012 refunded population moves
    scenarioIndex: 5
    status: passed
    executedAt: "2026-09-23T18:32:00Z"
    stepResults: []
    actual: |
      Sobre el conjunto completo de cada consulta tocada, no solo sobre la poblacion
      afectada:

        reembolsos de membresia ....  592 -> 614   +22 altas, 0 bajas, 0 modificadas
        cuotas de membresia ........ 97.742 -> 97.743   +1 alta, 0 bajas
        correcciones de monto ......  12, todas en 2011 y 2012
        cohortes identicas .........  16/16 en reembolsos, 40/40 en cuotas
        2014 en adelante ...........  0 cambios en las dos consultas

      Dos afirmaciones del autor se verificaron ESTRUCTURALMENTE, que es mas fuerte que
      un muestreo:

      contact_roles.sql no puede cambiar su salida. Define el CTE y lo une en la linea
      230, pero nunca lee DiscountAmount: no aparece una sola vez fuera de la definicion.
      El CTE agrupa por SOURCELINEITEMID, asi que la clave es unica y un LEFT JOIN no
      puede multiplicar filas; el filtro solo puede quitar filas del CTE, lo que sobre
      clave unica deja las columnas unidas en NULL — y nadie las lee. Identica por
      construccion.

      membership_transactions.sql no puede ganar ni perder filas por este cambio.
      DiscountAmount se usa en tres sitios y los tres son aritmeticos; no aparece en
      ninguna clausula WHERE, y los dos joins del CTE son LEFT sobre clave agrupada.

      Y el CTE es el mismo en los dos archivos que la propia prueba de contrato del autor
      obliga a mantener sincronizados: las tres piezas identicas.

      pre-fix -> post-fix -> objetivo cumplido?: se exigia que nada se moviera fuera de la
      poblacion reembolsada de 2011-2012 -> no se movio nada -> SI.

  - testCaseId: "12f2c2e8-b748-4559-8541-820dfc679cd4"
    testCaseKey: TC-179
    scenarioTitle: >-
      AC5 · The ticket's own records reconcile, and the year totals land where the ticket
      says
    scenarioIndex: 6
    status: passed
    executedAt: "2026-09-23T18:35:00Z"
    stepResults: []
    actual: |
      LOS 12 REEMBOLSOS QUE EL TICKET LISTA COMO NO MIGRADOS APARECEN LOS DOCE, buscados
      uno por uno por su referencia de orden de Altru. Diez entran por la rama del item
      del credito y dos — los dos del 29-12-2011 — por la rama del descuento, que es justo
      lo que el autor anticipa para esos dos.

      El decimotercero, 8-10041986, ya se emitia: es el Ejemplo 1, donde estaba el
      reembolso y faltaba la venta. Esa venta es la fila de $170 del escenario 4.

      Las dos "ventas no migradas" de 2011 (+$110 y +$57) no aparecen en la salida de
      reembolsos porque son ventas y ya migraban: son las recompras del mismo dia. La
      reconciliacion por anio lo confirma aritmeticamente.

      TOTALES POR ANIO:

        Anio   rama A    rama B   correccion venta  venta rescatada    NETO    ticket
        2011     -$290    -$217             +$217               $0    -$290    -$290  OK
        2012   -$1.915    -$731             +$731            +$170  -$1.745  -$1.745  OK

      EL MECANISMO: la rama B se anula sola. El reembolso que entra (-X) y la correccion
      de la venta que sale de $0 (+X) son la misma cifra, anio por anio. Por eso esas doce
      membresias nunca aparecieron en los totales anuales aunque estuvieran mal las dos
      puntas. Es exactamente lo que el autor describe como "los dos errores se tapaban
      entre si", y aqui queda medido.

      El $230 y el $1.805 de la descripcion salen de mover $60 del registro fechado distinto en cada sistema, de
      un anio al otro; ese registro existe en los dos sistemas y no es dinero perdido.

      El 22 frente al 12: los 10 de diferencia son la otra mitad del patron con descuento
      — 1 en 2011 ($50, no nombrado en el ticket) y 9 en 2012 —, que coincide con "one
      pair in 2011, nine in 2012".

      El $185 del Ejemplo 1 NO se explica por la migracion: en Altru esa orden vale $170.
      Procede de los registros que crea la aplicacion en la org, que usan precio de lista.
      Ver F1.

      pre-fix -> post-fix -> objetivo cumplido?: los 12 reembolsos no estaban y los
      totales no cuadraban -> estan los 12 y los dos totales caen al dolar -> SI.

