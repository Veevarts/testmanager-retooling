key: TR-196
title: >-
  TR-196 · IM-1272 · TC-178 · Un reembolso parcial ya no cierra la membresia como perdida —
  6/6 PASS, el intercambio se midio en las dos direcciones, y 32 de las 221 liberadas caen
  en el punto ciego que el propio PR deja sin respaldo.
status: completed
