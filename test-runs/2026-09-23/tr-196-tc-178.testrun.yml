      antes de la recarga aunque no hagan fallar ningun criterio. Los otros: dos conteos
      declarados difieren en +1 por deriva de datos de una semana (F2); el titulo del
      ticket sigue describiendo otro arreglo, el de IM-1204 (F3); la suite de integracion
      tiene 60 s para arrancar SQL Server y en la maquina de QA tarda 94, lo que produce un
      diagnostico falso (F4); y solo se midio Long Island, con Tucson aun sin medir siendo
      el tenant mas afectado (F5). Sin defectos de seguridad: OWASP 3 aplicables, 3 PASS,
      7 N/A.

