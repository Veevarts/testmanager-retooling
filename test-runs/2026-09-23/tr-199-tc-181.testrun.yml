  - testCaseId: "0655ad58-771f-4f2c-b2b9-90c24fb181ce"
    testCaseKey: TC-181
    scenarioTitle: >-
      AC1 · The external id comes from the source, is unique, and the positional SC_n cannot
      come back
    scenarioIndex: 0
    status: passed
    executedAt: "2026-09-23T21:35:00Z"
    stepResults: []
    actual: |
      Es el nucleo de la corrida: el autor declara que csc.ID es clave primaria pero escribe
      en el propio PR que no pudo comprobarlo, porque no tenia runner de consultas.

      Y no es cosmetico. El comentario de constituency.sql lo dice sin rodeos: "A duplicate
      Implementation_External_ID__c fails the Salesforce upsert batch OUTRIGHT." Si csc.ID no
      fuera unico, la carga no se corrompe en silencio: revienta el lote entero.

        Metrica                                           Medido   Declarado
        Filas emitidas                                       959         959
        Valores distintos de Implementation_External_ID__c   959           -
        Colisiones                                             0           -

      959 filas, 959 identificadores distintos. Cero colisiones.

      ESTABILIDAD. Una clave que cambie entre extracciones solo mueve el problema de sitio.
      Huella CHECKSUM_AGG sobre los identificadores y sobre la fila completa, dos corridas:

        corrida 1   959 filas   ids 426381838   filas -1588041124
        corrida 2   959 filas   ids 426381838   filas -1588041124

      Identicas.

      LA CLAVE POSICIONAL NO PUEDE VOLVER. No hay ROW_NUMBER, ni el literal 'SC_', ni
      concatenacion equivalente en el texto de la consulta. El spec nuevo lo fija ademas como
      invariante.

      pre-fix -> post-fix -> objetivo cumplido?: la clave la inventaba el equipo por posicion,
      sin ORDER BY ni ventana, de modo que una segunda tanda renumeraba filas ya cargadas y el
      upsert sobrescribia el par equivocado -> la clave es la primaria del par en la fuente,
      unica en las 959 filas e identica entre corridas -> SI.
    attachments:
      - name: external-id-uniqueness.txt
        path: attachments/tr-199-tc-181/scenario-1/external-id-uniqueness.txt
