        Version              Filas
        base 8b522c37          959
        PR   ebaaef8           959     delta 0
        Declarado              959     exacto

      Las columnas preexistentes se leen de las mismas filas de las mismas tablas por las
      mismas uniones: no pueden cambiar. Verificado ademas con huella CHECKSUM_AGG sobre la
      terna (id externo, constituyente, codigo), identica entre corridas.

      RADIO DE IMPACTO. Quien referencia este archivo en el repositorio: solo el catalogo
      generado y el spec nuevo del PR. NINGUN pipeline lo consume y ninguna otra consulta lee
      su salida. Radio cero, tal como el autor declara.

      pre-fix -> post-fix -> objetivo cumplido?: el cambio solo debia proyectar columnas -> 959
