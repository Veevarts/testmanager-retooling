  - testCaseId: "0655ad58-771f-4f2c-b2b9-90c24fb181ce"
    testCaseKey: TC-181
    scenarioTitle: >-
      AC2 · The deliberate absence of the flag gate is measured, not assumed
    scenarioIndex: 2
    status: passed
    executedAt: "2026-09-23T21:40:00Z"
    stepResults: []
    actual: |
      El encabezado del archivo declara que, a diferencia de emails__c.sql, aqui no se pone
      gate sobre las banderas del constituyente, y que el caso es "rare". "Rare" no es una
      cifra: si esa poblacion fuera grande estariamos cargando codigos de solicitud sin
      constituyente asociado.

        Filas cuyo constituyente no es ni individuo ni organizacion ni grupo        0
        Es decir, filas que saldrian con las dos columnas de vinculo vacias         0

      CERO en Long Island. Las 959 filas se reparten integramente entre 888 contactos y 71
      organizaciones, sin residuo. La decision de no poner gate es prudente y hoy inerte: no
      cambia ni una fila, y la diferencia de criterio con emails__c.sql no se manifiesta.

      Queda abierto para otros tenants: alli si podria haber constituyentes sin ninguna de las
      tres banderas, y entonces este archivo los exportaria con los vinculos vacios mientras
      emails__c.sql los descartaria. No medido fuera de Long Island.

      pre-fix -> post-fix -> objetivo cumplido?: el riesgo estaba descrito con una palabra ->
      cuantificado en 0 -> SI.
    attachments:
