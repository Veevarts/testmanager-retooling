    scenarioIndex: 3
    status: passed
    executedAt: "2026-09-23T21:43:00Z"
    stepResults: []
    actual: |
      PRUEBA ESTRUCTURAL, mas fuerte que un muestreo. El diff del archivo, ignorando
      comentarios, es exactamente la insercion de tres columnas en la lista de proyeccion: ni
      una linea de FROM, JOIN, WHERE o GROUP BY cambia. Y las dos uniones resuelven un solo
      padre por clave primaria, asi que no pueden multiplicar filas. El grano esta garantizado
