  - testCaseId: "0655ad58-771f-4f2c-b2b9-90c24fb181ce"
    testCaseKey: TC-181
    scenarioTitle: >-
      AC6 · The re-keying risk of the already loaded batch is quantified
    scenarioIndex: 6
    status: passed
    executedAt: "2026-09-23T21:55:00Z"
    stepResults: []
    actual: |
      Es la consecuencia de mayor alcance del PR y no esta en el codigo, esta en la operacion.
      Si nadie la ejecuta, la segunda tanda crea registros duplicados junto a los de la
      primera, porque la clave con la que se buscan ya no es la misma.

        Filas del extracto que cambian de clave                              959
        Filas que el emparejamiento por (constituyente, codigo) dejaria ambiguas 6
        Filas ambiguas anadiendo las dos fechas                                 0

      Las 959 cambian de clave: TODAS. No hay subconjunto que conserve la antigua, porque la
      antigua era posicional y la nueva es de la fuente.

      LO QUE NO SE PUEDE CUANTIFICAR DESDE LA FUENTE, Y HAY QUE DECIRLO: cuantos de esos 959
      estan YA cargados es un hecho del lado de la ORG. El ticket habla de una "segunda
      tanda", asi que la tanda 1 cubrio un subconjunto que solo se cuenta consultando la org
      de Long Island, que no esta autenticada aqui y es productiva del cliente. 959 es la
      COTA SUPERIOR; el numero exacto lo tiene el equipo de implementacion.

      RECETA COMPROBADA:
        1. Emparejar por (ConstituentID, SolicitCodeID, StartDate, EndDate) — sin las fechas
           quedan 6 filas ambiguas, con ellas 0.
        2. Escribir la clave nueva con UPDATE POR ID DE REGISTRO. NO con upsert sobre el nuevo
           identificador externo: el upsert no encuentra nada con esa clave todavia, asi que
           INSERTA, y el resultado son duplicados en vez de un re-key.
        3. Alternativa: borrar lo de la tanda 1 y recargar.

      QA no ejecuta ninguna: son escrituras sobre una org productiva del cliente.

      pre-fix -> post-fix -> objetivo cumplido?: el riesgo estaba descrito en prosa -> 959
      filas cambian de clave, el emparejamiento tiene columnas exactas comprobadas y el
      mecanismo del fallo queda escrito -> SI.
    attachments:
      - name: rekey-scope.txt
        path: attachments/tr-199-tc-181/scenario-7/rekey-scope.txt
        mimeType: text/plain
        size: 2300

  - testCaseId: "0655ad58-771f-4f2c-b2b9-90c24fb181ce"
    testCaseKey: TC-181
    scenarioTitle: >-
      AC7 · The three header names remain unverified against the org, and that is a
      silent-failure risk
    scenarioIndex: 7
    status: blocked
    executedAt: "2026-09-23T22:00:00Z"
    stepResults: []
    actual: |
      El autor lo deja escrito como pregunta abierta al equipo de implementacion, y el modo de
      fallo es SILENCIOSO: segun AGENTS.md (IM-1212), una cabecera que nombre un campo que no
      existe se descarta al cargar, sin error. Si uno de los tres nombres esta mal, el CSV se
      veria perfecto y no escribiria nada en Salesforce. El ticket se cerraria y el problema
      seguiria.

        Comprobacion                                                       Resultado
        El objeto aparece en algun artefacto de contexto de destino?        NO
        Hay una org de Long Island autenticada en esta maquina?             NO
        La convencion de cabecera coincide con la de los exports hermanos?  SI

      emails__c.sql y attributes.sql emiten Implementation_External_ID__c sin namespace, igual
      que este archivo. Es la unica evidencia a favor y es indirecta: confirma el estilo, no
      los nombres.

      Hay otras orgs autenticadas en la maquina — sandboxes de formacion de otros clientes y
      una productiva — y NO se consultaron: ninguna es Long Island, la autorizacion vigente
      para tocar orgs esta acotada a otro proyecto, y una org productiva no se toca. Preguntar
      antes es mas barato que explicar despues por que QA entro en una org ajena.

      NO ES UN FALLO DEL PR. El autor no oculto el hueco: lo dejo escrito en el PR y pidio
      confirmacion en el ticket. Hizo lo correcto con la informacion que tenia. El escenario
      queda BLOQUEADO por falta de acceso.

      pre-fix -> post-fix -> objetivo cumplido?: no evaluable. La convencion es coherente con
      los exports hermanos, pero los nombres no se pueden confirmar sin la org.
    attachments:
      - name: header-names-unverified.txt
        path: attachments/tr-199-tc-181/scenario-8/header-names-unverified.txt
        mimeType: text/plain
        size: 2400

