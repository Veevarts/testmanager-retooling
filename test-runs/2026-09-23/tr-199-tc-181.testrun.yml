key: TR-199
title: >-
  TR-199 · IM-1277 · TC-181 · Las tres columnas nunca existieron, y la que de verdad hacia
  falta es una clave que no se invente por posicion — 7/8 PASS, las seis cifras del autor
  salen exactas y su afirmacion central queda por fin comprobada con datos.
status: completed
environment:
  name: >-
    Fuente de Altru de Long Island en SQL Server, alcanzada con un perfil de solo lectura a
    traves del bastion. Todas las mediciones son agregados o columnas de identificador:
    ninguna fila de datos salio a la evidencia, y ningun nombre de socio o donante se
    publico. No se escribio en ninguna fuente ni en ninguna organizacion de Salesforce; la
    de Long Island es productiva del cliente. Habia otras orgs autenticadas en la maquina y
    NO se consultaron. Suite del equipo ejecutada en local; la de contenedor se intento dos
    veces y fallo por arranque del contenedor, no por asercion. Los detalles de red quedan
    fuera de este artefacto a proposito: este repositorio es publico.
  buildVersion: >-
    SQL-only con un spec nuevo del dev — Veevarts/MigrationToolETL commit ebaaef8 de la rama
    CamiloSalgueroMarin/IM-1277-solicit-codes-fields ("PR #183", ABIERTO y no borrador, sin
    mergear ni desplegar; merge-base con main 8b522c37). El cambio proyecta tres columnas en
    una sola consulta; el resto del diff son un spec de regresion y documentacion. El
    veredicto queda atado a ebaaef8: si el PR cambia, caduca.
startedAt: "2026-09-23T21:20:00Z"
completedAt: "2026-09-23T22:05:00Z"
executedBy: codex

notes: |
  ## Solution understood

  LA PREMISA DEL TICKET ES FALSA, Y ESO CAMBIA LO QUE HAY QUE PROBAR. El ticket pide
  "corregir la consulta para que vuelva a incluir" tres columnas. Ninguna version de ninguna
  consulta las produjo jamas: el equipo de implementacion las anadia A MANO al archivo
  despues de cada extraccion. Probar "que vuelvan" seria probar una restauracion que no
  existe.

  DOS DE ELLAS SON INSATISFACIBLES TAL COMO SE PIDEN. Los valores que el ticket muestra como
  esperados son identificadores de registro de Salesforce, y Salesforce los acuna en el
  momento de la carga. Ninguna consulta sobre Altru puede devolverlos, ni antes ni ahora. El
  archivo antiguo los tenia porque alguien los pegaba a mano consultando los registros ya
  cargados. El PR emite en su lugar el identificador externo del constituyente — el mismo con
  el que contact.sql, account_households.sql y account_organizations.sql cargan esos
  registros — de modo que Salesforce resuelve el lookup por si mismo. Es la unica forma de
  satisfacer la necesidad; no es la forma que el ticket pide literalmente.

  EL DEFECTO QUE SI IMPORTA NO ES EL QUE SE REPORTO. Sin clave de idempotencia, el equipo
  inventaba una por posicion de fila (SC_1, SC_2...). La consulta no tiene ORDER BY ni ventana
  de fecha, asi que una segunda tanda renumera filas ya cargadas y el upsert sobrescribe el
  par constituyente/codigo equivocado. Numerar solo las filas nuevas desde SC_1 pisa la tanda
  1 entera. El PR sustituye esa clave por CONSTITUENTSOLICITCODE.ID, la clave primaria del
  par en la fuente.

  El cambio son tres columnas proyectadas y nada mas: ni joins, ni WHERE, ni agrupaciones.

  ## Inferred technical tests

  - Unicidad de la clave nueva sobre la fuente viva. Es la afirmacion de la que depende TODO
    el cambio y la que el autor declara no haber podido comprobar. EJECUTADA.
  - Estabilidad de la clave entre dos corridas, por huella CHECKSUM_AGG. EJECUTADA.
  - Conteo base vs PR y prueba estructural del grano. EJECUTADA.
  - Cifras de enrutado del vinculo y exclusividad mutua de los dos lookups. EJECUTADA.
  - Poblacion real de la ausencia deliberada de gate. EJECUTADA.
  - Los dos ejemplos del ticket, fila a fila. EJECUTADA.
  - No-unicidad del par antiguo y determinacion del emparejamiento con fechas. EJECUTADA.
  - Cota del re-key desde la fuente. EJECUTADA (el subconjunto exacto es del lado de la org).
  - Verificacion de los tres nombres de cabecera contra la org. NO EJECUTABLE: no hay org de
    Long Island autenticada, y las demas orgs de la maquina no se tocan.

  ## Metodo de instrumentacion

  No se reimplemento ninguna logica. La consulta del PR entra TAL CUAL como CTE y solo se le
  anade una agregacion encima. Los scripts estan comiteados en
  `attachments/tr-199-tc-181/sql/` para que cualquiera pueda repetir la medicion.

  ## Lo que aporta esta corrida

  El autor escribe en el PR: "safesql is not installed on this machine, so no live-source
  check was run. Uniqueness rests on CONSTITUENTSOLICITCODE.ID being the table's primary
  key." Ninguna de sus seis cifras estaba verificada contra la fuente. Las seis salen
  exactas, y la unicidad — de la que depende el cambio entero — queda demostrada con datos.

  ## Sobre el repositorio del dev

  Se hizo checkout local de la rama del PR para leer y ejecutar sus tests. Cero commits, cero
  pushes, cero modificaciones en Veevarts/MigrationToolETL.

