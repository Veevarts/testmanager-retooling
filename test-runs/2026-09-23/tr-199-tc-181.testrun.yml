  - testCaseId: "0655ad58-771f-4f2c-b2b9-90c24fb181ce"
    testCaseKey: TC-181
    scenarioTitle: >-
      AC4 · The two ticket examples, and why the Salesforce ids can never come from the query
    scenarioIndex: 4
    status: passed
    executedAt: "2026-09-23T21:47:00Z"
    stepResults: []
    actual: |
      Los nombres de las dos personas que el ticket usa como ejemplo NO se publican: este
      repositorio es publico y la trazabilidad usa los identificadores de constituyente.

      Cada uno de los dos constituyentes tiene DOS codigos de solicitud; el ticket solo
      mostraba uno, el que llama "Do Not Invite", que aparece en 96 filas del extracto.

        Ejemplo    Id externo emitido       Contacto  Org  Contacto = id     Codigo
                                            informado      del constituyente del ticket
        Ejemplo-1  2DD94FE2-...-864A312BFABD   si      no       si              si
        Ejemplo-1  FEF49F78-...-7631B0BD4638   si      no       si              no
        Ejemplo-2  12EC2414-...-B6658571F2EA   si      no       si              si
        Ejemplo-2  B901B30F-...-FF84F34B89A5   si      no       si              no

      Punto por punto contra lo que el ticket declaraba esperar:
        - El identificador externo ya no es SC_1 ni SC_2: es el del par en la fuente.
        - Household/Organization sale VACIO en los cuatro casos. Coincide con lo esperado.
        - "Constituent - HH/Org ID" sale con el identificador del CONSTITUYENTE, no con el id
          de contacto de Salesforce que el ticket muestra. Y ahi esta lo que hay que aceptar
          explicitamente: los identificadores de registro de Salesforce los acuna Salesforce
          al cargar. Ninguna consulta sobre Altru puede devolverlos. El archivo antiguo los
          tenia porque alguien los pegaba a mano despues de cada extraccion.
        - En el archivo antiguo las etiquetas de las columnas 2 y 3 estan INTERCAMBIADAS, que
          es lo que hace que los ejemplos parezcan inconsistentes al compararlos.

      pre-fix -> post-fix -> objetivo cumplido?: las tres columnas no se emitian y el VLOOKUP
      fallaba -> se emiten, con el vinculo que Salesforce sabe resolver -> SI, con la salvedad
      de que es el equivalente correcto y no la restauracion literal que el ticket pedia.
    attachments:
      - name: ticket-examples.txt
        path: attachments/tr-199-tc-181/scenario-5/ticket-examples.txt
        mimeType: text/plain
        size: 2800

  - testCaseId: "0655ad58-771f-4f2c-b2b9-90c24fb181ce"
    testCaseKey: TC-181
    scenarioTitle: >-
      AC5 · The old pairing key is not unique, which is why matching needs the dates
    scenarioIndex: 5
    status: passed
    executedAt: "2026-09-23T21:50:00Z"
    stepResults: []
    actual: |
      Para re-keyear lo ya cargado hay que emparejar cada fila del archivo antiguo con la
      nueva. Si el emparejamiento es ambiguo, el re-key escribe la clave en la fila equivocada.

        Metrica                                                    Medido   Declarado
        Pares (constituyente, codigo) en mas de una fila                3           3
        Filas involucradas                                              6           6
        Pares aun ambiguos anadiendo fecha de inicio y de fin            0           -
        Pares distintos en total                                      956           -

      959 filas - 956 pares distintos = 3 filas sobrantes = los 3 pares duplicados. Las dos
      cifras del autor salen exactas.

      Veredicto en tres puntos:
        1. El par por si solo NO sirve: 6 filas quedarian ambiguas.
        2. Con fecha de inicio y fin el emparejamiento queda DETERMINADO: 0 ambiguas. La
           receta del autor es correcta y ahora esta comprobada con datos.
        3. El identificador externo nuevo distingue esas 6 filas por si solo, sin fechas.

      La clave de emparejamiento para el re-key es (ConstituentID, SolicitCodeID, StartDate,
      EndDate).

      pre-fix -> post-fix -> objetivo cumplido?: el autor afirmaba la no-unicidad sin medirla
      -> confirmada exacta, y ademas comprobado que las fechas la resuelven -> SI.
    attachments:
      - name: pairing-key-not-unique.txt
