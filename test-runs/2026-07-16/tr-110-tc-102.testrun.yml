notes: |
  ## Solution understood

  El case v2 hardcodeaba dos cosas frágiles:
  1. El nombre de layout `Campaign-vnfp__Veevart Campaign Layout V3 - Mar 2024`
     (version-suffixed, cambia con cada release del package).
  2. El recordType `Campaign.Default` — que NO existe en la mayoría de orgs
     (Campaign no suele tener custom record types; solo el Master implícito).

  Cuando el spec pasaba `recordType: 'Campaign.Default'` al T2 assign op en
  un org sin ese RT, la assign fabricaba un per-RT assignment inexistente y
  la Profile write-back verify fallaba. Ese era el "Medium driver" del ticket.

  El v3 lo arregla sin código nuevo, solo con cambios de configuración en el
  JSON — el T2 adapter ya soporta discovered selects + optional recordType:
  1. `layout` hardcoded → `{{campaignLayout}}` + `requiredInputs[0]` con
     `type: select` y `discovery.kind: layouts` sobre Campaign. El operator
     escoge la layout más reciente en runtime — version-agnostic + namespace-
     robust (el discovery adapter reconstruye vnfp__/Auctifera__ prefixes).
  2. `recordType` REMOVIDO del inputPayload. La assign op ahora re-apunta
     TODAS las layout-assignments del Campaign object (default/Master + N
     per-RT) al layout seleccionado — record-type-agnostic por construcción.
  3. `feasibility: auto → hybrid` + 2 nuevos MANUAL handoffs para pedazos
     que no tienen Metadata-safe API:
     - Step 2: reorder End Date debajo de Start Date (Metadata `addField` solo
       appendea, no puede mover).
     - Step 3: assign Lightning Record Page como Org Default (FlexiPage
       `Assign as Org Default` no es subscriber-writable via CRUD Metadata API;
       mismo patrón que ic-5.02 e ic-6.02).

  ## Inferred technical tests

  | Test                                              | Prueba                    | Ejecutable acá?               | Verdict |
  | ------------------------------------------------- | ------------------------- | ----------------------------- | ------- |
  | AC6 static JSON grep (hardcoded layout + Campaign.Default) | AC6 estructural           | Sí — Python local             | passed  |
  | Discovery.kind='layouts' returns Campaign-* on illinois | Precondition AC1          | Sí — sf org list metadata     | passed (6 Campaign layouts, incl. target V3) |
  | listMetadata baseline + RT baseline en illinois   | PRE reference for AC1/AC2 | Sí — sf CLI queries           | passed (documented in PRE-baseline-summary.txt) |
  | T2 assign op live-run on illinois                 | AC1 + AC2 + AC3           | No — requires MigrationApp UI + case v3 seeded | not-run (seed pending) |
  | Profile read-back post-assign                     | AC2 verify                | No — requires prior T2 run    | not-run |
  | MigrationApp UI rendering of manual step guides   | AC4 + AC5                 | No — requires MigrationApp UI + case v3 seeded | not-run |
  | Dev evidence attestation (CamiloDevOrg, 0 RTs)    | AC3                       | Sí — PR body claim (46 profiles, 42 assigned, verified=true) | passed (dev evidence) |

  ## PRE-baseline observado en illinois-trainings @ 2026-07-16

  Ver `attachments/tr-110-tc-102/PRE-baseline-summary.txt`:

  - 5 Campaign RecordTypes custom activos (Event, Fundraising, General,
    Marketing, Volunteer_Campaign) → configuración OPUESTA a CamiloDevOrg.
    Provee cobertura orthogonal fuerte del claim record-type-agnostic.
  - 6 Campaign layouts discoverable — mismo set que CamiloDevOrg, incluye
    `Campaign-vnfp__Veevart Campaign Layout V3 - Mar 2024` (target).
  - 20 profiles totales en illinois — menor que Tucson (mature org con
    tabVisibilities issue flagged por dev); write-back debe ser tolerable.
  - 187 ProfileLayout junctions Campaign-* (Tooling API) — los que el T2 op
    re-apuntará.

  ## QA method

  Este TR se cierra bajo el patrón HYBRID:
  - Auto-execute lo estático: AC6 (JSON grep) + regression técnica + security
    + OWASP + PRE-baseline en illinois-trainings.
  - Diferir a IE lo runtime: AC1/AC2/AC4/AC5 dependen de MigrationApp UI
    ejecutando el case v3 en illinois, lo cual requiere que Camilo refresque
    AWS SSO y reseedee. AC3 attested-only (CamiloDevOrg dev evidence).

  ## Regression técnica + security

  Ver `attachments/tr-110-tc-102/regression-plan.txt` + `regression-results.txt`.
  6 tech PASS + 4 DEFERRED-al-IE-run · 7 security PASS. Sin blockers.

  ## OWASP Top 10

  Ver `attachments/tr-110-tc-102/owasp-top10-scan.txt`. 4 Applicable
  (A03/A04/A08/A09) → 4 PASS. 6 N/A. Sin defectos.

