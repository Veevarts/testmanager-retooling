notes: |
  ## Solution understood

  El bug de IM-1005 tiene una causa raíz única: `item_variant.sql` filtraba
  `WHERE pi.ISACTIVE = 1`, mientras que `sale_item.sql` emite FKs a TODA
  variante vendida (activa o no). Para Illinois eso dejó 4,977 sale-items
  refiriendo a Item_Variants inactivos que nunca entraron a SF → error
  `Foreign key external ID not found`. El fix es una sola query cambiada
  (item_variant.sql) más un segundo cambio defensivo en catalog_item.sql:

  1. `item_variant.sql`: remueve el WHERE, extrae las 4,711 variantes totales
     (267 inactivas entran con `Available_for_sale__c = false`,
     `Available_Collection_Online__c = false` — invisibles para POS/Shopify).
     Inactivas obtienen `Bypass_Stock__c = 1` (no reciben stock replenishment,
     así que sus sale lines históricas dispararían "Out of Stock" si se
     evaluara). También limpia una subquery muerta a `MERCHANDISEPRODUCTINSTANCEHISTORY`
     (dead code, verified no cambia el grain).
  2. `catalog_item.sql`: agrega `Bypass_Stock__c` derivado por EXISTS —
     predicado que replica la semántica del rollup `Number_of_variants2__c`:
     bypass = 1 si no hay variante activa non-primary AND existe una variante
     inactiva con sale lines. Illinois: exactamente 234 products califican
     (todos totalmente discontinuados). El "over-including 33" que hubiera
     tenido un proxy zero-active más burdo queda evitado.
  3. `shop-item-variant-coverage-query.spec.ts` (nuevo): 7 asserts estáticos
     que bloquean el contrato (no ISACTIVE filter en item_variant, ambos
     Bypass derivations, sale_item join sin ISACTIVE, stock_replenishment
     mantiene su ISACTIVE filter). Sigue el patrón de IM-809.

  ## Inferred technical tests

  | Test                                              | Prueba                    | Ejecutable acá?               | Verdict |
  | ------------------------------------------------- | ------------------------- | ----------------------------- | ------- |
  | spec.ts static contract (7 asserts)               | AC1/2/3/5 estructural     | Sí — simulado local en Python | passed (7/7) |
  | item_variant.sql PRE vs POST via safesql          | AC1 + AC3 grain           | Sí — safesql illinois_2       | passed  |
  | catalog_item.sql PRE vs POST via safesql          | AC3 + AC5 grain / Bypass  | Sí — safesql illinois_2       | passed  |
  | sale_item.sql file diff                           | AC5 — sale_item unchanged | Sí — git diff BASE..HEAD      | passed (0 bytes) |
  | verify.sql aggregates (79713/4977/234/267/UUID)   | AC1/AC2/AC3 all-in-one    | Sí — safesql illinois_2       | passed (9/9) |
  | Post-fix re-upsert de los 4,977 sale-items en SF  | AC4 post-fix retry        | No — requiere que Camilo re-corra el load | not-run |

  ## Independent verification of dev-reported numbers

  El PR body reporta 9 números específicos. QA los re-corrió en source y todos
  coinciden exacto (ver `verify-aggregates.sql` + `verify-aggregates.json`):

  - total sale-item join                       = 79,713  ✔ (coincide ticket)
  - sale_items ref inactive variant            =  4,977  ✔ (coincide ticket error count)
  - distinct inactive variants with sales      =    234  ✔ (matches PR claim)
  - distinct inactive products with sales      =    234  ✔ (matches PR claim; = catalog Bypass_Stock=1 count)
  - total variants (all states)                =  4,711  ✔ (matches POST item_variant grain)
  - active variants                            =  4,444  ✔ (matches PRE item_variant grain)
  - inactive variants                          =    267  ✔ (matches POST item_variant Bypass_Stock=1 count)
  - sample UUID present in source              =      1  ✔
  - sample UUID ISACTIVE flag                  =      0  ✔ (confirmed root cause)
  - sample UUID sales count                    =     27  (informational — 27 sale lines depend on this 1 variant)

  ## QA method

  PR es SQL-only → estrategia estándar: pre-fix vs post-fix contra el mismo
  source con la misma input. Cubre AC1/AC2/AC3/AC5 con evidencia dura. AC4
  (retry de los 4977 en SF) queda pendiente porque requiere que Camilo re-corra
  el bulk load post-merge; el bundle POST-verify puede reejecutarse contra el
  org destino después. Sin blockers de seguridad.

  ## Regression técnica + security

  Ver `attachments/tr-109-tc-101/regression-plan.txt` + `regression-results.txt`.
  10/10 técnicas PASS, 5 security PASS + 2 N/A. Ningún High/Critical.

  ## OWASP Top 10

  Ver `attachments/tr-109-tc-101/owasp-top10-scan.txt`. 4 Applicable
  (A03/A04/A08/A09) → 4 PASS. 6 N/A. Sin defectos.

