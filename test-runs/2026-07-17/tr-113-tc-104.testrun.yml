description: |
  QA execution for IM-865 (Historia, priority High, epic IM-70 Altru Queries).
  QA Sub-task: IM-1104. PR under test: Veevarts/MigrationToolETL#147 (OPEN, 5 commits).

  Método QA:
  1. Fetch SQL at BASE (71aaf3ad) y HEAD (18e59ad1) vía `gh api contents?ref=<sha>`
     (sin cambiar la copia local).
  2. Static contract check en el outer SELECT — 7 field contracts + external ID prefix.
  3. Clone MigrationToolETL@pr-147 + `npm ci` + `npm run test:queries` (300 pass local).
  4. Live safesql runs (tucson + illinois_2 + aspen) sobre BASE vs HEAD, wrapped
     con DECLAREs para los 4 entry params (`@hasDateFilterFrom=0`, `@hasDateFilterTo=0`,
     `@dateFilterFrom='2000-01-01'`, `@dateFilterTo='2100-01-01'`) para eliminar
     filtro de fecha y ver el universo completo.
  5. Mutation `LEFT JOIN PaymentTotals → JOIN PaymentTotals` sobre la copia local
     del SQL + re-run test:queries para probar el claim del PR body.
  6. test:queries:docker wire-in check (package.json diff) + intento local
     (bloqueado por testcontainers 60s startup wait en colima+arm64).
  7. OWASP Top 10 applicability scan sobre el diff.

  Evidencia clave live (Tucson):
  - 106 rows POST vs 88 rows PRE → delta = **18** = exactamente el claim del
    PR body "Tucson: 18 MG-claim installments".
  - Field contract AC1: **7/7 PASS en las 106 filas live**.
  - 0 dupes en `Implementation_External_ID__c` (106/106 únicos).
  - 0 dupes en `vnfp__Opportunity_Payment__r:...` (106/106 únicos).

