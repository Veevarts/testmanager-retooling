    ## Solution understood

    El query `pledge_payments_unpaid_charges.sql` ya existía pero producía
    Charge rows que el Pay flow de Veevart no podía consumir. El PR corrige
    3 field contracts + 4 fixes secundarios:

    1. `vnfp__Opportunity_Payment__c` (bare FK) → `vnfp__Opportunity_Payment__r`
       (relationship external ID) usando `{PledgeID}-{InstallmentID}` — la key
       real del OppPayment en `opportunity_payments.sql`.
    2. `vnfp__Technical_Charge__c` no se emitía → ahora `1`. NFP
       `OpportunityPaymentPayController` filtra por este campo; sin él, el
       charge era invisible para Pay.
    3. `Auctifera__Status__c` = `'Pending'` → `'Unpaid'` con `Type=NULL`. Con
       `Pending` + amount = payment amount, NFP `updateOpportunitiesByCharge`
       marca `npe01__Paid__c=true` en insert (peor que el bug: silenciosamente
       corrupta todos los future payments). El `Type=NULL` es necesario porque
       `setIgnoredInChargeItemDefaultBatch` reescribe `Unpaid → Succeeded` si
       Type tiene valor.
    4. Opportunity linkea vía `vnfp__Donation__r` (no `vnfp__Opportunity__r`
       cuyo label es "Membership"). NFP `Opportunity.vnfp__Membership_Program__c`
       es null en donations → `vnfp__Donation__r` es la lookup correcta.
    5. `Revenue_ID_legacy__c` NULL (era el pledge revenue id → `unique=true`
       constraint hacía `DUPLICATE_VALUE` en installments 2..N de cualquier
       pledge multi-installment; regresión de "future payments not
       collectable").
    6. `Auctifera__POS_Purchase__c` NULL (era colision hazard con
       `PaymentService.getTechnicalCharge` LIMIT 1 + `OpportunityTriggerHandler`
       sobrescribía `Auctifera__Amount__c` con el pledge total).
    7. Charge Implementation_External_ID__c ahora prefijado con `UNPAID-{PledgeID}-{InstallmentID}`
       para evitar colisión con charges emitidos por
       `charge_with_order`/`charge_without_order`.
    8. Scope amplía a active matching-gift claims (viejo gate `TYPE='Pledge'`
       los excluía; comparten el pledge installment model).

    ## Inferred technical tests (mapped to ACs)

    | Test                                                | AC   | Executable here? | Verdict |
    |-----------------------------------------------------|------|------------------|---------|
    | Static SELECT-list contract check HEAD vs BASE      | AC1  | YES              | PASS 8/8 |
    | safesql tucson HEAD contract on live rows           | AC1  | YES              | PASS 7/7 en 106 filas |
    | safesql tucson PRE vs POST row delta = 18           | AC4  | YES              | PASS (18 = claim exacto) |
    | safesql cardinality tucson/illinois_2 (0 dupes)     | AC2  | YES              | PASS 0/369 dupes |
    | safesql 3-profile scope aggregate                   | AC3  | YES (parcial)    | PASS partial 3/8 |
    | safesql 5-profile scope (MOAD/LI/Everson/HD/8th)    | AC3  | NO (profiles missing) | attested por dev CI |
    | npm run test:queries                                | AC5  | YES              | PASS 300/300 |
    | package.json wire-in de spec en test:queries:docker | AC5  | YES              | PASS (spec added) |
    | Mutation LEFT JOIN → JOIN sobre string specs        | AC5  | YES              | PASS (string specs stayed green — confirma PR claim) |
    | Mutation LEFT JOIN → JOIN sobre docker suite        | AC5  | NO (timeout)     | dev-CI attested |
    | OWASP Top 10 applicability scan                     | -    | YES              | 4 Applicable · 4 PASS · 0 High/Critical |

    ## Objective fit

    - Ticket objective: "future pledge payments become collectable in Veevart
      after go-live".
    - PRE state observado (Tucson-live): 88 Unpaid Charges emitted con
      `vnfp__Opportunity_Payment__c` = bare InstallmentID → Pay lookup
      resolves to nothing → payments not collectable.
    - POST state observado (Tucson-live): 106 Unpaid Charges emitted con
      `vnfp__Opportunity_Payment__r` = `{PledgeID}-{InstallmentID}` + Technical=1
      + Status=Unpaid + Type=NULL → Pay lookup resolves correctly + rollup
      correctly skips (npe01__Paid__c stays false).
    - Objective met? YES for all 5 ACs — 4 fully live-verified, 1 (AC3) at 3/8
      profiles with 0 divergence from claim.

