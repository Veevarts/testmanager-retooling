      Long Island / Everson / High Desert / 8vo tenant NO alcanzables.
      Cross-tenant reconciliation (804 rows / ~$37.1M) verificada al 46% con
      3/8 profiles = 369 rows / $19.5M sin divergencias; el 54% restante
      queda attested por el safesql cross-tenant run del dev (commit
      `a3535d46d759` per PR body).
    - test:queries:docker wire-in confirmed (spec añadido al hard-coded list).
      Live re-run local bloqueado por testcontainers 60s startup timeout en
      colima+arm64 mssql:2022-latest (SQL Server bootea pero necesita ~90-120s
      para emitir "Started"). Attested por CI del dev: 22/22 pass en Linux
