notes: |
  ## Solution understood

  El bug de IM-694 tenía DOS causas raíz en el mismo query:
    1. Under-inclusion: el query original hand-unionaba base CONSTITUENCY +
       4 tablas per-role date-range (BOARDMEMBER, VOLUNTEER, STAFF, FUNDRAISER).
       Todo lo que fuera system-computed sin date-range table (Donor, Member,
       Patron, Event registrant, Major giving prospect, Individual, etc.) se
       dropeaba. Además hardcodeaba 'Board Member' → orgs que renombran (Aspen
       usa 'Board Trustee') veían el label incorrecto o el rol ausente.
    2. Over-inclusion: sacaba TODOS los rows de base CONSTITUENCY, incluyendo
       segmentation-style labels retirados (HSDF 2023 Segment C, Spring 2023
       Segment D…) que Altru esconde una vez la definición se desactiva.

  Fix: source desde `V_QUERY_CONSTITUENCY` — el Blackbaud view que backea el
  UI "Constituencies" tab de Altru — filtered `WHERE vq.ISACTIVE = 1`. Ese
  view ya unifica manual + system a UN row per assignment con el grain, date
  range, y label tenant-specific correctos. Extras:
  - `Is_Active__c = (DATETO IS NULL)` preserva date-ended roles como inactive
    but exported.
  - External ID = `COALESCE(vq.ID, 'SYS_'+CONSTITUENTID+'_'+CONSTITUENCYDEFINITIONID)` —
    view ID es NULL para system rows; se sintetiza deterministic para upsert
    idempotente.
  - ROW_NUMBER dedup por Implementation_External_ID__c → garantiza uniqueness
    incluso si el view emitiera 2 rows ID-NULL para la misma tupla.

  ## Inferred technical tests

  | Test                                              | Prueba                    | Ejecutable acá?               | Verdict |
  | ------------------------------------------------- | ------------------------- | ----------------------------- | ------- |
  | constituency-query.spec.ts static contract (9 asserts) | AC1/2/3 estructural   | Sí — simulado local Python    | passed (9/9) |
  | safesql PRE vs POST tucson (full extractor)       | AC1/2/4 Tucson             | Sí — safesql tucson           | passed |
  | safesql PRE vs POST aspen (full extractor)        | AC1/2/4 Aspen             | Sí — safesql aspen            | passed |
  | Filter by 3 constituent UUIDs + count reconciliation | AC1+AC3+AC4 (los 3 ejemplos) | Sí — Python filter sobre outputs | passed |
  | External ID uniqueness across full pool (0 dupes, 0 NULLs) | AC2 grain preservation | Sí — Python aggregate         | passed |
  | AC5 CI gates (lint, test:queries, build)          | AC5 upstream verify        | Attested — PR body confirma 245/245 tests + build clean | passed (attested) |

  ## Independent verification of dev-reported numbers

  El PR body reporta los 3 counts. QA los re-corrió live y coinciden EXACTO:

  | Constituent               | Altru UI (ticket) | PRE (BASE) | POST (HEAD) | Verdict |
  | ------------------------- | ----------------- | ---------- | ----------- | ------- |
  | Tucson 22561              | 2                 | 1          | **2**       | PASS    |
  | Aspen 104021              | 13                | 6          | **13**      | PASS    |
  | Tucson Joan Grecchi 8-10019267 | 1            | 2 (extras) | **1**       | PASS (bidirectional resolved) |

  Invariants adicionales verificados:
  - 0 external ID dupes en 4 files (192,566 rows total) — AC2 grain PASS.
  - 0 external ID NULLs en 4 files — dev's contract holds.
  - Tucson distinct-label count: PRE 110 → POST 32 (Δ -78 retired segments,
    dev claim EXACTO).
  - Aspen 'Board Trustee' preservado en POST (tenant rename bug fixed).
  - Aspen date-ended Member preservado con Is_Active=0 (historical role).
  - GUID vs SYS_ ID collision: 0 (94,262 SYS in Tucson POST mezclados con
    GUIDs, todos únicos).

  ## QA method

  Este TR se cierra bajo el patrón HYBRID:
  - Auto-execute: spec.ts simulation + safesql BASE vs HEAD × 2 profiles +
    per-constituent filter + external ID audit + regression + security + OWASP.
  - AC5 (CI gates): attested via PR body claim (245/245 tests + lint + build).

  Sin defectos raise-eados. PR listo para merge desde QA.

  ## Regression técnica + security

  Ver `attachments/tr-111-tc-103/regression-plan.txt` + `regression-results.txt`.
  12/12 técnicas PASS · 5 security PASS + 2 N/A · 0 High/Critical.

  ## OWASP Top 10

  Ver `attachments/tr-111-tc-103/owasp-top10-scan.txt`. 4 Applicable
  (A03/A04/A08/A09) → 4 PASS · 6 N/A. Sin defectos.

