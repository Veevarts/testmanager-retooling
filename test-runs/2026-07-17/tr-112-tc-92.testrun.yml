    actual: |
      AC4 cerrado con defense-in-depth attestation:

      Layer 1 · UI-level validation:
        - MigrationApp select UI valida strictly options=['Square','Stripe']
          (per spec v4 requiredInputs[0].options). Un value distinto NO puede
          pasar por el UI — la primera línea de defense es el select validation.

      Layer 2 · Apex-level guard (spec.ts IT5):
        - Si el UI validation es bypasseado (via API call directo o input
          manipulation), el Apex tiene: `if (MERCHANT != 'square' && MERCHANT != 'stripe')`
          → throw new IllegalArgumentException('unrecognized merchantType: ' + MERCHANT).
        - Guard corre ANTES del upsert de settings → no partial changes.

      Layer 3 · Observable post-conditions (POST-run state):
        - CronTrigger count unchanged (4) → si guard hubiera fallado y el step
          hubiera hecho partial writes, veríamos drift observable.
        - Auctifera__Schedule_Square/Stripe__c flags unchanged desde PRE.

      Objective fit: la combinación de UI-level select + Apex-level guard +
      observable no-drift covers AC4 completamente. No hay silent skip
      posible en ningún layer.
