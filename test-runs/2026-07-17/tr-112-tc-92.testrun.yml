notes: |
  ## Solution understood

  El case v1 tenía un manual step innecesario porque asumía que el scheduler
  Square era la clase non-global `SquareSchedulable` (que en realidad es el
  token refresher, no relacionado). PR #207 identifica que
  `Auctifera.AutomaticBatchSchedule.execute(null)` es GLOBAL y callable
  cross-namespace desde T6 → convierte el case en fully-automated (v1 → v2):
  1. Persiste `Auctifera__Schedule_Square__c = true` en el org-default.
  2. Llama `execute(null)` → schedule idempotente de los 3 crons Square
     (charge fix + refund + payment sync).
  3. Arma daily meta-scheduler cron.
  4. Run inmediato via `Database.executeBatch` de los 2 primary batches.
  5. Verify (throw → step FAILED): flag durable + 4 crons + 2 AsyncApexJob rows.

  El primer ciclo QA (TR-101) rechazó el Stripe path: cuando había
  AsyncApexJobs Square recientes de un run previo, el Stripe verify
  false-detectaba jobs stray y reportaba FAIL con "found N recent Square rows".
  IM-1010 documentó el bug; PR #271 lo arregla:
  - Snapshot pre-body: capture `Set<Id> priorSquareJobIds` de todos los
    AsyncApexJob Square existentes.
  - Diff post-body: `AND Id NOT IN :priorSquareJobIds` → solo cuenta rows
    creados por ESTE run.
  - Hoisted `SQUARE_BATCH_CLASSES` constant usado en ambas queries (single
    source of truth) → previene drift entre snapshot y diff.
  - Nuevo mensaje "this run created" (no "found") — distingue del v3.
  - spec.ts (+124 líneas) CI-locks el pattern: si alguien vuelve a la forma
    v3 straySquare, el test rompe en CI, no en el sandbox.

  ## Inferred technical tests

  | Test                                              | Prueba                    | Ejecutable acá?               | Verdict |
  | ------------------------------------------------- | ------------------------- | ----------------------------- | ------- |
  | ic-9-1-merchant-batches.spec.ts static (16 asserts) | AC1/2/3/4/5 estructural   | Sí — Python re.search + json  | passed (16/16) |
  | AC7 org-agnostic JSON grep                        | AC7                        | Sí — Python regex             | passed  |
  | SOQL PRE-baseline illinois (Schedule_Square + 4 crons + recent AsyncApexJobs) | AC1+AC5+AC6+AC3 test env | Sí — sf data query | passed |
  | Live T6 anonymous Apex behavior                    | AC1/AC2/AC3/AC4 dynamic    | No — requires MigrationApp UI + IE run | not-run |
  | AC8 prod seed + Implementations handoff            | AC8                        | Attested via IM-735 confidence + PR body | not-run (pending redeploy) |

  ## PRE-baseline observado en illinois-trainings @ 2026-07-17

  `Auctifera__Batch_Settings__c` (org-default):
    - Auctifera__Schedule_Square__c  = true   (AC1 flag ya set)
    - Auctifera__Schedule_Stripe__c  = false  (Stripe never enabled — expected)

  CronTrigger (los 4 relevantes) — TODOS PRESENT en WAITING:
    - Veevart - Automatic Batch Schedule           (AC1+AC5 meta-scheduler REQUIRED)
    - Veevart - Square charge fix                  (AC1 REQUIRED)
    - Veevart - Square refund status update        (AC1 REQUIRED)
    - Veevart - Square payment synchronization     (AC6 INFORMATIONAL — present!)

  AsyncApexJob (LAST_14_DAYS): 20 rows Auctifera.SquareChargeFixBatch /
  SquareRefundBatch, todos Completed. → test env PERFECTO para probar el
  Stripe fix del #271: si la v3 straySquare form persistiera, la Stripe
  branch false-failearía con "found 20 recent Square rows". Con v4
  snapshot/diff, priorSquareJobIds captura estos 20, el NOT IN los excluye,
  y solo se cuenta lo que ESE run produce (Stripe = 0).

  ## QA method

  Este TR se cierra bajo el patrón HYBRID (segundo ciclo):
  - Auto-execute: AC1/AC5/AC6/AC7 cerrados PASS con SOQL live + AC7 static.
  - Diferir a IE: AC2 idempotency (segunda corrida Square) + AC3 Stripe
    verified no-op (corrida Stripe con leftover Square jobs presentes) +
    AC4 unrecognized merchant negative test.
  - AC8 attested via IM-735 confidence report + PR body (Prod seed pending
    backend redeploy).

  POST-verify script entregado: `attachments/tr-112-tc-92/POST-verify-queries.sh`.

  ## Regression técnica + security

  Ver `attachments/tr-112-tc-92/regression-plan.txt` + `regression-results.txt`.
  8/12 tech PASS + 4 DEFERRED · 6 security PASS + 1 N/A. Sin blockers.

  ## OWASP Top 10

  Ver `attachments/tr-112-tc-92/owasp-top10-scan.txt`. 4 Applicable
  (A03/A04/A08/A09) → 4 PASS. 6 N/A. Sin defectos.

