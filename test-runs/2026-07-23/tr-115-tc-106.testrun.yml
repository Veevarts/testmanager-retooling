description: |
  QA execution para IM-1077 (IC 5.01 Set Account & Opportunity Record Types,
  hybrid v3, PR Veevarts/MigrationAppBackend#249 MERGED 2026-07-16). Primera
  corrida que valida el paso nuevo del harness: **el run del IE disparado y
  monitoreado por Playwright** en vez del handoff manual al IE.

  Método QA:
  1. Reconciliación ticket vs PR → run card: case `501` v3, pasos auto
     (recordTypes discovery / recordTypeVisibility / standardValueSet) +
     2 manuales guiados.
  2. Playwright sobre migration.dev.rtl.veevartapp.com (sesión Google SSO
     autorizada una vez por el QA en la ventana del MCP): workspace
     "Test IM cases Org Tucson" → Org Implementation → Start new run →
     Plan preview: 75 defaults desmarcados programáticamente + check SOLO en
     card 501 (inferida del título del ticket: [ICA] 5.01 → 501; versión v3
     cotejada contra el PR) → run AD-HOC (sin publicar cambios de template) →
     Connect org: 00DWI00000CIwZi2AL (ilholocaustmuseum--trainings) →
     ⛔ gate humano → Start run aprobado explícitamente por el QA.
  3. Polling del Run Dashboard (sin auto-refresh, reload cada 30-150s):
     6 pending → auto steps Done (~10 min) → pausa "Needs you" en manuales.
  4. Pasos manuales ATESTADOS con "Mark step as done" por instrucción explícita
     del QA para ejercitar el flujo completo (workspace de prueba) — el trabajo
     manual de retiro/cleanup NO se ejecutó en el org (ver notes).
  5. Verify final del engine corrió automático tras la 2ª atestación → run
     **6 done · 0 blocked · 0 failed · 0 pending**.
  6. POST-verify independiente por sf CLI read-only (alias illinois-trainings):
     RecordTypes, BusinessProcess y ContactRole picklist.

  Run: e28f0ec9-47ab-4ca4-a955-fe48f3c0336f · started/attested by
  evansri.mondragonp@veevart.com (Playwright operado por claude).

