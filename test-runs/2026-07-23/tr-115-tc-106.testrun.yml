      explícita del QA para ver el flujo end-to-end en workspace de prueba):
      los RTs duplicados Donation/Membership (con Description) SIGUEN en el
      org. El verify final del engine pasó igual porque por diseño (AC6)
      asserta solo los efectos automáticos. Follow-up: si illinois-trainings
      debe quedar limpio, ejecutar el cutover manual real (~50 min guiados).
    - Observación update-path: los RTs Veevart pre-existentes (Donation/
      Membership sin Description) apuntan al BusinessProcess MANAGED
      (vnfp__NPSP_Default), no al unmanaged — consistente con la semántica del
      PR (update path preserva el process existente; solo el create path
      resuelve el prefer). Read-back por nombre = "NPSP_Default" igual. En un
      org fresco el create elegiría el unmanaged.
    - Paso nuevo del harness VALIDADO: navegación completa, selección por
      título inferido, gate de Start run, polling, gate de atestación de
      manuales, verify final y POST-verify por CLI. Guardrail fijado: la
      automatización NUNCA da "Mark step as done" por su cuenta — es una
      atestación humana (o instrucción explícita del usuario, como aquí).

