description: |
  QA execution para IM-1073 (Historia, priority Medium, epic IM-735 Implementation
  Cases Automation). QA Sub-task: IM-1112. PR under test:
  Veevarts/MigrationAppBackend#245 (MERGED 2026-07-15, merge commit bb9a7e38).

  Método QA:
  1. Clone `MigrationAppBackend` en `/tmp/qa/MigrationAppBackend-IM-1073/` + `npm ci`
     (PR es CODE, no spec-only — 7 files +631/-32).
  2. Static structural checks del spec JSON at merge-commit `bb9a7e38`: case v2,
     template v2, hybrid, defaultOrder 702, 4 steps (1 validationRule + 2 historyTracking
     + 1 MANUAL), 9 + 14 = 23 fields con matcher IM-1069, `exclusive` absent.
  3. CSV playbook cross-check (per `[[reference-implementation-cases-catalog]]`):
     Order 7.02 lista el pre-step Restrict_Misc_Gift_Card + field counts 9 + 14.
  4. jest de las 3 suites tocadas → 266 tests PASS. Aislado el validationRule op →
     11 tests dedicados PASS.
  5. Genuinely-new proof: `grep -c validationRule adapter` = 0 en merge-base `140e00d4`,
     10 en merge-commit `bb9a7e38`.
  6. Double label-trap live via `sf sobject describe --target-org illinois-trainings`:
     Total2__c (storage) vs Total__c + Total_Amount__c (2 deprecated formula twins);
     Paid_Value__c (storage) vs Paid_Value1__c (formula).
  7. PRE-baseline Tooling API: 20/23 tracked (Contact, POS_Purchase, Payment_Method
     untracked en Client Purchases).
  8. API-driven IE run (Path A) en illinois-trainings: validationRule no-op branch +
     2 historyTracking + attest MANUAL. POST-verify: 23/23 tracked, delta = 3 flips.

  Evidencia clave:
  - Merge-commit `bb9a7e38` merged 2026-07-15 21:47Z por veevart_josed. CODE PR de 7
    files: NUEVO validationRule T3 op (adapter +150, handler +22, schema +61, + specs)
    + ic-7-02 spec v2 (+143/-32).
  - jest: 266 tests PASS en las 3 suites tocadas. 11 tests dedicados al validationRule
    op: deactivate+readback, no-op-absent, anyOf resolution, activate-absent=applied-false,
    persist-false detection, xsi:nil normalization, SaveResult error, 3 malformed-input rejections.
  - Genuinely-new: validationRule op ausente en merge-base (0 refs), presente en
    merge-commit (10 refs) → el op es código nuevo real, no un no-op refactor.
  - Double label-trap (attachments/tr-120-tc-111/scenario-1/label-trap-verification.md):
    * `Auctifera__Total2__c` calc=false label "Total" ← spec target
    * `Auctifera__Total__c` calc=true label "(DEPRECATED) Total"
    * `Auctifera__Total_Amount__c` calc=true label "(Deprecated) Total" (segundo twin!)
    * `Auctifera__Paid_Value__c` calc=false label "Amount Received" ← spec target
    * `Auctifera__Paid_Value1__c` calc=true label "Paid Value" (trap)
  - Live run `d004b4b9-e558-48cc-ac6d-2ff087cd6ff0`:
    * step 1 validationRule (no-op, Restrict absent) → done, no falla bajo fail-fast
    * step 2+3 historyTracking → done
    * step 4 MANUAL attested → run COMPLETED, 4/4 done
  - Delta pre→post = 3 flips (Client Purchases: Contact, POS_Purchase, Payment_Method
    false→true). Los 20 pre-tracked preservados (additive).

