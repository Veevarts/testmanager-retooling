  notes: |
    - PR MERGED 2026-07-15 21:47Z. Dev-verified en CamiloDevOrg + im696-tucson; QA
      agrega illinois-trainings como tercer org independiente (Gift Shop confirmed:
      ClientPurchase + CatalogItem describe OK).
    - Node 25.4.0, npm 11.7.0. jest 266 tests clean en las 3 suites tocadas.
    - Session Cognito: el token localStorage expiró (exp -109 min); navegar a rutas
      autenticadas NO lo auto-refrescó. Un click en "Continue with Google" (SSO cookies
      vivos) reissued un token fresco de 60 min SIN challenge. Documentado para futuras
      corridas — ver `[[reference-migrationapp-token-persistence]]`.

    ## Solution understood

    IC 7.02 v1 tenía hardcoded field names + sin el pre-step de validation rule.
    El PR #245 hace 2 cosas:

    **A. Nuevo T3 op `validationRule`** (reusable, zero per-IC code): toggle validation
    rules por fullName via CRUD Metadata API (read → flip active → full-component write
    con normalización xsi:nil/typed-scalar → read-back verify). anyOf drift-tolerant
    (managed rules namespace el developer name → prueba bare + namespaced). deactivate+
    absent = idempotent success no-op; activate+absent = applied=false (nunca crea).

    **B. ic-7-02 spec v2** (auto→hybrid): consume el matcher IM-1069 para los 23 fields,
    agrega el validationRule pre-step (Restrict_Misc_Gift_Card), restaura additive
    behavior (exclusive absent), cierra IM-935 (Shopify_Product_Id__c resuelto), y agrega
    MANUAL step para 2 Names (Client Purchase Name + Shop Item Name).

    El pre-step validationRule es fiel al playbook Auctifera: el CSV IC 7.02 declara
    "Before do this... object manager → Shop item → Validation rules → deactivate:
    Restrict_Misc_Gift_Card". El op automatiza exactamente ese pre-step manual.

    ## Inferred technical tests (mapped to ACs)

    | Test                                                              | ACs        | Executable here? | Verdict |
    |-------------------------------------------------------------------|------------|------------------|---------|
    | Static spec fidelity (23 fields + matcher + exclusive absent)     | AC1-AC4    | YES              | PASS    |
    | CSV playbook cross-check (Order 7.02 pre-step + 9+14)             | AC2, AC3   | YES              | PASS    |
    | jest validationRule op (11 dedicated tests)                       | AC5        | YES              | 11/11 PASS |
    | Genuinely-new proof (0→10 refs)                                   | AC5        | YES              | PASS    |
    | Double label-trap resolution (sf sobject describe)               | AC2, AC3   | YES              | PASS    |
    | Shopify_Product_Id__c required matcher (IM-935)                   | AC4        | YES              | PASS    |
    | PRE-baseline Tooling API                                          | AC7        | YES              | 20/23 pre |
    | API-driven run + validationRule no-op branch live                | AC5, AC7   | YES              | 4/4 done |
    | POST-verify + delta (additive)                                    | AC2,AC3,AC7 | YES             | 23/23, 3 flips |
    | MANUAL Name handoff attestation                                   | AC6        | YES (attest-only) | Handoff cerrado |

    ## Objective fit

    - Ticket objective: build reusable validationRule op + rework ic-7-02 onto IM-1069
      matchers + 2 objects + close IM-935 + MANUAL Names.
    - Delivered: op nuevo con 11 tests + spec v2 con 23 fields + validationRule pre-step.
      Verified end-to-end en illinois-trainings (tercer org).
    - Objective met? YES. Los 7 ACs cerrados con evidencia live + jest independiente.

