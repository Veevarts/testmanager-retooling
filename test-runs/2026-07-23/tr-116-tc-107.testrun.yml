status: completed
description: |
  QA execution para IM-1078 (IC 5.23 Update Campaigns Page Layout, hybrid v3,
  PR Veevarts/MigrationAppBackend#250 MERGED 2026-07-16). Primera corrida que
  valida la VARIANTE API del paso "corrida del IE" del harness: run creado,
  alimentado (operator input) y atestado enteramente por la API de plan-runs —
  sin UI — con el token de la sesión autenticada (localStorage, los calls van
  por fetch dentro del browser: el token nunca sale de él).

  Playbook API ejecutado (transcript completo en attachments):
  0. GET /implementations/cases → preflight seed (ic-5-23 v3 activo).
  1. POST /implementations/plan-runs {clientId, orgId, caseIds} → 202
     AWAITING_INPUT (input park inmediato).
  2. GET /implementations/runs/:id → select parqueado con 6 layouts
     descubiertos EN VIVO (namespace reconstruido) — AC1.
  3. POST /plan-runs/:id/inputs {operatorInputs:{campaignLayout: V3}} → 202.
  4. Polling GET → paso auto done (~12 min de barrido T2), run paused, manual 1
     blocked-human.
  5. POST /plan-runs/:id/steps/:caseRunId/:stepRunId/handoff × 2 (atestaciones
     por instrucción explícita del QA) → run COMPLETED 3/3.

  Verificación independiente (sf CLI, Tooling API, read-only): 125
  ProfileLayout de Campaign apuntando al layout V3 seleccionado, 14 en el
  layout local (set skip-por-acceso — patrón 42/4 del dev en CamiloDevOrg).

  v2 (deep-dive, mismo método que TR-115): Campaign.Default NO existe en
  illinois-trainings (5 RTs custom, ninguno "Default") → la condición exacta
  que rompía al v2 del spec estaba presente y el run completó → scenario 3
  skipped→passed (5/5).

  Run: f2f9e3b0-9ffb-4bbe-915c-af387916e49a · startedBy
  evansri.mondragonp@veevart.com (API operada por claude).
testCaseIds:
