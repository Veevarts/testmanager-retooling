environment:
  name: "GitHub · Veevarts/MigrationAppBackend#251 (MERGED) + Salesforce sandbox illinois-trainings"
  url: "https://github.com/Veevarts/MigrationAppBackend/pull/251"
  buildVersion: 'IC config-plan case (mismo shape que IM-939/IC 9.1 e IM-940/IC 9.2). 2 files touched: ic-3-22-pos-batches.json (+18/-4) y ic-3-22-pos-batches.spec.ts (+89 new). BASE 5272434f (v3 hardcoded const) → HEAD 8d66dba6 (v4 required operator input). Estrategia: static JSON declarative + spec.ts sim + PRE-baseline illinois-trainings + defer AC2/AC3 al IE run.'
  notes: |
    - PR #251 MERGED 2026-07-16 05:05Z por veevart_josed (Camilo indica el
      MigrationApp-dev seed queda pending por AWS SSO expired).
    - illinois-trainings alias autenticado (Connected). Auctifera package
      instalado. PRE-baseline query devolvió 0 rows.
    - Bastion UP; safesql no requerido en este ticket (no hay SQL Server side).
    - Escenarios AC2/AC3 dependientes del IE ejecutando el plan
      `ic-3-22-pos-batches` v4 en illinois-trainings dos veces:
      * una con batchScope=500 (override)
      * una con batchScope=200 (default)

    ## Solution understood

    IC 3.22 v3 tenía el `BATCH_SCOPE` hardcoded como constant en el Apex del
    step. El PR #251 lo convierte en un required operator input:
    - JSON spec: añade `inputPayload.requiredInputs[]` con la declaración de
      `batchScope` (type=number, required=true, min=1, max=2000, placeholder=200).
    - Apex: reemplaza `final Integer BATCH_SCOPE = 200;` por
      `final Integer BATCH_SCOPE = Integer.valueOf(Decimal.valueOf('{{batchScope}}').round());`
      El `Decimal.round()` maneja input decimal (200.5 → 201) sin
      TypeException.
    - Runtime: MigrationApp T6 renderiza el Apex substituyendo `{{batchScope}}`
      con el valor operator-supplied, y el run parkea en AWAITING_INPUT hasta
      que el operator entrega el valor.
    - Step 2 (Cashier Drawer Control): sigue como `kind: MANUAL` porque el
      constructor no-arg del batch es `public` (no `global`) en ambos
      namespaces (Auctifera + vnfp) — no ejecutable desde anonymous Apex.
      La descripción del step da un handoff Lightning UI de 4 pasos.

    ## Inferred technical tests (mapped to ACs)

    | Test                                                    | AC   | Executable here? | Verdict |
    |---------------------------------------------------------|------|------------------|---------|
    | Static JSON declarative check (13 assertions)           | AC1  | YES              | PASS 13/13 |
    | jest ic-3-22-pos-batches.spec.ts                         | AC1  | YES              | PASS 5/5 |
    | BASE vs HEAD static diff of Apex script                  | AC1  | YES              | PASS (delta confirmado) |
    | AsyncApexJob query-back scope=500 en illinois-trainings  | AC2  | NO (needs IE run) | DEFERRED |
    | AsyncApexJob query-back scope=200 en illinois-trainings  | AC3  | NO (needs IE run) | DEFERRED |
    | Static grep hardcoded 18-char SF Ids                     | AC4  | YES              | PASS (0 found) |
    | Class refs org-agnostic (Auctifera. namespace)           | AC4  | YES              | PASS |
    | Cashier Drawer Control kind = MANUAL                     | AC4  | YES              | PASS |
    | OWASP Top 10 applicability scan                          | -    | YES              | 4 Applicable · 4 PASS · 0 High/Critical |

    ## Objective fit

    - Ticket objective: "confirm default + deliver" el IC 3.22 con batchScope
      operator-controlled.
    - Delivered part: HEAD spec v4 tiene `batchScope` como required input, Apex
      substituye el valor, spec.ts CI-lock el contrato → mechanism delivered ✅
    - Confirmed part: default = 200 (Salesforce standard batch scope) — el
      mecanismo lo permite pero **la CONFIRMACIÓN del valor por PM sigue
      pending** (decision confidence 70). Este TR valida el mecanismo, no la
      decisión.
    - Objective met? YES para el mecanismo (AC1/AC4). Los AC2/AC3 quedan
      DEFERRED hasta que el IE ejecute el plan; el objective completo se
      cierra cuando el IE lo corra y QA confirme los AsyncApexJob rows.

