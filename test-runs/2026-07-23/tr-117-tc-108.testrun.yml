description: |
  QA execution para IM-1079 (Historia, priority Medium, epic IM-735 Implementation
  Cases Automation). QA Sub-task: IM-1109. PR under test:
  Veevarts/MigrationAppBackend#251 (MERGED 2026-07-16, merge commit 8d66dba6).

  Método QA:
  1. Fetch JSON spec + spec.ts en merge-commit (8d66dba6) y merge-base (5272434f)
     vía `gh api contents?ref=<sha>`.
  2. Clone MigrationAppBackend + `npm ci`.
  3. AC1: static declaratives sobre el HEAD JSON (batchScope input schema, {{batchScope}}
     template, Decimal.round safety) + `jest ic-3-22-pos-batches.spec.ts` = 5/5 PASS.
  4. AC4: static grep para hardcoded IDs (0), class refs org-agnostic (Auctifera.),
     org-specific patterns (0), Cashier Drawer Control kind = MANUAL confirmado.
  5. AC2/AC3: PRE-baseline en illinois-trainings (0 jobs LAST_N_DAYS:7) — DEFERRED
     al IE run del plan.
  6. Security scan: 0 secrets · 0 SOQL injection surface · 0 hardcoded IDs · 0 dep changes.
  7. OWASP Top 10: 4 Applicable (A03/A04/A08/A09) todos PASS.

  Evidencia clave:
  - BASE (v3) tenía `final Integer BATCH_SCOPE = 200;` hardcoded + descripción
    "PM-editable constant"; sin `requiredInputs` array.
  - HEAD (v4) declara `batchScope` como required number input (min=1, max=2000,
    placeholder=200) + Apex usa `{{batchScope}}` template con `Decimal.round()`
    safety coercion.
  - spec.ts (5 tests, +89 lines nuevos) CI-lock los 5 aspectos del contrato.
  - PRE-baseline illinois-trainings: 0 AsyncApexJob rows para
    Auctifera.POSPurchasePaymentPropagationBatch → clean baseline, cualquier
    fila POST-IE-run será attributable.

