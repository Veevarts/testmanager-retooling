environment:
  name: "GitHub · Veevarts/MigrationAppBackend#266 (MERGED)"
  url: "https://github.com/Veevarts/MigrationAppBackend/pull/266"
  buildVersion: 'TypeScript library refactor + jest spec expansion. 5 files touched: 3 composition-only (scripts/master-template-composition.ts, .spec.ts, seed-master-template.ts) + 2 collateral spec-only doc-comment edits (ic-3-25 spec.ts, ic-4-05 spec.ts). MERGE_BASE 3f13f082 (pin-list WORKING_CASE_IDS + FLIPPED_WORKING_CASE_IDS + EXCLUDE_FROM_MANUAL_TIER) → MERGE_COMMIT 5c3e1aa (predicate + EXCLUDE_FROM_MASTER applied to both branches + fail-loud guards). Estrategia: independent catalog assembly + pre/post drop reproduction + runtime dependsOn stamping check + jest full suite (14 tests).'
  notes: |
    - PR #266 MERGED 2026-07-16 16:00Z por veevart_josed. Master re-seed dev/prod
      queda PENDING-CREDS (AWS SSO expired) — orchestrator-owned handoff.
    - Node 25.4.0, npm 11.7.0 — clean `npm ci` sin warnings ni engine mismatches.
    - Sandbox Salesforce NO requerido en este ticket — el cambio es puro
      TypeScript compose logic + jest. safesql tampoco (no hay SQL Server).

    ## Solution understood

    El master template era una CURATED PIN-LIST (`WORKING_CASE_IDS`) + manual tier
    minus EXCLUDE. La curación era manual — un dev tenía que recordar pinnar cada
    case nuevo o cada case flippeado manual→auto/hybrid. IM-1090 hizo eso para
    los 8 cases flippeados esa cycle, pero dejó latente el "silent drop on flip"
    bug: un case cuyo feasibility se flippee después, sin pin correspondiente,
    caería del master sin CI alarm.

    IM-1096 reestructura la selección de allowlist a **predicate**:

        selectedIds = { case | feasibility !== 'manual' }
                    ∪ ( includeManual ? { case | feasibility === 'manual' } : {} )
                    \ EXCLUDE_FROM_MASTER

    Cambios de comportamiento:
    - Cualquier case no-manual entra automáticamente. Un case flippeado
      manual→auto/hybrid ya no depende de un pin manual.
    - El manual tier sigue in whole cuando `includeManual=true`, minus el mismo
      EXCLUDE_FROM_MASTER (antes se aplicaba solo al manual tier bajo el nombre
      `EXCLUDE_FROM_MANUAL_TIER`).
    - `ic-veevart-auth` (hybrid, tracked en `w4-foundations`) es la ÚNICA
      exclusión — sin la exclude, el predicate lo pullearía al master.
    - Guardrails introducidos: (a) fail-loud si un id en EXCLUDE_FROM_MASTER no
      está en el catálogo (typo detection); (b) fail-loud si un DEPENDS_ON edge
      tiene target no en el master.
    - `DEPENDS_ON` stamping (`ic-4-05→ic-4-01`, `ic-8-02→ic-3-03`) y ordering
      ascending por `defaultOrder` con `caseId` tie-break: sin cambios.

    Los cambios en `ic-3-25` y `ic-4-05` spec.ts son doc-comment only — actualizan
    los headers para reflejar la nueva predicate policy (no requieren WORKING_CASE_IDS
    pin). NO alteran feasibility ni defaultOrder de esos IC cases.

    ## Inferred technical tests (mapped to ACs)

    | Test                                                                | ACs        | Executable here? | Verdict |
    |---------------------------------------------------------------------|------------|------------------|---------|
    | jest master-template-composition.spec.ts en merge-commit             | AC1-9      | YES              | 14/14 PASS |
    | jest master-template-composition.spec.ts en merge-base (baseline)    | -          | YES              | 8/8 PASS (fewer tests) |
    | Independent catalog assembly via python3 (77 → 76)                   | AC1,2,3,9  | YES              | PASS (24+33+19) |
    | Pre/post silent-drop reproduction (harness TS)                       | AC4, AC5   | YES              | PASS (PRE drops, POST keeps) |
    | Runtime dependsOn stamping check                                     | AC6, AC7   | YES              | PASS (declared ≡ actual, 0 dangling) |
    | Fail-loud guards (2 jest tests with toThrow)                         | AC8        | YES              | PASS (both throws matched) |
    | Live dev/prod re-seed                                                | -          | NO (PENDING-CREDS) | HANDOFF |

    ## Objective fit

    - Ticket objective: consolidar el master template a **ALL non-manual + manual
      tier − EXCLUDE_FROM_MASTER** vía predicate en lugar de pin-list.
    - Mechanism delivered: 76 caseRefs = 24 auto + 33 hybrid + 19 manual, ic-veevart-auth
      única exclusión. Silent-drop-on-flip bug estructuralmente eliminado.
    - Pre/post evidence: PRE-fix devuelve 14 refs con las probe cases DROPPED,
      POST-fix devuelve 16 refs con ambas probe cases INCLUDED — bug reproducido
      y corregido de forma verificable.
    - Objective met? YES para el contract + composition logic. El master
      expandido de 76 refs tiene efecto en ambiente vivo solo tras el re-seed,
      que queda como manual handoff PENDING-CREDS.

