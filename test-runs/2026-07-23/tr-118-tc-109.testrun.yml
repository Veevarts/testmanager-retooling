description: |
  QA execution para IM-1096 (Historia, priority Medium, epic IM-735 Implementation
  Cases Automation). QA Sub-task: IM-1110. PR under test:
  Veevarts/MigrationAppBackend#266 (MERGED 2026-07-16, merge commit 5c3e1aa9e0cccac61ebce0bcf67383b29793a855).

  Método QA:
  1. Clone `Veevarts/MigrationAppBackend` en `/tmp/qa/MigrationAppBackend-IM-1096/` +
     `npm ci --no-audit --no-fund` (clean).
  2. Checkout merge-commit `5c3e1aa` + `npx jest scripts/master-template-composition.spec.ts --verbose`
     → 14/14 PASS.
  3. Independent catalog assembly: python3 script parsea los 77 spec JSONs, filtra
     `active !== false`, dedupe latest version por caseId, aplica EXCLUDE = { ic-veevart-auth }
     → 76 caseRefs con breakdown `{ auto: 24, hybrid: 33, manual: 19 }`.
     `ic-veevart-auth` es hybrid (no manual) — la razón de exclusión está en el
     comment de EXCLUDE_FROM_MASTER (tracked in `w4-foundations`).
  4. Pre/post silent-drop-on-flip proof: TypeScript harness `im1090-drop-reproduction.ts`
     construye un fixture con las 13 pre-fix WORKING_CASE_IDS + `ic-3-03-rename-tabs-and-labels`
     (dependsOn target) + `ic-veevart-auth` + dos probe cases (`ic-was-manual-now-auto`
     feasibility auto + `ic-brand-new-auto` feasibility auto). Corre el mismo harness
     al merge-base (`3f13f082`) y al merge-commit (`5c3e1aa`):
     - PRE: 14 refs, ambos probe cases DROPPED (silent).
     - POST: 16 refs, ambos probe cases INCLUDED (predicate).
  5. Runtime verification de DEPENDS_ON stamping + ordering en el catálogo real
     (harness `dependson-runtime-check.ts`): 76 refs · dependsOn declarado ≡ actual
     · dangling: 0 · orders ascending por defaultOrder.
  6. Fail-loud guards (AC8): los 2 tests con `expect().toThrow(...)` del suite ya
     los cubren en el jest run del paso 2 (14/14 PASS incluye ambos).
  7. Handoff: dev/prod re-seed queda PENDING-CREDS (AWS SSO expired) por PR body
     — orchestrator-owned, QA no ejecuta.

  Evidencia clave:
  - Merge-commit spec: 14 tests PASS. Merge-base spec: 8 tests PASS. Delta = +6
    tests nuevos (los 5 del nuevo predicate + 1 renamed) — la bijection
    `includes EXACTLY every active case minus the exclude set` es la assertion
    de catalog-completeness que faltaba.
  - Independent count: 77 catalog cases, 24 auto + 34 hybrid + 19 manual.
    Post-exclude: 76 refs, 24 auto + 33 hybrid + 19 manual — dev-reported number
    verified byte-for-byte.
  - Drop reproduction: PRE-fix devuelve 14 refs (NO incluye `ic-was-manual-now-auto`
    ni `ic-brand-new-auto` — silent drop confirmado); POST-fix devuelve 16 refs
    (incluye ambos — predicate probado).
  - dev-reported "76 caseRefs" es el número correcto. Coverage growth vs pre-fix:
    con el catálogo actual pre-fix master = 13 pinned + (19 manual − 1 excluded) =
    31 refs. Post-fix = 76 refs. **+45 refs adicionales (2.45x growth)**.

