  - scenarioIndex: 4
    scenarioTitle: "AC3 adversarial · Label-trap regression proof — bare apiNames son formula/DEPRECATED"
    testCaseId: 64aa88b4-d69e-48e5-95a6-df8d13d4e7bb
    testCaseKey: TC-110
    status: passed
    executedAt: "2026-07-23T21:53:00Z"
    duration: 1
    actual: |
      Live `sf sobject describe --target-org illinois-trainings --json` sobre los
      5 sobjects, filtrado a los fields que exhiben label-trap patterns:

      **Auctifera__Rental_Event__c**:
      - `Auctifera__Paid_Amount__c` → calculated=**true** (formula), label "Paid Amount (DEPRECATED)"
      - `Auctifera__Paid_Amount_2__c` → calculated=**false** (storage), label "Paid Amount" ← spec target ✅

      **Auctifera__Rental_Resources__c**:
      - `Auctifera__Subtotal_Amount__c` → calculated=**true** (formula), label "(DEPRECATED) Subtotal Amount"
      - `Auctifera__Subtotal_Amount3__c` → calculated=**false** (storage), label "Subtotal Amount" ← spec target ✅
      - `Auctifera__Tax_Amount__c` → calculated=**true** (formula), label "(DEPRECATED) Tax Amount"
      - `Auctifera__Tax_Amount3__c` → calculated=**false** (storage), label "Tax Amount" ← spec target ✅

      **Auctifera__Rental_Payments__c**:
      - `Auctifera__Paid_Value__c` → calculated=**false**, label "Amount Received" ← spec target ✅

      **Auctifera__Resources__c**:
      - `Auctifera__Number_of_Parts__c` → calculated=**false**, label "Quantity" ← spec target ✅

      **Bonus finding**: Display/Storage Location tiene un patrón trap similar
      (`Auctifera__Hourly_Rate_After_Taxes__c` = formula/DEPRECATED, `_After_Taxes3__c` =
      storage) que el spec correctamente evita (apunta a `Hourly_Rate__c` y `Flat_Fee__c`
      bare, per playbook "base non-formula fields, not the After/Before Taxes/(DEPRECATED)
      twins"). El spec v3 evade este trap correctamente.

      **Regression proof**: si un futuro PR "simplifica" el spec removiendo los
      matchers `{anyOf}` y volviendo a bare API names, los 5 label-traps
      romperían silenciosamente:
      - Metadata replay intentaría setear `trackHistory=true` sobre `Paid_Amount__c`.
      - Salesforce ignora el update porque el field es formula (no admite tracking).
      - El run reportaría success (no error), pero el field bare quedaría untracked.
      - El customer no vería el field tracked en la UI, y QA no lo notaría hasta
        una auditoría manual.

      Este scenario documenta el trap para maintainers futuros y prueba que el
      matcher runtime IM-1069 es LA razón de ser del design v3.
    notes: |
      Los `(DEPRECATED)` labels son la señal explícita del Auctifera package que
      el field bare debe ser reemplazado. Cualquier field con "(DEPRECATED)" en
      su label es candidato a label-trap si otro field con label limpio existe.
    stepResults: []
    attachments:
      - name: label-trap-verification.md
        path: attachments/tr-119-tc-110/scenario-4/label-trap-verification.md
        mimeType: text/markdown

