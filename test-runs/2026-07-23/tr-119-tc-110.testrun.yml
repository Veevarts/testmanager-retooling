  buildVersion: 'IC config-plan case v2→v3 (feasibility auto→hybrid). 1 file: ic-8-05-history-tracking-rentals.json (+226/-35). Consumes IM-1069 runtime field-matcher. 5 objects × 8+9+11+6+8 = 42 fields all with {anyOf, label} matchers. 5 label-traps documented. 1 MANUAL step for 4 standard Name fields (Rental Event, Payment, Display/Location, Resource/Service — Rental Resource has no Name in playbook). Strategy: static spec + CSV playbook cross-check + sf sobject describe label-trap verification + API-driven IE run in illinois-trainings + Tooling API POST-verify with delta analysis.'
  notes: |
    - PR MERGED 2026-07-15 22:39Z por veevart_josed. Dev-verified en CamiloDevOrg
      + im696-tucson; QA agrega illinois-trainings como tercer org independiente
      (Auctifera Rentals confirmed installed via sf sobject describe).
    - Cognito session activa 60 min, user en group `admin`. Path A API-driven flow
      per `[[reference-migrationapp-ie-run-automation]]`.
    - Bastion NO requerido (no hay SQL Server side, solo Tooling API sobre SF).
    - CSV playbook cross-check aplica el nuevo reference
      `[[reference-implementation-cases-catalog]]` (mergeado a QAHub via PR #29):
      Order 8.05 en el CSV lista 42 fields non-Name distribuidos 8/9/11/6/8,
      matches spec byte-for-byte.

    ## Solution understood

    IC 8.05 v2 tenía:
    - 3 de los 5 objects (faltaban Display/Storage Location y Resource/Service).
    - Hardcoded field API names (no matchers).
    - Description dropped (asumido no-trackable).
    - Sin MANUAL step (feasibility auto — incorrecto porque Name fields no son
      trackable via metadata replay).

    PR #246 v3 corrige todo:
    - +2 objects (5 completos).
    - Todos los 42 fields con matcher `{anyOf:[apiName], label:"..."}` per IM-1069.
    - Description restaurado (rich-text textarea proved trackable via live read-back).
    - MANUAL step para 4 Names (Rental Event, Payment, Display/Location, Resource/Service).
    - feasibility flipped auto→hybrid.
    - Flag `exclusive` intencionalmente ausente → additive behavior (no borra
      tracking pre-existente en customer orgs, per playbook "verify the fields
      are tracked, if not select them").

    ## Inferred technical tests (mapped to ACs)

    | Test                                                              | ACs        | Executable here? | Verdict |
    |-------------------------------------------------------------------|------------|------------------|---------|
    | Static spec fidelity (JSON parse + 42 field count + matchers)     | AC1-AC4    | YES              | PASS    |
    | CSV playbook cross-check (Order 8.05 vs spec)                     | AC1, AC2   | YES              | PASS byte-for-byte |
    | sf sobject describe label-trap verification (5 traps)             | AC3        | YES              | PASS 5/5 |
    | PRE-baseline Tooling API (42 fields, illinois-trainings)          | AC6        | YES              | 41/42 tracked pre |
    | API-driven IE run + attest MANUAL                                 | AC1, AC2, AC5 | YES           | 6/6 done |
    | POST-verify Tooling API + delta analysis                          | AC2, AC6   | YES              | 42/42 (Pos_Purchase flipped) |
    | Rich-text Description trackable (implicit via post-verify)        | AC4        | YES              | Description tracked post |
    | Standard Name checkbox attestation (test-workspace pattern)       | AC5        | YES (attestation-only) | Handoff cerrado; UI real NO ejecutado |

    ## Objective fit

    - Ticket objective: consumir el matcher runtime IM-1069, cubrir los 5 objects,
      restaurar Description, agregar MANUAL para Names, deliver spec v3.
    - Delivered: spec v3 mergeado con 42 fields en 5 objects + matcher runtime +
      Description + MANUAL. Verified end-to-end en illinois-trainings.
    - Objective met? YES. Los 6 ACs cerrados con evidencia live independiente.

