description: |
  QA execution para IM-1074 (Historia, priority Medium, epic IM-735 Implementation
  Cases Automation). QA Sub-task: IM-1111. PR under test:
  Veevarts/MigrationAppBackend#246 (MERGED 2026-07-15, merge commit b703372).

  Método QA:
  1. Fetch spec JSON `ic-8-05-history-tracking-rentals.json` at merge-commit `b703372`
     via `gh api contents?ref=b703372`. NO clone (spec-only PR, no code to jest).
  2. Static structural checks: case v3, template v3, hybrid, defaultOrder 805, 6 steps
     (5 AUTOMATED T3 historyTracking + 1 MANUAL), 42 fields total across 5 sobjects,
     all fields use IM-1069 `{anyOf:[apiName], label}` matcher, `exclusive` flag ABSENT.
  3. CSV playbook alignment: field counts per object matchean el CSV Order 8.05
     byte-for-byte (8+9+11+6+8 = 42 non-Name fields; MANUAL cubre las 4 Name checkboxes
     restantes — Rental Resource sin Name correctamente).
  4. Label-trap live verification: `sf sobject describe --target-org illinois-trainings`
     confirma que los 5 label-traps (Paid_Amount, Subtotal, Tax_Amount, Amount Received,
     Quantity) resuelven al variant `_2/_3/_v` que es storage (calculated=false), NO al
     bare API name que es formula/DEPRECATED.
  5. PRE-baseline Tooling API: `SELECT IsFieldHistoryTracked FROM FieldDefinition`
     sobre 42 fields → 41/42 tracked (Pos_Purchase el único untracked).
  6. API-driven IE run (Path A per `[[reference-migrationapp-ie-run-automation]]`):
     POST /plan-runs, poll, attest MANUAL step 6 (attesting-without-executing per
     TR-115/116/117 pattern en test workspace).
  7. POST-verify Tooling API: 42/42 tracked. Delta observado = exactly 1 flip
     (Pos_Purchase false→true). Additive behavior verified — los 41 pre-tracked
     preservados sin regression.

  Evidencia clave:
  - Merge-commit `b703372` merged 2026-07-15 22:39Z por veevart_josed. 1 file touched:
    `ic-8-05-history-tracking-rentals.json` (+226/-35). NO `.spec.ts` (JSON-only).
  - CSV cross-check: playbook Order 8.05 lista 42 fields non-Name distribuidos
    exactamente igual que el spec (8/9/11/6/8), confirmando fidelity al playbook
    Auctifera SF.
  - Label-trap live proof (attachments/tr-119-tc-110/scenario-4/label-trap-verification.md):
    * `Auctifera__Paid_Amount__c` = calculated=true, label "Paid Amount (DEPRECATED)"
    * `Auctifera__Paid_Amount_2__c` = calculated=false, label "Paid Amount" ← spec target
    * `Auctifera__Subtotal_Amount__c` = calculated=true, label "(DEPRECATED) Subtotal Amount"
    * `Auctifera__Subtotal_Amount3__c` = calculated=false ← spec target
    * `Auctifera__Tax_Amount__c` = calculated=true, "(DEPRECATED)"
    * `Auctifera__Tax_Amount3__c` = calculated=false ← spec target
    * `Auctifera__Paid_Value__c` = calculated=false, label "Amount Received" ← spec target
    * `Auctifera__Number_of_Parts__c` = calculated=false, label "Quantity" ← spec target
    * Bonus: `Description__c` = calculated=false, textarea → trackable via metadata replay
  - Live API run `147f1231-3533-4bbd-ad8d-9e86467ebe20`:
    * POST /plan-runs → 202 PENDING (22:03:37Z)
    * poll: t=+8s step 1 done step 2 running; t=+28s all 5 auto done, step 6 blocked-human
    * POST /handoff con body {} → 202 (attesting-without-executing)
    * final: total=6 done=6 failed=0
  - Delta pre→post = 1 flip: `Rental_Payments.Pos_Purchase__c: false → true`
    Los 41 fields pre-tracked se preservaron sin cambio (additive behavior probado).

