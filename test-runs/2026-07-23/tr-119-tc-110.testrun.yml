    actual: |
      Step 6 (MANUAL) declara: "Tick the standard Name checkbox on the Rental
      Event, Rental Payment, Display/Storage Location and Resource/Service
      history-tracking screens — the metadata replay cannot set it."

      **Mecanismo del handoff cerrado via API**:
      - `POST /implementations/plan-runs/147f1231-.../steps/5946d1fb-.../36fe3575-.../handoff`
      - Body: `{}` (attesting-without-executing pattern)
      - Response: 202 PENDING
      - Después de 5s: step 6 state pasa a `done`, run state pasa a `completed`

      **Guardrail explícito (per TR-115/116/117 v2 pattern)**:
      El trabajo UI real NO se ejecutó en illinois-trainings — la Name checkbox
      del Rental Event / Rental Payment / Display/Storage Location / Resource/Service
      NO fue tickeada. Solo se cerró el step vía API para permitir que el run
      alcance COMPLETED (pattern estándar en test workspaces).

      **Esto ES el comportamiento esperado** en test workspaces:
      - El mecanismo del handoff API se prueba (POST /handoff funciona).
      - En customer orgs el mismo endpoint se llama después de que el IE haga
        el trabajo UI real (Setup > Object Manager > cada object > Set History
        Tracking > tick Name > Save).
      - QA valida que el mecanismo cierra correctamente; el trabajo UI real
        queda fuera del scope automatizable (playbook explícitamente lo declara
        como manual).

      El TC-110 scenario 3 marca esto `passed` en el sentido de mecanismo-cerrado,
      NO en el sentido de trabajo-UI-ejecutado.
    notes: |
      Pattern establecido en TR-115 (IM-1077), TR-116 (IM-1078), TR-117 v2 (IM-1079).
      Este es el 4º TR consecutivo que usa attesting-without-executing sobre step
      MANUAL en illinois-trainings — el pattern está firme.
