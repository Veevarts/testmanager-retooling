notes: |
  ## Solution understood

  TR-219 devolvio la historia porque no habia alerta (AC4) ni watchdog (AC5). Ahora el backend tiene un watchdog cada
  15 min que pasa a FAILED una corrida RUNNING sin actividad en 45 min (latido del ETL, cambio de estado o de un objeto),
  asienta sus objetos y publica una alerta a Slack por SNS y AWS Chatbot (solo produccion), con una alarma si la
  publicacion falla. El ETL manda un latido cada 5 min mientras avanza y deja de mandarlo si nada se mueve en 50 min.
  Ademas ("#190", "#417"): un objeto que falla ya no hunde la corrida, cada objeto informa sus ficheros al terminar, un
  objeto solo es descargable si todas sus partes salieron, y la corrida termina COMPLETED o FAILED con conteos.

  ## Inferred technical tests

  - Suites y specs nuevos en main y en los commits de TR-219, y 11 mutaciones: ejecutado.
  - Arnes con el adaptador real y RunHeartbeat contra HTTP local (reintentos, latido, estancamiento, seguridad): ejecutado.
  - Dev, escrituras autorizadas: corrida mixta con Contact Role y corrida buena desde la interfaz; 3 corridas sinteticas
    en RUNNING (una caducada y dos controles) para el watchdog real de dev. Ejecutado.
  - Produccion, solo lectura: corridas por estado, ticks del watchdog, tema SNS, Chatbot, alarma, metricas y simulador de
    IAM. Ejecutado.
  - No ejecutable por QA: provocar una corrida colgada en produccion para ver el mensaje real en Slack.

  ## Resultado

  15/15 PASS (AC4 con alcance): F1 y F2 de TR-219 corregidos. Observaciones no bloqueantes: nadie vigila al propio
  watchdog (fallo ~15 h en produccion sin aviso antes de "#422"), la alarma de publicacion usa el mismo tema, y la
  interfaz no muestra los conteos de una corrida FAILED. Detalle en attachments/tr-221-tc-191/hallazgos.txt.
