notes: |
  ## Solution understood

  TR-217 fallo por dos cosas. F1: el pool restauraba solo los pixeles de scroll; si las filas cambiaban de alto justo
  despues de volver (el enmascarado de QA, una fuente web o contenido tardio), el anclaje del navegador movia scrollTop y
  ese valor se guardaba, asi que la perdida se acumulaba. F2: Load more se deshabilitaba al cargar y desaparecia en la
  ultima pagina, el foco caia a body y Escape dejaba de cerrar el pool. "#222" recuerda tambien la primera fila en vista y
  su desplazamiento, la recoloca un frame despues de volver sin guardar los eventos de esa restauracion, deja Load more
  siempre habilitado (aria-busy y spinner) y, tras la ultima pagina, pasa el foco a la primera fila nueva si se perdio.

  ## Inferred technical tests

  - Specs del pool en main y en el padre d8a356c, suite completa y 7 mutaciones de "#222": ejecutado.
  - Dev, lectura: AC1 sin enmascarar y con reflujo tardio (12 vueltas, traza de eventos de scroll), pool de la cuenta,
    foco tras Load more a mitad y en la ultima pagina, un modal, flujo anidado, panel, reabrir. Ejecutado.
  - Dev, escrituras autorizadas: Decline desde el detalle (fila de arriba y del medio) y en tarjeta, con Undo. Ejecutado.
  - No re-ejecutado: Accept en tarjeta, en el panel y la carrera (escenarios 8, 11 y 14): necesitan Accept, no autorizado
    en esta repeticion, y "#222" no toca su codigo; quedan con el PASS de TR-217 y los specs.

  ## Resultado

  15/15 PASS: F1 y F2 de TR-217 corregidos. Correccion a TR-217: F1 dependia del reflujo que introducia el enmascarado de
  QA; con nombres reales no derivaba. Observaciones no bloqueantes: O1 accionar desde el detalle la fila de arriba con
  reflujo tardio sube la vista ~6,5 %; O2 una mutacion sobrevive a los specs. Detalle en
  attachments/tr-220-tc-190/hallazgos.txt.
