      | Métrica | PRE (base) | POST (PR) |
      | --- | --- | --- |
      | Grano de filas | 2.326 | **2.326** (sin cambio) |
      | · rama paid | 1.703 | 1.703 |
      | · rama write-off | 517 | 517 |
      | · rama unpaid | 106 | 106 |
      | `npe01__Scheduled_Date__c` NULL | 0 | 0 |
      | **`npe01__Payment_Date__c` NULL** | **106** | **0** |
