results:
  - scenarioIndex: 1
    scenarioTitle: 'IM-1148 AC1 — Every UNION ALL branch projects npe01__Scheduled_Date__c as a SQL date, so the mandatory field stops carrying a 0:00 time component'
    testCaseId: c11cd855-6fde-44b4-86bf-7d43c4d2b666
    testCaseKey: TC-139
    status: passed
    executedAt: "2026-08-03T13:48:00Z"
    actual: |
      Medido con `sys.dm_exec_describe_first_result_set`, que devuelve el tipo declarado de cada
      columna de salida SIN leer una sola fila. Fuente: perfil safesql `tucson` (Altru real).
      Salida 100% numérica agregada — cero filas de cliente en el artefacto.

      | Columna | PRE (base) | POST (PR) |
      | --- | --- | --- |
      | `npe01__Scheduled_Date__c` tipo `date` | 0 | **1** |
      | `npe01__Scheduled_Date__c` tipo `datetime` | **1** | 0 |
      | `npe01__Payment_Date__c` tipo `date` | 1 | 1 |
      | `npe01__Payment_Date__c` tipo `datetime` | 0 | 0 |
      | columnas de salida (control) | 18 | 18 |

      PRE reproduce el problema del ticket: Scheduled Date sale `datetime`, de donde viene el
      `0:00` que reportó el cliente. POST lo corrige a `date`.

      Payment Date es `date` en AMBOS lados, y eso es lo importante: confirma que el diagnóstico
      del PR es correcto. El síntoma apareció solo en Schedule Date porque `CALCULATEDDATE` ya era
      `date` y solo `INSTALLMENT.DATE` era `datetime`.

      Esta medición es INDEPENDIENTE de la del dev: él usó Long Island, QA usó Tucson. Misma
      conclusión desde otra fuente.

      Verificación estructural complementaria — las tres ramas casteadas:
      líneas 230, 264 y 301 de `opportunity_payments.sql`. Basta una sin castear para que la
      precedencia arrastre toda la columna de vuelta a `datetime`.

      No re-derivado: la afirmación del PR de que el cast es lossless (1.192/1.192 valores a
      medianoche en Long Island) requiere esa fuente, que no está disponible.
