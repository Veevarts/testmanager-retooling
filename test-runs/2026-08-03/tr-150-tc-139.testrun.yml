  - scenarioIndex: 2
    scenarioTitle: 'IM-1148 AC2 — npe01__Payment_Date__c is never blank: all three branches emit a date and the unpaid branch shares its source expression with the scheduled date'
    testCaseId: c11cd855-6fde-44b4-86bf-7d43c4d2b666
    testCaseKey: TC-139
    status: passed
    executedAt: "2026-08-03T13:52:00Z"
    actual: |
      Las tres ramas emiten fecha y ninguna proyecta un `NULL` pelado:

      | Rama | Expresión (rama del PR) | Antes (base `09b9adf`) |
      | --- | --- | --- |
      | paid | `COALESCE(pa.PaymentDate, CAST(pa.InstallmentDate AS DATE))` | `pa.PaymentDate` |
      | write-off | `COALESCE(wo.WriteOffDate, CAST(wo.InstallmentDate AS DATE))` | `wo.WriteOffDate` |
      | unpaid | `CAST(ins.InstallmentDate AS DATE)` | **`NULL`** ← la causa de los 102 blancos |

      Anti-deriva de la rama unpaid confirmada: las líneas 301 y 315 usan la MISMA expresión
      fuente (`ins.InstallmentDate`) para scheduled y payment date, así que no pueden divergir.
      El cuarto assert del PR lo lockea comparando el grupo capturado de ambos regex.

      El `COALESCE` del predicado de ventana (línea 346) queda como modo de falla, no como lógica
      viva: con el invariante de nunca-blanco ya nunca alcanza su segundo argumento. Correcto
      dejarlo — si una rama futura emitiera NULL, `NULL >= @filterDateFrom` sería UNKNOWN y la fila
      desaparecería en silencio de toda extracción con ventana. El invariante lo sostiene la suite,
      no el predicado.
    attachments:
      - name: payment-date-contract.txt
        path: attachments/tr-150-tc-139/scenario-2/payment-date-contract.txt
        mimeType: text/plain
    notes: "Objetivo cumplido a nivel de contrato. La cifra de 102→0 en Long Island es el escenario 4, bloqueado por acceso."

  - scenarioIndex: 3
    scenarioTitle: 'IM-1148 AC3 — The write-off branch keeps its own posting date: the fallback triggers on a missing date, never on npe01__Paid__c = 0'
    testCaseId: c11cd855-6fde-44b4-86bf-7d43c4d2b666
    testCaseKey: TC-139
    status: passed
    executedAt: "2026-08-03T13:55:00Z"
    actual: |
      Este es el riesgo más serio del cambio y se descartó **por construcción**, que es más fuerte
      que un muestreo.

      `COALESCE(wo.WriteOffDate, CAST(wo.InstallmentDate AS DATE))` devuelve su primer argumento
      no-nulo. Cuando `wo.WriteOffDate` tiene valor, el segundo operando nunca se evalúa como
      resultado. Es **estructuralmente imposible** que esta expresión sobrescriba una fecha de
      write-off presente. El disparador es, literalmente, `wo.WriteOffDate IS NULL` — no el flag.

      Si el fallback se hubiera anclado en `npe01__Paid__c = 0`, habría reescrito las 51 fechas
      genuinas de write-off de Long Island, que están 1–2 años después de la cuota que liquidan
      (programada `2009-09-04` → posteada `2011-07-05`).

      El cast va dentro del `COALESCE` y no afuera: `CALCULATEDDATE` es `date`, `InstallmentDate`
      es `datetime` y datetime gana precedencia, así que un cast externo habría promovido toda la
      expresión y reventaría con fechas anteriores a 1753.

      El assert que protege esto es revert-proof: falla contra la query pre-fix (escenario 5).

      **Y además quedó medido.** Reconciliación en `tucson`:

      | Métrica | PRE | POST |
      | --- | --- | --- |
      | write-off con payment ≠ scheduled | 517 | **517** (sin cambio) |
      | write-off con payment NULL | 0 | 0 |

      Las 517 filas de write-off conservan una fecha de pago distinta de su fecha programada,
      antes y después. Anclado en el flag, ese contador habría colapsado a 0. No se movió.
      Son 517 write-offs reales — 10× la muestra de 51 que nombra el ticket.

      El `0` en payment NULL confirma que el `COALESCE` de esta rama es tenant-safety y no una
      reparación: igual que Long Island, Tucson no tiene `CALCULATEDDATE` nulos.

      Sin re-derivar: la cifra de 51 es propia de Long Island y no hay perfil de esa cuenta.
    attachments:
      - name: write-off-preserved.txt
        path: attachments/tr-150-tc-139/scenario-3/write-off-preserved.txt
        mimeType: text/plain
      - name: comparison-matrix.txt
