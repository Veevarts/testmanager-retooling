  - scenarioIndex: 5
    scenarioTitle: 'IM-1148 AC5 — The regression suite pins the contract, the new assertions fail against the pre-fix query, and the deliberate Charge-side asymmetry survives'
    testCaseId: c11cd855-6fde-44b4-86bf-7d43c4d2b666
    testCaseKey: TC-139
    status: passed
    executedAt: "2026-08-03T14:02:00Z"
    actual: |
      **Suite `query-regression` sobre la rama del PR:** 40 suites, **386 passed**, 101 skipped.
      Coincide exactamente con la cifra del PR — re-derivada, no copiada.

      **Suite completa del repo:** 408 passed. Los 10 fallos son todos de docker
      (`donation-transaction-recurring.spec.ts`, que este PR no toca). **0 fallos atribuibles al PR.**
      `lint:check` limpio, `build` limpio — confirma lo que reporta el PR.

      **Revert-proof:** restaurando `opportunity_payments.sql` al commit base y dejando los tests
      de la rama, los **4 asserts nuevos FALLAN** y los 4 preexistentes siguen pasando
      (4 failed, 4 passed, 8 total). El contrato no es decorativo. SQL restaurado tras la prueba.

      **Asimetría del lado Charge intacta:** `charge/pledge_payments_unpaid_charges.sql:181` sigue
      emitiendo `NULL AS Auctifera__Tech_Payment_Date__c`, y el PR no toca ese archivo.
      `fund-assignment/fund_assignment_payments.sql` tampoco cambió: ya tenía el cast (por eso
      opportunity-payment era el outlier) y deliberadamente no aplica la regla de fallback.

      **HALLAZGO — el spec nuevo del PR nunca se ejecutó.**
      `pledge-unpaid-charge-query.integration.spec.ts` (nuevo, 101 líneas, 13 tests) está detrás de
      `RUN_DOCKER_SQL_QUERY_TESTS === '1'`. La corrida de 386 que el PR cita como validación no lo
      incluye: quedó entre los 101 skipped. Con la variable activada tampoco corre acá — falla en
      el arranque del contenedor, no en una aserción. Son 101 líneas de cobertura declarada sin
      evidencia de ejecución en ningún lado. No es defecto del cambio de SQL.

      **Precisión:** el PR dice "Three assertions in pledge-payment-query.spec.ts". Son cuatro.
