key: TR-150
title: "TR-150 · IM-1148 · TC-139 · Opportunity Payments date contract — 5/5 PASS · 0 defectos · tipo datetime→date y reconciliación medidos en fuente Altru real (tucson) independiente del dev · payment date NULL 106→0 · las 517 fechas de write-off intactas · revert-proof 4/4 · HALLAZGO: el spec nuevo de 101 líneas nunca se ejecutó, ni en el PR ni acá"

description: |
  Ejecución de TC-139 contra **MigrationToolETL [#162](https://github.com/Veevarts/MigrationToolETL/pull/162)**
  (`fix/opportunity-payment-dates-IM-1148` → `main`, **OPEN**, head `5bc198d`, base `09b9adf`).

  ## Veredicto

  **5/5 PASS · 0 defectos.** El arreglo hace lo que dice, y las dos afirmaciones centrales del
  ticket quedaron **medidas sobre datos reales**, no solo razonadas.

  No existe perfil safesql de Long Island, así que la reconciliación se corrió contra **tucson**
  —otra fuente Altru con las tres ramas pobladas— envolviendo la query real del PR en agregados.
  Eso verifica el comportamiento completo. Lo que sigue sin re-derivarse son las **cifras
  específicas** de Long Island (1.354 / 1.201 / 51 / 102), que solo su propia fuente puede dar.

  ## Lo más valioso de esta corrida

  **La reconciliación en tucson dio dos números que cierran el ticket:**

  | Métrica | PRE | POST |
  | --- | --- | --- |
  | `npe01__Payment_Date__c` NULL | **106** | **0** |
  | write-off con payment ≠ scheduled | **517** | **517** |

  El primero es la aserción que pide el ticket, y su desglose la explica: los 106 blancos son
  exactamente las 106 filas de la rama unpaid — ninguna de las ramas paid o write-off tenía el
  campo vacío. Reproduce en Tucson la misma estructura que el PR reporta para Long Island
  (102 blancos = 102 unpaid). El dato original nunca estuvo roto.

  El segundo es la prueba de no-regresión más importante del PR: si el fallback se hubiera
  anclado en `npe01__Paid__c = 0`, ese contador habría **colapsado a 0** al sobrescribir las 517
  fechas genuinas de write-off. No se movió ni una fila. El grano total también quedó estable en
  2.326 (1.703 + 517 + 106), confirmando que el cambio toca proyecciones y no el conjunto de filas.

  El escenario 1 midió el tipo declarado de las columnas con `sys.dm_exec_describe_first_result_set`
  contra una fuente Altru real (**tucson**), que es una fuente **distinta** a la que usó el dev
  (Long Island). Mismo resultado: `npe01__Scheduled_Date__c` pasa de `datetime` a `date`, y
  `npe01__Payment_Date__c` es `date` en ambos lados. Esa asimetría es la que prueba que el
  diagnóstico del PR es correcto —el `0:00` salía solo en Schedule Date porque solo
  `INSTALLMENT.DATE` era `datetime`— y ahora está confirmada de forma independiente.

  ## Dos hallazgos no bloqueantes

  1. **El spec nuevo del PR nunca se ejecutó.** `pledge-unpaid-charge-query.integration.spec.ts`
     son 101 líneas y 13 tests detrás de la guarda `RUN_DOCKER_SQL_QUERY_TESTS === '1'`. La
     corrida de 386 tests que el PR cita como validación **no lo incluye** — queda entre los 101
     skipped. Acá tampoco pudo correr: colima corta el log stream del contenedor antes de que
     SQL Server emita su banner (~90 s). Son 101 líneas de cobertura declarada sin una sola
     evidencia de ejecución, ni del dev ni de QA.
  2. **El PR dice "Three assertions"; son cuatro.** Subcuenta su propia cobertura. Imprecisión
     del texto, no defecto.

  ## Los 13 suites en rojo de docker NO son del PR

  Con `RUN_DOCKER_SQL_QUERY_TESTS=1` fallan 13 suites con `Log stream ended`. Diagnosticado
  antes de reportarlo: el contenedor no muere (exit 0, sin OOM), SQL Server tarda ~90 s en emitir
  su banner bajo colima y el stream se cierra a los ~6 s. La prueba decisiva es que
  `contact-roles-query.integration.spec.ts` —que este PR **no toca**— falla idéntico. Son los 13
  archivos `*.integration.spec.ts` del repo, tocados o no. Detalle en
  `attachments/tr-150-tc-139/scenario-5/docker-environment.txt`.

  ## Solution understood

  **Problema 1 no era de formato, era de precedencia de tipos.** `INSTALLMENT.DATE` está declarado
  `datetime` en Altru y `FINANCIALTRANSACTION.CALCULATEDDATE` ya es `date`. Al proyectar el primero
  sin cast dentro de un `UNION ALL`, SQL Server retipa **toda la columna de salida** a `datetime`.
  El fix agrega `CAST(... AS DATE)` en las tres ramas.

  **Problema 2: el dato original no estaba roto.** Los 102 blancos eran installments abiertos —
  Altru no guarda fecha de pago para una cuota sin cobrar. Producto decidió que el campo lleve la
  fecha programada. La regla queda uniforme: *fecha de settlement real, o fecha programada cuando
  no existe una real*.

  Tres decisiones que se verificaron una por una:

  - El disparador del fallback es **la ausencia de fecha**, no `npe01__Paid__c = 0`. Los write-offs
    llevan el flag en 0 pero tienen fecha real; anclarlo en el flag habría sobrescrito 51 fechas
    genuinas separadas 1–2 años de su cuota.
  - El cast va **dentro** del `COALESCE`. Un cast externo dejaría que `datetime` gane precedencia
    y reventaría con fechas anteriores a 1753.
  - La rama unpaid lee **la misma expresión** (`ins.InstallmentDate`) para sus dos columnas, así
    que no pueden divergir.

  ## Inferred technical tests

  | Test inferido | Qué prueba | Ejecutable acá | Resultado |
  | --- | --- | --- | --- |
  | Tipo declarado PRE/POST vía `describe_first_result_set` | AC1 — la causa raíz del `0:00` | SÍ (safesql tucson) | PASS |
  | Contrato de proyecciones del SQL | AC1 + AC2 | SÍ (estático) | PASS |
  | Revert-proof de los asserts nuevos | AC5 — que el contrato no sea decorativo | SÍ | PASS (4/4 caen) |
  | Suite `query-regression` + suite completa | AC5 — radio de impacto | SÍ | PASS (386 / 408) |
  | Contrato del lado Charge y de fund-assignment | AC5 — asimetría deliberada | SÍ (estático) | PASS |
  | Reconciliación agregada PRE/POST | AC4 — grano estable y blancos → 0 | SÍ (safesql tucson) | PASS |
  | Integration spec del lado Charge | cobertura nueva del PR | **NO** — colima corta el log stream | no ejecutado |

  ## Cambio de semántica que hay que comunicar

  Un `npe01__Payment_Date__c` poblado **ya no implica que el dinero se cobró**. `npe01__Paid__c` es
  el único marcador. El PR lo declara en la cabecera del SQL, en cada proyección y en
  `docs/altru-model-context.md`, y el lado Charge mantiene la convención opuesta a propósito.
  Vale confirmarlo con Implementations y con quien construya reportes financieros.

