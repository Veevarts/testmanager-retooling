- scenarioIndex: 1
  scenarioTitle: IM-1160 AC1 — sales_order_only_membership2.sql mints exactly one POS Purchase per orderless
    membership Opportunity, keyed membership-no-order-pos-<opportunity external id>, with a status that
    never contradicts the Opportunity
  testCaseId: 2c135887-4d8d-427a-93eb-27b014228993
  testCaseKey: TC-140
  status: passed
  executedAt: '2026-08-03T15:20:00Z'
  actual: 'Medido con safesql contra el perfil **tucson** (Altru real, solo lectura, salida agregada).
    La query nueva emite **79.327 filas / 79.327 llaves distintas / 79.327 con prefijo / 0 llaves nulas**:
    grano 1:1 exacto por Opportunity, sin duplicados y sin filas sin llave. La garantía viene de `WHERE
    om.PurchaseRank = 1` sobre un `ROW_NUMBER()` particionado por la MISMA expresión que emite la llave
    (`COALESCE(rgi.RecurringInstallmentID, mt.ID)`), así que llave y partición no pueden divergir. El
    prefijo está en el SQL ejecutable (verificado tras strip de comentarios `/* */` y `--`), no solo en
    la cabecera — se comprobó explícitamente porque el propio PR reporta que una versión previa de su
    test era vacua justo por eso. La colisión con un `SALESORDER.ID` real es estructuralmente imposible
    (uniqueidentifier vs string prefijado) y además medida: 0 de las 19.387 llaves de la query hermana
    llevan el prefijo.'
