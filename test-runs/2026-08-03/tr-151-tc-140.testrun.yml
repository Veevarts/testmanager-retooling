  actual: 'Mutation testing: se removió **cada uno de los cinco CAST, de a uno**, y se re-corrió el spec
    de contrato. Los cinco hacen fallar la suite → ninguno es decorativo:

    | Mutación | Resultado |

    |---|---|

    | 1/5 `CAST(so.ID)` | FALLA (1 test) |

    | 2/5 `CAST(revenue_so.ID)` | FALLA (1 test) |

    | 3/5 `CAST(payment_so.ID)` | FALLA (1 test) |

    | 4/5 `CAST` externo del `CONCAT` | FALLA (1 test) |

    | 5/5 `CAST(obm.SalesOrderID)` | **FALLA (2 tests)** |

    La 5/5 es la más importante: es la que un mantenedor futuro borraría por ''innecesaria'' (su rama
    nunca necesita fallback), y es justo la que rompe la OTRA rama, porque `UNION ALL` resuelve el tipo
    de la columna entre ambos arms y `uniqueidentifier` gana sobre `nvarchar`. Es la única mutación que
    rompe dos aserciones.'
