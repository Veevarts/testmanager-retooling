  scenarioTitle: 'IM-1160 AC5 — The NVARCHAR cast guard is load-bearing: every COALESCE branch and the
    order-backed UNION ALL branch stay cast, and removing any one of them reproduces the IM-770 type-precedence
    failure'
  testCaseId: 2c135887-4d8d-427a-93eb-27b014228993
