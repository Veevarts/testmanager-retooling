scopeFit: |
  Solucion entendida (PR 141):
  - Pre-fix: fund_assingments_donation_refunds.sql keyeaba vnfp__Opportunity__c en
    CREDITPAYMENT.REVENUEID, que en donaciones order-based apunta al Payment FT
    (transaccion separada), no a la Opportunity. Consecuencia: 100% de refunds
    mis-keyed, LookUp_ID_Legacy y vnfp__Opportunity_POS_Purchase__c quedaban null.
  - Post-fix: re-anchora tres linkages (vnfp__Opportunity__c, RecurringInstallments
    join, SALESORDER join) en source_dli.FINANCIALTRANSACTIONID (via SOURCELINEITEMID),
    mirroreando el patron de fund_assignment_donations.sql. Para donaciones
    payment-carried, source_dli.FT = payment => valor equivalente. Para order-based,
    source_dli.FT = Order => resuelve la Opportunity correcta.
  - Alcance colateral (declarado en el PR): tambien recupera LookUp_ID_Legacy y
    vnfp__Opportunity_POS_Purchase__c que estaban vacios en el 100% pre-fix. El
    ticket solo nombraba vnfp__Opportunity__c, pero el root cause es el mismo.

  Tests inferidos + estado de ejecucion:
  - AC 1 (canonical example es un payment): auto-executable via safesql.
    RESULT: PASS. La ID 5701BD79-05F3-4ED5-A1D1-B882AB44C299 resuelve a
    FT.TYPE='Payment', rev-10299682, 2021-02-13, $36.00.
  - AC 2 (scope-fit del PR): auto-executable via gh CLI + git diff. RESULT: PASS.
    Solo cambia el anchor (rli.OriginalPaymentTransactionId -> source_dli.FINANCIALTRANSACTIONID)
    y agrega SalesOrdersByPayment CTE. Sin colateral.
  - AC 3 (universo post-fix: TODOS mapean a Opportunity valida): auto-executable
    via safesql aggregate. RESULT: PASS. Sobre 5270 refund line items (universo
    amplio no-deduped), pre-fix 100% Payment / 0% Order; post-fix 77% Order (4065) +
    23% Payment (1205, single-payment donaciones). 100% resuelve SO post-fix vs 0% pre-fix.
  - AC 4 (no-regression): parcialmente cubierto. La suite de unit + integration specs
    del PR asserta el nuevo anchor. En illinois_2, 1205 rows conservan el pre-fix
    id (payment-carried) => por definicion no cambian su Opportunity resuelta.
    Los 4065 rows que cambian son exactamente los mis-keyed que debian cambiar.
  - Sandbox reconciliation: leave manual (schema requiere una donation Opportunity
    existente en el sandbox y confirmacion de 7-field write gate).
  - Functional UI post-load: leave manual (bloqueado por merge + re-migration IHM).

  Touch radius: 4 archivos (1 SQL + 1 unit spec + 1 integration spec + 1 fixture).
  Sin pipelines/entities/mappers/triggers. Sin cambios en fund_assignments_donations.sql
  ni fund_assignments_membership_refunds.sql.

