notes: |
  ## Solution understood

  IM-938 (IC 9) es delivery-to-Implementations del case `ic-9-household-names-people-batches`
  v3 (auto). El case fue upgraded de hybrid a fully automated en junio 2026 tras
  descubrir que las Veevart Settings "People" batches son `Auctifera.PeopleManagerBatch`
  (global Callable) — no `npo02.*` como asumía el probe original. La step 2 ahora
  enable `Auctifera__Schedule_People__c` + registra el driver cron; la step 3 enqueue
  las 6 People methods via el Callable path. BE PR #206 (squash commit `d5e2865c`)
  mergeado a main; MigrationApp-dev seeded; IM-735 attesta hybrid=verified on both orgs.

  ## Inferred technical tests

  | Test | What it proves | Executable here? | Result |
  |---|---|---|---|
  | SOQL npsp__Household_Naming_Settings__c on illinois-trainings | AC1 post-fix state observable | YES via `sf data query` | PASS (evidence in scenario-1) |
  | SOQL Auctifera__Batch_Settings__c.Auctifera__Schedule_People__c | AC2 post-fix state observable | YES via `sf data query` | INCONCLUSIVE — 0 rows (IC no ha corrido en illinois-trainings) |
  | SOQL CronTrigger 'Veevart - Automatic Batch Schedule' | AC2 driver cron observable | YES | NOT PRESENT en illinois-trainings |
  | SOQL AsyncApexJob PeopleManagerBatch por method | AC3 enqueue observable | YES | NOT PRESENT en illinois-trainings |
  | Anonymous Apex reproducción del case | End-to-end funcional | NO — el case corre desde MigrationApp UI (runbook wrapper), no directamente | manual — corre desde MigrationApp catalog |

  ## Baseline SOQL captured 2026-07-06 (evidence in scenario-1 / scenario-2)

  - `npsp__Household_Naming_Settings__c.npsp__Household_Name_Format__c` = `{!{!FirstName}} {!LastName} Household` ✅ AC1 met
  - `Auctifera__Batch_Settings__c` = 0 rows ❌ AC2 checkmark no set
  - `CronTrigger 'Veevart - Automatic Batch Schedule'` = NOT PRESENT ❌ AC2 daily cron no registered
  - `Veevart NFP - Automatic Batch Schedule` = WAITING (NFP variant; no relevante para TC-91 pero indica que otras 9.x sí corrieron)
  - `AsyncApexJob` PeopleManagerBatch = NONE

  ## Interpretación

  El IC 9 delivery no ha corrido contra illinois-trainings. AC1 pasa porque el NPSP
  Household Name Format fue seteado en algún momento (probablemente via NPSP standard
  setup o un run previo del case en otra org). Los AC2/AC3 requieren que un IE corra
  `ic-9-household-names-people-batches` desde el MigrationApp catalog contra illinois-trainings
  para observarse. Delivery/org-agnostic/idempotent se attestan via IM-735 + PR #206
  merged code review.

  ## Reference evidence

  - IM-735 (2026-06-12) — delivery report: `ic-9-household-names-people-batches` v3 hybrid, verified on both orgs
  - BE PR #206 `d5e2865c` — squash-merged to main, Callable path implementation
  - MigrationApp-dev — v3 seeded (per IM-735)
