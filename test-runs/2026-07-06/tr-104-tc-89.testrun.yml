    PASS con schema note. SOQL post-run confirma AC3: new record Auctifera__Resources__c Id=a2pWI00000272ojYAA, Name="Resource test", Number_of_Parts=1 (que es el field que semánticamente maps al "Quantity=1" del AC — ver observación schema abajo), GL_Code=RENTALS, Tax_GL_Code=RENTAL TAXES (matches Auctifera Accounting Resources GL/Tax GL). CreatedDate=2026-07-07T02:16:41Z. Case reportó Done en MigrationApp UI (plan run 6201ffc1 step 802 "Resources Setup" — sub-step "Upsert the Resource test Resource/Service" ✓ Done).

    SCHEMA OBSERVATION (no bloqueante — TC-89 wording issue, no case defect): El AC3 del TC-89 dice "su Quantity=1" pero el object Auctifera__Resources__c actual NO tiene un field llamado Quantity. El field que el case realmente escribe con valor 1 es Auctifera__Number_of_Parts__c. Comparación cross-org confirma que Number_of_Parts es el "quantity" semántico (Handheld Microphone 1=1, Banquet Chairs=200, etc.). Sugerencia: update TC-89 AC3 wording de "Quantity=1" a "Number_of_Parts=1" para claridad.
