scopeFit: |
  Solucion entendida (PR 142):
  - Pre-fix: ticket_item_program.sql calculaba RefundedQuantity = SUM(CAST(ISREFUNDED
    AS INT)). Un item se marcaba Refunded si RefundedQuantity == QUANTITY, i.e. si
    todos sus tickets tenian el flag ISREFUNDED en la source. En Altru, sin embargo,
    ese flag se pone incluso para "$0 refund transactions" (refund FT sin CREDITPAYMENT
    y sin movimiento monetario). El Order #12510469 tiene una unica $0 Refund FT que
    marca las 141 credit lines y sube el flag en cada ticket, aunque los tickets
    quedan activos y no se cancelaron.
  - Post-fix: dos reglas para Refunded:
    1. Todos los tickets flagged AND canceled (STATUS='Canceled'), o
    2. Todos los tickets flagged AND net paid > 0 AND refunded amount >= net paid
       (nueva CTE item_refund_summary sobre CREDITITEM_EXT filtered a FT.TYPE='Refund'
       para sumar CREDITITEM_EXT.SALESORDERITEMID). $0 orders y items 100%-descontados
       nunca califican.

  Tests inferidos + estado de ejecucion:
  - AC 1 (Order #12510469 caracterizacion source): auto-executable. RESULT: PASS.
    Order 8-12510469 Status=Complete, 5 SALESORDERITEMs con Total=$0.00,
    todos con FlaggedRefundedQuantity=Quantity, CanceledRefundedQuantity=0,
    RefundedAmount=$0. pre_fix_status=Refunded, post_fix_status=Other (5/5 flip).
  - AC 2 (scope-fit del PR): auto-executable via gh + diff. RESULT: PASS. Cambio
    quirurgico en ticket_item_program.sql (+SUM canceled column, +item_refund_summary
    CTE, +2da rama Refunded); 1 unit spec expandido; 1 doc agregado.
  - AC 3 (universo post-fix cumple objetivo): auto-executable via safesql agg.
    RESULT: PASS. total_items=343456, pre_fix_refunded=4436, post_fix_refunded=4252,
    kept=4252, flipped_off=184, new_refunded=0. Match EXACTO con el PR body
    (kept 4252 / flipped_off 184).
  - AC 4 (no-regression: tickets con refund real siguen Refunded): PASS. kept=4252
    exactamente los que el PR declara como refunds con dinero real devuelto.
    new_refunded=0 => el fix no introduce falsos positivos nuevos.
  - Sandbox reconciliation: leave manual (schema Ticket/Ticket Item requiere mock
    dataset complejo; PR body no incluye un mock que refleje el status transition en
    Salesforce, y el status esperado post-fix es Sold/Confirmed que se define en el
    pipeline mapper).
  - Functional UI post-load: leave manual (bloqueado por merge + re-migration IHM).

  Touch radius: 3 archivos (1 SQL + 1 unit spec + 1 doc). Sin pipelines/entities/
  mappers/triggers. Sin cambios en otros queries de tickets/refund.

touchRadius: |
  PR 142 (Veevarts/MigrationToolETL):
  - src/data-migration/infrastructure/destination/sql-server/queries/ticket-item/ticket_item_program.sql:
    ~30 lineas de diff neto. Cambios: (a) RefundedQuantity nueva formula (canceled-only);
    (b) FlaggedRefundedQuantity nueva columna (retiene formula pre-fix para el
    branch de money-check); (c) nueva CTE item_refund_summary sobre CREDITITEM_EXT;
    (d) segunda rama Refunded en el CASE del CASE; (e) nuevo LEFT JOIN item_refund_summary.
  - query-regression/ticket-item-program-query.spec.ts: +31 lineas. Nuevo describe
    'IM-981' con 5 tests: RefundedQuantity canceled-only, FlaggedRefundedQuantity
    separada, item_refund_summary CTE bien formada, orden del CASE (canceled >
    flagged+money), LEFT JOIN sin cambiar el grain.
  - docs/im-981-ticket-item-refund-validation.md: doc con la validacion del PR body.

  Touch radius CLEAN. refund.sql no se toca (PR body lo confirma). Sin colateral.

