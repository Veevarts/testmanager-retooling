      translations blast-radius 'preserve unrelated overrides' guard is the key one); the 5 lockstep (18, each asserts
      v2); full (1971/1972, 0 fail, 188 suites); tsc; eslint.
    - Independent spec-fidelity: parse the 5 v2 specs (steps + ops).
    - Manual-sweep soundness review of the 7 stay-manual cases (esp. 5.05 ground-truth).

