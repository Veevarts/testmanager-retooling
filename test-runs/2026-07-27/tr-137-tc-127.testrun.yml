description: |
  QA de IM-1086 (Historia, priority Medium/manual-confidence, epic IM-735 Implementation Cases
  Automation). QA Sub-task: IM-1132. PR bajo prueba: Veevarts/MigrationAppBackend#258 (CODE PR con
  2 ops T3 genuinely-new, 16 files +1369/-84, MERGED 2026-07-16, merge a2ee3cbf, base 5e6675e3 = IM-1085 #257).

  Metadata-gap spike sobre 12 ICs (tier manual-confidence). Resultado: 5 UPGRADED (auto/hybrid), 7 quedan
  manual con evidencia. #258 agrega 2 ops T3 reusables NUEVOS (adapter + domain model + lambda handler):
  customHelpMenuSection (upsert Help Menu section, idempotente por fullName, read-back) y translations
  (upsert custom-label overrides en_US, merge por name SET-ONLY, sin read-merge destructivo, read-back).

  5 UPGRADES (cada uno v2 lockstep): IC 1 (settings, auto) · IC 5.2 (workflowAlert + manual, hybrid) ·
  IC 3.29 (customHelpMenuSection NUEVO, auto) · IC 6.04 (translations NUEVO, auto) · IC 6.05 (translations
  NUEVO + manual, hybrid). settings/workflowAlert reused; customHelpMenuSection/translations genuinely-new.

  Método QA (reuso del clone; checkout a2ee3cbf; deps válidas):
  1. genuinely-new audit: git grep -c customHelpMenuSection 0→12(adapter)+4(model); translations 0→10+4 en
     base 5e6675e3 → merge a2ee3cbf. settings/workflowAlert pre-existen (reused). 16 files (6 op-code + 10 spec/test).
  2. Adapter code review a mano de los 2 handlers nuevos — upsert/create-vs-update, merge-no-read-merge (set-only),
     read-back verify, success=false no throw — no solo el lockstep ni el PR body.
  3. Independent spec-fidelity: parse de los 5 specs v2 (steps + ops).
  4. jest (op-code adapter+handler+model 310 + 5 lockstep 18 + full), tsc --noEmit, eslint touched.
     Conteo del dev (1970/188) reconciliado (1971 pass + 1 skip = 1972; 188 suites exacto; 0 fail).
  5. Review de soundness de los 7 stay-manual (esp. 5.05 ground-truth managed picklist RT-default silently dropped).

  Resultado: 7/7 PASS. 0 defectos. Live (5 upgrades + 7 refusals) dev-proven en CamiloDevOrg (data revertida);
  re-correr via la app bloqueado (v2 no seeded — seed PENDING-CREDS) → documentado, no PASS/FAIL prematuro.
  Deferred 5.04/6.01 = follow-ups correctos (requieren ops nuevos businessProcess/CustomObjectTranslation).
  Master-inclusion open question resuelta por IM-1090/#262 (predicate policy) — sin pin necesario.

