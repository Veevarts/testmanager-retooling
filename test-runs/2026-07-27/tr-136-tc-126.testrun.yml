  buildVersion: >-
    CODE PR spec-only (reused T3 `settings` op, NOT genuinely-new). 2 files (+158/-15): IC 3.25 spec v1->v2
    (feasibility manual->hybrid) + new lockstep test. Manual-sweep spike over 8 UI/cosmetic ICs: 1 upgrade
    (3.25), 7 stay manual. Tier manual-confidence.
  notes: |
    ## Solution understood
    IM-1087 is a probe-first manual sweep over 8 UI/cosmetic ICs, hunting for a partial-automation slice.
    Outcome: 1 UPGRADE (IC 3.25 Setup Profiles & Users, manual->hybrid) + 7 stay manual with live evidence.
    The 3.25 upgrade reuses the existing T3 `settings` op to automate two org preferences
    (UserManagementSettings.enableNewProfileUI=false; SecuritySettings.enableAdminLoginAsAnyUser=true), each
    with a read-back verify, and keeps user creation + the five Veevart permission-set assignments MANUAL
    (client data / specific users). Writability of the SecuritySettings toggle was proven live on CamiloDevOrg
    (deploy round-trips; the probe left the org at false — no security weakening).

    ## Inferred technical tests
    - op-reuse audit (git diff + git grep): #259 changed 2 files, NO adapter; T3 settings op + settings types
      pre-exist in base a2ee3cbf. NOT genuinely-new.
    - Independent spec-fidelity: parse the 4 steps + the 2 settings values.
    - jest as PRIMARY code evidence: the ic-3-25 lockstep (6, asserts v2 hybrid + 4 steps + both toggles); the
      seeds suite (dev 19/189 — reconciled on the seeds/ parent dir); full (1977/1978, 0 fail); tsc; eslint.
    - Manual-sweep soundness review: each of the 7 stay-manual cases names a concrete blocker (ContentAsset
      upload / managed wizard / namespace-variable field / unsupported or heavyweight tooling) — no org-agnostic
      automatable slice left on the table.

    ## Objective fit
    The one upgrade is correct and the 7 manual-stay decisions are sound. On current main the 3.25 hybrid IS in
    the master (via the IM-1090 predicate-based selection). No live IE run (v2 not seeded — seed PENDING-CREDS);
    live documented dev-proven/PENDING-CREDS. 5/5 PASS, 0 defects.

    ## Observation (surfaced to dev/PM, NOT an AC failure)
    The PR body claims "pin ic-3-25 into WORKING_CASE_IDS (matches 4.05/8.02 precedent)". That pin is NOT in
    #259's diff (it never touches seed-master-template.ts; WORKING_CASE_IDS @ 5f1fdd1d has 4.05 + 8.02 but NOT
    3.25). At #259 in isolation the freshly-hybrid 3.25 would be silently dropped from the master. IM-1090/#262
    (master-template policy -> predicate-based, QA'd in TR-130) later admits every auto/hybrid case automatically,
    so current main is correct. The 3.25 ACs are unaffected; the finding is a PR-body inaccuracy + a cross-PR
    dependency (actual master inclusion owed to IM-1090, not #259). Version chain: #270 (IM-1087a) = 3.25 v3.

