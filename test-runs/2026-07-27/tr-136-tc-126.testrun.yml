description: |
  QA de IM-1087 (Historia, priority Medium/manual-confidence, epic IM-735 Implementation Cases
  Automation). QA Sub-task: IM-1131. PR bajo prueba: Veevarts/MigrationAppBackend#259 (CODE PR
  spec-only, 2 files +158/-15, MERGED 2026-07-16, merge 5f1fdd1d, base a2ee3cbf).

  Spike probe-first sobre 8 ICs UI/cosmetic (tier manual-confidence). Resultado: 1 UPGRADE
  (IC 3.25 → hybrid), 7 quedan manual con evidencia. NO hay op nuevo — el upgrade reutiliza el
  op T3 `settings` existente.

  IC 3.25 v2 (feasibility hybrid, 4 steps): step1 T3 settings UserManagementSettings.enableNewProfileUI=false;
  step2 T3 settings SecuritySettings.enableAdminLoginAsAnyUser=true; step3 MANUAL crear users; step4 MANUAL
  asignar 5 permission sets. Mapea exacto a las 3 ACs (AC1=step1, AC2=step2, AC3=steps3+4).

  Método QA (reuso del clone; checkout 5f1fdd1d; deps válidas):
  1. Independent spec-fidelity: parse de los 4 steps + values de los 2 T3 settings — no solo el lockstep.
  2. op-reuse audit: git diff base..merge = 0 adapter/op (2 files); T3 settings op + settings types
     preexisten en base a2ee3cbf → NO genuinely-new.
  3. Review de soundness de los 7 stay-manual contra el catálogo (cada uno nombra un blocker concreto).
  4. jest (seeds suite + 3.25 lockstep + full), tsc --noEmit, eslint touched. Conteo del dev (19/189)
     reconciliado EXACTO (dir seeds/ padre: 18 specs + 1 CLI spec = 19 suites / 189 tests).

  Resultado: 5/5 PASS. 0 defectos. 1 OBSERVACIÓN documentada (master-inclusion): el PR body afirma pinear
  ic-3-25 en WORKING_CASE_IDS, pero ese pin NO está en el diff de #259; a #259 el 3.25 hybrid quedaría
  silently-dropped del master. IM-1090/#262 (predicate policy, TR-130) lo arregló → en main actual el 3.25
  SÍ entra por el predicado. ACs de 3.25 no afectadas. Live (2 toggles + writability) dev-proven en
  CamiloDevOrg; re-correr via la app bloqueado (v2 no seeded — seed PENDING-CREDS) → documentado, no PASS/FAIL prematuro.

