  - scenarioIndex: 2
    scenarioTitle: "AC4 · SOQL LIKE metacharacters in the pattern match LITERALLY (underscore is not a single-char wildcard)"
    testCaseId: 5fc66202-a0dc-4b34-b5b4-d2067ec4fa63
    testCaseKey: TC-125
    status: passed
    executedAt: "2026-07-27T18:30:00Z"
    duration: 9
    actual: |
      queryCmdtRecord builds the LIKE literal as escapeSoqlLiteral(namePattern).replace(/%/g,'\%').replace(/_/g,'\_')
      — the %/_ escaping runs AFTER escapeSoqlLiteral so the added backslash is not itself re-doubled; the final clause is
      `WHERE DeveloperName LIKE '%<escaped>%'` where only the two op-supplied wrapper % stay wild. So a pattern 'Foo_Bar'
      matches the literal underscore in 'NPSP_Foo_Bar' and never 'NPSP_FooXBar'. The pattern is a value (LIKE literal), not
      an identifier; field/object names are separately validated as bare SF identifiers before the SELECT/FROM -> no SOQL
      injection surface. This was the reviewer-found LOW, fixed in the same PR (2nd commit). Unit test 'recordPattern: SOQL
      LIKE metacharacters match LITERALLY — an underscore in the pattern is not a single-char wildcard' green (data 'Foo_Bar').
    notes: "AC4. Adapter read + dedicated adapter unit test with a faithful LIKE evaluator."
    stepResults: []
    attachments:
