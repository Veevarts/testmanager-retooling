  IC 3.33 (tier Low). Rehace un v1 con verify VACUO (org de cero rollups → no-op trivial) en un v2
  HYBRID (2 auto + 1 manual) cuyo mutation es automatizado y cuyo verify es significativo. A diferencia
  de los otros hijos de IM-735 de esta tanda (spec-only, reused ops), este PR TOCA código de op: agrega
  el modo `recordPattern` al op T3 customMetadata (adapter + domain model). Es el ORIGEN del capability.

  Capability nuevo (recordPattern): aplica values al subset cuyo DeveloperName CONTIENE el pattern
  (SOQL LIKE), update-only, per-record read-back verify, TOLERATE-ABSENT (cero matches = skipped success,
  no failure — diverge de allRecords). Precedencia allRecords > recordPattern > record. Wildcards %/_ del
  LIKE escapados a literales (fix del reviewer LOW, mismo PR). Writability finding: npsp__Rollup__mdt.
  npsp__Active__c es subscriber-writable pese a DeveloperControlled (subscriber-owned, NamespacePrefix null).

