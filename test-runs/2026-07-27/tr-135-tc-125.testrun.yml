  1. genuinely-new audit: git grep -c recordPattern = 0 en base 2271ff0f → 10 (adapter) + 8 (domain model)
     en merge c671b71f; git diff = 5 files (2 op + 1 spec.json + 2 test). ORIGEN, no reused.
  2. Adapter code review a mano (t3-metadata.adapter.ts + metadata-mutation-spec.ts): subset, tolerate-absent,
     wildcard escaping, per-record read-back, exclusión mutua — no solo el lockstep ni el PR body.
  3. Independent spec-fidelity de los 3 steps + lectura del apex del step 2 (upsert org-default + verify/throw).
  4. jest (adapter 214 incl. 3 tests recordPattern + lockstep 3.33 6 + full), tsc --noEmit, eslint touched.
     Conteo del dev (1926) reconciliado exacto.

  Resultado: 7/7 PASS. 0 defectos. Live (steps 1/2 + writability) dev-proven en CamiloDevOrg (8 rollups
  activos → 8 inactivos, cada uno verificado); re-correr via la app bloqueado (v2 no seeded — seed
  PENDING-CREDS) → documentado, no PASS/FAIL prematuro. AC7 = MANUAL handoff (visibilidad managed Schedulable).

