  notes: |
    - CODE PR spec-only → evidencia primaria por código; NO hay IE run (live CamiloDevOrg-only
      dev-proven; los v2 NO están seeded a MigrationApp-dev, seed PENDING-CREDS con AWS SSO ExpiredToken).
    - Independent verification: los 7 contratos de spec se re-parsearon por cuenta propia (own JSON read),
      NO se confió en los .spec.ts lockstep del dev ni en el PR body. Coinciden exacto con la forma declarada.
    - op-reuse: git diff f1703651..1314806f = 14 files, TODOS bajo seeds/specs (7 .json + 7 .spec.ts). NINGÚN
      adapter/op tocado. 4.07/4.06 REUSAN los ops T3 customMetadata + T6 verify preexistentes → NO genuinely-new.
    - Reconciliación del claim del dev "jest 102/102": en el HEAD merged los 7 lockstep = 23 tests; seeds/specs
      = 206; full = 2016/2017 (1 skipped) — todo verde. 102 es un número de scope/momento del PR (el catálogo
      creció después de cortar la branch). Reporto lo obtenido, no el número del dev.
    - eslint sobre los 7 .spec.ts tocados = 0 problemas (exit 0). tsc --noEmit clean. seed-master-template.ts
      intacto (IM-1090 owns la flip policy).

    ## Solution understood

    IM-1089 (Phase 3 probe-first manual sweep) es un SPIKE sobre 7 casos §11 vendor/third-party. Probó
    solo pre/post steps automatizables (remote-site, CMDT flags, verification reads) para convertir
    manual→hybrid/auto donde valiera. Resultado: 1 UPGRADE real (4.07: el caso entero = flip de un flag
    managed CMDT SubscriberControlled vía el op T3 customMetadata reutilizado, read-back-verified,
    idempotente), 1 HYBRID-WITH-VERIFY (4.06: portal/OAuth quedan manual, se agrega un T6 read-only verify
    que hace fallar el caso si el toggle de journal integration local no está on), y 5 STAY-MANUAL con
    evidencia de rechazo de API documentada (sin sObject/Tooling/Metadata surface, portales externos,
    OAuth per-tenant/per-user, o acceptance-test live prohibido en spike). Sin op nuevo; sin tocar el master.

    ## Inferred technical tests (mapped to scenarios)

    | Test                                                             | Scenario | Executable?      | Verdict |
    |------------------------------------------------------------------|----------|------------------|---------|
    | 4.07 spec fidelity (v2/auto, T3 customMetadata payload)          | S1       | YES (parse)      | PASS    |
    | 4.06 verify apex (asserts + throws + read-only + remediation)    | S2       | YES (parse)      | PASS    |
    | 5 manual (v2/manual, single MANUAL + refusal evidence)           | S3       | YES (parse)      | PASS    |
    | Gates: 7 lockstep + full jest + tsc + eslint + lockstep versions | S4       | YES (clone)      | PASS    |
    | op-reuse audit + master untouched + open items                   | S5       | YES (git+grep)   | PASS    |
    | 4.07 flip / 4.06 read LIVE                                        | S1/S2    | NO (creds-gated) | dev-proven / PENDING-CREDS |

    ## Objective fit

    - Objetivo: probar automatizables pre/post en los 7 vendor cases; convertir manual→hybrid/auto donde
      se pueda con evidencia; documentar refusals; gates verdes + versiones lockstep; sin op nuevo.
    - Delivered: 4.07 auto (T3 customMetadata) + 4.06 hybrid-verify (T6 fail-loudly) + 5 stay-manual con
      refusal evidence; 7 specs v1→v2 lockstep + 7 lockstep tests verdes; tsc/eslint limpios; ops reutilizados.
    - Objective met? YES. 0 defectos. Live dev-proven; re-run diferido honestamente (PENDING-CREDS).

