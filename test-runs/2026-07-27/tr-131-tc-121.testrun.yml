title: "IM-1089 · TC-121 · Vendor §11 manual-sweep spike (7 cases) — 5/5 PASS · 0 defectos (CODE PR #261 spec-only: 4.07 UPGRADE auto T3 customMetadata + 4.06 HYBRID T6 verify fails-loudly + 5 stay-manual con refusal evidence; jest 7 lockstep 23/23 + full 2016/2017, tsc clean, eslint touched clean, op-reuse audit; live dev-proven/PENDING-CREDS)"

description: |
  QA de IM-1089 (Historia, priority Medium, epic IM-735 Implementation Cases Automation).
  QA Sub-task: IM-1126. PR bajo prueba: Veevarts/MigrationAppBackend#261 (CODE PR spec-only,
  14 files +430/-83, MERGED 2026-07-16, merge 1314806f, base f1703651). Nota: 1314806f es
  exactamente la BASE de IM-1090/#262 (#261 mergeó primero).

  Spike sobre 7 casos §11 (vendor/third-party) para convertir manual→hybrid/auto donde se pueda.
  NO toca adapters/ops: reutiliza el op T3 customMetadata (4.07) y el op T6 verify (4.06). Los 7
  specs bumpean case+template v1→v2 + suman un .spec.ts lockstep por caso. seed-master-template.ts
  intacto (IM-1090 owns la flip policy). Evidencia primaria = CÓDIGO.

  Método QA (reuso del clone @ 82c35b14, checkout 1314806f; deps válidas — package.json sin cambios):
  1. Independent spec-fidelity parse de los 7 specs (own JSON read, no solo el lockstep del dev).
  2. op-reuse audit: git diff base..merge = 0 adapter/op files → NO genuinely-new op; ops preexisten.
  3. Gates: jest (7 lockstep + full), tsc --noEmit, eslint sobre los 7 .spec.ts tocados. Conteo del
     dev (102/102) reconciliado.
  4. Open items documentados (seed PENDING-CREDS, 4.07 PM-confirm).

  Resultado: 5/5 PASS. 0 defectos. Live (4.07 flip / 4.06 read) dev-proven en CamiloDevOrg; re-correr
  via la app bloqueado (v2 no seeded — seed PENDING-CREDS, AWS SSO ExpiredToken) → documentado, no
  PASS/FAIL prematuro. Sin verificación metadata-lens live (targets managed Auctifera; org fuera de alcance).

