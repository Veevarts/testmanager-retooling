     (no throw), anyOf/tolerate-absent, add-recipient idempotente sin remover — no solo el lockstep ni el PR body.
  3. Independent spec-fidelity: parse del spec v4 (4 steps + ensure de 21 alerts).
  4. jest (op-code adapter+2 handlers+model+templating 383 incl. workflowAlert + lockstep 3.16 9 + full), tsc, eslint.
     AC7 (jest full + tsc + eslint + v4 lockstep) reconciliado.

  Resultado: 7/7 PASS. 0 defectos. Live (partes automatizables de los 4 steps) dev-proven en CamiloDevOrg;
