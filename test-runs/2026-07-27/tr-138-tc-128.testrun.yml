  1. genuinely-new audit: git grep -c workflowAlert 0 en base adcef7d2 -> 19(adapter)+5(model) en merge.
     customMetadata allRecords (11 base) + T6 pre-existen (reused). 13 files (op-code + infra + spec/test).
