    CODE PR with a GENUINELY-NEW T3 op (workflowAlert) + reused customMetadata allRecords/T6 + supporting infra
    (operator-input-templating, resolve-ready-steps sequential ordering, metadata-mutation-result). 13 files
    (+1706/-27). IC 3.16 v3->v4 (1 MANUAL + 3 AUTOMATED). Tier medium-confidence.
  notes: |
    ## Solution understood
    IM-1081 reworks IC 3.16 from 1 automated step + handoffs into 1 MANUAL handoff + 3 AUTOMATED steps, and adds the
    reusable T3 workflowAlert op. workflowAlert configures Email Alerts (WorkflowAlert) via the sync CRUD Metadata API:
    read → set the OWEA From sender (senderType='OrgWideEmailAddress' + senderAddress) and/or append recipients → write →
    re-read + assert. The OWEA is resolved dynamically from the OrgWideEmailAddress sObject by address/displayName (never
    hardcoded); requireVerified (default true) reports an unverified/missing address as applied=false with a "finish
    verification first" message (never a throw). ensure[] supports anyOf drift-tolerance (first existing wins) + tolerate-
    absent; recipient add is idempotent and never removes existing recipients. The Fundraising Settings sender flips
    MANUAL->AUTOMATED using the pre-existing customMetadata allRecords op (v3's no-op was the async Apex path, not sync CRUD).
    POS stays T6. Step 1 (OWEA create+verify) stays MANUAL, gating the automated steps via resolve-ready-steps.

    ## Inferred technical tests
    - genuinely-new op audit (git grep + git diff): workflowAlert 0->19(adapter)+5(model). customMetadata allRecords (11)
      + T6 pre-exist. 13 files.
    - Adapter code review by hand of the workflowAlert handler + domain model.
    - jest as PRIMARY code evidence: op-code specs (adapter+2 handlers+model+templating, 383, incl. 14 workflowAlert unit
      tests); the 3.16 lockstep (9, asserts v4); full (1907/1908, 0 fail); tsc; eslint.
    - Independent spec-fidelity: parse the 4 v4 steps (+ the ensure of 21 alerts).

    ## Objective fit
    The upgrade is correct: the new workflowAlert op automates the ~21 Email Alert senders + the Error Log recipient with
    dynamic OWEA resolution and a clean unverified-OWEA refusal; the Fundraising CMDT sender is now automated (v3 correction);
    POS stays automated; OWEA create+verify stays MANUAL. No live IE run (v4 not seeded; a full-green sender commit needs a
    verified OWEA = external mailbox click); live documented dev-proven/PENDING-CREDS. Tucson NORESULT out-of-scope. 7/7 PASS.

