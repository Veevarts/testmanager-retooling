    ## Solution understood

    IM-1069 arregla de raíz (en el op T3 historyTracking) el hardcode de API names de fields managed que varían por
    versión de package Auctifera/NPSP — el bug cross-version del tier Medium. En vez de nombres literales en el spec,
    los fields se declaran como matchers {anyOf, label, pattern, optional} resueltos contra el describe del org live.
    Agrega exclusive:true (destrackea todo lo default, inherentemente org-specific), hace del read-back verify el
    veredicto (el whole-object replay reporta failure por Account.Tier de Data.com mientras el tracking commitea), y
    agrega un op NUEVO recordTypePicklistDefaults que automatiza la Part B (Charge sole-RT + clear picklist defaults),
    antes MANUAL — dejando IC 3.08 fully automated. El cambio es catalog-declarative (zero per-IC code); los hermanos
    de la familia lo consumen solo por spec.

