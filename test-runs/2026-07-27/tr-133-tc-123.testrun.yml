description: |
  QA de IM-1069 (Historia, priority Medium/medium-confidence, epic IM-735 Implementation Cases
  Automation). QA Sub-task: IM-1128. PR bajo prueba: Veevarts/MigrationAppBackend#241 (CODE PR,
  7 files +1950/-89, MERGED 2026-07-15, merge 9cb4cf51, base 08cde759).

  Caso FUNDACIONAL de la familia history-tracking (3.08) — CARGA el cambio del op; los hermanos
  (3.09, 5.06, 6.03, 7.02, 8.05) son consumidores spec-only (ya QA'ados: 3.09 TR-126, 5.06 TR-129,
  6.03 TR-127). Arregla de raíz el hardcode cross-version que rompió el run v1.

  Dos ops genuinely-new (catalog-declarative, zero per-IC code):
  1. historyTracking run-time matchers (MetadataFieldRef: anyOf/label/pattern/optional).
  2. historyTracking exclusive:true (untrack all defaults, org-specific).
  3. historyTracking read-back-verify-as-verdict (el write-error de Account.Tier no corta).
  4. NEW op recordTypePicklistDefaults (Charge sole-RT + clear picklist defaults; Part B, antes MANUAL).
  IC 3.08 pasa hybrid→auto (fully automated).

  Método QA (reuso del clone; checkout 9cb4cf51; deps válidas):
  1. Independent spec-fidelity parse de ic-3-08 v2 (own JSON read).
  2. genuinely-new: git grep base(08cde759) vs merge(9cb4cf51) de los markers de los dos ops.
  3. jest (PRIMARIO): 3 suites tocadas del T3 (adapter/handler/schema) + full.
  4. tsc --noEmit + eslint touched.
  5. Corroboración live vía consumidores ya QA'ados (TR-127/TR-129 en illinois-trainings).

  Resultado: 7/7 PASS. 0 defectos. Live: option de correr IC 3.08 fresco en illinois se ofreció en el
  gate; el usuario aprobó code-only. El op es dev-proven two-org (CamiloDevOrg + Tucson) y
  live-corroborated vía consumidores → code + corroboración es suficiente para un op-introduction PR.

