    | AC5 tolerate optional absent (vnfp)                              | S4       | YES (spec+jest)  | PASS    |
    | AC6/AC7 NEW recordTypePicklistDefaults (expectSole + clear)      | S5       | YES (spec+jest+grep)| PASS |
    | AC8/AC9 read-back-verdict + idempotent + fully-auto              | S6       | YES (spec+jest)  | PASS    |
    | Gates + genuinely-new + scope + live-corroboration               | S7       | YES (clone)      | PASS    |
    | Fresh IC 3.08 live IE run on illinois (third-org)                | S1-S6    | NOT taken (code-only approved) | corroborated via consumers |

    ## Objective fit

    - Objetivo: arreglar el op para que funcione org-agnostic (sin hardcode), trackear exactamente los 7/8 fields del
      playbook, destrackear defaults, tolerar fields ausentes, verificar Charge RT/picklists, idempotente, fully-auto.
    - Delivered: matchers dinámicos + exclusive + read-back-verdict + op nuevo recordTypePicklistDefaults; spec v2 auto
