  url: "https://github.com/Veevarts/MigrationAppBackend/pull/252"
  buildVersion: >-
    CODE PR spec-only (reused T6 anon apex, NOT genuinely-new). 2 files (+165/-10): IC 3.28 spec v1->v2 + lockstep/
    no-throw regression test. HYBRID: 1 MANUAL Setup handoff + 1 AUTOMATED informational read-back that never
    false-fails. Tier medium-confidence.
  notes: |
    ## Solution understood
    IC 3.28 Fiscal Year Set Up is a guided HYBRID. Organization.FiscalYearStartMonth is Setup-UI-only (read-only via
    the API: describe updateable=false/createable=false, no Metadata type), so it cannot be written programmatically.
    The case therefore keeps step 1 MANUAL (the IE sets the fiscal year in Setup > Company Information > Fiscal Year,
    parking two required select inputs — start month + Standard/Custom type) and makes step 2 an AUTOMATED T6 anon-apex
    read-back that is purely INFORMATIONAL: it reads the org's actual FiscalYearStartMonth + UsesStartDateAsFiscalYearName,
    compares against the operator-intended start month, and reports ATTEST OK (match) or ATTEST NEEDED (mismatch/not-
    configured, explicitly "NOT a failure"). The apex contains NO throw and NO DML anywhere, so the step ALWAYS completes
    and can never false-fail on an org whose FY was not yet set or was set differently; a blank/unparseable intended month
    is reported as "(not provided / unparseable)" without raising.

    ## Inferred technical tests
    - Independent spec-fidelity: parse the 2 v2 steps + the 2 required select inputs.
    - Adapter/apex code review by hand of the step-2 read-back (parse branches, match/mismatch/blank, no throw, no DML).
    - no-write + no-throw proof: grep the apex for DML/throw — only a SELECT + System.debug; "throw" only in comments.
    - op-reuse audit: #252 = 2 files, no adapter -> T6 reused, NOT genuinely-new.
    - jest as PRIMARY code evidence: the 3.28 lockstep + no-throw regression (5, asserts v2 + never-throws); the ic-seeds
      validity CLI (22); seeds/ dir (132); full (1878/1879, 0 fail); tsc; eslint.

    ## Objective fit
    The upgrade is correct: the manual dependency is respected (FY is Setup-UI-only), the read-back is informational and
    never false-fails on a mismatched/not-configured org, and there is no write path. No live IE run (v2 not seeded);
    live documented dev-proven/PENDING-CREDS. 5/5 PASS, 0 defects. Dev's "84" not reproducible at this ref — reported obtained.

