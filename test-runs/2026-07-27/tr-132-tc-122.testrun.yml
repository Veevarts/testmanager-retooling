description: |
  QA de IM-1088 (Historia, priority Medium, epic IM-735 Implementation Cases Automation).
  QA Sub-task: IM-1127. PR bajo prueba: Veevarts/MigrationAppBackend#260 (CODE PR spec-only,
  6 files +288/-34, MERGED 2026-07-16, merge f1703651, base 5f1fdd1d). Chain: #260 merge f1703651 =
  BASE de IM-1089/#261 (#260→#261→#262).

  Spike sobre 3 casos managed-protected (3.1 Connected Apps security, 3.13 Create Online Apps,
  veevart-auth). Confirma que la protección managed es REAL en el write side (ninguna Metadata/
  Tooling/Data API configura), pero cada caso produce estado legible por API → cada uno flippea
  manual→hybrid agregando un step T6 read-back verify (handoff ciego → verificado). Reutiliza el op
  T6 (anon Apex catalog-declarative). seed-master-template.ts intacto (IM-1090 owns). Evidencia
  primaria = CÓDIGO.

  Método QA (reuso del clone @ 82c35b14, checkout f1703651; deps válidas):
  1. Independent spec-fidelity parse de los 3 specs + LECTURA del apex de cada T6 verify (objetos
     leídos, asserts, throw, read-only) — no solo el lockstep del dev.
  2. op-reuse audit: git diff base..merge = 0 adapter/op files → T6 reutilizado, NO genuinely-new.
  3. Gates: jest (3 lockstep + full + seeds scope), tsc --noEmit, eslint touched. Conteo del dev
     (204 seed tests) reconciliado.
  4. Open items documentados (seed PENDING-CREDS, 3.1 pass-path no showable, veevart-auth anchor).

  Resultado: 5/5 PASS. 0 defectos. Live (detección/pass de los 3 verifies) dev-proven en CamiloDevOrg;
  re-correr via la app bloqueado (v2 no seeded — seed PENDING-CREDS) → documentado, no PASS/FAIL prematuro.

