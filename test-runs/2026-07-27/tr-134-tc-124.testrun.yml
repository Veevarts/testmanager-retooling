    - AC3 override: el input errorNotificationRecipient está declarado en steps[1].operatorInputs[0].name (bien wired).
    - Version-chain: este es IC 5.07 origin v2; a v2 el apex del step 5 tiene Is_Deleted en 5 queries (rollup/rule);
      IM-1090/#262 luego lo agregó a los 2 group-lookups (5->7 = v3, ya QA'd en TR-130). Evaluado en el ref correcto de #257.

    ## Solution understood

    IC 5.07 (tier Low) automatiza lo verificable de la config NPSP Customizable Rollups y mantiene la construcción
    CRLP (filter-groups + rollups) como guided handoff MANUAL con read-back SOQL. Un probe confirmó que los CRLP CMDT
    records se CREAN por Metadata API pero el SOQL read-back devuelve referencias como Ids/DurableIds, no los strings
    escritos — así que un op declarativo no puede self-verify la construcción; se automatiza todo lo demás (Member
    OppContactRole via standardValueSet, enable CRLP + error-recipient dinámico via T6, deactivate 2 End Date rollups
    via customMetadata recordPattern) y el step 5 T6 verifica el end-state del handoff manual. Reutiliza ops existentes.

