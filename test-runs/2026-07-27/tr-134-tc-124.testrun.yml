  notes: |
    - CODE PR spec-only → evidencia primaria por código; NO hay IE run (live CamiloDevOrg-only dev-proven;
      v2 NO seeded a MigrationApp-dev, seed PENDING-CREDS con AWS SSO expirado).
    - Independent verification: los 5 step-contracts se re-parsearon por cuenta propia Y se LEYÓ el apex de los
      steps 2 y 5 (objetos, dynamic recipient, override operatorInputs, verify/throw, read-back conditions), NO
      se confió en el .spec.ts lockstep ni el PR body.
    - op-reuse: git diff c671b71f..5e6675e3 = 2 files bajo seeds/specs. NINGÚN adapter/op tocado. git grep base:
      recordPattern=27, standardValueSet=41 → ambos ops preexisten (reused, NO genuinely-new).
    - Reconciliación del claim del dev "jest 8/8": el lockstep de ic-5-07 = 9 tests (verde), delta de 1 (test
      agregado tras escribir el PR body). Full = 1934/1935 (1 skipped). Reporto lo obtenido.
