description: |
  QA de IM-1085 (Historia, priority Medium/low-confidence, epic IM-735 Implementation Cases
  Automation). QA Sub-task: IM-1129. PR bajo prueba: Veevarts/MigrationAppBackend#257 (CODE PR
  spec-only, 2 files +230/-19, MERGED 2026-07-16, merge 5e6675e3, base c671b71f).

  IC 5.07 NPSP Customizable Rollups (tier Low). Caso HYBRID: automatiza las partes verificables
  y deja la construcción CRLP como guided handoff MANUAL con read-back SOQL. Reutiliza ops (T3
  standardValueSet, T6 anon-apex, T3 customMetadata recordPattern de IM-933) — sin op nuevo.

  Hallazgo clave (low-confidence): un probe live creó Filter Group/Rule/Rollup vía Metadata API —
  los writes COMMITEAN (subscriber-owned) — pero el SOQL read-back devuelve Ids/DurableIds (no los
  strings de API-name escritos) → un op declarativo no puede self-verify la construcción → queda MANUAL.

  Método QA (reuso del clone; checkout 5e6675e3; deps válidas):
  1. Independent spec-fidelity parse de los 5 steps + LECTURA del apex de step 2 (dynamic admin +
     override + verify) y step 5 (read-back conditions) — no solo el lockstep del dev.
  2. op-reuse audit: git diff base..merge = 0 adapter/op (2 files); recordPattern/standardValueSet
     preexisten en base → NO genuinely-new.
  3. jest (5.07 lockstep + full), tsc --noEmit, eslint touched. Conteo del dev (8/8) reconciliado (9).

  Resultado: 6/6 PASS. 0 defectos. Live (steps 1/2/3 + probe) dev-proven en CamiloDevOrg; re-correr via
  la app bloqueado (v2 no seeded — seed PENDING-CREDS) → documentado, no PASS/FAIL prematuro.

