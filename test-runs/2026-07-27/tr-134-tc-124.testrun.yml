    | AC5 probe: CMDT creatable but not op-verifiable -> MANUAL         | S4       | YES (reasoning+spec)| PASS |
    | AC6 MANUAL CRLP build + T6 read-back verify (apex)                | S5       | YES (apex read)  | PASS    |
    | AC7 v2 lockstep + gates + op-reuse                                | S6       | YES (clone)      | PASS    |
    | steps 1/2/3 + probe LIVE                                          | S1-S5    | NO (creds-gated) | dev-proven / PENDING-CREDS |

    ## Objective fit

    - Objetivo: automatizar las partes verificables de IC 5.07; mantener la construcción CRLP como guided handoff con
      read-back; recipient dinámico sin hardcode + override; idempotente; gates verdes + versiones lockstep; sin op nuevo.
    - Delivered: 3 auto steps + 1 MANUAL + 1 read-back; step 2 recipient dinámico + override + verify; step 3 recordPattern
      deactivate; step 5 read-back que throws un mensaje con gaps; jest verde; op reutilizado; probe finding documentado.
    - Objective met? YES. 0 defectos. La construcción MANUAL es correcta por el hallazgo del probe (no defecto).

