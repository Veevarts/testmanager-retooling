    scenarioTitle: "AC5 · Probe proves CRLP CMDT records are creatable but not op-verifiable — a Filter Group/Rule/Rollup created via the Metadata API commits and is SOQL-readable, but the read-back returns reference/entity fields as Ids/DurableIds (not the written API-name strings), so the declarative customMetadata op cannot self-verify a filter-rule or rollup construction"
    testCaseId: 93a25fac-77e2-4100-8524-faab0de4d363
    testCaseKey: TC-124
    status: passed
    executedAt: "2026-07-27T18:26:00Z"
    duration: 4
    actual: |
      El hallazgo del probe (low-confidence) documentado en el ticket/PR + reflejado en el diseño del spec:
      - el create de Filter Group + Filter Rule + Rollup vía Metadata API SUCCEEDS y los records son readable por SOQL
        (subscriber-owned, NamespacePrefix null; borrados tras el probe).
      - el SOQL read-back devuelve los fields de referencia/entity como Ids/DurableIds, no los strings de API-name
        escritos (Filter_Group__c→record Id, RecordTypeId→Object.RecordType, custom obj/field→EntityDefinition/
        FieldDefinition DurableIds).
      - por eso el op customMetadata declarativo NO puede self-verify una construcción de filter-rule/rollup → la
        construcción queda como guided handoff MANUAL (step 4) con read-back SOQL (step 5). Decisión correcta para Low.
    notes: |
