notes: |
  ## Solution understood

  My Day gastaba los huecos del lote diario (tope 5) en cuentas que todavia son de Implementaciones. El backend
  ("#411") excluye las cuentas con on_implementation = true (IS NOT TRUE, asi que NULL cuenta como elegible) en las
  cuatro lecturas que alimentan la generacion (pendientes, candidatas y senales de salud y email). Tambien filtra el
  lote al servirlo, para cubrir lotes anteriores y cuentas que cambian a mitad del dia. En el pool de My Day las oculta
  por defecto: includeOnImplementation=true las revela, hiddenOnImplementation cuenta las ocultas de todo el pool y el
  cursor lleva el filtro para rechazar un cambio de filtro a mitad de paginacion. Con accountId no se filtra nada. El
  frontend ("#217") anade al modal el control "Show N / Hide accounts on implementation", el chip "On implementation" y
  la vuelta a la primera pagina al cambiar el filtro. Efectos esperables: nada se declina ni caduca, y el panel puede
  mostrar menos que el tope hasta la siguiente generacion.

  ## Inferred technical tests

  - Backend: jest de tareas, tsc y el banco SQL real (Postgres local) en main y en el padre del merge; mutaciones B1-B8. Ejecutado.
  - Frontend: los tests del PR en main y en el padre; mutaciones F1-F5. Ejecutado.
  - Dev, API: pool completo con y sin filtro, cursores cruzados, valores invalidos, vista de cuenta, listas y portfolio. Ejecutado.
  - Dev, base y logs (lectura con autorizacion del usuario tras aws sso login): lote de hoy, candidatas, cuentas NULL, log del ranking. Ejecutado.
  - Dev, UI: panel, modal, revelar y ocultar, foco, vista de cuenta, Details en fila revelada. Ejecutado.
  - Dev, escrituras: Accept y Decline sobre filas reveladas, primero abortadas y despues reales con autorizacion del usuario. Ejecutado.
  - No ejecutado: regenerar el lote de hoy (el usuario no lo autorizo). No hace falta para el veredicto (ver escenario 4).

  ## Resultado

  14/14 PASS; AC2 con alcance. Sin defectos en IM-1313. O1: en dev el modelo no llena el tope ni antes ni despues del
  cambio. O2: el panel confia en el filtro del backend. O3: Escape tras "Load more" (TR-215). O4: orden de despliegue a
  prod invertido, sin efecto. O5: F2 equivalente. Detalle en attachments/tr-216-tc-189/hallazgos.txt.
