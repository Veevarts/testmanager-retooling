notes: |
  ## Solution understood

  El ETL informa el final de una corrida con un PUT de ficheros por objeto y un PATCH de estado a la API del backend.
  Iban a la URL execute-api, y en la VPC del ETL de produccion un endpoint de interfaz execute-api con DNS privado
  reescribe todo *.execute-api hacia si mismo y responde 403 a una API que no es PRIVATE. BE "#356/#412" crean un
  dominio propio REGIONAL (alias A en Route 53, mapeo de raiz), fuera del nombre que captura el DNS privado, y lo dejan
  activado en todos los despliegues; la URL del ETL se cambio a ese dominio sin stage. ETL "#173" reintenta las dos
  llamadas con espera exponencial y plazo por intento, informa COMPLETED solo si llego algun inventario y deja un ERROR
  migration.run.terminal.callback.undelivered con id de corrida y estado HTTP. BE "#415" asienta el estado de cada
  objeto al recibir sus ficheros y, al cerrarse la corrida, marca FAILED los que no recibieron ninguno.

  ## Inferred technical tests

  - Suites de ETL "#173" y BE "#415" en main y en el padre, y 11 mutaciones: ejecutado.
  - Estructura DNS y sondeo sin credenciales de los dos dominios propios: ejecutado.
  - Produccion, conteos agregados de las llamadas del ETL en Datadog (403 antes, 200 despues): ejecutado, autorizado.
  - Dev: una corrida correcta y una que falla lanzadas por QA, DynamoDB frente a S3, historial y descargas: ejecutado.
  - Arnes con el adaptador y los casos de uso reales contra un servidor HTTP local (403, 503, sin respuesta), en main
    y en el padre: ejecutado.
  - Alerta (AC4) y watchdog (AC5): buscados en CloudWatch, Datadog y el codigo; no existen.
  - Fuera del alcance de QA por politica: lanzar corridas o reenviar llamadas en produccion y recuperar las corridas
    atascadas de produccion.

  ## Resultado

  11/13 PASS, 2 FAIL de severidad media: F1 no existe ninguna alerta sobre la llamada final no entregada (AC4) y F2 no
  hay watchdog que saque de RUNNING una corrida que no informa (AC5). La historia vuelve al autor. Observaciones:
  una corrida que falla a mitad deja CSV huerfanos en S3 sin enlaces, y en Datadog los ERROR del ETL llegan partidos
  por linea y como info. Detalle en attachments/tr-219-tc-191/hallazgos.txt.
