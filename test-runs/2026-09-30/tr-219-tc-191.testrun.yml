  TR-219 · IM-1202 · TC-191 · 11/13 PASS, 2 FAIL (media) — las llamadas del ETL llegan por el dominio propio y las
  corridas terminan COMPLETED o FAILED con sus CSV descargables, pero no hay alerta ni watchdog
status: completed
environment:
  name: >-
    Dev de Migration App (backend 9ea9df33, ETL con el arbol de ea90850d) con sesion admin; workspace de pruebas del
    autor, el unico con respaldo encendido; 2 corridas lanzadas por QA con autorizacion del usuario de QA. Produccion
    solo en lectura (configuracion, DNS y conteos agregados de logs del ETL en Datadog, autorizados). Clones locales
    del ETL (Node 22) y del backend (Node 20).
  buildVersion: >-
    Mixed: infraestructura (dominio propio de la API en SAM, BE "PR #356" y "PR #412"), backend (BE "PR #415", asentar
    objetos), ETL (ETL "PR #173", reintentos y ERROR undelivered) y la URL del ETL en sus definiciones de tarea. En
