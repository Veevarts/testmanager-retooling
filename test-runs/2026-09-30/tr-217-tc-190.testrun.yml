notes: |
  ## Solution understood

  Todo cierre o exito de un modal pasaba por closeModal(), que volvia a la pagina: cerrar un Task Detail abierto desde
  "All suggested tasks" perdia el pool, y Accept/Decline en una tarjeta lo cerraba. "#219" hace que, durante una visita
  (isPoolFlow), el pool quede montado pero oculto detras de lo que abre; closeModal vuelve al pool si la visita sigue
  (decidido con isPoolFlowRef al terminar la accion, no al pulsar); las filas atendidas se ocultan durante la visita y
  Undo las devuelve; el scroll se guarda en un ref y se reaplica al volver a montar el cuerpo; el aviso pasa a la capa
  superior (z-60, data-react-aria-top-layer) para que Undo se pueda pulsar sobre el modal.

  ## Inferred technical tests

  - Specs del PR en main y en el padre (cdbe280), y mutaciones G1-G7: ejecutado.
  - Dev, solo lectura: cierres del detalle con Escape, X y Close midiendo filas, "Load more" y scrollTop; un solo modal;
    SF Case abierto y cancelado sin enviar; panel; cerrar y reabrir el pool; foco y Escape. Ejecutado.
  - Dev, escrituras autorizadas: Accept y Decline en tarjeta y desde el detalle, Undo, panel, cuenta, y un Accept con el
    envio retrasado 5 s para la carrera. Ejecutado.
  - No ejecutado: la ida y vuelta por Source en dev (ninguna fila del pool tiene fuente); la cubren un spec y G2.

  ## Resultado

  13/15 PASS, 2 FAIL de severidad baja: F1 el scroll del pool no se conserva (sube un 6-7 % por vuelta, acumulado) y F2
  tras "Load more" el foco cae al body y Escape no cierra el pool. La historia vuelve al autor. Detalle en
  attachments/tr-217-tc-190/hallazgos.txt.
