notes: |
  ## Solution understood

  El modal "All suggested tasks" entrega a Details la fila pulsada, pero MyDayTasksTab abria el detalle por id y lo
  buscaba en un mapa construido solo con el panel (tope de 5) y las listas de tareas. Una fila que solo estaba en el
  pool no se encontraba: el pool se cerraba y no se abria nada. "#218" guarda la fila entregada (poolTask) durante el
  flujo del detalle, la mete PRIMERA en el mapa para que una copia mas fresca del panel o de una lista la sustituya, y
  la descarta en closeModal y closePool. Efectos laterales esperables: ninguno fuera del flujo del pool; IM-1314
  (misma pieza) hace que cerrar el detalle vuelva al pool.

  ## Inferred technical tests

  - Tests del autor en main, con el arreglo revertido (ce57bca) y con mutaciones: ejecutados aqui.
  - Specs propios de QA para dos huecos (aperturas seguidas, titulos repetidos): ejecutados aqui.
  - Suite completa, tsc y eslint: ejecutados aqui (Node 20).
  - Recorrido en dev con Playwright y nombres enmascarados, con registro de escrituras: ejecutado aqui.
  - Accept/Decline: primero con las escrituras abortadas en el navegador y despues reales, con autorizacion del usuario.
  - Nada quedo manual.

  ## Resultado

  12/12 PASS. Sin defectos en IM-1312. Observaciones: O1 Escape no cierra el pool tras "Load more" (ajena a la
  historia), O2 falta un spec del autor para dos filas seguidas, O3 produccion no tiene el arreglo, O4 index.html con
  un anio de cache, O5 Node 25 en local. Detalle en attachments/tr-215-tc-188/hallazgos.txt.
