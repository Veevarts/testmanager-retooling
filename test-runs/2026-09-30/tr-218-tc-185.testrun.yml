notes: |
  ## Solution understood

  El PR 96 promueve staging a main, que despliega a produccion. Trae el flujo de borradores de IM-1302,
  aprobado en dev en TR-213, mas el rediseno del cliente del PR 93, que entro sin review ni QA. Desde el
  commit aprobado (39a15452) no cambio nada del servidor ni de infra: solo cliente, Dockerfile y
  dependencias. Por eso este smoke se centra en el recorrido del encuestado con la interfaz nueva y en los
  prerrequisitos desplegados de staging.

  ## Inferred technical tests

  - Prerrequisitos de staging, en solo lectura: GSI2 de respondent-state ACTIVE con proyeccion INCLUDE;
    simulacion IAM del rol de tarea: ConditionCheckItem permitido en surveys y respondent-state (los unicos
    destinos de ConditionCheck en el codigo) y Query permitido en el indice GSI2; despliegue ECS del PR 95
    COMPLETED. EJECUTADO.
  - Endpoints admin sin sesion: 401. EJECUTADO.
  - Recorrido del encuestado en navegador real: guardar, recargar y restaurar, completar, enviar,
    reintentar con el mismo token. EJECUTADO.
  - Envio sin token (paso 7 del runbook): sin borrador 201, con borrador activo 409. EJECUTADO.
  - Lectura de datos despues del envio: borrador finalizado y una sola respuesta. EJECUTADO.
  - Vista movil del formulario publico (390 px). EJECUTADO.
  - Pantallas del admin rediseñadas (Progress, Dashboard, Surveys): NO EJECUTADO, requieren login
    interactivo de Cognito.

  ## Hallazgos

  Ningun defecto. El boton Submit ahora usa isLoading del design system; en HeroUI isLoading deshabilita el
  boton, y en staging queda deshabilitado mientras viaja el envio. El reintento con el mismo token devuelve
  la misma respuesta, sin duplicado.

  OBSERVACION para produccion: el PR toca infra, server y client, asi que al mergear se disparan en paralelo
  Infra Deploy y Deploy. GSI2 se construye en produccion sobre una tabla con datos (en staging la tabla
  estaba vacia y termino 15 s antes que la app). Mientras el indice no este ACTIVE solo puede fallar la
  lista de Progress del admin; guardar y enviar no dependen de el. Despues del merge: esperar Infra Deploy
  en main y GSI2 ACTIVE, y hacer el smoke del runbook con una encuesta de prueba autorizada.

  Datos QA que quedan en staging a proposito, como evidencia: respuestas 1 y 2 y un borrador activo, todos
  de la organizacion qa-tr218-org.

  ## Veredicto

  APROBADO para el merge del PR 96. Los 5 escenarios ejecutados en staging pasan; los 8 restantes no se
  repiten porque el codigo de servidor es el mismo que aprobo TR-213 (13/13) en dev. El AC9 sigue como
  excepcion aceptada (IM-1309).
