  - testCaseId: 9c5a36d8-00f0-4e0b-8994-9faeedd92de9
    testCaseKey: TC-160
    scenarioTitle: >-
      AC7 · The engagement endpoint denies unauthenticated access while the public survey
      endpoints keep working unchanged
    scenarioIndex: 5
    status: passed
    executedAt: "2026-09-09T15:18:00Z"
    duration: 15
    stepResults: []
    actual: |
      Ejecutado EN VIVO contra el servidor real levantado en el commit del PR (puerto 4599, con
      AUTH_COOKIE_SECRET y configuración de Cognito):

        GET /api/admin/analytics/respondent-engagement?surveyId=1   sin credenciales  -> 401
          {"error":"Authentication required"}
        GET /api/admin/analytics/respondent-engagement              sin parámetros    -> 401
        GET (mismo endpoint) con Cookie: admin_session=falsificada                    -> 401
        Control, el resto de endpoints admin (responses, surveys, organizations, settings) -> 401
        GET /api/health (no admin)                                                    -> 200

      Estructura verificada: `app.use("/api/admin", requireAdminAuth)` en index.ts:29 se registra
      ANTES de `app.use("/api/admin/analytics", analyticsRouter)` en index.ts:33, así que el
      endpoint nuevo queda cubierto por el middleware sin necesidad de declararlo. Además
      `requireAdminAuth` falla CERRADO: si no hay sesión devuelve 401, no continúa.

      Endpoints públicos sin cambio: el PR no modifica index.ts ni lib/auth.ts ni los routers
      públicos (verificado en el diff), así que el cableado que los expone es el preexistente.
      La ejecución de un endpoint público con datos reales requiere DynamoDB, que no estaba
      disponible; lo verificado es que su definición y su montaje no fueron tocados.

      HALLAZGO DE COBERTURA: el único test automatizado que llama al endpoint sin credenciales
      ("requires a survey for respondent engagement") asserta 400, no 401, porque el harness
      inyecta el store y no ejerce el middleware real. Es decir el AC7 NO tiene cobertura
      automatizada; el PR body lo declara como verificación manual local. QA lo cubrió en vivo.

      pre-fix → post-fix → ¿objetivo cumplido?: el endpoint no existía → existe y deniega el
      acceso no autenticado con 401, sin alterar el cableado de los públicos → SÍ.
    notes: >-
      **PASS** con evidencia en vivo. Recomendación al dev: agregar un test que monte
      requireAdminAuth y asserte 401, para que el AC7 quede cubierto en CI.
