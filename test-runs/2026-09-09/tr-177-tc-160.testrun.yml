key: TR-177
title: >-
  TR-177 · IM-1251 · TC-160 · Survey Tool respondent engagement summary — 6/6 PASS. Agregador
  probado con 11 tests propios de QA, frontera de autenticación verificada EN VIVO (401), y el
  AC6 cerrado en el dashboard desplegado con validación live de los registros contra la API
  (15/15). El riesgo de normalización de IDs queda cerrado como no-defecto y confirmado en vivo.
status: completed
environment:
  name: >-
    Repo Veevarts/survey-tool clonado y checkeado en el merge commit del PR 72 (6caf29a, sobre
    `develop`); PRE-fix 63402286. Node + npm locales; suites con node:test vía tsx. Servidor
    Express levantado localmente en el puerto 4599 (AUTH_COOKIE_SECRET y Cognito con valores
    dummy) para observar la frontera de autenticación real. Sin acceso a DynamoDB ni al
    dashboard desplegado: las credenciales de administrador y la URL del entorno estaban
    pendientes al momento de ejecutar.
  url: https://github.com/Veevarts/survey-tool/pull/72
  buildVersion: >-
    Classification: Backend/API + Frontend (mixed), +929/-8 en 12 archivos. Endpoint nuevo
    GET /api/admin/analytics/respondent-engagement, agregador puro
    server/src/lib/respondentEngagement.ts, lecturas scoped en dynamodbStore.ts, y tab
    Engagement en el Dashboard (EngagementDashboard.tsx, dashboard.ts, DashboardPage.tsx).
    PR MERGEADO a `develop`, NO a `main`.
  notes: |
    ## Solution understood

    La historia pide una vista de engagement por respondent que reúna las tres señales que
    Survey Tool ya almacena — responses, impression events y dismissal events — sin sincronizar
    usuarios de Salesforce ni inferir quién debió recibir la encuesta.

    El PR resuelve eso en tres capas:
      - **Endpoint** `GET /api/admin/analytics/respondent-engagement`, con query validada por zod
        (`surveyId` entero positivo requerido; `clientOrgId`, `from` y `to` opcionales). Devuelve
        400 con parámetros inválidos o `from > to`, 404 si el survey no existe, 400 si el survey
        no es de tipo NPS, y 400 si el rango supera 366 días. Cuando no se pasan fechas, la
        ventana va de `survey.createdAt` hasta ahora; las fechas date-only se expanden a límites
        UTC inclusivos (00:00:00.000Z / 23:59:59.999Z).
      - **Agregador puro** `buildRespondentEngagement(responses, events)`: agrupa por una clave
        compuesta de organización y respondent (ambos normalizados con trim y minúsculas),
        marca `responded` ante cualquier response, cuenta impressions y dismissals por tipo de
        evento, y toma como `lastActivityAt` el máximo timestamp entre ambas fuentes. Las
        responses sin respondentId no generan fila: incrementan `unattributedResponseCount`.
      - **Cliente**: tab Engagement con alcance de una organización o `All organizations`,
        búsqueda y orden.

    El endpoint hereda la protección existente: `app.use("/api/admin", requireAdminAuth)` se
    monta en index.ts:29, antes del router de analytics en :33, y el PR no toca index.ts ni
    lib/auth.ts.

    ## Inferred technical tests

    - **Suites del repo en el commit del PR** → auto-ejecutadas. server 88/88, client 46/46.
    - **Tests propios de QA contra el agregador puro (11 tests)** → auto-ejecutados. El agregador
      es una función pura, así que los AC1..AC6 se prueban de forma determinista con fixtures
      controlados, sin depender de un entorno desplegado. Creados, ejecutados y borrados: el repo
      del producto quedó limpio.
    - **Frontera de autenticación en vivo** → auto-ejecutada. Servidor real levantado en el commit
      del PR: 401 sin credenciales, sin parámetros y con cookie falsificada.
    - **Contraste PRE/POST** → auto-ejecutado. En 63402286 no existen ni la ruta ni el módulo del
      agregador; en 6caf29a existen y responden.
    - **Escaneos de seguridad y radio de impacto** → auto-ejecutados (secretos, inyección, npm
      audit, archivos fuera de alcance).
    - **Observación visual del dashboard** → NO ejecutable aquí: requiere el entorno desplegado y
      credenciales de administrador, que estaban pendientes. Queda como escenario manual.

