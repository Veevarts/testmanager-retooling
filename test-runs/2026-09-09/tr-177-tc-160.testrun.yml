    scenarioTitle: >-
      AC3 + AC5 · Impression and dismissal totals reflect exactly the selected organization and
      survey, and activity from another organization or survey is excluded — including All
      organizations, where the same respondent ID in two organizations stays in separate rows
    scenarioIndex: 3
    status: passed
    executedAt: "2026-09-09T15:22:00Z"
    duration: 10
    stepResults: []
    actual: |
      Totales por tipo de evento (test QA): 5 impressions y 3 dismissals del mismo respondent
      producen exactamente impressions 5 y dismissals 3 en una sola fila.

      Aislamiento entre organizaciones (test QA): el mismo respondentId con actividad en
      00d-alpha y en 00d-beta produce DOS filas separadas, cada una con su propio evento
      (impressions 1 cada una). La clave de agrupación incluye la organización, así que el
      alcance `All organizations` no fusiona personas de orgs distintas.

      Aislamiento end-to-end (test del PR, apiBoundary): con actividad sembrada en 00d-demo y en
      00d-other, la consulta scoped a 00d-demo devuelve solo sus filas y
      unattributedResponseCount 1; la consulta `All organizations` devuelve 3 filas e incluye
      00d-other. El filtro por survey viaja como `surveyId` obligatorio en el propio query.

      Sobre el scoping por organización: el filtro se pasa en minúsculas
      (analytics.ts:140) y el ingest almacena clientOrgId ya normalizado a minúsculas en las dos
      rutas (responses.ts:265 y features.ts:328), así que filtro y dato son consistentes.

      pre-fix → post-fix → ¿objetivo cumplido?: no existían totales por respondent → totales
      exactos por tipo de evento, aislados por organización y survey → SÍ.
    notes: >-
