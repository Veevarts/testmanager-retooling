  - testCaseId: 9c5a36d8-00f0-4e0b-8994-9faeedd92de9
    testCaseKey: TC-160
    scenarioTitle: >-
      AC6 · A selection with no matching activity shows a clear empty state instead of an error
    scenarioIndex: 4
    status: passed
    executedAt: "2026-09-09T16:05:00Z"
    stepResults: []
    actual: |
      VERIFICADO EN EL ENTORNO DESPLEGADO. Sesión de administrador en
      https://surveytool.dev.veevart.ai (dev, rama develop), navegación con Playwright.

      Para elegir una celda genuinamente vacía se levantó primero la matriz survey × organización
      contra la API: de los 9 surveys NPS, la combinación "Fundraising" (survey 5) + Auctifera
      devuelve 0 filas mientras el mismo survey sí tiene actividad en VNFP Fund. Así el vacío
      corresponde a "esta organización no tiene actividad aquí" y no a un survey inexistente.

      Con esa selección la pantalla muestra: el contexto "Organization: Auctifera
      (00dem00000v5erwmaz)", las cuatro tarjetas en 0 (Respondents, Responded, Impressions,
      Dismissals), el contador "0 respondents" y el mensaje "No respondent activity matches the
      selected scope.". No hay tabla rota, ni error, ni spinner: 0 errores de consola.

      El empty state de no-selección es distinto y también correcto: sin survey elegido la tab
      muestra "Select an NPS survey to view respondent activity.", así que el usuario distingue
      "no has seleccionado nada" de "no hay actividad".

      Aprovechando el acceso se validaron además los registros contra la API en la misma sesión
      (15/15 PASS, live-validation-matrix.txt). Lo relevante: las 9 filas de la tabla coinciden una
      a una con la respuesta cruda del endpoint y las cuatro tarjetas cuadran con la suma de la
      API; ALL == suma de las 3 organizaciones en los 9 surveys, o sea partición disjunta y
      completa; el clientOrgId normaliza casing y espacios (4 variantes → mismas 8 filas), lo que
      confirma live la mitigación que hasta ahora sólo estaba verificada por lectura de código.

      pre-fix → post-fix → ¿objetivo cumplido?: el AC6 no era observable sin entorno → empty state
      explícito y verificado en pantalla, con captura → SÍ.
    notes: >-
      **PASS.** Cierra el único escenario que TR-177 había dejado `not-run`. Dos observaciones
      levantadas en la misma corrida (O1 zona horaria del filtro, O2 organización inactiva en el
      selector) NO son regresiones de este PR: ambas se reprodujeron en superficies preexistentes
      del dashboard. Ver date-filter-timezone.txt y org-selector-inactive.txt.
