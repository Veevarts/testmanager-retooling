    scenarioTitle: >-
      AC1 + AC4 · The respondent population is the union of responses, impressions and
      dismissals, and a respondent present in several sources is combined into a single row
      without double-counting
    scenarioIndex: 1
    status: passed
    executedAt: "2026-09-09T15:20:00Z"
    duration: 12
    stepResults: []
    actual: |
      PRE-fix (63402286): no existe ni la ruta respondent-engagement en analytics.ts (0
      ocurrencias) ni el módulo server/src/lib/respondentEngagement.ts. No había ninguna vista
      que uniera las tres fuentes.

      POST-fix (6caf29a), probado por QA con fixtures controlados sobre el agregador puro:
        - un respondent presente en las tres fuentes (response + impression + dismissal) más otro
          con solo un evento producen exactamente 2 filas: una por respondent, no una por fuente.
        - el respondent multi-fuente muestra impressions 1 y dismissals 1: cada evento se cuenta
          una sola vez al combinar.
        - con 4 eventos del mismo respondent (3 impressions + 1 dismissal) sigue habiendo 1 sola
          fila, con los totales 3 y 1: no hay fan-out por número de eventos.

      El test end-to-end del propio PR (apiBoundary, con store inyectado) confirma lo mismo a
      través de la ruta real, incluyendo el shape completo de las filas devueltas.

      pre-fix → post-fix → ¿objetivo cumplido?: no existía la unión de fuentes → una fila por
      respondent con las tres señales combinadas sin doble conteo → SÍ.
    notes: >-
      **PASS** a nivel de dato (agregador y ruta). La observación visual de la tabla en el
