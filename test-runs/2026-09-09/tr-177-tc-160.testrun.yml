  - testCaseId: 9c5a36d8-00f0-4e0b-8994-9faeedd92de9
    testCaseKey: TC-160
    scenarioTitle: >-
      AC-adjacent · Edge cases and PR behaviours that the story does not specify: unattributed
      responses, inclusive UTC date boundaries, endpoint validations, and the case-insensitive
      normalisation of respondent and organization IDs
    scenarioIndex: 6
    status: passed
    executedAt: "2026-09-09T15:25:00Z"
    duration: 18
    stepResults: []
    actual: |
      Responses sin respondentId (test QA): dos responses sin identificador (una con null y otra
      con espacios en blanco) más una identificada producen 1 sola fila y
      unattributedResponseCount = 2. No se presentan como usuarios identificados, que es
      justamente lo que el PR se propuso. Los eventos sin respondentId se ignoran.

      Límites de fecha: `dateBoundary()` expande las fechas date-only a 00:00:00.000Z y
      23:59:59.999Z, de modo que el día indicado en `to` queda incluido. El guard de rango
      responde 400 "Engagement date range cannot exceed 366 days" (asserted por el test del PR).

      Validaciones del endpoint verificadas en el handler: 404 "Survey not found" con surveyId
      inexistente; 400 "Respondent engagement is available for NPS surveys only" si el survey no
      es NPS; 400 con `from > to`; 400 por esquema zod si falta surveyId o no es entero positivo
      (asserted por el test del PR).

      EL RIESGO DE NORMALIZACIÓN QUE MARCÓ EL BUNDLE: CERRADO, NO ES DEFECTO.
      El TC-160 planteó que aplicar minúsculas a respondentId y clientOrgId podría fusionar dos
      IDs de Salesforce de 15 caracteres distintos. QA lo investigó en el código en lugar de
      asumirlo:
        - clientOrgId ya se normaliza a minúsculas EN LA INGESTA, en los dos caminos
          (responses.ts:265 y features.ts:328). El colapso de caso es una decisión del sistema
          anterior a este PR, y el filtro en minúsculas del endpoint es consistente con lo
          almacenado.
        - respondentId, en cambio, se guarda en minúsculas por el camino de responses
          (responses.ts:229) pero TAL CUAL por el de eventos (features.ts:328). Es decir, la
          normalización del agregador no es un riesgo: es la mitigación necesaria de una
          inconsistencia real entre los dos ingests. Sin ella, la response y las impressions de
          la misma persona caerían en filas distintas — el doble conteo que prohíbe el AC4.
          Probado: response "005xx000001abcaaa" + evento "005Xx000001abcAAA" = 1 fila.

      Observación menor (cosmética, no defecto): el respondentId que se muestra es el de la
      primera fuente procesada. Como las responses se procesan antes que los eventos, quien
      respondió aparece en minúsculas y quien solo tiene eventos conserva el caso original, así
      que la columna puede verse mezclada.

      Fuera de alcance respetado: 0 archivos de integración Salesforce, 0 referencias a
      LastLoginDate, ningún otro repositorio tocado, y ni index.ts ni lib/auth.ts modificados.

      pre-fix → post-fix → ¿objetivo cumplido?: el riesgo estaba planteado como hipótesis sin
      verificar → verificado en el código y con tests, sin fusión indebida y con la normalización
      justificada → SÍ.
    notes: >-
      **PASS**. El riesgo que el bundle marcó queda cerrado con evidencia, no descartado por
      supuesto.
