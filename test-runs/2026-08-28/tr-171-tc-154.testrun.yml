key: TR-171
title: >-
  TR-171 · IM-1211 · TC-154 · rental_events_groups.sql mergea 4 fuentes de notas de Altru
  (SALESORDER.COMMENTS, RESERVATIONNOTE, RESERVATION.ARRIVALNOTES, ITINERARYITEM.NOTES) con
  HTML-escape en Auctifera__Description__c — 5/5 PASS + 2 DEFERRED. Static 37/37 (13 nuevos
  IM-1211) + query-regression 580/580 + revert-proof 5/37 capturados exactamente.
status: completed
environment:
  name: >-
    Repo Veevarts/MigrationToolETL clonado local en HEAD del PR #176 (branch
    CamiloSalgueroMarin/IM-1211-reservation-notes, commit 2b771bbb, base branch main).
    Node 25.4 + npm 11.7. safesql tool malfunction esta sesión (silent tunnel fail; bastion
    reachable via manual SSH, pero safesql script no printea [ssh] stderr y timeout 20s en
    localhost:4143X). Colima corriendo pero mssql-server 2022 startup >60s bajo carga.
  url: https://github.com/Veevarts/MigrationToolETL/pull/176
  buildVersion: >-
    Classification: SQL-only query fix (+733/-28). 5 files: 1 SQL (rental_events_groups.sql +138/-4
    — 1 CTE widened + 1 nueva CTE ItineraryItemNotes + main SELECT projection reemplazada por
    NULLIF(CONCAT_WS('<br>', ...)) merge 4-source labelled + nueva LEFT JOIN + 67 líneas de
    header contract), 1 spec estático rental-event-query.spec.ts (+315, 37 tests totales de los
    cuales 13 nuevos IM-1211 + 4 guard-helper meta-tests), 1 spec integration rental-event-query
    (+148 nuevo, 13 tests docker-gated), 1 fixture (+65/-22), 1 docs altru-model-context.md (+67).
    PR OPEN, mergeable, base main, no stack.
  notes: |
    ## Solution understood

    Bug: `rental_events_groups.sql` construía `Auctifera__Description__c` desde `rn.concatenatedNotes`
    (una CTE que solo leía RESERVATIONNOTE — la "Notes" tab child, esencialmente sin usar; en
    Illinois esa tabla tiene 0 rows). El campo que el cliente pide (y el que Altru surface como
    "Important notes" en el objeto Reservation) es SALESORDER.COMMENTS. La vista Altru
    `V_QUERY_RESERVATION` define `IMPORTANTNOTES = SALESORDER.COMMENTS`. Además, se encontraron
    otras 2 fuentes que se perdían outright: ITINERARYITEM.NOTES y RESERVATION.ARRIVALNOTES.

    Fix: en `Auctifera__Description__c` ahora se mergean las 4 fuentes con label prefix, en orden
    determinístico Important → Reservation → Arrival → Itinerary, con HTML-escape (& primero, luego
    < y >, luego newlines → <br>) porque el field target es rich-text (Html):

      NULLIF(CONCAT_WS(N'<br>',
        N'Important notes: '   + <escaped> so.COMMENTS,
        N'Reservation notes: ' + rn.concatenatedNotes,
        N'Arrival notes: '     + <escaped> r.ARRIVALNOTES,
        N'Itinerary notes: '   + iin.concatenatedItemNotes
      ), N'')

    Semántica clave:
    - CONCAT_WS skipea NULL args, y `'label: ' + NULL = NULL` → una fuente empty vanish sin
      dejar label vacío.
    - Outer NULLIF devuelve empty cuando ninguna fuente tiene content — no arma "Important
      notes: null".
    - `ReservationNotes` CTE se amplió: STRING_AGG ahora combina TITLE + TEXTNOTE con CONCAT_WS,
      WHERE gate widened para admitir title-only notes, WITHIN GROUP (ORDER BY DATEENTERED, ID)
      para reproducibilidad.
    - Nueva `ItineraryItemNotes` CTE pre-agrega ITINERARYITEM.NOTES por RESERVATIONID (via
      ITINERARY join) para evitar row multiplication en el LEFT JOIN.
    - Todos los fragments CAST a NVARCHAR(MAX) por 3 razones: IM-770 data-type-precedence,
      STRING_AGG 8000-byte ceiling, CONCAT_WS silent truncation cuando no hay input max.

    Impacto medido (dev PR body 2026-08-28):
      Illinois:    0 → 1,599 reservations con notes (16.6% de 9,652) — 315 con 2+ sources
      Long Island: 14 → 11,812 (70.6% de 16,731) — 104 con 2+ sources

    Known cosmetic edge documentada en SQL header: leading/trailing newline en una nota deja un
    bare `<br>` porque LTRIM/RTRIM one-arg solo stripa U+0020 (no CR/LF/TAB). Aceptado en vez de
    fixear porque la projection NO puede usar CASE (spec forbids it, para que ninguna fuente
    pueda ser preferida), y `TRIM(chars FROM ...)` levantaría el version floor SQL 2017 → 2022.

    ## Inferred technical tests

    - **jest static specs (rental-event-query.spec.ts, 37 tests, 13 nuevos IM-1211 + 4 guard-helper
      meta-tests)** → auto-ejecutado. 37/37 PASS. Los 13 IM-1211 pinnean merge, labels, HTML
      escape order, title-only note, TITLE+TEXTNOTE juntos, empty-source handling, ordering,
      itinerary pre-aggregation, join key.
    - **jest full query-regression suite (580 tests)** → auto-ejecutado. 580/580 PASS · 168 skipped
      (docker-gated) · 46/63 suites.
    - **Revert-proof** → auto-ejecutado. Revertir main SELECT projection de vuelta a
      `rn.concatenatedNotes AS Auctifera__Description__c` (dejando las CTE changes): 5/37 tests
      FAIL exactamente donde se esperan (merge structure + HTML escape order + NULLIF wrapper +
      STRING_AGG ordering + guard-helper). 32/37 PASS bajo revert. Los tests SÍ atrapan el bug.
    - **safesql aggregate wrapper (contract-safe)** → PREPARADO pero NO ejecutable esta sesión.
      Wrapper reusa tablas source directamente (RESERVATION, SALESORDER, RESERVATIONNOTE, ITINERARY,
      ITINERARYITEM) y emite conteos numéricos por-fuente + coverage total + multi-source. Corre
      instantáneamente cuando safesql tunnel se restaure. Expected illinois_2: total_reservations
      = 9,652, with_any_note = 1,599, with_two_or_more_sources = 315, with_important_notes = 1,256,
      with_arrival_notes = 276, with_itinerary_notes = 436, with_reservation_notes = 0.
    - **Docker integration (RUN_DOCKER_SQL_QUERY_TESTS=1, 13 rental-event integration tests)** →
      DEFERRED. Local: 13/13 FAIL con "Log stream ended and message '/.*Started.*/' was not
      received" — colima resource contention. Dev PR body: PASS.

