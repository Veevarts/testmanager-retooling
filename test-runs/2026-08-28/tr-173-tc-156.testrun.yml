key: TR-173
title: >-
  TR-173 · IM-1206 · TC-156 · membership_transactions.sql + fund_assignment_memberships.sql +
  sales_order_only_membership2.sql anclan CloseDate + Revenue_ID_legacy__c en owning transaction
  (no en la que el resolver rankea primero) — 5/5 PASS + 2 DEFERRED. Static specs 98/113 (5
  IM-1206 groups) + query-regression 577/577 + revert-proof 2/53 capturados. rev-10970978
  (2021→2022) + rev-10059401 (2011→2012) corregidos (dev-verified). Reverses IM-1205 preference.
status: completed
environment:
  name: >-
    Repo Veevarts/MigrationToolETL clonado local en HEAD del PR #175 (branch
    CamiloSalgueroMarin/IM-1206-revenue-report-date, commit d34a338f, base main). Node 25.4
    + npm 11.7. safesql tool silent tunnel fail esta sesión (mismo pattern que TR-171/172).
    Colima corriendo pero mssql-server startup >60s → docker integration 15/113 FAIL con
    log-wait timeout.
  url: https://github.com/Veevarts/MigrationToolETL/pull/175
  buildVersion: >-
    Classification: SQL-only query fix (+249/-12). 7 files: 3 SQL principales
    (membership_transactions.sql +44/-5, fund_assignment_memberships.sql +11/-2,
    sales_order_only_membership2.sql +7/-1), 1 docs (altru-model-context.md +7/-1),
    3 spec files (membership-transactions-query.spec.ts +125 nuevo, fund-assignment-memberships-query.spec.ts
    +36/-3, pos-purchase-membership-no-order-query.spec.ts +19 nuevo). PR OPEN draft, mergeable,
    base main.
  notes: |
    ## Solution understood

    Bug: la hipótesis del ticket (Altru's Revenue Report usa fecha incorrecta) está disprobed.
    rev-10970978 es genuinamente un 2021 record (Payment $85 dated 2021-11-29); su ausencia
    del 2022 Report es correcta. La membresía SÍ está en el 2022 Report como rev-11019841
    (Order dated 2022-03-14, 105 días después) — es un deferred/layaway order donde el sales
    order se abre y paga en 2021 pero se convierte en revenue transaction en 2022.

    Root cause real: MISMO mecanismo que IM-1205. El ranking CASE en membership_transactions.sql
    y fund_assignment_memberships.sql rankea SOURCELINEITEMID children antes que la membership
    line's OWN transaction. Una Payment aplicada a un sales order produce EXACTAMENTE la misma
    shape que un refund child (APPLICATION = 'Order' line en la Payment apuntando back a la
    membership line) → el Payment gana el ranking, y la Opportunity/Fund Assignment hereda el
    Payment's ID y date en vez del Order's.

    Fix (complementario a IM-1205 PR #172, que fijó Auctifera__Posted_Date__c):
      1. Añadir `ft.CALCULATEDDATE AS OwnFinancialTransactionDate` a #MembershipLineItems CTE.
      2. Añadir `own_src_ft.CALCULATEDUSERDEFINEDID AS OwnRevenueIdLegacy` a
         #OrderBackedMembershipFinancialCandidates CTE (nueva LEFT JOIN own_src_ft ON FK→PK).
      3. Main SELECT Revenue_ID_legacy__c: `COALESCE(rgi.RevenueId, NULLIF(mli.Revenue_ID_legacy__c, ''), rmft.Revenue_ID_legacy__c)`
         — NULLIF wrap (Round 1 finding: Altru stores blank rev ids como '' NOT NULL).
      4. Main SELECT CloseDate: añade `mli.OwnFinancialTransactionDate` at position #2 en ambas
         branches (recurring: entre rgi.InstallmentDate y rmft; non-recurring: al frente).
      5. fund_assignment_memberships.sql: alinea Revenue_ID_legacy__c con la date que IM-1205
         ya movió.
      6. sales_order_only_membership2.sql: emite el Order id (contract fix — 0 orderless
         anchors move en LI).

    Reverses IM-1205's stated preference: Revenue_ID_legacy sigue al Order (lo que Altru's
    Revenue Report muestra); spec assertion de IM-1205 se rewrite (no delete).

    Impacto dev-medido (safesql, Long Island whole population):
      - Opportunity: 97,047/97,047 rows PRE=POST; blank rev IDs 68→31
      - Fund Assignment: 97,014/97,004 rows PRE=POST; blank rev IDs 37→0
      - Orderless POS: 51,482/51,482 PRE=POST
      - 33 CloseDates cambian, todos landing exacto en MEMBERSHIPTRANSACTION.TRANSACTIONDATE
      - 42,610 Revenue_ID_legacy__c cambian — 42,573 payment→order + 37 blank→populated

    Ejemplos end-to-end (dev-verified prod, read-only):
      - rev-10970978: CloseDate 2021-11-29 → 2022-03-14; Rev ID Payment→Order (rev-11019841)
      - rev-10059401: 2011 membership dated 2012 vía Refund child; POST 2011-11-09 + rev-10059401

    ## Inferred technical tests

    - **jest static specs (3 archivos, 113 tests, 98 PASS + 15 docker skipped)** → auto-ejecutado.
      IM-1206 groups en cada spec (membership-transactions-query.spec.ts nuevo +125 con 53 tests
      totales incluyendo owning-transaction anchor pins).
    - **jest full query-regression suite (577 tests)** → auto-ejecutado. 577/577 PASS. Matches
      dev PR body exactamente.
    - **Revert-proof** → auto-ejecutado. Revertir SOLO las 2 líneas del CloseDate anchor
      (recurring + non-recurring branches, removiendo `mli.OwnFinancialTransactionDate` del
      COALESCE): 2/53 tests FAIL exactamente donde se esperan (pinnean la string
      `mli.OwnFinancialTransactionDate, rmft.FinancialTransactionDate, mt.TRANSACTIONDATE`).
      51/53 PASS bajo revert. Confirma que los tests atrapan el bug.
    - **safesql aggregate wrapper** → PREPARADO pero NO ejecutable esta sesión. Mismo pattern
      que TR-171/172 (safesql silent tunnel fail; bastion sí up via SSH directo). Wrapper en
      scenario-1/aggregate-wrapper.sql — corre cuando el tool restaure.
    - **Docker integration (RUN_DOCKER_SQL_QUERY_TESTS=1)** → DEFERRED. Local 15/113 FAIL con
      "Log stream ended" — colima resource contention. Dev PR body: PASS.

