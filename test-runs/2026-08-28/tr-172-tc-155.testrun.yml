key: TR-172
title: >-
  TR-172 · IM-1212 · TC-155 · fund_assignment_payments.sql ancla windowed WHERE en never-null
  FilterDate (COALESCE PostedDate, InstallmentDate) — 5/5 PASS + 2 DEFERRED (docker + safesql).
  Sev 1 - Business Stopping. Static specs 21/27 (11 pledge-payment) + query-regression 569/569 +
  revert-proof 1/11 capturado. NPSP flag rename npsp→npe01 en 8 files.
status: completed
environment:
  name: >-
    Repo Veevarts/MigrationToolETL clonado local en HEAD del PR #174 (branch
    CamiloSalgueroMarin/IM-1212-pledge-fund-assignments, commit ce75dda5, base main). Node 25.4
    + npm 11.7. safesql tool silent tunnel fail esta sesión (mismo pattern que TR-171). Colima
    corriendo pero mssql-server startup >60s bajo carga → docker integration 2/2 FAIL con log-wait
    timeout.
  url: https://github.com/Veevarts/MigrationToolETL/pull/174
  buildVersion: >-
    Classification: SQL-only query fix (+305/-30). 18 files: 1 SQL main
    (fund_assignment_payments.sql +63/-12 — 3 nuevas JOINs INSTALLMENT + FilterDate column +
    explicit top-level projection + WHERE switch), 2 SQL flag-rename (donation_pledges.sql,
    donation_transaction.sql), 8 docs+config flag-rename (AGENTS.md, altru-model-context.md,
    4 openspec/im-910 files, mapper + 2 pipelines), 3 test files nuevos/modificados
    (pledge-payment-query.spec.ts +89, pledge-query-chain.integration.spec.ts +90 nuevo,
    matching-gift-query.spec.ts +6/-1, matching-gift-integration +1/-1, donation-pledges-query.spec.ts
    +18), 1 chain-verifier (+5/-1). PR OPEN draft, mergeable, base main. Sev 1 - Business Stopping.
  notes: |
    ## Solution understood

    Bug: `fund_assignment_payments.sql` filtraba el WHERE windowed sobre
    `q.Auctifera__Posted_Date__c IS NOT NULL AND CAST(... AS DATE) >= @filterDateFrom`. La rama
    unpaid-installment del query deja `Auctifera__Posted_Date__c` NULL a propósito (una cuota
    pendiente no tiene posted date todavía). `NULL >= @filterDateFrom` evalúa a UNKNOWN en SQL,
    así que cualquier corrida con ventana de fechas dropeaba el 100% de fund assignments de
    cuotas pendientes. Mientras tanto, `opportunity_payments.sql` y `pledge_payments_unpaid_charges.sql`
    sí emitían sus unpaid rows para la misma ventana — resultado: el Pledge migrado quedaba con
    un OppPayment y un Charge por el dinero aún debido, pero ningún fund assignment atrás.

    Fix (surgical):
      1. Añadir `JOIN INSTALLMENT ins ON ins.ID = isplt.INSTALLMENTID` en 3 CTEs
         (PaymentPerInstallment, WriteOffAgg, UnpaidSplits).
      2. Proyectar `MIN(ins.[DATE]) AS InstallmentDate` (paid+writeoff) o `ins.[DATE] AS InstallmentDate`
         (unpaid) en cada CTE.
      3. Añadir columna interna `FilterDate` a cada rama del UNION:
           Paid    : COALESCE(pa.PostedDate, CAST(pa.InstallmentDate AS DATE))
           WriteOff: COALESCE(wo.PostedDate, CAST(wo.InstallmentDate AS DATE))
           Unpaid  : CAST(us.InstallmentDate AS DATE)
      4. Cambiar el top-level `SELECT *` a un list explícito de 12 columnas (esconde FilterDate del
         CSV — es interno-only para el windowing).
      5. WHERE gate: `q.FilterDate >= @filterDateFrom AND q.FilterDate <= @filterDateTo`.

    Auctifera__Posted_Date__c queda proyectada como antes (NULL en unpaid), no hay cambio de
    contrato downstream. FINANCIALTRANSACTION.CALCULATEDDATE es nullable en Altru → el mismo
    COALESCE fallback protege también las ramas paid/writeoff (no solo unpaid).

    Bonus fix (latent): NPSP suppression flag `npsp__Do_Not_Automatically_Create_Payments__c`
    (namespace `npsp`, plural, INEXISTENTE en cualquier org) renombrado a
    `npe01__Do_Not_Automatically_Create_Payment__c` (namespace `npe01`, singular, REAL). Latent
    porque el mapper del load resolvía a mano el nombre correcto (flag ya está `true` en prod
    para los 2 pledges afectados, dev-verified). Cierra la brecha en AGENTS.md + IM-910 spec.

    Impacto dev-medido: Illinois 2026 window recupera **141 unpaid rows** que PRE-fix se
    dropeaban al 100%.

    ## Inferred technical tests

    - **jest static specs (pledge-payment-query.spec.ts +89 nuevo, matching-gift-query.spec.ts
      +6/-1, donation-pledges-query.spec.ts +18)** → auto-ejecutado. 21/27 PASS + 6 skipped
      (docker-gated). Todos verdes en la PR branch.
    - **jest full query-regression suite (~569 tests)** → auto-ejecutado. 569/569 PASS · 163
      skipped (docker-gated) · 46/63 suites.
    - **Revert-proof** → auto-ejecutado. Revertir SOLO la línea WHERE (de `q.FilterDate`
      → `q.Auctifera__Posted_Date__c IS NOT NULL AND CAST(...)`): 1/11 test de
      pledge-payment-query.spec.ts FALLA exactamente donde se espera (el que pinna
      `(@useDateFrom = 0 OR q.FilterDate >= @filterDateFrom)`). 10/11 PASS bajo revert
      (invariantes preservados: JOINs, columnas, CTEs). Confirma que los tests atrapan el bug.
    - **safesql aggregate wrapper** → PREPARADO pero NO ejecutable esta sesión. safesql tool
      silent tunnel fail (mismo pattern que TR-171 ~4h ago). Bastion sí reachable via SSH
      directo. Wrapper preparado en scenario-1/aggregate-wrapper.sql — corre cuando el tool
      restaure. Expected illinois_2 windowed 2026: PRE 0 unpaid / POST 141 unpaid.
    - **Docker integration (RUN_DOCKER_SQL_QUERY_TESTS=1)** → DEFERRED. Local: 2/2 FAIL con
      "Log stream ended and message '/.*Started.*/' was not received" — colima resource
      contention. Dev PR body: PASS.

