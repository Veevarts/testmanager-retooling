environment:
  name: "MigrationToolETL @ PR #155 head 58f6016 (branch fix/im-1107-shop-discount-amount-netting, base main) · node v25.4.0 · safesql profile tucson (live Altru replica, aggregate-only) · illinois_2 (cliente del ticket) y aspen sin túnel · docker/colima DOWN → integration deferred"
  url: "https://github.com/Veevarts/MigrationToolETL/pull/155"
  buildVersion: >-
    SQL + query-regression (dev category), source-side Altru shop. 10 files +1255/-15: 4 .sql de shop (sale_item,
    client_purchase, sales_order_only_shop, pos_discount_only_shop) + spec rápido + integration docker + fixture +
    docs/README/package.json. Evidencia primaria: spec rápido + revert-proof + live safesql PRE/POST en tucson.
  notes: |
    ## Solution understood
    `soi.TOTAL` on an Altru shop merchandise line is the GROSS line total (before discount, before tax). The shop
    money queries used `COALESCE(us.amount_paid_after_discount, soi.TOTAL, 0)` as the NET base, but the per-unit
    `AMOUNTPAID` only exists on lines carrying `SALESORDERITEMMERCHANDISEUNIT` rows — absent on ~99% of merchandise
    lines (Illinois 79,055/79,713; measured 1,822/1,827 on tucson). On those fallback lines the discount was ADDED
    into the amount instead of subtracted, so a $90 item with a $66 discount exported $156 instead of $24. The fix
    introduces two CROSS APPLYs: `ld(total_discount)` (unit-preferring: `COALESCE(us.item_level_discount,
    ids.total_item_discount, 0) + COALESCE(us.order_level_discount, ods.total_order_discount, 0)`) and
    `la(net_amount) = COALESCE(us.amount_paid_after_discount, soi.TOTAL - ld.total_discount, 0)`. The authoritative
    unit-row path is preferred first, so already-correct lines are untouched; the fallback subtracts; and a NULL
    `soi.TOTAL` collapses the middle branch to NULL so the COALESCE lands on 0 rather than exporting a negative.
    `Subtotal_before_discount__c` becomes `net + discount` (= the true gross), `Price_Without_Tax__c` = net, and
    `Tax_Amount__c` / `Amount__c` are recomputed from net. `Item_Price__c` deliberately stays on the gross base —
    the code comments it as "must NOT be pre-netted (IM-809)" because the Veevart Sale Item trigger multiplies it
    by quantity and applies the discount propagated from `POS_Discount__c`. The parent rollup queries
    (`client_purchase.sql`, `sales_order_only_shop.sql`) get the same fallback correction.

    ## Inferred technical tests
    - Fast guard spec (no DB): net base is not the bare gross in the 3 queries; net derived as gross minus line
      discount; NULL gross falls back to 0; Item_Price still derived from gross. -> executable here.
    - Revert-proof: revert the 4 shop .sql to base main and re-run the fast spec -> must FAIL. -> executable.
    - Hand-verified algebra on the SQL (fallback, unit-row, NULL-gross branches). -> executable.
    - Live safesql PRE/POST on a reachable profile: lines with/without unit rows, lines whose amount changes,
      do-no-harm on the unit-row path, negative amounts, the `TOTAL = SUM(AMOUNTPAID) + discounts` identity, and
      merchandise-only order reconciliation vs `SALESORDER.AMOUNT`. -> executable (tucson).
    - Dockerized integration spec (15 tests over a 4-order fixture: order-level discount, item-level + tax,
      unit-row control, no-discount control). -> NOT executable (docker down) -> deferred.

    ## Objective fit
    PRE-fix the fallback treats the gross as net, so every discounted line without unit rows over-reports by the
    discount amount (tucson: 2 such lines, $24 of overstatement; the ticket's Illinois example inflates $24 → $156).
    POST-fix those lines net correctly, the unit-row path is untouched (0 lines changed), no line goes negative,
    the source identity holds with 0 violations, and merchandise-only orders reconcile 100% against SALESORDER.AMOUNT
    (variance $9 → $0). Fast spec 14/14 on the branch, 6/14 FAIL on base. Objective met on all 5 scenarios. 0 defects.

