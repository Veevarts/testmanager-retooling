key: TR-144
title: "TR-144 · IM-1107 · TC-134 · Shop discounts neteados en el fallback sin unit rows (net = soi.TOTAL − descuentos) — 5/5 PASS · 0 defectos · fast spec 14/14 + revert-proof 6/14 FAIL + live safesql tucson (do-no-harm 0, negativos 0, identidad 0 violaciones, reconciliación 1480→1481/1481 y varianza $9→$0) · Item_Price__c sigue gross (IM-809 intacto) · PR MigrationToolETL#155 (OPEN)"

description: |
  QA de IM-1107 (Historia, priority **Crítica**, epic IM-70 Altru Queries). QA Sub-task: IM-1140.
  Account: Illinois Holocaust Museum and Education Center. PR bajo prueba: Veevarts/MigrationToolETL#155
  (OPEN, branch `fix/im-1107-shop-discount-amount-netting`, head `58f6016`, base main; 10 files +1255/-15).

  Clasificación: SQL (4 queries de shop) + query-regression (spec rápido + integration docker + fixture).
  Evidencia PRIMARIA: (1) el spec rápido del dev + revert-proof y (2) safesql live PRE/POST sobre `tucson`
  (agregados numéricos, sin datos row-level). El integration dockerizado (15 tests / 4 órdenes) quedó
  DEFERRED (colima/docker daemon caído) → substituido por el revert-proof + la medición live.

  Root cause: `soi.TOTAL` es el total **GROSS** de la línea (antes de descuento y de impuesto). Las queries
  usaban `COALESCE(us.amount_paid_after_discount, soi.TOTAL, 0)` como base **neta**, pero el `AMOUNTPAID` por
  unidad solo existe en líneas con filas `SALESORDERITEMMERCHANDISEUNIT` — ausente en ~99 % del volumen. En esas
  líneas el descuento terminaba **sumado**: el ítem de $90 con descuento de $66 exportaba $156 en vez de $24.

  El fix: dos `CROSS APPLY` — `ld(total_discount)` y
  `la(net_amount) = COALESCE(us.amount_paid_after_discount, soi.TOTAL - ld.total_discount, 0)`.
  `Subtotal_before_discount__c = net + discount` (= gross), `Price_Without_Tax__c = net`, `Tax_Amount__c` y
  `Amount__c` se recomputan desde el neto. **`Item_Price__c` NO cambia** (sigue derivado del gross): el comentario
  del propio código dice "must NOT be pre-netted (IM-809)" porque el trigger del managed package lo multiplica por
  la cantidad y aplica el descuento propagado desde `POS_Discount__c`. `client_purchase.sql` y
  `sales_order_only_shop.sql` reciben la misma corrección en `subtotal_after_discount`.

  Método QA (clone reusado, checkout del branch; docker no disponible):
  1. Spec rápido `shop-discount-query.spec.ts` → **14/14 PASS** (cubre los 3 queries + fallback NULL→0 + que
     `Item_Price` sigue derivado del gross).
  2. Revert-proof: revertir los 4 `.sql` de shop a base main → el mismo spec da **6/14 FAIL** → guardea el fix.
  3. Álgebra verificada a mano sobre el SQL: fallback con TOTAL=90 y disc=66 ⇒ net=24, subtotal_before=24+66=90
     (gross correcto); con `soi.TOTAL` NULL ⇒ `NULL - disc` colapsa a NULL y el COALESCE cae a 0 (comportamiento
     pre-fix, nunca negativo).
  4. safesql `tucson` (agregados): replicando los CTEs del query medí PRE vs POST sobre las 1,827 líneas de
     merchandise + la reconciliación de las 1,481 órdenes merchandise-only contra `SALESORDER.AMOUNT`.
  5. Tech regression `test:queries` 303 pass / 57 skip / 0 fail; `lint:check` y `build` OK. Security + OWASP.

  Resultado: 5/5 PASS, 0 defectos. Los 4 invariantes críticos dieron **0 violaciones** en vivo (do-no-harm sobre
  el path unit-row, ninguna línea negativa, identidad `TOTAL = SUM(AMOUNTPAID)+descuentos`, gross NULL→0) y la
  reconciliación de órdenes llegó al **100 %** con varianza **$0**. Observaciones reportadas sin inflar: el cliente
  del ticket (`illinois_2`) NO es alcanzable, `tucson` no está en la lista de profiles que el PR auditó, y la suite
  completa dio 303 pass vs los 300 que reporta el PR.

