title: "TR-140 · IM-1083 · TC-130 · IC 3.04 My Domain + Admin User + Permission Sets (v2→v3, low-confidence) — 7/7 PASS · 0 defectos · license-aware permset assign (dynamic PSL detection + DEFER-not-fail with NON-license-still-fails symmetry) + org-agnostic rename + 2 MANUAL handoffs · CODE PR spec-only (reused T3 clonePermissionSet + T6) #255@2271ff0f"

description: |
  QA de IM-1083 (Historia, priority Medium/low-confidence, epic IM-735 Implementation Cases Automation).
  QA Sub-task: IM-1135. PR bajo prueba: Veevarts/MigrationAppBackend#255 (CODE PR spec-only, 2 files +183/-8,
  MERGED, merge 2271ff0f, base 1552e7a7).

  IC 3.04 v3 (hybrid, 6 steps: 4 AUTOMATED + 2 MANUAL): step1 T6 rename admin user (org-agnostic, Username-
  targeted); steps2-3 T3 clonePermissionSet (Auctifera__Veevart→Veevart2, vnfp__Veevart_Non_For_Profit→
  Veevart_NonProfit2); step4 T6 LICENSE-AWARE assign; step5 MANUAL license handoff; step6 MANUAL My Domain.
  El endurecimiento v2→v3 vive todo en el step4 (op T6 REUSADO): detecta la Veevart PermissionSetLicense
  dinámicamente (lee el LicenseId del managed source de cada clone → query PermissionSetLicense status/seats),
  asigna cada clone en su propio Database.insert(allOrNone=false) batch (idempotente), DEFIERE (log, NO throw)
  cualquier clone rechazado por license al MANUAL step5 (step COMPLETES), y verifica cobertura SOLO sobre los
  clones licensed. Simetría crítica: un error NO-license (per-record o abort de batch DmlException) SÍ hace
  throw → step FAILED. Nunca enmascara fallas reales como handoff.

  Método QA (reuso del clone; checkout 2271ff0f; deps válidas — package files unchanged 2271ff0f..5f1fdd1d):
  1. Independent spec-fidelity + apex read: parse de los 6 steps + lectura a mano del apex del step1 (rename) y
     del step4 (license-aware assign) — detección dinámica de PSL, ramas defer(license)/throw(non-license),
     verify scoped a licensed clones, idempotencia — no solo el lockstep ni el PR body.
  2. op-reuse audit: base..merge = 2 files (spec + spec.ts), 0 adapters → T3 clonePermissionSet (2 non-spec
     files @base) + T6 reused, NO genuinely-new.
  3. no-callout proof: el step4 apex no contiene '/services/data' ni 'HttpRequest' (pure DML), asertado por el spec.ts.
  4. jest (3.04 lockstep+license-aware/defer contract + ic-seeds validity + CLI + full), tsc --noEmit, eslint touched.

  Resultado: 7/7 PASS. 0 defectos. Rama license-ABSENT dev-proven en CamiloDevOrg (Auctifera__Veevart declara no
  PSL; vnfp__Veevart_Non_For_Profit requiere una PSL no provisionada → ambos clones DEFER, step COMPLETES sin
  fallar). El path LICENSED (auto-assign donde la license SÍ está, AC1) NO es observable en un dev-org sin la
  Veevart license — el ticket pide verificarlo en un customer-like org → PENDING-CREDS, code-proven por lectura;
  v3 seed a MigrationApp-dev PENDING (AWS SSO). No PASS/FAIL prematuro.

