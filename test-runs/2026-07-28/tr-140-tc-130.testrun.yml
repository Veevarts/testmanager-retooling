environment:
  name: "MigrationAppBackend @ merge 2271ff0f (base 1552e7a7) · node v25.4.0 · CamiloDevOrg live dev-proven (license-absent DEFER branch) · licensed path PENDING-CREDS · MigrationApp-dev seed PENDING"
  url: "https://github.com/Veevarts/MigrationAppBackend/pull/255"
  buildVersion: >-
    CODE PR spec-only (reused T3 clonePermissionSet + T6 anon apex, NOT genuinely-new). 2 files (+183/-8): IC 3.04
    spec v2->v3 + a new 155-line lockstep/license-aware-contract test. HYBRID: 4 AUTOMATED + 2 MANUAL. The v3
    hardening is all inside the step-4 T6 apex (dynamic PermissionSetLicense detection + defer-not-fail). Tier low-confidence.
  notes: |
    ## Solution understood
    IC 3.04 provisions My Domain, renames the Veevart admin user, clones the managed Veevart / Veevart Non For Profit
    permission sets, and assigns them to all active users. The gap this PR hardens: the assign step is license-gated —
    a dev org's users lack the Veevart permission-set license, so PermissionSetAssignment REJECTS the assignment. v2
    would fail; v3 makes step 4 LICENSE-AWARE. It (a) reads each clone's managed source permset LicenseId and queries
    that PermissionSetLicense's status/seats in the running org (dynamic detection, no hardcoded id, logged), (b)
    assigns EACH clone in its own Database.insert(allOrNone=false) batch (idempotent via an 'existing' set; per-clone
    isolation avoids managed-trigger partial-save aborts), (c) DEFERS to the companion MANUAL handoff (step 5) any
    clone whose assignment is rejected for a license reason — logged, never thrown, so the step COMPLETES on a dev org
    — and (d) verifies coverage ONLY for the clones that actually assigned (licensed). Crucially the defer is narrowly
    license-gated: a non-license per-record error throws, and the batch-level catch(DmlException) re-throws unless the
    abort message is license-worded — so real failures are never masked as a handoff. Step 1 (rename) is org-agnostic
    (targets by {{adminUsername}}, sets FirstName='Admin'/LastName='Veevart for '+{{clientName}}/Nick='Veevart',
    idempotent + verify). Steps 5 (license handoff) and 6 (My Domain, no API path per rules §11) stay MANUAL.

    ## Inferred technical tests
    - Independent spec-fidelity: parse the 6 v3 steps (order + kind + tools T6/T3/T3/T6/MANUAL/MANUAL).
    - Adapter/apex code review by hand of step 1 (rename) and step 4 (license-aware assign): dynamic PSL detection,
      defer(license) vs throw(non-license) branches, verify scoped to licensed clones, idempotency, no callout.
    - op-reuse audit: base..merge = 2 files (spec .json + .spec.ts), 0 adapters -> T3 clonePermissionSet (2 non-spec
      files @base) + T6 reused, NOT genuinely-new.
    - jest as PRIMARY code evidence: the 3.04 spec.ts (8, incl. the regex asserting the non-license catch re-throws);
      ic-seeds validity + publish CLI (101); tsc --noEmit; eslint touched; full suite (1916/1917, 0 fail).

    ## Objective fit
    The hardening is correct: the license is detected dynamically (no hardcoded id), a missing license DEFERS instead
    of failing (dev-proven on CamiloDevOrg — both clones defer, step completes), a genuine non-license failure still
    fails the step (symmetry preserved), the coverage verify only asserts licensed clones, and the manual handoffs
    (license + My Domain) are structured. No live IE run (v3 seed PENDING; licensed auto-assign path needs a
    customer-like org with the Veevart license) — documented dev-proven / PENDING-CREDS, never PASS/FAIL early.
    7/7 PASS, 0 defects.

