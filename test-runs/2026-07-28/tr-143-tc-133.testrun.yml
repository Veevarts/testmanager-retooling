  name: "MigrationToolETL @ PR #154 head 53177ba (branch fix/membership-program-lookup-IM-1106, base main) · node v25.4.0 · safesql profile tucson (live Altru replica, aggregate-only) · illinois_2/aspen sin túnel · NO existe profile longisland · docker/colima DOWN → integration deferred"
  url: "https://github.com/Veevarts/MigrationToolETL/pull/154"
  buildVersion: >-
    SQL + query-regression (dev category), source-side Altru. 10 files +976/-5: 4 .sql (3 con cambio real de una
    línea + 1 solo comentario de grain) + spec estático + integration docker + fixture + README/docs/package.json.
    Evidencia primaria: spec estático catalog-wide + revert-proof + live safesql PRE/POST en tucson.
  notes: |
    ## Solution understood
    `membership_program.sql` emits one Membership Program per MEMBERSHIPLEVELTERM, keyed "<term owner level>-<term>"
    (its FROM is `MEMBERSHIPLEVEL ml JOIN MEMBERSHIPLEVELTERM term ON term.LEVELID = ml.ID JOIN MEMBERSHIPPROGRAM p`),
    so the key is functionally determined by the term alone. Altru, however, lets a MEMBERSHIPTRANSACTION /
    SALESORDERITEMMEMBERSHIP record a MEMBERSHIPLEVELID that is NOT the level owning the referenced term (a historical
    level rebuild inside the same program). The consumers built the composite key from that transaction level
    (`ml.ID`, joined on `mt.MEMBERSHIPLEVELID = ml.ID`), producing an id no Membership Program row carries — so the
    mandatory `vnfp__Membership_Program__c` lookup imported as N/A and blocked the Membership Opportunity and POS
    loads. The fix anchors the key on `mlt.LEVELID` (the term owner) in all four keyed projections. It is a no-op
    whenever the pair is consistent (a program row only exists when `term.LEVELID` = level id), so only the
    cross-level historical rows move; descriptive fields (Name, Program_Name__c, vnfp__Membership_Price__c) and the
    row-inclusion gates are untouched, so dependents keep the same inputs.

    ## Inferred technical tests
    - Static catalog-wide spec (no DB): every `vnfp__Membership_Program__c` projection is term-anchored; rejects the
      original `ml.ID` bug; both membership_transactions branches. -> executable here.
    - Revert-proof: revert the 3 .sql to base main and re-run the static spec -> must FAIL. -> executable.
    - Scope-fit grep: enumerate ALL projections of the field to prove no consumer was left behind. -> executable.
    - Live safesql PRE/POST on a reachable profile: unresolved keys pre vs post, cross-level pairs, cross-PROGRAM
      pairs (the re-parenting risk), orphan terms (the premise of the fix), POS regression. -> executable (tucson).
    - Dockerized integration spec (cross-level MT + order-backed scenarios). -> NOT executable (docker down) -> deferred.

    ## Objective fit
    PRE-fix the key is built from the transaction level, so a cross-level row emits an id that no program carries
    (tucson: 1 unresolved of 122,668; longisland reportedly 225). POST-fix every key is term-anchored and 0 rows are
    unresolved, while POS stays at 0/0 (no regression), no cross-level pair crosses MEMBERSHIPPROGRAMID (0 re-parenting),
    and 0 terms lack an owner level (so `mlt.LEVELID` never dangles — the premise holds). Static spec 9/9 on the branch,
    5/9 FAIL on base. Objective met on all 5 scenarios. 0 defects.

