key: TR-143
title: "TR-143 · IM-1106 · TC-133 · Membership Program lookup anclado en MEMBERSHIPLEVELTERM.LEVELID (term owner) en vez del level de la transacción — 5/5 PASS · 0 defectos · static spec 9/9 + revert-proof 5/9 FAIL + live safesql tucson (unresolved 1→0, cross_program 0, orphan_terms 0) + POS sin regresión · PR MigrationToolETL#154 (OPEN)"

description: |
  QA de IM-1106 (Historia, priority **Crítica**, epic IM-70 Altru Queries). QA Sub-task: IM-1139.
  Account: Long Island Children's Museum. PR bajo prueba: Veevarts/MigrationToolETL#154 (OPEN, branch
  `fix/membership-program-lookup-IM-1106`, head `53177ba`, base main; 10 files +976/-5).

  Clasificación: SQL (4 queries, ediciones de una línea) + query-regression (spec estático catalog-wide +
  integration dockerizado + fixture). Evidencia PRIMARIA: (1) el spec estático del dev + revert-proof y
  (2) safesql live PRE/POST sobre `tucson` (agregados numéricos, sin datos row-level). El integration
  dockerizado quedó DEFERRED (colima/docker daemon caído) → substituido por el revert-proof + el live.

  Reinterpretación del scope (VALIDADA por QA): el ticket pedía "identificar los Membership Programs
  faltantes y agregarlos al query". La premisa del PR — que los programas NO faltan y que lo roto es la
  construcción de la clave — quedó CONFIRMADA en vivo: en tucson `membership_program.sql` emite 57 claves
  y hay 0 MEMBERSHIPLEVELTERM sin level dueño; la fila que no resolvía lo hacía porque su clave se armaba
  con el level de la transacción (cross-level), no porque faltara el programa.

  Root cause: `membership_program.sql` emite una fila por MEMBERSHIPLEVELTERM con clave "<term owner level>-<term>"
  (join `term.LEVELID = ml.ID`). Altru permite que MEMBERSHIPTRANSACTION / SALESORDERITEMMEMBERSHIP registren un
  MEMBERSHIPLEVELID que NO es el level dueño del term (rebuild histórico de level dentro del mismo programa). Los
  consumidores armaban la clave con ese level de la transacción → id que ninguna fila de programa tiene → el lookup
  mandatorio `vnfp__Membership_Program__c` importaba como N/A y bloqueaba Membership Opportunities y POS.

  El fix: `CAST(mlt.LEVELID ...) + '-' + CAST(mlt.ID ...)` en los 4 puntos de proyección con clave
  (membership_transactions.sql ×2 ramas, all_recurring.sql, recurring_membership.sql). No-op cuando el par es
  consistente; solo se mueven las filas cross-level. Campos descriptivos y gates de inclusión intactos.

  Método QA (clone reusado, checkout del branch del PR; deps válidas — package.json solo agrega el nuevo spec
  al script docker):
  1. Spec estático catalog-wide `membership-program-linkage-query.spec.ts` → 9/9 PASS.
  2. Revert-proof: revertir los 3 `.sql` a base main → el mismo spec da 5/9 FAIL → guardea el fix.
  3. Scope-fit por grep: 6 proyecciones de `vnfp__Membership_Program__c` — 4 con clave (todas term-anchored) y
     2 NULL (`recurring_donation.sql` y la rama de donaciones de `all_recurring.sql`, que no son de membresía) →
     ningún consumidor quedó sin arreglar.
  4. safesql `tucson` (agregados): reconstruí el set de claves emitidas por `membership_program.sql` y conté,
     sobre MEMBERSHIPTRANSACTION y SALESORDERITEMMEMBERSHIP, las claves PRE (level de txn) vs POST (term owner)
     que no resuelven, los pares cross-level, los cross-PROGRAM y los terms huérfanos.
  5. Tech regression: `test:queries` 303 pass / 46 skip / 0 fail. Lint limpio. Security + OWASP.

  Resultado: 5/5 PASS, 0 defectos. Match EXACTO con el dev en tucson (1 fila unresolved pre-fix, 1 par cross-level).
  Observaciones reportadas sin inflar: el PR dice "5 of 8 profiles" pero enumera 4; y longisland (225 filas, el caso
  del ticket) NO es verificable en vivo porque no existe ese profile safesql.

