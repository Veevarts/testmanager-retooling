description: |
  QA de IM-1082 (Historia, priority Medium/medium-confidence, epic IM-735 Implementation Cases
  Automation). QA Sub-task: IM-1136. PR bajo prueba: Veevarts/MigrationAppBackend#254 (CODE PR
  spec-only, 2 files +34/-7, MERGED, merge 1552e7a7, base 545e2cb0 = IM-1081 #253).

  IC 3.12 v11 (hybrid, 7 steps: 3 AUTOMATED T6 + 4 MANUAL). caseId company-info-and-mock-contact.
  El cross-version re-run en CamiloDevOrg NO surfaceó drift; v11 endurece 2 superficies static para
  volver el caso org-agnostic entre versiones de package:
  1. Company Info (step 1): los optional managed fields se escriben vía DESCRIBE-GUARDED dynamic put
     (getDescribe().fields.getMap() + isUpdateable() + co.put) — un field ausente/renombrado se logea
     y se salta, ya no rompe el COMPILE del anon-block (v10 usaba static `co.Auctifera__Website__c=`).
     Anchors de identidad (Name, Primary_Company__c) siguen static; required Name siempre se setea.
  2. NPSP rollups (step 7): per-version absence TOLERADA — un DeveloperName ausente se logea+skip
     (v10 hacía `throw 'precondition failed'`). present+enabled → 18/18 success; disabled → async CMDT
     deploy (Metadata.Operations.enqueueDeployment).
  Steps 2/3/4/6 MANUAL (Lightning page/Manage Files, logo, Veevart File layout, fiscal-year Setup) con
  guides estructuradas; fiscal-year sigue manual (FiscalYearStartMonth read-only vía API). Step 5 mock
  Contact idempotente (Description describe-guarded — el patrón que step 1 ahora replica).

  Método QA (reuso del clone; checkout 1552e7a7; deps válidas — package files unchanged 1552e7a7..2271ff0f):
  1. Independent spec-fidelity + apex read: parse de los 7 steps + lectura a mano del apex de los steps 1
     (Company Info v11), 5 (mock Contact) y 7 (NPSP rollups v11) + las 4 guides MANUAL — dynamic put guarded,
     tolerate-absence, no static ref, no callout — no solo el lockstep ni el PR body.
  2. op-reuse audit: base..merge = 2 files (spec + spec.ts), 0 adapters → T6 reused, NO genuinely-new.
  3. no-callout proof: cada step T6 es pure Apex (spec.ts asserts; verificado step1/step7 sin /services/data ni HttpRequest).
  4. jest (3.12 lockstep + describe-guarded put + tolerate-absence + pure-Apex + ic-seeds validity + full), tsc --noEmit, eslint touched.

  Resultado: 5/5 PASS. 0 defectos. Live dev-proven en CamiloDevOrg (org 00Dfj00000QJMx7EAH, vía sf-CLI
  anonymous Apex porque AWS SSO expiró → run-plan-local CLI no bootea Secrets Manager): 18/18 rollups
  present+enabled, dynamic company put escribió website/telephone, mutaciones de test limpiadas. v11 NO
  seeded a MigrationApp-dev (seed PENDING) → documentado dev-proven/PENDING-CREDS, no PASS/FAIL prematuro.

