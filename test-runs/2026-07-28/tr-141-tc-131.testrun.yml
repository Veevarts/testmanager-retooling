  buildVersion: >-
    CODE PR spec-only (reused T6 anon apex, NOT genuinely-new). 2 files (+34/-7): IC 3.12 spec v10->v11 +
    the lockstep/hardening test. HYBRID: 3 AUTOMATED T6 + 4 MANUAL. v11 hardens two static surfaces
    (describe-guarded dynamic put for optional Company Info fields; NPSP rollups tolerate per-version
    absence) so the flagship case is org-agnostic across package versions. Tier medium-confidence.
  notes: |
    ## Solution understood
    IC 3.12 (company-info-and-mock-contact) is the flagship demo case: it seeds the primary Company Information
    record, a mock anonymous Contact, and enables 'Use Fiscal Year' on the 18 NPSP rollups, interleaved with four
    MANUAL handoffs (Lightning page/Manage Files component + org-default record page, logo upload, Veevart File
    layout fields, fiscal-year Setup). The cross-version re-run on CamiloDevOrg surfaced no drift, but v11 hardens
    the two remaining hardcoded surfaces so the case is org-agnostic across package versions. (1) The optional
    managed Company Information fields (website, telephone, address, city, state, postal code, country) are now
    written via a describe-guarded dynamic put: a Map<String,String> of field API name -> value, and for each
    non-blank value it looks up the token in SObjectType.getDescribe().fields.getMap(), checks isUpdateable(), and
    co.put(tok, value) — else logs WARN and skips. A field absent/renamed in a package version can no longer break
    the anonymous-block COMPILE (the prior "Field does not exist: Description" class of bug); the identity anchors
    (Name, Auctifera__Primary_Company__c) stay static and the required company Name is always set. (2) The NPSP
    rollups step now TOLERATES per-version absence: an absent DeveloperName is logged and skipped, not a thrown hard
    precondition — only present-but-disabled rollups get the asynchronous CMDT deployment. Mock Contact (step 5,
    untouched) already used the same describe-guarded pattern for Description.

    ## Inferred technical tests
    - Independent spec-fidelity: parse the 7 v11 steps (3 T6 + 4 MANUAL), strictly ordered 1..7.
    - Adapter/apex code review by hand of steps 1 (Company Info v11), 5 (mock Contact), 7 (NPSP rollups v11):
      describe-guarded dynamic put, tolerate-absence, no static ref, no callout; + the 4 MANUAL guides.
    - op-reuse audit: base..merge = 2 files (spec .json + .spec.ts), 0 adapters -> T6 reused, NOT genuinely-new.
    - jest as PRIMARY code evidence: the 3.12 spec.ts (8, incl. describe-guarded put + tolerate-absence + pure-Apex);
      ic-seeds validity + publish CLI (101); tsc --noEmit; eslint touched; full suite (1908/1909, 0 fail).

    ## Objective fit
    The hardening is correct: the optional Company Info fields are written org-agnostically via a describe-guarded
    dynamic put (absent/renamed skipped, no compile break), the NPSP rollups tolerate per-version absence (log+skip,
    not a hard precondition), the required Name/Primary anchor stay static, the manual handoffs remain structured
    guides, and every T6 step stays pure Apex. No live IE run (v11 seed PENDING; live dev-proven on CamiloDevOrg,
    18/18 rollups present+enabled) — documented dev-proven / PENDING-CREDS, never PASS/FAIL early. 5/5 PASS, 0 defects.

