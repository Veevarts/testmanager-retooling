key: TR-142
title: "TR-142 · IM-1067 · TC-132 · Altru Partial + Account Soft Credit resolve npsp__Opportunity__r via ranked candidate gated against emitted Opportunity ids (not the raw payment id) — 5/5 PASS · 0 defectos · SQL-contract 27/27 + revert-proof 20/27 FAIL + live safesql tucson PRE/POST (eff95544 cleared) · PR MigrationToolETL#153 (OPEN)"

description: |
  QA de IM-1067 (Historia, priority High, epic IM-70 Altru Queries). QA Sub-task: IM-1137. Escalamiento del
  comentario no atendido en IM-707 (Tucson Botanical Gardens). PR bajo prueba: Veevarts/MigrationToolETL#153
  (OPEN, branch fix/soft-credit-opportunity-external-id-IM-1067 → main; 6 files +1209/-71).

  Clasificación: SQL + query-regression (source-side Altru queries). Evidencia PRIMARIA: (1) el SQL-contract spec
  del dev + (2) safesql live PRE/POST sobre tucson (agregados numéricos, sin datos row-level en el chat). El docker
  integration suite quedó DEFERRED (colima/docker daemon caído) → substituido por el revert-proof a nivel contract.

  Root cause (del PR): ambos queries emitían el FINANCIALTRANSACTIONID crudo de la recognition como external ID de
  npsp__Opportunity__r; esa txn suele ser un pago (pledge/MG/recurring installment) que el Opportunity load nunca
  crea → un solo FK irresoluble rechazaba TODO el CSV. El fix resuelve por candidato rankeado (rank1 propia txn
  do-no-harm; rank2 recurring installment; rank3 pledge/MG via INSTALLMENTSPLITPAYMENT tiebreak por SUM(AMOUNT);
  rank4 pledge via SOURCELINEITEMID), gateado (INNER JOIN OpportunityExternalIds = donation_transaction.sql
  SUM(NetAmount)<>0 + donation_pledges.sql TYPE='Pledge'); ROW_NUMBER()=1 → 1 fila/recognition; sin candidato →
  dropeada (npsp__Opportunity__c nillable=false).

  Método QA:
  1. SQL-contract spec (soft-credit-recognition-query.spec.ts) en el branch → 27/27 PASS.
  2. Revert-proof: checkout de los 2 .sql a base main (emiten ft.ID crudo) → contract spec 20/27 FAIL (incl.
     "never emits the raw financial transaction id" + "gates the FK on ids the Opportunity load emits") → el spec
     guardea el fix. (Más fuerte que el claim del dev "revert → 5/8 integration fail", hecho a nivel contract sin docker.)
  3. safesql tucson (agregados): wrapper que reusa los CTEs del query (OpportunityExternalIds, ResolvedRecognition-
     Opportunity) reemplazando solo la proyección por COUNT/SUM + LEFT JOIN. POST-fix Partial: scoped 1,793 /
     resolved 1,740 / dropped 53 / rescued 183 / eff95544-emitido-como-Opp 0 / distinct opps 1,507. Account idéntico.
     PRE-fix repro: 3,517 own-txn ids NO son Opportunity (FK rotos) + eff95544 presente como own-txn en scope (1).
  4. Tech regression: full query-regression suite 308 pass / 44 skip / 0 fail (sin colateral). Security: sin secrets,
     sin dynamic-SQL/concat (date filters parametrizados). OWASP: A03 Applicable→PASS, resto N/A, 0 High/Critical.

  Resultado: 5/5 PASS, 0 defectos. Reconciliación honesta: los conteos absolutos de Tucson obtenidos (1,793/1,740/53/183)
  difieren de la auditoría del PR (2,138/2,076/62/213) pero la TASA de resolución coincide (97.0% vs 97.1%) y el
  mecanismo es idéntico — consistente con drift del replica live de Altru entre la auditoría del PR y esta corrida.
  Reporto lo obtenido, no afirmo match exacto.

