environment:
  name: "MigrationToolETL @ PR #153 head 16b10d5 (branch fix/...-IM-1067, base main) · node v25.4.0 · safesql profile tucson (live Altru replica, aggregate-only) · docker/colima DOWN → integration suite deferred"
  url: "https://github.com/Veevarts/MigrationToolETL/pull/153"
  buildVersion: >-
    SQL + query-regression (dev category), source-side Altru soft-credit queries. 6 files +1209/-71 (2 .sql +
    fixture/spec/integration-spec + docs). Primary evidence: SQL-contract spec (27/27) + contract-level revert-proof
    (base main 20/27 FAIL) + live safesql aggregate PRE/POST on tucson. Docker integration suite DEFERRED (colima down).
  notes: |
    ## Solution understood
    Both soft-credit queries emitted the recognition's own FINANCIALTRANSACTIONID as the npsp__Opportunity__r external
    id. That transaction is frequently a payment (pledge/matching-gift/recurring-installment) that donation_transaction.sql
    never turns into an Opportunity (a pledge payment line carries APPLICATION='Pledge', which is not a donation line),
    so a single unresolvable foreign key rejected the ENTIRE soft-credit CSV. The fix resolves npsp__Opportunity__r
    through a ranked candidate list (rank1 = own txn, do-no-harm; rank2 = recurring installment; rank3 = pledge/MG claim
    via INSTALLMENTSPLITPAYMENT with a SUM(AMOUNT) tiebreak; rank4 = pledge via SOURCELINEITEMID), gated by an INNER JOIN
    against the set of Opportunity external ids the migration actually emits (donation_transaction.sql SUM(NetAmount)<>0 +
    donation_pledges.sql TYPE='Pledge'). ROW_NUMBER()=1 keeps one row per recognition; a recognition with no surviving
    candidate is dropped (npsp__Opportunity__c is nillable=false). It also adds ISCONSTITUENT=1 to match contact.sql.
    Output columns/headers unchanged → mapper/pipeline untouched.

    ## Inferred technical tests
    - SQL-contract spec (no DB): assert no raw txn id as FK, gate parity with donation_transaction.sql, rank ordering,
      byte-identical prelude across the 2 queries, ISCONSTITUENT parity, row grain. -> executable here.
    - Revert-proof: revert the 2 .sql to base main and re-run the contract spec -> must FAIL (guards the fix). -> executable.
    - Docker integration spec (per-lineage mapping via testcontainers MSSQL). -> NOT executable (docker down) -> deferred.
    - Live safesql PRE/POST aggregate on a reachable profile (tucson): resolved/dropped/rescued/escalation counts,
      bijection by construction, reproduce eff95544. -> executable (aggregate-only, numeric).

    ## Objective fit
    PRE-fix the queries emit the raw payment id (3,517 own-txn ids on tucson are not Opportunities; eff95544 is one of
    them) → the whole CSV fails. POST-fix every emitted FK resolves to an emitted Opportunity (bijection by the INNER
    JOIN gate; eff95544 emitted-as-Opportunity = 0), the already-correct rows keep their own Opportunity (1,557 of 1,740
    resolved kept rank1), the broken rows are rescued (183) or dropped (53), one row per recognition. Contract spec 27/27
    on the branch, 20/27 FAIL on base main. Objective met on all 5 scenarios. 0 defects.

