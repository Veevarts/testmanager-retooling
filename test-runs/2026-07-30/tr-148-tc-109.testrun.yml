results:
  - scenarioIndex: 1
    scenarioTitle: 'IM-1099 AC1 + AC4 — The "When to show" form offers Start Date and interaction-based options, the legacy counter-equals-a-specific-use option is gone, and selecting one-time disables the contradictory frequency inputs'
    testCaseId: ff9e52bd-404d-4fee-bd10-6b4cd0d076bc
    testCaseKey: TC-109
    status: passed
    executedAt: "2026-07-30T23:05:00Z"
    duration: 20
    actual: |
      **AC1 — lo que el bloque ofrece.** El formulario real presenta `When to show it` con `Start Date`
      y exactamente DOS radios de disparo: *Immediately on the first eligible interaction* (por
      defecto) y *After N interactions*.

      **AC1 — la mitad que se verifica por AUSENCIA.** La opción vieja de *contador igual a un número
      específico de usos* NO aparece en el formulario: `counterEqualsInFormScope = false`, medido
      sobre el DOM acotado ESTRICTAMENTE al `<form>`. El matiz importa y por poco genera un falso
      positivo: la cadena *"exactly at N interactions"* SÍ existe en la página, pero en el LISTADO
      de surveys que queda detrás del modal — es el formateador de surveys legacy
      (`SurveysPage.tsx:525`). Buscando en toda la página daba positivo; acotando al formulario se
      confirma la ausencia real. Respaldo en el código: el form sólo puede escribir
      `triggerType: form.triggerType === "counter" ? "counter" : null`. `counter_equals` sobrevive
      sólo para leer las 4 surveys legacy del entorno (ids 2, 3, 4, 5). Opción retirada de la UI,
      compatibilidad preservada.

      **AC4.** Primero lo que NO ocurre, para no reportarlo mal: al elegir `One time`, los tres inputs
      numéricos (Max dismissals, Tries between shows, Max shows per day) NO quedan `disabled`. Eso no
      es un fallo, porque no son incompatibles con "una sola vez" — el propio texto de ayuda explica
      cómo se reinterpretan (*"With One time or a 0-day custom window, the limit is all-time"*).

      El control realmente incompatible es la LONGITUD de la ventana de repetición, y ese SÍ se
      oculta. Barrido observado: `Custom` → el input de días se renderiza; `One time` → NO;
      `Quarterly` → NO; de vuelta a `One time` → NO. Además, elegir `One time` fuerza
      `onePerRespondent: true` y LIMPIA `cooldownDays`. Es imposible configurar a la vez "una sola
      vez" y "una ventana de repetición", que es lo que el AC pide evitar.
    notes: "AC1 + AC4. Lo más valioso acá fue acotar el DOM al formulario: buscar en toda la página habría reportado como presente una opción que en realidad sólo aparece en el listado de surveys legacy."
