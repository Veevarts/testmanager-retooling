  - scenarioIndex: 2
    scenarioTitle: "IM-1099 AC2 + AC3 — A survey with a future Start Date is never eligible, and once the Start Date has passed it becomes eligible as soon as the interaction condition is met and the remaining rules allow it"
    testCaseId: ff9e52bd-404d-4fee-bd10-6b4cd0d076bc
    testCaseKey: TC-109
    status: passed
    executedAt: "2026-07-30T23:10:00Z"
    duration: 15
    actual: |
      Barrido sobre el límite usando el **override de fecha del endpoint admin** (`?today=`), que
      permite mover el reloj de la eligibility sin esperar al calendario y **sin modificar ninguna
      survey**. Sujeto: survey 1 (Rentals, activa, `triggerDate = 2026-07-30`), respondent aislado,
      `usageCount=10` para que las demás reglas pasen.

      | today | ¿elegible? | lectura |
      |---|---|---|
      | 2026-07-25 | NO | 5 días antes |
      | 2026-07-29 | NO | el día ANTERIOR — el corte es acá |
      | **2026-07-30** | **SÍ** | EL DÍA del Start Date (el gate es INCLUSIVO) |
      | 2026-07-31 | SÍ | día siguiente |
      | 2026-08-05 | SÍ | una semana después |

      Corte exacto, y el día del Start Date cuenta como válido. **AC2** (fecha futura → nunca
      elegible) y **AC3** (fecha cumplida + condición de interacciones → elegible) verificados sobre
      el mismo sujeto en el mismo barrido.

      **El gate es duro y ANTERIOR** (`surveyRuntime.ts:203-205`): se evalúa antes de triggerType,
      frecuencia, dismissals y espaciado. Por más que todo lo demás pase, la fecha manda primero —
      que es literalmente lo que el AC2 exige. **Fail-closed** confirmado: con `triggerType="date"`
      y sin fecha devuelve `trigger_date_missing`; ante una fecha no parseable
      `toSurveyDeliveryContext` cae al día del servidor en vez de aceptar basura. En ningún caso
      entrega por defecto.

      Revert-proof: caen *blocks immediate surveys before Start Date*, el rollup
      *evaluateSurveyEligibility — start date and interactions* y el test nuevo del PR #30
      *shows immediate surveys on the first eligible interaction once Start Date is reached*.
    notes: "AC2 + AC3. El override de fecha del endpoint admin fue el lever que permitió probar esto en vivo en vez de dejarlo a la suite."
    stepResults: []
    attachments:
      - name: ac2-ac3-start-date-gate.txt
        path: attachments/tr-148-tc-109/scenario-2/ac2-ac3-start-date-gate.txt
        mimeType: text/plain

  - scenarioIndex: 3
    scenarioTitle: "IM-1099 AC5 — Max dismissals per period stops the survey once the limit is reached, and the next period resets the dismissal window"
    testCaseId: ff9e52bd-404d-4fee-bd10-6b4cd0d076bc
    testCaseKey: TC-109
    status: passed
    executedAt: "2026-07-30T23:45:00Z"
    duration: 20
    actual: |
      **Mitad 1 — el límite: ejercitada EN VIVO.** Sujeto: survey 27 (`maxDismissals=2`,
      `cooldownDays=90`), creada sobre el subject *Test QA*, el único sin survey asociada (el
      servidor impone una survey por subject: intentar una segunda en Accounting devolvió 409).
      Todas las llamadas de dismissal se hicieron **anónimas**, así que la misma secuencia sirve de
      evidencia del AC15:

      | Paso | HTTP | ¿elegible después? |
      |---|---|---|
      | estado inicial (0 dismissals) | — | SÍ |
      | POST dismissals #1 | 201 | SÍ (1 < 2) |
      | POST dismissals #2 | 201 | **NO — límite alcanzado** |

      El servidor nombra la razón exacta, no hay que inferirla:
      `eligible:false · reason: "max_dismissals_reached"`, con
      `counters: {dismissalCount: 2, dismissalCountAllTime: 2}`.

      **Mitad 2 — el reset de período: NO ejercitada en vivo, y se declara.** Depende del paso del
      tiempo real (30/90/180/365 días) y no es observable en una ventana de ejecución. Lo que sí se
      verificó es el MECANISMO, leyendo el código (`features.ts:155-169`): el conteo filtra por
      `dismissedAt >= datetime('now', '-N days')`, así que los dismissals viejos salen de la ventana
      y el respondent vuelve a ser elegible; sin cooldown configurado el conteo es all-time.

      **Matiz para producto:** el reset está implementado como **ventana deslizante** (últimos N días
      respecto de ahora), no como corte de período calendario. El AC dice *"until the next period
      resets the dismissal window"*, que podría leerse como un período fijo. El comportamiento
      satisface la intención —el respondent se recupera pasados N días— pero no hay un instante de
      "inicio de período" común: cada uno se recupera N días después de SU propio dismissal. No es
      defecto; es una decisión de diseño que conviene dejar explícita.

      Por qué no se pudo forzar: el override `?today=` mueve el reloj de la eligibility pero la
      ventana de dismissals usa `datetime('now')` de SQLite, que el override no toca. Verificado
      leyendo `features.ts:164`, no supuesto.

      **Default con consecuencias** (`surveyRuntime.ts:254`): para una General, dejar `maxDismissals`
      vacío hace que UN solo dismissal la oculte. Está declarado en el texto de ayuda del formulario.
    notes: "AC5. PASS con alcance declarado: el límite se verificó en vivo con razón exacta; el reset se cubre por código y suite y se DECLARA como no ejercitado, no se finge."
