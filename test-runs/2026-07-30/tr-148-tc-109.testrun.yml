environment:
  name: "survey-tool @ epic/nps-survey-delivery-and-metrics head 14bde9d2 (base 737a62b6) desplegado en https://surveytool.dev.veevart.ai · node test runner (tsx --test) para server/ y client/ · scratch org Auctifera nps_2 = computing-power-944-dev-ed namespace Auctifera (EXPIRA 2026-07-31) · scratch org NFPFundraising vnfp_pkg = flow-site-19432-dev-ed (expira 2026-08-14) · admin del survey-tool vía Cognito Hosted UI (Google @veevart.com)"
  url: "https://github.com/Veevarts/survey-tool/pull/34"
  buildVersion: >-
    Mixed (backend/service Node+TS+Express con SQLite/drizzle + UI de admin React + launchers
    Salesforce Aura/LWC en dos namespaces). Seis PRs de survey-tool entre 737a62b6 y 14bde9d2,
    confirmados uno a uno con git log. Superficie funcional: server/src/lib/surveyRuntime.ts ·
    routes/features.ts · routes/responses.ts · routes/surveys.ts · client/src/pages/SurveysPage.tsx.
    Evidencia primaria: 93 tests del repo + revert-proof + barrido de eligibility con override de
    fecha + ventana de escritura autorizada + login real en la app de Giftshop + export CSV
    contrastado contra conteos re-derivados.
  notes: |
    ## Solution understood

    La historia rediseña **cuándo** puede aparecer una encuesta y **por dónde** se entrega.

    **Display rules (#30, #31).** Se introduce `Start Date` como gate duro y ANTERIOR a todo lo
    demás: `surveyRuntime.ts:203` corta con `start_date_not_reached` antes de evaluar triggerType,
    frecuencia, dismissals o espaciado — por más que el resto de las reglas pasen, la fecha manda
    primero. El disparo se reduce a dos opciones (inmediato tras el Start Date, o tras N
    interacciones): la vieja `counter_equals` desaparece del formulario, que sólo puede escribir
    `triggerType: form.triggerType === "counter" ? "counter" : null`, aunque el runtime la conserva
    para no romper las 4 surveys legacy que ya la tienen. Se suman `triesBetweenShows` (espaciado:
    aparece en la primera interacción elegible y luego cada N) y `maxDismissals` acotado a la
    ventana de cooldown — el conteo de dismissals filtra por
    `dismissedAt >= datetime('now', '-N days')`, de modo que el respondent se recupera pasados N
    días en vez de quedar bloqueado para siempre.

    **Entrega after-login (#32).** Aparece el endpoint público `/api/surveys/general/eligible` y el
    modo `generalTrigger=afterLogin` con `loginDelaySeconds`. La separación de modos es el corazón
    del cambio: una General en modo after-login **no** se sirve por el endpoint de feature trigger,
    y viceversa. Del lado Salesforce, los launchers (`NpsAfterLoginLauncherBackground`) consultan
    esa eligibility al entrar a la app y, si hay resultado, montan el iframe pasando `clientOrgId`,
    `respondentId` y `userCreatedDate` reales, con un guard de una-vez-por-sesión scopeado por
    org+respondent.

    **Contexto de fecha (#33).** El `userCreatedDate` pasa a viajar también en el submit, así que la
    validación de la respuesta coincide con la de la eligibility. Sin eso la respuesta se rechazaba
    DESPUÉS de que el modal ya se había abierto — ese era el bug.

    **Export CSV (#34).** `GET /api/admin/responses/export.csv` detrás de `requireAdminAuth`,
    reutilizando las mismas condiciones de filtro del dashboard (`buildResponseConditions`) y
    aplicando gobernanza: `exportIncluded=false` siempre fuera; `strict` sólo aprobadas; `standard`
    excluye spam y rechazadas. Genera 34 columnas, con una columna por pregunta personalizada
    usando el texto de la pregunta como cabecera.

    ## Inferred technical tests

    | Test inferido | Qué prueba | ¿Ejecutable aquí? | Resultado |
    |---|---|---|---|
    | Suites server + client sobre la épica | que la rama no perdió cobertura | SÍ | 93/93 PASS |
    | Revert-proof con el código base | que los tests ejercitan el código nuevo | SÍ | 14 FAIL, 8 de esta historia |
    | Barrido de eligibility con `?today=` | AC2/AC3, el gate de Start Date a ambos lados | SÍ (lever admin) | corte exacto, PASS |
    | Barrido de `usageCount` | AC6, el patrón de espaciado real | SÍ (survey QA) | 1,4,7,10 — PASS |
    | Secuencia de dismissals | AC5, el límite | SÍ (survey QA) | `max_dismissals_reached` — PASS |
    | Reset de período de dismissals | AC5, la otra mitad | **NO** — depende del calendario real | declarado, cubierto por código+suite |
    | Export CSV con 7 filtros | AC13/AC14 | SÍ | los 7 conteos correctos |
    | Probes anónimos públicos vs admin | AC15 | SÍ | 200 públicas / 401 admin (7) |
    | Login real en Giftshop | AC9 mitad Auctifera | SÍ (ventana autorizada) | modal + respuesta 20 — PASS |
    | Login real en Fundraising | AC9 mitad VNFP | reusado de TR-147 | PASS |
    | Simulación de `normalizeDateForInput` | AC12, casos límite de formato | SÍ | `2026-7-1` → `2026-07-01` |

    ## Observaciones registradas (ninguna bloqueante)

    1. **[Baja] Cabeceras duplicadas en el CSV.** Tres columnas de preguntas personalizadas comparten
       la cabecera idéntica *"Which of these would you like to see added? (select all that apply)"*.
       La clave de dedup es `${survey.id}:${question.id}` (distingue bien), pero la cabecera escrita
       es sólo `question.questionText`. Al abrirlo en una hoja de cálculo no se sabe a qué módulo
       pertenece cada una. Sugerencia: prefijar con el subject.
    2. **[Baja] El AC12 apunta a un fix de otro dominio.** `normalizeDateForInput` normaliza
       `exhibitionStartDate`/`exhibitionEndDate` para inputs de fecha del Roster, **no** el
       `userCreatedDate` del NPS. El resultado que el AC exige SÍ se cumple (verificado en vivo en
       los dos paquetes), pero por construcción —`User.CreatedDate` ya sale ISO de Apex/Aura— y no
       por ese fix. Conviene que producto/dev confirmen el alcance esperado del AC12.
    3. **[Baja] El servidor acepta fechas mal formadas.** Un submit con `userCreatedDate: "2026-7-1"`
       devolvió 201. `calendarDaysBetween` hace `new Date("2026-7-1")`, que V8 parsea como hora
       local, pero el parseo de cadenas no-ISO es dependiente de la implementación según la spec.
       Hoy no rompe nada porque ambos launchers mandan ISO; es riesgo latente.
    4. **[Baja] Exposición de metadata en el endpoint público — YA ABIERTA desde TR-146.**
       `/api/surveys/general/eligible` devuelve a un anónimo 29 campos, incluidos `audienceDetails`
       y `generalClientOrgId` (qué organizaciones son el objetivo) y `triggerDetails` (las reglas
       internas). No hay PII ni credenciales. Esta historia no lo empeoró ni lo arregló. **No se
       abre defecto nuevo: se referencia el de TR-146.**
    5. **[Informativa] El launcher está en CUATRO utility bars, no sólo en Giftshop.** Verificado por
       metadata en la org: `NpsAfterLoginLauncherBackground` está montado en
       `Veevart_Giftshop_UtilityBar`, `Veevart_Ticketing_UtilityBar`, `Veevart_Engage_UtilityBar` y
       `Rentals_UtilityBar`. Es MÁS cobertura de la que el AC pide, pero cambia el alcance real del
       cambio y conviene que producto lo sepa.
    6. **[Informativa] Drift de metadata en la org de Auctifera.** El LWC `npsAfterLoginLauncher`
       sigue desplegado pero no está montado en ninguna flexipage (fue reemplazado por el bundle
       Aura). No se observó doble disparo. **Es el mismo drift que TR-147 encontró en la org de
       VNFP** — o sea, se repite en los dos paquetes. Metadata obsoleta a limpiar, no defecto del PR.

