  - scenarioIndex: 8
    scenarioTitle: "IM-1099 AC11 + AC12 — userCreatedDate travels through eligibility AND response submission so both validations agree, and the date Salesforce provides is formatted as a valid ISO value, never as 2026-7-1"
    testCaseId: ff9e52bd-404d-4fee-bd10-6b4cd0d076bc
    testCaseKey: TC-109
    status: passed
    executedAt: "2026-07-30T23:46:00Z"
    duration: 20
    actual: |
      **AC11 — el contexto viaja y el submit valida igual que la eligibility.** Tres submits reales
      contra la General 26:

      | Caso | HTTP | Cuerpo |
      |---|---|---|
      | submit SIN `userCreatedDate` | **400** | `Survey is not eligible for this response context: user_created_date_missing` |
      | submit CON `userCreatedDate` válido | 201 | response id 21 |
      | submit desde el modal real del launcher | 201 | response id 20 (escenario 7) |

      El rechazo trae la razón exacta que el AC pide. Sin este contexto la respuesta se rechazaría
      DESPUÉS de abrir el modal — el bug que #33 corrige. Los tres rechazos y las aserciones de la
      suite del cliente ya estaban verificados en TR-146 escenario 6; acá se re-confirmó el caso
      principal en vivo contra la General de esta corrida.

      **AC12 — el resultado que el AC exige, observado en vivo.** La URL construida por el launcher
      lleva `userCreatedDate=2026-07-01T15:58:58.000Z`: mes y día **con cero a la izquierda**. NO se
      produce el `2026-7-1` que el AC nombra. Contrastado contra el dato real de la org
      (`User.CreatedDate = 2026-07-01T15:58:58.000+0000`). TR-147 observó lo mismo del lado
      NFPFundraising. **Los dos paquetes entregan la fecha bien formateada.**

      **El fix al que el AC está mapeado**, `normalizeDateForInput` (RosterDateSelectorHelper.js),
      simulado con casos límite: `2026-7-1 → 2026-07-01` · `2026-1-15 → 2026-01-15` ·
      `2026-11-5 → 2026-11-05` · `2026-07-01 → 2026-07-01` (ya válido, **no se altera**) ·
      `2026-12-31 → 2026-12-31` (no se altera) · vacío → se devuelve tal cual ·
      `not-a-date` / `07/01/2026` → cae a `reformatDate` sin corromperlos. Normaliza sólo valores
      date-like y no reescribe los correctos, que es lo que el TC pedía verificar.

      **⚠️ Discrepancia de alcance (no es fallo funcional):** `normalizeDateForInput` se aplica sobre
      `exhibitionStartDate`/`exhibitionEndDate` vía `normalizeBoundaryDates` — dominio
      Roster/Exhibition, para que un `lightning:input type=date` no reciba un valor que rechaza.
      **No toca el camino del `userCreatedDate` del NPS.** Ese llega bien formateado porque sale de
      `User.CreatedDate` serializado por Apex/Aura, que ya emite ISO-8601. Conclusión honesta: el
      resultado observable del AC12 se cumple y está verificado en los dos paquetes, pero el cambio
      de código al que el AC aparece mapeado resuelve un problema de fechas DISTINTO. Conviene que
      producto/dev confirmen el alcance esperado.

      **Hallazgo menor (Baja):** un submit con `userCreatedDate: "2026-7-1"` fue ACEPTADO (201,
      response 22). El servidor no valida el formato; `calendarDaysBetween` hace
      `new Date("2026-7-1")`, que V8 parsea como hora local, pero el parseo de cadenas no-ISO es
      dependiente de la implementación según la spec. Hoy no rompe nada porque ambos launchers mandan
      ISO; queda como riesgo latente.
    notes: "AC11 + AC12 PASS. Se reporta que el fix al que el AC12 está mapeado (RosterDateSelector) atiende un dominio distinto del userCreatedDate: el AC se satisface por construcción, no por ese cambio."
    stepResults: []
    attachments:
      - name: ac11-ac12-usercreateddate.txt
        path: attachments/tr-148-tc-109/scenario-8/ac11-ac12-usercreateddate.txt
        mimeType: text/plain

