key: TR-148
title: "TR-148 · IM-1099 · TC-109 · Display rules UX y entrega after-login de la General — 11/11 PASS · 0 defectos · los 15 ACs cubiertos · AC9 CERRADO EN LOS DOS PAQUETES (Giftshop en vivo acá + Fundraising reusado de TR-147) · 93 tests del repo + revert-proof 14 FAIL (8 de esta historia) · OWASP 7 aplicables 0 FAIL · 0 console.log nuevos · RIESGO DE RELEASE: nada está en main"

description: |
  QA de IM-1099 (**Refine survey display rules UX**), epic IM-970 NPS Survey Tool delivery.
  QA Sub-task: **IM-1156**. Es la historia **paraguas** del epic: **15 ACs** sobre tres frentes —
  la UX y el runtime de las reglas de aparición, la entrega *after-login* de la General hacia los
  dos paquetes de Salesforce, y el export CSV de respuestas.

  Clasificación: **Mixed** — backend/service (Node/TS + Express + SQLite/drizzle), UI de admin
  (React), y dos paquetes Salesforce (Aura/LWC en los namespaces `Auctifera` y `vnfp`).

  ## Nueve PRs en tres repos — el mapeo lo derivó QA

  | PR | Merge | Tag del título | ACs |
  | --- | --- | --- | --- |
  | survey-tool **#30** | `60e1058c` | IM-965 | AC1, AC2, AC3 |
  | survey-tool **#31** | `8c1e78b1` | IM-1099 | AC4, AC5, AC6 |
  | survey-tool **#29** | `7f55b912` | — | AC7 |
  | survey-tool **#32** | `338f6b1c` | IM-1099 | AC8, AC10 |
  | survey-tool **#33** | `36e6a0e5` | IM-1099 | AC11 |
  | survey-tool **#34** | `14bde9d2` | IM-1099 | AC13, AC14 |
  | AuctiferaDX **#2527** / **#2536** | — | IM-1099 | AC9 (Giftshop) |
  | NFPFundraising **#2135** | `215bab6a` | REN-394 | AC9 (Fundraising), AC12 |

  `git log 737a62b6..14bde9d2` devuelve **exactamente esos seis** commits de survey-tool, ni uno
  más ni uno menos: el mapeo derivado en el bundle queda confirmado contra el repo. Dos PRs no
  vienen etiquetados con IM-1099 (**#30** dice IM-965, **#2135** dice REN-394) — **dev debería
  confirmar o corregir ese mapeo**.

  ## ⚠️ HALLAZGO DE TOPOLOGÍA — riesgo de release, no defecto de código

  **Nada de esto está en `main`.** Los seis PRs de survey-tool viven en
  `epic/nps-survey-delivery-and-metrics`; los de AuctiferaDX en su rama épica; el de NFPFundraising
  en `epic/nps-survey-delivery`. Ya se reportó en TR-146 y TR-147 y **sigue igual**. QA valida
  comportamiento sobre la épica, que es lo que corre el deploy dev; el merge a `main` es un paso de
  release pendiente y fuera del control de este test run.

  ## Qué se reutilizó y qué era el delta real

  Se reutilizó evidencia en vez de rehacerla:
  - **TR-146** (IM-966/TC-96, 11/11 PASS) → **AC7** completo y **AC11** por el lado del servicio.
  - **TR-147** (IM-968/TC-108, 6/9 PASS) → la **mitad NFPFundraising del AC9** y el contrato del launcher.

  El **delta real** de esta historia —lo que nadie había ejercitado— eran las display rules
  completas (AC1–AC6, de las que TR-146 sólo había visto que sus tests caen al revertir), la mitad
  **Auctifera Giftshop** del AC9, el formato de fecha del AC12, **todo el export CSV** (AC13/AC14,
  cero evidencia previa) y el AC15. **Los cinco quedaron cubiertos en esta corrida.**

  ## Método

  1. **Suites completas del repo**: `server/` 85/85 + `client/` 8/8 = **93 tests, 0 fallos**.
  2. **Revert-proof**: `server/src` al commit base dejando los tests en la épica →
     **71 pass / 14 FAIL**. De los 14, **8 mapean a ACs de esta historia** (los 5 que el TC predijo,
     más el de after-login y dos rollups). Los otros 6 son de IM-966 y no se le imputan.
  3. **Probes read-only en vivo** con un lever clave: el endpoint admin acepta **override de fecha**
     (`?today=`), lo que permitió barrer el gate de Start Date a ambos lados del límite **sin
     esperar al calendario ni modificar ninguna survey**.
  4. **Ventana de escritura autorizada** por el dueño del entorno para lo que no se puede observar
     de otra forma: la General after-login del AC9 y el espaciado del AC6.
  5. **Login REAL en la org de Auctifera** → app de Giftshop → modal → respuesta enviada y atribuida.
  6. **Verificación independiente**: los 7 conteos del CSV se re-derivaron del listado de respuestas
     antes de contrastarlos contra el archivo; no se tomó por buena ninguna cifra de pantalla.

  ## Resultado

  **11/11 PASS · 0 defectos · 0 hallazgos de seguridad High/Critical.** Los 15 ACs quedan cubiertos.
  Se registran **6 observaciones** (4 de severidad Baja, 2 informativas), ninguna bloqueante,
  detalladas en las notas de cada escenario y en `regression-results.txt`.

  Dato que conviene contrastar con la historia hermana: estos seis PRs agregan **0 (cero)
  `console.log`**. IM-968 fue rechazada en TR-147 justamente por agregar 20, uno de ellos filtrando
  la URL de eligibility con contexto de usuario. Este conjunto no repite el problema.

  ## ⚠️ Estado del entorno al cerrar — NO es "como estaba"

  El dueño del entorno pidió durante la corrida: *"no borres la survey de QA, dejalas ahi como
  prueba, recupera la del test anterior y deja ambas solo las inactivas"*. Se cumplió al pie de la
  letra: **no se borró nada** y **las 4 generales quedaron inactivas**, incluida la del dev (id 25)
  que estaba activa al empezar. Es una decisión del dueño del entorno, **no un fallo de
  restauración**. Detalle completo en `estado-final-entorno.txt`.

