    scenarioTitle: "IM-1099 AC13 + AC14 — CSV export honours the active dashboard filters and includes response metadata, survey and respondent/org context, score fields and one readable column per survey question and answer"
    testCaseId: ff9e52bd-404d-4fee-bd10-6b4cd0d076bc
    testCaseKey: TC-109
    status: passed
    executedAt: "2026-07-30T23:20:00Z"
    duration: 25
    actual: |
      **Territorio nuevo: este AC no se había tocado en ninguna corrida previa.**

      **AC13 — los filtros se respetan.** Los siete conteos se **re-derivaron de forma independiente**
      del listado de respuestas y recién después se contrastaron contra el CSV; no se tomó por buena
      la cifra de la pantalla. Baseline: 10 respuestas.

      | Filtro | filas CSV | esperado | ✓ |
      |---|---|---|---|
      | (ninguno) | 10 | las 10 | ✓ |
      | `clientOrgId=computing-power-944-dev-ed` | 4 | ids 8,10,18,19 | ✓ |
      | `clientOrgId=flow-site-19432-dev-ed` | 1 | sólo la id 12 | ✓ |
      | `governance=strict` | 0 | ninguna está `approved` | ✓ |
      | `surveyType=nps` | 10 | todas son NPS | ✓ |
      | `surveyType=csat` | 0 | no hay ninguna CSAT | ✓ |
      | `from=2026-07-01&to=2026-07-31` | 5 | ids 8,10,12,18,19 | ✓ |

      Cabeceras correctas: `Content-Type: text/csv; charset=utf-8` y
      `Content-Disposition: attachment; filename="responses-standard.csv"` (con `strict` pasa a
      `responses-strict.csv`). Gobernanza verificada por lectura: `exportIncluded=false` siempre
      fuera; `strict` sólo aprobadas; `standard` excluye spam y rechazadas — o sea, "Export:
      Excluded" se respeta.

      **AC14 — 34 columnas**, cubriendo las cuatro familias que el AC exige: metadata de la respuesta
      (`response_id`, `created_at`, `version`, `quality_status`, `export_included`, `quality_notes`);
      contexto de la survey (`survey_id`, `survey_type`, `feature_id/name/slug`, `product_owner`,
      `main_question`); contexto respondent/org (`client_org_id`, `respondent_id`); y puntajes
      (`score`, `company_recommend_score`). Las columnas legibles por pregunta y respuesta están
      pareadas (`main_question`/`main_answer`, `score_reason_*`, `follow_up_*`,
      `company_recommend_*`) más una columna por pregunta personalizada **usando el texto de la
      pregunta como cabecera**. Fila real inspeccionada abriendo el archivo: se lee sin descifrar
      nada, sin blob JSON ni claves internas; el escapado de comillas y comas funciona.

      **⚠️ Hallazgo (Baja) — cabeceras duplicadas.** De las 6 columnas de preguntas personalizadas,
      TRES comparten cabecera idéntica: *"Which of these would you like to see added? (select all
      that apply)"*. La clave de dedup es `${survey.id}:${question.id}` —que sí distingue las
      columnas— pero la cabecera escrita es sólo `question.questionText`, y tres surveys distintas
      usan literalmente la misma pregunta de seguimiento. Al abrirlo en una hoja de cálculo no se
      sabe a qué módulo pertenece cada una sin cruzar contra `survey_id` fila por fila. Las columnas
      SON legibles (el AC se cumple) pero son ambiguas entre sí. Sugerencia: prefijar con el subject.

      Revert-proof: *exports governed response CSV with subject metadata and dashboard filters* cae
      al revertir.
