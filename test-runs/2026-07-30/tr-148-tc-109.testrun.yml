    actual: |
      **El AC nombra DOS paquetes y con esta corrida quedan cubiertos los dos.** La mitad
      NFPFundraising ya estaba verificada en TR-147 (login real, modal tras el delay, respuesta
      atribuida) y **no se rehízo**. Acá se cerró la mitad **Auctifera Giftshop**, que era el delta
      real y tenía reloj: la org expira el 2026-07-31.

      **PASO 0c — dónde está montado el launcher, verificado por metadata y no a ciegas.** Se
      recuperaron las FlexiPage de la org: `NpsAfterLoginLauncherBackground` está montado en
      **las cuatro** utility bars de Veevart (Giftshop, Ticketing, Engage, Rentals). Más cobertura de
      la que el AC pide; queda anotado porque cambia el alcance real del cambio.

      **PASO 0/0b.** Baseline leído del entorno: 11 surveys, generales [17 inact, 24 inact, **25
      ACTIVA**], 10 respuestas. La 25 la creó el dev hoy 20:52:09 y tiene su propia respuesta (id 19,
      20:53:17). Config respaldada en `RESTORE-survey-25.json` **antes** de tocar nada. Por la regla
      de scopes solapados (AC7 de IM-966) se desactivó la 25 y se creó la General QA **26**, acotada
      SOLO a la org de Auctifera, con `generalTrigger=afterLogin, loginDelaySeconds=20`.

      **Aislamiento verificado ANTES de navegar** — esto es lo que hace la prueba honesta:
      Auctifera → `[26]`; VNFP → `[]`; endpoint de feature con el mismo contexto → `[]`.

      **⚠️ Primer intento fallido, y por qué importa.** Navegar a `/lightning/app/Veevart_Giftshop`
      devolvió *"The app you're trying to view is invalid or inaccessible. We're taking you to your
      default app instead"* y cayó en **Veevart Ticketing App**. El modal SÍ apareció ahí, pero eso
      no es la evidencia que pide el AC. Causa: la org tiene namespace `Auctifera`, así que la URL
      correcta lleva el prefijo: `/lightning/app/Auctifera__Veevart_Giftshop`. **No era falta de
      permisos** — la query a `AppMenuItem` confirma *Veevart Giftshop* con `IsAccessible=true`.

      **Segundo intento, ya en la app correcta** (nav confirma "Veevart Giftshop" con sus tabs: Home,
      Tasks, Chatter, Accounts, Contacts, POS Purchases, Client Purchases, Shop):

      - **t ≈ 0 s → SIN modal.** Esto es lo que prueba que el delay es real y no que el modal salga
        siempre.
      - **t ≈ 30 s → modal presente.**

      Nota de método: el guard de una-vez-por-sesión ya se había consumido en el intento fallido.
      Lightning lo persiste en su capa LSS (IndexedDB), no en localStorage plano, así que se limpió
      el storage del origen para forzar una sesión genuinamente nueva. **Sin eso el segundo intento
      habría dado un falso negativo.**

      **Contrato observado en vivo** — URL del iframe construida por el launcher:
      `/survey/8?surveyId=26&clientOrgId=computing-power-944-dev-ed&respondentId=005dq00000NLWpIAAX&userCreatedDate=2026-07-01T15%3A58%3A58.000Z&usageCount=0`
