  - scenarioIndex: 7
    scenarioTitle: "IM-966 AC7 — The API prevents saving a second active General Survey whose scope overlaps an existing one"
    testCaseId: 568bef96-cec4-47a1-bc50-21c0a9f5cdbc
    testCaseKey: TC-96
    status: passed
    executedAt: "2026-07-30T14:30:00Z"
    duration: 25
    actual: |
      Seis casos ejecutados contra la API real con sesión de admin. Estado inicial: 9 surveys, 1 general
      activa (id 17, global).

      | Caso | HTTP | Respuesta | ¿Persiste? |
      |---|---|---|---|
      | A) General ACTIVA global vs la 17 | **409** | *"An active general survey already applies to this audience (survey 17)."* | NO |
      | B) General ACTIVA acotada a 1 org vs la 17 global | **409** | mismo mensaje | NO |
      | C) `audience=organization` con lista vacía | **400** | *"General surveys targeting organizations require at least one organization."* | NO |
      | D) `audience` inválido (`segment`) | **400** | zod: Expected 'organization' \| 'specific_users' \| 'everyone' | NO |
      | E) General INACTIVA que solapa | **201** | creada id 18 → **PERMITIDO** | SÍ (borrada) |
      | F) DELETE de la 18 | **204** | — | revertido |

      El caso E es el que confirma que el conflicto **solo considera `active=true`**, tal como pide el AC.

      Cubierto solo a nivel de contrato (imposible en vivo mientras la única general sea global, porque
      `everyone` solapa con todo): *acotadas con listas disjuntas → PERMITIDO* y *update sobre sí misma
      sin falso conflicto* (`exceptSurveyId`). Ambos están en el test *"rejects overlapping active general
      survey scopes"*, que **CAE al revertir** con `actual 400 vs expected 409`.

      Estado final verificado: **9 surveys, generales = [17]**. El entorno queda exactamente como se
      encontró.

      **Observación de calidad (positiva):** el mensaje de error **nombra la survey en conflicto**
      ("survey 17"), lo que hace el diagnóstico inmediato para el admin. Objetivo cumplido.
    notes: "AC7. Consecuencia operativa a documentar para el equipo: mientras exista UNA General activa con audience=everyone es IMPOSIBLE tener cualquier otra General activa. Es el AC funcionando, pero limita a una campaña global simultánea."
