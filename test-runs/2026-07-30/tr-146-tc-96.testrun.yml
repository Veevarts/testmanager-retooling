  observations: "(1) SEMÁNTICA PER-ORG (producto): para una general global, responses/impressions/dismissals se cuentan POR clientOrgId, así que el mismo usuario puede volver a ver la misma encuesta en otra organización. Está fijado por un test, o sea es intencional; confirmado con dos orgs reales. Si producto no lo quiere así, es decisión de diseño a revisar, no defecto. (2) SUBJECTS FALTANTES (producto): 'Courses' y 'Groups' aparecen en el filtro de producto del admin pero NO están registrados como subjects, así que hoy no tienen trigger. (3) OPERATIVA (equipo): mientras exista UNA General activa con audience=everyone es imposible tener cualquier otra General activa — everyone solapa con todo. Es el AC7 funcionando, pero limita a una campaña global simultánea y obliga a desactivar la vigente para probar otra. (4) CALIDAD POSITIVA: el 409 nombra la survey en conflicto ('survey 17'), lo que hace el diagnóstico inmediato. (5) CORRECCIÓN DEL TEST CASE: el escenario 9 se escribió originalmente con los labels del código; la UI real usa radios con otros textos ('To whom are you sending this survey?' / 'To everyone' / 'To an organization / museum' / botón 'Create'). Corregido en TC-96 v5 tras manejar la pantalla."
