      **Caso positivo cerrado por UI real** (escenario 10): respuesta enviada desde el modal abierto por
      Rentals Quick Save → registro **id 14**, `surveyId 20` (**la GENERAL**, no la de Rentals id 1),
      `featureId 8`, `respondentId 005dq00000NLWpIAAX` (el User Id real de Salesforce propagado por el
      widget), `clientOrgId computing-power-944-dev-ed`, score 9. **Repetido en la segunda org**
      (escenario 11): respuesta id 15, `surveyId 21`, `respondentId 005Rt00000XjqlyIAB`,
      `clientOrgId flow-site-19432-dev-ed`.

      **Re-evaluación en el submit** (`getSurveyEligibilityVerdict` en `responses.ts`) verificada con tres
      rechazos, todos contra la API real:

      | Payload | Respuesta |
      |---|---|
      | sin `clientOrgId` | **400** *"clientOrgId does not match the general survey"* |
      | `clientOrgId` de organización inexistente | **400** *"clientOrgId does not match an active organization"* |
      | organización activa pero SIN `userCreatedDate` | **400** *"Survey is not eligible for this response context: user_created_date_missing"* |

      El tercero es el más informativo: prueba que el servidor **re-evalúa al guardar**, no solo al
      entregar — y es exactamente el modo de falla que **#33** corrige.

      **Regresión de #33 (mitad navegador)** cubierta por la suite `client/`: *prefers the canonical
      userCreatedDate over legacy aliases* · *resolves supported aliases for response submission context*
      · *serializes supported aliases as userCreatedDate in the response payload*. El `userCreatedDate`
      capturado del iframe real es `2026-07-01T15:58:58.000Z` — el `User.CreatedDate` de Salesforce, no
      el reloj de la corrida.

      **Revert-proof:** cae *"validates global general survey response eligibility context"*.
      Objetivo cumplido.
