key: TR-146
title: "TR-146 · IM-966 v2 · TC-96 · General NPS survey — scoping por organización, prioridad sobre la feature survey, atribución de la respuesta y prevención de conflicto — 11/11 PASS · 0 defectos · 93 tests del repo (85 server + 8 client) + revert-proof 14 FAIL de los cuales 9 mapean a AC de IM-966 + widget disparado end-to-end en org real (iframe surveyId=20, respuesta atribuida) + cross-test vnfp DESBLOQUEADO desde TR-097 · RIESGO DE RELEASE: #29/#33/#34 viven en la rama épica, main sigue en 737a62b6"

description: |
  QA de IM-966 (**Add general NPS survey position**), epic IM-970 NPS Survey Tool delivery.
  QA Sub-task: IM-1006. **Es una RE-REVIEW (v2)**: la historia ya pasó QA una vez —
  TC-96 v1 → **TR-097** (2026-07-03, 12/13 PASS, 1 blocked) → `Request Approved`. El 2026-07-16
  David la reabrió y el 2026-07-29 reescribió la descripción: los ACs pasaron de 4 genéricos a
  **7 específicos**, con territorio funcional que la v1 no cubría (scoping por organización,
  atribución de la respuesta, prevención de conflicto).

  PRs bajo prueba: survey-tool **#29** (`7f55b912`) + survey-tool **#33** (`36e6a0e5`) +
  AuctiferaDX **#2525** (merged 2026-07-16). AuctiferaDX #2473 quedó CLOSED, superseded por #2525.
  Fuera de alcance por ser IM-1099: el trigger *after-login* (survey-tool #32, AuctiferaDX #2527/#2536).

  Clasificación: **Mixed** — backend/service (Node/TS + Express + SQLite/drizzle) + widget
  Salesforce (LWC/Apex) en dos namespaces (`Auctifera` y `vnfp`).

  ## ⚠️ HALLAZGO DE TOPOLOGÍA — riesgo de release, no defecto de código

  **#29 / #33 / #34 NO mergearon a `main`.** Mergearon a `epic/nps-survey-delivery-and-metrics`.
  `main` sigue en **`737a62b6`** (#28) — exactamente el estado que ya validó TR-097 — y ese commit
  **es además el base de #29**, o sea `main` no se movió desde la v1. El deploy de
  `surveytool.dev.veevart.ai` corre la ÉPICA: `GET /api/surveys/general/eligible` responde 200 y esa
  ruta no existe en `main`. Diff `main` → épica: 16 archivos, +2061/-416, 6 commits (#29 #30 #31 #32
  #33 #34). **Consecuencia: todo lo que valida este run está en la épica; el merge a `main` es un
  paso de release pendiente.** El TC-96 y el plan de la QA Sub-task decían "main al día" — corregido
  en la v5 del test case.

  ## Método

  1. **Suites del repo, las DOS**: `server/` 85/85 y `client/` 8/8 = **93 tests**, 0 fallos. La del
     cliente no es decorativa: cubre la mitad navegador del AC6 (serialización de `userCreatedDate`).
  2. **Revert-proof**: `server/src` revertido a `737a62b6` dejando los tests en la épica →
     **71 pass / 14 FAIL**. **9 de los 14 mapean 1-a-1 a un AC de IM-966**; los otros 5 son de
     #30/#31/#34, que viajan en la misma rama.
  3. **Probes en vivo read-only** contra el deploy dev para AC3, AC4 y el contrato `requestedSurveyId`.
  4. **Ventana de escritura autorizada por el usuario** en el entorno dev COMPARTIDO (tres ventanas,
     cada una con snapshot previo y verificación de cierre) para los casos que no se pueden observar
     sin una General en modo *featureTrigger*: AC2 live, AC4 live, AC5 live, AC6 positivo.
  5. **UI real**: admin del survey-tool manejado en el browser (escenario 9) y **widget disparado
     end-to-end** desde Rentals Quick Save en la scratch org de Auctifera (escenario 10).
  6. **Cross-test `vnfp`** (escenario 11), **bloqueado desde TR-097**, ejecutado por primera vez con
     la identidad REAL de esa org.

  ## Por qué hizo falta una ventana de escritura

  La única General activa (id 17) tenía `audience=everyone`. Por el **propio AC7**, `everyone` solapa
  con cualquier scope, así que es **imposible** crear una segunda General activa mientras la 17 esté
  activa — verificado: 409. La estrategia de "crear una General de QA aislada y no tocar nada" quedó
  descartada, no por un problema del entorno sino **porque el AC7 funciona**. El usuario eligió
  desactivar la 17, correr todo y luego decidir sobre su reactivación.

  ## Resultado

  **11/11 PASS · 0 defectos · 0 hallazgos de seguridad High/Critical.** Los 7 ACs quedan verificados
  a nivel de contrato Y en vivo. Se registran 4 observaciones para producto/plataforma (ninguna
  bloqueante) y 1 hallazgo de seguridad de severidad **Baja**.

  ## Lo que este run NO cubre — declarado, no omitido

  - **El render del modal dentro del namespace `vnfp`.** Motivo verificado, no supuesto: el paquete
    `vnfp` no expone en esa org ningún componente de *feature trigger* equivalente a
    `Auctifera__AddManageResourcesToRentalEvent`, y el objeto `vnfp__Rental_Event__c` no existe ahí.
    El único otro punto de entrada es `vnfp__NpsAfterLoginLauncherBackground`, que es IM-1099. Lo que
    sí quedó probado es que esa org consume el mismo contrato de backend, con su identidad real,
    incluida la atribución de la respuesta.
  - **El merge de la épica a `main`**: fuera del control de QA.

  ## Estado del entorno al cerrar

  9 surveys (idéntico al inicio) · generales = [{id 17}] · **0 respuestas de QA · 0 rastros de
  "QA TC-96"**. Las tres Generales de prueba (19, 20, 21) fueron borradas y sus respuestas cayeron en
  cascada. **Única diferencia con el estado inicial:** la survey 17 queda con `active=false` **por
  decisión explícita del usuario** ("no es necesario reactivarla"), no por omisión de QA. Su
  configuración permanece intacta — solo cambia el flag — y `RESTORE-survey-17.json` permite
  revertirlo con un solo PUT.

