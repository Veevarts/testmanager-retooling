environment:
  name: "survey-tool @ epic/nps-survey-delivery-and-metrics head 14bde9d2 (base main 737a62b6) desplegado en https://surveytool.dev.veevart.ai · node test runner (tsx --test) para server/ y client/ · scratch org Auctifera nps_2 = computing-power-944-dev-ed (expira 2026-07-31) · scratch org NFPFundraising vnfp_pkg = flow-site-19432-dev-ed (expira 2026-08-14) · admin del survey-tool vía Cognito Hosted UI (Google @veevart.com)"
  url: "https://github.com/Veevarts/survey-tool/pull/29"
  buildVersion: >-
    Mixed (backend/service Node+TS+Express con SQLite/drizzle + widget Salesforce LWC/Apex en dos
    namespaces). Diff main→épica: 16 archivos, +2061/-416. Archivos con superficie funcional:
    server/src/lib/surveyRuntime.ts · lib/validation.ts · routes/features.ts · routes/responses.ts ·
    routes/surveys.ts. Evidencia primaria: 93 tests del repo + revert-proof + probes en vivo +
    ventana de escritura autorizada + widget disparado end-to-end en org real + cross-test vnfp.
  notes: |
    ## Solution understood

    Antes de #29, TODA general survey estaba obligada a llevar `generalClientOrgId`: un refine de
    `validation.ts` lo exigía, así que una "general" era en realidad una survey atada a UNA
    organización. #29 elimina ese refine y sustituye el targeting por un modelo de audiencia:
    `audience` ∈ {everyone, organization} más `audienceDetails` (lista de subdominios). La resolución
    vive en `surveyAllowsClientOrg()` (features.ts) y respeta este orden: legacy `generalClientOrgId`
    con match exacto → `audience=everyone` → `audience=organization` con el token en la lista → si no,
    false. Encima se agrega un gate de organización ACTIVA (`isActiveClientOrg()` consulta
    `organizations` por `subdomain` + `active=true`) que devuelve `general_client_org_inactive`.
    Tres consecuencias de diseño, las tres deliberadas y las tres fijadas por tests:
    (a) para una general GLOBAL el estado del respondent —responses, impressions, dismissals— se
    cuenta POR `clientOrgId`, o sea el mismo usuario arranca limpio en otra organización;
    (b) `surveys.ts` incorpora `generalSurveyScope()` + `scopesOverlap()` +
    `findActiveGeneralSurveyConflict()` → 409 si dos generales ACTIVAS se solapan, 400 si el scope es
    inválido; (c) `responses.ts` re-evalúa la eligibility en el submit vía
    `getSurveyEligibilityVerdict`, así que la atribución no depende de lo que mande el cliente.
    #33 cierra el bug que hacía que el `userCreatedDate` no viajara por ambos paths públicos de
    submit: la respuesta se rechazaba DESPUÉS de que el modal ya se había abierto.
    AuctiferaDX #2525 aporta la otra mitad: el widget abre el `surveyId` que ELIGIÓ el backend en vez
    de re-resolver por contexto de feature — el backend expone ese contrato con
    `triggerMode: requestedSurveyId != null ? "any" : "featureTrigger"`.
    La rama de prioridad del AC4 corta antes de evaluar las feature surveys:
    `const eligibleGeneralSurvey = selectEligibleGeneralSurveys(ctx, {...})[0];`
    `if (eligibleGeneralSurvey) return [eligibleGeneralSurvey];`

    ## Inferred technical tests

    | Test inferido | Qué prueba | ¿Ejecutable aquí? | Resultado |
    |---|---|---|---|
    | Suite `server/` sobre la épica | AC1..AC7 a nivel de contrato | SÍ (tsx --test) | 85/85 PASS |
    | Suite `client/` sobre la épica | AC6 lado navegador | SÍ | 8/8 PASS |
    | Revert-proof `server/src` → 737a62b6 | los guards no son vacuos | SÍ | 71 pass / 14 FAIL (9 mapean a AC) |
    | Probes anónimos al endpoint público | AC3 · gate de organización activa | SÍ | 4 casos, todos como se espera |
    | Probe `?surveyId=` | AC4 · contrato de #2525 | SÍ | 17 GENERAL · inválido → 400 |
    | Ventana de escritura: General en modo featureTrigger | AC2/AC4/AC5/AC6 en vivo | SÍ (autorizada por el usuario) | 4/4 PASS |
    | Conflicto de scope contra la API real | AC7 | SÍ | A→409 B→409 C→400 D→400 E→201 F→204 |
    | UI admin en el browser | AC1/AC2/AC3 observables en pantalla | SÍ | 4 observaciones confirmadas |
    | Widget Quick Save en org real | AC4/AC5/AC6 lado widget | SÍ (org vigente) | iframe surveyId=20 · respuesta 14 atribuida |
    | Cross-test `vnfp` backend + control negativo | aislamiento entre orgs | SÍ | 4 subjects sirven · control negativo OK · respuesta 15 atribuida |
    | Eligibility por CADA subject registrado | blast radius real del cambio | SÍ | 6 subjects sirven la General |
    | **Render del modal dentro de `vnfp`** | AC4/AC6 lado widget en el 2º namespace | **NO — el paquete no expone un host de feature trigger en esa org** | declarado como límite, no fingido |
    | Merge de la épica a `main` | que el cambio llegue a producción | **NO — fuera del control de QA** | reportado como riesgo de release |

    ## Objective fit

    Objetivo del ticket: que exista una General NPS survey configurable de forma independiente de
    cualquier feature journey, acotable por organización, que gane prioridad sobre la survey del
    feature, que caiga con gracia al feature survey cuando no aplica, que la respuesta quede atribuida
    a ella con el contexto del trigger, y que la API impida dos generales activas con scope solapado.

    PRE-fix obtenido (main / 737a62b6): imposible configurar una General sin atarla a UNA organización
    — el refine de `validation.ts` lo exige. No existe el concepto de audiencia, ni el gate de
    organización activa, ni la prevención de conflicto. El revert-proof lo demuestra de forma
    ejecutable: al revertir el código a ese punto, 9 aserciones que cubren exactamente estos ACs
    FALLAN.

    POST-fix obtenido: la General id 17 existe hoy con `generalClientOrgId=null` y `audience=everyone`
    —estructuralmente imposible antes—; una General acotada discrimina entre organizaciones activas
    reales (dentro del scope → la sirve, fuera → no); una General en modo *featureTrigger* GANA sobre
    la survey de Rentals con ambas elegibles para el mismo respondent; tras responderla el mismo
    trigger entrega la de Rentals; la respuesta queda contra el id de la General con `clientOrgId`,
    `respondentId` y `userCreatedDate` reales; y dos generales activas solapadas se rechazan con 409
    nombrando la survey en conflicto.

    Objetivo cumplido en los 11 escenarios. 0 defectos.

    Salvedad honesta: el render del modal se observó en el namespace `Auctifera`, no en `vnfp`. Del
    lado `vnfp` se verificó el contrato de backend completo con identidad real, no el pintado del
    modal — porque ese paquete no expone en esa org un host de feature trigger donde dispararlo.

