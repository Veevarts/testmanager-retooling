    scenarioTitle: "IM-966 — NFPFundraising cross-test — UNBLOCKED in v2, the vnfp_pkg scratch org now exists (blocked since TR-097)"
    testCaseId: 568bef96-cec4-47a1-bc50-21c0a9f5cdbc
    testCaseKey: TC-96
    status: passed
    executedAt: "2026-07-30T18:05:00Z"
    duration: 40
    actual: |
      **Bloqueado desde TR-097; ejecutado por primera vez.** Org `flow-site-19432-dev-ed` (scratch
      `vnfp_pkg`, expira 2026-08-14).

      **Precondiciones verificadas por query, no asumidas:** `vnfp__NpsWidgetController`,
      `vnfp__npsWidget`, `vnfp__SurveyWidgetTrigger` y `vnfp__npsAfterLoginLauncher` desplegados; la org
      registrada como organization **ACTIVA** en el survey-tool (id 7, subdomain
      `flow-site-19432-dev-ed`). **Identidad REAL tomada de la propia org**: `respondentId
      005Rt00000XjqlyIAB` y `userCreatedDate 2026-07-15T10:04:17.000+0000`.

      **Entrega:** General de QA id 21 acotada a esa org (`featureTrigger`, activa) →
      `rentals` · `fundraising` · `ticketing` · `payments` **los cuatro sirven la General**.

      **CONTROL NEGATIVO (aislamiento entre orgs):** el **mismo** `respondentId`, cambiando solo el
      `clientOrgId` al de Auctifera → devuelve **id 1 (feature)**, no la General acotada a VNFP. La
      General no se filtra entre organizaciones. Es la contracara del AC2 ejecutada entre **dos orgs
      reales**, y confirma de paso la semántica per-org del AC3.

      **Atribución:** respuesta enviada con el contexto real de VNFP → **201**, id 15, `surveyId 21`,
      `featureId 8`, `clientOrgId flow-site-19432-dev-ed`, `respondentId 005Rt00000XjqlyIAB`, score 8.

      **LÍMITE DECLARADO — el widget de `vnfp` NO se disparó desde su UI.** Motivo **verificado, no
      supuesto**: el paquete `vnfp` no tiene en esa org un componente equivalente a
      `Auctifera__AddManageResourcesToRentalEvent` — sus bundles de ese dominio son
      `RentalPaymentsWizard`, `RentalPaymentsWizardWrapper`, `DonationFromContact`,
      `TicketingWizardSettings`, `BoxMembershipDonation`, `BoxSpecificFundDonation`, `DonationRow` — y el
      objeto `vnfp__Rental_Event__c` no existe ahí. El único otro punto de entrada disponible es
      `vnfp__NpsAfterLoginLauncherBackground` (montado en `Fundraising_UtilityBar`), que pertenece a
      **IM-1099** y está FUERA del alcance de IM-966.
      **Queda probado** que esa org consume el mismo contrato de backend que el widget de Auctifera ya
      ejercitó end-to-end por UI, incluida la atribución. **No queda probado** el render del modal dentro
      de `vnfp`.

      **Limpieza:** `DELETE /api/admin/surveys/21` → 204 (arrastra la respuesta 15). Estado final:
      9 surveys · 0 rastros de QA. Objetivo cumplido para el alcance ejecutable.
    notes: "PENDIENTE PARA PRODUCTO/DEV (no bloqueante, no defecto): indicar qué componente del paquete vnfp hospeda el widget NPS en un feature trigger. Con ese dato el render se dispara en minutos y la org está vigente hasta el 2026-08-14. El TC-96 v5 incorpora este límite como aserción explícita del escenario en vez de dejarlo implícito."
