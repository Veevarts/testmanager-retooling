      dice que hace para no perder lo guardado antes del cambio.

      EL RIESGO R3 DEL TEST CASE QUEDA DESCARTADO. El hook inicializa con
      `useState(() => readStoredOpen(storageKey))`, que solo corre al montar; si el panel no se
      desmontara al cambiar de cuenta, arrastraria el estado de la anterior y el siguiente toggle
      escribiria en la clave equivocada. Se probo con cambio de ruta por cliente, sin recarga de
      documento, EN LOS DOS SENTIDOS:

        cuenta A abierta  -> cuenta B     el panel aparece CERRADO    (leyo la clave de B)
        cuenta B cerrada  -> cuenta A     el panel aparece ABIERTO    (leyo la clave de A)

      El panel remonta en cada cambio de cuenta y vuelve a leer. Probarlo en un solo sentido no
      habria bastado: si solo hubiera ido de la cerrada a la abierta, un panel que arrastrara el
      estado habria dado el mismo resultado por casualidad.

      pre-fix -> post-fix -> objetivo cumplido?: una sola clave compartida hacia que abrirlo en
      cualquier cuenta lo abriera en My Day y al reves -> una clave por superficie, aisladas, y sin
      arrastre al navegar entre cuentas -> SI.
