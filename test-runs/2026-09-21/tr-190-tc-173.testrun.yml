  - testCaseId: "30d6bddc-2ed8-413a-9cc2-e51190c8a43f"
    testCaseKey: TC-173
    scenarioTitle: >-
      AC3 · The expand preference survives moving around and dies with the session
    scenarioIndex: 2
    status: passed
    executedAt: "2026-09-21T16:10:00Z"
    stepResults: []
    actual: |
      Recorrido completo de la preferencia dentro de una sesion y a traves de su final:

        accion                                          resultado del panel
        abrir en My Day                                 abierto · clave = "true"
        ir a la pestaña SF Cases                        el panel se DESMONTA
        volver a Tasks                                  abierto   <- sobrevivio al desmontaje
        recarga real del documento                      abierto   <- sobrevivio a la recarga
        limpiar el almacenamiento y recargar            CERRADO   <- muere con la sesion
        abrir de nuevo                                  clave = "true"
        cerrar                                          clave = "false"

        localStorage con claves del panel               ninguna

      El desmontaje al cambiar de pestaña es el dato que importa: prueba que el estado NO vive en
      el componente, que es exactamente lo que este AC pide y lo que en su momento se reporto
      cumplido sin estarlo. La recarga se confirmo con una marca puesta en `window` que se pierde
      cuando el documento se recarga de verdad.

      Que la clave quede en "false" al cerrar, y no solo en "true" al abrir, demuestra que la
      preferencia guarda los dos sentidos: un CSM que lo cierra a proposito no se lo encuentra
      abierto al volver.

      pre-fix -> post-fix -> objetivo cumplido?: el estado se perdia en cada desmontaje, que ocurre
      en cada cambio de pestaña y cada navegacion -> sobrevive a pestaña, navegacion y recarga, y
      muere al cerrar la sesion -> SI.
    notes: "**PASS.** Cubierto ademas por 9 tests del dev sobre el hook, todos verdes."
