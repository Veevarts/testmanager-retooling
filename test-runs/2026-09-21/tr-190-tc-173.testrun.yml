        csm.my-day.suggested-panel-open                                        = true
        csm.account.c54e7cdf-844c-48ea-94ea-e42799d7cd26.suggested-panel-open  = true
        csm.account.0b7dcaf0-441a-4059-b34b-a52eedd08b06.suggested-panel-open  = true

