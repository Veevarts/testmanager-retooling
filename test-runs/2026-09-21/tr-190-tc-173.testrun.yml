notes: |
  ## Solution understood

  El panel de sugerencias abria expandido y tapaba el trabajo propio del CSM. La solucion lo abre
  cerrado y deja el conteo en el encabezado como todo lo que cuesta cuando el CSM no quiere
  triar ahora.

  El colapso combina TRES mecanismos, y ninguno sobra: la clase (`hidden` contra `flex`) hace el
  ocultamiento real en el navegador, el atributo `hidden` acompaña para tecnologia asistiva que lo
  lea directo, y un renderizado condicional deja el cuerpo SIN HIJOS, de modo que las tarjetas y
  sus manejadores no estan montados mientras el panel esta cerrado. El cuerpo se queda en el DOM
  para que `aria-controls` del disparador resuelva.

  La preferencia vive en `sessionStorage`, no en `localStorage`: "por la sesion" es lo que pide el
  AC, y `localStorage` habria derrotado en silencio el colapsado por defecto en el siguiente
  ingreso. La clave es POR SUPERFICIE — `csm.my-day.suggested-panel-open` y
  `csm.account.{id}.suggested-panel-open` — porque una sola clave compartida hacia que abrirlo en
  cualquier cuenta lo abriera en My Day y al reves. My Day conserva la clave original a proposito,
  para no perder lo guardado antes del cambio.

  ## Inferred technical tests

  Es interfaz pura, asi que la prueba no manual correcta tiene dos mitades.

  La primera es ejecutar las suites del repo y, sobre todo, MEDIR SI SIRVEN: el ticket afirma que
  estuvieron verdes contra una pagina rota, y esa afirmacion se podia comprobar reintroduciendo el
  defecto. La segunda es ejercitar los cuatro criterios en la interfaz desplegada leyendo
  `getComputedStyle`, el contenido real del almacenamiento y el contador de navegaciones del
  documento, mas dos inyecciones de fallo sobre el codigo desplegado: almacenamiento bloqueado y
  endpoint de sugerencias caido.

  Todo resulto ejecutable aqui. Ningun escenario quedo pendiente de una persona.

  ## Lo que el ticket declara final NO es lo que esta desplegado

  El ticket dice "completed by #197 403ab82". El entorno sirve algo posterior: el panel trae el
  boton "View all suggested tasks" y la vista el filtro "Due today", los dos del PR 200
  (048eb5d). El hook de persistencia es BYTE-IDENTICO entre 403ab82 y main, asi que los cuatro
  criterios se leen igual sobre el build desplegado; el componente si cambio. La consecuencia
  concreta esta en el escenario 7.

