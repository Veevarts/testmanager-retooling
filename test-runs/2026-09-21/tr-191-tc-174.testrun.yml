    status: passed
    executedAt: "2026-09-21T22:18:00Z"
    stepResults: []
    actual: |
      La pantalla dice, encabezando la lista de eliminados:

        "Deleted items are kept for 30 days."

      En el backend no hay nada que lo cumpla. Las unicas sentencias que borran acciones de
      verdad estan en el harness de pruebas limpiando sus propios fixtures. Ninguna busqueda de
      retencion, purga o barrido devuelve un proceso, cron o lambda que borre esas filas.

      Hoy eso juega a favor del criterio: el registro se conserva mas de lo prometido, que es
      exactamente lo que el ticket pide. El problema es de otro tipo. Al CSM se le dice que lo que
      declina se limpia solo en un mes, y no es cierto — decide sobre informacion falsa.

      Y al reves: el dia que ese barrido se implemente se lleva el denominador del reporte. La
      membresia de lote cae en cascada con la accion, asi que borrar la sugerencia borra el hecho
      de que fue mostrada, y la tasa de aceptacion de los lotes viejos se recalcularia sobre un
      total mas chico sin que nada avise.

      pre-fix -> post-fix -> objetivo cumplido?: el criterio pedia que no fuera un borrado real
      -> no lo es, nada borra nunca -> SI, y queda anotada la contradiccion con la copia.
    notes: >-
      **PASS con observacion.** No es defecto del cambio: es una promesa de interfaz sin respaldo.
