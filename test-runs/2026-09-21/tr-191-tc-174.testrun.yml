notes: |
  ## Solution understood

  Una sugerencia de la IA deja de ser una tarea. Ahora es una propuesta con exactamente dos
  salidas: Accept la convierte en tarea en el mismo registro y sin crear caso de Salesforce, y
  Decline la marca `Rejected` con `deleted_at`, o sea borrado blando y restaurable.

  El titulo del ticket quedo viejo. El product owner dicto (ruling R9 del PR) que completar no es
  una operacion valida sobre algo que todavia no es tarea, asi que "Ignore" es Decline y
  "Mark as Done" es el Mark Complete que ya existia sobre la tarea ya aceptada. Los criterios se
  leen contra lo entregado, no contra el titulo.

  La pieza fina esta abajo: `state` por si solo NO separa las disposiciones. Desde el ruling R11
  una sugerencia que nadie acciono vuelve al conjunto de candidatas en vez de expirar, y queda
  igual de `Suggested` que una pendiente — las separa un puntero mutable. Por eso la pertenencia
  a lote se guarda en una tabla append-only con su propio disparador: "fue mostrada alguna vez"
  es un hecho del pasado y no una propiedad de la fila de hoy, y es el denominador de la tasa.

  ## Inferred technical tests

  Tres mitades, y las tres resultaron ejecutables aqui:

  1. La interfaz desplegada, para los criterios que el CSM ve: que disposiciones ofrece una
     sugerencia, donde queda cada una, y que devuelve Restore.
  2. La API desplegada, para los negativos: actuar dos veces, completar sin aceptar, restaurar lo
     no borrado.
  3. Un Postgres real local con los adaptadores del producto, para los dos criterios que no
     tienen ninguna superficie: quien/cuando y la consulta de la tasa. No hay acceso de lectura a
     la Aurora de dev, asi que esto es el mecanismo ejecutandose, no el dato de dev, y se reporta
     asi.

  Ningun escenario quedo pendiente de una persona.

  ## Verde no es evidencia si no puede ponerse rojo

  El harness del repo dio 347/347 contra Postgres real. Eso solo dice que paso. Tres mutaciones,
  una por criterio, revertidas despues (arbol de git limpio al terminar):

    - quitar `deleted_at` del borrado blando         -> 3 checks en rojo
    - dejar de escribir la fila de auditoria         -> 2 checks en rojo
    - editar el bloque SQL DEL MARKDOWN del backlog  -> 2 checks en rojo

  La tercera es la que vale: no se toco una linea de codigo. La consulta del reporte se ejecuta
  desde el archivo de documentacion, asi que no puede pudrirse en silencio.

  ## La trampa que casi produce un falso negativo

  La primera carga de My Day mostro la pantalla ANTERIOR — una pestaña "Suggested Tasks · 228",
  sin panel de sugerencias — y parecia que la funcionalidad no estaba desplegada. No lo era: el
  navegador tenia cacheado un index.html viejo (cargo index-BRdzYlZp.js mientras el servidor
  referencia index-DTlapIiO.js). Cualquier veredicto de interfaz sobre un entorno desplegado
  empieza comparando el asset que el navegador cargo contra el que el servidor sirve.

