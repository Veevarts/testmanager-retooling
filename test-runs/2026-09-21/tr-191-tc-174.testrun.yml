  - testCaseId: "a31e7e95-a522-4d56-82de-4ace3f88f224"
    testCaseKey: TC-174
    scenarioTitle: "AC2 · Declining removes the suggestion from view and keeps the record"
    scenarioIndex: 2
    status: failed
    executedAt: "2026-09-21T22:09:00Z"
    stepResults: []
    actual: |
      Cuatro pasos de cinco hacen lo que el criterio pide. El quinto no.

        Decline                   panel "· 1" -> "· 0" y el vacio dice "All suggestions triaged."
                                  "Deleted · 0" -> "Deleted · 1"
                                  aviso "Suggestion declined" con accion "Undo"
        pestaña Deleted           encabezado "Deleted items are kept for 30 days."
                                  fila: "... · Task · deleted Sep 21, 2026"  [Restore]
                                  ^^^^ AQUI FALLA
        Restore                   Deleted 1 -> 0, panel 0 -> 1: vuelve AL PANEL DE SUGERENCIAS,
                                  no al tablero
        Decline + Undo            panel 1 -> 0 -> 1, Deleted 1 -> 0: el deshacer del aviso la
                                  devuelve al panel

      LO QUE FALLA. La fila dice "Task" cuando es una sugerencia declinada. Deberia decir
      "Suggested task", porque restaurarla la devuelve al panel y no al tablero — y ese es
      justamente el dato que el CSM necesita antes de tocar Restore.

      La API devuelve lo necesario para acertar:

        { "kind": "task", "state": "Rejected", "stateBeforeDelete": "Suggested", ... }

      El backend deriva `kind` de `state`, que tras declinar vale `Rejected` para una sugerencia
      y para una tarea, asi que `kind` vale 'task' en los dos casos. El DTO del backend agrego
      `stateBeforeDelete` explicitamente para esta etiqueta y lo dejo escrito en el comentario del
      campo. El frontend etiqueta con `kind`, y su esquema de validacion ni siquiera parsea
      `stateBeforeDelete`: el campo llega en la respuesta y se descarta. Cero ocurrencias del
      nombre en todo el repositorio de frontend.

      Correccion: dos lineas del frontend, una en el esquema y otra en la etiqueta.

      pre-fix -> post-fix -> objetivo cumplido?: declinar debia conservar el registro y sacarlo de
      la vista -> lo conserva, lo saca, lo restaura correctamente al estado previo, PERO la
      pestaña que lo muestra no distingue que es -> NO, por la etiqueta.
    notes: >-
      **FAIL.** No hay perdida de dato y la base distingue bien: falla la etiqueta, en la
      distincion que el propio comentario del frontend dice que importa. Reportado en IM-1234 y
      comentado en el "PR #196" de MigrationAppFrontend.
