    scenarioTitle: >-
      AC1 · An administrator targets a General NPS survey to manually entered users end to end
    scenarioIndex: 0
    status: passed
    executedAt: "2026-09-21T14:58:00Z"
    stepResults: []
    actual: |
      Ejecutado en la interfaz desplegada, con captura por paso.

      Al seleccionar el subject "General NPS" el formulario entra en modo general: el Type queda fijo
      en "NPS (0-10)" como campo de solo lectura y aparece el bloque "General NPS delivery" con
      "Show after User.CreatedDate 30 days" y "Show after login 30 seconds". Con ese modo activo, los
      tres radios de audiencia estan presentes:

        To everyone                    (marcado por defecto)
        To an organization / museum
        To specific users              <- la opcion que agrega el ticket

      Al marcarla aparece "Respondent IDs or emails (required)" con su texto de ayuda sobre separar
      por linea, coma o punto y coma. Se cargaron dos identificadores, uno por linea, y se guardo.

      Al reabrir con Edit, el SEGUNDO control de audiencia (el desplegable del formulario de edicion)
      ofrece las mismas tres opciones y tiene "Specific users" seleccionada, que es lo que el AC pide
      al hablar de la opcion "disponible junto a" las otras dos. Los valores se conservan textuales:

        audience              specific_users
        audienceDetails       005QaTc172AAA\nqa.tc172@example.com
        isGeneralSurvey       true
        generalClientOrgId    null
        accountCreatedDelayDays 30

      pre-fix -> post-fix -> objetivo cumplido?: el radio de usuarios especificos estaba oculto para
      encuestas generales y el servidor rechazaba esa audiencia con 400 -> la opcion aparece en los
      dos controles, se guarda y persiste -> SI.
    notes: >-
      **PASS.** Siete capturas numeradas bajo attachments/tr-189-tc-172/ui/. La encuesta de prueba (id 26, prefijo "QA TC-172") se conserva DESACTIVADA: el entorno no tenia ninguna General NPS activa antes de la corrida y quedo igual al cerrar.
