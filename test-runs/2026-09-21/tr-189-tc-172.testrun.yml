  - testCaseId: "dcb92b0c-8c8f-465c-b03d-d98c69b3f47b"
    testCaseKey: TC-172
    scenarioTitle: >-
      The list of targeted identifiers is not exposed on public survey responses
    scenarioIndex: 7
    status: passed
    executedAt: "2026-09-21T15:02:00Z"
    stepResults: []
    actual: |
      El hallazgo mas importante de esta corrida, y no esta en ningun criterio de aceptacion.

      Al correr el test del PR "targets surveys to explicit respondent IDs or emails" contra el
      codigo PRE-FIX, la asercion que falla es exactamente esta:

        actual:   [ '005PayAAA\nimplementation@example.com' ]
        expected: [ null ]

      Es decir: ANTES de este PR, cualquier llamador anonimo que pidiera las encuestas de una feature
      recibia, dentro del cuerpo de la encuesta, la lista de Salesforce User IDs y DIRECCIONES DE
      CORREO que el administrador habia cargado como destinatarios. No hacia falta coincidir con la
      audiencia: la lista viajaba en la respuesta.

      NO es un defecto de este PR. Es un hueco PREEXISTENTE, en las encuestas de feature con
      specific_users que existen desde IM-967, que este PR cierra con toPublicSurvey. Ni la
      descripcion del PR ni el ticket lo mencionan.

      Verificado en vivo sobre el entorno desplegado:
        GET /api/surveys/26        (publico) -> audienceDetails: null
        GET /api/admin/surveys/26  (admin)   -> audienceDetails: "005QaTc172AAA\nqa.tc172@example.com"

      El reparto es el correcto: el administrador necesita ver y editar la lista, y las rutas de
      admin estan detras de requireAdminAuth, que cubre todo el namespace /api/admin. El resto de la
      encuesta (pregunta, audiencia, tipo, escala) si viaja por el camino publico; solo se omite la
      lista.

      pre-fix -> post-fix -> objetivo cumplido?: la lista de destinatarios era publica -> ya no lo es,
      y el camino de admin la conserva -> SI.
    notes: >-
      **PASS.** Se levanta la observacion O1, que no es defecto de este PR: conviene que el equipo sepa que la exposicion existia antes, para valorar si algun entorno con encuestas specific_users de feature estuvo publicando correos, y que este cambio de contrato no esta documentado en el ticket.
    attachments:
      - name: comparison-matrix.txt
        path: attachments/tr-189-tc-172/scenario-8-exposure/comparison-matrix.txt
        mimeType: text/plain
      - name: dev-tests-on-prefix-server.log
        path: attachments/tr-189-tc-172/scenario-0-unit-tests/dev-tests-on-prefix-server.log
        mimeType: text/plain
    defects: []

  - testCaseId: "dcb92b0c-8c8f-465c-b03d-d98c69b3f47b"
    testCaseKey: TC-172
    scenarioTitle: >-
      A matching email alone is not enough: General NPS still requires a respondent ID and an organization
    scenarioIndex: 8
    status: passed
    executedAt: "2026-09-21T14:45:00Z"
    stepResults: []
    actual: |
      Dos requisitos de contexto que el ticket no distingue, verificados con pruebas propias:

        organizacion + respondentId que coincide                 -> entregada
        organizacion + SOLO email que coincide, sin respondentId -> [] (general_respondent_missing)
        organizacion + respondentId ajeno + email que coincide   -> entregada
        SIN organizacion + respondentId que coincide             -> []

      El ticket declara la audiencia manual como alcance GLOBAL. Eso es cierto para la ACTIVACION
      (choca con cualquier otra General NPS activa), pero NO exime al embebedor de mandar organizacion
      en la ENTREGA: selectEligibleGeneralSurveys devuelve vacio cuando no hay clave de organizacion
      en el contexto, sea cual sea la audiencia.

      Ademas, para General NPS la comprobacion de respondentId corre ANTES de evaluar la audiencia.
      Un administrador que cargue SOLO emails, y cuyo embebedor no mande respondentId, no entregara
      la encuesta a nadie.

      pre-fix -> post-fix -> objetivo cumplido?: los AC dicen "after all other delivery rules pass",
      asi que el comportamiento observado los cumple -> SI, sin incumplimiento.
    notes: >-
      **PASS.** Se levanta la observacion O2, que no es defecto: el ticket usa "global" para dos cosas distintas y eso puede llevar a un administrador a esperar entrega sin contexto de organizacion. El README del PR si documenta el requisito de respondentId; el de organizacion no lo documenta ninguno de los dos.
    attachments:
