    status: passed
    executedAt: "2026-09-21T14:45:00Z"
    stepResults: []
    actual: |
      El test del dev solo cubre la regresion de las encuestas de feature. QA agrego el resto, que es
      donde estaba el riesgo real: `surveyAllowsClientOrg` ahora devuelve true para specific_users, y
      habia que comprobar que eso no ensancha el alcance de las otras audiencias.

        General NPS everyone, destinatario de la organizacion A      -> entregada
        General NPS everyone, destinatario de la organizacion B      -> entregada
        General NPS organization con lista vacia                     -> 400, sigue exigiendo >= 1
        Retraso de 30 dias sobre audiencia manual, a los 12 dias     -> retenida
        Retraso de 30 dias sobre audiencia manual, a los 40 dias     -> entregada
        Una respuesta por destinatario, despues de responder         -> no se repite
        Encuesta de feature, respondentId que coincide               -> entregada
        Encuesta de feature, email con otro casing                   -> entregada
        Encuesta de feature, respondentId ajeno                      -> retenida

      El retraso y la regla de una-respuesta se verificaron SOBRE UNA ENCUESTA CON AUDIENCIA MANUAL,
      que es donde podrian haberse perdido: la audiencia entra por una rama nueva del filtro, pero
      las reglas de entrega siguen evaluandose en el mismo evaluateSurveyEligibility de siempre.

      Suites completas sobre ceae03b1: server 119/119, client 64/64. Linea base pre-fix 117/117 y
      62/62. Los tests nuevos son 2 y 2; ningun test preexistente cambio de resultado.

      pre-fix -> post-fix -> objetivo cumplido?: nueve comportamientos previos medidos, nueve
      identicos -> SI.
    notes: "**PASS.** Sin regresiones."
