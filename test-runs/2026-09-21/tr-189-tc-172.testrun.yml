  - testCaseId: "dcb92b0c-8c8f-465c-b03d-d98c69b3f47b"
    testCaseKey: TC-172
    scenarioTitle: >-
      AC5 · The survey is withheld and fails closed when no identifier matches
    scenarioIndex: 4
    status: passed
    executedAt: "2026-09-21T14:40:00Z"
    stepResults: []
    actual: |
      Con un respondentId y un email que no estan en la lista, la respuesta viene vacia. El rechazo
      es por AUDIENCIA y no por otra regla de entrega, y esto se prueba de forma directa: el test del
      dev instrumenta el store y cuenta las lecturas de historial de respuestas y de eventos en el
      caso bloqueado. El contador queda en 0, o sea que el filtro corta antes de mirar el historial.

      Tres formas de "nadie coincide", todas retenidas:
        identificadores distintos                      -> []
        lista con un solo ID y llega otro              -> []
        intento de dejar la lista vacia por PUT        -> 400, no se puede llegar a ese estado

      pre-fix -> post-fix -> objetivo cumplido?: la audiencia no existia -> falla cerrado por los tres
      caminos, sin filtrar la existencia de la encuesta -> SI.
    notes: >-
      **PASS.** El fallo cerrado es la propiedad de seguridad central de este ticket, porque los identificadores no se verifican contra Salesforce: si el emparejamiento fallara abierto, una encuesta mal configurada llegaria a todo el mundo.
    attachments:
      - name: comparison-matrix.txt
        path: attachments/tr-189-tc-172/scenario-3-4-5-eligibility/comparison-matrix.txt
        mimeType: text/plain
