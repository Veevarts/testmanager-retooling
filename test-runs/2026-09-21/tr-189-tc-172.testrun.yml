  - testCaseId: "dcb92b0c-8c8f-465c-b03d-d98c69b3f47b"
    testCaseKey: TC-172
    scenarioTitle: >-
      AC6 · Manual targeting is a global activation scope and collides with any other active General NPS
    scenarioIndex: 5
    status: passed
    executedAt: "2026-09-21T15:00:00Z"
    stepResults: []
    actual: |
      Confirmado en el harness Y en vivo sobre el entorno desplegado.

      En vivo: con la encuesta 26 activa, crear otra General NPS con audiencia manual devolvio

        409 {"error":"An active general survey already applies to this audience (survey 26)."}

      y no se creo nada. El mensaje nombra la encuesta en conflicto, que es lo que un administrador
      necesita para resolverlo.

      En el harness, la transicion inversa tambien se verifico: una General NPS de organizacion que
      pasa a audiencia manual queda con generalClientOrgId en null, y un PUT posterior que intente
      volver a fijarlo se ignora mientras la audiencia siga siendo manual. Despues del cambio, la
      encuesta se entrega desde OTRA organizacion, que es lo que significa "global".

      pre-fix -> post-fix -> objetivo cumplido?: el pre-fix devolvia 400 "esta audiencia no se admite
      para encuestas generales" -> ahora devuelve 409 "esta audiencia se admite, pero su alcance es
      global y ya hay otra activa" -> SI. La diferencia no es el codigo de estado sino su significado.
    notes: >-
      **PASS.** No queda estado intermedio en el que una encuesta sea a la vez global y de una organizacion: el campo se fuerza a null en create y en update.
