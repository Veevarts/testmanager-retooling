      El test del dev cubre el ID con el MISMO casing con que se configuro, asi que QA escribio la
      prueba de casing que faltaba. Con "005EmABCdefGHIjk" configurado:

        respondentId 005EmABCdefGHIjk   (exacto)       -> [encuesta]
        respondentId 005emabcdefghijk   (minusculas)   -> [encuesta]
        respondentId 005EMABCDEFGHIJK   (mayusculas)   -> [encuesta]
        respondentId 005EmABCdefGHIjX   (otro ID)      -> []

      La encuesta devuelta llega con audienceDetails en null, o sea sin la lista de destinatarios.

      pre-fix -> post-fix -> objetivo cumplido?: en el pre-fix la encuesta no se puede ni crear
      (400) -> entrega por ID, insensible a mayusculas, y retiene al que no esta -> SI.

      NOTA ligada al riesgo R5: esa insensibilidad es la normalizacion vigente que el ticket manda
      respetar, pero implica que dos Salesforce User IDs que solo difieran en mayusculas se tratan
      como el mismo. El endurecimiento esta declarado fuera de alcance y se sigue en IM-1280.
