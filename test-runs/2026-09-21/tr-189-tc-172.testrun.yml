schemaVersion: "1.0"
id: tr-7f3a6c21-0b58-4e9d-9c14-2a8d5e7b4f60
key: TR-189
title: >-
  TR-189 · IM-1271 · TC-172 · General NPS targeting to manually entered specific users — 9/9 PASS.
  La audiencia manual entrega solo a quien coincide y falla cerrado con todos los demas; ademas el
  PR cierra una exposicion previa de la lista de destinatarios por los endpoints publicos.
status: completed
environment:
  name: >-
    Repositorio Veevarts/survey-tool: pre-fix 1ad3b4ce contra post-fix ceae03b1, un solo commit de
    distancia (squash merge del PR 76). Suites node:test del server y del client, mas siete pruebas
    escritas por QA sobre el mismo harness de frontera de API con store en memoria. Los escenarios
    de interfaz se ejercitaron en https://surveytool.dev.veevart.ai (rama develop) con sesion de
    administrador y captura por paso. Ninguna organizacion de Salesforce fue tocada.
  buildVersion: >-
    Mixed — backend/API (routes/surveys.ts, routes/features.ts, lib/surveyRuntime.ts) + UI
    (pages/SurveysPage.tsx) + docs (README.md). Sin cambios de dependencias ni de infraestructura.
startedAt: "2026-09-21T14:10:00Z"
completedAt: "2026-09-21T15:15:00Z"
executedBy: codex

notes: |
  ## Solution understood

  Antes de este PR la General NPS solo admitia dos audiencias. El formulario escondia el radio de
  usuarios especificos cuando la encuesta era general, y si por cualquier via llegaba esa audiencia
  al servidor, `validateGeneralSurveyScope` la rechazaba con "General surveys can only target
  everyone or organizations."

  El PR habilita la tercera audiencia de punta a punta. En el cliente extrae `SURVEY_AUDIENCE_OPTIONS`
  como unica fuente para los dos controles de audiencia (los radios del flujo enfocado y el
  desplegable del formulario de edicion), con lo que la opcion deja de depender de una condicion
  duplicada. En el servidor `generalSurveyScope` declara `specific_users` como alcance GLOBAL,
  `surveyAllowsClientOrg` deja pasar esa audiencia, y `selectEligibleGeneralSurveys` suma un filtro
  nuevo que exige coincidencia contra la lista configurada mediante el matcher que ya existia desde
  IM-967. `generalClientOrgId` se fuerza a null cuando la audiencia es manual, en el create y en el
  update, porque un destinatario suelto no pertenece a ninguna organizacion.

  Efecto lateral no descrito en los criterios de aceptacion: el PR agrega `toPublicSurvey`, que
  anula `audienceDetails` en las respuestas publicas. Ver el escenario 8: cierra una exposicion
  PREEXISTENTE.

  ## Inferred technical tests

  El cambio no tiene superficie de datos ni de org, asi que la prueba no manual correcta es doble.
  Primero, ejecutar las suites del repo sobre los dos commits y, sobre todo, injertar los tests del
  PR en el codigo pre-fix para comprobar que EJERCITAN el cambio en vez de acompañarlo. Segundo,
  escribir pruebas propias contra las rutas reales para los caminos que el dev no cubre: casing del
  Salesforce User ID, vaciado de la lista por API, regresion de las audiencias previas sobre General
  NPS, y los dos requisitos de contexto que el ticket no documenta.

  Los AC1 y AC2 viven en la pantalla y el cliente no tiene harness de componentes, asi que se
  ejecutaron en vivo sobre el entorno desplegado con captura por paso.

  ## Verificacion de que el entorno desplegado tiene el cambio

  Riesgo R1 del test case: el PR esta mergeado a `develop`, no a `main`
  (`git merge-base --is-ancestor ceae03b1 origin/main` da falso). Se comprobo el entorno por los dos
  lados antes de calificar nada. Cliente: el bundle servido contiene el id `survey-specific-users`,
  que nace en este PR. Servidor: el intento de activar una segunda General NPS manual devolvio 409
  con el mensaje nuevo, no el 400 del pre-fix.

  ## Correccion de metodo durante la ejecucion

  Una primera version de la prueba del retraso por fecha de creacion mandaba `today` en el cuerpo de
  la peticion publica y daba un falso positivo de defecto. El endpoint publico NO acepta override de
  fecha: `toSurveyDeliveryContext` solo lo permite con `allowDateOverride`, reservado a consultas de
  admin. Se corrigio la prueba para calcular las fechas relativas al dia real del servidor ANTES de
  calificar el escenario. No habia defecto.

