  - testCaseId: "dcb92b0c-8c8f-465c-b03d-d98c69b3f47b"
    testCaseKey: TC-172
    scenarioTitle: >-
      AC2 · Saving is blocked when the specific-user audience has no identifier
    scenarioIndex: 1
    status: passed
    executedAt: "2026-09-21T14:59:00Z"
    stepResults: []
    actual: |
      Con la pregunta principal cargada y el campo de identificadores vacio, pulsar Create no crea
      nada y abre el dialogo "Complete required information" con un unico problema listado:

        "Add at least one respondent ID or email for the specific user audience."   [Go to field]

      Al pulsar "Go to field", el elemento con el foco es:

        id             survey-specific-users
        tag            TEXTAREA
        label          Respondent IDs or emails (required)
        aria-required  true

      Es exactamente el cambio del PR: antes el destino de la validacion era
      "survey-audience-details", el contenedor, y no el campo que el administrador debe llenar. El
      formulario sigue montado y la pregunta principal intacta tras cerrar el dialogo.

      La validacion es SIMETRICA entre crear y actualizar: un PUT con audienceDetails vacio sobre una
      encuesta ya creada devuelve 400 y la lista previa sigue vigente. No hay camino por el que una
      encuesta manual quede activa con la lista vacia.

      pre-fix -> post-fix -> objetivo cumplido?: en el pre-fix ni siquiera se podia llegar a este
      estado y el 400 del servidor hablaba de la audiencia, no del campo faltante -> el bloqueo ocurre
      con el mensaje correcto y lleva al campo exacto -> SI.
    notes: "**PASS.**"
