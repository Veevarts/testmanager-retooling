notes: >-
  ## Solution understood — sales_order_only_pledge.sql pasa INNER JOIN TransactionAgg → LEFT JOIN y elimina el
  HAVING SUM(el.NetAmount) <> 0 (side-effect de IM-87 dc93ae2): el agregado sigue siendo la fuente del monto
  (COALESCE(ta.Amount, 0)) pero ya no decide si la fila existe. Con eso todo pledge sin SALESORDER acuña su POS
  Purchase, que donation_pledges.sql referencia incondicionalmente (COALESCE(so.ID, ft.ID)); antes la referencia
  quedaba colgada, fallaba la Opportunity completa en el load y bloqueaba sus Pledge Payments. charge_without_order.sql
  familia 3 (CTE PledgeTransactions) se relaja en conjunto a espejo literal del gate nuevo (TYPECODE=1 + NOT EXISTS
  SALESORDER, sin line-item join): +5 Charges resueltos en Illinois, +0 tucson/Long Island.
  ## Inferred technical tests — (1) suite query-regression jest en branch [auto: 553 PASS]; (2) integration spec
  PRE (SQL de merge-base) vs POST (branch) vía testcontainers [auto: PRE 3 failed/2 passed reproduce el bug,
  POST 5/5 PASS; requirió patch local .withStartupTimeout(300_000) — colima x86_64 tarda ~81s]; (3) wrapper
  agregado safesql del universo pledges, ambos gates en un snapshot [auto en tucson: dangling 1→0, conservación
  exacta; illinois_2 BLOCKED: endpoint NLB stale]; (4) wrappers agregados charge PRE/POST [BLOCKED: clasificador
  de permisos del harness denegó la corrida; cobertura de contrato vía 22 tests del spec].
