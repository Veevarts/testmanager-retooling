title: "TR-159 · IM-1147 · TC-144 · Migración DynamoDB — 5/8 PASS · 3 PARTIAL · 1 FAIL de diseño (adapter usa Scan en public path aunque los GSIs existen · defecto IM-1187 High)"

description: |
  QA de IM-1147 (Migrate Survey Tool persistence to DynamoDB) del epic IM-970. QA
  Sub-task: IM-1186. Corrida ejecutada POST-MERGE: los seis PRs del tren
  (#35 CDK infra, #45 runtime, #48/#49 promote, #51/#52 deploy stateful) están
  en `main` y dev sirve contra DynamoDB.

  ## Veredicto

  **5 PASS · 3 PARTIAL · 1 FAIL · 0 not-run.** El FAIL es AC3 y hay defecto
  levantado (**IM-1187 High**). Los 3 PARTIAL son AC6 (validación del importer),
  AC7 (rollback path) y AC8 (postura ops en prd) — ninguno bloquea el release,
  todos son follow-ups documentados en el dossier.

  ## Hallazgo principal — IM-1187 (High)

  El adapter runtime `server/src/data/dynamodbStore.ts` (646 líneas) NO usa los
  GSIs que el CDK sí define. En vez de `QueryCommand` sobre GSI, la mayoría de
  reads son `ScanCommand` con `FilterExpression` sobre la tabla base.

  · CDK: 12 GSIs correctos entre las 4 tablas non-settings (data-model.ts)
  · Runtime: 1 Query en toda la clase (listResponseActions), 8 Scan-based reads
  · Public-path afectados: `/api/surveys/general/eligible`, `/api/features/:id/surveys`,
    `/api/features/:id/respondent-state/:respondentId`, `/api/features?slug=X`

  Consecuencias: cost lineal con el tamaño de tabla, latencia lineal, escrituras
  pagan 4 GSI writes que nunca se consultan, y amplificación de DoS sobre
  endpoints públicos. Arreglo well-scoped: reemplazar `.scan(...)` por
  `.query({ IndexName: 'GSIx', ... })`.

  ## Lo que sí funciona (contexto positivo)

  · Contratos públicos preservados byte a byte (AC4 PASS live)
  · Admin CRUD + Dashboard + CSV export coherente (AC5 PASS, reusa TR-158)
  · CDK vitest suite cubre 5 tablas + todos los GSIs + prd protection (AC2 PASS)
  · Env isolation por naming pattern + rejection de aliases (AC1 PASS code-level)
  · Import snapshot idempotente + preserva IDs (AC6 código OK)
  · Encryption default AWS-KMS + PITR prd/stg + deletion protection (AC8 CDK OK)
  · 0 dependencias vulnerables (net −1079 líneas en package-lock, quita SQLite)

  ## Alcance no cubierto en esta corrida

  · Live cross-env AWS check (AC1) y live prd ops posture (AC8): survey-tool
    tables NO están en la cuenta AWS `veevart-tooling` (287043460717) donde
    tengo SSO. La cuenta de survey-tool es otra y no está en mi config local.
    Marcado como DEFERRED; la evidencia CDK + vitest cubre el bar del release.
  · Rollback simulation (AC7): requiere deploy real; no ejecutable sin acceso
    al pipeline de prd.
  · Import snapshot real (AC6): no hay snapshot JSON en el repo; solo se
    validó por code review.

