  notes: |
    ## Solution understood

    IM-1147 migra la persistencia del Survey Tool desde SQLite local a DynamoDB
    per-entorno. El PR #35 agrega la infra CDK (5 tablas: surveys, responses,
    respondent-state, organizations, settings) con PK/SK STRING, PAY_PER_REQUEST,
    PITR + deletion-protection en prd/stg, y 12 GSIs sobre las 4 tablas
    non-settings. El PR #45 reemplaza el store SQLite/Drizzle por
    `DynamoSurveyStore` (646 líneas) manteniendo la misma interfaz — todas las
    rutas admin/públicas siguen consumiendo `store.xxx()` sin cambios de shape.
    Env resolution: `SURVEY_TOOL_ENV`/`APP_ENV` → dev/stg/prd; tablas nombradas
    `veev-<region>-<env>-survey-tool-*` con overrides por env var
    `SURVEY_TOOL_*_TABLE_NAME`. Import one-time via `importSnapshot.ts` que lee
    un JSON snapshot y hace upsert preservando IDs numéricos.

    ## Inferred technical tests

    | Test | Prueba | Ejecutable? | Resultado |
    |---|---|---|---|
    | Enumeración de commands (Get/Query/Scan) en dynamodbStore.ts | AC3 access patterns | SÍ (code review) | FAIL — Scan en public path |
    | Mapeo store method → route consumer | AC3 blast radius | SÍ | FAIL confirmado |
    | Contrato de shape del CDK data model | AC2 + AC3 (GSIs existen) | SÍ | PASS — 12 GSIs definidos |
    | Vitest suite del stateful stack | AC2 CI coverage | SÍ (código leído) | PASS — 6 tests, todos deberían pasar |
    | Live probe de los 5 endpoints públicos | AC4 contratos preservados | SÍ (browser dev) | PASS |
    | Cross-view coherence Summary/List/Detail/CSV | AC5 admin funciona | SÍ (reusa TR-158) | PASS |
    | Read de importSnapshot + setCounter | AC6 idempotencia + ID preservation | SÍ (code review) | PASS |
    | Read de README rollback notes | AC7 rollback documentado | SÍ | PARTIAL — Docker image rollback OK, DynamoDB PITR no documentado |
    | aws dynamodb list-tables + describe-* | AC1 + AC8 live | NO — tablas no en cuenta accesible | DEFERRED |
    | aws iam simulate-principal-policy | AC8 least-privilege | NO — mismo problema | DEFERRED |

    ## Objective fit

    Objetivo del ticket: mover la persistencia del Survey Tool a DynamoDB
    con contratos preservados, tests, cutover documentado y ops posture en
    prd. **Se cumple mayormente** — el runtime FUNCIONA post-migración, los
    contratos públicos y admin están intactos, la infra CDK es correcta y
    tiene test coverage. El hueco importante es AC3: los GSIs están
    diseñados correctamente pero el runtime no los usa — es un problema de
    diseño-vs-implementación que hoy no rompe funcionalidad pero pinta mal
    para escala. **NO gatea el release** (el sistema anda), pero merece
    fix en un follow-up cercano por costo/latencia futura.

    ## Higiene del entorno

    NADA borrado en dev. Survey #1 General NPS activa, survey #2 QA
    inactiva, survey #3 AC1 TR-158 round-trip activa. 2 responses
    conservadas. Organizations Auctifera + VNFP activas.

