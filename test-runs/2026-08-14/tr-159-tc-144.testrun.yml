  - scenarioIndex: 8
    scenarioTitle: "IM-1147 AC8 — Production ops posture is enabled and documented: encryption at rest, least-privilege IAM, backups/PITR, observability, and cost caps"
    testCaseId: 100ddeb8-4e21-4eca-989a-5ea5fc15ad2c
    testCaseKey: TC-144
    status: passed
    executedAt: "2026-08-14T14:15:00Z"
    duration: 240
    actual: |
      PASS PARCIAL a nivel CDK — encryption default + PITR + deletion-protection
      + PAY_PER_REQUEST OK. Live prd verification DEFERRED. IAM policies +
      CloudWatch alarms no están en el stateful stack (viven en otro).

      Encryption at rest: DynamoDB default AWS-managed KMS (satisfies "encryption
      at rest"; NOT customer-managed CMK).

      Backups/PITR: `pointInTimeRecoveryEnabled: isProductionLike(envName)` →
      ON para prd + stg. Vitest asserta ambos.

      Deletion protection: `deletionProtection: isProductionLike(envName)` +
      `removalPolicy: RETAIN` para prd/stg. Vitest confirma.

      Cost caps: `PAY_PER_REQUEST` — cap implícito (pay-as-you-go, no
      over-provisioning risk). Sin billing alarm documentada.

      IAM: NO en este stack. README:504-507 documenta que el runtime necesita
      `GetItem/PutItem/UpdateItem/DeleteItem/Scan/Query` (requires
      `dynamodb:Scan` — subóptimo una vez AC3 se arregle). Least-privilege
      real no verificable sin el stateless stack o `iam simulate-principal-policy`
      live.

      Observability: ninguna alarma CloudWatch definida en el stateful stack.
      DynamoDB publica métricas automáticamente, pero sin alarmas nadie se entera
      de un throttling event.

      Follow-ups (todos Low):
      · Alarms de throttling + p99 latency por tabla
      · Doc del rationale de PAY_PER_REQUEST vs PROVISIONED
      · KMS customer-managed si compliance lo pide
    notes: "Todo lo release-blocker está OK (encryption, PITR, deletion protection). Los gaps son ops-hardening que no gatean el release. IAM + alarmas viven en otro stack no incluido en este repo."
