  - scenarioIndex: 3
    scenarioTitle: "IM-1147 AC3 — Every runtime application view has a documented DynamoDB query path and does not rely on broad Scan for normal traffic"
    testCaseId: 100ddeb8-4e21-4eca-989a-5ea5fc15ad2c
    testCaseKey: TC-144
    status: failed
    executedAt: "2026-08-14T13:50:00Z"
    duration: 600
    actual: |
      **FAIL — defecto IM-1187 (High) levantado.**

      El adapter runtime `server/src/data/dynamodbStore.ts` (646 líneas)
      ejecuta `ScanCommand` con `FilterExpression` sobre la tabla base para
      TODOS los reads no-triviales, incluyendo endpoints públicos:

      | Store method | Access | Endpoint público consumidor |
      |---|---|---|
      | `listActiveGeneralSurveys()` | Scan | `GET /api/surveys/general/eligible` |
      | `listSurveysByFeatureId()` | Scan Filter | `GET /api/features/:id/surveys` |
      | `getFeatureBySlug()` | Scan Filter | `GET /api/features/:slug` |
      | `countEvents()` / `listEvents()` | Scan Filter | `GET /api/features/:id/respondent-state/:respondentId` |

      Al mismo tiempo el CDK data model (`infra/lib/survey-tool-data-model.ts`)
      DEFINE 12 GSIs correctos para exactamente esos access patterns. Los
      keys de GSI ya se calculan en los helpers `surveyItem`, `responseItem`,
      etc. — pero el store nunca hace `QueryCommand({ IndexName: 'GSIx' })`.

      Total Query en el adapter: **1** (listResponseActions por responseId,
      línea 313). El resto del código es Scan.

      Impacto:
      · Cost: DynamoDB factura por ítems escaneados (Filter aplica DESPUÉS
        del scan). Cada Scan bill = full-table cost. Hoy despreciable, mañana
        no.
      · Latencia: crece linealmente con el tamaño de la tabla.
      · Writes: la responses table paga 4 GSI writes por put (los 4 GSIs
        definidos) — 5x cost por índices no consultados.
      · DoS surface: `/api/surveys/general/eligible` público → cada request
        dispara una Scan.

      Contradice AC3 verbatim: "each supported application view has a
      documented DynamoDB query path without relying on broad scans".
    notes: "Arreglo well-scoped: reemplazar cada método `.scan(...)` por `.query({ IndexName: 'GSIx', KeyConditionExpression: ... })`. Los GSI PKs ya están calculados en los item helpers. Defecto IM-1187 High con el detalle completo, prioridad de fix y test-post-fix sugerido."
    stepResults: []
    attachments:
