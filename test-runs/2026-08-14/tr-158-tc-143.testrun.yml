  notes: |
    ## Solution understood (delta desde TR-157)

    Nada cambió del lado server desde TR-157: features.ts sigue byte-idéntico entre main y
    staging, así que la ruta de eligibility, la validación de eventos y la audiencia se
    comportan igual. Del lado admin (IM-1176) los cambios son puramente UX en `client/`
    (29 archivos: nuevas SummaryDashboard.tsx / ResponsesDashboard.tsx / helpers en lib/).
    Del lado Salesforce, ambos launchers siguen sin desplegarse en las scratches de prueba,
    pero el server acepta el nuevo parámetro `salesforceOrgId` correctamente para las dos
    orgs (verificado hoy con la Auctifera Org Id).

    ## Inferred technical tests ejecutados en esta corrida

    | Test | Prueba | Resultado |
    |---|---|---|
    | features.ts diff main vs staging | AC8/AC9 attribution | PASS (byte-idéntico → IM-1185 preexistente) |
    | console.log audit main vs release branch | Regresión de higiene | FAIL Low (+20 console.log; +13 en archivos limpios) |
    | Admin form full round-trip (create/reload/edit/API) | AC1 IM-1176 | PASS byte-a-byte |
    | Live after-login modal en VNFP + submit + reload | AC3 half VNFP | PASS |
    | API contract `salesforceOrgId` para Auctifera | AC3 half Auctifera server-side | PASS |
    | /eligible matrix post-answer (4 combinaciones) | AC11 | PASS |
    | Dashboard Summary + Responses list + Detail + CSV | AC12 | PASS coherente |
    | 401 anónimo en /admin/* (re-confirmado por redirect a /login) | AC13 | PASS |
    | Package.json / lockfile diff | A06 vulnerable deps | PASS 0 cambios |
    | Search de secretos/PII en el diff | A02, PII | PASS 0 matches |

    ## Objective fit

    Objetivo del ticket: confirmar que la entrega completa de la General Survey está lista
    para liberar. **12/13 PASS + 1 FAIL preexistente sin regresión = release NO BLOQUEADO por
    QA.** El equipo decide si mergea con IM-1185 pendiente y con los 20 console.log adentro,
    o si pide primero que #2234 los quite antes de mergear (recomendado).

    ## Higiene del entorno

    Sigue la línea de TR-157: NADA se borra, todo queda como evidencia.
    · Survey #1 General NPS: activa.
    · Survey #2 QA TC-143 org-scoped feature-trigger: inactiva.
