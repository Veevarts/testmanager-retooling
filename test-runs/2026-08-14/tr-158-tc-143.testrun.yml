title: "TR-158 · IM-969 · TC-143 · Compuerta de release NPS — 12/13 PASS · 1 FAIL preexistente (IM-1185) · corrida COMPLETA · cierra los 5 not-run de TR-157 con evidencia en vivo (VNFP scratch, admin surveytool.dev)"

description: |
  Segunda pasada sobre TC-143 para cerrar los 5 escenarios `not-run` que TR-157 dejó abiertos
  y reverificar el FAIL. Ejecutada con acceso concedido por el usuario a admin
  `https://surveytool.dev.veevart.ai/admin/features` y a las dos scratches (VNFP
  `flow-site-19432-dev-ed`, Auctifera `nosoftware-fun-3261-dev-ed`).

  ## Veredicto

  **12/13 PASS · 1 FAIL · 0 not-run.** El FAIL sigue siendo AC8+AC9 por IM-1185 y sigue
  siendo **PREEXISTENTE** — re-verificado hoy: `server/src/routes/features.ts` es
  byte-idéntico entre `main` y `staging` (SHA `d103510c…`, md5 `a50debbc…`, 20 601 B en ambos).

  ## Qué se cerró vs TR-157

  | AC   | TR-157        | TR-158                                    |
  |------|---------------|-------------------------------------------|
  | AC1  | not-run       | **PASS** — round-trip completo en el admin: create → hard reload → edit → GET /api/admin/surveys, todo persistió byte-a-byte |
  | AC3  | not-run       | **PASS** con caveat — VNFP live modal+respuesta capturada paso a paso; Auctifera server-contract verificado (el server acepta `salesforceOrgId` y devuelve la general survey), launcher in-org sin desplegar en la scratch |
  | AC11 | not-run       | **PASS** — matriz de 4 llamadas al /eligible: respondent nuevo en la misma org sí ve la survey; el respondent que respondió NO la ve; sin respondent → []; otra org → []. Guard sessionStorage cerrado por (org+respondent) |
  | AC12 | not-run parcial | **PASS** — coherencia cruzada Summary=Responses=Detail=CSV, 2 responses / 28 columnas exportadas |
  | AC14 | not-run       | **PASS** — este dossier |

  ## Hallazgos que persisten y no bloquean el veredicto

  1. **IM-1185 (High, Sin iniciar)** — after-login rechaza impresiones/dismissals con 400, así
     que `maxImpressions`/`maxDismissals` no pueden dispararse en el modo que ships el release.
     Root cause byte-idéntico entre main y staging → NO es regresión, SHIPS igual. La decisión
     de merge la toma el equipo, no QA: el release no empeora la situación.

  2. **20 nuevos `console.log` en NFPFundraising #2234**, contrastados contra `main` hoy:
     `+7` en el archivo nuevo `npsWidget.js`, más `+13` en 6 archivos que hoy viven limpios en
     `main` (`PaymentHelper.js +4`, `ExhibitionWizardHelper.js +4`, `PaymentController.js +2`,
     `BoxMembershipDonationHelper.js +1`, `JournalEntryUpdateController.js +1`,
     `PaymentAssignmentHelper.js +1`). No es defecto funcional pero SÍ regresión de higiene
     sobre código productivo. Recomendación: stripping antes de merge o wrap en debug flag.
     No amerita defecto Jira aparte — queda como comentario en el PR #2234 y en este dossier.

  3. **Auctifera Org Id se persiste en minúsculas** (`00dem00000v5erwmaz`) mientras Salesforce
     lo sirve en case mixto (`00DEm00000V5eRWMAZ`). Hoy no se pierde data porque el launcher
     normaliza; un consumidor futuro que pase el Id crudo va a leer `[]`. Sev Low, hoy no
     bloquea nada, se declara en el dossier para que quede consciente en el equipo.

  4. **Endpoint público sigue devolviendo `audienceDetails` y `GSI1SK` para surveys
     org-scoped** — hallazgo re-report de TR-146/157, Sev Low, no cambió con este release.

  ## Alcance de la corrida

  Cubre el trabajo que entregan los tres PRs (#58, #2234, #2583). No cubre el epic completo
  IM-970 (15 hijos, 4 Finalizada / 2 Request Approved / 1 Rechazado IM-968 / 5 en vuelo / 4
  sin iniciar). Los AC heredados de TR-157 no se re-ejecutaron a pantalla completa hoy porque
  las rutas subyacentes están byte-idénticas — se re-confirmaron por sondas puntuales
  (Dashboard cuenta 2 orgs; SSO redirect en admin sin sesión; features.ts diff en cero).

