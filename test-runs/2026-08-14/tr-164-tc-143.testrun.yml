    actual: |
      Sanity check post-fix (fresh respondent qa-tr164-diag):
        GET /api/surveys/general/eligible?salesforceOrgId=00DEm00000V5eRWMAZ → 200 [{id:1}]
        POST /api/features/2/impressions {surveyId:1, ...}                    → 201 {"ok":true}
      Antes del fix esto era 400. Fix confirmado live.

      Setup temporal (revertido al final): PUT Survey #1 con maxImpressions=2, maxDismissals=2,
      triggerDetails="cooldownDays=30, generalTrigger=afterLogin, loginDelaySeconds=7".

      === AC9 · Max impressions (respondent qa-tr164-ac9-75215) ===
      step0 GET /eligible                → 200 [1]  PRE eligible
      step1 POST /impressions            → 201 {"ok":true}         ← was 400
      step1 GET /eligible                → 200 []   cut immediately
      step1 respondent-state s1:
             counters.impressionCount:   1  (was 0, evidence of persistence)
             counters.todayImpressionCount: 1
             global.surveysShownToday:   1 == maxSurveysPerDay:1   ← rule fired first
             limits.maxShowsPerDay: 2, maxDismissals: 2, cooldownDays: 30
      step2 POST /impressions            → 400 (survey not eligible)
      step3 POST /impressions            → 400

      === AC8 · Max dismissals (respondent qa-tr164-final-19493) TEXTBOOK PERFECT ===
      step0 GET /eligible                → 200 [1]  PRE eligible
      step1 POST /dismissals             → 201 {"ok":true}         ← was 400
      step1 GET /eligible                → 200 [1]  still eligible (1/2)
      step2 POST /dismissals             → 201 {"ok":true}
      step2 GET /eligible                → 200 []   CUT AT 2/2 exactly
      step3 POST /dismissals             → 400 (survey not eligible)

      === AC10 · Reglas combinadas (respondent qa-tr164-ac10-52754) ===
      Config: maxImpressions=2 · maxDismissals=2 · maxSurveysPerDay=1 · cooldownDays=30
      step0 GET /eligible                → 200 [1]
      step1 POST /impressions            → 201; GET /eligible → 200 [] (global cut)
      step2 POST /dismissals             → 201; GET /eligible → 200 []
      step3 POST /impressions            → 400 (already ineligible)
      step4 POST /dismissals             → 201

      Cleanup ejecutado: PUT Survey #1 revert a maxImpressions=null, maxDismissals=null. Estado
      post-corrida idéntico al baseline pre-corrida.
    notes: >-
      **AC8/AC9/AC10 PASS post-fix.** Los tres ACs bloqueados por IM-1185 en TR-157 y TR-158 quedan
