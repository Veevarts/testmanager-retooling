results:
  - testCaseId: 9fcc8577-5fca-4e24-8fa7-d883d4472164
    testCaseKey: TC-143
    scenarioTitle: "IM-969 AC5 + AC6 — Targeting specific organizations delivers only to the selected ones, and the selected list stays exactly as saved after reloading or editing (LIVE cross-org deep-dive)"
    scenarioIndex: 5
    status: passed
    executedAt: "2026-08-14T17:55:00Z"
    duration: 900
    stepResults: []
    actual: |
      Setup: Survey #2 activada con audienceDetails="00DEm00000V5eRWMAZ" (Auctifera only),
      maxImpressions=1, maxDismissals=1, triggerDetails="generalTrigger=afterLogin, loginDelaySeconds=30".
      Antes fue necesario desactivar Survey #1 (audience=everyone) porque el server rechazó
      con 409 "An active general survey already applies to this audience (survey 1)".
      Esa 409 es evidencia bonus del guard de overlap.

      Matriz cross-org contra `/api/surveys/general/eligible` (after-login endpoint):
      - A. salesforceOrgId=00DEm00000V5eRWMAZ (Auctifera in audience) → 200, 1 survey (Survey #2)
      - B. clientOrgId=flow-site-19432-dev-ed (VNFP subdomain, NOT in audience) → 200, 0 surveys
      - C. salesforceOrgId=00D000000000999AAA (random other org, NOT registered) → 200, 0 surveys
      - D. sin ninguna org key → 200, 0 surveys (general surveys requieren org)
      - E. salesforceOrgId=00dem00000v5erwmaz (lowercase Auctifera) → 200, 0 surveys (observation, no defect)

      Admin `/respondent-state` confirma la razón del rechazo:
      - Auctifera qa-tr162-auct → survey_2 eligible=true, reason=null
      - VNFP     qa-tr162-vnfp → survey_2 eligible=false, reason="audience"
      - Other    qa-tr162-other → survey_2 eligible=false, reason="audience"

      IM-1185 preexistente re-confirmado en vivo:
      - POST /api/features/general-nps/impressions con {surveyId:2, respondentId:"qa-tr162-impress", salesforceOrgId:"00DEm00000V5eRWMAZ"} → 400 "surveyId is not eligible for this feature context"
      - POST /api/features/general-nps/dismissals con mismo body → 400 mismo error
      Los parámetros maxImpressions=1 + maxDismissals=1 se persisten correctamente pero
      NUNCA se aplican en runtime para after-login general surveys porque la ruta
      /impressions|/dismissals valida contra selectEligibleSurveysForFeature con
      triggerMode="featureTrigger", y afterLogin surveys no matchean ese filtro.

      Cleanup: Survey #2 revertida a inactive + limits=null; Survey #1 reactivada con
      audience=everyone + afterLogin+7s. Estado final verificado idéntico al baseline.
    notes: >-
      **Audience isolation cross-org: PASS confirmado en vivo**. Auctifera SÍ recibe la
      survey org-scoped; VNFP + other-org + no-org NO la reciben (0 surveys y reason
      explícito="audience" del admin respondent-state). Cierra el gap de TR-158 que
      había marcado AC5+AC6 PASS-heredado-por-API. **Config persistence: PASS**. **Runtime
      enforcement de maxImpressions/maxDismissals: BLOQUEADO por IM-1185 preexistente
      High (Is Ready for Dev)** — reproducido live. Sin cambios en el estado dev
      post-corrida.
