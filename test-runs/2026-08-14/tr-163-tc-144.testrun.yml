results:
  - testCaseId: 100ddeb8-4e21-4eca-989a-5ea5fc15ad2c
    testCaseKey: TC-144
    scenarioTitle: >-
      IM-1147 AC3 — Every runtime application view has a documented DynamoDB query path and does not rely
      on broad Scan for normal traffic (post-fix re-validation)
    scenarioIndex: 3
    status: passed
    executedAt: "2026-08-14T19:10:00Z"
    duration: 600
    stepResults: []
    actual: |
      Contraste código pre-fix (main head) vs post-fix (develop head):
      - main: 9 `this.scan` + 1 `new ScanCommand` + 1 `this.query` (646 líneas)
      - develop: 6 `this.scan` + 1 `new ScanCommand` (helper) + 8 `this.query` (824 líneas)

      Los 5 Scan hot del request-path público fueron convertidos a Query GSI:
      1. `getFeatureBySlug(slug)` → GSI1 `SUBJECT_SLUG#<slug>`
      2. `listSurveysByFeatureId(featureId)` → GSI2 `SUBJECT#<featureId>`
      3. `listActiveGeneralSurveys(orgKey)` → GSI1 global + GSI1 `ORG#<orgKey>` (dedup)
      4. `listEvents(respondent+org)` → base PK `RESPONDENT#<org>#<respondentId>`
      5. `getOrganizationBySalesforceOrgId` → GSI2 `SALESFORCE_ORG#<sfOrgId>`
      Bonus: `listResponses` → `queryResponses()` que selecciona GSI2/GSI3/GSI4/GSI1 según el filtro
      más específico; `hasActiveOrganization` → 2 Get puntuales via GSI2+GSI1; nuevo helper
      `getOrganizationBySubdomain` → GSI1 `SUBDOMAIN#<subdomain>`.

      Los 6 Scan restantes son admin unbounded documentados en README (L509-527): `listFeatures`,
      `listSurveys`, `listOrganizations`, `listEvents` sin scope, `listActiveGeneralSurveys()` sin
      orgKey (legacy path no usado por features.ts hoy) y el fallback de `queryResponses` cuando los
      filtros no dan GSI selectivo. Ninguno está en el hot path público.

      Verificación LIVE contra dev (https://surveytool.dev.veevart.ai):
      - GET /api/surveys/general/eligible?salesforceOrgId=00DEm00000V5eRWMAZ&respondentId=qa-tr163-ac3
        → 200 OK, payload expone `GSI1PK: "GENERAL_SURVEYS#ACTIVE#ORG#global"` y `GSI2PK: "SUBJECT#2"`
        (evidencia directa del index usado por el fix).
      - GET /api/features/1/surveys → 200 (payload [])
      - GET /api/features/general-nps/surveys → 200 (payload [])
      - GET /api/admin/features/general-nps/respondent-state/qa-tr163-ac3 → 401 (auth correcto)
      - POST /api/features/general-nps/impressions → 400 (fuera de scope: IM-1185 preexistente)

      Latency stress 5 sequential calls a /api/surveys/general/eligible:
      call-1 0.332s · call-2 0.325s · call-3 0.329s · call-4 0.338s · call-5 0.382s (promedio ≈0.34s).

      Test coverage añadido por el PR #63:
      - dynamodbStore.test.ts +188 líneas (7 nuevos tests de access-path)
      - apiBoundary.test.ts +69 líneas (1 nuevo test que asserta `!(command instanceof ScanCommand)`
        en el path público de eligibility)
      - 82 tests server-side pasan; CI Test+Deploy ambos SUCCESS en el merge commit.
    notes: >-
      AC3 PASS post-fix. IM-1187 resuelto correctamente. La conversión Scan→Query cubre los 5 métodos
      hot del request-path público + varios admin hot; los Scan restantes son admin unbounded documentados
      en README con rationale explícito. El PR añade además una assertion inline en API-boundary que
      hace regresión automática sobre la propiedad "public eligibility must not scan DynamoDB". Nota release
      train: fix aún NO promovido a staging ni main; STG y PRD siguen la versión Scan hasta que el promotion
      PR se abra y merge. No gatea QA — AC3 se validó donde el fix vive; la promotion es follow-up procedural.
