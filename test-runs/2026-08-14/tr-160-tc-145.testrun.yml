title: "TR-160 · IM-1165 · TC-145 · NPS organizations Salesforce sync — 9/9 PASS · 0 defectos · release limpio"

description: |
  QA de IM-1165 (Sync NPS organizations from Salesforce active client accounts) del
  epic IM-970. QA Sub-task: IM-1188. Corrida ejecutada POST-MERGE contra los 3 repos
  del bundle (survey-tool #38 primary + AuctiferaDX #2580 + NFPFundraising #2232), más
  el follow-up survey-tool #43 (OPEN, cleanup de Domain en prd form).

  ## Veredicto

  **9/9 PASS · 0 FAIL · 0 not-run · 0 defectos levantados.** Los 8 ACs del ticket
  cubiertos y el escenario negativo de validación (Org_ID_18__c) probado con 5 casos.
  Regresión técnica 14 PASS + 1 PARTIAL (cross-package deploy-order note). OWASP Top 10:
  9 Applicable PASS, 1 N/A, 0 Applicable FAIL. Release limpio para el user.

  ## Hallazgo clave — la sincronización coincide byte a byte con Salesforce

  · SOQL contra veevart-prod (00D60000000KdOJEA0):
    `SELECT COUNT() FROM Account WHERE Actual_Client__c = true AND Org_ID_18__c != null`
    → **186** records
  · Survey Tool prd `GET /api/admin/organizations` → **186** records
  · Diferencia: 0. Primeros 3 sample identifiers coinciden byte-a-byte
    (Agnes Etherington · AKC Museum of the Dog · Alliance For The Arts).
  · 100% de los 186 tienen `source = "salesforce_account"` y `salesforceOrgId` presente.
  · 0 usan subdomain en prd.
  · 11 SF Accounts adicionales tienen `Actual_Client__c=true` sin `Org_ID_18__c`; están
    correctamente AUSENTES de la lista prd (AC2), disponibles solo por vía manual.

  ## Lo que funciona (contexto positivo)

  · AC1 sync poblada exacta 186=186 SOQL vs Survey Tool
  · AC2 los 11 Accounts sin Org_ID_18__c NO son auto-poblados
  · AC3 salesforceOrgId es primary identifier en storage + resolución (features.ts:39-59)
  · AC4 Auctifera + VNFP LWCs pasan `UserInfo.getOrganizationId()` como salesforceOrgId
    en cada fetch (Apex + LWC + LWC unit tests cubren)
  · AC5 prd form sin subdomain input, sin domain input, Org_ID_18__c required —
    server enforcement `salesforceOrgId is required in production` corrobora
  · AC6 stg + dev form XOR entre Org_ID_18__c y subdomain; server también rechaza
    ambos → `Provide either salesforceOrgId or subdomain, but not both`
  · AC7 formato `/^00D[a-zA-Z0-9]{15}$/` — probado 7 casos (1 positivo + 6 negativos:
    17 chars, 19 chars, prefijo AAA, vacío, special chars, XOR both)
  · AC8 fallback subdomain sigue vivo en dev/stg (VNFP scratch resuelve por
    flow-site-19432-dev-ed); en prd la ausencia de subdomains hace que el fallback
    sea no-op por data absence

  ## Alcance no cubierto en esta corrida

  · Live end-to-end Auctifera scratch: previous session's `nosoftware-fun-3261-dev-ed`
    no aparece en el sf config actual. Cubierto por LWC unit test + Apex source review.
  · Live end-to-end VNFP scratch: `vnfp-pkg` alias autenticado pero expira HOY (2026-08-14).
    No arriesgué la corrida end-to-end; LWC unit tests + código cubren AC4.
  · survey-tool #43 (OPEN follow-up): observado que prd YA tiene el domain field oculto
    aunque #43 no está mergeado — hay una versión más nueva desplegada. Nota para el
    executor: verificar qué PR además de #38 aporta a lo que veo desplegado.

