    Google SSO admin. veevart-prod DevHub (00D60000000KdOJEA0) via sf CLI para SOQL
    de referencia. AuctiferaDX + NFPFundraising Apex + LWC verificados por source
    review + LWC unit tests (packages sin CI en repo).
  url: "https://github.com/Veevarts/survey-tool/pull/38"
  buildVersion: >-
    Mixed (backend + client + Apex/LWC × 2 packages): survey-tool #38 (824+/209-, 19
    archivos: agrega server/src/lib/salesforce.ts 557 líneas, refactoriza
    routes/organizations.ts + features.ts + client OrganizationsPage.tsx +
    infra/lib/survey-tool-data-model.ts) · #43 (OPEN, 15+/12-, 1 archivo: cleanup
    Domain en prd form) · AuctiferaDX #2580 (139+/7-, 9 archivos: NpsWidgetController.cls
    + npsWidget.js + LWC test + CSP trusted sites) · NFPFundraising #2232 (97+/6-, 5
    archivos: mismo shape que Auctifera con Auctifera__ cross-package refs)
  notes: |
    ## Solution understood

    IM-1165 automatiza el poblado de organizaciones NPS desde el catálogo central de
    Salesforce y cambia el identificador primario de subdomain a Org_ID_18__c.

    **survey-tool #38** agrega `server/src/lib/salesforce.ts` (557 líneas) con:
    · `listActiveClientAccounts()` — SOQL parametrizada `WHERE Actual_Client__c = true
      AND Org_ID_18__c != null`, más filtro post-fetch por regex `/^00D[a-zA-Z0-9]{15}$/`
      como defensive belt-and-suspenders.
    · Password OAuth flow con `SFDC_*` env vars (client id/secret/username/password/
      securityToken); token cacheado 45 minutos.
    · `syncResponsesBackfill()` + `syncSummaryToSalesforce()` (fuera del scope de este
      TC pero comparten el config).

    `routes/organizations.ts` (189 líneas) añade:
    · `SALESFORCE_ORG_ID_RE = /^00D[a-zA-Z0-9]{15}$/` (AC7)
    · `appEnvironment()` — resuelve `SURVEY_TOOL_ENV || APP_ENV || "development"`;
      NUNCA cae a `NODE_ENV` (test explícito en apiBoundary.test.ts:177)
    · `validateManualOrganization` — en prd, subdomain se force-nulea y salesforceOrgId
      es required; fuera de prd, XOR entre ambos (AC5 + AC6)
    · `POST /sync-salesforce` — upsert-by-salesforceOrgId (AC1)
    · Duplicate detection retorna 409 con mensajes específicos

    `routes/features.ts:39-59` (`isActiveClientOrg`) — resolución primary → fallback:
    · Primero intenta lookup por `organizations.salesforceOrgId`
    · Solo si no resuelve, cae a `organizations.subdomain` via `ctx.clientOrgId`

    `client/src/pages/OrganizationsPage.tsx` — form condicional por env:
    · `useOrgId = production || form.identifierMode === "salesforceOrgId"`
    · `identifierMode` select solo visible fuera de prd
    · Validación client-side + regex idéntica a la server-side

    **survey-tool #43** (OPEN follow-up) — Cleanup del Domain field en prd:
    · payloadFromForm nulea domain en prd
    · Domain no se renderiza en la lista ni en el form cuando prd
    · Observado en prd que este cleanup YA está desplegado, aunque #43 sigue OPEN;
      hay otra vía de deploy más nueva

    **AuctiferaDX #2580 + NFPFundraising #2232** — packages managed idénticos:
    · `NpsWidgetController.cls` expone `getOrganizationId()` que retorna
      `UserInfo.getOrganizationId()` y `getAfterLoginDiagnosticContext()` que incluye
      el mismo valor en el DTO
    · `npsWidget.js` LWC usa `@wire(getOrganizationId)` y lo propaga en cada fetch
      hacia el Survey Tool eligibility API como query param `salesforceOrgId`
    · LWC tests aseguran `fetch.mock.calls[0][0].toContain('salesforceOrgId=...')`
    · `SurveyWidgetTrigger.js` (static resource) también propaga el param

    ## Inferred technical tests

    · SOQL vs prd API cross-check (AC1/AC2) — ejecutable via `sf data query --target-org
      veevart-prod` + `fetch('/api/admin/organizations')` con sesión admin. AUTO-RUN.
    · Prd form DOM audit (AC5) — ejecutable via Playwright + Google SSO. AUTO-RUN.
    · Server XOR + regex enforcement (AC6/AC7) — POST /api/admin/organizations en dev
      y prd (400 antes de write). AUTO-RUN sin efectos secundarios.
    · LWC test files review (AC4) — assertion `fetch.mock.calls[0][0].toContain(...)`.
      AUTO-RUN por lectura del source; live end-to-end en scratch DEFERRED (auth gap).
    · Server integration tests (apiBoundary.test.ts 36 `it` blocks) — CI green en el PR
      head. AUTO-VERIFIED por CI.

    Todo lo que necesitaba runner + acceso se ejecutó auto; sin manual scenarios abiertos.

    ## Objective-fit summary

    Cada AC probado con evidencia mapeada a scenario-N/*.txt. Ninguna FAIL. El escenario
    negativo de AC7 confirma que ni longitudes distintas de 18 ni prefijos distintos de
    00D pasan la validación en cliente o servidor.

