notes: |
  ## Solution understood

  El case v1 dejaba TODO el trabajo de accounting batches en un MANUAL
  catch-all (un solo AUTOMATED que solo enqueueaba
  `Auctifera.AccountingDiscrepancyNotificationBatch`; el resto era guía de
  Setup UI). El v3 reemplaza ese approach con automatización real que
  reproduce lo que hace Veevart Settings > Batches > Automatic Schedule al
  hacer Save, apalancado en los GLOBAL classes
  `Auctifera.AutomaticBatchSchedule.execute(null) + .schedule()` y
  `vnfp.AutomaticBatchSchedule.execute(null) + .schedule()`. Descubre el
  Donation Opportunity RecordType Id en runtime (prefiere managed vnfp),
  agrega ese Id al CSV de `vnfp__Fundraising_Settings1__c
  .vnfp__Automatic_Fund_Assignment_Record_Types__c` idempotentemente, y
  parkea `vnfp.FixContactRolesBatch` como MANUAL porque es non-global y no
  tiene entry-point de anonymous Apex.

  Verify philosophy — cada step throw-guardea únicamente el contrato DURABLE
  (flags persistidos + daily meta-scheduler cron + para AC3 el cron
  ChargeItemInvoiceBatch requerido); los per-batch crons informational se
  loggean pero no gatean el step, para no false-FAIL cuando el daily
  meta-scheduler se auto-repara los batches.

  ## Inferred technical tests

  | Test                                                     | Prueba                    | Ejecutable acá?               | Verdict |
  | -------------------------------------------------------- | ------------------------- | ----------------------------- | ------- |
  | `ic-seeds.spec.ts` bulk parseSpec (structural gate)      | Todos los AC estructural  | Upstream CI (MigrationAppBackend) | passed (upstream) |
  | Static grep JSON — hardcoded Ids                         | AC6 org-agnostic          | Sí (este TR)                  | passed  |
  | SOQL POST-state Auctifera__Batch_Settings__c (3 flags)   | AC1 durable state         | Sí — ejecutado post IE-run    | passed  |
  | SOQL POST-state vnfp__Fundraising_Settings1__c (CSV)     | AC2 append idempotente    | Sí — ejecutado post IE-run    | passed  |
  | SOQL POST-state 5 flags + ChargeItemInvoiceBatch cron    | AC3 durable state         | Sí — ejecutado post IE-run    | passed  |
  | SOQL POST-state Fix Contact Roles cron                   | AC4 manual handoff        | Parcial — cron sigue en 0     | not-run |
  | Doble-run comparación cron COUNT                          | AC5 idempotencia          | Sólo round1 capturado         | not-run |
  | Comparación illinois vs CamiloDevOrg baseline            | Regression-evidence AC7   | Sí — steps 1-3 signature match| passed  |

  Bundle POST-verify entregado a IE en `attachments/tr-108-tc-100/POST-verify-queries.sh`
  (bash script self-contained; requiere `sf` CLI y alias `illinois-trainings`).
  Ejecutado por QA post IE-run 2026-07-15T20:30 — resultados bajo
  `attachments/tr-108-tc-100/scenario-{1,2,3,4,5}/POST-*.json` + comparison-matrix.txt.

  ## PRE-baseline vs POST observados en illinois-trainings @ 2026-07-15

  El caso reprodujo la condición reportada; el IE corrió el plan v3 desde
  MigrationApp y QA capturó POST-state via `POST-verify-queries.sh` a las
  20:30. Comparativa (ver comparison-matrix.txt por scenario):

  - AC1 Auctifera flags: People true→true · Accounting false→**true** ·
    Notification_Manager false→**true**. AsyncApexJob run-now = 1 job
    (Id 707WI0000PKVClJYQX, Status=Completed 2026-07-15T20:30:20). 6/6 crons
    informational aparecieron (over-delivery — no requerido). PASS.
  - AC2 vnfp Fundraising: Donation vnfp RT `012an000004vZ6vAAE` preservado
    sin duplicar en el CSV org-default. Row user-level (00efn…) intacta.
    Idempotent no-op verificado. PASS.
  - AC3 vnfp flags: Membership/Donation/Specific_Fund true→true ·
    Recurring_Donation false→**true** · NFP_Accounting false→**true**.
    Cron `Veevart NFP - ChargeItemInvoiceBatch` MISSING→PRESENT (next fire
    2026-07-16T06:00). 4/4 crons informational presentes (incluye Roundup
    que estaba MISSING PRE — se auto-agendó desde async finish). PASS.
  - AC4: cron `Veevart NFP - Fix Contact Roles` sigue en 0 rows. El step
    parkea AWAITING_HANDOFF en MigrationApp (observable en UI); el
    schedule físico requiere que el IE haga click en Veevart Nonprofit
    Settings > Batches > Schedule. NOT-RUN — pendiente step manual del IE.
  - AC5 idempotencia: round1 captura 39 crons totales; requiere segunda
    corrida IE para confirmar cero duplicados + no-op de settings upserts.
    NOT-RUN — pendiente doble corrida.
  - AC7 regression-evidence: el signature POST (8 flags true + los 2
    meta-schedulers + ChargeItemInvoiceBatch cron + Roundup cron) coincide
    con lo reportado por el dev en CamiloDevOrg + Tucson. Steps 1-3
    equivalencia confirmada. PASS.

  ## QA method

  Este TR se cerró bajo el patrón HYBRID:
  - Auto-execute lo estático: AC6 org-agnostic (JSON grep), Regression técnica
    T3 callers (gh search), regression-plan.txt, regression-results.txt,
    owasp-top10-scan.txt, PRE-baseline SOQL contra illinois-trainings.
  - IE corrió el plan real: MigrationApp UI → T6 → Anonymous Apex → org (sin
    bypass). QA capturó POST-state con `POST-verify-queries.sh` post-run y
    comparó PRE vs POST — resultados en las `comparison-matrix.txt` de cada
    scenario. AC1/AC2/AC3/AC7 cerraron PASS con evidencia observable.
  - Pendiente cerrar: AC4 (step manual UI del IE) + AC5 (segunda corrida
    para confirmar idempotencia).

  ## Regression técnica + security

  Ver `attachments/tr-108-tc-100/regression-plan.txt` (matriz completa) +
  `regression-results.txt` (verdictos). Sin blockers de seguridad; 5 Tech
