key: TR-170
title: >-
  TR-170 · IM-1205 · TC-153 · fund_assignment_memberships.sql ancla Auctifera__Posted_Date__c en
  la financial transaction que OWNS la línea de membership revenue — 3/5 PASS + 2/5 DEFERRED
  (bastion 98.95.60.135:22 DOWN + colima startup >60s). Static specs 34/34 + query-regression
  558/558 + revert-proof 5/34 capturados. Numeric evidence heredado del dev PR body para
  Long Island (97,014 rows, 33 date changes, 10 mes distinto, 2 año distinto, 0 recurring).
status: completed
environment:
  name: >-
    Repo Veevarts/MigrationToolETL clonado local en HEAD del PR #172 (branch
    CamiloSalgueroMarin/IM-1205-fund-assignment-dates, commit 1cd6fe35, base branch main).
    Node 25.4 + npm 11.7. safesql local con profiles aspen / illinois_2 / tucson /
    tucson_backup3 — bastion 98.95.60.135:22 DOWN esta sesión (SSH banner timeout), los 4
    profiles unreachable. colima corriendo con arch=x86_64 pero con ptt-postgres + TR-169
    residuals ocupando recursos → mssql-server 2022 no boot en <60s del testcontainers
    log-wait default.
  url: https://github.com/Veevarts/MigrationToolETL/pull/172
  buildVersion: >-
    Classification: SQL-only query fix (+438/-8). 6 files: 1 SQL (fund_assignment_memberships.sql
    +45/-4, 2 CTE column additions + 2 COALESCE anchor changes + 1 nuevo LEFT JOIN own_ft + 1
    nueva WindowDate column + WHERE gate switch de PostedDate a WindowDate), 1 spec estático
    fund-assignment-memberships-query.spec.ts (+108/-1), 1 spec estático
    donation-split-receipting-query.spec.ts (+13/-3), 1 spec integration donation-split-receipting
    (+143 nuevo, 41 tests docker-gated), 1 fixture donation-split-receipting-query-fixture.ts
    (+123 nuevo), 1 docs altru-model-context.md (+6). PR OPEN draft, mergeable, no stack.
  notes: |
    ## Solution understood

    Bug: en `fund_assignment_memberships.sql`, `Auctifera__Posted_Date__c` se derivaba desde
    el resolver `ResolvedMembershipFinancialTransactions` (rmft), que rankea una fila con
    `SOURCELINEITEMID` (línea child) antes (rank 0) que la fila membership propia (rank 1).
    Ese ranking existe para refund/adjustment children — pero un POS Payment aplicado a un
    sales order tiene la MISMA shape: una línea con `APPLICATION = 'Order'` en la transacción
    Payment que apunta de vuelta a la línea de membership. En memberships order-backed la
    transacción Payment gana y el Fund Assignment hereda la fecha de payment/processing en
    vez de la fecha de la Order. Es invisible cuando order y payment caen el mismo día,
    lo cual explica por qué solo unos pocos registros lo muestran.

    Fix: la posted date ahora se ancla en la financial transaction que OWNS la línea de
    membership revenue. Anchor específico:

      CAST(COALESCE(
        rgi.InstallmentDate,             -- #1: IM-904 preserved (recurring)
        own_ft.CALCULATEDDATE,           -- #2: NUEVO — owning financial transaction
        rmft.FinancialTransactionDate,   -- #3: previous behavior as fallback
        mt.TRANSACTIONDATE               -- #4: null-safety tail
      ) AS DATE) AS Auctifera__Posted_Date__c

    `own_ft` se obtiene con un nuevo LEFT JOIN FINANCIALTRANSACTION on
    `mli.FINANCIALTRANSACTIONID` (una columna NOT NULL nueva-proyectada en la CTE
    MembershipLineItems). Idéntico anchoring aplicado en la rama split-receipting.

    Round-1 review (dev): la rama split-receipting filtra sobre la misma columna que se
    estaba corrigiendo; sin cuidado, un date-windowed run habría silently cambiado qué rows
    esa rama emite. Fix: se añadió una nueva columna `WindowDate` (con el anchor OLD, sin
    own_ft.CALCULATEDDATE) y el WHERE window filter apunta a `ranked.WindowDate` — no a
    `ranked.PostedDate`. Solo se mueve el exported date; la compuerta de inclusión queda
    exactamente donde estaba pre-fix.

    Defecto adicional (mismo fix): el tiebreaker Refund en el resolver rankeaba bajo el
    bucket principal, así que un Refund child TAMBIÉN outrankeaba la línea de membership.
    Esto databa 10 fund assignments positivos de membership de Long Island sobre un refund.
    El mismo anchor por membership-line-owner corrige esas 10.

    Result (dev-measured, PR body): en Long Island 97,014 rows totales PRE=POST, 0 blank
    dates PRE=POST, 33 rows cambian Posted Date, 10 mueven a mes distinto, 2 a año distinto,
    0 recurring memberships afectados. Cross-tenant line-item: LI 34 / Tucson 17 / High
    Desert 20 / Illinois 4 — recurring afectados 0 en todos.

    ## Inferred technical tests

    - **jest static specs (fund-assignment-memberships + donation-split-receipting spec files)**
      → auto-ejecutado. 34/34 PASS en la PR branch. 5 nuevos tests IM-1205 pinneando el
      COALESCE 4-tier + WindowDate + IM-904 invariant preservado.
    - **jest full query-regression suite (558 tests)** → auto-ejecutado. 558/558 PASS · 153
      skipped (docker-gated) · 46/62 suites. Coincide con dev PR body byte-a-byte.
    - **Revert-proof** → auto-ejecutado. Revertir SOLO las 2 líneas del anchor (main SELECT
      + split branch PostedDate) hace que EXACTAMENTE 5/34 tests FAIL: los que pinnean
      `own_ft.CALCULATEDDATE` en la COALESCE del main SELECT + split branch + WindowDate
      chain preservation. 29/34 PASS bajo revert, como se espera para invariantes que la
      reversión no rompe. Confirma que los tests capturan el bug.
    - **safesql aggregate wrapper (contract-safe)** → PREPARADO pero NO ejecutable esta sesión.
      Bastion 98.95.60.135:22 DOWN (SSH banner timeout T+10s ConnectTimeout); los 4 profiles
      unreachable. Wrapper reusa las 3 primeras CTEs del PR head (MembershipLineItems,
      ResolvedMembershipFinancialTransactions, RecurringInstallments) y emite conteos
      numéricos: total_membership_lines, delta_line_items, delta_month_or_year_jump,
      delta_year_jump, recurring_would_have_changed_but_installment_wins,
      lines_where_own_ft_is_refund_and_ranked_child_differs. Corre instantáneamente cuando
      el bastion vuelva. Expected Tucson (dev): 17 delta_line_items.
    - **Docker integration (RUN_DOCKER_SQL_QUERY_TESTS=1)** → DEFERRED. Local: 41/41 FAIL con
      "Log stream ended and message '/.*Started.*/' was not received" incluso con
      `.withStartupTimeout(180000)` parche temporal. Raíz: colima resource contention
      (ptt-postgres + TR-169 test containers residuals ocupando daemon), no defecto del PR.
      Dev PR body: 41/41 PASS incluyendo los 3 tests del IM-1205 group.

