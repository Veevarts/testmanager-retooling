key: TR-169
title: >-
  TR-169 · IM-1204 · TC-152 · membership_transactions.sql lee nivel/término desde SALESORDERITEMMEMBERSHIP —
  5/5 PASS (44/44 static + 556/556 query-regression + tucson wrapper 627/19,617 = 3.20% coincide byte-a-byte
  con dev + IM-1106 gate 0/0/0/0 + revert-proof captura 3/44 tests). Docker integration DEFERRED (colima
  startup > 60s), rev-ids Long Island heredados del dev.
status: completed
environment:
  name: >-
    Repo Veevarts/MigrationToolETL clonado local en HEAD del PR #171 (branch
    CamiloSalgueroMarin/IM-1204-membership-type, commit cf301528, base branch main). Node 25.4 + npm
    11.7. safesql local con profiles aspen / illinois_2 / tucson / tucson_backup3 — no hay profile
    longisland. Solo tucson alcanzable en esta sesión (illinois_2 y aspen bastion tunnels down —
    localhost:41435 y :41434 refused). colima corriendo con arch=x86_64.
  url: https://github.com/Veevarts/MigrationToolETL/pull/171
  buildVersion: >-
    Classification: SQL-only query fix (+272/-3). 5 files: 1 SQL (membership_transactions.sql
    +47/-2, de los cuales 2 son la fix core y 40 son comentarios), 1 spec estático nuevo
    (membership-transactions-query.spec.ts +42, 5 tests bajo "membership level source (IM-1204)"),
    1 integration test (membership-program-linkage-query.integration.spec.ts +68, 4 tests dockerizados),
    1 fixture (membership-program-linkage-query-fixture.ts +108, escenario MT_SOIM_LEVEL_CHANGED),
    1 docs (docs/altru-model-context.md +7/-1). PR OPEN, mergeable, no stack.
  notes: |
    ## Solution understood

    Bug: en la primera rama UNION ALL de `membership_transactions.sql`, los joins a
    `MEMBERSHIPLEVEL` y `MEMBERSHIPLEVELTERM` leían el par (nivel, término) directamente desde
    `MEMBERSHIPTRANSACTION`. Altru **reescribe MEMBERSHIPTRANSACTION.MEMBERSHIPLEVELID y
    .MEMBERSHIPLEVELTERMID en el mismo registro** cuando alguien entra por "Go to Membership"
    desde una transacción y cambia la membresía; `SALESORDERITEMMEMBERSHIP` conserva el nivel y
    término que la venta realmente llevó, y `SALESORDERITEM.DESCRIPTION` — escrito una sola vez
    al momento de la venta y nunca reescrito — lo sigue nombrando. El drift es silencioso: el
    par nivel/término de la transacción normalmente queda internamente consistente, así que el
    lookup de Membership Program sí resuelve, solo que al programa equivocado (por eso no se
    parece a IM-1106, donde el par directamente no resuelve).

    Fix: cambiar los 2 ON-clauses de la rama order-backed a leer `soim.*` primero con COALESCE:

      LEFT JOIN MEMBERSHIPLEVEL     ml  ON COALESCE(soim.MEMBERSHIPLEVELID,     mt.MEMBERSHIPLEVELID)     = ml.ID
      LEFT JOIN MEMBERSHIPLEVELTERM mlt ON COALESCE(soim.MEMBERSHIPLEVELTERMID, mt.MEMBERSHIPLEVELTERMID) = mlt.ID

    `soim` ya estaba LEFT JOINed más arriba (grain 1:1 con MT, 45,444/45,444 en LICM y en cada
    tenant medido). La rama transaction-only del UNION ALL no cambia. Fix es no-op sobre pares
    consistentes; solo mueve las filas order-anchored donde soim y mt discrepan. Impacto en Long
    Island: 189 de 45,444 filas (0.42%) — 183 keys / 182 nombres / 96 precios corrigen. Impacto
    en Tucson: 627 de 19,617 (3.20%), 627 keys / 627 names / 16 precios cambian — Tucson es el
    tenant más afectado, no Long Island. Program-name cambios: 0 en todos los tenants medidos.

    IM-1106 preservado: la llave de programa sigue anclada en `mlt.LEVELID` (el level dueño del
    término), y como el término de la venta siempre resuelve y siempre pertenece a su propio
    level (45,444/45,444 en cada tenant), 0 llaves colgadas PRE = 0 POST.

    ## Inferred technical tests

    - **jest static specs (membership-transactions-query.spec.ts, 44 tests, 5 nuevos IM-1204)**
      → auto-ejecutado. 44/44 PASS. Los 5 nuevos: "resolves the level and term from the sales-order
      line before the transaction", "no longer keys either join on the membership transaction alone",
      "keeps the transaction as the fallback so unsold-through-POS memberships still resolve",
      "derives the program name from the same level the two joins resolved", "leaves the order-backed
      branch sourcing its own sales-order line". Prueba AC1, AC3, AC5 a nivel de texto SQL.
    - **jest full query-regression suite (556 tests)** → auto-ejecutado. 556 PASS · 150 skipped
      (docker-only skips por `shouldRunDocker` gate) · 46 de 62 suites PASS.
    - **Revert-proof** → auto-ejecutado. Revertir solo las 2 líneas COALESCE hace que exactamente
      3/44 tests FAIL (los que pinnean la COALESCE presence + program derivation + fallback keying);
      41/44 PASS bajo revert, como se espera para invariantes que la reversión no rompe. Confirma
      que los tests capturan el bug.
    - **safesql aggregate wrapper (contract-safe)** → auto-ejecutado en tucson. Numeric-only,
      revert-proof al nivel de contrato (evita ejecutar el query completo de 900+ líneas). Compara
      COUNT(*), COUNT(divergent), grain y las 4 columnas corregidas. Números tucson coinciden con
      dev PR body byte-a-byte: 19,617 total / 627 divergentes / 3.20% / 627 keys / 627 names / 16
      prices / 0 program-names / 19,617 distinct mt_ids.
    - **safesql IM-1106 gate** → auto-ejecutado en tucson. 0 dangling term IDs PRE, 0 POST, 0
      dangling term-owner-level PRE, 0 POST. IM-1106 preservado 100%.
    - **safesql fallback count** → auto-ejecutado en tucson. 103,051 de 122,668 MTs (84%) sin
      línea de venta → hit fallback rama (mt.*) — comportamiento pre-fix invariante para esa
      población.
    - **safesql cross-tenant** → PARCIAL: tucson alcanzable, illinois_2 y aspen bastion tunnels
      caídos esta sesión (mismo síntoma "Failed to connect to localhost:414XX in 20000ms" —
      típico del `illinois_2 profile stale` documentado). Dev PR body cubre Long Island, Tucson,
      High Desert, Illinois; deja Everson, Aspen, Kidstream, MOAD sin medir (DB fleet outage el
      día de la medición del dev).
    - **safesql rev-ids Long Island** → NO ejecutable local (no hay profile longisland). Dev
      confirma los 6 rev del ticket en el PR body; en tucson se muestran 5 samples anonimizados
      con la misma shape (nivel discrepa, precio corrige).
    - **Dockerized integration (RUN_DOCKER_SQL_QUERY_TESTS=1)** → DEFERRED. Local: 12/12 FAIL con
      "Log stream ended and message '/.*Started.*/' was not received". Raíz: colima on x86_64
      arranca mssql-server 2022 en ~90s, testcontainers default log-wait 60s, y la spec no
      overrida con `.withStartupTimeout()`. Manual container boot esta sesión llegó a "SQL Server
      is now ready" en T+90s; no es defecto del PR. Dev PR body: 12/12 PASS + 15/15 en POS suite.

