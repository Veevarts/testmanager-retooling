key: TR-145
title: "TR-145 · IM-774 · TC-135 · Las 4 queries de ticketing emiten el bypass del ReservationTriggerHandler como literal 'true' en cada fila y Confirmed_Date_Time__c se toma de RESERVATION.STARTDATETIME normalizado a UTC — 5/5 PASS · 0 defectos · 86/86 suites de ticketing + revert-proof triple (28/43 SQL, 23/26 TS, mutación 5) + live safesql tucson 27/27 STARTDATETIME · BLOQUEO DE ROLLOUT: el campo del bypass NO existe en 4/4 orgs alcanzables (Auctifera 8.254.0.1 < 8.317.0.2) · PR MigrationToolETL#160 (OPEN)"

description: |
  QA de IM-774 (**Error**, priority **High**, severity **1 - Business Stopping**, environment **Production**,
  epic IM-70 Altru Queries). QA Sub-task: IM-1141. Account del ejemplo: **Tucson** (8-11410182).
  PR bajo prueba: Veevarts/MigrationToolETL#160 (OPEN, branch `bug/ticketing-trigger-bypass-IM-774`,
  head `4a441524`, base main; 13 files +1202/-7).

  Clasificación: **Mixed** — 4 `.sql` de ticketing (source-side) + pass-through TypeScript
  (mapper → entity → CSV descriptor) + 3 specs nuevos + docs/openspec. El efecto final es
  Salesforce-bound, pero la palanca está en el CSV que produce el ETL.

  Root cause: cargar una fila de Ticketing con Rental Event dispara `GroupReservation_Trg` →
  `ReservationTriggerHandler.afterInsert()` → `RentalEventManageResources.createRentalItemsForTicket()`,
  que auto-crea un `Auctifera__Rental_Resources__c` **sin** `Implementation_External_ID__c`. El Rental
  Resource migrado (external id = el id de Ticketing/SalesOrder, del CTE `AggregatedTicketRentalResources`
  de IM-462) no tiene sobre qué hacer upsert ⇒ coexisten dos registros. **El duplicado NO lo genera el SQL**:
  el análisis previo del ticket ya había medido 0 grupos de external-id duplicados en 5 profiles y una sola
  línea para 8-11410182.

  El fix: las 4 queries emiten `Auctifera__Technical_Bypass_Triggers__c` como **literal string `'true'`**
  (nunca `1`: un CSV de Bulk API lo lee como FALSE en una columna Checkbox) en **todas** las filas (el bypass
  es batch-scoped, un flag condicional dependería del chunking). Como el trigger también estampaba
  `Confirmed_Date_Time__c` con `Datetime.now()`, el valor se repone desde `RESERVATION.STARTDATETIME` con
  `(AT TIME ZONE @timeZone) AT TIME ZONE 'UTC'` estilo 127 — el mismo idiom de `rental_resource.sql:22` y
  `rental_events_groups.sql:66`. El wiring TS registra ambas columnas en `rows` **y** en `headers`, porque
  `fast-csv-writer.adapter.ts` filtra estrictamente por `headers`.

  Método QA (clone de scratch, checkout del head del PR; sin tocar el clone del usuario):
  1. Suites de ticketing en el branch → **86/86 PASS** (coincide con lo que reporta el PR).
  2. `query-regression` completo: branch **393 pass / 0 fail**, base **350 pass / 0 fail** ⇒ delta
     **+43 tests / +1 suite** = exactamente el spec nuevo. **Cero tests preexistentes rotos.**
  3. Revert-proof en **3 variantes**: (a) revertir las 4 `.sql` a base ⇒ **28 FAIL / 15 pass**;
     (b) revertir los 3 `.ts` a base ⇒ **23 FAIL / 3 pass**; (c) mutación dirigida
     `parseNullableDate` → `parseDate` ⇒ **5 FAIL** — coincide exactamente con las 5 aserciones que el
     PR reporta en el review round 1.
  4. safesql `tucson` **aggregate-only** (solo COUNT, cero filas, cero PII): 27 reservas Confirmed
     ticket-backed, **STARTDATETIME poblado 27/27**, date component == ARRIVALDATE **27/27**, time
     component == ARRIVALTIME **27/27**, hora real (no medianoche) **27/27**, Confirmed sin instante **0**.
     Reproduce el 27/27 del PR de forma independiente. Población expuesta: **1,555** órdenes con Rental
     Event, **1,379** de ellas ticket-backed.
  5. Preflight del prerrequisito en los 4 orgs alcanzables + gates (`lint:check`, `build`) + regresión
     técnica y de seguridad + OWASP Top 10.

  Resultado: **5/5 PASS, 0 defectos, 0 hallazgos High/Critical**. La evidencia del A/B en org (64 → 0
  Rental Resources en CamiloDevOrg) se mantiene atribuida al **dev**, no a QA: CamiloDevOrg no está
  autenticado en esta máquina y no se re-ejecutó.

  **BLOQUEO DE ROLLOUT (no es defecto del código, es estado de los orgs):** el campo
  `Auctifera__Technical_Bypass_Triggers__c` está **ABSENTE en 4 de 4 orgs alcanzables** —
  veevartd (Tucson trainings), illinois-trainings, hammer-trainings y maloof-trainings, todos en
  **Auctifera 8.254.0.1**, por debajo del piso **8.317.0.2** que introduce PP-1438. Una columna
  desconocida falla el **Bulk job completo**, no fila por fila: cargar ticketing con este cambio en
  cualquiera de esos orgs hoy rompe la carga entera. El PR lo declara como prerrequisito y aporta el
  comando de preflight; QA lo verificó y lo confirma como bloqueo real, no teórico.
  El segundo prerrequisito (`Auctifera__Bypass_POS_Transaction_Lock__c` en el usuario de carga) **sí
  existe ya en 8.254.0.1** ⇒ satisfacible hoy, solo hay que activarlo.

