  url: "https://github.com/Veevarts/MigrationToolETL/pull/160"
  buildVersion: >-
    Mixed (SQL source-side + pipeline TS + efecto Salesforce-bound). 13 files +1202/-7: 4 .sql de ticketing
    (ticketing, ticketing_only_event, ticketing_only_program, ticketing_direct_registrant) + ticketing.mapper.ts
    + ticketing-record.entity.ts + ticketing-csv-descriptor.builder.ts + 3 specs nuevos + docs/openspec.
    Evidencia primaria: suites de ticketing + revert-proof triple + live safesql tucson + preflight de orgs.
  notes: |
    ## Solution understood
    Loading a Ticketing row that carries a Rental Event fires `GroupReservation_Trg` →
    `ReservationTriggerHandler.afterInsert()` → `RentalEventManageResources.createRentalItemsForTicket()`,
    which auto-creates an `Auctifera__Rental_Resources__c` with NO `Implementation_External_ID__c`. The
    migrated Rental Resource — external id = the Ticketing/SalesOrder id, from the IM-462
    `AggregatedTicketRentalResources` CTE — then has nothing to upsert onto, so a second record survives.
    The fix does not change the Rental Resource query at all: it makes the four ticketing queries emit
    `Auctifera__Technical_Bypass_Triggers__c` so the handler is skipped for that single write. Three details
    are load-bearing and all three are pinned by tests: the literal is the string 'true' (a Bulk API CSV
    silently reads `1` as FALSE in a Checkbox column, so the trigger would run anyway), the flag is on every
    row (the framework bypass is batch-scoped, so a conditional flag would depend on Bulk chunking), and both
    columns must be registered as header AND row key (fast-csv-writer.adapter.ts filters strictly by headers).
    Because `beforeInsert` used to stamp `Confirmed_Date_Time__c` with `Datetime.now()`, the bypass would have
    dropped it; it is now sourced from `RESERVATION.STARTDATETIME` — not the date-only `ARRIVALDATE`, which
    would land on midnight and render as the previous day in any org west of UTC — and normalised to UTC with
    the same idiom the sibling queries already use, so app path and hand-run export resolve to one instant.

    ## Inferred technical tests
    | Test inferido | Qué prueba | ¿Ejecutable aquí? | Resultado |
    |---|---|---|---|
    | Suites de ticketing en el branch | AC1/AC2/AC3 a nivel de contrato | SÍ (jest) | 86/86 PASS |
    | `query-regression` branch vs base | AC5 · no romper nada preexistente | SÍ | 393 vs 350, delta = +43 (el spec nuevo), 0 roto |
    | Revert-proof SQL (4 `.sql` → base) | AC1 · el guard no es vacuo | SÍ | 28 FAIL / 15 pass |
    | Revert-proof TS (3 `.ts` → base) | AC3 · el guard no es vacuo | SÍ | 23 FAIL / 3 pass |
    | Mutación `parseNullableDate`→`parseDate` | AC2/AC3 · no cae a now() | SÍ | 5 FAIL (= las 5 del PR) |
    | safesql tucson aggregate-only | AC2 · la fuente soporta la derivación | SÍ (profile tucson) | 27/27 en las 4 métricas |
    | safesql tucson población afectada | AC4 · tamaño del blast radius | SÍ | 1,555 con Rental Event / 1,379 ticket-backed |
    | `sf sobject describe` del campo del bypass | AC5 · piso de versión por org | SÍ (4 orgs) | ABSENTE 4/4 · Auctifera 8.254.0.1 |
    | `sf package installed list` | AC5 · cuantificar la versión | SÍ | 8.254.0.1 en los 4 |
    | Lint + build | AC5 · gates del repo | SÍ | limpio / OK |
    | `donation-transaction-recurring` branch vs base | AC5 · fallo preexistente declarado | SÍ | 10 FAIL == 10 FAIL |
    | **A/B en org (64 filas, trigger ON vs bypass)** | AC4 · el efecto observable final | **NO — CamiloDevOrg no autenticado** | evidencia **del dev**, no re-ejecutada por QA |
    | Suites integration dockerizadas | regresión ampliada | **NO — colima/docker DOWN** | fuera del alcance de este PR (no añade ninguna) |

    ## Objective fit
    Objetivo del ticket: que la migración deje de producir un Rental Resource duplicado por cada ticket con
    Rental Event, y —al hacerlo— no pierda ningún dato que el trigger aportaba.
    PRE-fix obtenido: ninguna query emite el flag ⇒ el handler corre en cada insert ⇒ un Rental Resource
    huérfano (sin external id) por cada uno de los ~1,379 tickets con Rental Event solo en Tucson; el caso
    reportado (8-11410182: R-1230 sin external id + R-1597 con external id) es una instancia de eso.
    POST-fix obtenido: las 4 queries emiten el flag en cada fila con el literal que Bulk API sí honra, ambas
    columnas llegan al CSV, y `Confirmed_Date_Time__c` queda con el instante histórico (27/27 verificado en
    la fuente) en vez del reloj de la corrida. Los 3 revert-proof demuestran que los guards son reales.
    Objetivo cumplido en los 5 escenarios. 0 defectos.
    Salvedad honesta: el paso final —"0 Rental Resources auto-creados"— se observa en una org Salesforce, y
    esa medición (64 → 0) es del dev. QA verificó toda la cadena causal que la habilita, no la medición misma.

