notes: |
  ## Classification
  Backend pipeline (DB bootstrap refactor) + integration tests adicionales.

  ## Solution understood
  PR #21 hace dos cosas:
  1) Refactor de db/index.ts: introduce SURVEY_DB_PATH env-var para permitir DB path
     parametrizado (necesario para test isolation). db/path.ts + db/runMigrations.ts encapsulan
     la lógica.
  2) Añade tests a apiBoundary.test.ts que LOCKAN el contrato "public widget stays open":
     active-only filter, response submission con admin cookie, inactive lookup admin-only.

  ## Coverage
  - 39/39 server tests PASS.
  - AC2 (eligibility) + AC3 (submission) + AC4 (frequency rules) auto-executable, cubiertos por
    boundary tests + eligibility tests.
  - AC1 (widget loads sin redirect) + AC5 (CORS) + AC6 (no admin cookie cross-origin) —
    RUNTIME VALIDADO 2026-07-02 en scratch org.
  - AC7 (NFPFundraising cross-test) — BLOCKED por package no listo.

  ## Runtime validation (2026-07-02) — runtime evidence for AC1/AC3/AC4

  Ejecutado en: `computing-power-944-dev-ed.scratch.lightning.force.com`
  Target endpoint: `https://surveytool.dev.veevart.ai/api/features/rentals/surveys`
  Widget trigger: Lightning cmp `Auctifera__AddManageResourcesToRentalEvent` + botón Quick Save

  ### AC1 — no redirect a Cognito
  - GET directo al public endpoint → 200 OK en 609ms
  - Response Content-Type: application/json
  - Cero 302 hits, cero navegación externa
  - Response body: `[]` (eligibility returned no active survey; widget lifecycle OK)

  ### AC3 — CORS from Lightning origin
  - Request referer: `https://computing-power-944-dev-ed.scratch.lightning.force.com/`
  - Response header: `access-control-allow-origin: *`
  - No OPTIONS preflight (simple GET, no custom headers, no credentials → no preflight per spec)
  - 0 CORS errors en console
  - Nota arquitectónica: wildcard `*` es más permisivo que "matchea Lightning origin" pero
    satisface el AC gate. Aceptable para public anonymous endpoint; documentar en survey-tool
    README para futuros reviewers.

  ### AC4 — no admin session cookie cross-origin
  - Request headers al public endpoint: sec-ch-ua-platform, referer, user-agent, sec-ch-ua,
    sec-ch-ua-mobile — **NINGÚN cookie header presente**
  - Response headers: sin `set-cookie` — public endpoint no intenta establecer sesión
  - document.cookie en Lightning origin: solo cookies de Salesforce (BrowserId, sid, inst,
    sid_Client, clientSrc, CookieConsentPolicy) — cero `survey_admin_session`
  - Confirmación arquitectónica: cookie scoping funciona correctamente. Admin cookie está
    atada al survey-tool origin y browser correctamente NO la envía en cross-origin fetch
    desde Lightning.

  Evidencia completa: attachments/tr-087-tc-78/scenario-0/
