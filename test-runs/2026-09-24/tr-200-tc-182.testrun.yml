  - testCaseId: "1ad2e5cf-a812-4867-86ed-379ede5d6036"
    testCaseKey: TC-182
    scenarioTitle: >-
      AC5 · The frontend never bypasses a refusal, but survives a missing route
    scenarioIndex: 4
    status: not-run
    stepResults: []
    actual: |
      *** CORRECCION 2026-09-24 *** Estaba marcado passed. Se baja a not-run.

      La regla que separa negativa de ausencia esta probada rama por rama, y las mutaciones M3
      y M4 confirman que las dos mitades estan sujetas. Eso sigue siendo cierto.

      Pero el escenario pedia "se provoca que la llamada de refirmado responda 400 / 409 / 404
      / 5xx y se observa que hace el frontend". Aqui no se provoco nada contra el frontend: se
      ejecuto su modulo con el cliente de API sustituido por un doble que devolvia esos errores.
      Es evidencia de la logica, no del navegador contra el backend.

      La mejora del diagnostico (s3Key pasa de undefined a informado) se midio en la
      reproduccion, que tambien es a nivel de modulo.

      La regla cabe en una linea y separa exactamente lo que hay que separar:

        isRefusal = error instanceof SignBackupUploadUrlError
                    && status >= 400 && status < 500 && status !== 404

      400 clave ajena, 400 respaldo inexistente, 409 upload DONE y 409 respaldo en borrado:
      PARA, con uploadFailure de etapa single_sign, el codigo HTTP registrado y CERO PUT de ese
      archivo. 404, 5xx y sin respuesta: SIGUE con el enlace de creacion. Y si no hay enlace de
      creacion al que caer, falla como single_sign con httpStatus 404 en vez de callarse.

      LAS DOS MUTACIONES QUE IMPORTAN. M3 — aplicar el fallback a todo error — hace caer las
      cuatro pruebas de "never bypasses". M4 — contar el 404 como negativa — hace caer "falls
      back when the route is missing". Las dos mitades de la regla estan sujetas.

      SE REGISTRA LA CLAVE DE S3? Si, y es una mejora medible, no una promesa. En la
      reproduccion del escenario 1 sobre la version ANTERIOR el diagnostico sale con
      s3Key: undefined — no habia forma de localizar el objeto que fallo. Despues llegan s3Key,
      httpStatus, s3ErrorCode, s3ErrorMessage, s3RequestId y la etapa single_sign.

      LA DEPENDENCIA QUE EL PROPIO CRITERIO PIDE DEJAR ESCRITA: el fallback ante 404 solo es
      seguro porque el certificado y la clave van PRIMERO. Si el orden se revirtiera, el enlace
      de creacion al que se cae estaria caducado y el fallback devolveria el defecto original.
      AC5 no es independiente de AC2: descansa sobre el. La mutacion M1 lo hace visible —
      al devolver el orden viejo caen tambien pruebas de esta seccion, no solo las de AC2.
