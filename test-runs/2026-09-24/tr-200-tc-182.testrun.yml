      Comprobado en dos sitios, porque el repositorio no es lo que corre.

      EN EL FUENTE MERGEADO. uploadBackupFiles pasa de BACKUP, CERTIFICATE, KEY a CERTIFICATE,
      KEY, BACKUP.

      EN EL BUNDLE QUE DEV SIRVE DE VERDAD. Se siguio el grafo desde index.html hasta el chunk
      de la subida, /assets/useBackups-CCWRPsgj.js, y ahi esta:

        e.CERTIFICATE&&await G("CERTIFICATE",t.CERTIFICATE,e.CERTIFICATE,"certificate",a),
        e.KEY&&await G("KEY",t.KEY,e.KEY,"key",a),
        await G("BACKUP",t.BACKUP,e.BACKUP,"backup",a)

