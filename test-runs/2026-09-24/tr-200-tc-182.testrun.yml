    EN DEV LA RUTA RESPONDE. Sonda sin token, el mismo metodo que usa el propio
    scripts/probe-api-routes.mjs del frontend: 401 significa que la ruta existe y el guard
    corrio, 404 que el router no la emparejo.

      401  POST  .../backups/{id}/upload-url               LA RUTA NUEVA
      401  POST  .../backups/{id}/multipart/sign-part      control: hermana existente
      401  POST  .../backups/upload-link                   control: ruta de creacion
      404  POST  .../backups/{id}/upload-url-inventada     CONTROL NEGATIVO

    El control negativo es lo que hace que el 401 signifique algo. Y el bundle que dev sirve
    lleva "/upload-url", SignBackupUploadUrlError y single_sign. Asi que los escenarios AC3 y
    AC5 probaron el camino real y no el fallback.

    EL ORDEN, MEDIDO: EN DEV EL FRONTEND LLEGO PRIMERO.

      frontend  inicio 20:52:47Z   fin 20:54:43Z
      backend   inicio 20:52:44Z   fin 21:02:33Z

    El frontend nuevo estuvo sirviendose 7 minutos y 50 segundos ANTES de que existiera la
    ruta que llama. En esa ventana toda subida por PUT unico en dev recibia 404, caia al
    enlace de creacion y se comportaba como antes del arreglo — sin error y sin traza. No es
    una hipotesis sobre el orden de despliegue: es el orden que ocurrio. La ventana fue corta
    y en dev, asi que probablemente no la sufrio nadie. Importa porque es la MISMA mecanica
    que gobernara la promocion a produccion.

    EN PRODUCCION EL ARREGLO NO ESTA. Los dos repositorios despliegan prod desde la rama
    `stable` y dev desde `main`, y los dos `stable` se movieron por ultima vez el 2026-08-18:

      MigrationAppBackend   stable 94097156   main 37afb12d   main +13 commits
      MigrationAppFrontend  stable 818d1d9    main 1dd79ee    main +13 commits

    `git merge-base --is-ancestor` da NO en los dos. El incidente que origino el ticket
    ocurrio en produccion el 2026-09-23 y el arreglo se mergeo a `main` ese mismo dia, pero
