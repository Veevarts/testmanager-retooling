    "EN NINGUN CASO 404" esta fijado por la mutacion M5: cambiar el BadRequestException por
    NotFoundException pone la suite roja. El motivo esta escrito en el propio fuente — el
    frontend lee 404 como "ruta no desplegada" y subiria un objeto huerfano sobre un respaldo
    ya borrado.

    SE PUEDE SORTEAR LA GUARDA CAMBIANDO SOLO LA CLAVE? El autor probo cuatro claves ajenas
    obvias. La guarda compara por IGUALDAD EXACTA, asi que la pregunta real es si alguna capa
    de mas abajo normaliza la clave y reabre lo que la igualdad cerro. QA probo 13 formas de
    escribir "otra cosa" — mayusculas en el nombre y en el prefijo, barra doble, segmento
    punto, travesia codificada %2e%2e%2f, espacio al principio y al final, sufijo pegado,
    cadena de consulta, byte nulo, barra inicial absoluta, prefijo del bucket delante y clave
    vacia — con CONTROL POSITIVO para que el rechazo signifique algo.

    15/15. Las 13 rechazadas, la legitima firmada. En ninguno de los 13 rechazos se llamo al
    presigner: la guarda corta antes de acunar nada.

    Las mutaciones M6, M7 y M8 (quitar la guarda de clave ajena, la de DONE y la de borrado)
    ponen la suite roja las tres. Las dos ultimas son guardas que la hermana multipart NO
    tiene: el endpoint nuevo es mas estricto que el que imita.

