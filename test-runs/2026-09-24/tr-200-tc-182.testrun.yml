      PUT right before it, never using the creation-time URL" lo fija fetch a fetch.

      EL .BAK PEQUENO TAMBIEN SE REFIRMA, que es lo que cierra el R4. En esa misma prueba el
      .bak mide 4 bytes contra un umbral de 8, asi que va por PUT unico — y recibe su URL
      fresca igual que el certificado y la clave. El criterio pedia explicitamente cubrir un
      .bak de 100 MB o menos y queda cubierto.

      EL .BAK GRANDE NO PASA POR AHI. Con 12 bytes y trozos de 4 va por multipart, con firma
      por parte, sin tocar la ruta de PUT unico. Era asi antes del cambio y sigue igual: por
      eso el .bak nunca fue el problema.

      Mutacion M2 (no refirmar nunca, usar siempre la URL de creacion): la suite se pone ROJA,
      caen 6 pruebas.
