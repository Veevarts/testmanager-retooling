notes: |
  ## Solution understood

  EL DEFECTO. `upload-link` firma de una vez las URLs PUT de los tres archivos cuando se crea
  el respaldo. Caducan a la hora en produccion. El `.bak` sube por multipart y cada parte se
  firma bajo demanda, asi que a el no le afecta; pero el frontend subia en orden BACKUP ->
  CERTIFICATE -> KEY, de modo que el certificado se enviaba DESPUES de la subida larga con
  una URL firmada horas antes. S3 respondia 403 AccessDenied "Request has expired", el
  respaldo quedaba en uploadStatus FAILED y nunca aprovisionaba. En el incidente del 23-09 el
  `.bak` de 20 GB llego completo y el certificado de 752 bytes se intento 3h34m despues, y el
  respaldo se recupero A MANO.

  EL ARREGLO, DOS PIEZAS QUE SE SOSTIENEN LA UNA A LA OTRA. El frontend sube el certificado y
  la clave PRIMERO, mientras sus URLs estan frescas. Y el backend expone
  `POST /clients/:clientId/backups/:backupId/upload-url`, que vuelve a firmar una URL de PUT
  unico para un archivo del propio respaldo, igual que `multipart/sign-part` firma cada
  parte; el frontend la llama justo antes de cada PUT unico. Ninguna de las dos basta sola:
  el orden protege al certificado, el refirmado protege a un `.bak` pequeno que ahora va
  ultimo.

  LA DECISION MAS DELICADA NO ES NINGUN CRITERIO. El endpoint NUNCA responde 404, porque el
  frontend lee 404 como "esta ruta todavia no esta desplegada" y cae al enlace de creacion.
  Ese fallback existe para que un frontend nuevo no se rompa contra un backend viejo, y esta
  bien pensado — pero significa que si el backend no esta donde el frontend cree, el sistema
  vuelve EN SILENCIO al comportamiento defectuoso. Por eso esta cobertura dedica un escenario
  entero al estado de despliegue. Y ha valido la pena: es donde esta el hallazgo.

  ## Inferred technical tests

  - Reproducir el defecto, que es lo unico que el autor no probo. Modelar la caducidad con un
    reloj virtual y correr el MISMO fichero contra las dos versiones. EJECUTADO.
  - Probar que las suites PUEDEN fallar. Nueve mutaciones, una por cada regla que dicen
    guardar. EJECUTADO: 9 de 9 se ponen rojas.
  - Comprobar que la ruta esta viva donde el frontend la llama, y en que entornos. Sonda sin
    token con control negativo, mas git para produccion. EJECUTADO.
  - Leer el bundle DESPLEGADO, no el repositorio. EJECUTADO.
  - Atacar la guarda de clave con las formas que el autor no probo. EJECUTADO: 15/15.
  - Las dos suites completas, y separar los fallos previos de los introducidos. EJECUTADO.
  - Barrido de seguridad y OWASP Top 10 completo. EJECUTADO.
  - Lo NO ejecutable aqui: forzar una subida mas larga que S3_PRESIGN_EXPIRATION en el
    entorno. Sin credenciales de AWS no se puede leer la variable, y bajarla exige acuerdo
    con el dueno del entorno. Queda en "Pendiente de tu parte".

  ## Hallazgos

  F1 · EL ARREGLO NO ESTA EN PRODUCCION, Y ALLI EL DEFECTO SIGUE VIVO. Los dos repositorios
  despliegan prod desde `stable` y dev desde `main`. Los dos `stable` se movieron por ultima
  vez el 2026-08-18 y van 13 commits por detras. El incidente ocurrio en produccion el
  2026-09-23 y el arreglo se mergeo a `main` ese mismo dia. Cualquier respaldo de produccion
  cuyo `.bak` tarde mas que S3_PRESIGN_EXPIRATION volvera a fallar en el certificado y
  volvera a necesitar cirugia manual en S3. No es un defecto del PR: el codigo es correcto,
  simplemente no esta donde hace falta. Es lo mas accionable de esta corrida.

  F2 · EN DEV EL FRONTEND SE DESPLEGO 7m50s ANTES QUE EL BACKEND. Frontend terminado a las
  20:54:43Z, backend a las 21:02:33Z. En esa ventana toda subida por PUT unico recibia 404,
  caia al enlace de creacion y se comportaba como antes del arreglo, sin error ni traza. El
  riesgo de orden de despliegue no es hipotetico: ya ocurrio una vez. La promocion a
  produccion debe ir BACKEND PRIMERO, esperando a que termine antes de promocionar el
  frontend.

  F3 · AC6 SIGUE DIFERIDO Y NO SE LE CREO ESCENARIO, a proposito: probar algo que se decidio
  no hacer solo produce un fallo sin informacion. Queda dicho para que nadie lo de por
  cerrado — un respaldo al que le falte el certificado o la clave se sigue recuperando A
  MANO, porque Resume lo ve completo con solo el `.bak` y aprovisiona sin ellos.

  F4 · OBSERVACION DE POSTURA, PREVIA A ESTE PR Y FUERA DE SU ALCANCE. El controlador de
  respaldos no acota clientId a las reclamaciones de quien llama, y solo
  connection-password exige grupo. Cualquier usuario autenticado del pool puede operar sobre
  el clientId que escriba, incluido DELETE :backupId, que ya existia y permite mas dano que
  sobrescribir. La ruta nueva adopta exactamente esa postura; no la ensancha. Se deja escrito
  porque se vio, no porque sea de este cambio.

  ## Lo que el autor dejo bien atado

  Las guardas del endpoint estan probadas una a una y cada una lleva su motivo escrito encima
  en el codigo, de modo que quien las cambie sabra que esta rompiendo algo deliberado. La
  prueba "rejects a backup that does not exist with 400, never 404" es el mejor ejemplo. Y el
  endpoint nuevo es MAS estricto que la hermana que imita: `multipart/sign-part` no tiene ni
  la guarda de upload DONE ni la de borrado.

