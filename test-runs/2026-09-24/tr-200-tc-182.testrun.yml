      *** CORRECCION 2026-09-24 *** Estaba marcado passed. Se baja a not-run.

      Todo lo comprobado aqui viene de pruebas con `fetch` y el cliente de API sustituidos por
      dobles. Que cada PUT unico pida su URL justo antes esta fijado en la logica y sujeto por
