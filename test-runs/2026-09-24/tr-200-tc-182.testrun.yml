    actual: |
      *** CORRECCION 2026-09-24, despues de la primera escritura de este TR ***
      Este escenario estaba marcado passed. Es incorrecto y se baja a blocked.

      Lo que este escenario pedia observar es "el certificado y la clave quedan en el prefijo
      de S3 del respaldo, el respaldo llega a uploadStatus DONE y aprovisiona". NADA DE ESO SE
      OBSERVO. No se creo ningun respaldo, no se subio ningun archivo, no se toco S3 y ningun
      uploadStatus se movio.

      Lo que si se hizo sigue siendo cierto y sigue valiendo, pero es otra cosa: una
      reproduccion a nivel de MODULO, con `fetch` sustituido por una funcion propia que hace de
      S3 y un reloj virtual. Prueba que uploadBackupFiles, frente a una URL caducada, fallaba
      antes con 403 AccessDenied "Request has expired" sobre el CERTIFICADO en etapa
      single_put, y ya no falla. Es evidencia del comportamiento del modulo. NO es evidencia de
      que una subida real termine.

      BLOQUEADO POR: no se puede leer S3_PRESIGN_EXPIRATION del entorno (sin credenciales de
      AWS) ni bajarla sin acuerdo del dueno del entorno. Y ademas hace falta una subida real,
      que en este flujo crea un respaldo y APROVISIONA INFRAESTRUCTURA: es una escritura que
      necesita autorizacion expresa.

      NO SE PUDO FORZAR LA DURACION EN EL ENTORNO, ASI QUE SE REPRODUJO EL DEFECTO.

      La variable S3_PRESIGN_EXPIRATION se resuelve desde SSM
      (/<env>/migration-app-backend/s3-presign-expiration). No hay credenciales de AWS en esta
      maquina — `sts get-caller-identity` devuelve InvalidClientTokenId — asi que NO se pudo
      leer el valor de dev, y bajarla exige acuerdo con el dueno del entorno, que QA no toma
      por su cuenta. El unico dato firme del codigo es el respaldo por defecto: 900 s si la
      variable falta o no es valida.

      En vez de dejarlo en un argumento estructural, se modelo lo unico del reloj que importa:
      una URL prefirmada CADUCA, y S3 contesta 403 a quien la use tarde. Cada URL lleva su
      instante de firma; el S3 falso rechaza la firmada hace mas de una hora; la subida del
      .bak por multipart avanza el reloj hasta 15000 s simulados, como las 3h34m del incidente.
      El MISMO fichero corre contra las dos versiones — que es lo que le da sentido.

        Metrica                    Antes (d17f406)           Despues (257c71c)
        resultado de la subida     FALLA                     COMPLETA
        etapa del fallo            single_put                (ninguna)
        archivo que cae            CERTIFICATE               (ninguno)
        respuesta de S3            403 AccessDenied          200
        mensaje de S3              "Request has expired"     (ninguno)
        duracion simulada          15000 s (> 3600)          15000 s

      El 403 AccessDenied / "Request has expired" sobre el CERTIFICADO en etapa single_put es,
      palabra por palabra, el sintoma que el ticket describe en produccion. La version anterior
      lo produce; la nueva no.

      EL CASO INVERSO, que pasa en las dos y no significa lo mismo. Un .bak PEQUENO por PUT
      unico detras de un certificado lento: en la version vieja pasa por accidente, porque el
      .bak iba PRIMERO y nada habia caducado todavia. En la nueva el .bak va DESPUES del
      certificado lento y solo sobrevive porque se le refirma la URL. El orden nuevo crea ese
      caso y el refirmado lo resuelve: son las dos mitades del arreglo y hacen falta las dos.
      Es el R4 del caso de prueba.

      LIMITE DE LO QUE SE AFIRMA. Esto prueba el comportamiento del modulo de subida frente a
      una URL caducada. NO observa el prefijo de S3, ni uploadStatus DONE, ni el
      aprovisionamiento, ni una subida real de 20 GB. Para cerrarlo contra el entorno hace
      falta leer S3_PRESIGN_EXPIRATION y forzar la duracion, y eso sigue pendiente de quien sea
      dueno del entorno. Queda en "Pendiente de tu parte".
