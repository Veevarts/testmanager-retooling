    Las diez situaciones del criterio responden lo que deben: 400 para clave ajena, clave de
    otro cliente, travesia, archivo no declarado y respaldo inexistente; 409 para upload ya
    DONE y para DELETING / DELETED / DELETE_FAILED; y el respaldo en FAILED SI obtiene su
