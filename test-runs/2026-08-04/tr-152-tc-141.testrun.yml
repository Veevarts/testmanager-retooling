title: 'TR-152 · IM-741 · TC-141 · T1 Package Installer — 6/6 PASS: regla de orden y llave de idempotencia probadas
  load-bearing por mutación, y AC3 documentado como superado por el propio desarrollo'
description: |-
  Ejecución de TC-141 contra **MigrationAppBackend** en `main @ 11f95fab` (PR #336, el último funcional de IM-741), bajo el epic **IM-735 Implementation Cases Automation**. QA Sub-task: **IM-1169**. Historia: **IM-741** (Highest).

  **Veredicto: 6/6 PASS · 0 defectos.**

  Dos correcciones al ticket que QA encontró antes de ejecutar: el alcance real son **17 PRs mergeados**, no los 4 que nombra el ticket; y el **AC3 quedó superado** por el PR #330 (NPSP pasó a ser un paso manual). Ambas son deuda de documentación del ticket, no defectos de código.

  **El AC7 queda fuera del alcance de QA por política**, no por omisión: verificar la re-corrida idempotente exige disparar el installer —una escritura— y la única org con la instalación completa es de producción. QA no ejecuta escenarios que requieran tocar una org productiva, así que ese AC no se incluye como escenario y no arrastra el pass rate. Queda como entrega del dev/PM. El detalle, con la revisión de los 10 perfiles `sf` logueados y la validación de solo lectura de la técnica del step T6 contra tres orgs de trainings, está en `ac7-excluded-prod-only.txt`.

  Ninguna org fue escrita durante esta corrida.
