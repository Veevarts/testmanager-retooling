title: 'TR-153 · IM-741 · TC-141 · Corrida en vivo del IE en el workspace dev contra illinois-trainings — AC6 verificado
  contra un fallo real, PR #334 confirmado en vivo, y AC7 bloqueado por autorización del AuthBroker'
description: |-
  Segunda ejecución de TC-141, esta vez **disparando la corrida real del IE** por la API de la Migration App en el workspace **Test IM cases Org Tucson** contra **illinois-trainings** (`00DWI00000CIwZi2AL`, org de TRAININGS, no productiva). Complementa TR-152, que fue verificación a nivel de código sobre `main @ 11f95fab`.

  **Veredicto: 6/6 PASS · 0 defectos · 1 bloqueador de entorno.**

  Dos corridas (`0a35de60-8f12-4306-aa80-9f395c668cca` y `c9da6a0f-9c77-459c-8f96-b22b37bb99b5`), ambas terminadas en `failed` con el **mismo error determinista**: `AuthBroker returned status 500` al mintear sesión para instalar Auctifera. El ticket anticipa exactamente esta precondición: *"The target org must be authorized in the AuthBroker itself — a ConnectedOrg DDB row is not sufficient"*. **No es defecto de IM-741.**

  Aun así la corrida rindió evidencia que el código solo no daba: el **AC6** quedó verificado contra un fallo real en vez de un fixture, el **PR #334** (un handoff parqueado frena su propio case) quedó confirmado en vivo, y se comprobó que **un fallo no deja estado parcial** en la org.

  **El AC7 sigue sin verificarse**, pero ahora por una razón concreta y documentada —autorización del AuthBroker— en vez de por haberlo descartado como *solo-prod*.
