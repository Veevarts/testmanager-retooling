  actual: |-
    **Verificado contra un fallo REAL, y es la evidencia más fuerte de toda la review.** Al fallar el step de instalación, el step siguiente (*Verify the core package namespaces resolve in the org*) quedó en `pending` y **nunca se intentó** — en las **dos** corridas. Y el `errorMessage` que llegó arriba es la causa raíz literal del subsistema:

    ```
    Auctifera: {"Error":"InstallError","Cause":"{...\"errorMessage\":\"AuthBroker returned status 500\",
    \"trace\":[\"InstallError: AuthBroker returned status 500\",
    \"    at SalesforceLibSessionAdapter.mintSession (file:///var/task/mint-session.mjs:57141:19)\"...]}"}
    ```

    Nombra el subsistema (AuthBroker), el código (500) y el punto exacto (`mintSession`). Accionable sin entrar a los logs.
