description: |
  QA execution para IM-1093 (Error, priority Medium, epic IM-70 Altru Queries).
  QA Sub-task: IM-1105. PR under test: Veevarts/MigrationToolETL#151 (MERGED
  2026-07-21, merge commit a4170995).

  Método QA:
  1. Fetch SQL at BASE (acf1ec6e) y HEAD (8fd8660a) del PR #151 vía
     `gh api contents?ref=<sha>`.
  2. Clone MigrationToolETL en `main` + `npm ci`.
  3. Static structural analysis PRE vs HEAD (CTE count, OUTER APPLY, OR-chains).
  4. Live safesql runs sobre 3 profiles (Tucson, Illinois_2, Aspen), wrapped
     con los 4 entry params.
  5. Comparación PRE vs POST del runtime + row grain + status/revenue mix.
  6. Test:queries + lint:check + tsc --noEmit locales + `gh pr checks 151`.
  7. Mutation testing: (a) remove EligibleTransactionIds join → broad scan;
     (b) reintroduce STATUSCODE NOT IN (0,6,7) exclusion.
  8. Security scans (grep + npm audit) + OWASP Top 10 applicability.

  Evidencia clave live:
  - Tucson PRE: TIMEOUT en 120s (reproducido 2 veces) → **replica el bug reportado**
    "does not complete reliably on large Altru backups" 🎯
  - Tucson POST: 64s, 20,442 rows, 0 dupes en Implementation_External_ID__c
  - Illinois_2 POST: 18,282 rows, 0 dupes
  - Aspen POST: 305 rows, 0 dupes
  - Total: 39,029 rows / 0 dupes across 3 profiles
  - Auctifera__Total__c > 0 en 100% de las filas (item-fallback fix confirmed)
  - Pending statuses preservados: Tucson 21 · Illinois 63 · Aspen 1
  - Mutation testing: broad scan mutation rompe 1 test; status exclusion
    mutation rompe otro test → regression protection confirmada

