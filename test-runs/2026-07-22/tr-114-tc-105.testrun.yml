  buildVersion: 'Mixed (SQL-only dominante + 3 test files + 1 fixture). Base acf1ec6e → HEAD 8fd8660a → merge-commit a4170995. Estrategia: static SQL structural analysis + safesql pre/post en 3 profiles + npm test:queries 294 pass + 2 mutation tests + wire-in check + PR CI verify. PR YA MERGED al momento de ejecutar QA.'
  notes: |
    - PR #151 MERGED 2026-07-21T21:57 por DavidB0208. Baseline vs post-fix se
      toma del merge-commit vs su merge-base con main.
    - safesql alcanzó 3 de los 8 profiles del PR body: tucson, illinois_2, aspen.
      Los otros 5 (long-island, high-desert, everson, Everson2ndBatch, camilodev
      o análogo) NO están en `~/tools/safesql/profiles/` de esta workstation.
      Dev-attested per PR body: no risk paths (status 0/6/7 con donation lineage)
      encontrados en long-island / high-desert / everson / Everson2ndBatch.
    - Docker suite live re-run BLOCKED por testcontainers 60s startup timeout en
      colima+arm64 (mismo issue diagnosticado en TR-113). Wire-in confirmed;
      GH PR CI (Linux runner nativo) reporta pass en 2m2s → attestation source.
    - Tucson PRE query timeout duplicó lo que dev observó ("tucson failed local
      tunnel connection" per PR body); en QA la conexión sí subió pero el query
      se colgó en el mismo profile → evidencia empírica del bug reportado.

    ## Solution understood

    El PR rewrite el query con pattern **Sales Order-first + eligibility short-circuit**:

    1. `FilteredSalesOrders` (NEW) — date-filter Sales Orders FIRST, sin
       status exclusion → pending statuses (0/6/7) ahora pass through.
    2. `SalesOrderTransactionLinks` (NEW) — revenue (rank 1) + payment (rank 2)
       vía UNION ALL, un-Sales-Order-por-fila.
    3. `EligibleTransactionIds` (NEW) — DISTINCT reduced set de FT IDs. Es la
       clave de la perf gain: la eligibility chain corre solo sobre este set
       reducido, no sobre el universo entero de FINANCIALTRANSACTIONLINEITEM.
    4. `MembershipLineItems` (preserved).
    5. `EligibleLines` (refactored) — ahora joins con EligibleTransactionIds
       (era `FROM FINANCIALTRANSACTIONLINEITEM dli` broad scan).
    6. `TransactionAgg` (preserved) — net amount por transaction.
    7. `DonationItemSalesOrders` (NEW) — agrega SALESORDERITEMDONATION.AMOUNT
       por Sales Order ANTES del ranking (elimina el fan-out por item + fixea
       los "zero-net item-only rows").
    8. `DonationSalesOrders` (refactored).
    9. `ResolvedSalesOrders` (NEW) — ranking final: revenue > payment > item.

    Behavior changes clave:
    - Pending statuses (0/6/7) preservados → downstream donation Opp + fund
      lookups no quedan orphaned.
    - Item-only fallback amounts != 0 (era 0 en PRE).
    - Row grain determinista: 1 por Sales Order.

    ## Inferred technical tests (mapped to ACs)

    | Test                                                    | AC        | Executable here? | Verdict |
    |---------------------------------------------------------|-----------|------------------|---------|
    | Static CTE + OUTER APPLY + OR-chain analysis            | AC4       | YES              | PASS |
    | safesql POST tucson (row grain + status + total)         | AC1+AC2+AC3 | YES            | PASS (20,442 rows, 0 dupes, 100% Total>0) |
    | safesql POST illinois_2                                 | AC2+AC3    | YES              | PASS (18,282 rows, 0 dupes) |
    | safesql POST aspen                                       | AC2+AC3    | YES              | PASS (305 rows, 0 dupes) |
    | safesql PRE tucson (timeout reproduces bug)              | Objective  | YES              | PASS (120s timeout × 2) |
    | npm run test:queries                                     | AC5        | YES              | PASS 294/294 |
    | npm run lint:check                                       | AC5        | YES              | PASS (exit 0) |
    | npx tsc -p tsconfig.build.json --noEmit                  | AC5        | YES              | PASS (exit 0) |
    | gh pr checks 151 (merge-commit CI)                       | AC5        | YES              | PASS (2m2s) |
    | Mutation broad scan → 1 test fails                       | AC5       | YES              | PASS (targeted test catches it) |
    | Mutation status exclusion → 1 test fails                 | AC5       | YES              | PASS (targeted test catches it) |
    | test:queries:docker live re-run                          | AC5        | NO (timeout on colima+arm64) | dev-CI attested |
    | 5-tenant probe attested by dev (long-island/HD/everson/etc) | AC3     | NO (profiles missing) | dev-CI attested |
    | OWASP Top 10 applicability scan                          | -          | YES              | 4 Applicable · 4 PASS · 0 High/Critical |

    ## Objective fit

    - Ticket objective: "the POS sales order donations query to complete
      reliably on large Altru backups"
    - Pre-fix Tucson: **TIMEOUT 120s (× 2)** — does NOT complete reliably
    - Post-fix Tucson: 64s, 20,442 rows — **completes reliably** ✅
    - Objective met? YES (empirically demonstrated on the largest reachable
      backup).

