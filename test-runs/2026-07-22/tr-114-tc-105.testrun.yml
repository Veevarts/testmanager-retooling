  - scenarioIndex: 3
    scenarioTitle: "AC4 · Anti-pattern removal — no broad OR / OUTER APPLY en el query HEAD"
    testCaseId: 4ebc0b6b-bf17-4e21-9aaa-de224b831a1e
    testCaseKey: TC-105
    status: passed
    executedAt: "2026-07-22T12:57:00Z"
    duration: 2
    actual: |
      Static structural analysis HEAD vs PRE:

      **CTEs**:
      - PRE: 3 CTEs (MembershipLineItems, EligibleLines, TransactionAgg) +
        directo `FROM FINANCIALTRANSACTIONLINEITEM dli` (transaction-first broad
        scan).
      - HEAD: 8 CTEs (FilteredSalesOrders → SalesOrderTransactionLinks →
        EligibleTransactionIds → MembershipLineItems → EligibleLines →
        TransactionAgg → DonationItemSalesOrders → DonationSalesOrders →
        ResolvedSalesOrders).

      **Anti-patterns literal check**:
      | Pattern                                | PRE | POST | Δ |
      |----------------------------------------|-----|------|---|
      | OUTER APPLY                            | 0   | 0    | (nunca fue el issue) |
      | OR-chain ≥ 3 disyunciones               | 1   | 1    | domain-legit (ISORGANIZATION OR ISGROUP OR ISCONSTITUENT) — unchanged |
      | FROM FINANCIALTRANSACTIONLINEITEM (broad) | ✅ | ❌ | **removed** |
      | STATUSCODE NOT IN (0,6,7)               | ✅ | ❌ | **removed** |
      | Sales-Order-first eligibility short-circuit | ❌ | ✅ | **added** |
      | Item amount aggregation before ranking  | ❌ | ✅ | **added** |

      La frase "broad OR / OUTER APPLY" del AC4 fue heredada del template de
      IM-1091. Para este ticket, el anti-pattern real es transaction-first +
      broad joins (no OUTER APPLY literal). Está removed en HEAD.

      **Sibling structural check**:
      `sales_order_only_membership.sql` (IM-1091) tiene 5 CTEs con el mismo
      pattern de terminación (ResolvedSalesOrders + ranking). El donation query
      añade 3 CTEs adicionales porque tiene el item-only fallback path que
      memberships no tiene. Alineación estructural ✅.

      **Regression tests coverage — 8 assertions en pos-purchase-donation-query.spec.ts**:
      cubren los 4 aspectos del AC4:
      - Lineage paths: "preserves the revenue, payment, and donation-item sales-order linkage paths"
      - Ranking: "keeps deterministic one-row-per-sales-order resolution priority"
      - Date filtering: "filters sales orders early without casting date columns in predicates"
      - Status contract: "keeps pending sales-order statuses exportable for downstream POS lookups"
      - Anti-pattern: "avoids the transaction-first patterns that dropped or multiplied sales orders"
      + 3 más (zero-net exclusion, cross-query alignment, single eligibility evaluation).

      Plus integration spec query-chain.integration.spec.ts añade 5 assertions
      donation-related sobre real SQL Server (dockerized): SALESORDERPAYMENT
      lineage, item-only sin transaction, single-row for revenue+payment,
      pending export, DATEADDED fallback.
    notes: |
      Todos los 4 aspectos requeridos por AC4 (lineage / ranking / date-status /
      anti-pattern) están cubiertos por assertions dedicadas. Las mutation
      tests en AC5 demuestran empíricamente que el guard funciona.
