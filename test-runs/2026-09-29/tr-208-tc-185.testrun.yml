notes: |
  ## Solution understood

  Tras TR-207, el dev entrego tres cosas:
  - PR #94 (merge 39a15452, desplegado en dev): oculta los errores inesperados de respuestas y
    borradores con un mensaje generico, SURVEY_REQUEST_FAILED y un requestId, y documenta en el README
    y en docs/draft-submission-rollout.md que el rol necesita dynamodb:ConditionCheckItem.
  - Reescribio el AC9 y anadio al ticket una excepcion de release para el reemplazo explicito, aprobada
    por producto y ligada a IM-1309.
  - Declaro que el permiso IAM queda pendiente, en un repo de infraestructura por confirmar.

  ## Inferred technical tests

  - Suites y builds, contando ficheros. EJECUTADO: servidor 196/196 (14/14), cliente 89/89 (16/16),
    builds en verde; el bundle del cliente no cambia.
  - Corrida local completa sobre 39a15452. EJECUTADO: identica a TR-207.
  - Revision del codigo del PR #94 (que rutas oculta el error y que queda). EJECUTADO.
  - Envio identificado en dev, sin borrador y con borrador desde el iframe de nps_03. EJECUTADO: 500
    generico.
  - Segundo navegador en dev real: conflicto, Continue here y envio. EJECUTADO.
  - Donde vive el rol y que permisos concede. EJECUTADO, en solo lectura: Veevarts/IaCLive.
  - Intermitencia del CI: fichero de integracion completo x20. EJECUTADO: 20/20 en local.

  ## Hallazgos (detalle en hallazgos-v5.txt)

  F1 · ALTA · SIGUE: el envio identificado da 500 en dev porque el rol de ECS no tiene
  dynamodb:ConditionCheckItem. El rol se define en Veevarts/IaCLive, y en dev, staging y prod le falta
  esa accion. Es el unico bloqueo y es de infraestructura.
  S1 · CORREGIDO en las rutas de la historia; riesgo residual en otras rutas anteriores (ticket aparte).
  AC9 · cerrado como excepcion aceptada (IM-1309), contra el AC reescrito.
  OBSERVACIONES · CI de integracion que se cuelga (2 veces); escala NPS segun el viewport; borrador de
  TR-207 sin token.

  ## Condiciones para aprobar

  1. Anadir dynamodb:ConditionCheckItem al rol en Veevarts/IaCLive, sobre surveys y respondent-state, y
     aplicarlo en dev (y en staging y produccion antes de mergear PR #90).
  2. QA repite en dev: el envio del borrador pendiente desde el iframe de nps_03 (el token esta en el
     perfil de QA) y el envio sin token. Con eso se aprueba.
