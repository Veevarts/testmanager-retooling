notes: |
  ## Solution understood

  TR-204 rebotó la historia por cuatro hallazgos, y el autor los ataca así:
  - **F1** (backend #404): el evaluador rechaza cualquier señal anterior al `published_at` de la
    versión, con un motivo propio, `predates_version`. La migración 0086 lo admite en el log.
  - **F2** (frontend #209 y 0087): las guardas se describen según lo que decidieron, y desaparecen los
    veredictos `no_match` y `abstained`, que nadie escribía.
  - **F3** (backend #399 y #404): la disponibilidad de cada disparador cuenta filas y cuentas en sus
    tablas de origen, y una jugada sobre un disparador sin datos se rechaza al guardar y al entrar en un
    estado que evalúa.
  - **F4** (frontend #209): la biblioteca permite borrar el borrador que deja una definición rechazada.

  Además:
  - La autoría queda solo para admin, por decisión y no porque el grupo esté vacío (#211).
  - El texto de go-live habla del límite en la publicación (#213).
  - La historia se reescribió, y ya no promete outbox ni ventana de rechazo.

  ## Inferred technical tests

  - Suites y bancos sobre main, contando ficheros. EJECUTADO:
    - src/csm: 2563 tests.
    - Lambdas: 1083 tests, más las 20 suites contra Postgres (215 tests), que TR-204 saltó.
    - 11 bancos: 602/602.
    - Frontend: 2812 tests.
  - Mutaciones, reintroduciendo cada defecto. EJECUTADO: F2, F3 y F4 las detectan tests de
    comportamiento; F1 solo el banco; el cierre ante fechas ilegibles, nadie.
  - F1 en vivo con el motor de main contra dev, con eventos antes de publicar, entre publicar y pasar a
    live, y después. EJECUTADO.
  - F3 y F4 en el builder y la biblioteca reales de dev. EJECUTADO.
  - F2 en el log de evaluación real, incluido el motivo nuevo. EJECUTADO; de ahí sale N1.
  - Ventana de rechazo eliminada: rechazar y volver a disparar. EJECUTADO.
  - 403 para un usuario sin admin. NO EJECUTADO: no existe ese usuario en dev.

  ## Resultado

  17 PASS, 1 FAIL y 1 bloqueado (TR-204: 14/19).
  - F1, F3 y F4 están corregidos.
  - F2 está corregido en lo que se reportó.
  - **N1 (media, nuevo):** un rechazo por `predates_version` se muestra en el log como "TRIGGER DID NOT
    PASS · Needed 90 · measured —". El motivo real y la explicación del motor no aparecen.
  - **O1 (decisión de producto):** el límite es la publicación, y el builder publica al guardar. Un
    evento ocurrido entre guardar y pasar a live se enrola con el backfill apagado, mientras el diálogo
    dice "It starts on what happens next".

  Detalle en hallazgos.txt y en matriz-escenarios.txt.

  ## Condiciones para aprobar

  1. **N1 corregido:** la fila y el detalle muestran `predates_version` (y `stale_event`) con la
     explicación del motor, con un test que compruebe el texto.
  2. **O1, decisión explícita de producto:** o se acepta el hueco y el diálogo muestra la hora de
     publicación (y el log deja de decir "went live"), o el límite pasa al primer estado que evalúa.
