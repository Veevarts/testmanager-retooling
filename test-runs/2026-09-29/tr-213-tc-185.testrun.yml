notes: |
  ## Solution understood

  El unico bloqueo de TR-208 era de infraestructura: el rol de ECS no tenia
  dynamodb:ConditionCheckItem. Veevarts/IaCLive "PR #185" lo concede, solo sobre las tablas base surveys
  y respondent-state, y Digger lo aplico en dev, staging y prod. El codigo de survey-tool no cambia
  (develop 39a15452, el mismo de TR-208).

  ## Inferred technical tests

  - Revision del cambio IAM y de su aplicacion por entorno. EJECUTADO, en solo lectura.
  - Envio heredado sin token en dev, sin borrador y con borrador activo. EJECUTADO: 201 y 409.
  - Envio del borrador pendiente desde el iframe de Salesforce (nps_03). EJECUTADO: 201.
  - Admin de dev despues del envio: Progress, detalle del borrador, respuestas y metricas. EJECUTADO.
  - Suites y corrida local: NO se repiten, porque es el mismo commit que TR-208; siguen valiendo.

  ## Hallazgos (detalle en hallazgos-v6.txt)

  F1 · CERRADO: en dev los envios identificados funcionan, con y sin borrador.
  S1 · CERRADO en las rutas de la historia (TR-208); el riesgo residual en otras rutas va en un ticket aparte.
  AC9 · excepcion aceptada, ligada a IM-1309.
  OBSERVACIONES · CI de integracion intermitente; smoke test de envio en staging y prod al promocionar (PR #90).

  ## Veredicto

  APROBADO. Los 13 escenarios pasan; el escenario 12 (iframe de Salesforce) se completo de punta a punta
  en dev entre TR-207 y esta ronda. El AC9 queda como excepcion aceptada (IM-1309). La promocion a
  staging y produccion (PR #90) ya no tiene bloqueo de permisos.
