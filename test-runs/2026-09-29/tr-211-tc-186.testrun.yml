notes: |
  ## Solution understood

  TR-209 rebotó la historia por N1 y dejó O1 para producto. El autor entrega:
  - **N1** (frontend #214 y #215): el log toma la explicación que escribe el motor para `predates_version`
    y `stale_event` y la usa como etiqueta de la fila y del detalle; quita el par "Needed/measured" que el
    motor nunca evaluó; y las plantillas de esas frases se copian del motor al frontend, así que
    `contract:check` falla si el motor cambia la redacción.
  - **O1**, con decisión de producto del 2026-09-29, opción B (backend #408, migración 0088): el límite de
    `predates_version` es `playbook_versions.first_evaluating_at`, la primera vez que la versión entra en
    sombra o activo. Se escribe una sola vez, en la misma transacción que el cambio de estado o que el
    repunte de versión. La migración lo rellena con `published_at` en las jugadas en sombra, activas o
    pausadas, y aborta si queda alguna encendida sin límite.
  - **Acceso** (backend #406): las escrituras del backend exigen `admin`, como ya hacía el frontend, y se
    fija con tests que un límite ilegible hace fallar cerrado.

  ## Inferred technical tests

  - Suites, tipos, contrato y bancos sobre el main desplegado en dev. EJECUTADO: raíz 2583, Lambdas 1305
    (sobre base limpia), frontend 2842, 611/611 en los bancos, tsc en los dos repos y contract:check.
  - Mutaciones de cada arreglo, con una base nueva por corrida. EJECUTADO: 9 de 9 detectadas; volver a
    `published_at` solo lo detecta el banco.
  - O1 en vivo en dev, con el motor de main y el builder real: por sombra, a live directo, pausar y
    reanudar, y republicar en pausa. EJECUTADO.
  - N1 en el log real de dev. EJECUTADO; de ahí sale el N1 nuevo.
  - Migración 0088: el relleno medido en la base de dev, y el evaluador desplegado. EJECUTADO.
  - Escenario 19 con la cuenta de QA sin `admin` y con `csm-team`, y el rol devuelto al terminar.
    EJECUTADO, con autorización del usuario.

  ## Resultado

  18 PASS y 1 FAIL (TR-209: 17 PASS, 1 FAIL y 1 bloqueado).
  - **Corregidos:** N1 de TR-209, O1 (opción B) y el diálogo de go-live, que ahora nombra la versión.
  - **Desbloqueado y en verde:** el escenario 19.
  - **N1 nuevo (baja):** el log dice "evaluated in live mode" en filas evaluadas con la jugada en sombra.
    Viene de #181, no de esta vuelta.
  - **Observaciones:** "1 instances" sigue; la frase dice "play" cuando se encendió una versión; hay una
    ventana entre la migración y el código; el límite solo lo protege el banco; hay tests que no aíslan
    sus datos.

  ## Condiciones para aprobar

  1. **N1:** que el log no afirme "live mode" en una evaluación hecha en sombra (guardar el modo, o no
     afirmarlo), con un test.
  2. **Recomendado para la subida a producción:** aplicar 0088 y el código sin nadie creando jugadas, y
     repetir después del despliegue la comprobación del bloque DO de la migración.
