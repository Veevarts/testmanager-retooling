notes: |
  ## Solution understood

  TR-211 reboto la historia por un N1 de baja severidad: el log decia "evaluated in live mode" en filas
  evaluadas con la jugada en sombra, porque el frontend deducia el modo del veredicto
  (`row.verdict === "shadow_fired" ? "shadow" : "active"`) y la fila del log no guarda el modo.

  El autor entrega el frontend #220, sin cambios en backend ni base. Aplica la segunda opcion que propuso
  QA, no afirmar el modo cuando no se sabe:
  - `mode` pasa a ser `"shadow" | "active" | null`;
  - `fired` implica live, porque la sombra nunca crea instancia;
  - `shadow_fired` implica sombra;
  - `blocked` y `error` quedan en null;
  - el pie del detalle solo nombra el modo cuando lo conoce, y si tampoco hay version no se pinta.

  ## Inferred technical tests

  - **Suites del frontend** sobre el main desplegado: vitest, tsc, eslint y contract:check. EJECUTADO:
    2877 passed.
  - **Mutaciones del adaptador y del pie**: las 5 que declara el autor y 3 de QA. EJECUTADO: 8 de 8
    detectadas.
  - **Regla contra el motor**: comprobado leyendo el worker que `fired` solo se escribe en live y
    `shadow_fired` solo en sombra. EJECUTADO.
  - **Build servido en dev**: el bundle y los chunks vivos contienen el arreglo, y el navegador los
    cargo. EJECUTADO.
  - **Log real de dev**: tres jugadas con todas las filas desplegadas, comparadas fila a fila con
    playbook_evaluation_log. EJECUTADO: 14 de 14 filas concuerdan.
  - **Backend**: sin cambios para playbooks desde TR-211, que era 1b8f067a (dev corre a2ceb94b); valen
    sus suites.

  ## Resultado

  19 PASS y 0 FAIL (TR-211: 18 PASS y 1 FAIL).
  - **Corregido:** N1 de TR-211. Ninguna fila bloqueada o con error afirma un modo; "live mode" solo
    aparece en filas `fired` y "shadow mode" solo en `shadow_fired`.
  - **Observaciones que siguen**, anotadas por el autor fuera de esta vuelta:
    - "1 instances";
    - "play" o "version", y el log no dice que version evaluo cada fila;
    - la ventana de la subida a produccion;
    - el limite solo lo protege el banco;
    - un test que no aisla sus datos;
    - el job de Playwright del frontend no ejecuta nada por un secreto caducado.

  ## Veredicto

  Aprobado por QA en dev. Para produccion queda la condicion que el autor ya dejo en la descripcion: no
  encender ninguna jugada en produccion antes de desplegar el codigo, y repetir despues la comprobacion
  del bloque DO de 0088.
