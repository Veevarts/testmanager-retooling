notes: |
  ## Solution understood

  TR-210 dejo dos defectos. N1: un periodo desmesurado no se rechazaba; 1900..2026 superaba el limite de 6 MB de
  Lambda, y la pestana lo enviaba desde un enlace. N2: al pasar a Custom range, el selector de fin quedaba vacio.

  El autor entrega:
  - **Backend #410:** el periodo principal debe caer en la ventana de lectura, que va del mes en curso menos
    READ_WINDOW_MONTHS (36) al mes en curso; la SQL lee esa misma constante. Una comparacion a medida debe
    terminar dentro. Si no, 400 con un motivo que nombra la ventana y lo enviado. Los extremos por defecto se
    acotan, asi que la peticion por defecto y la de Overview nunca se rechazan. La comparacion anterior y la de
    anios atras no se limitan. Ademas se fija number_of_chargebacks_won en Payments & Risk.
  - **Frontend #216:**
    - el rango y el inicio de comparacion de un enlace se acotan a los meses con datos antes de enviar nada, y
      mientras no se conocen esos meses se pide el periodo por defecto;
    - un rango sin ningun mes con datos vuelve al periodo por defecto;
    - el rango copiado al pasar a Custom range se acota igual;
    - los presets de calendario usan el mes UTC, el reloj del backend.

  ## Inferred technical tests

  - **Matriz de API en dev:** las 30 peticiones de TR-210 y 19 casos de borde de la ventana, comparadas byte a
    byte con TR-210. EJECUTADO: 29 de 30 identicas; los 19 bordes se comportan como se diseno.
  - **Oraculo independiente** desde las filas de dev, sobre los 25 periodos con respuesta 200. EJECUTADO: 897
    comprobaciones por metrica, 0 fallos, control positivo en rojo.
  - **Servicio real antes y despues** (1b8f067a -> a2ceb94b) con tres conjuntos de filas y los rangos extremos
    en local. EJECUTADO: solo cambian las 11 llamadas de fuera de la ventana.
  - **Pestana en dev:** enlaces desmesurados, parcial y totalmente sin datos, e inicio de comparacion fuera, con
    la red registrada, y el paso a Custom range desde This quarter y Year to date. EJECUTADO.
  - **Suites, tipos, contrato y 18 mutaciones** (5 del autor y 13 de QA). EJECUTADO: 18 de 18 detectadas.

  ## Resultado

  18 PASS y 0 FAIL (TR-210: 16 PASS y 2 FAIL). N1 y N2 corregidos, sin regresion en los numeros ni en Overview.

  Observaciones:
  - **O7:** un enlace sin ningun mes con datos, o con una comparacion que solaparia, se corrige sin aviso.
  - **O8:** abrir Custom range cambia el periodo y la comparacion.
  - **O9:** ajeno a la historia. El index.html se sirve con un anio de cache en dev y en produccion, asi que tras
    un despliegue la pestana puede quedar en error hasta forzar la recarga.

  ## Veredicto

  Aprobado por QA en dev. Para produccion: el backend antes que el frontend, y ver O9. La historia sigue en
  Cerrada en Jira, estado desde el que el flujo no permite aprobar.
