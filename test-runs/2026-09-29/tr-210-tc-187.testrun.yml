notes: |
  ## Solution understood

  La pestana Metrics mostraba un solo mes, a menudo con dos meses de retraso. El PR del backend ("#405")
  anade a GET /csm/workspace/account-metrics un periodo principal y uno de comparacion de la misma
  longitud, con totales por periodo (flujos sumados y niveles al final, segun la clasificacion del
  catalogo de playbooks; lo no clasificado solo tiene valor en un mes), tendencias agrupadas por mes,
  trimestre o anio con la comparacion alineada por indice, las comparaciones que tiene sentido ofrecer
  y las agrupaciones que dan dos o mas puntos. Los huecos siguen a produccion: mes reportado sin fila =
  0, mes no reportado = desconocido, y antes de la primera fila de una metrica = desconocido. La ventana
  de lectura pasa a 36 meses y la vista sin filtros re-aplica su horizonte de 18 para no cambiar
  Overview. El PR del frontend ("#212") pone la barra de filtros, el estado en la URL, el modal con la
  misma agrupacion, los estados vacios, el 400 que reinicia y la recarga fallida que conserva el
  resultado.

  ## Inferred technical tests

  - Suites y tipos sobre main, contando ficheros. EJECUTADO: backend src/csm/workspace 303 tests en 13
    suites; frontend csm 2351 tests en 120 ficheros (1 saltado, ajeno); tsc en los dos; contract:check.
  - Mutaciones, una por regla (15). EJECUTADO: 14 detectadas; M06 (chargebacks won a other) no.
  - Oraculo independiente desde las filas crudas de la base de dev contra 30 peticiones a la API.
    EJECUTADO: 702 comprobaciones por metrica, 0 discrepancias; control positivo con 5 desviaciones
    sembradas, todas detectadas.
  - UI contra API en los 7 presets (273 tarjetas) y en los modales. EJECUTADO: 0 discrepancias.
  - Regresion de Overview antes/despues con el servicio real y las mismas filas. EJECUTADO: identica.
  - Regla del mes no reportado: con el servicio real en local, quitando un mes. EJECUTADO.
  - Seguridad: inyeccion (los filtros no llegan al SQL), lista blanca de parametros, secretos en el
    diff, y consumo de recursos. EJECUTADO; de ahi sale N1.

  ## Resultado

  16 PASS y 2 FAIL.
  - **N1 (media):** un periodo desmesurado no da 400: en dev supera el limite de 6 MB de Lambda (413) y la
    pestana queda en "Failed to fetch"; en local 0001-9999 consume 3.2 GB y 36 s.
  - **N2 (baja):** al pasar a Custom range desde This quarter o Year to date, el selector de fin queda
    vacio ("End") mientras se aplica un rango hasta Sep 2026.
  - Observaciones O1-O6 en hallazgos.txt; la mas relevante para producto es O1: 7 de 39 metricas no
    tienen total en periodos de varios meses, 4 mas de las que nombra la historia.

  ## Condiciones para aprobar

  1. **N1:** el backend rechaza con 400 y motivo un periodo o una comparacion fuera de un tope, el
     frontend no los envia desde la URL, y un test fija el 400.
  2. **N2:** los selectores de Custom range muestran siempre el rango aplicado.
  3. Recomendado: decidir O1 (clasificar los chargebacks won y los *_inactive) y fijar
     number_of_chargebacks_won en un test.
