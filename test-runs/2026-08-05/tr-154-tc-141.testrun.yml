  status: passed
  executedAt: '2026-08-05T20:08:22Z'
  actual: |-
    AC7 EJECUTADO Y PROBADO — el escenario que TR-152 y TR-153 habían excluido por creer que la org
    era productiva.

    Run 2 (dd1d8959) contra la misma org, sin tocar nada entre corridas:

      PlanRun            completed · 3/3 done · 0 failed
      duración           ~3.7 min   (vs ~24 min del run 1 -> 6.5x)
      install requests   1          (vs 9 del run 1)
      paquetes nuevos    0          (15 antes, 15 después)
      04t de los 15      idénticos  (cero reinstalaciones, cero duplicados, cero cambios de versión)

    >>> Los 8 paquetes instalados por el run 1 generaron CERO PackageInstallRequest en el run 2. <<<

    No se reinstalaron rápido: el job no se sometió. La detección de "ya está en versión" ocurre
    ANTES del submit, que es exactamente lo que declara el contrato del case ("Idempotent — a
    package already at version reports already-installed, so re-running is a no-op").

    Probado en dos planos independientes: el de la app (PlanRun verde) y el de la org (0 requests +
    estado byte-idéntico). El segundo es el determinante porque no depende de lo que reporte la app.

    El step manual de NPSP volvió a parquearse en la re-corrida y atestarlo no disparó reinstalación
    de la cadena.

    OBSERVACIÓN (severidad baja, no invalida el AC): el pin de Auctifera 04tHo000000KySOIA0 se
    somete en AMBAS corridas y Salesforce lo rechaza con "A newer version of this package is
    currently installed" (la org tiene 8.318.0.2). El installer lo tolera y la corrida cierra verde,
    pero la detección de already-installed no cubre el caso "hay una versión más nueva instalada",
    así que cada corrida quema un intento y deja un request en ERROR en la org.
  notes: Evidencia en attachments/tr-154-tc-141/run2/noop-rerun-transcript.txt, post/pre-vs-post-and-noop-proof.txt
