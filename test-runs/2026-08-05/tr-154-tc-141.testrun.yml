key: TR-154
title: 'TR-154 · IM-741 · TC-141 · AC7 verificado en vivo — dos corridas consecutivas del installer contra la misma
  org prueban el no-op; además corrige tres afirmaciones erróneas de QA, incluida la que sacó al AC7 del alcance'
description: |-
  Tercera ejecución de TC-141, disparando **dos corridas reales del IE** por la API de la Migration App contra la
  org **`00DWI00000GLw9R2AT`** (`momentum-flow-9884-dev-ed.scratch`). Completa TR-152 (verificación a nivel de
  código) y TR-153 (primera corrida en vivo, que murió en el AuthBroker).

  **Veredicto: 7/7 PASS · 0 defectos · 1 observación de severidad baja · 1 hallazgo lateral fuera de alcance.**

  ## Lo que desbloqueó todo: la org nunca fue de producción

  TC-141, TR-152 y TR-153 trataron `00DWI00000GLw9R2AT` como una org productiva, y sobre esa creencia se excluyó
  el AC7 del alcance de QA. La medición dice otra cosa:

  | campo | valor |
  |---|---|
  | `Organization.Name` | **IM-735 Package Install Test** |
  | `OrganizationType` | Developer Edition |
  | `IsSandbox` | true |
  | `TrialExpirationDate` | 2026-08-29 |

  Es una scratch desechable creada para probar este ticket. **El AC7 siempre fue QA-ejecutable**; la exclusión se
  apoyó en un hecho equivocado, no en una regla. Escenario 7 restituido y ejecutado.

  ## Las dos corridas

  La org tenía Tier 0 completo (Auctifera 8.318.0.2 + NPSP 3.237.0.2 + sus 5 dependencias) y **cero paquetes
  Veevart**, así que no estaba "ya instalada" y el AC7 exigía dos corridas:

  | | run 1 `6e4ab4cb` | run 2 `dd1d8959` |
  |---|---|---|
  | resultado | `completed` 3/3, 0 failed | `completed` 3/3, 0 failed |
  | duración | ~24 min | **~3.7 min** |
  | install requests | 9 (8 SUCCESS + 1 ERROR) | **1** (el mismo ERROR) |
  | paquetes nuevos | 8 (7 → 15) | **0** |

  **Los 8 paquetes que instaló el run 1 generaron CERO `PackageInstallRequest` en el run 2.** No es que se
  reinstalaran rápido: el job no se sometió. La detección de "ya está en versión" ocurre antes del submit, que es
  el contrato que la propia descripción del case declara: *"Idempotent — a package already at version reports
  already-installed, so re-running is a no-op"*. Estado final byte-idéntico: mismos 15 paquetes, mismos `04t`,
  cero duplicados.

  El AC7 queda probado en **dos planos independientes**: el de la app (PlanRun verde) y el de la org (0 requests +
  estado inmutable). El segundo es el que vale, porque no depende de que la app diga la verdad.

  ## AC1 medido contra la org, no contra el código

  El orden real de instalación reprodujo exactamente la regla de tiers de `package-install-order.ts`, incluidas
  las dos trampas de collation que el AC describe: VNFP quedó **antes** de los `Veevart …` (no al final), y
  `VeevartDataModel` **antes** de `Veevart Ticketing`, que depende de él. Un install-job por paquete, cada uno
  poleteado a terminal antes del siguiente (~1m24s entre cierres, sin solape).

  ## Tres correcciones a lo que QA había afirmado

  1. **La org no es productiva** (arriba) — cambió el alcance del TC.
  2. **"El AuthBroker de dev no mintea sesión para ninguna org" era falso.** Hoy minteó sin problema, y el listado
     del workspace muestra corridas verdes contra illinois-trainings el 2026-07-27. El diagnóstico correcto es el
     que QA había planteado *primero* y luego descartó: los fallos del 2026-08-04 eran de **autorización de esas
     orgs concretas** en el AuthBroker — justo la precondición que el ticket declara dos veces. La org que
     funcionó hoy fue autorizada 30 min antes de correr; las que fallaron databan de junio y julio.
  3. **El case es `ic-3-01-install-veevart-packages`** (order 300), no `ic-3-01-install-auctifera` (order 297, que
     es el install manual de Auctifera). Referencias previas a "re-correr ic-3-01" eran ambiguas.

  ## Observación abierta (severidad baja, no bloquea)

  En **ambas** corridas el installer somete `04tHo000000KySOIA0` (pin de Auctifera) y Salesforce lo rechaza:
  *"A newer version of this package is currently installed"*. La org tiene 8.318.0.2, más nueva que el pin. El
  installer lo tolera y la corrida cierra verde, así que el AC7 se cumple — pero la re-corrida no es un no-op
  *limpio*: la detección de already-installed cubre "misma versión" y no "hay una más nueva instalada". Cada
  corrida quema un intento y deja un `PackageInstallRequest` en ERROR que un IE auditando la org verá como rojo
  en una corrida verde. Recomendación al dev en el adjunto.

  ## Hallazgo lateral (fuera del alcance de IM-741)

  La página **Audit log** de un plan run está siempre vacía porque el endpoint que consume no existe:
  `GET /implementations/runs/{planRunId}/audit` → **404**. Verificado sobre un run `completed` con transiciones
  reales y una atestación humana. No es responsabilidad del installer, pero deja sin trazabilidad cualquier
  corrida del IE.
