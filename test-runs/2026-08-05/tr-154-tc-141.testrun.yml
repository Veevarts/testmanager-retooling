  actual: |-
    Sostenido desde TR-152 a nivel de código: jobIdempotencyKey() en t1-installer.http-adapter.ts
    hace `stepIdempotencyKey.replace(/#\d+$/, '')` para quitar el intento y le concatena el
    packageVersionId, así que la llave es attempt-independiente por construcción.

    La re-corrida de hoy aporta evidencia consistente en el plano observable: ningún paquete ya
    instalado se instaló dos veces, que es el efecto que la idempotencia debe garantizar.
  notes: Verificación directa de la llave = código + mutación (TR-152); aquí solo el efecto observable
