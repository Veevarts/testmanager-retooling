  status: passed
  executedAt: '2026-08-05T20:02:00Z'
  actual: |-
    Sostenido desde TR-152: el requeue vía POST /install-jobs/{jobId}/retry ocurre exactamente una
    vez para un ERROR con retryable:true, un segundo ERROR retryable declara el fallo sin volver a
    reintentar, y un ERROR con retryable:false (o sin el campo) no se reintenta. Cobertura probada
    load-bearing por mutación.

    Ninguna de las corridas de hoy produjo un ERROR retryable del servicio, así que no había ruta
    viva que ejercitar sin fabricar un fallo artificial.
  notes: Verificado por código + mutación en TR-152; no reproducible en vivo sin inducir un fallo del servicio
- scenarioIndex: 6
