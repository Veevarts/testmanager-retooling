  status: passed
  executedAt: '2026-08-05T20:02:00Z'
  actual: |-
    Verificado en TR-153 contra fallos reales: al morir el step de instalación, el step siguiente
    del mismo case quedó en `pending` y NUNCA se intentó, en las 3 corridas fallidas, con la causa
    raíz propagada verbatim en el campo `error`.

    Las corridas de hoy confirman el lado complementario del mismo mecanismo: el handoff parqueado
    dejó al step auto siguiente en `pending` (no `running`) en ambas, que es el comportamiento que
    introdujo el PR #334. El engine no adelanta trabajo del mismo case mientras el anterior no cierre.
  notes: Evidencia de fallo real en TR-153; confirmación del gating en attachments/tr-154-tc-141/run1/install-run-transcript.txt
- scenarioIndex: 7
  testCaseId: 6539596d-d2b4-4f9e-84e7-30069c824578
