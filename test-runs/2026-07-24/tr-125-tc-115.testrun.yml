description: |
  QA de IM-1075 (Historia, priority Medium, epic IM-735 Implementation Cases Automation).
  QA Sub-task: IM-1120. PR bajo prueba: Veevarts/MigrationAppBackend#247 (spec catalog v3,
  MERGED 2026-07-15, merge commit 60fb2165). Config-plan IC ejecutado target-side via
  Migration App (API-first, Path A). Org: illinois-trainings (00DWI00000CIwZi2AL).

  Reconciliación de versión (patrón "catalog leads the PR"): el catálogo LIVE está en v4,
  pero PR #247 entregó v3. El bump v3→v4 lo hizo IM-1090 #262 (housekeeping: de-dupe,
  defaultOrder, master-template policy) — diff v3 vs v4: solo case.version + template.version
  + el campo `description` del step 1 (prosa); los 17 steps son funcionalmente IDÉNTICOS.
  Correr el plan live (v4) valida fielmente lo que IM-1075/PR #247 (v3) entregó. NO es defecto.

  Método QA (independiente):
  1. Fetch spec JSON en merge-commit (v3) y main (v4) via gh api; diff → v4 housekeeping-only.
  2. PRE baseline read-only en illinois-trainings (sf CLI): ProfileLayout, picklist, layout inventory.
  3. IE run API-first: POST plan-run → AWAITING_INPUT (10 selects) → resolver → poll → atestar MANUAL.
  4. POST-verify por AC: Profile read-back (Metadata API layoutAssignments), Layout relatedLists,
     picklist describe.

  Resultado: run 6b31d90b-34da-404c-a97b-f6527fc6bd11 **completed** — 17/17 done, 0 failed.
  Los 12 AUTOMATED completaron con verify interno; los 5 MANUAL atestados por instrucción
  explícita del QA (attesting-without-executing, test workspace). 5/5 ACs verificados. 0 defectos.

