    - Endpoint de handoff: el shape correcto es POST /implementations/plan-runs/<id>/steps/<caseRunId>/<stepId>/handoff
      (el shape <templateId>/<stepId> del memo da 404). caseRunId 20753785-9976-43a8-9360-19aa6c2e1e01.

    ## Solution understood

    PR #247 reescribe IC 6.02 org-agnostic: en vez de hardcodear los layout fullName
    version-específicos (el caveat Medium), el step 1 declara los 10 `select` de layout (uno
    por objeto ticketing) con discovery kind 'layouts' que descubre las opciones LIVE del org y
    reconstruye el prefijo namespaced (vnfp__/Auctifera__) que listMetadata elimina. Todos los
    inputs en el step 1 → el run parkea UNA vez (lección IM-928). Steps 2-10 asignan el layout
    elegido por objeto (T2, verify por Profile read-back). Step 11 remueve las related lists
    retiradas de Exhibition/Event. Step 12 agrega Admission+Education al picklist (T3). Steps
    13-17 son handoffs MANUAL (UI-only sin Metadata API subscriber-writable).

    ## Inferred technical tests (mapped to ACs)

    | Test                                                              | AC  | Executable? | Verdict |
    |-------------------------------------------------------------------|-----|-------------|---------|
    | Run parks once con 10 discovered selects + namespaced fullNames   | AC1 | YES (live)  | PASS    |
    | Layout assign → Profile read-back (Metadata API layoutAssignments)| AC2 | YES (live)  | PASS    |
    | Exhibition/Event related lists removidas (Layout metadata)        | AC3 | YES (live)  | PASS    |
    | Picklist Admission+Education activos + idempotent no-op (describe) | AC4 | YES (live)  | PASS    |
    | 5 MANUAL parkean como handoff + atestados (run completed 17/17)   | AC5 | YES (live)  | PASS    |

    ## Objective fit

    - Objetivo: automatizar IC 6.02 org-agnostic (sin fullName hardcoded), asignar los 10
      layouts, remover related lists retiradas, agregar picklist values, y handoff de los UI-only.
    - Delivered: run completed 17/17 en illinois-trainings; los 5 ACs verificados independiente.
    - Objective met? YES. 0 defectos.

