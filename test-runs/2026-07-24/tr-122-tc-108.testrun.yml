description: |
  QA re-validation para IM-1079 (Historia, priority Medium, epic IM-735 Implementation
  Cases Automation). QA Sub-task: IM-1109. Cambio del dev POSTERIOR a TR-117:
  Veevarts/MigrationAppBackend#289 (MERGED 2026-07-23 21:40Z, merge commit e097d63c,
  merge-base 8d66dba6). Promovido a stable por #291.

  Contexto: el usuario pidió re-validar el pendiente de IM-1079 (el open-risk
  BATCH_SCOPE=200) porque el dev hizo un cambio. El cambio (v4→v6) es un rework completo
  que RESUELVE los 3 open-risks que QA dejó en TR-117.

  Método QA:
  1. Fetch JSON spec + spec.ts en merge-commit (e097d63c, v6) y merge-base (8d66dba6, v4)
     via `gh api contents?ref=<sha>` (no-clone).
  2. Static contract v6: 2 AUTOMATED T6 steps, feasibility auto, 0 operator input,
     scope 2000/default mirroring el package, ambos Auctifera globals anon-callable.
  3. Supersession diff v4→v6: batchScope operator input REMOVIDO; MANUAL Cashier Drawer
     Control → AUTOMATED POSPurchaseCanceledReportBatch; idempotency guards NUEVOS.
  4. spec.ts inventory: 5 (v4) → 7 (v6) tests.
  5. PRE-baseline illinois-trainings (read-only): PaymentProp CronTrigger WAITING +
     CanceledReport 0 all-time.
  6. API-driven IE run (Path A) `ec9c6f1d` (fully-auto, sin operator input).
  7. POST-verify Tooling/Data API: ambas ramas de idempotencia.

  Evidencia clave:
  - **El open-risk BATCH_SCOPE=200 (unconfirmed by PM, confidence 70) queda RESUELTO por
    REMOCIÓN**: v6 elimina el operator input `batchScope` y hardcodea el scope replicando
    el propio package Auctifera — Payment Propagation `new POSPurchasePaymentPropagationBatch(15), 2000`
    (el 15=runAgainMinutes, scope 2000 = la Callable run_schedule del package); Canceled
    Report `new POSPurchaseCanceledReportBatch()` (default scope, el package no pasa scope).
    Ya no hay número mágico que PM confirme. spec.ts asserta `not.toContain('{{batchScope}}')`
    + `not.toContain('PropagationBatch(), 200)')` + `requiredInputs.length===0`.
  - **Cashier Drawer Control MANUAL → RESUELTO**: reemplazado por POSPurchaseCanceledReportBatch
    (global no-arg ctor, anon-callable) = el batch que el playbook original nombra. feasibility
    hybrid→auto, 0 MANUAL. spec.ts asserta 0 refs de `CashierDrawerControlBatch`/`Drawer`.
  - **NUEVO idempotencia + self-scheduling**: cada step reproduce el botón "Run & Schedule"
    (enqueue once + self-reschedule en finish() bajo JOB_NAME fijo). No-op cuando la
    CronTrigger recurrente O un live BatchApex job ya existen; solo enqueue en el else branch.
  - **Live run ec9c6f1d**: state=completed, total=2 done=2 failed=0, ambos steps `done`,
    fully-auto (nunca parkeó AWAITING_INPUT). El PRE-state ejercitó AMBAS ramas:
    * CanceledReport (0 all-time PRE): fresh enqueue → 1 job Completed @17:27:17Z + nueva
      CronTrigger WAITING NextFire 21:27:17Z (+240 min = `scheduleBatch(JOB_NAME,240,100)`).
    * PaymentPropagation (CronTrigger WAITING PRE): idempotent no-op → 0 jobs nuevos en la
      ventana del run [17:26-17:31Z]; schedule existente intacto (NextFire 17:39:10Z).

  Riesgos abiertos: ninguno material. Los 3 open-risks de v4 (TR-117) quedan resueltos.
  Nota cosmética: el comentario del spec.ts dice "Pins the v5 surface" pero los asserts +
  el JSON son v6 (off-by-one en el comment, no defecto).

