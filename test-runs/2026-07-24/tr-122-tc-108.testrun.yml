  notes: |
    - Re-validación pedida por el usuario ("valida el cambio del dev aunque esté cerrado,
      actualiza el test manager"). TC-108 actualizado v4→v6 (metadata.version 2). TR-117
      queda como registro histórico de la validación v4.
    - Session Cognito: el token expiró y el silent-SSO refresh NO funcionó esta vez — el
      app bounceó a un challenge de Google que requiere re-auth del usuario. El usuario
      completó el sign-in y reissued un token fresco (17 min TTL). Ver
      `[[reference-migrationapp-token-persistence]]` — a veces el "Continue with Google"
      exige challenge, no siempre es silent.
    - illinois-trainings alias autenticado (Connected). Ambos POS batch classes presentes.

    ## Solution understood

    v4 (PR #251, validado en TR-117) hacía `batchScope` un required operator input con
    default 200 TBD por PM (el open-risk). v6 (PR #289) hace un rework:
    - Elimina el operator input; hardcodea el scope replicando el package Auctifera
      (Payment Propagation new(15)@2000; Canceled Report new()@default).
    - Reemplaza el MANUAL Cashier Drawer Control (public non-global ctor, no anon-callable)
      por el AUTOMATED POSPurchaseCanceledReportBatch (global, anon-callable) = el batch
      que el playbook nombra → feasibility auto, 0 MANUAL.
    - Cada step reproduce "Run & Schedule": enqueue once + self-reschedule en finish() bajo
      JOB_NAME fijo. Idempotencia: no-op si existe CronTrigger recurrente O live BatchApex
      job; solo enqueue en el else branch. Verify via AsyncApexJob query-back; VerifyException
      (step FAILED) si no verifica. Clase non-global → compile-fail → step FAILED. Nunca false pass.

    ## Inferred technical tests (mapped to ACs)

    | Test                                                          | AC   | Executable here? | Verdict |
    |---------------------------------------------------------------|------|------------------|---------|
    | Static contract v6 (2 auto T6, scope 2000/default, no input)  | AC1  | YES (no-clone)   | PASS    |
    | Supersession diff v4→v6 (batchScope removed, Drawer→CanceledReport) | AC1 | YES        | PASS    |
    | spec.ts inventory (7 tests pinning v6)                        | AC1  | YES (no-clone)   | PASS    |
    | Step1 idempotent no-op (CronTrigger present)                  | AC2  | YES (live)       | PASS    |
    | Step2 fresh enqueue + self-schedule (0→1)                     | AC3  | YES (live)       | PASS    |
    | Org-agnostic grep + verify-or-fail + Drawer removed           | AC4  | YES              | PASS    |

    ## Objective fit

    - Ticket objective (revisited): el dev resolvió el BATCH_SCOPE default sin depender de
      confirmación PM, replicando el package; y automatizó el 2º batch correcto del playbook.
    - Delivered: v6 fully-auto, scope mirroring package, idempotente, self-scheduling,
      verificado live end-to-end en illinois-trainings (ambas ramas).
    - Objective met? YES. Los 3 open-risks de v4 resueltos. 0 defectos. El pendiente cierra.

