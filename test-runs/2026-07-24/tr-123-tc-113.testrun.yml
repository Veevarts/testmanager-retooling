key: TR-123
title: "IM-560 · TC-113 · Altru split-receipting membership donation splits — 4/5 PASS · 1 not-run (aspen 11/$29,507 re-derivado EXACTO + rev-10026520 $5k/2026-02-02 clavado; static+fast+lint+build verdes; High Desert orphans + docker-14 diferidos por falta de perfil/Docker)"

description: |
  QA de IM-560 (Historia, priority High, epic IM-70 Altru Queries). QA Sub-task: IM-1118.
  PR bajo prueba: Veevarts/MigrationToolETL#152 (MERGED 2026-07-24, merge commit 1f3ac47b,
  merge-base 74edd98e). Change-type: SQL-only ETL (4 SQL files) + jest query-regression specs.

  Bug reportado (Sara Montenegro): un donation record de Aspen (rev-10026520, $5,000,
  2026-02-02) no aparecía en Veevart ni en los query results. Root cause: los donation
  revenue splits atados a membership lines (ventas "combination" de Altru) se caían de TODAS
  las rutas de export — su fund assignment se emitía en ninguna parte.

  Método QA (independiente del PR body):
  1. Extracción de las 4 SQL en merge-base (74edd98e) y merge-commit (1f3ac47b) via git show.
  2. Re-derivación FRESCA del cohort split-receipting desde tablas fuente (FINANCIALTRANSACTIONLINEITEM
     + REVENUESPLIT_EXT donation split cuyo SOURCELINEITEMID es una membership line respaldada
     por MEMBERSHIPTRANSACTION no-Drop) — NO se corrió la query del dev, se escribió una propia.
  3. safesql aggregate (solo count+sum, cero PII) en aspen / illinois_2 / tucson.
  4. Tests jest en el merge-commit (static gate spec + fast query-regression + lint + build).

  Evidencia clave:
  - **aspen: 11 FA / $29,507.00 EXACTO** vs los números firmados por el dev — re-derivación
    independiente que matchea al centavo. n_ranked_all = n_dedup = 11 (sin fan-out; el rank
    guard no descartó nada).
  - **rev-10026520 clavado**: en el cohort post-fix hay exactamente 1 donation split de
    $5,000 con fecha de membership transaction 2026-02-02 = el registro reportado. Pre-fix la
    rama `SplitReceiptingDonationLines` no existe (grep=0 en 74edd98e, =2 en 1f3ac47b) → el
    registro no se emitía. Objetivo cumplido.
  - **static gate-contract spec 13/13 PASS**: gate parity byte-idéntico entre los 3 SQL de
    donación, rank guard, reversal symmetry, branch present — verificado en el merge-commit.
  - **fast query-regression 329 passed / 55 skipped / 0 FAIL** + lint clean + build clean.
  - **illinois + tucson: 0 split-receipting lines** (zero-delta confirmado en 2 de los 5
    perfiles "no afectados").

  Diferido (no ejecutable en el host QA):
  - **S3 High Desert orphans (13 Opps/$34,426)**: no hay perfil safesql `high-desert` +
    Docker abajo (el orphan shape solo vive en el fixture dockerizado). NOT-RUN.
  - **S2 MOAD (322/$48,120) + High Desert (6,940/$1.55M)**: sin perfil safesql → dev evidence
    pre-merge se mantiene; la re-derivación exacta en aspen corrobora el método.
  - **S4 everson/kidstream/long-island**: sin perfil safesql → diferido.
  - **S5 suite dockerizado (14 IM-560 scenarios, 343 tests)**: Docker daemon abajo en el host
    QA → dev evidence (343 pass) se mantiene; el static+fast+lint+build lo corroboran.

  0 defectos. 0 hallazgos de seguridad. El registro reportado queda demostrado emitiendo su
  fund assignment post-fix y ausente pre-fix.

