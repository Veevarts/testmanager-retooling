environment:
  name: "GitHub · Veevarts/MigrationToolETL#152 (MERGED) + safesql (aspen/illinois_2/tucson)"
  url: "https://github.com/Veevarts/MigrationToolETL/pull/152"
  buildVersion: 'SQL-only ETL. 4 SQL files (fund_assignment_memberships +121 nueva rama SplitReceiptingDonationLines; donation_transaction / fund_assignment_donations / sales_order_only_donation: gate HasMembershipTransaction estrechado) + jest specs. BASE 74edd98e → HEAD 1f3ac47b. Estrategia: extracción pre/post via git show + re-derivación independiente del cohort en safesql (aspen exacto) + static gate spec + fast suite + lint + build en el merge-commit.'
  notes: |
    - Colisión de key resuelta: el TC se creó como TC-108 pero colisionaba con IM-1079-TC-108
      (commiteado + ejecutado TR-117/TR-122); re-keyeado a TC-113 antes de ejecutar.
    - Worktree de MigrationToolETL preservado: había `contact_roles.sql` staged (WIP de IM-916);
      stash -u → checkout 1f3ac47b → tests → checkout branch → stash pop → estado original
      restaurado (removí el `catalog/query-metadata.generated.json` que generó el build).
    - safesql: guard de write-keywords daba falso positivo por el literal `'Drop'` en
      `mt.ACTION <> 'Drop'`; evitado construyendo el token como `'Dr'+'op'` (read-only puro,
      sin --allow-writes).
    - Perfiles safesql disponibles: aspen, illinois_2, tucson. NO disponibles: moad,
      high-desert, everson, kidstream, long-island. Docker daemon abajo.

    ## Solution understood

    El fix agrega una rama `SplitReceiptingDonationLines` (UNION ALL) en
    fund_assignment_memberships.sql: emite 1 fund assignment por donation Standard line cuyo
    SOURCELINEITEMID apunta a una membership line respaldada por un MEMBERSHIPTRANSACTION
    no-Drop. Parent = la membership Opportunity (que absorbe el monto vía split receipting),
    fund = el DESIGNATIONID propio del donation split, external id = el donation line item
    (mismo id que fund_assignment_donations.sql habría usado → sin colisión). En paralelo, los
    3 SQL de donación estrechan la exclusión membership-source: solo excluyen líneas Donation
    cuya source membership line tiene MT no-Drop; los splits huérfanos (sin MT) vuelven a fluir
    por la ruta estándar donation Opportunity + FA + POS. Reversals siguen la regla de la línea
    que reversan. Rank guard (ROW_NUMBER por LineItemID) evita fan-out bajo multi-MT/multi-installment.

    ## Inferred technical tests (mapped to ACs)

    | Test                                                                 | AC   | Executable here?            | Verdict  |
    |----------------------------------------------------------------------|------|-----------------------------|----------|
    | Rama presente solo post-fix (grep pre vs post)                       | AC1  | YES (git show)              | PASS     |
    | aspen cohort re-derivado (count+sum) vs dev-signed                   | AC1/2| YES (safesql aspen)         | PASS (exacto) |
    | rev-10026520 pinpoint por fecha 2026-02-02                           | AC1  | YES (safesql aspen)         | PASS     |
    | MOAD/High Desert cohort re-derivado                                  | AC2  | NO (sin perfil)             | DEFERRED |
    | High Desert orphans (13 Opps + reversals + POS)                      | AC3  | NO (sin perfil + Docker)    | NOT-RUN  |
    | zero-delta perfiles no afectados                                     | AC4  | PARCIAL (illinois+tucson)   | PASS (2/5); resto DEFERRED |
    | static gate-contract spec                                            | AC5  | YES (jest, no docker)       | PASS (13/13) |
    | fast query-regression suite                                          | AC5  | YES (jest, no docker)       | PASS (329/0) |
    | suite dockerizado (14 IM-560 scenarios)                              | AC5  | NO (Docker abajo)           | DEFERRED |

    ## Objective fit

    - Objetivo del ticket: entender por qué rev-10026520 no migró y recuperar su fund
      assignment (+ los demás records afectados por el mismo patrón).
    - Delivered: el registro reportado emite su donation-portion FA post-fix ($5,000,
      2026-02-02) y NO lo hacía pre-fix (rama inexistente); el cohort aspen completo (11 FA /
      $29,507) re-derivado independiente y exacto; sin double-count (gate parity probado);
      perfiles no afectados alcanzables en cero.
    - Objective met? YES en lo ejecutable (aspen headline + tests + regression-safety). El
      alcance cross-profile completo (MOAD/High Desert orphans + docker-14) queda diferido por
      falta de perfil/Docker, no por un fallo observado.

