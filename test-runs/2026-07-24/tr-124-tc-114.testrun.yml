description: |
  QA execution para IM-1076 (Historia, priority Medium, epic IM-735 Implementation
  Cases Automation). QA Sub-task: IM-1119. PR bajo test:
  Veevarts/MigrationAppBackend#248 (MERGED 2026-07-16, merge commit 7b6b15a2).

  Método QA:
  1. Fetch JSON spec en merge-commit (7b6b15a2) y merge-base (60fb2165) vía
     `gh api contents?ref=<sha>` — no clone required.
  2. Scenario 1 (AC1+AC2+AC3+AC4): 41/41 static assertions PASS sobre HEAD spec
     (case.version=2, feasibility=hybrid, defaultOrder=801, 6 steps, 4 T2 assign,
     1 T3 picklistValues ADD 'Store', 1 MANUAL Rental Path guide 7 actions,
     IM-928 single-park invariant [step 1 has 4 requiredInputs, steps 2-6 have 0],
     all 4 selects discovery.kind='layouts', zero hardcoded layout fullNames).
  3. PRE-baseline en illinois-trainings via sf CLI Tooling API: 0 explicit
     ProfileLayout rows para los 4 rentals objects (metadata-deploy landing como
     profile default, no surfaced en Tooling ProfileLayout view — same for POST);
     'Store' YA presente en Auctifera__Type__c value set (5 valores);
     Rental_Path PathAssistant YA existente (previous manual creation).
  4. Scenario 5 (AC1 adversarial): namespace prefix reconstruction confirmed
     LIVE via awaiting-input options — Rental Event usa `vnfp__` prefix (4 opts),
     Display/Storage Location + Resource + Rental Resource usan `Auctifera__`
     prefix. Discovery adapter reconstruyó ambos correctamente en el mismo run.
  5. Scenario 2 (AC1+AC2+AC3 live E2E): Run 1 (planRunId 303dc24d-8556-44db-9487-798e178431a3)
     completed 6/6 en 116 min wall-clock (auto phase ~13 min, gap por handoff gate).
     IM-928 single-park CONFIRMED live: step 1 parked awaiting-input UNA sola vez
     con los 4 selects poblados; steps 2-6 nunca parkearon.
  6. Scenario 4 (MANUAL step attest): POST /handoff body:{} sobre step 6 (Rental
     Path) en run 1 → 202 · run pasa a completed. Attesting-without-executing en
     test workspace — Rental_Path YA existía en PRE-baseline, no se creó nada nuevo.
  7. Scenario 3 (idempotency): Run 2 (planRunId e0db9bfd-4a6d-4cbc-afcd-23e47abce2f3)
     completed 6/6 en ~12 min sin handoff manual (finding notable: engine cerró
     step 6 automáticamente — Rental_Path ya presente + attestation carry-over
     template-level). POST-verify: 'Store' count sigue en 1 (idempotencia T3 ADD
     PASS), PathAssistant Rental_Path sigue en 1 (no duplicate).

  Evidencia clave:
  - Spec HEAD: attachments/tr-124-tc-114/spec/ic-8-01-rentals-page-layout.HEAD.json
  - Spec BASE: attachments/tr-124-tc-114/spec/ic-8-01-rentals-page-layout.BASE.json
  - Static assertions log: attachments/tr-124-tc-114/spec/scenario-1-static-assertions.txt
  - Run 1 final API state: attachments/tr-124-tc-114/api-evidence/run1-final.json
  - Run 2 final API state: attachments/tr-124-tc-114/api-evidence/run2-final.json
  - PRE-baseline: attachments/tr-124-tc-114/pre-baseline/ (all-layouts + 4 ProfileLayout snapshots)
  - POST-verify: attachments/tr-124-tc-114/post-verify/ (Type value set + PathAssistant snapshots per run)
  - OWASP scan: attachments/tr-124-tc-114/owasp-top10-scan.txt (pending write)

