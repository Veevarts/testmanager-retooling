scopeFit: |
  Scope-fit del PR 248 vs los AC del IM-1076:

  AC 1 - "Layout selections collected up front in a single park"
  -> Spec step 1 declara 4 requiredInputs (rentalEventLayout,
     displayStorageLocationLayout, resourceServiceLayout, rentalResourceLayout)
     con discovery.kind='layouts'. Steps 2-6 tienen 0 requiredInputs.
  -> Coverage: Scenario 1 (static) + Scenario 2 (live E2E).
  -> Status: PASS. Live confirmed: step 1 parked awaiting-input UNA sola vez.

  AC 2 - "Operator-selected layout is made active for each rentals object"
  -> 4 T2 assign steps, cada uno con layout={{operatorInputKey}} bound al
     select del step 1. Cada step verifica via Profile read-back interno.
  -> Coverage: Scenario 2 (live E2E — 4 T2 steps completed) + POST-verify.
  -> Status: PASS. Los 4 T2 completaron sin errors en run 1 + run 2.

  AC 3 - "'Store' value present on Display/Storage Location Type field"
  -> T3 picklistValues op='ADD' con {fullName:'Store', label:'Store'}.
     Idempotente: crea si ausente, no-op si presente.
  -> Coverage: Scenario 1 (static) + Scenario 2 (live) + Scenario 3 (idempotency
     second run).
  -> Status: PASS. PRE-baseline: 'Store' YA presente (count=1). POST run 1:
     count=1. POST run 2: count=1. Idempotency confirmed.

  AC 4 - "Rentals status Path created and activated (manual handoff)"
  -> MANUAL step 6 con guide.actions[] de 7 pasos. T3 CRUD deliberadamente NO
     usado (refused live con `insufficient access rights on entity:
     PathAssistant`).
  -> Coverage: Scenario 4 (MANUAL attestation-without-executing).
  -> Status: PASS. Rental_Path PathAssistant YA existía en illinois-trainings
     (previous manual creation). Run 1 parked blocked-human → attested via
     POST /handoff → completed. Run 2 auto-completed step 6 sin handoff
     (engine detected precondition already met OR attestation carry-over
     template-level).

