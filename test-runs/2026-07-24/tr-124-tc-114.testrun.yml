    | OWASP Top 10 applicability scan                         | -       | YES              | 1 Applicable PASS (A03), 9 N/A |

    ## Objective fit

    - Ticket objective: apply proven pattern 5.02/7.01/3.06 (operator-selected
      DISCOVERED layout selects, all declared on step 1 for single park).
    - Delivered part: spec v2 replaces hardcoded fullNames with DISCOVERED
