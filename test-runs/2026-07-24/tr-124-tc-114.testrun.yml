    ## Solution understood

    IC 8.01 v2 reemplaza los layout fullNames hardcoded (Medium-tier caveat) por
    operator-selected DISCOVERED select inputs, aplicando el pattern probado en
    5.02/7.01/3.06. Cambios claves del spec:
    - 4 T2 assign steps (uno por rentals object): Rental Event/Group, Display/
      Storage Location, Resource/Service, Rental Resource.
    - IM-928 lesson: TODOS los 4 selects declarados en step 1's requiredInputs
      (con discovery.kind='layouts') para que el run parkee AWAITING_INPUT UNA
      sola vez. Steps 2-6 sin requiredInputs.
    - Cada T2.layout usa placeholder {{...}} bound al valor operator-selected.
    - T3 picklistValues ADD 'Store' al value set LOCAL restricted de
      Auctifera__Display_Storage_Location__c.Auctifera__Type__c — idempotente
      (no-op cuando ya existe).
    - MANUAL step 6: Create + Activate 'Rental Path' status Path. PathAssistant
      metadata type es solo subscriber-writable via file-based Metadata API
      deploy() (T3 CRUD refused live con `insufficient access rights on entity:
      PathAssistant`), por lo que queda como handoff estructurado con 7-action guide.

