description: |
  QA de IM-1094 (Historia, priority Medium, epic IM-735 Implementation Cases Automation).
  QA Sub-task: IM-1123. PR bajo prueba: Veevarts/MigrationAppBackend#263 (CODE PR, +1736/-20,
  MERGED 2026-07-16, merge commit ed3da574, base 82c35b14). Migration App IC ejecutado target-side
  (Path A). Org: illinois-trainings (00DWI00000CIwZi2AL).

  Este NO es un spec-only PR: agrega un op T3 NUEVO (`businessProcess`) que autora Sales Processes +
  asegura OpportunityStage picklist values + asigna processes a record types dinámicamente, y reescribe
  ic-5-04 manual→auto (v2). Por eso la EVIDENCIA PRIMARIA es el jest code-contract.

  Método QA:
  1. jest code-contract (PRIMARIO): clone en merge ed3da574 + npm ci; correr las 4 suites tocadas +
     aislar los tests del op businessProcess; tsc --noEmit + eslint gates.
  2. genuinely-new proof: grep de marcadores del op en el adapter, base vs merge.
  3. static spec fidelity: ic-5-04 v2, feasibility auto, 6 stageValues + 2 processes.
  4. live authoring (Path A, illinois, PARCIAL por org-gap): PRE baseline OpportunityStage +
     BusinessProcess → IE run → POST-verify + 2ª corrida (idempotencia).

  Org-gap: illinois tiene NPSP (44 campos npsp__) pero 0 Opportunity record types / 0 sales processes
  (no es fundraising org como el CamiloDevOrg del dev). Por eso el live prueba stage-value ensure +
  BusinessProcess authoring + idempotencia + tolerate-absent; el assignToRemaining a RTs reales + el
  managed-RT-skip quedan cubiertos por los 17 jest unit tests + la verificación del dev en CamiloDevOrg.

  LENS NOTE crítico: el Tooling API `BusinessProcess` sObject es CIEGO a estos processes (devuelve 0) —
  quirk conocido de SF para BusinessProcess de objeto estándar. El lens autoritativo es
  `sf org list metadata -m BusinessProcess`, que confirma que NPSP_Default + Grants fueron creados
  (unmanaged). El 0 del Tooling NO es defecto (verificado, no asumido — casi se reporta un FAIL falso).

  Resultado: 5/5 PASS. 0 defectos.

