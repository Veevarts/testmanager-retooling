  notes: |
    - Es CODE PR → clone de MigrationAppBackend en merge ed3da574 + npm ci limpio + jest runner.
    - jest: 4 suites tocadas = 332 tests pass, 0 fail. businessProcess op (-t) = 17 pass, 0 fail.
      tsc --noEmit clean, eslint clean en los 3 archivos src tocados.
    - LENS: Tooling API BusinessProcess devuelve 0 (blind spot SF, objeto estándar); autoritativo es
      `sf org list metadata -m BusinessProcess`. Standalone metadata retrieve de BusinessProcess de
      objeto estándar también vuelve vacío (solo recuperable dentro del CustomObject).
    - Token Cognito válido (grupo admin) durante la corrida.

    ## Solution understood

    IC 5.04 era MANUAL (no automatable con los ops existentes: el modo recordTypes.businessProcess:
    {discover} solo ASIGNA un proceso existente, no lo AUTORA). PR #263 construye un op T3 nuevo
    `businessProcess` (catalog-declarative, zero per-IC code) que: (1) asegura los stage values en el
    OpportunityStage StandardValueSet (add/activate-only, nunca desactiva stock); (2) hace UPSERT de
    cada BusinessProcess (update-in-place por nombre, nunca duplica, idempotente) con stages ordenados;
    (3) asigna processes a record types resueltos dinámicamente (optional tolerate-absent; assignToRemaining
    salta record types managed sin fallar por CANNOT_MODIFY_MANAGED_OBJECT). Reescribe ic-5-04 a v2 auto.

    ## Inferred technical tests (mapped to scenarios)

    | Test                                                                  | Scenario | Executable? | Verdict |
    |-----------------------------------------------------------------------|----------|-------------|---------|
    | Static spec fidelity (v2 auto, 6 stageValues, 2 processes) + genuinely-new | S1  | YES (offline) | PASS |
    | jest code-contract (332 tests, 17 op) + tsc + eslint                  | S2       | YES (clone) | PASS    |
    | Live stage-value ensure (Pledged added, stock preserved)              | S3       | YES (live)  | PASS    |
    | Live BusinessProcess authoring (NPSP_Default+Grants) + idempotent     | S4       | YES (live, metadata lens) | PASS |
    | RT-assign optional tolerate-absent (live) + assignToRemaining/managed-skip (jest+dev) | S5 | partial live + jest | PASS |

    ## Objective fit

    - Objetivo: construir el op businessProcess (author process + ensure stages + dynamic RT assign,
      idempotent, tolerate-absent, managed-safe) y entregar IC 5.04 v2 auto.
    - Delivered: op verificado por 17 jest tests (todos los ACs) + tsc/eslint clean; live en illinois
      autora Pledged + NPSP_Default/Grants idempotente sin tocar el managed; tolerate-absent probado live.
    - Objective met? YES. 0 defectos.

