title: "IM-1072 · TC-117 · IC 6.03 History Tracking for Ticketing — 6/6 PASS · 0 defectos (runs a92bc85f + 502cad97 completed 5/5 each en illinois-trainings: EXCLUSIVE keep-list 7/17/15/7 con untrack real de 1 extra + formula-twins Total_Amount_2/Total_Visitors_3 + Name-exemption + MANUAL atestado + idempotencia)"

description: |
  QA de IM-1072 (Historia, priority Medium, epic IM-735 Implementation Cases Automation).
  QA Sub-task: IM-1122. PR bajo prueba: Veevarts/MigrationAppBackend#244 (spec-only, MERGED
  2026-07-15, merge commit 140e00d4). Config-plan IC target-side via Migration App (Path A).
  Org: illinois-trainings (00DWI00000CIwZi2AL).

  Reconciliación de versión: catálogo LIVE v3 = PR #244 (feasibility hybrid). Sin drift.

  Método QA (independiente):
  1. Fetch spec v3 en merge-commit 140e00d4 via gh api; análisis estático (exclusive flags,
     matchers vs literales, object-set, counts, formula-twin targets) + cross-check CSV Order 6.03.
  2. PRE baseline read-only en illinois (Tooling API FieldDefinition + describe IsCalculated):
     set tracked por objeto vs keep-list + estado formula de los twins de Group_Reservation.
  3. IE run API-first: POST plan-run → 4 AUTOMATED exclusive done + 1 MANUAL parkea → atestar → completed.
  4. POST-verify por escenario: keep-list exacta por objeto, formula-twins, Name-exemption.
  5. Segunda corrida para idempotencia (delta run1→run2).

  Diferencia vs IC 3.09 (IM-1070): este caso corre en modo EXCLUSIVE (destructivo). El PRE en
  illinois NO estaba uniformemente en target — Museum_Offer_Item tenía 18 fields tracked (17 keep +
  1 extra Ticket_Item_Subtotal_Canceled). El run destrackeó ese extra (18→17), dejando EXACTAMENTE
  la keep-list — prueba live del comportamiento exclusive, más fuerte que un no-op. Los formula-twins
  de Group_Reservation resolvieron a los fields non-formula (Total_Amount_2/Total_Visitors_3); los 3
  formula fields quedaron sin trackear. El standard Name de Museum_Offer se preservó (exclusive
  enumera solo CustomFields). El MANUAL Name se atestó (attesting-without-executing, test workspace).
  Segunda corrida idempotente (delta NONE). illinois = 3er org corrobora el two-org proof del dev.
  Resultado: 6/6 PASS. 0 defectos.

