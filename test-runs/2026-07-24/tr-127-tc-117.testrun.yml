environment:
  name: "Migration App (dev) · Veevarts/MigrationAppBackend#244 + Salesforce sandbox illinois-trainings"
  url: "https://github.com/Veevarts/MigrationAppBackend/pull/244"
  buildVersion: 'IC config-plan case (hybrid, spec-only PR). 1 file: ic-6-03-history-tracking-ticketing.json v2->v3 (PR #244, merge 140e00d4, +218/-55). LIVE catalog v3 = PR version (no drift). 5 steps: 4 AUTOMATED T3 historyTracking en modo EXCLUSIVE (Exhibition/Event=Inventory_Service 7, Ticket Item=Museum_Offer_Item 17, Ticket Offer=Museum_Offer 15, Ticketing/Reservation=Group_Reservation 7 = 46 fields con matchers IM-1069) + 1 MANUAL (standard Name). Estrategia: static spec fidelity + CSV cross-check + PRE baseline Tooling API/describe + API-first plan-run (Path A) x2 + POST-verify FieldDefinition/IsCalculated.'
  notes: |
    - PR spec-only: reutiliza el T3 historyTracking con matchers de IM-1069 y su modo `exclusive`.
      No agrega código; verificación estática = fidelidad del spec + CSV playbook.
    - EXCLUSIVE mode es destructivo: destrackea fields fuera de la keep-list. En illinois el único
      extra era Ticket_Item_Subtotal_Canceled (Museum_Offer_Item), destrackeado por el run (18->17).
    - Handoff endpoint: POST /implementations/plan-runs/<planRunId>/steps/<caseRunId>/<stepRunId>/handoff
      (shape caseRunId, no templateId). Atestado 2 veces (una por corrida) -> 202.
    - Token Cognito válido (~49 min, grupo admin) — sin re-login.

    ## Solution understood

    PR #244 lleva IC 6.03 de v2 a v3: (1) migra los 46 field names managed de string literal a
    matcher runtime {anyOf,label} (IM-1069) para tolerar drift de API names; (2) corre cada objeto en
    modo `exclusive` (keep-list enforcement: deja exactamente los fields listados tracked y destrackea
    el resto de CustomFields); (3) resuelve los formula-twins de Group_Reservation a los fields
    non-formula (Total->Total_Amount_2__c, Total Visitors->Total_Visitors_3__c) porque un formula
    field no es trackeable; (4) deja el standard Name ('Ticket offer name') como MANUAL (sin CustomField
    record; exclusive enumera solo CustomFields así que nunca lo destrackea). feasibility hybrid.

    ## Inferred technical tests (mapped to scenarios)

    | Test                                                                        | Scenario | Executable? | Verdict |
    |-----------------------------------------------------------------------------|----------|-------------|---------|
    | Static: 4 obj exclusive + counts 7/17/15/7 + 0 literals + formula-twin tgt  | S1       | YES (offline) | PASS |
    | Exclusive keep-list: exactly 7/17/15/7, untrack extras (FieldDefinition RB) | S2       | YES (live)  | PASS    |
    | Formula-twins: non-formula tracked, formula NOT (describe IsCalculated + RB) | S3       | YES (live)  | PASS    |
    | Exclusive abort-before-write safety                                          | S4       | cited (IM-1069 contract) | PASS |
    | MANUAL Name parks + attested + exclusive never untracks Name                | S5       | YES (live)  | PASS    |
    | Idempotency (delta NONE run1->run2) + 3rd-org two-org proof                  | S6       | YES (live)  | PASS    |

    ## Objective fit

    - Objetivo: entregar IC 6.03 org-agnostic + exclusive keep-list correcto (7/17/15/7) + formula-twin
      safe + Name manual, idempotente, probado en >=2 orgs.
    - Delivered: 2 runs completed 5/5 en illinois; keep-list EXACTA por objeto con untrack real del
      extra; formula-twins non-formula tracked / formulas no; Name preservado; MANUAL atestado; delta
      run2 NONE; sin drift. Los 6 escenarios verificados.
    - Objective met? YES. 0 defectos.

