  (Path A). Org: illinois-trainings (00DWI00000CIwZi2AL).

  Caso HYBRID que combina 4 mecanismos: Part A history tracking exclusive (como IC 6.03), un op
  T2 NUEVO setFieldBehavior (jest-verificado como IC 5.04), un operator input (select de layout,
  como IC 6.02), y un MANUAL handoff (Record Type, como IC 6.03). Evidencia primaria = jest.

  Método QA:
  1. jest code-contract (PRIMARIO): clone en merge 5aa676aa; correr la suite t2-page-layout +
     aislar los tests del op setFieldBehavior; tsc + eslint gates.
  2. genuinely-new proof (setFieldBehavior base=0 → merge=9).
  3. static spec fidelity: v3 hybrid, 3 steps.
  4. live end-to-end (Path A, illinois): Part A exclusive → atestar Record Type MANUAL → resolver
     input membershipLayout → Part B setFieldBehavior; POST-verify + 2ª corrida (idempotencia).

  Estado del org: illinois tiene los membership fields (npe01__Membership_Start/End_Date__c NPSP,
  vnfp__Membership_Program__c) + los Membership layouts (managed npsp/vnfp). PRE tracked Part A =
  6 keep-list + RecordTypeId (Part A ≈ no-op; verifica matcher resolution). Part B: la Veevart
  Membership layout (AC example) ya tenía los dates Required (idempotente); se eligió la
  npsp__Membership Layout que los tenía en Edit para probar la transición Edit→Required live.

  Nota eslint: los 4 errores en t2-page-layout.adapter.ts:578-587 son PREEXISTENTES (git blame
  c7662086, Camilo 2026-06-16, op recordTypes), NO introducidos por PR #243. Verificado por git
  blame, no asumido. Sin regression de lint nuevo.

  Resultado: 5/5 PASS. 0 defectos.

