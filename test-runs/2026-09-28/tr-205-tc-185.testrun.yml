notes: |
  ## Solution understood

  TR-202 rechazo la historia porque un segundo navegador sin el token recibia 404 DRAFT_NOT_FOUND,
  el cliente lo leia como "la encuesta cambio", vaciaba el formulario y no dejaba enviar durante
  90 dias. PR #91 hace cuatro cosas:
  - guardar y restaurar distinguen "hay un borrador activo con otro token" y responden 409
    DRAFT_ACTIVE_ELSEWHERE;
  - el cliente, en la pagina directa y en el widget, conserva lo escrito y muestra un aviso con un
    boton Continue here;
  - el boton reenvia con replaceExistingDraft: true, y el servidor reemplaza el borrador con una
    escritura condicionada al hash del token anterior (atomica frente a carreras);
  - los mensajes terminales solo dicen "la encuesta cambio" cuando cambio la definicion.
  No toca responses.ts (el envio), ni la infraestructura, ni los scripts de test.

  ## Inferred technical tests

  - Suites server, client e infra como el CI, contando ficheros ejecutados. EJECUTADO: 179, 85 y
    9, todo en verde; siguen fuera app.test.ts y ProgressDashboard.test.ts.
  - Cinco mutaciones sobre el arreglo. EJECUTADO: 4 detectadas; no la toma automatica al enviar.
  - Todos los escenarios de TR-202 otra vez, contra servidor y DynamoDB reales y base limpia.
    EJECUTADO.
  - Contrato del segundo navegador por API (9 pasos), tercero sin token y 40 carreras. EJECUTADO.
  - Segundo navegador y navegador desplazado en navegador real, pagina directa y widget. EJECUTADO.
  - Despliegue en dev: workflows, esquema servido y bundle servido, sin efectos. EJECUTADO.
  - Recorrido dentro del iframe de Salesforce. NO EJECUTADO: el arreglo solo esta en dev.

  ## Hallazgos (detalle en hallazgos-v2.txt)

  RESUELTO · el motivo del rechazo. El segundo navegador ya no ve un aviso falso, conserva lo que
  escribe, toma el borrador solo al pulsar Continue here y puede enviar. Carreras 20/20.

  N1 · MEDIA · EL NAVEGADOR DESPLAZADO PIERDE LO QUE TIENE EN PANTALLA AL ENVIAR (escenario 13).
  Con todo guardado, su Submit va con el token viejo; el envio responde 409 DRAFT_INACTIVE porque
  responses.ts no conoce el contrato nuevo, y el cliente vacia el formulario (en el widget lo
  sustituye por "no longer active"). Mismo tipo de perdida que TR-202, en el otro navegador.

  N2 · BAJA · CONTINUE HERE NO GUARDA LO ESCRITO CON EL AVISO VISIBLE (escenario 13). Guarda las
  respuestas del primer conflicto; si el encuestado cierra justo despues, lo escrito entre medias
  se pierde. Enviando en la misma visita no se pierde nada.

  N3 · MEDIA · AC9 (escenario 9). Sin el token nadie lee un borrador, pero cualquiera que conozca
  encuesta, organizacion y encuestado puede reemplazar sus respuestas con replaceExistingDraft. Es
  consecuencia del arreglo sin identidad verificada (IM-1178). Decision de producto.

  F2 de TR-202 · SIGUE: app.test.ts (auth de Progress) y ProgressDashboard.test.ts no se ejecutan
  ni en local ni en el CI del merge.

  ## Lo que el arreglo deja bien atado

  El reemplazo atomico condicionado al dueno anterior, el aviso accesible (role=alert), la
  separacion de mensajes, que nada filtra respuestas a quien no tiene el token, y cuatro tests
  nuevos que si saben fallar.
