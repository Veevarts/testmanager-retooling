notes: |
  ## Solution understood

  El dev mergeo PR #92 en develop (da19283f) y devolvio IM-1302 a "In QA Review". El arbol del merge
  es identico al head 5656962f probado en TR-206, y dev sirve su bundle byte a byte. Sigue sin
  reescribirse el AC9: la decision de producto sobre su traslado a IM-1309 esta pendiente.

  Esta ronda hace dos cosas: repite en local todo lo de TR-206 sobre el codigo mergeado, y ejecuta
  por primera vez el escenario 12 en el entorno desplegado, dentro del iframe de Salesforce de una
  org de pruebas de Survey Tool (nps_03) que apunta a dev.

  ## Inferred technical tests

  - Suites y build como el CI, contando ficheros. EJECUTADO: servidor 180/180 (13/13 ficheros),
    cliente 89/89 (16/16), build en verde con el mismo bundle que sirve dev.
  - Fallo del CI del PR #90 (test 4 del widget colgado 8 min). EJECUTADO: 30/30 en local, 15 con la
    CPU cargada. Parada del runner, no del codigo.
  - Corrida local completa (API y dos navegadores) sobre da19283f. EJECUTADO: identica a TR-206.
  - Recorrido funcional en el iframe real de Salesforce contra dev, con Progress y Summary del admin
    de dev. EJECUTADO: guardar, keepalive al cerrar, restaurar y continuar funcionan; ENVIAR falla.
  - Envio directo sin token (cliente heredado identificado) contra dev. EJECUTADO: 500.

  ## Hallazgos (detalle en hallazgos-v4.txt)

  F1 · ALTA · En dev ningun encuestado identificado puede enviar: POST /api/responses da 500 con y
  sin borrador porque el rol de ejecucion no tiene dynamodb:ConditionCheckItem sobre las tablas
  surveys y respondent-state, que las transacciones de envio de PR #89 necesitan. Desde el 25-sep
  dev no registra ninguna respuesta identificada. Lo local no lo podia ver: DynamoDB Local no aplica
  IAM. Bloquea PR #90 hasta que los roles de staging y produccion tengan el permiso.
  S1 · SEGURIDAD · reportado por canal interno, no se detalla aqui.
  SIGUE · AC9 (escenario 9): pendiente de producto (IM-1309).
  OBSERVACIONES · check intermitente del PR #90; la escala NPS no cabe en el modal de Salesforce.

  ## Condiciones para aprobar

  1. Anadir dynamodb:ConditionCheckItem al rol de ejecucion de la app sobre surveys y
     respondent-state en dev (y en staging y produccion antes de promocionar), y corregir la lista
     de permisos del README. QA repite el envio en el iframe de nps_03: el borrador que quedo
     pendiente debe poder enviarse con su token.
  2. Producto acepta que la mitad "modify" del AC9 pase a IM-1309 y lo refleja en el AC.
