notes: |
  ## Solution understood

  TR-205 rechazo el arreglo del segundo navegador (PR #91) por tres cosas: el navegador desplazado
  perdia lo que tenia en pantalla al enviar (N1), Continue here guardaba el payload del primer
  conflicto (N2) y dos ficheros de test no se ejecutaban (F2). PR #92 corrige las tres:
  - responses.ts responde 409 DRAFT_ACTIVE_ELSEWHERE al envio con un token que no es el del borrador
    en curso, y la pagina y el widget lo tratan como el conflicto del autosave: conservan lo escrito
    y ofrecen Continue here;
  - Continue here construye el payload con el estado actual (buildSurveyDraftAnswerPayload);
  - los scripts de test descubren los ficheros con find.
  Ademas, el widget deja de ocultar el formulario tras un error terminal y deshabilita los
  controles mientras envia. El AC9 no se toca: el dev lo traslada a IM-1309 (identidad firmada).

  ## Inferred technical tests

  - Suites y builds como el CI, contando ficheros. EJECUTADO: 180, 89 y 9 tests; 13/13 y 16/16
    ficheros; builds en verde, con el mismo bundle que el CI del PR.
  - Siete mutaciones. EJECUTADO: 5 detectadas, entre ellas M1 (auth de Progress, antes en verde);
    no se detectan M4 ni M9.
  - Escenarios de API de TR-205, contra servidor y DynamoDB reales. EJECUTADO.
  - Recorridos de TR-205 en navegador, repetidos para comparar N1 y N2. EJECUTADO.
  - Caminos nuevos: el desplazado recupera y envia; el otro ya envio; widget con cambio de
    definicion al enviar. EJECUTADO.
  - Recorrido en el iframe de Salesforce. NO EJECUTADO: PR #92 no esta ni en dev.

  ## Hallazgos (detalle en hallazgos-v3.txt)

  CORREGIDO · N1, N2 y F2 (los tests que no corrian).
  SIGUE · AC9 (escenario 9): sin el token no se lee nada, pero se puede reemplazar un borrador
  ajeno. El dev lo traslada a IM-1309; que se acepte es decision de producto.
  OBSERVACIONES · pagina y widget resuelven distinto "el otro navegador ya envio", y ninguno lo dice;
  Submit inerte en el widget tras un error terminal; M4 y M9 sin test.

  ## Condiciones para aprobar

  1. Producto acepta que la mitad "modify" del AC9 pase a IM-1309 (y lo refleja en el AC).
  2. PR #92 se mergea en develop y dev sirve el bundle nuevo (comprobacion sin efectos).
