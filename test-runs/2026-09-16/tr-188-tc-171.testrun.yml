  - testCaseId: "04485296-f4c6-4e47-b29b-3eb6822efcfc"
    testCaseKey: TC-171
    scenarioTitle: >-
      Target contract · The fields reach the right Salesforce API names and the package formulas really read them
    scenarioIndex: 3
    status: passed
    stepResults: []
    actual: |
      Metadata del paquete (AuctiferaDX main @ 8202e19), sin tocar ninguna org:
        Rental_Resource_Subtotals2__c y Rental_Resource_Taxes3__c: Currency(18,2), campos PLANOS.
        Event_Rental_Total_Amount__c = Subtotal__c + Total_Rental_Event_Taxes__c + Processing_Fees__c.
        Subtotal__c y Total_Rental_Event_Taxes__c intentan caer a los roll-ups con ISNULL, pero son
        BlankAsZero: ISNULL sobre un numero en blanco da falso y la formula usa 0. Es la causa del PR.
        El Apex que los calcula (setRentalResourceTaxesSubtotals) se invoca desde RentalResourcesTriggerHandler,
        que filtra los recursos con Disable_Trigger__c = true; todos los migrados lo tienen.

      Camino TS: los nombres son identicos en SQL, mapper, entidad y cabecera del pipeline. Ningun spec del
      repo lo ejercita (rental-event-query.spec.ts solo mira el texto SQL), asi que QA escribio uno contra las
      funciones reales: 6/6 PASS. El 0 que emite la query llega como 0 al CSV, no como blanco, que es lo que
      hace valer la decision del PR de emitir 0 para pisar valores ya cargados.

      pre-fix -> post-fix -> objetivo cumplido?: los campos que leen las formulas del total nunca se cargaban
      -> llegan con nombre y tipo correctos y las formulas los leen -> SI.
    notes: >-
      **PASS sobre la metadata fuente del paquete.** Precision a una afirmacion del PR: ademas del metodo de rollup, RentalEventCloneController tambien asigna esos campos (al clonar un evento); para el camino de migracion no cambia nada. OBSERVACION O2: el camino mapper -> pipeline no tiene test en el repo; conviene sumar el que escribio QA.
