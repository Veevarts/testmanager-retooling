notes: |
  ## Solution understood

  Event_Rental_Total_Amount__c suma formulas que leen Rental_Resource_Subtotals2__c y
  Rental_Resource_Taxes3__c. Esos campos no son roll-ups: los escribe un metodo Apex invocado desde el
  trigger de Rental Resource, que excluye los recursos con Disable_Trigger__c, y todos los migrados lo
  tienen. El export de eventos nunca los emitia, quedaban en blanco, y las formulas (BlankAsZero) leian 0
  sin caer a su fallback.

  El PR calcula ambos campos en rental_events_groups.sql por reserva, con la misma matematica por item
  que rental_resource.sql y excluyendo ordenes canceladas y tickets descartados, emite 0 en vez de NULL,
  y los lleva por entidad, mapper y pipeline. De paso preagrega SALESORDERITEMTAX por item en las dos
  queries, arreglando las filas de recurso duplicadas que producia un item con varios impuestos.

  ## Inferred technical tests

  Todos ejecutados en este run:
  - suite de contrato y suite de integracion Docker en 9555d56, con revert-proof de ambas;
  - chequeo de paridad del PR, verbatim, en Long Island;
  - verificacion independiente de QA en Long Island y Vizcaya con cadena de CTEs materializada;
  - grano del recurso y montos por item, PRE vs POST, fila por fila;
  - casos limite marcados con tablas base;
  - contrato con la metadata y el Apex del paquete;
  - test propio de QA del camino mapper -> pipeline;
  - regresion estatica y en vivo contra IM-1227; seguridad y OWASP.

  ## Hallazgos que conviene leer

  1. Long Island no tiene impuestos en alquileres; la mitad de impuestos se verifico en Vizcaya.
  2. Ninguna base alcanzable tiene items con varias tasas: el bug de duplicados solo se pudo probar en el
     fixture Docker, donde falla antes y pasa despues.
  3. Dos tests de integracion de "emite 0" pasan aunque falten las columnas (observacion O1).
  4. El camino mapper -> pipeline no tiene test en el repo; QA lo cubrio con uno propio (observacion O2).
  5. La base respondio hoy, contra lo que dice el body del PR.
  6. Orden de merge: el PR pide mergear 180 primero y volver a mergear main en 181, porque el repo hace
     squash.

