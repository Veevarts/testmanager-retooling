        recursos con Amount3 nulo                0                       0

      Long Island no tiene impuestos en alquileres; la mitad de impuestos se verifico en Vizcaya.
      Recursos con Amount3 nulo = 0 significa que el Apex nunca usaria su campo alternativo, asi que la
      transcripcion del rollup es exacta.

      pre-fix -> post-fix -> objetivo cumplido?: los dos campos no se exportaban y la formula del total leia
      0 -> se exportan en todos los eventos, nunca en blanco, y coinciden al centavo con el rollup del
      paquete en 20.828 eventos de dos clientes -> SI.
    notes: >-
