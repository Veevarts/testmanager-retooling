    scenarioIndex: 0
    status: passed
    stepResults: []
    actual: |
      Dos verificaciones independientes que coinciden: el chequeo de paridad del PR ejecutado verbatim, y
      la de QA, que materializo cada CTE de las dos queries con su texto verbatim y reescribio el rollup a
      partir del metodo Apex del paquete (suma de Subtotal_Amount3/Tax_Amount3 de recursos no Canceled).

      Antes del arreglo el export de eventos no proyecta ninguno de los dos campos (el diff solo los agrega).

                                        Long Island                 Vizcaya
        eventos exportados                  16.731                   4.097
        totales en blanco                        0                       0
        eventos desalineados         0 (PR) · 0 (QA exacto)       0 (QA exacto)
        subtotales evento = rollup   9.768.665,66 = 9.768.665,66  24.251.988,89 = 24.251.988,89
        impuestos evento = rollup           0 = 0                 1.566.015,14 = 1.566.015,14
