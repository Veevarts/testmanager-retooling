  - testCaseId: "04485296-f4c6-4e47-b29b-3eb6822efcfc"
    testCaseKey: TC-171
    scenarioTitle: >-
      Resource grain · Items with more than one tax no longer produce duplicate resource rows
    scenarioIndex: 1
    status: passed
    stepResults: []
    actual: |
      El cambio es uno solo: rental_resource.sql deja de unir SALESORDERITEMTAX en crudo (una fila por item e
      impuesto) y la une preagregada por item. Su SELECT final no cambia.

      Items de alquiler con mas de una fila de impuesto: Long Island 0 (y 0 impuestos en total); Vizcaya 0
      (3.890 filas de una sola tasa). El defecto de duplicados NO existe en los datos alcanzables.

      Verificado en vivo, PRE (464c9d8) vs POST (9555d56), fila por fila:
                                                Long Island        Vizcaya
        filas = ids distintos, antes y despues  33.698 = 33.698    16.603 = 16.603
        ids perdidos / nuevos                         0 / 0             0 / 0
        items de una tasa con monto distinto              0                 0
        impuestos PRE = POST                          0 = 0      1.742.350,57 = 1.742.350,57

      El caso multitasa se probo de forma ejecutable en el fixture Docker del PR, que incluye un item con dos
      filas de impuesto: "applies the order discount allocation and every tax on each item once" PASA con el
      SQL de 9555d56 y FALLA con el de 464c9d8.

      pre-fix -> post-fix -> objetivo cumplido?: un item con varias tasas duplicaba su fila de recurso -> una
      fila por item con la tasa combinada (fixture) y cero cambios en items de una tasa (datos reales) -> SI.
    notes: >-
      **PASS con limite declarado:** el caso de varias tasas solo existe en el fixture; ninguna base alcanzable lo contiene. Lo que si se probo con datos reales es que la preagregacion no altera ningun item de una sola tasa, sobre 50.301 filas y USD 1,74 M en impuestos.
