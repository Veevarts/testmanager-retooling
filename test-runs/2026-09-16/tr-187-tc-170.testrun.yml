    actual: |
      Leido de la metadata fuente del paquete Auctifera (Veevarts/AuctiferaDX main @ 8202e19), sin tocar
      ninguna org.

      Rental_Event__c.Status__c y Rental_Resources__c.Rental_Status__c apuntan al MISMO global value set,
      Rental_Event_Status: la afirmacion central del PR es cierta. Los 6 valores que emite la escalera
      existen y estan activos. Ambos picklists son RESTRINGIDOS, dato que el PR no menciona.

      El objeto de ticketing es Group_Reservation__c, no Ticketing__c (ese es el nombre del lookup). Su
      Status__c tiene exactamente Canceled, Pending, Reserved, Sold, Confirmed, Refunded, la lista que el PR
      corrigio. Los valores de reserva (Sold, Reserved, Pending, Canceled) son validos; Finalized no lo es.

      pre-fix -> post-fix -> objetivo cumplido?: el ticket podia recibir valores fuera de su lista o con
      otro significado -> todo valor emitido existe en el picklist de destino con el significado correcto
      -> SI.
    notes: >-
      **PASS sobre la metadata fuente del paquete.** DESVIO DECLARADO: el TC pedia leerlo en un sandbox de trainings; se uso la fuente del paquete, que es lo que se instala en cada org, para no tocar ninguna. Limite: no verifica la version instalada en la org de Long Island. Matiz: el picklist de Group_Reservation__c NO es restringido, asi que los 18 Finalized crudos de antes entraban como valor fuera de lista (dato sucio) y no hacian fallar la carga; los de evento y recurso si son restringidos, y ahi el escape crudo ocurria en 0 reservas.
