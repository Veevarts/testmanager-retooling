    status: passed
    stepResults: []
    actual: |
      LAS CINCO QUERIES EJECUTAN CONTRA DATOS REALES, en PRE y POST, lo que el PR declaro no haber hecho.
      La base respondio hoy, contra lo que dice el body del PR.

      Grano identico en los cinco archivos:
        rental_events_groups.sql     16.731 filas / 16.731 claves
        rental_resource.sql          33.698 filas / 16.484 eventos
        ticketing_only_program.sql   933.506 filas (16.064 de reservas, la cifra del PR)
        ticketing_only_event.sql     206 filas
        ticketing.sql (legado)       933.506 + 206

      Filas que no son reservas: estado de ticket PRE vs POST sobre 1.108.364 ordenes -> 0 cambios.

      Estatico: en el archivo de evento las 10 CTEs quedan identicas (incluida la de IM-1224) y el unico
      cambio ejecutable es el CASE de estado; en ticketing, fuera de ese CASE solo se agrega un LEFT JOIN
      sobre una clave unica; las CTEs de pago son identicas en los 5 archivos.

      IM-774: la expresion de Auctifera__Confirmed_Date_Time__c es identica y sigue leyendo el estado
      crudo, asi que sus valores no cambian; el spec de IM-774 pasa y ningun ticket de reserva queda en
      Confirmed. IM-812: el spec endurecido pasa.
      Suite del repo en el head: 697 passed, 0 failed. Revert-proof con el SQL de la base: 39 tests fallan.

      pre-fix -> post-fix -> objetivo cumplido?: el PR debia cambiar solo estados de reservas -> grano
      identico, 0 cambios fuera de las reservas, IM-1224 e IM-774 intactos -> SI.
    notes: >-
      **PASS.** Observacion de costo, no defecto: cada pieza de la cadena de pagos tarda segundos, pero con el estado evaluado inline la query de evento de MAIN no termina en los 120 s de safesql, por una regresion de plan al expandir las CTEs (PaymentRefunds se referencia dos veces). Es preexistente en main; el PR copia la misma cadena a 4 archivos mas, dos con 933 mil filas. El ETL tolera 30 minutos por request, asi que no se levanta como defecto; se recomienda la corrida cronometrada por archivo que propone el propio PR antes de cargar. Nota de base: el origin/main local estaba desactualizado y un primer revert-proof uso esa base por error; se detecto, se recalculo el merge-base real (8b522c3) y se repitio todo.
