notes: |
  ## Solution understood

  Altru guarda el estado de FLUJO de la reserva en SALESORDER.STATUS y el pago por separado. Antes
  del arreglo, la escalera del recurso miraba solo ese estado y la del evento lo combinaba con el
  pago neto, con una rama que convertia Confirmed, Complete y Finalized en Paid sin mirar el pago.
  A nivel query evento y recurso coincidian, pero el trigger de Rental_Event__c, que no tiene bypass,
  reescribe el evento a Paid tras la carga cuando lo pagado cubre el total, mientras recurso y
  ticket desactivan su trigger y conservan lo exportado. De ahi la contradiccion del ticket.

  El PR pone una unica escalera que prioriza el pago, identica en evento y recurso, alimentada por
  las mismas 4 CTEs de pago en los 5 archivos, y deriva el estado del ticket de reserva de esa
  escalera con una tabla de mapeo. Las filas de ticketing que no son reservas conservan la escalera
  original.

  ## Inferred technical tests

  Ejecutados todos en este run, ninguno manual:
  - suite query-regression en el head y revert-proof con el SQL de la base;
  - los dos registros del ticket, PRE vs POST, por dos metodos;
  - paridad evento/recurso/ticket en todas las reservas, incluida la simulacion del trigger;
  - matriz de brazos sobre datos reales y tabla de verdad sintetica para los brazos ausentes;
  - grano de filas de los 5 archivos e invariancia de las ordenes que no son reservas;
  - chequeos estaticos de alcance del diff, identidad de CTEs e IM-1224;
  - contrato con los picklists desde la metadata del paquete;
  - regresion de seguridad y OWASP Top 10.

  ## Hallazgos que conviene leer antes de cargar

  1. El ticket habia cruzado los numeros de orden de sus dos ejemplos; confirmado con datos.
  2. El body del PR dice que la base es inalcanzable; hoy respondio.
  3. Dos reglas de producto requieren el visto bueno del reportante: Confirmed a Signed Contract
     (226 reservas) y reembolsada no cancelada a Paid (66, depende de Manage_Status_by_Payment__c).
  4. Costo: regresion de plan preexistente en main al evaluar el estado inline; el ETL tolera 30
     minutos, pero conviene la corrida cronometrada por archivo que propone el PR.
  5. Queda la brecha residual post-carga que ningun escenario de query puede cerrar; la consulta de
     aceptacion del PR debe correrse despues del load.

