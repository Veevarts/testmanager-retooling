title: >-
  TR-187 · IM-1227 · TC-170 · Rental status payment-first ladder — 5/5 PASS. Evento, recurso y ticket
  exportan un unico estado por reserva: 9.868 reservas de Long Island con evento y recurso
  contradictorios tras la carga bajan a 0, y las cinco queries se ejecutaron contra datos reales,
  cosa que el PR no habia hecho.
status: completed
environment:
  name: >-
    Base Altru de Long Island Children's Museum via safesql (qa_longisland,
    migration-db.rtl.veevartapp.com), solo lectura; las unicas escrituras fueron tablas #temp de
    sesion. Queries de Veevarts/MigrationToolETL en un worktree aislado: base real 8b522c3 (IM-1224)
    contra head 464c9d8 del PR 180. Metadata de Salesforce leida del paquete
    Veevarts/AuctiferaDX main @ 8202e19, sin tocar ninguna org.
  buildVersion: >-
    Mixed — SQL-only (5 queries de extraccion) + specs de contrato + doc. Sin codigo TS de runtime ni
    dependencias. PR 180 abierto contra main; el PR 181 (IM-1228) lo contiene y el veredicto queda
    atado al commit 464c9d8.
